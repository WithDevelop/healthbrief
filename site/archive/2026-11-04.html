:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

fs": ["dh-hanmi-epiday-llm", "dh-nhis-ax"]}, {"head": "병실 비전 AI가 병원 운영 소프트웨어와 묶입니다", "body": "린타스는 룩딥헬스 인수로 병상 카메라 기반 가상 간호를 운영 플랫폼에 결합했습니다. 낙상·투약오류 감소 수치는 아직 회사 주장입니다.", "refs": ["dh-leantaas-virtual-care"]}, {"head": "식약처는 규제 외교와 신속심사 실적을 동시에 쌓습니다", "body": "ICMRA 정상회의 서울 개최와 GIFT 53호 반라피아 허가가 같은 날 나왔습니다. 다만 반라피아는 eGFR 차이가 유의성에 못 미쳐 급여 심사가 쟁점입니다.", "refs": ["reg-icmra-seoul", "reg-vanrafia-approval"]}, {"head": "중추신경계 유전자편집에 초기 자금이 들어옵니다", "body": "스페시픽 바이올로직스는 C9ORF72 ALS 편집 치료제로 3,500만달러 시리즈A를 마감했습니다. 효능 근거는 아직 전임상입니다.", "refs": ["bio-specific-biologics"]}], "priorities": [{"head": "기술수출 계약의 로열티·고정지급 재구성 가능성을 점검합니다", "body": "상업화 중이거나 근접한 파트너 계약을 대상으로 LG화학 사례처럼 확정 현금으로 바꿀 여지와 그 대가를 따져 봐야 합니다.", "refs": ["bio-lgchem-rhythm", "bio-alteogen-q3"]}, {"head": "EHR 내장형 AI CDS·기록 도구의 검증 기준을 마련합니다", "body": "메이요 CDS와 LLM 퇴원요약 연구는 도입 효과와 오류 위험을 함께 보여 줍니다. 사람 검토 절차와 성과 지표를 먼저 정해야 합니다.", "refs": ["ai-mayo-cds", "ai-llm-discharge-summary"]}, {"head": "필수의료 수사 가이드라인 최종 문안을 추적합니다", "body": "응급실·중환자실 압수수색 제한 범위와 시행일이 확정되는지, 의료사고 형사 부담 완화 입법과 연결되는지 확인해야 합니다.", "refs": ["reg-er-investigation-guideline"]}, {"head": "약가 개편과 공청회 의무화 법안의 일정을 함께 봅니다", "body": "제네릭 약가 개편안 행정예고와 복지위 법안소위 상정 시점이 겹치면 개편 속도가 달라질 수 있습니다.", "refs": ["reg-drug-price-hearing-bill"]}, {"head": "미국 CDMO 재편 속 국내 위탁생산 수주 전략을 재정비합니다", "body": "론자의 미국 설비 인수와 삼성바이오로직스의 장기 계약은 미국 현지 생산과 장기 물량 확보가 경쟁 축임을 보여 줍니다.", "refs": ["bio-merck-lonza-cdmo", "bio-samsung-cmo-4343"]}]}}, "archive": [{"label": "제16호", "date": "2026-11-04", "count": 20, "current": true}, {"label": "제15호", "date": "2026-11-03", "count": 21, "file": "https://drive.google.com/file/d/1iG2Z6Ghk3kqrwi_A7h1Sk1XRbsfBEl8k/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제14호", "date": "2026-11-02", "count": 20, "file": "https://drive.google.com/file/d/1_zbZbJXvsQwq5P54PjPtWoVdvH2MLQZj/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제13호", "date": "2026-11-01", "count": 17, "file": "https://drive.google.com/file/d/1nYrRBg9zN2iEgTKezyD0VQi3 , "date": "2026-10-20", "count": 30}], "items": [{"id": "ai-ge-vscan-air", "cat": "ai", "title": "GE헬스케어, 휴대형 초음파 ‘Vscan Air’에 FDA 510(k) AI 2종 탑재… 비전문가 폐 초음파 진단 품질 95.2%, 전문가 96.8%", "short": "GE 휴대초음파 AI 2종", "alt": "여덟 구역으로 나뉜 폐 모양 빛 위에 놓인 작은 무선 초음파 탐촉자를 그린 미니멀 일러스트", "date": "2026-11-03", "scope": "글로벌", "entity": "GE헬스케어(GE HealthCare)", "what_changed": "GE헬스케어가 무선 휴대형 초음파 Vscan Air에 AI 기능 2종을 추가했다고 발표했습니다. ‘Lung Guidance’는 표준 8구역 폐 초음파 프로토콜에서 탐촉자 위치를 실시간으로 안내하고, 영상 품질 기준을 충족하면 클립을 자동 저장하며 B-line 검출·점수화를 지원합니다. ‘AutoAS’는 Vscan Air SL로 얻은 표준 2D 심초음파 단면 2개 이상을 분석해 중등도 이상 대동맥판 협착 가능성을 신뢰도 점수와 함께 제시합니다. 두 기능 모두 미국 FDA 510(k) 허가와 CE 마크를 받았으며, 유효한 Innovation Package 구독·라이선스를 보유한 기존 고객에게 11월 말까지 업데이트될 예정입니다.", "why_matters": "현장진료용(POCUS) 초음파에서 AI가 영상 획득 안내와 판정 보조를 함께 맡아 비전문가 사용 범위를 넓히는 흐름을 보여 줍니다. 회사 검증에서 비전문가의 진단 품질 영상 획득률이 95.2%로 전문가(96.8%)와 비슷했다고 밝혔습니다.", "strategy": "하드웨어에 AI를 구독형 소프트웨어 업데이트로 얹어 설치 기반에서 반복 매출을 만드는 전략입니다. 폐·심장 판막처럼 1차·응급 현장 수요가 큰 적응증부터 공략하고 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.auntminnie.com/clinical-news/ultrasound/news/16349404/ge-healthcare-gehc-adds-lung-aortic-stenosis-ai-tools-to-vscan-air", "verified": "원문을 직접 확인했습니다."}], "verification_note": "전문지 AuntMinnie 기사(11월 3일)로 확인했고, GE헬스케어 보도자료 원문은 찾지 못했습니다. 95.2%·96.8%는 회사가 제시한 검증 수치이며 연구 설계와 표본 수는 공개되지 않았습니다. AutoAS의 정확도 수치도 기사에 없습니다.", "image_concept": "A small wireless ultrasound probe resting on a glowing lung-shaped outline of eight softly lit zones.", "img": "data:image/webp;base64,UklGRuYgAABXRUJQVlA4INogAAAwiwGdASqwBCADPpFIo0ylq68rIbQoOeASCWlu7sH//QhokwtL32BM+2RHQTuyiY+R92DpDkZ7y3+h5U/INfUTMwV8/dESXXOf0EWVNjkMICDkYBR66msILjMo65D26prJv4W4Dsx55M0ma7M0E9i0ttCBMn9udktcxiQfTIIL/GniRNBrHGyhOysKjo2XP6X25WHMCT6vCC4mlGTJrF2M8PCA8dr4qElYIvM5ges9jNFF5/VkxUZ9bzPk10FID0gwU3U9HAvZ4tDU4LLcg63iCGwedEmo3+Xy8nOuM7JlOR/hji3gzOoYWyrkDHzy8uXalbEwOTL8V2wfEtLtg+GUgi94bUKiqu437lzx1NTcPgRDpi2mW/I0eg1V59oE0odrl9xdTH3y+gsB/6Yiizy8ZADyyPIRqahPXhGFni0ZO+EeApV1p1DDc+W79GHmk+/6r8tki2g62PWb ed": "검색 결과 스니펫만 확인했습니다(본문 미열람, 접속 시 403 오류)."}], "verification_note": "메이요클리닉 뉴스네트워크 공식 글은 접속이 차단되어 HIT Consultant 기사로 내용을 확인했습니다. 가격, 사용자 수, 연동 EHR 업체는 공개되지 않았습니다. 이 도구가 FDA 의료기기 허가 대상인지는 확인하지 못했습니다.", "image_concept": "A slim stethoscope coiled around an open book whose pages turn into a softly glowing chat bubble.", "img": "data:image/webp;base64,UklGRnY7AABXRUJQVlA4IGo7AADQ0gGdASqwBCADPpFIoUylpCqrITEIqWASCWlu+DWb/rKAeyMrP9IfbYGfP2TLofVfOMfq97f0L/q6YOcx2thBYOf+l66/LS6SH9o9HnnMWNhk4/pvzk+db7fvCfM+DGzsc/dQjFruQ92/5voU+9Oef9B5z/2fqAee3fzUB/1B6xX+35eRm4D6apdVP7HTVLqp/Y6apdgNeuQMpqp8ULNg+mqXViqWRq0PpqsPerPu5WY+X69m7fqqqHwcnqBW9n3t4ddJ0qd2TOmqXc+hB+eg+lBtzI1dBGddbqC33281wFU226I6gSFmwdPFnTQpPO7gfTVUyhuph9mzPt2ODkDKgW9X3mU2e90Aql6wVzVTOiRTTttGZ66bP0gc5s7sGGlPzCyBlNgNeWYu691Mg3mAMuqofa8StkGqnxQs3yiyBqGoXJsHT2eLVT4oVwhNjqJUx7ghb0UXNNF1ODJLktNUunbVRJasSQ+mqXZ70+LM101M5c67sNHo/G8dE1BZrZUTWiZZsH00Ml9OplgZTVLmb6t9Bv+r3iqXVT4mvYahX/qwy/1Mqm8pqmxLR/9A3mwfTVLg2SvYAFinamDm9PihZq6HshyYNllQEmzdAWF6+LzdeG52Y3haMWbXccOvADr3qBggSd696fFC01jLtbRRZb6L3+yXSiuVF12kuqvpqlwfFeuSn+EHPvT4m0ma+qfL2sKaqfFnaVNPuxSpa0dy+ndsg6gXsLgVW/cboR+WD101ZK1g4lv1VV3cPC0p3wNll45LTnahp9xCEjUpG7TQ1msJLq41CiwsbVhphZJ2cq71dHAjWj39ROi2GgimAtJbAuHVO2qXVV32paUO55dBlNW09rlD1A4yf/2durLZa6OhM6Em/1VUfqiX/bBTm0Zf9GcjJGSbjuEQLN/G5i1SvOSoYJj1Ay71l61CmqnxQs2D6aGTZse+A8fQWAXlSDWFP21ktAf/jnXDLJNJSKNuEe8XuCFZ7w4l0K8dKnS9nHU/3ju5vT4Uy5Yufr4rnkvdFHY4Zql1U+LM101V/VctJcqk2sZ2ZGfigdqvPwELkDgOrMbPXAJTgHTLTpOXLwNJ1NmmdtU7/Ix5F6tdpmtQsBriJfSgAH8TAyfVB00Ihadpzd5yZHN2FaioLVV06PKERd9AiksQtBgfTVLqqiDxCV3hwuJuLFvGUPYI7B9NUuvGym0l5zMAzL+4dah2jwHHAbXqTLwEjx5PFE8u4gPpOlWeM4AzxWVnfmIAiY97qnxQs2sKadp/GnhvrmtiFWVVkAVNgE+Y0e/itOEadTrLL6oNJ4iJ5VSU6m2+tvOVH9EOym60auyIlBCWzPQSqXfUy1fq51if52JLnUZQCwpfCcOQwssYxblYRWlV2YiqToqrk77Ok6lMUkFp+8gnglEjKXBxoZL6TkkQEwi0l5nXkd9aeXzj/V2c8L09NT1zNQw1haU+ln+MC/YqkqBmDNlWXRZkP1YPlf5mWumN9Hoxu8yGcxBXBTVT4V+P5lNO0uWpnQn0+mYc/KGA4nKu9pQHeM4QntbxW7JWtnKWbs+G0xrsZgiI+N5/MgNx17ONW38S6avE3FAAPpP5HI9UHSdJK8IGV82FJImy2yehBgb : "https://www.lunit.io/en/media-hub/genesiscare-uk-introduces-advanced-ai-software-technology-to-support-earlier-breast-cancer-detection-and-reduce-unnecessary-worry-for-patients/", "verified": "원문을 직접 확인했습니다."}], "verification_note": "11월 2일 루닛 공식 미디어허브 게시물로 확인했습니다. 계약 금액과 기간은 공개되지 않았습니다. 13.8%는 이번 도입 결과가 아니라 기존 실사용 데이터를 인용한 회사 수치이며, 재검률·위양성 감소는 수치 없이 서술만 있습니다. 해외 사안이지만 국내 기업 소식이라 국내로 분류했습니다.", "image_concept": "A single magnifying lens hovering over a layered translucent fabric, revealing one tiny bright dot hidden in the dense folds.", "img": "data:image/webp;base64,UklGRvxCAABXRUJQVlA4IPBCAAAwAgKdASqwBCADPpFIn0ylpCooIhHY2UASCWlu3IrWX0XFn+y7iqqzDY1SZV+86erOzVfB2wgqfQfsnXRt+YZnzh7XikC5jh4+w3G/0JLS4hy9pZrnXi1Mqu6Lt/V248At9vaF4oeJ/9b0beHDjy/lB15BU5tdwHoXyCpza7gPQvkFTm13AehfIKnNruA9C+QVObXdKQqAh5EuRgIC1u+mCyuIPtMI1dwsQ/OXzU6kibOoyuLVcNP1y5tdy2EyNts7U46P0QF9lylhK1KEvPANIIaZ8XFruA9sWgCX+SI97ltKNRI6kiXy0AeyHvElquGmfJRpplaIRMNL6nNr1QfFohLtWS28JG0ABgsuLULgHoX7+Aeix8mQAEVfIaZ8MvkFTm13AekTdvkFTn/cLK4tV2zaO1jwVDm0TdCMA9B2mYILLANwy+QVOH+5IMzy4UHkfyLfHHH65AtUFTn/hl8csmsbGLuA9B7287HvcAwWTLyS/fwDpWVxar6sR9oucCK1qu4D4exrzAE4ZfIaCg2wzAaHUArY3fmmHC2Gt4DpWVxah52PzanZXh0rLFHza7gPRibwU2dxbC4sZfngWeMXkp+Hd52xvVwrvotjQAU2dvnStShcVQodvO2Mu4E/o2rckTN/mFaSJe7Q5tbW+ayUEjrtu8OqLi1XDTPyEPOAajEqN1aDQivUChxa7g7vJBZWlO4LBKXJL5AqXaitJEuRhqHnAehfLQHfCp8SJfHGGIxl3AejGXcB0p2jAvxl123b5BUsh04srIXYJ0bPFYdjfSBFjw0oYEyYaQAJ9ZJr56bU6h7lLKbuP+Eq5NZFbcnabsCdtvq7Di9UfDo2qsx1CitZEteOyqPDRZ28NjGsP9xl+M+s2v6VGz/5XDWL7mZdrIdvI5zEOAZuT0sSFN4lLaeGcsDEeif8aA9C41m5nwx7FGTjjXqg9C5E3ZypsvkGSz4k6HBYMoXnR+I1pq2bfaiKK6k6ff5wDTv0VKt4jVWu2H/0UhFz0ftdaVFKRSdZH7csZU2TzJ+UlmBiYeg3dHUB0xIx9PrKe/S8/MLLY7aAk3oxKjfMe3u0ObW22dqgrTFqvQXy5H7Mjr8wFxeakxkYIUGcckTrDKLNqzQnU15KSDa13E3qmZQL0pDzshDXAXFnqTARo3gPqYBd4EpgGRC4UXra3b0lvQS9J8g7KzRA40AI6dsVObaYSOpIj2KGTWou4BnaoKnNnGzpKmU47uhY+qbPFVEcLSVWcLBMaw/46md0OJdudC6P+VTRqA2j81IP+/WmWuuIWeED26I1vs6Sr/OLwgpGPDvEc9QRi7JnX35WvIniKeXz+lw0FCF8gqc2u4D0HsWTHVBpnwy+QIpQ36dZfZjJ5uklbLAXAP4ZFVr620Y , "why_matters": "퇴원요약은 병원과 일차진료를 잇는 핵심 문서로, 작성 부담과 정보 누락이 오래된 문제입니다. 두 방식 모두 오류가 있었고 추정 위해 심각도·가능성에는 통계적 차이가 없었다는 결과는, 도입 시 사람 검토를 전제로 해야 한다는 점도 함께 보여 줍니다.", "strategy": "생성형 AI가 진단 보조를 넘어 임상 문서화로 확대되는 흐름에서, 요약 문서를 받는 의사 관점의 품질 평가를 근거로 삼은 연구입니다. 다만 단일 기관, 60건 규모라 일반화에는 한계가 있습니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://news-medical.net/news/20261102/AI-improves-accuracy-and-completeness-of-hospital-discharge-summaries.aspx", "verified": "원문을 직접 확인했습니다."}], "verification_note": "News-Medical의 11월 2일 보도로 확인했고, npj Digital Medicine 논문 원문과 DOI는 검색에서 찾지 못했습니다. 사용한 LLM의 이름과 세부 연구 설계는 보도에 나오지 않습니다.", "image_concept": "A neatly folded hospital discharge envelope sealed with a small glowing circuit-patterned wax seal.", "img": "data:image/webp;base64,UklGRlAnAABXRUJQVlA4IEQnAABwhAGdASqwBCADPpFIoE0lpCoooJDYYUASCWlu3NFp0+l+/1jvafYNXT+rbgeo20uVf8umV6uNlpdOvcfeTMcRQj//st9C6D9M+3P51nTrN2oybL3V6fThRnK81+pXGRDTZcH5Don41HEgK6swpcKxMWztmMAuGWOgIrItsxgFwx1fSpOW2YwC4Y6z3ZGAXDAZQbsAuGPK5pVkycNaL3KACqrXrTAw2zxWSgVE3qR6MuJcdplSry2Jtv9rLesuBew0zuLnvFqP3xS61UpuT7cjVE/n6SNey9UpKRuxOcGhr1OVDB+sRLj5BWWIyRKAGmGUR+9qjyvom5edwQdswgObMk51VZZGtOEvrJjG69e90jyb1P1qF+rUM4PIH1On3LDZJbZjALhlDnofcgdG9gqSDiUt5BYkAjkvy7FxSjUlkXz2NP81Jb48LmffLWPGvjZ5bsSMM/acskhlbsUIksW1rUOMsdyCyymMgXT7vt9Y1EN7lB4rK6CaOIPcaf9IImR4MSGYwNJAiwC7zxxoYmAizAUtsRp32CoRRlj3II8gM6i/ATcMBKkQwhllir33ZwNw7KpGEMeVkTpLerjSLQbcd1BSug+OnWGn/ziWWKsGfJvP80Wh8WwgpewNQWiWzK2+yxO/cfhvFLrPRFzvnWToRfci2cMcUceVQYMxcHnj7YTuCGOraL0JIfkYBnKqaE4qpEDzn7X7VfSaxjux5wxti1tTipvfJbTDLef5qYqN7AErMELAfD+Isv6X/9S/2tbTLaoL/7Tvi24mbBNfmjGfLujtLIAHa+J31s1yZDAJeqmb7nPTuR1U5a1TULkcTtPRRfQ0bKfdtE3WXDnuf8sDzPX3Ca6wABzPlpUuy44LHjFSxer9GNovUPb1ipMfht+OO20ArqAibGqkNmoMcp2Kvx2tfoe8rpzSArdxLjFrT5zDbGl3rMqLjKGIQtKBmxksy+6Swt1BdbHqUYo9nPqtulmKaQIx+RLg8uePVwx1bKCl7BJtAUqt4c6GtGsPDRBfIdaaMGjthpzUzabSO2TIFsgU/2VdEjXvjrGUoJaGw14kgNV+TeqC5HED2US8sUsAy4q/HRmls3Isc61yld8G+HnqsQvphmmu9uBLR2flKBcJncbpGF7JICBCu26/NSW2Ywv6kgC8WgGsnO8DMTh6CQyCqQdXcCcqMi/60L9Jpb4vY ezRu7Sj8I7SBUXdOyBL6MSQbFol0d1YpYRhQB2QAmENVKRzNJqBqJDM6QkXLvY43NEE9GZsTTeEdj6dQZdMea1ewSWjnhg8TAoCGAoYI8urdkmM6XQAFK2gpEajcSC8IoAAG8gTjseNcTxiE6SPF4YJdgAcaZBbfWLzQsQoiqK5IXBe1W38OZ1gynYqyYTcmuCxkykhJQOAB6poMlmx0glY1KOXuc8oUxcVYANtFN4M4rZT5wd9cEQ1glYpttbU/Ci+M1JZPaXLLJDuqIDi5h84nXG9IYFHrmhjFhVUZQpYJfHvuOQPkd114wNB9iCeCQAA=="}, {"id": "reg-vanrafia-approval", "cat": "reg", "title": "식약처, IgA 신병증 신약 ‘반라피아’ 허가… GIFT 53호 신속심사, 36주 단백뇨 38.1% 감소했지만 136주 eGFR 차이는 유의성 미달(p=0.057)", "short": "IgA신병증 반라피아 허가", "alt": "맑은 물은 통과시키고 단백질 구슬 몇 개만 걸러 내는 콩팥 모양 유리 필터를 그린 미니멀 일러스트", "date": "2026-11-03", "scope": "국내", "entity": "식품의약품안전처(의약품허가총괄과), 한국노바티스", "what_changed": "식약처가 11월 3일 아트라센탄염산염 성분의 수입 희귀의약품 ‘반라피아필름코팅정0.75밀리그램’을 허가했습니다. 적응증은 요단백/크레아티닌 비율(UPCR) 1.5g/g 이상인 성인 원발성 IgA 신병증입니다. 이 약은 2025년 7월 글로벌 혁신제품 신속심사(GIFT) 제53호로 지정돼 신속심사를 받았습니다. 엔도텔린 A 수용체를 선택적으로 차단하는 기전입니다.", "why_matters": "보도에 따르면 다국가 3상 ALIGN 중간분석에서 24시간 소변검사를 받은 270명 중 투약군은 36주 시점 UPCR이 기저치 대비 38.1% 줄었고, 위약군은 3.1% 줄었습니다. 반면 1차 분석군 340명에서 136주(투약 종료 4주 후) 시점 eGFR 군간 차이는 통계적으로 유의하지 않았습니다(p=0.057). 단백뇨 감소 근거로 허가가 나온 만큼, 급여 심사에서는 신기능 보존 근거가 쟁점이 될 가능성이 큽니다.", "strategy": "국내 IgA 신병증 치료제 시장에 새 기전 경쟁약이 들어왔습니다. 같은 회사의 ‘파발타’ 등 경쟁 품목과의 급여 순서, 그리고 eGFR 장기 데이터를 심평원이 어떻게 평가하는지 추적해야 합니다. GIFT 지정부터 허가까지 약 16개월이 걸려 신속심사 제도의 실제 소요 기간을 보여 줍니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50468", "verified": "식약처 보도자료 게시판에서 등록일, 제목, 담당부서를 직접 확인했습니다. 본문은 첨부파일에만 있어 열람하지 못했습니다."}, {"url": "https://www.nursenews.co.kr/news/articleView.html?idxno=46075", "verified": "원문 기사를 직접 확인했습니다."}, {"url": "https://www.dailypharm.com/user/news/343122", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "식약처 보도자료 본문(PDF)은 열람하지 못했고, 임상 수치는 간호사신문 보도를 따랐습니다. 수입사 한국노바티스는 데일리팜의 허가 전 보도를 근거로 적었습니다. 데일리팜은 위약 대비 감소율을 36.1%로 썼고, 이 기사는 기저치 대비 38.1%(위약 3.1%)로 적어 기준이 다릅니다.", "image_concept": "A single kidney-shaped glass filter with a few protein beads caught in its mesh while clear water passes t "id": "reg-drug-price-hearing-bill", "cat": "reg", "title": "최수진 의원, 약가제도 변경 때 공청회 의무화 건보법 개정안 발의… 등재 절차·상한금액 직권조정 바꿀 땐 사전 의견수렴", "short": "약가개편 공청회 의무화", "alt": "공고 게시판에 꽂힌 약국 가격표 앞에 빈 의자 하나가 놓인 미니멀 일러스트", "date": "2026-11-03", "scope": "국내", "entity": "국회 최수진 의원(국민의힘), 보건복지부", "what_changed": "최수진 의원이 국민건강보험법 일부개정법률안을 대표발의했습니다. 개정안은 복지부 장관이 약제의 요양급여대상 여부 결정 절차·방법이나 상한금액 직권조정의 사유·절차·방법을 바꿀 때 사전에 공청회를 열어 관련 단체와 전문가 의견을 듣도록 의무화합니다. 대통령령으로 정하는 경미한 사항은 제외됩니다.", "why_matters": "복지부의 제네릭 약가 개편안(계단식 약가 구간 축소 등)을 두고 산업계, 노동계, 시민단체의 반발이 이어지고 있습니다. 개정안이 통과되면 약가 제도 개편 때마다 법정 의견수렴 절차가 생겨 정부의 개편 속도와 방식이 제약을 받습니다.", "strategy": "데일리팜은 제약업계가 예측 가능성 측면에서 기대를 나타냈다고 전했습니다. 복지부 입장은 아직 확인되지 않았습니다. 복지위 법안소위 상정 여부와 제네릭 약가 개편안 행정예고 일정이 겹치는지가 관전 포인트입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://dailypharm.com/user/news/344099", "verified": "원문 기사를 직접 확인했습니다."}, {"url": "https://dailypharm.com/user/news/344141", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "국회 의안정보시스템 원문은 확인하지 못했고, 데일리팜 보도를 근거로 했습니다. 공동발의자 수는 확인하지 못했습니다.", "image_concept": "A pharmacy price tag pinned to a public notice board with an empty chair placed in front of it.", "img": "data:image/webp;base64,UklGRvovAABXRUJQVlA4IO4vAABQnAGdASqwBCADPpFIoEylp6orITD40WASCWlLKr6+nZjX4SQRwKvhncfI5rNAy6Q9mb8aWb4p/yZH8bTz4+kc9OyV6gdwh5m/OH88iH2/D+pR3FfoH2q9sPAOe3sd2rd4Q5YjxZPufqBfzH+1+khqBl3Hl+QOmJV+hyJiZcTQuRMSrsck5QNQBB6wkoG2uDrllA1AEHq+/I6fCh/MThPUhaA6jjAXCigCJ460mfcIagFSgJGKTz5uQNQEy3wZqDh3tJ7P+8CO1V6SGb64U0cGS0z7fkNAGRTskXLKBn8xMsGv+s5WGZx5lFaWtn363fnf+u0vrRiLwHWCApX4uA4y3EHq/CQ16XLQsNuLRqA8uWUDgG8lE5SsUUAQer7/rMxziqTIC6JAPyO59VM/mwpCz+f5zhePeBW+rg9X3/WMgg9iTwZZIlb/fGoAP1MbO63oJ58fx5EIiGoKldkZ8DygagBAdPNleLRsghM1wJRAEGyvL9yIHSr7/bWoiHhOCpUhZ9tzA8tp7blXn8zGMy1vAO5DhR6+oT4jHl+PWZigggafz2wlGPL8entxB6vwkOc77z2vhQuCuvSEG38I5fj1nKwU1cHq/czzajV96P49Zh6ZblhvyPtUwsZmwqSpCH/5DV8dtSSLlfJCe4TXaDTolLAUwysU7pSq18aMyjC6K50gp1wIf3vm5ZFqdd2jsiLU68OPwaahN85pvc5b36tbwagW5MKIssc0bMSZ9YGGTBVrcTPRavGYKJwVMH6obxDZjMBXgPU  5일 정기총회이며, 기간 중 주요국과 양자회의도 진행합니다. 30개국 규제기관 대표가 참석하고, EMA의 Emer Cooke 사무총장과 PMDA의 Yasuhiro Fujiwara 이사장도 포함됩니다. 의제는 규제 분야 AI의 글로벌 동향과 이행 전략(식약처·HSA 공동좌장, AIRIS 2026 연계), 새로운 접근법(NAMs)과 차세대 규제 프레임워크, 환자 중심 의약품 개발입니다.", "why_matters": "한국은 2026년 9월 ICMRA 집행위원회(2026~2029년) 회원국으로 선출됐고, 이번 행사는 선출 후 국내에서 처음 열립니다. 규제 AI와 동물대체시험법(NAMs)은 FDA와 PMDA가 최근 지침을 잇달아 내놓는 분야로, 국내 기업의 해외 허가 전략과 직접 맞닿아 있습니다.", "strategy": "오유경 처장은 이번 행사를 국익 중심의 전략적 규제외교 장으로 삼겠다고 밝혔습니다. 양자회의 결과로 상호인정이나 협력 MOU가 나오는지, 정상회의 공동 성명에 AI 심사 원칙이 담기는지 확인해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50467", "verified": "식약처 보도자료 게시판에서 등록일과 제목만 직접 확인했습니다. 본문은 첨부파일이라 열람하지 못했습니다."}, {"url": "https://www.ksw-news.com/news/articleView.html?idxno=3055793", "verified": "보도자료를 옮긴 기사 원문을 직접 확인했습니다."}], "verification_note": "같은 기사 안에서 ICMRA 회원 규모가 서로 다르게 적혀 있어 회원 수는 쓰지 않았습니다. 정상회의 결과물은 아직 나오지 않았습니다.", "image_concept": "A round conference table seen from above with thirty identical empty chairs and one glowing circuit-pattern place mat at the center.", "img": "data:image/webp;base64,UklGRv49AABXRUJQVlA4IPI9AABQzQGdASqwBCADPpFIoEylpC2rIPMokbASCWlu4IN9talREm/14TOfKjFvrd8H+4RuMooc53/R8uLP7Tecbyv/l+LPoI+bTSnGbU7+a/nDOb/gd+fzT1BfzX+u/8Df6bZ/+H1C/df735jf03m5+7/7f2A+Df9Z9gT+Zf5/0adA36V/vvYQ/ZHrt+lGEbE193WDxtR7ur2il/PkunHyXTj5Lpx8l04+S6cfJdOPkun4khSSrrudvfRl5+0Uv8dwTHNeKy0wunFYIyZH1XunHyyt11lL8skQFRX+fdzIxyyMfBcF1J6SvZUkpdB3uRc3uOjEp/oyblOokzPz5LpqyQouBrUDJJ/V4r/ClPH/dVDVoSZEo/9Vopfz6tabsPdyNBMtE6pmdUin14G5SjDWpLPywwACJS/LJCRBok2AZAg4nHyXQ6cj/nd6JR8Fz47MEjTMGqanoSF5fqm1Hu5We6OS6cfKfpfk0IsuEInToathSOSJICkp9FRWUugJIIxbz6vEcIpflkp6JTWCCg5NvNDHJUHDPd9S9B8Ou6X7oYJlHJUtdp8Akb2Et/VaTHHrlHZjswoMm3mkmqOqXxuVx146FYKSRyMbbMTG0CBpv/4mL8jegYa4lID8M6eR9QYwP+Q2cMzIlLpZx0IlL+hdopdNelW+4baYrrqF047DZTaYSBHdhjJr5yL7VH+8u6tQzLPSXf/f/5Gtt/xZhPng9JnMI0fKLiHi7CrzlrhyRbop27ey87A6HQg6xsIlXKdc8SmBzQDtFMJ+QEf5sVqFsxkt59//Tolv3XfeS1RiqGqwMl//6hVHmLMtidedhtRASC7VexV9EMFhclx8LjCyfvQeF+917lTmGCV5qyXCBtiTUib toABSn5FnTnazGxFpAAAAAU8AxxkqoUlWvbPMagm/keib5OfwqRaXl2L7zkQ20DonjbJKeyCq0iWgeiVqutcqAAAA=="}, {"id": "bio-merck-lonza-cdmo", "cat": "bio", "title": "독일 머크, 미국 CDMO 사업을 론자에 매각… 5개 사업장, ‘수억 유로 중반대’ 금액으로 2027년 중반 거래 종결 예정", "short": "머크, CDMO 론자에 매각", "alt": "윤이 나는 회의 탁자 위로 공장 열쇠 꾸러미가 건네지는 장면을 그린 미니멀 일러스트", "date": "2026-11-03", "scope": "글로벌", "entity": "Merck KGaA(독일 머크), Lonza", "what_changed": "머크 KGaA가 라이프사이언스 부문의 CDMO 사업을 론자에 매각하는 확정 계약을 체결했다고 11월 3일 발표했습니다. 매각 대상은 미국 캘리포니아 칼스배드, 위스콘신 매디슨·베로나 사업장과 미주리 세인트루이스·인디애나 인디애나폴리스의 바이오컨쥬게이션 사업입니다. 가격은 ‘수억 유로 중반대(mid-triple-digit million euro)’로만 공개됐습니다. 바이오릴라이언스 위탁시험 사업은 매각 대상에서 빠집니다.", "why_matters": "대형 소재·장비 기업이 위탁생산 사업을 떼어내고, 론자는 미국 내 생산능력을 인수로 늘리는 구도입니다. 미국 현지 생산 수요가 커지는 가운데 바이오컨쥬게이션(ADC) 같은 복합 모달리티 설비가 CDMO 간에 재편되고 있음을 보여 줍니다.", "strategy": "머크는 혁신 중심 사업에 포트폴리오를 집중하고, 매각 뒤에도 론자를 포함한 CDMO 고객에 소모품·기술 공급을 계속한다고 밝혔습니다. 론자 CEO 볼프강 비난트는 핵심 시장인 미국의 생산능력을 추가하는 거래라고 설명했습니다. 거래는 규제 승인 등을 거쳐 2027년 중반 종결될 예정입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.manilatimes.net/2026/11/03/tmt-newswire/globenewswire/merck-kgaa-darmstadt-germany-to-divest-cdmo-business-to-lonza/2460273", "verified": "GlobeNewswire 보도자료 전문을 재게재한 페이지에서 원문을 직접 확인했습니다."}, {"url": "https://www.globenewswire.com/news-release/2026/11/03/3393912/0/en/merck-kgaa-darmstadt-germany-to-divest-cdmo-business-to-lonza.html", "verified": "검색 결과 스니펫만 확인했습니다(본문은 접근 차단으로 미열람)."}, {"url": "https://www.biospace.com/drug-delivery/lonza-agrees-to-buy-5-merck-kgaa-facilities-to-accelerate-us-expansion", "verified": "BioSpace 딜 목록에서 제목만 확인했습니다(본문 미열람)."}], "verification_note": "매각 금액은 보도자료에서도 ‘수억 유로 중반대’로만 표현돼 정확한 액수는 확인되지 않습니다. 업계지는 약 1,100명 인력이 이전된다고 보도했으나 보도자료 본문에서 확인하지 못해 본문에 넣지 않았습니다.", "image_concept": "A set of factory keys being passed across a polished boardroom table under a single overhead light.", "img": "data:image/webp;base64,UklGRsgkAABXRUJQVlA4ILwkAAAwiAGdASqwBCADPpFIo0ylpD+toTJYY/ASCWlu++M4NOcYJ+Dd/0dsl5KGkhMAzqR/6Gfd+BUVr8oTjztnvjnX716x8/0B5jv 은 이미 2025년 연간 실적(매출 2,159억원, 영업이익 1,069억원)을 넘었습니다.", "why_matters": "플랫폼 기술수출 기업이 일회성 계약금 대신 상업화 제품의 판매 마일스톤과 로열티로 이익을 내는 단계에 들어섰음을 숫자로 보여 줍니다.", "strategy": "실적은 MSD 키트루다 피하주사(SC) 제형의 판매 마일스톤과 로열티가 이끌었습니다. 키트루다 SC의 1~3분기 누적 매출은 14억2,000만달러입니다. 3분기에는 8월 비공개 글로벌 제약사(최대 3억6,500만달러), 9월 노바티스(최대 32억2,300만달러)와 플랫폼 계약을 추가했고, 하이브로자임 플랫폼 계약은 3분기까지 4건, 총 최대 44억5,200만달러입니다. 대전 둔곡지구에 2,532억원 규모 생산시설 투자도 진행 중입니다.", "evidence_type": "공시", "sources": [{"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=548001", "verified": "약사공론 보도자료 기사 원문을 직접 확인했습니다."}, {"url": "https://news.mtn.co.kr/article/2026110316141069643", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "잠정실적 수치는 회사 보도자료를 옮긴 기사로 확인했고 DART 원문은 열람하지 못했습니다. 계약 총액에는 향후 마일스톤이 포함돼 모두가 즉시 매출로 인식되지는 않습니다.", "image_concept": "A small key turning a heavy vault door that swings open to reveal a glowing interior.", "img": "data:image/webp;base64,UklGRkAzAABXRUJQVlA4IDQzAAAQzgGdASqwBCADPpFIokwlq66wIjS4cgASCWlu5LeOudwru8HYC8oGxhl1ebheGkXRueOT5x76k9xt5gPNv06bopfScyb3W13O/sniF5M9xb23F0fkebemM0C/KF/4/MWOaB6CqXVT+ysDKaqfFEjKd15syiA2IDFwkmhFkatMy5wcQGxmT/xXd6qE6PiBxhSGWrphiM2EtiU+FteHdBuFsM07cUvXHsUdh2Yc23xIAL3mwkHFAgYaYYjVKRkfmw9BXOn5kW3ciADYegQAHm4YK5CqFrccucNjWOha4c3K50D0wrAymBf7kzVPl3lktWJK7NPyNJe7E82tsJIzwio3u1LqpmwoT6afE2Dj913vckeow9BQypdzkY6h6lUtVQrOnNr/LqZzIWQcQl1kyhZeLBxrrNew9fL2AEnY9cgZUQB3j8nvh5+m1T4V1UlOIEMMQRbF2lEPmnxJVu420Ml9NY6Fv2Rqa7g7FM+zakVf+GPTVLqp8ULPbgOMY9MlEUxnelGEzTVUDB8LnXHtA6/paYVgZeSwciAEIoz7NPUTTohaa/YU77EdNBeLP0y4gL5asDKaqZuwiPL2IfGQAPQVNL9N9mXMx/u1ZVLrwflGcrKmRBeULhu4VuxuBGMtJfOaIpqwq19psNDmIYULmI2yJ1MMA7FWCHwplcmGCl3a4D4XhVMZ58th2KeofPTiDKbn3ibAvfNxh7wezWqNeTNqoAWP+CmmqXLULuqfFC5PNCbD0LLPVPi24+YUQAFLK7jVJzVjLeodT0ET//7yXfJwjZB5cD7FLXFjaz7IOW2iSegtRUma5iKW29WAfPYrAcNDjVQBhZsPQVUSPWd3Xx4rVPihZdderaAXMocVxPK+rxUHooIyzJDfLuvU0IEYkaYRNeTOm9uJG7+zYuE3JJMpXp3JuAG3TqLDJddQMMl/NCbD3K/kdEYFZBdVPig5yh//G1T0hAxt7dJHop5hl7rJy7GJxLVGkg5/2D/ZAdEbzHb1kysumPae9Fh1xagoQOiHGnfrvA4po9DG0cfyq5Y0c6y2UgV2 톤 증액은 국내 보도(LG화학 발표 기반) 기준입니다. 리듬 자료는 3억5,000만달러 고정 지급과 1% 로열티를 명시했습니다. 매년 합의에 따라 고정 지급분 일부를 로열티로 전환할 수 있다는 조항은 국내 보도로만 확인했고, LG화학 DART 공시 원문은 직접 열람하지 못했습니다.", "image_concept": "A dripping faucet being replaced by a sealed water jug filled to a measured line.", "img": "data:image/webp;base64,UklGRkAfAABXRUJQVlA4IDQfAABQcgGdASqwBCADPpFIokylr7IoIdToMkASCWlu+9/Q0H9VL+3a3/FWueff7nN9ZUOhU05O8IfL1qB9KNpm/DfQfcQsAM67NjtjmbIAPrT5206r7HZLBBQXyv4bzNKMaawkVy2Zi+V+a2dZmCjBZoJ5GrrBmlHAf6UB5maTMg2eCgG6tYYK3wuPO+fH3xJtBEzwI3cZ7U3877XP28luYZHePNHDkCeTDwZNGD9mrVspTGILhRNWdM1mccrZi9oiKDP0qL/zyWsCfFfd2XQT3N5bmPhIbRrJhmNoXIQVZ4eMO9BXl8oYPm/axp1pgePwpyJ1RJczQWgMKrfC5Dhzo+klnRfJdVZ9UJQFAoPHDNnGiHiBQY1DDQgU1PcE+99YOQHGImPMzGGx+LVbdQ6CJmfn4o51uXAJPp+IkzILR8WzU754geJtK4Y9Lp19kv1TCO37jxBIyZqTUFPuhwjyR2jXp9agg3kdrCbRBGYL9o4wMrA5+HTPqrqSJCC3KYm7e6Rdsj2zP6ii4RrR5pqLPWlaVSwTikFtTKqPd+PJYzA0OFfD6zwH8cyrMPUf0eH1nl3LBo3twn7aFqawbsNDvioS6g+aqVagqhBM06mCaI6DTAVgJg8qmgTCTVzqa7FIeCBUgBooJ0d2x8K25R1ruq7dKsF/bprXe4EYSVXMxnfDwEHAlWftMTYcoNE9hGMZpsKD5V2Hs7E0Jjy7BU1gzSjGmr0UR8g9d1DzAkxMDm70xpNd6fn4zNNHMjH31ERe8qAfjmRgmwRT9LjO7DDI79+4M4swxGqCtBrmC+qeyS031BxbhYztu/PNKCRXDYGGAA3lroCFBQSslloo26cY+KAEyB9i4s3JZb8IDOFRMYhVlz0JkEQdCfdY5QQHoHD+6FKTD4XAPqq+PhzIfllqF2c+PTMvtwWpxK3BjrWHYuObYGWXr0PvY27TTMIp+5BAnOwEJTJiBQW6EBFRigUf3QfXlP0JhI05VVVvHL/j7LcYn28miHB5xNd80Z120xk6sZ8mxPwJ0d2aQRI6wZ5Zpq8+3408815z8nxcXo+gqUwoDtob8ST3HDt8NK6bg0gARU0ufVdeLKeGJyx+3eyQZNOtFKL0Y8ARx7wk8QtmGeaTeBFQOg1Z9bN9dVsO1gc6SJ8lX/6734INzCj+kVynLTAm1AQfEtDJgJ1fCHMrUohJ4eM6aHiVn9kd480kyOOmdxHQkPILRNbdgAtH5DSGEc0ohj7GRSWvGV+nKm66gepFEdL0e9Hg4DfDMzJ/pgpNUXg+UMkPWbauZ9Fw3Mlao1OpjwQXyBGxAgYuSpUMfXEuslRnlKJ4VlMwCVUJcvmhlpMpgJ1KyYmM+JNUpUbw/w/KtYisAno+WL9JsW1kjYUNVTPqM8l+hkAIyl+hz/5nOVJQ1uTIXUEVIwkUgoFPS07Vo1VKVIaCC7ivcYW6G9E5gV+6JSI+8vmv3gS5c6gvvQCYiz4Qppurg/kmeJw30DcBQOd1VM3O80QL3/ZQcRMvhQqKW4tWo/jlHqfiO5Fat/p7w8KSYYY5f2Cl7ewdEh6si3G5YmN74iB3S/ISa7RZUef0nMzqqc01euwCqYnyymfhommCsj7uwd05mQwFu84RKQjPknBNuV5kW6FmGRBVDEqRSgPvvgUGUkPiJ7FjVS+Z702vDjxnFawhpMv g-therapy-for-als/", "verified": "투자사 루미라 벤처스 사이트에 게재된 보도자료 원문을 직접 확인했습니다."}], "verification_note": "효능 근거는 환자 유래 세포와 동물모델 전임상 데이터라는 회사 설명뿐이며, 수치화된 데이터는 공개되지 않았습니다.", "image_concept": "A pair of tiny precision scissors snipping a single repeated loop out of a long knotted thread.", "img": "data:image/webp;base64,UklGRsohAABXRUJQVlA4IL4hAAAQRQGdASqwBCADPpFIok0lpCMioHKoOLASCWlu/HyQInUth6F9/0r/e6Ej//6ip83X1ROav1P3PlZrnkZZ9v3z/NqOhmP+u/Ad73/n+vfcF86o+u9WXfz5Exp7Tf5x1699PzN1C7lna1AH/RP7x6Cv23m//N/6f2APPL+9+NVQD8ZbTCDuEszp06dOnTp06dPlnkGuj2LOnTp1mbkt6F3OrVq1atWrYTnks3+oPzq31kh/pUZmQZfXSuaAPVhexQXbwYKjZl85Q39AMdExvp+7DkROr7Kc+PSKhzq2/Uw8D8lp7RbLRCMhNRUJTq0yFxwnpyfueIJzePzCrGBGcG6/gW0NrDQIEOj9EZkA9IYpFM7GCoZBSMAZGjOEGwS09BxZ9AgOTQAlj9mOJUZNVBx4gQlC2V8zqu8F05lCKYHg/2vLsObEiGlCKmUMnpvYtXEtQRQu6AItgrgTxFAf7X9Q/35YtfkplW1A9IsGXo5IspUpzTGkaBrnMOvXoVYjbnKHb0YOtjKxDU9pzc9ZvBi4Pl8kWtWtrOetsAXATyZKb3SGDGTDI7HiKthJbvqyxyer3RbUQW24kSnKwwHlVPKHbn9tmJ7e5/VnTp3emF0llNIHv1FkGVkM4lcOQzA/kZ66ZD9WY/JqD2KCdgqdPki7puRF5YvX3jUxjfulMO0rKhknt7bvDJ+4/pacWwPgMcFtIJrNJc9zpEJBII3L131EsX7+0ibuBUp8DcvAXx6RvuOeVDj8CX3FT1RJxcMacn7FEBKHxZv6VxCtsNU8oc4gaysre4FCpQ+rbgY/l2D2Lg+WC5+dlUFHw0N0hi0swEYWlWRAZmK2Xszxth39q++ng/2l7MJuuhPp/PJ4fJtkhQzE8q7aH2B/nrlb4L9YUy07cNYLnpNJLE6gcWCeUMuBTiMsq8ja+Qo24urjpw/2mCLfRPZHYwQKnCDr5FxSD3P9iflhrAXUQC38syRzhV7IJSi3LSTKdrD+TRr+n6iyDKuJCxFG8A72kNpNoa2sWdg7OBKw53LDH2eyZALWcB/npoIcOQfo9KG/lhKxIP2OvVvUnxLMYc5FmMVwxXeivaXb/InKYdqzrKLmx7hhsG05uvpxpJcPYEhlAfFb+qYyoiwgQkYf90nUhkkrCeGwexbn2thqmHZZBJh2ZUzD5qEFfgdiqAD5CTm/WP5YtFaYzn+fbg1GxtJZFhzDsvdh+d0amP40KF/i9/FrHMrpZRbOXOTSsFh19N98NsDVyZAU7urVe6bGwNWaPeti2qrlnTgTrEw9chRP3H5MeUn/wgLMhbuQ+9GBm1jahifxgukRz6k14dzJs9AUSBqOh0SShYlcMTahwRS9BhfU+UQAYnmfv/6Q9oPN1XZv5uBF4dAqgBgG/s10qZSPn/R0CCICTvBl+ZWtUy/gHpNpdMuM9vEbotXOjg5RS4fzuXC2+pW5rlZmsqclrsSZJGX9Wumrw3+627Fb2bF55cbvAw75zxRnE/TXFDtGQIOWFjgOzV6xG3QnFLHzw4Z9+bCcM/1xCVSWByYcXVwcPhwyzxJyEAupJAgMnEVlBypP3qUiPhdAE4Afnas2zNqe3Q0Cqm0HKhZ2kpiYL9pErkHeXBommUqQxvHA723SJved6GECJBdDBe9sYjVtNsiAdTpJDr const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
