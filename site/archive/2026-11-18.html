:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* synthesis */
.syn{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.syn{grid-template-columns:repeat(3,1fr);gap:0}.syn>div{padding:0 22px}.syn>div:first-child{padding-left:0}.syn>div:last-child{padding-right:0}.syn>div+div{border-left:1px solid var(--rule)}}
.syn h3{font-size:18px;margin:0 0 10px;font-weight:850;letter-spacing:-.02em}
.syn ol{margin:0;padding:0;list-style:none;counter-reset:n}
.syn li{counter-increment:n;padding:10px 0 10px 30px;border-top:1px solid var(--rule);position:relative;font-size:13.5px;color:var(--ink-2)}
.syn li:before{content:counter(n);position:absolute;left:0;top:10px;font-weight:900;color:var(--blue);font-size:15px}
.syn li b{display:block;color:var(--ink);font-size:14px;line-height:1.4;margin-bottom:2px}
.syn .refs{font-size:12px;color:var(--muted);margin-top:4px}
.syn .refs a{color:var(--blue)}
.syn .refs a:hover{text-decoration:underline}

/* inner pages */
.page{padding:26px 16px 0}
@media(min-width:768px){.page{padding:30px 28px 0}}
.ph{text-align:center;margin-bottom:18px}
.ph h1{font-size:clamp(24px,3.4vw,34px);margin:6px 0 4px;font-weight:900;letter-spacing:-.035em}
.ph p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}
.chip{border:1px solid var(--rule-2);background:var(--paper);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
mark{background:var(--mark);color:inherit}

/* article */
.post{max-width:780px;margin:0 auto}
.post .head{text-align:center}
.post h1{font-size:clamp(26px,4vw,40px);line-height:1.22;margin:10px 0 12px;font-weight:900;letter-spacing:-.04em}
.post .by{font-size:12.5px;color:var(--muted);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.post .by b{color:var(--ink);font-weight:600}
.post .cover{margin:22px -16px 6px;aspect-ratio:3/2}
@media(min-width:820px){.post .cover{margin:24px -60px 6px}}
.post .cap{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:22px}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin:0 0 26px}
@media(min-width:640px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts div{padding:10px 10px 10px 0}
.facts dt{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:800}
.facts dd{margin:2px 0 0;font-size:13.5px;font-weight:650}

dy": "릴리는 스티플바이오와 최대 59억달러 규모 제휴를 체결했으나 선급금과 지분투자 금액을 모두 비공개로 뒀고, OBI파마는 노바티스에서 선급금 3,000만달러를 받으며 총액 20억달러 초과를 발표해 초기 현금 비중이 1.5% 수준임을 드러냈습니다. 마로우테라퓨틱스는 전임상 단계에서 시리즈A와 B를 묶어 1억7,300만달러를 공개했고, 윈드워드바이오는 공모와 사노피 사모 발행을 합쳐 2억5,120만달러로 상장을 마쳤습니다. 자본은 여전히 들어오지만 실제 위험 부담 규모를 외부에서 읽기 어려운 형태로 들어옵니다. 비교군 산정 시 총액과 선급금을 분리하지 않으면 과대평가로 이어집니다.", "refs": ["bio-lilly-stipple-oncology", "bio-obi-novartis-adc-payload", "bio-marrow-therapeutics-launch", "bio-windward-bio-ipo"]}], "signals": [{"head": "환자 데이터 접근 비용이 0으로 내려가며 소비자 앱이 진료기록 경로를 차지합니다", "body": "HIPAA 최종 규칙은 개인 건강앱으로의 전자 사본 전송을 무료로 만들고, 앱이 데이터를 어떻게 다루는지를 이유로 환자가 지정한 앱을 거부할 수 없게 했습니다. 같은 주 오픈AI는 환자 접점과 청구 워크플로를 ChatGPT 안으로 끌어오는 플러그인 21종을 공개했고, AWS는 예약·처방·포털 계정 업무를 한 통화 안에서 처리하는 에이전트를 정식 출시했습니다. 기록 전송이 공짜가 되는 시점과 그 기록을 소비할 소비자 인터페이스가 완성되는 시점이 겹쳤습니다. 다만 관보 게재가 11월 19일 예정이므로 수수료 예외 범위는 전문 확인이 필요합니다.", "refs": ["dh-hhs-hipaa-final-rule", "dh-openai-healthcare-agents", "dh-aws-connect-health-agents"]}, {"head": "벤더 자체 평가 수치만으로는 의사결정을 내릴 수 없는 구간에 들어섰습니다", "body": "이번 주 핵심 성능 수치의 대부분이 자체 평가였습니다. 앰비언스의 케이스믹스지수 6.5% 상승과 3배 투자 회수는 방법론·표본·기준선 설명이 없고, 오픈AI의 임상 안전 99%는 평가 주체가 독립 검토자인지 사내 의사인지조차 불분명합니다. GE헬스케어의 민감도 99.2%도 회사 제출 시험 결과입니다. 반면 73명 표본의 이노바서·CHIME 설문은 자율 완결률 4%라는 보수적 숫자를 내놨고, 이 역시 벤더가 발행 주체입니다. 숫자를 받는 쪽에서 기준선과 측정 설계를 계약 조건으로 고정하는 일이 사실상 유일한 방어선입니다.", "refs": ["dh-ambience-inpatient-orchestration", "dh-openai-healthcare-agents", "ai-ge-critical-care-suite-3", "dh-innovaccer-chime-ai-2030"]}, {"head": "국내 의료AI의 생존 변수는 기술이 아니라 제도권 진입 판정입니다", "body": "뷰노는 3분기 누적 매출 178억원으로 35% 줄고 영업손실이 103억원으로 네 배 늘었는데, 매출의 87%가 딥카스 한 제품에서 나옵니다. 그 제품의 평가유예 신의료기술 심사 결과가 11월 중 통보될 전망이고, 통과하지 못하면 진료 목적 사용과 비급여 청구가 중단될 수 있습니다. 같은 주 식약처는 2027년 디지털의료제품 정책 방향을 두고 업계 간담회를 열었고, 숨빗AI는 허가를 받은 비상장 생성형 AI로 120억원을 조달했습니다. 허가는 출발점이고 급여·평가 통과가 사업의 분기점이라는 구조가 그대로 드러났습니다.", "refs": ["ai-vuno-q3-deepcars-review", "dh-mfds-digital-medical-roundtable", "ai-sumbit-series-a"]}, {"head": "약가 사후관리가 정례화와 환급·환수라는 두 축으로 동시에 조여집니다", "body": "건보공단은 2027년부터 사용량-약가 연동 인하를 4월·10월 연 2회로 정례화하고 지연 기간을 환급으로 보전하겠다고 했지만, 국내 제네릭이 다수인 유형 다는 행정부담을 이유로 환급에서 제외했습니다. 같은 설명회에서 원료 직접생산 가산 품목에 대한 2028년 4월 전수조사와 10일 내 자진신고·미신고 환수도 예고됐습니다. 해외 처방 GLP-1 비만약 휴대 반입 허용은 반대 방향에서 국내 유통 물량에 압력을 주며, 반입분이 피해구제·리콜 보호에서 빠진다는 점은 안전관리 공백으로 남습니다. 완화와 강화가 같은 주에 한꺼번에 들어왔습니다.", "refs": ["reg-nhis-pva-biannual", "reg-nhis-premium-audit-2028", "reg-mfds-glp1-personal-import"]}, {"head": "실패가 반복됐던 모달리티에서 전체생존 데이터가 나오기 시작했습니다", "body": "셀라스라이프사이언스는 급성골수성백혈병 암백신 GPS의 허가용 3상에서 위험비 0.59, 중앙 전체생존 24.0개월 대 14.7개월을 보고했고 주가는 장중 최대 233% 올랐습니다. 암백신은 20년 넘게 3상에서 좌초해 온 영역이라 전체생존 지표의 유의성은 모달리티 단위의 재평가 사유가 됩니다. 같은 날 FDA는 장기 스테로이드 의존이 표준이던 류마티스성 다발근통에 항IL-17 생물의약품을 처음 승인했고, 마로우테라퓨틱스는 체외 조작 세포치료의 한계를 피하는 골수 직접 전달로 1억7,300만달러를 모았습니다. 다만 셀라스는 p값과 환자 수가 아직 공개되지 않은 톱라인 단계입니다.", "refs": ["bio-sellas-gps-regal-phase3", "reg-fda-cosentyx-pmr", "bio-marrow-therapeutics-launch"]}], "priorities": [{"head": "미국 승인 후 10일이라는 새 시한을 규제업무 체크리스트에 즉시 넣으십시오", "body": "FDA 글로벌 신뢰 공개 프로그램은 승인 후 10일(달력일) 안에 참여를 신청해야 하고, 2027년 1월부터 신규 유효성분 NDA와 351(a) BLA 전체로 확대될 예정입니다. 지금 미국 승인을 준비하는 품목이 있다면 신청 기한을 내부 절차에 반영하고, 진출 대상국이 FDA 심사보고서를 의존 근거로 수용하는지 국가별로 먼저 확인하십시오. 동시에 공개될 패키지에 들어갈 영업비밀·CMC 정보 범위를 점검해 공개 리스크를 평가해야 합니다. 임상약리 패키지는 MAPP 5100.7의 네 질문에 역방향으로 대조해 하위집단 용법과 상호작용 관리 근거를 보강하십시오.", "refs": ["reg-fda-global-reliance-disclosure", "reg-fda-mapp-clinical-pharmacology"]}, {"head": "딥카스 신의료기술평가 결과 공고를 매일 확인하십시오", "body": "평가유예 신의료기술 첫 심사 11건의 결과가 11월 중 통보될 전망이며, 11월 18일 오전까지 공개되지 않았습니다. 뷰노 매출의 87%가 이 한 제품에서 나오므로 결과는 기업 실적과 유상증자 일정, 그리고 다른 10건과 향후 AI 솔루션의 제도권 진입 기준을 동시에 결정합니다. 한국보건의료연구원 공고와 뷰노 공시를 같은 날 교차 확인하고, 탈락 시 처분 취소 소송·집행정지로 이어지는지까지 시나리오로 준비해 두십시오. 의료AI에 투자하거나 조달 계획이 있는 기업은 이 결과가 업종 전체의 자금조달 환경에 영향을 준다는 점을 전제해야 합니다.", "refs": ["ai-vuno-q3-deepcars-review"]}, {"head": "사용량-약가 연동 유형 분류와 통보일 시나리오를 품목별로 계산하고 지침 개정 의견을 제출하십시오", "body": "환급 구간이 통보일 하루 차이로 반년 이상 달라지는 구조이므로, 보유 품목을 유형 가·나·다로 분류해 시나리오별 환급액과 인하 시점 차이를 미리 산출해야 합니다. 유형 다 품목 비중이 높은 기업은 환급 제외가 아직 지침 개정 전 단계라는 점을 활용해 연내 의견조회 기간에 협회 채널로 의견을 내는 것이 유일한 개입 지점입니다. 동시에 원료 직접생산 가산 품목은 식약처 등록 원료 정보와 공단 가산 신청 자료의 불일치를 선제 점검하고 10일 자진신고 절차를 내부 규정으로 정비하십시오. 1만1,953품목 재평가 협상의 2월 사전협상 일정도 캘린더에 올려야 합니다.", "refs": ["reg-nhis-pva-biannual", "reg-nhis-premium-audit-2028"]}, {"head": "AI 도입 보고 지표를 도입률에서 자율 완결률로 바꾸십시오", "body": "미국 73개 기관에서 사람 개입 없이 끝나는 행정업무가 평균 4%라는 수치는 사내 AI 과제의 현실적 기준선이 됩니다. 도입 기관 수나 사용률 대신 사람 개입 없는 완결률을 별도 지표로 떼어내 측정하면 벤더 약속과 실제 성과를 구분할 수 있습니다. 성과 연동 수수료를 제안받는 경우 직전 12개월 기준선(케이스믹스지수, 진단 코드 분포)을 계약서에서 먼저 고정하고, 코딩 정확도 개선분과 실제 중증도 변화분을 분리 측정할 설계를 요구하십시오. 화면 조작형 에이전트는 EHR 공급사의 자동화 접근 정책과 감사 로그 보존 방식을 계약 요건으로 명시해야 합니다.", "refs": ["dh-innovaccer-chime-ai-2030", "dh-ambience-inpatient-orchestration", "dh-openai-healthcare-agents"]}, {"head": "11월 19일 HIPAA 관보 전문과 셀라스 전체 데이터셋을 확인 캘린더에 올리십시오", "body": "HIPAA 최종 규칙은 11월 19일 연방관보 게재가 예정돼 있고, 수수료 예외 범위와 업무제휴계약 추가 전환 기간 요건은 전문에서만 확인할 수 있습니다. 준수 기한이 게재 후 240일이므로 의료기록 사본 발급 부서의 현재 평균 처리일수를 지금 측정해 15일 기한 대비 격차를 산정해 두는 것이 유리합니다. 셀라스라이프사이언스 GPS는 p값·등록 환자 수·안전성 프로파일이 공개되지 않은 톱라인 단계이므로, ASH·EHA 등 학회나 동료심사 논문에서 전체 데이터가 나올 때까지 판단을 보류하십시오. 두 건 모두 다음 확인 시점이 명확한 사안이라 캘린더에 날짜로 걸어두는 편이 안전합니다.", "refs": ["dh-hhs-hipaa-final-rule", "bio-sellas-gps-regal-phase3"]}]}}, "archive": [{"label": "제29호", "date": "2026-11-18", "count": 28, "current": true}, {"label": "제28호", "date": "2026-11-17", "count": 29, "file": "https://bio.withsong.co.kr/archive/2026-11-17.html", "note": "웹에서 열립니다."}, {"label": "제27호", "date": "2026-11-16", "count": 9, "file": "https://bio.withsong.co.kr/archive/2026-11-16.html", "note": "웹에서 열립니다."}, {"label": "제26호", "date": "2026-11-15", "count": 16, "file": "https://bio.withsong.co.kr/archive/2026-11-15.html", "note": "웹에서 열립니다."}, {"label": "제25호", "date": "2026-11-14", "count": 23, "file": "https://bio.withsong.co.kr/archive/2026-11-14.html", "note": "웹에서 열립니다."}, {"label": "제24호", "date": "2026-11-13", "count": 23, "file": "https://bio.withsong.co.kr/archive/2026-11-13.html", "note": "웹에서 열립니다."}, {"label": "제23호", "date": "2026-11-12", "count": 20, "file": "https://bio.withsong.co 담과 PACS 전송 지연이 줄어드는 대신, 알고리즘 업데이트와 성능 모니터링이 장비 교체 주기에 묶이는 제약이 생깁니다. 다만 민감도 99.2%와 DICE 91.6%는 회사가 제출·공개한 자체 시험 수치이고, 전향적 임상 결과나 오판독 감소 효과는 공개되지 않았습니다.", "strategy": "FDA 510(k) 데이터베이스에서 이번 허가의 K번호와 성능 시험 설계(대상 환자 수, 소아 하위군 규모, 비교 기준)를 직접 확인하십시오. 국내 기업은 흉부 X-ray 단독 판독 AI 대신 장비 탑재형·중환자실 워크플로 결합형으로 경로를 바꿀 때의 수가·조달 구조를 점검할 필요가 있습니다. 소아 적응증이 포함됐다는 점은 국내 식약처 허가에서도 연령군 확장 전략의 참고가 됩니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://stocktitan.net/news/GEHC/ge-health-care-s-critical-care-suite-3-0-brings-first-on-device-ai-d8epu59khkrj.html", "verified": "원문 직접 확인(2026-11-17 발표, 민감도 99.2%·평균 DICE 91.6%·소아 지원·온디바이스 작동·응급실 75%/중환자실 51%/경장영양 80% 수치 확인)"}, {"url": "https://www.auntminnie.com/imaging-informatics/artificial-intelligence/news/16541813/ge-healthcare-gehc-gets-fda-clearance-for-feeding-tube-ai-on-mobile-xray", "verified": "검색 결과 스니펫만 확인(본문 HTTP 403으로 미열람, 11월 17일자 보도 및 동일 수치 확인)"}, {"url": "https://www.investing.com/news/company-news/ge-healthcare-receives-fda-clearance-for-pediatric-ai-software-93CH-5032823", "verified": "검색 결과 스니펫만 확인(본문 미열람, 소아 AI 허가 표현 확인)"}], "verification_note": "보도자료 전문을 통해 발표일(11월 17일), 제품명, 허가 종류(510(k)), 민감도·DICE 수치, 소아 지원 최초 여부를 확인했습니다. 다만 FDA 510(k) 데이터베이스에서 이번 건의 K번호와 결정일을 직접 대조하지는 못했습니다. 검색 중 확인된 유사 품목 K253502(결정일 2026-04-14)가 이번 3.0과 동일 건인지 별개 건인지 확정하지 못했으므로 허가 번호는 추가 확인이 필요합니다. 성능 수치는 모두 회사가 공개한 자체 시험 결과입니다.", "image_concept": "A single feeding tube coiled on a hospital tray so that its tip rests exactly inside a small painted target ring.", "img": "data:image/webp;base64,UklGRnI6AABXRUJQVlA4IGY6AABQ+AGdASqwBCADPpFIn0ylq7Q2IhOowsASCWdu/7flhB+960oRzOtx8pf5pz/VtzbfvGFLkP++mV9F/br7jnyujrhOeXaUr1f929Jq0f5f+/f4z9g/nH/fedHZf7B+p1035zP996o/1f+vfwC/sD0x/3h9Rf7j+tt/yvVz/m/UZ/t3p6eqT6Dvl5+z//Yf/Zwf/TH95/R96wWwf/XsAZt/ou7T/Zo9e50kv6NdXqx8gwkmJYOpQi+zdm7N2fpZctMy5ZyzlvM+l0zVMX8viDmxfL5lBHY6CuhkrW10+gvZJkjL7CJQBumvZupEuEVds3pezsG6HyXk1dcXdEoFMKGpKOm1dDVdxfSaoJymxe3iS2qOlruHLTlnL7R7iN2bs2PdQo6YNHqvJG2AfJccAfpoSeS8l5LxNLMkcHG8l4lPLOWkMIZ 를, 탈락 시에는 젠큐릭스 진스웰BCT 사례처럼 처분 취소 소송·집행정지로 이어지는지를 확인 포인트로 두십시오. 뷰노의 유상증자 일정이 다시 확정되는 시점이 평가 결과 공개와 연동되므로 증권신고서 정정 제출을 함께 추적하는 것이 좋습니다.", "evidence_type": "공시", "sources": [{"url": "https://news.mtn.co.kr/article/2026111716335234175", "verified": "원문 직접 확인(2026-11-17 보도, 3분기 누적 매출 178억원·35% 감소, 영업손실 26억원에서 103억원으로 확대, 딥카스 매출 비중 87%·약 155억원, 평가 결과 이달 중 발표 전망, 미통과 시 비급여 청구 중단 가능성 확인)"}, {"url": "https://dailymedi.com/news/news_view.php?wr_id=942557", "verified": "원문 직접 확인(2026-11-13 보도, 에이아이트릭스 바이탈케어 도입 병원 184곳 서면조사·4곳 현장점검, 금감원 11월 10일 정정신고서 요구와 11월 11일 일정 추후 확정 정정, 업계의 11월 중 결과 발표 전망 확인)"}, {"url": "https://supple.kr/news/cmvao8nio007ci5q4b7o3ya27", "verified": "원문 직접 확인(2026-10-16 보도, 평가유예 신의료기술 11건 심사, 뷰노 43개월·논문 6편·180곳 의료기관·6만5000병상, NECA의 11월 중순 통보 안내, 젠큐릭스 집행정지 인용 확인)"}], "verification_note": "3분기 누적 매출 178억원, 영업손실 103억원, 딥카스 매출 비중 87%는 11월 17일자 보도 본문으로 확인했으나 뷰노 분기보고서 원문과 직접 대조하지는 못했습니다. 평가 결과의 11월 중 통보 전망은 업계 관계자 전언을 인용한 보도이며 NECA의 공식 발표로 확인된 일정은 아닙니다. 2026년 11월 18일 오전까지 평가 결과가 공개됐다는 보도는 검색에서 확인되지 않아 미공개 상태로 판단했습니다.", "image_concept": "A single egg balanced upright on the edge of a wooden ruler, its shadow stretching toward an unmarked line.", "img": "data:image/webp;base64,UklGRuIbAABXRUJQVlA4INYbAACQcQGdASqwBCADPpFInkylp7AoIXKoYgASCWlu/7k5N62n3RQgZ79nlp7UHomnj8h3Alhd/uzkfMA5yHmA84D0c/4v0gOok3nH+8ZO5PtTl5uVgBej5ne0n5KS7c94Y/yg/6ijtKMv/mBjcjDHD7LtTT5H+FFug5DaMu1NPkf4UW6I+siY4fWak6afI/wou0ZTMLUEGkF3apRLp+snoSi2ZT4R9ZHSJDot336KJrQge3UvRWJ/MZHcKLdN231+Iy7U0+R/p0CXrIyVWM4m6IvoeLIOOYRU7iOIBElsU/by59Vd2Y9A+y7U0+RM9m7XWu14jLtklCIxIZrdggY4v8w5afI/l0B99pluXHoi3a+DYwk08xkhbSiBW6I+r8+ot0RfGEEhpj7NPIxLtTRo/lG0B/fFma67ESkj/740rsbDV9rfluI4fGvkTdEeuKR+QYwhg9bScSTCgGuO1vnGlV+32zg4GTKChEaDw/zPpBf2+3a+ZCSAuuhgnczOwoQ0/8SFiZziyKBr7LnYOSwGyZIh+yxvXS/Kk3a+AQ8l0ZSO3AKhAnsmnRdzh4sa2g8P5Ze1nmtu07C38fV+4rpulZomK8cy8b7wJcb7O/6Tlxvs2IGhqsboY8ZE3IA+ley0U+qzoYDf1h4bTZlIP+Jd3eDuoutqsKWUXiMu1NsF7sc0Tm6JIC7+FFtBo5H99u2JSeYyc/hRbmhU80Xl9qYyQwnYUT/oNdr1fWxQ1+BrNzlrt3OxcWyQ1ASYV405SJcb4wa3bfPo7X elligence와 SI를 추가해 신규 가이던스를 놓치지 않도록 하십시오. 미국 진출 기업은 기존 허가 문서와 라벨을 수정할 필요가 없다는 점을 사내에 명확히 공유해 불필요한 변경관리를 막는 것이 좋습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://casrai.org/news/fda-super-intelligence-terminology-eo-14434-november-2026", "verified": "본문 직접 열람(2026-11-16 적용 개시, CDRH·CDER·CBER 신규 문서 적용, 기존 가이던스 유지, 심사 경로 불변, 15 U.S.C. 9401(3) 정의 유지 서술 확인). 다만 매체 자체의 신뢰도는 검증하지 못했습니다"}, {"url": "https://www.presidency.ucsb.edu/documents/executive-order-14434-inaugurating-the-era-super-intelligence", "verified": "검색 결과 스니펫만 확인(행정명령 14434의 2026-09-29 서명, 91 FR 63129, 2026-10-02 게재 확인)"}, {"url": "https://www.massdevice.com/fda-will-move-from-ai-to-si-but-sponsors-dont-have-to-follow/", "verified": "검색 결과의 기사 제목만 확인(본문 HTTP 403으로 미열람). 스폰서에게 의무가 없다는 요지를 제목으로 교차 확인"}, {"url": "https://insights.citeline.com/medtech-insight/policy-and-regulation/us-fda/era-of-super-intelligence-comes-to-fda-documents-sponsors-can-still-say-ai-XZ6HKNFVQ5AVHIGPRBHK2YMJCA/", "verified": "검색 결과의 기사 제목만 확인(유료 매체로 본문 미열람)"}], "verification_note": "미확인 출처: FDA가 발행했다고 언급된 용어 전환 통지 원문을 끝내 찾지 못했고, 11월 16일 적용 개시와 세부 범위는 신뢰도를 검증하지 못한 2차 매체 본문 한 건과 MassDevice·Citeline의 기사 제목으로만 교차 확인했습니다. 행정명령 14434의 서명일(2026-09-29)과 연방관보 게재(91 FR 63129, 2026-10-02)는 별도 출처로 확인했습니다. 별도 검색에서 FDA 문서에 super intelligence 표기가 실제 쓰인 사례는 찾지 못했으므로 적용 개시일은 확정 사실로 다루지 말고 FDA 사이트에서 재확인하십시오.", "image_concept": "A single rubber stamp lying on a desk, its engraved face freshly re-cut so the old letters are shaved away and new ones stand in relief.", "img": "data:image/webp;base64,UklGRvJAAABXRUJQVlA4IOZAAAAw5wGdASqwBCADPpFIoEylpC2wobK4whASCWdu/6Rb/1rCu/O/+/FCfsnqR6j1f5+n8zL06n7n/6MRl4J4DxQclb0LzYYgIflF0D/N0n0+YEgbHe7VKD7Tnze35vkEjpLzg/9f1Wfrr2BOej5j/Ob9Nv+R9NvqlfJm65f+55NI8//ndZ/Qer3H7//b4Tzkoh7LI/EqO3M6PFf+fmr+5QsjmsK1+WFVF2zIPWFa/LCqi7ZkHrCtflhVRdsyD1hNGO/9JgyPMgIPZxBN5YVUXbJM2el2ulzWFa/U2ktFNjSRE21+YdO5zLh0FA1cj70mDCqiul2YeHgq10u77YBadzBnrov7ktq0NBLX0wCPh2tdZkHrzMGFVF3UA/pMGCuygVFVEGFVFbgpKt0PxvR31AyyrYaf2sWoGu/twrTINprr 11-17", "scope": "글로벌", "entity": "AWS(아마존웹서비스), 아마존 커넥트 헬스, 템플헬스(필라델피아), 레독스(Redox), 에픽(Epic)", "what_changed": "AWS는 2026년 11월 17일 아마존 커넥트 헬스의 환자 응대 에이전틱 AI 기능 4종을 정식 공급(GA) 단계로 올렸습니다. 프리뷰였던 예약 관리가 정식 출시됐고, 처방 관리(재처방·리필 상태 확인과 EHR 약국 워크플로를 통한 수령·배송 조정), 환자포털 비밀번호 재설정(본인확인 자동화 후 이메일·SMS로 복구 링크 발송), 안내 응대(시설·주차·포털 문의를 승인된 지식베이스에서 답변)가 더해졌습니다. 통합 대화 오케스트레이터가 EHR 대조 본인확인을 한 번만 받고 한 통화 안에서 업무를 전환하게 하며, 끝내지 못한 업무는 다음 통화에서 이어받을 수 있다고 설명했습니다. 에픽 고객은 에픽 쇼룸의 전용 커넥터로 본인확인 상태와 통화 맥락을 상담원 EHR 화면에 넘길 수 있고, 다중 EHR 환경은 커넥트 헬스 안에서 1만2,000개 시스템 규모의 레독스 네트워크에 연결할 수 있습니다. 레독스 사용분은 고객의 기존 AWS 업무제휴부속합의(BAA) 적용을 받아 AWS 계정으로 과금됩니다. 설계 파트너 템플헬스는 2026년 6월 환자 본인확인을 가동했고 나머지 3종을 확산 중입니다.", "why_matters": "콘택트센터 자동화는 병원 AX에서 임상 문서화 다음으로 투자 회수 설명이 쉬운 영역이며, AWS가 인바운드 통화의 약 60%가 단순 행정 문의라는 수치를 근거로 제시했습니다. 레독스·에픽 커넥터를 클라우드 사업자가 기본 제공하는 구조는 환자 액세스 전문 벤더의 차별화 지점을 줄입니다. 다만 호출 포기율 개선 같은 성과 수치는 과거 AWS 자료의 자체 보고치이고, 이번 발표에는 4종 각각의 정식 공급 개시일·가격·처리 성공률이 제시되지 않았습니다.", "strategy": "환자 액세스 외주·IVR 계약을 재검토할 때 본인확인 1회 후 업무 전환이라는 오케스트레이션 구조를 요구 사양에 넣어 비교하십시오. 레독스 경유 과금이 고객 AWS 계정으로 떨어지는 구조이므로 EHR 건당 인터페이스 비용과 총소유비용을 따로 계산해야 합니다. 국내 병원은 처방 관리 기능이 전자처방전·약국 연계 규제와 맞지 않을 수 있으므로 예약·포털 계정 관리 쪽부터 적용 가능성을 보십시오. 템플헬스처럼 단계적 가동 사례의 통화 처리율·에스컬레이션 비율 공개를 공급사에 요구하는 것이 좋습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://hitconsultant.net/2026/11/17/amazon-connect-health-expands-agentic-ai-patient-access-epic-redox/", "verified": "원문 직접 확인(2026-11-17 기사, 기능 4종·템플헬스 2026년 6월 가동·레독스 1만2,000개 시스템·인바운드 60% 수치 확인). 각 기능의 GA 개시일과 가격은 원문에 없음"}, {"url": "https://aws.amazon.com/about-aws/whats-new/2026/03/amazon-connect-health-agentic-ai-healthcare", "verified": "검색 결과 스니펫만 확인(본문 미열람). 2026년 3월 최초 출시 시점 확인용 보조 출처"}], "verification_note": "11월 17일 발표의 기능 구성, 에픽·레독스 연동 방식, 템플헬스 적용 시점은 HIT Consultant 원문에서 직접 확인했습니다. AWS 공식 뉴스룸 원문은 열람하지 못해 정식 공급 지역과 가격은 확인하지 못했습니다. 제품의 2026년 3월 최초 출시 사실은 검색 스니펫으로만 교차 확인했습니다.", "image_concept": "A single telephone receiver resting on an open field, its coiled cord branching into many thin roots t 론·표본·기간·기준선이 없고 제3자 검증 표시도 없습니다. 퇴원 관련 지표는 아예 수치화되지 않았습니다.", "strategy": "입원 AI 도입 검토 시 CMI 상승을 성과 지표로 받기 전에 코딩 정확도 개선분과 실제 중증도 변화분을 분리 측정할 설계를 계약서에 넣으십시오. 성과 연동 수수료는 기준선 산정 방식이 전부이므로, 직전 12개월 CMI와 진단 코드 분포를 사전 고정할 것을 요구해야 합니다. 라운딩 요약은 야간 인계 정보의 누락·오기 위험이 큰 구간이므로 검증 로그와 의사 수정률 공개를 확인 포인트로 두십시오. 국내 병원은 DRG·중증도 체계가 달라 CMI 수치가 직접 이식되지 않는 점을 전제하고 봐야 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://hitconsultant.net/2026/11/17/ambience-healthcare-introduces-inpatient-care-orchestration-cmi-discharge-readiness/", "verified": "원문 직접 확인(2026-11-17 기사, 라운딩 어시스턴트·퇴원 준비도 2종 구성, CMI 6.5%·진단 59%·3배 회수·온비다헬스 언급 확인). 다만 수치는 본문에 산출 설명이 없음"}, {"url": "https://modernhealthcare.com/health-tech/mh-hlth-2026-live-updates", "verified": "검색 결과 스니펫만 확인(본문 HTTP 403으로 미열람). HLTH 2026 기간 중 발표라는 맥락 확인용"}], "verification_note": "발표 날짜와 기능 2종의 구성은 원문에서 직접 확인했습니다. 핵심 수치 3개(CMI 6.5%, 진단 59%, 3배 투자 회수)는 기사 본문에 산출 근거가 없는 벤더 제시치이며, 앰비언스 공식 보도자료 원문은 열람하지 못했습니다. 온비다헬스가 2종 기능 모두의 사용처인지도 확인하지 못했습니다.", "image_concept": "A single hospital bed in an empty room, its wheels already turned toward an open door.", "img": "data:image/webp;base64,UklGRtwdAABXRUJQVlA4INAdAAAwewGdASqwBCADPpFIoEylpCorITJYaWASCWlu4VsfBe5/Vya+BK6KXf39V2aV5l41/4+0QH7h+tp6K/976f/Us+hX0wOR4+ssXuwX/h94b+zZGeaeDHu6Mt8LzNnvV6Oco9/9/pxA+EMcPkRB9ZD2pp8iIPrIe1NPkRB9ZD2pp8iIPrIe1NPkRB9ZGhJoL6+kyDZVTN2piwzERCwJcsisImsU8Tav/bJ70fVEB0Js9rXqh9fFDeAvhWQ9+EXxw8n2AQq/fXGkRm+fQlo9CbaEl9WRBFhKpp8iLiG6LlSoq4/lKUjt8TasKUKimCXFI6/PZfWRWEzmbtHb5++rIagpMYwzEQerhx51fY2QEe6yGoBAIrGr1T4N5Rp8pQqMBxBopcffQz5p7T/amushFkQAGPKS1NKwMKmlNYzBp4FDSHicIh7U0+UoZ1TPoZtaGdQfWQ9qDwuJcr6fMeTqolqWdLIKKR1+e0FpjWoOyo027ln76seiWUaU3zFNzp8x8prdO0XUCgyr5WxhmIiFfXoM9ZBLt1Iq1D7BVtoRBfATtWNxbtRUPiNJnpKrqpAH6uM6lZD3z2I4I4UXEf1X57qyIPzOeJ3p9KeNpCSc9YdtS92hF+tGJbLKlr6/yyFKg15Ul8TWvBfRFQ+viKY+jz9dsJrSOKOxF3L8Z6051ss/kzmbYK+x6Rk9fqkA++iPwY4fdhHXxEH1fSyB1ztbn4b+3lRByAvjKNPkEHhWQ9zQmk4VZbfXxP7nFFITWRBdR/Ow84eHGtdruCO/kRDT8Igw3VMfLXahOATZ53a+Iz4MC3XwQdlSAffRD1uBXo7NY8bNP9qLU1C6vpZ 지르는 메디텍의 트래버스 익스체인지로 확보해, 외부 임상기록을 차트 화면 안에서 불러오게 합니다. 재원은 보건 IT 현대화·사이버보안·원격의료를 지원하는 뉴욕주 의료시설 전환 보조금으로 일부 충당하되 보조금 액수는 공개되지 않았습니다. 가동 일정과 계약 금액도 공개되지 않았습니다.", "why_matters": "에픽·오라클헬스 양강 구도에서 메디텍이 지역 거점 병원의 EHR 통합 교체를 계속 수임하고 있고, 이번 건은 주정부 보조금이 전환 비용을 받쳐 주는 공공 재원 연계형 모델이라는 점이 특징입니다. 레거시 포털 3개를 하나로 줄이는 부분은 환자 디지털 접점 단일화가 EHR 교체의 실질적 구매 동기로 작동함을 보여 줍니다. 다만 가동 일정, 계약 금액, 보조금 규모, 교체되는 나머지 EMR 제품명이 모두 비공개여서 사업 규모를 가늠할 수 없습니다.", "strategy": "EHR 통합 교체를 검토하는 중소 규모 의료기관은 임상 기능 비교에 앞서 환자포털 통합과 사전문진·예약의 단일화를 별도 요구사항으로 떼어내 가격을 비교하는 것이 유리합니다. TEFCA·QHIN 경유 외부 기록 조회가 차트 안에서 작동하는지는 공급사 간 구현 수준 차이가 크므로 레퍼런스 사이트에서 조회 성공률을 직접 확인하십시오. 국내 기관에는 주정부 보조금 구조가 그대로 적용되지 않지만, 공공 재원과 EMR 현대화를 묶는 설계는 참고할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://hitconsultant.net/2026/11/17/samaritan-health-selects-meditech-expanse-traverse-exchange-unified-ehr/", "verified": "원문 직접 확인(2026-11-17 기사, 소재지·적용 범위·레거시 메디텍 포함 복수 EMR 교체·포털 최대 3개를 마이헬스로 통합·트래버스 익스체인지 QHIN/TEFCA 설명·뉴욕주 보조금 일부 지원 확인). 병상 수·가동 일정·계약 금액·보조금 액수는 원문에 없음"}], "verification_note": "선정 사실과 적용 범위, 포털 통합, 재원 구조는 기사 원문에서 직접 확인했습니다. 메디텍 또는 사마리탄헬스 공식 보도자료 원문은 열람하지 못해 가동 일정, 계약 금액, 교체 대상 EMR 제품명, 병상 규모는 확인하지 못했습니다. 뉴욕주 보조금의 실제 배정액과 승인 시점도 확인하지 못했습니다.", "image_concept": "Three separate footpaths converging into one wide stone road at the edge of a quiet plain.", "img": "data:image/webp;base64,UklGRuAnAABXRUJQVlA4INQnAABwsAGdASqwBCADPpFInkylp7AtoZSoigASCWlu/+S8V7fjb2QxWeoc8Nn4OLbxnivxUyXVtHMu438ehDOU/8X+Z/2DfpLue6fs39WDNN8zzw+e/N/6TfME/gH9b6fnmW8/D0lf43p/vUO//+/Z/5XJsqBfWPON5F0MLCe87gdmmez8edQE+7qPBj16d/vkJcM+/M+/M+/M+/M+wvUh2bB2bB69Dn35n35n35n35n35n35n4N8/jUp0syHPaJ7Ca78TkGx98z2mpno++aLmKe0UMjtDjV54Vb2yc5T1ibBuZAp/+I0ASHweFR8Uoh77uBLYTV83zVhS6cw67PRHDqTm/b9WXWcxaPvmhcmwj8s2Drgnf3hhZuwQ5sHZsHaUQT05XgcI15Yr4yvslUn9LFz4KXTrItd8z76UQyugC3gHpJcs2E6sWsneQuNg7Ng7NX4Pc9BmwEy9JuvGGbZaPET2156PxBaAQ3NFakO0lf6WLnpC8E9OmX4TS7kpOONg7LwbCa7ATh/NwINOYwFh9GEKbN0Qacw67Pb+XQURiyA42Ds2AnOXJUU8aVyZCiCQNQ+WofLTmLTmLT+3fM9onpzDqrfZq93idfvBkoQekLuKwS7D 합리화 과제 지정과 처장 현장방문이 연이어 나온 흐름은 디지털융합의약품 쪽에 제도 정비 우선순위가 걸려 있음을 시사합니다. 다만 이번 간담회는 의견 수렴 단계여서 구체적 제도 변경안이나 일정이 확정되지 않았고, 확인된 보도에는 2026년 허가 건수 등 성과 수치가 제시되지 않았습니다.", "strategy": "디지털치료기기·SaMD 허가를 준비하는 기업은 10월 시행된 신기술의료기기 허가심사 혁신방안과 가이드라인 13종의 적용 대상에 자사 제품이 들어가는지 먼저 대조하십시오. 디지털융합의약품은 10월 30일 심사 업무절차서가 나왔으므로 합동 심사팀 구성과 임상시험 설계 요건을 절차서 기준으로 다시 점검할 필요가 있습니다. 2027년 정책 방향은 간담회 이후 식약처 공식 보도자료와 규제합리화위원회 후속 발표로 확인할 수 있으므로 두 채널을 모니터링하십시오. 급여·수가 문제는 식약처 소관이 아니므로 복지부·심평원 일정과 분리해 관리해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=549188", "verified": "원문 직접 확인(2026-11-17 보도, 일시·장소 양재 엘타워·행사명·2개 분야 구성·10월 23일 규제합리화 과제 발표·11월 16일 처장 업체 방문 확인). 2026년 성과 수치와 2027년 세부 일정은 원문에 없음"}, {"url": "https://www.nursenews.co.kr/news/articleView.html?idxno=46845", "verified": "원문 직접 확인(11월 17일 간담회 사실, 10월 23일 합동대응팀·통합심사체계·임상시험 설계 지침 방침, 10월 30일 디지털융합의약품 심사 업무절차서 확정 확인)"}, {"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=547482", "verified": "검색 결과 스니펫만 확인(본문 미열람). 10월 28일 업무설명회와 가이드라인 13종 안내, 10월 신기술의료기기 허가심사 혁신방안 시행 맥락 보조 확인"}], "verification_note": "간담회 일시·장소·구성과 10월 규제합리화 과제 지정, 11월 16일 처장 업체 방문은 두 매체 원문에서 직접 확인했습니다. 식약처 공식 보도자료 원문은 열람하지 못했고, 참석 기업·인원과 2026년 허가 건수 등 성과 수치, 2027년 가이드라인·규정 정비의 구체 시점은 확인하지 못했습니다. 일부 스니펫에 12월 가이드라인 마련과 2027년 1월 규정 정비 언급이 있었으나 본문으로 확증하지 못해 수치로 쓰지 않았습니다.", "image_concept": "A single empty chair at the head of a long bare table, a window behind it just beginning to lighten.", "img": "data:image/webp;base64,UklGRgwVAABXRUJQVlA4IAAVAADwKQGdASqwBCADPpFIokylp7WoIPGIUrASCWlu6aJQbeTfS+VgF8McxRqLcdFEmVYZw75A9rn1W6ZL+wFp2+p0rAhLIw9x1gCYpi4w9x1gCYpi4w9x1gCYpi4w9x1gCYpi4w9yFkQvwfNtplmi5faZw4I0OzVO5aGzunN202SRQ2d1NSSusATFMXFMNaltpndS5MUgl2aywtQEBFtpSHnZRlIGh0lzE4IttM9yrPSEUNndg2dxqWzp3bWTvdqpBMv3DORZimR/V3hV8TzJcW/8iaNsXjJNGKYuMPcdbOmD4muMPcdbmDcdYAmKYuMOi0tPKyLb40w1Amd1NR0YNUqpysiyw1ATFe/QV7bwRbaZ3U1O5iOiagJikKGzuNTI/LJij5t7jXu2mfmrkFMDrZ50BN0id8otNL9cYdFhFw3k73HWAAN/Rt7jXu2mWaYpi4w9x1gG1UottN/dx1gALOmDr 57027", "verified": "원문 직접 확인(2026-11-17 16시 38분 보도, 한국보건의료정보원·한국한의약진흥원 협력 논의, 휴폐업 한의원 기록 보관을 위한 EMR 연계 확대·한의과 특화 EMR 인증기준 개선·진료정보 표준화 3개 항목 확인). 예산·일정·수치는 기사에 없음을 확인"}, {"url": "https://www.korea.kr/news/policyNewsView.do?newsId=148973762", "verified": "검색 결과 스니펫만 확인(본문 미열람). 비대면진료 시행규칙 입법예고상 의료인별 반기 월평균 한도 맥락 보조 확인"}], "verification_note": "협의 주체와 3개 협의 항목, 보도 일시는 뉴스1 원문에서 직접 확인했습니다. 양 기관 공식 보도자료와 협약서는 열람하지 못해 추진 일정, 예산, 대상 기관 수, 인증기준 개정의 법적 형식은 확인하지 못했습니다. 한의사 비대면진료 건수 한도는 입법예고 단계 기준의 검색 스니펫으로만 확인했고 최종 확정 여부는 확인하지 못해 본문에서 수치로 쓰지 않았습니다.", "image_concept": "A single wooden filing drawer left open in an abandoned room, one folder inside glowing faintly.", "img": "data:image/webp;base64,UklGRo4lAABXRUJQVlA4IIIlAAAQhwGdASqwBCADPpFIn0wlp62tIxHocbASCWlulvC85f46o//8oZopauS58fJ5tOOuK86qjrjf+t5mHb8mxBjsH9Ndll9M7cX+L4fPP/KFDJ0ZPd9Utsx9Y/e70oe11tCi7+bHKJt+C3WvyxICQEgJVioy4I0z7w5xzk197Ja/LEgJASAkBICQEgNOXCqMvnS0wbIZNRzMRfAWtr8rVm9Yw2DRhbmtwgJAR+qu2ihjMDEwZCku2zGdqwx4os4TXTBpn3uit4I03C+jalVYIMJ6TOvzLz6m0gAg85S3i1IVbZ6XiQDVEUxArZHgqtMGvIQxzap7R5viF8kCtgexzjnHNsU/97vW8EeWBkCsxLEdalObJ2TECtfmHs9yxGHH3hzi73hzi7sUHp118Ea8hXrJSOQAOO8GRnQ/LEgZSjLgJg0z9DkRc7DH6s5Kf07Wfg3l5j0YSOgzuAtCKKx12iYaoimHVsmIFftfs3/15UX1vDicUj3Sq5SWSxICQE983Yvt3aIxYN9wb5fvYlMPvug0Nuv3fj9pSAmI0UTi+xfCGyyO8NhFqh/wpCa+F+qwcUj21oIM++EmXg5C8R/8DIuA+WGorU/GJwrQCNhBaP5ChpoKnPhVIQxeL9rYJBzCPrrGx4y1BU+BHnYrvyrEeVICRqPgESh499bowoScnBiX1AQEBAQEBwZYpn293aae5KN6aN9QxpmwWy3EuF4gbWyklDISG59/UEyZ6TBGUEMgI/BYMGqP0wwRP6SAQIhVsdmDtIP5jIedknXtIFZK+qPcNJ+sX+IYKuaWStWVwqDaEJ+QoaZ+8HA86axCcUSCkem33YrfqGhoZ/NNXZbSOPSBj42UMTsDoyMjIyMjI1KjI1KiFHF7ljDXAulY/TkEX4+UxNmUObiBUZnbInbCqL62fpLBkevqgoVFC+sZBMRRoZxSW7SnguJW0PQM4dZjgIVc5ZvdPCjwuQOnpOxjBGnFDR/c2DsaPdsOGgtvEtloM3wxzlqQL5hGJEoSpPj4+Pj4+YmtZYOHOp/yyExL6WssHDnU/5XOFUVX3wQLJPurkVKAKgX0suhWsJ35NsgOx7+P4tR4dh+7NojuVtC/BW3Lc1JeZsDvZlAcMNKEU76D2ZRXNAFHkCjQEwaTjlSZaWU/w7TxApcbsakCbKBmx3Jwy0oJyWgc+cJO+t3W7R3sOgB0xyqIuqShvZ4vXSWL2r3a+JwwCICQDT3FTweWYG+vQdfYBoUBzOsj2ZUjHDlfHL10qGzu+MNPwaafxMSCG 서 2030년 전망치는 응답자 추정이자 벤더 주도 투사입니다.", "strategy": "사내 AI 과제를 보고할 때 도입률이 아니라 사람 개입 없는 완결률을 별도 지표로 분리해 이 4%와 비교할 기준선을 만드십시오. 사전승인·진료조정처럼 70% 이상이 완전 수동인 영역은 경쟁 압력이 낮은 대신 레퍼런스가 없으므로, 동종 기관 검증 성과를 벤더에게 조건으로 요구하는 것이 효과적입니다. 배포 확대 단계에서 투자 회수 불명확 응답이 오히려 늘어나는 패턴을 감안해, 파일럿 승인 시점에 측정 지표와 중단 기준을 함께 확정해 두십시오. 표본 73명 보고서를 단독 근거로 쓰지 말고 다른 조사와 교차 검증하십시오.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://hitconsultant.net/2026/11/16/innovaccer-chime-survey-healthcare-ai-2030-three-times-work-same-staff/", "verified": "원문 직접 확인(2026-11-16 기사, 표본 73명·조사기간 2026년 8~10월·에픽 54%·평균 자율완결 4%·워크플로별 수동 비율·50% 대 12%·투자 회수 불명확 59% 대 49%·구매 진행 71% 확인)"}], "verification_note": "표본 구성, 조사 기간, 주요 비율은 기사 원문에서 직접 확인했습니다. 이노바서·CHIME 보고서 원문은 열람하지 못해 6개 워크플로의 정확한 정의, 자율 완결의 조작적 정의, 응답 기관의 규모 분포는 확인하지 못했습니다. 3년 내 확대 전망치는 응답자 자기 추정이며 보고서 발행 주체가 벤더라는 한계가 있습니다.", "image_concept": "A single large gear turning in a wall of many identical gears, all the others still coated in untouched dust.", "img": "data:image/webp;base64,UklGRoBpAABXRUJQVlA4IHRpAABQDQOdASqwBCADPpFIn0ulpC2vI9T5UeASCWlu+uNsO559xXutwnHiPNAT/D6cnMn/r61gUH4J3ASJdSbsrzYemVWgBxn8yz0RJ8nlC+0Mehwndp6UpZffcqHyrk89jeuvNO8n/g+cx+g/1++AD9d+lX5ivOi/2vrK/v++iegp0w2RLS+PI+w38y9/P+p9sT/Yzp/K+Df9x/tOdT/t8L/2H/T/eXnJP9/A1vl4XvPtoS/Yn+bp08WA3hrCfZv/v6b4vH/9JCl7pEJJC+CuUiHi+CuUhJaFsqrFC2VliyqsULZVWc0JLP0IySOgAArSAg3FxzczNzXBpjtNSZFXCtnBx6DGZSdj0Vz29+gJQ5a/uVCT6CruUjgtlVqVeqPFbZOFWWowlAzN3q0OE9/rX9R/sV3eJ71bEIjx5TAmeZoSkKJIUK/u0p3T1JbUWvTur//sFrDnFSD/9Jo0Zjg5il8JLLjcR463Ln/9J42m4URH5ajFDTOJLQvdRe6i2VYoxaWGzN/u22qxJDy7dhGB6U9teDgTWdViqLYpNNf/9gNLkni0LZVWJc/tFK9npIUhJa4Jkqsd2zprJXipfNKuVnkpI7kJbqRlssWVNk6MTM1/bMaXmWVlivRj9mWVVigs6dk/9VI5kvj/Pk2m1yqTXZP/pIUhZH9cpBQ9IaGt65I/otihllPt4AbvNRtpGZ40W05xUhirN1RuUTjKbV+Kr/NTjHIZyEkPzFyACeP/B87Vn61i5LT29O2ICoZsBkHv4n4v1eOPnDVYlxroIsL2ZqEFZZFzGfocbjCoDJP6lwcp60IJXScr8bhk2INoVivpozDO8rzgUllaXdMd/ARdwI1L6UTRd46c49WOyz3RcbkRYFclvKkhvenok2iv7tYAViSFDLaDIIXP8q6r8jS4DRWmfYQJ1EATv7ernUAxA2nEQSW4Z10sBb1gFgKFluGShCio5A+oAeW  반입에는 형사처벌이 가능하다는 설명도 나왔습니다.", "why_matters": "국내 비만약 시장의 가격·유통 구조에 직접 영향을 주는 규제 변화입니다. 3개월분 합법 반입 경로가 열리면 국내 정상 유통 채널 수요가 일부 이탈할 수 있고, 동시에 피해구제 사각지대에 놓인 투여 환자가 늘어 안전성 이슈 발생 시 책임 소재가 불분명해집니다. 식약처와 관세청의 해석이 엇갈린다는 점은 집행 공백을 뜻하며, 규정 정비 전까지 반복 반입 통제가 사실상 어려울 수 있습니다. 다만 사후관리 공백과 반복 반입 해석 차이는 언론 보도에 인용된 당국자 발언 기준이고, 식약처의 공식 고시나 지침 문언으로 확인된 것은 아닙니다.", "strategy": "비만약을 보유한 기업은 해외 반입분으로 인한 국내 처방·유통량 변동을 월별로 모니터링하고, 자사 제품 관련 이상사례 신고 시 국내 유통분과 해외 반입분을 구분할 수 있는 접수 절차를 마련해야 합니다. 식약처가 자가치료 목적 증빙 강화나 반복 반입 제한을 고시·지침으로 명문화하는지, 관세청 통관 시스템 정비가 어떻게 진행되는지 확인이 필요합니다. 의료기관·약국은 환자가 해외 반입 제품을 사용하는 경우 피해구제 제외와 콜드체인 요건을 고지하는 절차를 갖추는 것이 안전합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.dailypharm.com/user/news/344469", "verified": "원문 직접 확인(2026-11-12 시행, 관세청 협의, 기본 6병·용법상 3개월분, 주 1회 GLP-1 최대 12개, 대상 3가지 유형 확인)"}, {"url": "https://dailypharm.com/user/news/344567", "verified": "검색 결과 스니펫만 확인(해외 직접 처방·반입 의약품은 국내 허가 제품과 동일 성분이라도 피해구제 대상에서 원천 제외). 본문 열람 실패"}, {"url": "https://news.mtn.co.kr/article/2026111210505916513", "verified": "검색 결과 스니펫만 확인(식약처는 반복 반입 원칙적 불가 입장, 관세청은 별도 제한 규정 없다는 입장, 시스템 정비 언급). 본문 미열람"}, {"url": "https://www.korea.kr/news/policyNewsView.do?newsId=148975557", "verified": "검색 결과 스니펫만 확인(향정신성의약품·마약류 반입 금지 및 직접 구매 불허 유지). 본문 미열람"}], "verification_note": "시행일, 수량 기준(6병·3개월분·마운자로 12개), 대상 유형은 데일리팜 기사 본문을 직접 열람해 확인했습니다. 피해구제·리콜 제외와 반복 반입 해석 차이는 데일리팜·머니투데이방송 스니펫 수준에서만 확인했고 해당 기사 본문과 식약처 공식 안내문 원문은 열람하지 못했습니다. 11월 17~18일자 후속 보도의 세부 문언도 확인하지 못했습니다.", "image_concept": "An unsealed thermos flask tipped on its side, a single drop of condensation hanging from its rim.", "img": "data:image/webp;base64,UklGRs4vAABXRUJQVlA4IMIvAACwvgGdASqwBCADPpFIoUylr6qrIbKIWfASCWlu/7HrSFk+fOM/Pentq/8+1m8ethct/479tHL+488mw+cYXlViE9t/gOeI5J6Y+v+53yy/df2b85epf9b/8f8WP0Z7Af65dOv92PUF/T/9F64/ov/xf+o9gj+odRx6AHnO/+L2g/7P6VGpLfDf/V6aLj/f2Vv3Q7W5jUOnll/VlGlmsHhwfVlK8shSSj/PltEKSUf58j/8+SAKDI6UnTj5H/91lIKiso/7q4iQYH8fq14bLH19QZ9iQggA5eaJCCAuxS64o4jABbUQu3eFEo2nJanYADcKTgOXfUW28cbdFNP8rEp5Sonw8k ", "cat": "reg", "alt": "한쪽 끝이 열린 봉투에서 접힌 종이가 텅 빈 책상들을 향해 펼쳐져 나가는 미니멀 일러스트", "title": "FDA, 해외 규제기관이 FDA 심사를 그대로 활용하도록 하는 글로벌 신뢰(reliance) 공개 프로그램 출범… 10월 30일 레나카파비르 PEPFAR 잠정승인을 1호로, 2027년 1월 전체 신약·바이오의약품으로 확대합니다", "short": "FDA 심사자료 해외공개 개시", "date": "2026-11-17", "scope": "글로벌", "entity": "미국 FDA, PEPFAR, 해외 규제기관, 길리어드(레나카파비르)", "what_changed": "FDA는 2026년 11월 17일 Global Reliance Disclosure Program(GRDP) 출범을 공식 발표했습니다. 최소한의 비공개 처리만 거친 승인 패키지, 즉 FDA의 상세 과학적·규제적 심사보고서를 신청기업에 제공하고, 기업이 이를 해외 규제기관에 전달해 해당 기관이 자체 전면 심사 대신 FDA 심사에 의존할 수 있게 하는 구조입니다. 실질 운영은 10월 30일 HIV 예방·치료제 레나카파비르의 PEPFAR 잠정승인 건으로 이미 시작되었습니다. 현재 대상은 PEPFAR 잠정승인 건으로 한정되며 잠정승인된 ANDA 제품은 제외되고, 기업은 승인 후 10일(달력일) 안에 참여를 신청해야 합니다. FDA는 2027년 1월 신규 유효성분 NDA와 351(a) BLA 등 모든 신약·바이오의약품으로 확대하고, 2027년 초에는 이미 승인된 품목의 심사 패키지도 요청할 수 있는 경로를 만들겠다고 밝혔습니다.", "why_matters": "해외 인허가 전략의 비용 구조를 바꿀 수 있는 변화입니다. FDA 심사보고서를 공식 경로로 확보해 제3국 규제기관에 제출할 수 있다면, 다국가 동시 허가에서 중복 심사 대응 부담과 심사 기간이 줄어들 여지가 생깁니다. 다만 FDA 발표문에는 어느 국가·기관이 실제로 이 자료를 수용하기로 했는지가 전혀 명시되어 있지 않고, 의존 채택 여부는 각 해외 기관의 재량으로 남아 있어 실효성은 아직 검증되지 않았습니다. 또한 2027년 1월 확대는 계획 단계의 약속입니다.", "strategy": "미국 승인을 받았거나 받을 예정인 품목을 보유한 기업은 승인 후 10일 신청 기한을 내부 규제업무 체크리스트에 즉시 반영해야 합니다. 진출 대상국 규제기관이 FDA 심사보고서를 의존 근거로 받아들이는지, 공식 의존 경로가 제도화되어 있는지 국가별로 확인하는 것이 다음 단계입니다. 자사 심사 패키지에 포함될 영업비밀·CMC 정보 범위와 최소 비공개 처리의 실제 수준을 미리 확인해 공개 리스크를 평가할 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.fda.gov/news-events/press-announcements/fda-launches-global-reliance-disclosure-program-expand-patient-access-medicines-worldwide", "verified": "FDA 보도자료 원문 직접 확인(2026-11-17 발표, 10월 30일 레나카파비르 1호 건·10일 신청기한·2027년 1월 확대 계획·당국자 인용문 확인)"}], "verification_note": "FDA 공식 보도자료 원문을 직접 열람해 발표일, 프로그램 구조, 대상 범위, 10일 신청 기한, 2027년 확대 일정을 확인했습니다. 다만 참여 의사를 밝힌 해외 규제기관 명단은 발표문에 없어 확인하지 못했고, 레나카파비르 건의 실제 해외 활용 결과도 확인하지 못했습니다.", "image_concept": "A single sealed envelope held open at one corner, its folded page unfolding outward toward many empty desks.", "img": "data:image/webp;base64,UklGRtAmAABXRUJQVlA 첫 1년 내 재발이 최대 40%에 이른다고 밝혔습니다. EU는 이미 승인했고 일본 심사는 진행 중입니다.", "why_matters": "PMR은 그동안 장기 스테로이드 의존이 표준에 가까웠고 생물의약품 선택지는 IL-6 수용체 억제제 케브자라(사릴루맙) 정도였습니다. 항IL-17 계열이 추가되면서 스테로이드 절감 전략의 기전 선택지가 넓어지고, 국내 급여 논의에서도 비교 대안 구도가 바뀔 수 있습니다. 다만 첫 번째이자 유일이라는 표현은 생물의약품 전체가 아니라 항IL-17 계열 한정이며, REPLENISH의 300mg군 결과와 전체 등록 환자수는 보도자료에 제시되지 않았습니다. 사망 사례가 1건 보고된 점도 안전성 평가에서 함께 봐야 합니다.", "strategy": "국내 류마티스 영역 포트폴리오를 가진 기업은 코센틱스 PMR 적응증의 국내 허가 신청 시점과 식약처 심사 진행 여부를 확인해야 합니다. 케브자라와의 직접 비교 근거가 없다는 점이 급여 협상에서 쟁점이 될 가능성이 높아, 간접비교 근거와 스테로이드 절감 효과의 경제성 자료를 미리 준비할 필요가 있습니다. 300mg 용량이 승인에서 제외된 이유와 FDA 라벨의 경고·주의사항 문구를 원문으로 확인하는 것이 권고됩니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.novartis.com/news/media-releases/novartis-cosentyx-becomes-first-and-only-fda-approved-anti-il-17-biologic-people-polymyalgia-rheumatica-pmr", "verified": "노바티스 보도자료 원문 직접 확인(2026-11-17 승인일, 150mg 용량, 적응증 문구, REPLENISH 27개국·52주 40.5% 대 20.5%, 이상반응 수치, 환자 96만6천명 확인)"}, {"url": "https://www.biopharminternational.com/view/fda-approves-cosentyx-as-first-anti-il-17-biologic-for-polymyalgia-rheumatica", "verified": "검색 결과 스니펫만 확인(본문 미열람). 케브자라 2023년 2월 PMR 승인 선례 등 맥락 보조 확인"}], "verification_note": "노바티스 보도자료 원문을 직접 열람해 승인일, 용량, 적응증 문구, REPLENISH 1차 평가변수 수치, 안전성 수치, 적응증 순번을 확인했습니다. FDA의 승인 공고 원문과 최종 라벨은 직접 열람하지 못했습니다. 케브자라가 2023년 PMR에 이미 승인된 선례는 2차 매체 스니펫으로만 확인했으므로 최초 생물의약품이 아니라 최초 항IL-17로 한정해 기술했습니다.", "image_concept": "A tall iron clamp loosening its grip on a bent sapling, one thread of the clamp unwound.", "img": "data:image/webp;base64,UklGRtwcAABXRUJQVlA4INAcAABwRQGdASqwBCADPpFIoE0lpC2ooLGoUbASCWlu4VvCKF06L5RQr5SvoXxj/Uvc55Wdb9qreAe9/7r/cA/WrqF+YD9m/2Z94T+l/sr7kf7R6gH9I/43WH+gT5bvstfuR+4ntj6uzFvwAvX/CCgC+tvorTelUWgB4v2miLYVT3pIPdmKAuGOkF+KnvSQe7MUBI2t9IL8VPekg92YoC4Y6QWt3Zx1T+itQHLQ1Cz6W8/1y32W9UhUS8Vdrfj4ie0fVQWpWi+KFhkZ/RvezhgvzxiVH5i45FQxqvbMmUgLaCxlU65XZigLhjtxb1QWnSmBhDHSHo9fRzAMg9VoClH/Cp71Tb3tnubyXNYn5JoPdmKxXGljZxcRiuAwHVe4SAlooGD3seOKSxP+YkZ5HqhsTes7MU8f90uL5oz/DDezgpR5aP7O3pH+18nwsK1BnujMdIFRU 액이 60% 이상 증가하거나 10% 이상 증가하면서 증가액이 50억원 초과)이고, 유형 다는 행정부담이 지나치게 커진다는 이유로 환급에서 빠졌습니다. 유형 다는 국내 제네릭 품목이 다수 포함되며 그동안 매년 9월 정기 인하가 적용돼 온 유형입니다. 환급 기간은 통보일 기준으로 갈리는데, 9월 1일 통보는 9월분 환급 후 10월 인하, 9월 2일 통보는 10월 1일부터 이듬해 3월 31일까지 환급, 12월 20일 통보는 1~3월 환급 후 4월 인하입니다. 공단은 PVA 유연계약을 위험분담제로 확대하는 방안도 검토 중이라고 밝혔고, 내년 재평가 약가협상은 1만1,953품목을 대상으로 2월 사전협상·3월 본협상·4월 고시 일정으로 진행할 계획입니다. 운영 세부는 연내 지침 개정에 반영할 예정입니다.", "why_matters": "환급 대상에서 유형 다가 빠진 것은 국내 중소 제네릭 기업에 사실상 불리한 비대칭 설계입니다. 같은 지연 기간에 대해 유형 가·나는 보전을 받고 유형 다는 받지 못하는 구조이기 때문입니다. 2027년 4월부터 기등재 제네릭·특허만료 의약품 산정률이 53.55%에서 45%로 단계 인하되는 일정과 겹쳐 중소 제약사에 압력이 중첩됩니다. 다만 현재 내용은 설명회 단계이고 지침 개정 전이어서 유형 다 제외가 최종 확정된 것은 아니며, 공단도 모니터링 후 재검토 가능성을 언급했습니다.", "strategy": "PVA 모니터링·협상 대상 품목을 유형 가·나·다로 분류해 통보일 시나리오별 환급액과 인하 시점 차이를 미리 계산해 두는 것이 필요합니다. 특히 통보일이 하루 차이로 환급 구간이 반년 이상 달라지는 구조이므로, 협상 일정 조정 여지를 공단과 협의할 가치가 있습니다. 유형 다 품목 비중이 높은 기업은 연내 지침 개정 의견조회 기간에 협회 채널로 환급 제외에 대한 의견을 제출해야 합니다. 1만1,953품목 재평가 협상의 2월 사전협상 일정도 내부 캘린더에 반영할 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.dailypharm.com/user/news/344709", "verified": "원문 직접 확인(4월·10월 정례화, 유형 가·나·다 기준 수치, 유형 다 환급 제외와 행정부담 사유, 통보일별 환급 구간 예시, 위험분담제 확대 검토, 1만1,953품목·2월 사전협상·3월 본협상·4월 고시 확인)"}, {"url": "https://dailypharm.com/user/news/344299", "verified": "검색 결과 스니펫 및 관련 기사 확인(11월 17일 업계 설명회 예정, 연내 지침 개정 마무리 방침, 9월 인하 품목의 10월 지연 시 환급 필요 논리 확인)"}], "verification_note": "데일리팜 기사 본문을 직접 확인해 정례화 시점, 유형별 환급 대상 기준과 수치, 유형 다 제외 사유, 통보일별 환급 구간, 1만1,953품목 협상 일정을 확인했습니다. 건보공단의 설명회 자료나 공단 공식 공지 원문은 열람하지 못했으며, 지침 개정안의 최종 확정 여부와 시행일은 확인하지 못했습니다. 유형 다에 국내 제네릭이 다수라는 서술은 기사 기준입니다.", "image_concept": "Two brass scale pans at different heights, one holding a single pebble and the other empty.", "img": "data:image/webp;base64,UklGRsArAABXRUJQVlA4ILQrAADwmAGdASqwBCADPpFGoEyloyooIPDYiUASCWlu8ZS25off4X3PckmMl7bSeIiXnn0MPaNXemaf8p3t/9567/zt+onXf/5frj/qPoQ/l3+W9ev0T/7DfXOfc9pD++5O56w7Rv+PaInzfbJeaGVvztobfO6gb9B/v/m6/dea/8//pvYC87vBI+9f7r2Bf0v6NOin9A9RgIAZ6fj3dXrXRH1roj610R4drhIOFJIc79fd1etdEfWuiPrXRIANpW1v  새 진전은 16일 법사위 전체회의에서 실제로 의결이 보류되었다는 점입니다. 법사위는 2026년 11월 16일 전체회의에서 건보공단 임직원에게 특별사법경찰권을 부여하는 국민건강보험법 등 일부개정법률안의 의결을 보류했습니다. 법사위원장은 낮은 기소율을 지적하며 수사권 부여에 신중론을 보였고, 같은 제명의 다른 개정안들을 함께 살펴본 뒤 재심사·의결하겠다고 밝혔습니다. 앞서 11월 11일 법안심사제1소위가 관련 개정안 8건을 국민의힘 위원 불참 속 더불어민주당 단독으로 의결한 상태입니다. 18일에는 오전 법안소위에서 다른 분야 특사경 개정안을 추가 심사한 뒤 오후 전체회의에서 특사경 법안들을 일괄 논의할 전망입니다. 의협 대의원회는 법안 폐기까지 전 의료계 연대 총력 저지를 선언했고, 특사경 인력의 약 80%가 근무 경력 3년 미만이며 공단이 요양급여 지급·환수 당사자로서 이해충돌이 있다는 점을 쟁점으로 제기했습니다. 공단은 일반적인 요양급여 부당청구는 수사 대상에서 제외하고 수사 금지를 명문화하겠다는 입장이며, 법무부는 수사 범위 제한과 통제장치로 남용을 막을 수 있다고 봤습니다.", "why_matters": "법사위원장이 직접 신중론을 표명하면서 여당 단독 처리 동력이 한 차례 꺾였고, 동일 제명 타 기관 특사경 법안들과 묶여 심사되면 쟁점이 확대돼 처리 시점이 더 밀릴 수 있습니다. 통과되더라도 본회의 의결이 남아 있어 제도 시행까지는 거리가 있습니다. 다만 18일 전체회의 결과는 이 조사 시점에 확인되지 않았고, 일괄 논의 전망은 언론 관측이므로 확정 사실로 다루면 안 됩니다.", "strategy": "의료기관·약국 운영 주체는 18일 오후 법사위 전체회의 의결 여부와 수정안에서 수사 대상 범위가 불법 개설 요양기관으로 명확히 한정되는지를 조문 수준에서 확인해야 합니다. 통과 시 본회의 상정 일정과 공단이 제출한 수사심의위원회 등 통제장치가 법률에 명문화되는지, 부칙에 시행 유예기간이 있는지가 실무 대응 시점을 결정합니다. 일반 부당청구 수사 제외가 법률 본문인지 공단 내부 지침 수준인지 구분해 두는 것이 중요합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://kormedi.com/2906341/", "verified": "검색 결과 스니펫 확인(11월 16일 법사위 전체회의 의결 보류, 위원장의 낮은 기소율 지적과 신중론 확인). 본문 미열람"}, {"url": "https://dailypharm.com/user/news/344587", "verified": "기사 페이지 직접 확인(18일 법사위 분수령, 18일 오전 법안소위 추가심사 후 오후 전체회의 일괄 논의 전망, 공단·법무부 입장 확인). 본문 일부 절삭"}, {"url": "https://dailypharm.com/user/news/344577", "verified": "검색 결과 스니펫 확인(의협 대의원회 총력 저지 선언, 특사경 인력 약 80% 경력 3년 미만 주장, 공단 이해충돌 지적). 본문 미열람"}, {"url": "https://www.bosa.co.kr/news/articleView.html?idxno=3016191", "verified": "검색 결과 스니펫 확인(11월 11일 법안심사제1소위 개정안 8건 여당 단독 의결). 본문 미열람"}], "verification_note": "16일 전체회의 의결 보류와 위원장의 신중론은 복수 매체 스니펫으로 확인했습니다. 18일 오전 법안소위·오후 전체회의 일괄 논의는 데일리팜의 전망 보도이며 확정 일정이 아닙니다. 조사 시점인 2026년 11월 18일 오전 기준으로 18일 전체회의 의결 결과와 본회의 상정 여부는 확인하지 못했고, 국회 회의록 원문도 열람하지 못했습니다.", "image_concept": "A heavy brass gate latch half-lifted, casting a long shadow.", "img": "data:image/webp;base64,UklGRiw+AABXRUJQVlA4ICA+AADw0gGd 차를 따르도록 했습니다. 중요한 발견사항은 다른 CDER 심사관과 논의하기 전에 임상약리실 팀 내부에서 먼저 입장을 정리하도록 규정했습니다.", "why_matters": "FDA 심사 질의가 어떤 틀로 생성되는지를 보여주는 문서여서, 임상약리 패키지 구성 전략에 바로 쓰일 수 있습니다. 특히 하위집단 용량과 상호작용 관리에 명시적 비중을 둔 점은 해당 자료가 부실할 때 정보요청이나 심사 지연으로 이어질 가능성을 시사합니다. 다만 MAPP는 FDA 내부 심사관을 대상으로 한 문서이므로 신청기업에 직접적인 구속력이 있는 요건이 신설된 것은 아닙니다.", "strategy": "NDA·BLA 제출을 준비하는 기업은 임상약리 요약과 모델링·시뮬레이션 패키지가 MAPP의 4개 질문에 각각 대응하는지 역방향으로 점검하는 것이 유용합니다. 특히 신·간기능 저하, 소아, 인종·체중 등 하위집단 대체 용법 근거와 약물상호작용·식품효과 관리 전략(라벨 문구 포함)을 사전 정비할 가치가 있습니다. MAPP 5100.7 원문을 FDA 사이트에서 직접 확보해 보도 요약과 대조하는 것이 권고됩니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.raps.org/resource/new-fda-mapp-sheds-light-on-clinical-pharmacology-reviews.html", "verified": "원문 직접 확인(2026-11-17 보도, MAPP 5100.7의 2026-11-10 발효일, 발행 주체 OTS·OCP, 4개 핵심 검토 질문, 서명권자, 내부 정렬 절차 확인)"}], "verification_note": "RAPS 기사 본문을 직접 열람해 MAPP 번호, 발효일, 발행 조직, 4개 핵심 질문, 서명권자와 내부 절차를 확인했습니다. FDA가 공개한 MAPP 5100.7 원문은 직접 열람하지 못했으므로 조문 문언은 보도 요약 기준입니다. 이 지침이 실제 심사 기간이나 정보요청 빈도에 미치는 영향을 보여주는 데이터는 확인하지 못했습니다.", "image_concept": "Four identical keyholes cut into one steel plate, a single key resting beside them.", "img": "data:image/webp;base64,UklGRlYsAABXRUJQVlA4IEosAAAwpwGdASqwBCADPpFIoEylpC2rIVNYibASCWlL7XvT//N/gF81fKuctdA8utH7U+zHUdyd0H/b8vHwKRghJq27lvcXeNMfLr+a3z39l/bXqS+NPJX9G95nqP2T5z3O/599Yv6o+939Vewn+ufTU8w/nTf6X1ef2v1AP5X/wus0/cj2C/Lv9oL+4ZOdO7We3OtmXh3ubcF/5W+i6q3ifX6ftP/X2twuf/tzWy3NI3/XKbCgHthD6A9sHTuin/g4ATXK3M+3M+3M+4OIrcrdwNbsKYVnG6gba5RdLsFZjWsJKH1YBlpMTYAnBU2d0jSXu36ilalLjEioONy0clz051k6DYMVu7Kbn8XmoYC3MWG8ZOB5/sae1ucbARl5+vmNrdlpttub9DwtGgcqIAQwEkJe6Z95y70aMvaRbn7aaGQ//34KTr/IH0WQuk3q4F5+f/bDqbuSxBsU7pzKbzlxwDbAFu55H/9uaDaDluFQQsxSmH8+3ows8cS1mKAm+N07oAfO6cym5gcbTsTMMcGIfl5p05fx3CT9H7TvFuiXmeXi+xBUDqw/5OSJl15n4fBtG6xvaGvAD5naFwYso1asVMbbcGquVakiGXA6zLlTCVkUfPkpvFu00uNW0aoC4FnGOpH6kdkuBhUOkDjI5JXXzF1KT68HisweSLmyXQJgqMkAtytzLXs/pT9OBj+HKQXsUeC5Pyw9TPd6/uTAJz0LR7/4U514n/VEj7P4n66/vN5y3XzGBpJZNu4ruJNTGJqvdQfn/3E3xupmRUjcz7fYyTv+oHVsZ9AEGf/9gprGdmG5SjYL 혈을 겨냥합니다. 경영진은 최고경영자 로메시 수브라마니안, 최고과학책임자 팀 위든, 최고운영·기술책임자 존 나짐으로 구성됐습니다.", "why_matters": "전임상 단계 회사가 시리즈A와 시리즈B를 한 번에 공개하며 1억7,300만달러를 모았다는 점은 생체 내 유전자 치료 전달 기술에 대한 자본의 선호가 여전히 강하다는 신호입니다. 기존 체외 조작 세포치료제는 전처치 화학요법과 고비용 제조 문제로 상업적 확장이 막혀 있어, 골수 특이 전달이 성립하면 겸상적혈구병 시장 구조 자체가 바뀔 수 있습니다. 다만 MAR-101은 아직 전임상이고 공개된 전임상 데이터나 임상시험계획 제출 시점이 없어, 현 단계 평가는 플랫폼 서사와 투자자 구성에 의존합니다.", "strategy": "임상시험계획 제출 목표 시점과 첫 임상 적응증이 겸상적혈구병인지 베타지중해빈혈인지 확인하십시오. 경쟁 축인 비바이러스 생체 내 전달 기업들과 비교해 골수 세포 표적 선택성 데이터가 학회에서 공개되는지 추적하는 것이 핵심입니다. 오비메드가 시리즈B를 주도했다는 점은 비교적 이른 시점의 후속 조달 또는 상장 경로를 염두에 둔 구조일 수 있어, 2027년 자금 조달 이벤트를 예상 시나리오에 넣으십시오.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.biospace.com/drug-development/marrow-therapeutics-debuts-with-173m-to-tackle-blood-disorders-in-vivo", "verified": "원문 직접 확인(2026-11-17 기사, 시리즈A 5,300만달러·시리즈B 1억2,000만달러·총 1억7,300만달러·투자자·플랫폼·MAR-101 전임상·경영진 확인)"}], "verification_note": "조달 금액 구성, 주도 투자자, 플랫폼과 선도 물질, 본사 소재지, 경영진은 기사 본문에서 직접 확인했습니다. 발표일은 기사에 명시된 2026-11-17입니다. 임상시험계획 제출 시점, 기업가치, 전임상 데이터 세부 내용은 확인하지 못했습니다. 회사 보도자료 원문은 직접 열람하지 않았습니다.", "image_concept": "A thin glass pipette lowering a single drop of amber liquid into the hollow core of a cross-sectioned bone.", "img": "data:image/webp;base64,UklGRrohAABXRUJQVlA4IK4hAAAQkgGdASqwBCADPpFIoUylp7UoIZNoWqASCWlu8bCdbh5PkqCuF1R/p9MVz8utcyfpA8x+0f0s+YVz/fMd5x3+a9U39m31L0F+mi/1OTnTQzdOT58R3bNuj9n0AeJuqXm9+pAVi7Zw+EMH1roj610VHtLCGD610R9a6I+tdEfWuiPrXRH1r1x65kl0sJ5t/CO1bademnwg/46QE2HQ27fx9a6WIf1ds4klHD4cI1zqzi2P4Q26I9cS6g+s439X1YWqD4bq2Ehg+tdEfgX9XaPD/CG5cZtnD4QwfYEmOH894w2/hDboYwDboj610tyzkfqj7RfHRTDY+bmfiY4grht3O7Zw+EMH1ru8LEH1rpDrZp98dr1roj613O7Z7Am/iPzTZx1K1n8Xx/hDctC7a9bW2xLCwAv6u2Rkd8zqh/YXs2ZSG4fcvTTZGR4Q25mKbhAEYXJI8HLX/9OTUeHif7dHJDB9a6I+tdEfXi8TWzeucEnzJ79pi3bOH116tZOYwX0k8IbdEfWy0H0NuiPrXRH1rQNDZp0tqX8ijQkZxWRIKtquEPLP828DgQJ7w8bLZwqv/uP6u2cPhDB9ZtGgkZ9rpDoT3/CD4uvc3RHpQqh9hpV/VequqhV0nB5d2UV5nfnWoLtuDKCG3M/E56Afa9Zxv9A26WIgqjONKNybP4vj1oeSR1vtLPPmYLEmk5Pah2vWuiQlBWcH0NuiPrXRH5p0R9a6I+tdEenWeTuD+ 위험 규모를 알 수 없습니다. 총액만 공개하는 구조는 플랫폼 거래에서 흔하고, 실질 가치는 대상 표적 수와 옵션 행사 조건에 좌우되는데 이 역시 공개되지 않았습니다. 다만 릴리가 같은 날 두 건의 항암 거래를 동시에 발표했다는 점은 종양 특이 표적 발굴 역량 확보를 당면 우선순위로 삼고 있음을 보여 줍니다.", "strategy": "릴리의 다음 분기 10-Q에서 선급금 규모가 연구개발비나 지분투자 항목으로 드러나는지 확인하십시오. 계약에 포함된 표적 수와 모달리티 범위가 추후 공개되는지, 그리고 STP-100이 협력 범위에 편입되는지가 실질 가치 판단의 분기점입니다. 총액만 보도된 거래이므로 내부 비교군 산정 시 선급금 미공개 사실을 명시해 과대평가를 피하십시오.", "evidence_type": "거래-계약", "sources": [{"url": "https://medicaldialogues.in/news/industry/pharma/eli-lilly-inks-usd-59-billion-cancer-research-and-licensing-deal-with-stipple-bio-183467", "verified": "원문 직접 확인(최대 59억달러·선급금 및 지분투자 금액 비공개·STP-100 2027년 초 1상 예정 확인, 발표일은 요일로만 표기)"}, {"url": "https://www.manilatimes.net/2026/11/17/tmt-newswire/globenewswire/stipple-bio-announces-multi-target-multi-modality-oncology-research-collaboration-with-lilly/2471362", "verified": "검색 결과 스니펫만 확인(스티플바이오 보도자료 전재, 최대 59억달러·차등 로열티·전 세계 독점권 확인, 본문 미열람)"}, {"url": "https://www.fiercebiotech.com/biotech/eli-lilly-dots-59b-deal-stipple-unlock-oncology-targets", "verified": "검색 결과 스니펫만 확인(본문 미열람, 선급금·지분투자 금액 비공개 사실과 표적 수 미공개 확인)"}], "verification_note": "총액 최대 59억달러, 차등 로열티, 선급금과 지분투자 금액 비공개, 릴리의 전 세계 독점권, STP-100의 별도 자산 성격은 복수 매체에서 확인했습니다. 발표일은 보도자료 전재 기사의 게시 정황과 복수 매체의 2026-11-16 표기를 근거로 했습니다. 대상 표적 수, 모달리티 범위, 계약 기간, 옵션 구조는 어느 당사자도 공개하지 않아 확인하지 못했습니다. 스티플바이오 또는 릴리 공식 뉴스룸 원문은 직접 열람하지 않았습니다.", "image_concept": "A sealed envelope with its printed amount visible through the paper while a second, smaller figure stays hidden in shadow.", "img": "data:image/webp;base64,UklGRro+AABXRUJQVlA4IK4+AAAQrQGdASqwBCADPpFInUwlq6YtIvUpiaASCWluLXpYzzb//xSP/nOn8L9ZnCZNmerT3/5cv/rV+/4zpwLuAhn8JKuKf3J9/4NHajXl6A3mo5lP93z5vRlpVd+/+p87fSCEQmBSYOz9UgU/T1uM+ew8+qH3J8fs/YMT0K5f//i4f+mZ+uWbSr6f93xz9uqIvBJpCAC0qTwfKJ6Q8FSEAA8LKrPRsCu6eVIeCu6gxYeKFTDs9F7z9u++DSIFVl51Jt13O7DiapRXcbnln5keORMPPepq0Qm2Or0LYY6dI5CWG5hOSJ5IrtgJFx4Eag+3gBFFcVF5KMnyXQq/P6O3X9kB0mTDsz5i2SvPmk8GgZ8Cg//puKLFCph12g6g9vARuNqS4pCquzoAy17kdu/9Mwkx7wf+FXYpDJXeeDSOHuQf/ttvvSrlGaE y": "OBI파마의 대만 증권거래소 공시와 분기 보고서에서 선급금 인식 시점과 옵션 수수료 구조가 드러나는지 확인하십시오. 노바티스가 추가 페이로드 계열 옵션을 행사하는지가 이 거래의 실질 가치를 결정하므로 향후 12~24개월 옵션 행사 공시를 추적하십시오. 국내 ADC 기업의 페이로드·링커 거래 가격 비교 기준점으로 선급금 3,000만달러 대 총액 20억달러 비율을 활용할 수 있습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.biospace.com/press-releases/obi-pharma-signs-collaboration-and-license-agreement-with-novartis", "verified": "원문 직접 확인(2026-11-16 보도자료, 선급금 3,000만달러·총액 20억달러 초과·차등 로열티·전 세계 독점권·추가 페이로드 계열 옵션·링커 평가 확인)"}], "verification_note": "발표일 2026-11-16, 선급금 3,000만달러, 총액 20억달러 초과, 차등 로열티, 노바티스의 전 세계 독점권과 확대 옵션, OBI파마의 링커 평가 역할은 보도자료 본문에서 직접 확인했습니다. 페이로드 계열, 표적 항원, 옵션 수수료와 행사 조건, 로열티 비율, 마일스톤 세부 구성, 계약 기간, OBI파마가 보유하는 잔여 권리는 공개되지 않아 확인하지 못했습니다. 대만 거래소 공시 원문은 열람하지 않았습니다.", "image_concept": "A tiny brass weight on one pan of a balance, with a much larger hollow sphere resting on the other pan.", "img": "data:image/webp;base64,UklGRlYqAABXRUJQVlA4IEoqAAAQiQGdASqwBCADPpFIokylq6ctoNJogbASCWlu//VnP5eA6+jvS7UyJzv/pTPGjZt59xv5kB8uO5U/fc/p2bp3Z+XeOcP1C5uPSV+rvYN/XDqWeYn9u/V89KXoAf0vqVfQO/bH07/Z+/dzg/+nPWp/t/7z/ffA1iLfy/8h+2eNH5lagX43/T/1W4I8Av53/V/RR+484f6f0YemnguyLekJqLkDxNPhDB9Y82pp8ImT5OJArabNxIcsKJAneurHm4ktMY4fCGC6vuVmc8hCecNpv1CvsvndT7BoLJLZzMzT2/9x7CxeU41C9eZ2N3IxjhUR9hUJC1Y+snhoSBXZNXe1M0X794YRK7HrWI3f6if1ZmFCOzFq7v2vFtObyHzCFbm8Fr7UPr4jvlz77ah9ms5/OudF/C8To8zG0N7qny77Gr4+moLTGTtYT6xJivKafe67+ENGQgWyUoTB5ocd/pEZxXnWOm5bWHXgAkVrS62GmGWvOmbvwtsiGf1ZPTcqDil82wvAbuovgtMTdqafCRifBsfNOYL4JTLxgJvRi4/woLAN2sFk3fPfBM4N3/aR5cebYxy74td29dOj8mQldtCKymzJXOH+QLQ/FbaIO0jKbTGOHvXUstbATkE/qx5tckhd2oYhAMZW8yMQ5S2DFL5szrZd1P6NKu31ojTFrAWGrKqWxsbgtTT4Se7hjjzbpMBSaJsyW04+3vitJrV7MBcW5HFQMwqU2NdK90WbnETkPBnPt2lVbWM6zK78TgdNzoqjG19porFq/CGEbdfBXa+zu4m4UfttP53eSZ5mYryyAojHHQq+Vg0P3SA/x5XIxj2jSFesobHJVSM6Dpu3c5B9Y9byJWI0jO6rDhX5OLaaVpmNUrB9KYcOWlKRkuuAwmQHf9bIzv/5aNq1QKo86iJQf9+ohwxIyV2ReP20AaaS84xBC5b/g/CHjHR0y/qCy4tdL6+yaGNMY6XSt7EzzWmNg7wULIC/7UcFl5KEArVHw4ziZniN2AoDADMYHidisvniMyQ08CucLo9f7gN/donGygzjoj65VurZmyLn+QCeHFAEwgzt  특정 아이투 신주인수권의 행사 또는 소멸입니다. 로즈몬트는 10영업일 내 공개매수 개시와 Schedule TO 제출을 계획했고, 거래 완료는 2026년 12월 말을 목표합니다. 아이투의 제품에는 주요우울장애 치료제 EXXUA(제피론 서방정)와 ADHD 치료제가 있고, 로즈몬트는 유럽 미드마켓 사모펀드 인플렉션의 투자를 받고 있습니다.", "why_matters": "경구 액상 제형 전문 기업인 로즈몬트가 미국 중추신경계 브랜드 제약사를 사들이는 것은 제형 역량과 상업 인프라를 결합해 미국 시장에 진입하려는 전형적인 사모펀드 주도 플랫폼 확장입니다. 주당 2.70달러·30일 평균가 대비 41.1% 프리미엄은 스몰캡 상업단계 제약사의 공개시장 평가가 전략적 매수자 평가보다 크게 낮다는 점을 다시 보여 줍니다. 다만 총 지분가치와 아이투의 매출·부채 규모가 기사에 제시되지 않아 거래 배수를 산정할 수 없고, 신주인수권 처리 조건이 성립 요건에 들어가 있어 완료 불확실성이 남아 있습니다.", "strategy": "SEC에 제출되는 Schedule TO와 SC 14D9에서 총 거래 금액, 신주인수권 처리 조건, 해지 수수료, 주요 주주의 응모 확약 여부를 확인하십시오. 전일 종가 대비 프리미엄이 아니라 30일 평균가 대비 프리미엄으로 제시된 점은 최근 주가가 변동했을 가능성을 시사하므로 실제 프리미엄을 직접 계산해 보십시오. 국내 스몰캡 상업단계 제약사의 밸류에이션 비교군으로 활용할 때는 이 거래의 배수가 공개되는 시점을 기다리는 것이 안전합니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.manilatimes.net/2026/11/17/tmt-newswire/globenewswire/rosemont-pharmaceuticals-to-acquire-aytu-biopharma-to-accelerate-us-expansion/2471428", "verified": "원문 직접 확인(GlobeNewswire 보도자료 전재, 2026-11-16 자 보도자료, 주당 2.70달러·30일 평균가 대비 41.1% 프리미엄·공개매수 후 2단계 합병 구조·과반 응모 및 신주인수권 조건·12월 말 완료 목표·인플렉션 후원 확인)"}, {"url": "https://www.sec.gov/Archives/edgar/data/0001385818/000143774926037156/aytu20261116_425.htm", "verified": "검색 결과 스니펫만 확인(본문 미열람, 합병계약 체결일이 2026-11-16임을 확인)"}], "verification_note": "합병계약 체결일 2026-11-16, 주당 2.70달러, 30일 평균가 대비 41.1% 프리미엄, 공개매수와 2단계 합병 구조, 성립 조건, 12월 말 완료 목표, 로즈몬트의 인플렉션 후원 관계, 아이투의 제품 라인은 보도자료 본문에서 직접 확인했습니다. 총 지분가치, 아이투의 매출 규모, 거래 배수, 해지 수수료는 보도자료에 기재되지 않아 확인하지 못했습니다. SEC Form 425 본문은 직접 열람하지 않았습니다.", "image_concept": "A wooden auction gavel resting beside a small glass bottle with a measuring spoon, both on the same tray.", "img": "data:image/webp;base64,UklGRsIfAABXRUJQVlA4ILYfAAAQdAGdASqwBCADPpFIokylpKqoIVNoYVASCWlu/8s7JdWx2Ly7DKx4rdVSRvo+b+23rcuzZcXu7M/6lM3n/Q9cX6h9gf9dfPP/YD38+YD90PWe/5X7M+73/TeoX/Tup19ADzmv/f7RX9p/6uVOzOUyeYfXd3h8IM7h2bzEcLPFP/F6N/GZIzL2ofXxEH1kTGOHwhg+siYxw+EMH1kTGOHwhg+siYxw+FeoxLJUWiBQ4Ig+sfD+dqjIWSopxsFpjPPF8M5my2uu const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
