:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}

 "note": "웹에서 열립니다."}, {"label": "제1호", "date": "2026-10-20", "count": 30, "file": "https://bio.withsong.co.kr/archive/2026-10-20.html", "note": "웹에서 열립니다."}], "items": [{"id": "ai-a2z-omni-triage-fda", "cat": "ai", "alt": "여러 칸으로 나뉜 분류 트레이 가운데 한 칸만 부드럽게 빛나는 미니멀 일러스트", "title": "a2z 래디올로지 AI, 복부·골반 CT 분류 소프트웨어 a2z-Omni-Triage로 세 번째 FDA 허가를 받아 3개 기기 합산 26개 소견을 다루게 됐습니다", "short": "a2z 복부CT AI 허가", "date": "2026-11-19", "scope": "글로벌", "entity": "a2z Radiology AI", "what_changed": "a2z 래디올로지 AI는 2026년 11월 19일 비즈니스와이어 보도자료로 복부·골반 CT 분류(triage)·알림 소프트웨어 a2z-Omni-Triage가 FDA 허가를 받았다고 발표했습니다. 이 제품은 중등도 이상 흉수, 기흉, 복합 흉막액 저류, 장 천공, 중등도 이상 수신증, 5cm 이상 대동맥류, 천골 외 골반 골절, 천골·미골 골절, 연부조직 농양 등 9개 소견을 표시합니다. 대상은 조영제 사용 여부와 관계없이 촬영한 22세 이상 성인의 복부·골반 CT입니다. 기존 a2z-Unified-Triage(7개 소견), a2z-Abdo-Triage(10개 소견)와 합쳐 3개 기기에서 26개 소견을 다루게 됐습니다. 판독은 기존 표준 진료와 병행하며, 알림을 받은 의료진이 전체 영상을 직접 확인할 책임을 진다고 회사는 밝혔습니다. 보도자료에는 허가 번호와 결정일, 민감도·특이도 같은 성능 수치가 나오지 않습니다.", "why_matters": "응급 영상 AI가 질환 하나를 찾는 단일 기능에서 한 번의 CT로 여러 응급 소견을 함께 거르는 포트폴리오 방식으로 넓어지고 있음을 보여 줍니다. 국내 흉부·뇌 영상 AI 기업에도 소견 수를 늘려 가는 경쟁이 복부 CT로 번지고 있다는 신호입니다.", "strategy": "다중 소견 분류 제품은 허가를 소견별로 쌓아 가며 범위를 넓히는 방식이므로, 허가 건수보다 실제 응급실 판독 대기시간 단축 근거가 확보되는지 지켜볼 필요가 있습니다. 국내 기업은 복부 CT 응급 소견을 비어 있는 영역으로 보고 파트너십이나 자체 개발 우선순위를 다시 검토할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.financialcontent.com/article/bizwire-2026-11-19-a2z-radiology-ai-expands-acute-care-suite-with-third-fda-cleared-device", "verified": "원문 직접 확인(2026-11-19 비즈니스와이어 보도자료 전재본, 9개 소견 목록, 22세 이상 성인 대상, 3개 기기 26개 소견, 경영진 발언 확인. 허가 번호·결정일·성능 수치는 기재 없음)"}], "verification_note": "회사 보도자료만 확인했고 FDA 510(k) 데이터베이스에서 허가 번호와 결정일은 확인하지 못했습니다. 성능 수치도 공개되지 않았습니다.", "image_concept": "A single sorting tray with several small compartments, one of them glowing softly to signal urgency.", "img": "data:image/webp;base64,UklGRpAlAABXRUJQVlA4IIQlAABwrAGdASqwBCADPpFIo0wlq6stIhJIyaASCWlu3OS9G2N6AORQMcso3+Xr+97JPPv+doT14K8B042XD03M6CmbzTfGNYW6PqD3CfPHadxT7PdkDh2n/3PfO9c2Hh6+1n41fH  초음파를 아우르는 최대 1억5,000만건의 추가 영상에 대해 AI 모델 학습·검증 이용권도 확보했다고 밝혔습니다. 자금은 주로 영상의학과 전문의 채용과 유지, 임상 자원, 운영 인프라, 의사용 기술에 쓰일 예정입니다. 회사는 2억건 이상의 자체 영상 데이터로 만든 FDA 허가 AI 기기 여러 개를 보유하고 있다고 주장하지만 제품명은 밝히지 않았습니다. 같은 보도는 28개 주 이상에서 연 200만건 넘게 판독하고 연말까지 영상의학과 전문의를 200명 이상으로 늘릴 계획이라고 전했습니다.", "why_matters": "영상 AI 경쟁력이 알고리즘보다 대규모 학습 데이터 이용권과 판독 인력을 함께 쥔 서비스형 사업자로 옮겨 가고 있음을 보여 줍니다. 판독 인력 부족 문제를 AI 단독이 아니라 ‘의사+AI’ 운영 모델로 풀려는 자본이 몰리고 있다는 신호입니다.", "strategy": "국내 영상 AI 기업은 소프트웨어 판매만이 아니라 원격판독 사업자와의 데이터·배포 제휴 모델을 함께 검토할 필요가 있습니다. 미국 시장에서는 데이터 이용권 규모가 협상력이 되므로 병원 데이터 파트너십 조건을 미리 정비할 만합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.unite.ai/imagen-raises-over-100m-in-growth-capital-for-radiologists-and-ai/", "verified": "원문 직접 확인(2026-11-19 기사, 회사 11-18 발표 인용, 1억달러 이상 성장자금, 최대 1억5,000만건 영상 이용권, 자금 용도, 임원 발언 확인. 투자자명·구조는 미공개)"}], "verification_note": "회사 보도자료 원문을 직접 찾지 못하고 전문 매체 보도로 확인했습니다. 투자자, 지분·부채 구분, 밸류에이션은 공개되지 않아 거래 유형을 확정할 수 없습니다.", "image_concept": "A tall stack of translucent film sheets beside a single magnifying lens resting on top.", "img": "data:image/webp;base64,UklGRrRKAABXRUJQVlA4IKhKAADQPAKdASqwBCADPpFIn0wlszewIvHpEvASCWdu/+9p395pRvtg7Cz97zrjvb60y/8Rt5Bv8nIIpFc/tznv9U+4v9f1zfTrkQ+x4jf+Nmh/7nqk/VnTz9SX9Y9D3n+epD/6+mB6f+9Qest/f9/66XeP/5D2y/jX73zXct/3XZ7DE/If2/xcf3Lz+IlHIqgP9F/vPrfTpP8PSV6fd/MeI8LH55/5f3t+BsSZjrSqLZgEkyQy8bailUWzAI/mPHjjbVJkhl421FKotmASTJDLyhDqQgM2FbdxgBUSVGwJo5ih7pvD332peIHNlCpmlpuW/9hAz2FRPdKDEwkMs34fQwq0qsAO7XzrNJMkMvIYtLHnHTlWkPlWXXVZG2opVHDmod5QQaC4AkZqloS0VMkIqVcLLcF5qFi2hSqLabLPVB4SlDzstKo4c1V32mmgJgiQ2ySZIZeMwVZ2TcYBB5JJ95JN6Gc2IuIqTUbPLpCgPLz0FiyhTGFWkTJ+qR2IkUhbJw0iSVLgOzAp+yLZgEkyQh5YEyyg5jVFG429kyLbCj9GyDGIOtKotmC9Sxr4D2j7tmdp+yLZeuDSaOjSv9MLClUWzOeSqDZkbgA6BW0yoi6y66RzgG3+xkhDuTVTVTZk3wEHklS6FpIqaqUtQSSej4MvG2orGB/2Pzgpae5gJHvIUOGQAZ8jVnaP9zS3wSTSjAIMb1XBMEL5Jxvg9olWq9bBkcY0l8kOF1RhuBLYFar0h8lrV0TbaUCDlI21FIlKoqHJp4m5FQ025Vpd0pC5jUPJFVlBjN6fC+MT4izX71+iI27WL6UJmunbPFt/ZtlGhFWLAYqfxa0epHuO1irp4GEg2TcYBMDDd9WaQtWaQtmASShKmzGHX6Yq6 ner Health, Layer Health", "what_changed": "미국 배너헬스가 임상 레지스트리 AI 기업 레이어헬스에 전략 투자하고 다년 엔터프라이즈 파트너십을 맺었다고 11월 19일 보도됐습니다. 투자 금액은 공개되지 않았습니다. 배너헬스는 외부 업체에 맡기던 레지스트리 업무 대부분을 AI 보조 내부 프로그램으로 옮겨 품질 데이터를 직접 보유하겠다고 밝혔습니다. 대상은 심혈관, 수술, 종양, 뇌졸중 프로그램이며 미국심장협회, 미국외과학회, 미국심장학회 레지스트리 제출을 포함합니다. 레이어헬스 플랫폼은 정형·비정형 종단 의무기록 전체를 읽고 추출한 답마다 근거 문서를 연결합니다. 배너헬스는 6개 주 33개 병원, 450여 진료 거점, 환자 350만명 규모입니다.", "why_matters": "레지스트리 초록 작성은 사람 손이 많이 드는 대표적 병원 행정 업무로, 아웃소싱을 AI 내재화로 대체하는 흐름을 보여 줍니다. 병원이 고객이자 투자자가 되는 구조가 반복되고 있습니다.", "strategy": "의무기록 추출 AI 기업은 근거 문서 연결(감사 가능성)을 앞세워 품질 보고 업무부터 공략하는 경로를 참고할 만합니다. 병원은 외주 비용 대비 내재화 효과를 측정 지표로 미리 정의할 필요가 있습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://hitconsultant.net/2026/11/19/banner-health-strategic-investment-layer-health-enterprise-clinical-registries/", "verified": "원문 직접 확인(전략 투자·다년 파트너십, 금액 비공개, 4개 프로그램, 외주에서 내부 전환, 배너헬스 규모, 최고품질책임자 발언 확인)"}], "verification_note": "레이어헬스·배너헬스 공식 보도자료 원문은 찾지 못했습니다. 투자 금액과 시간 절감 수치는 공개되지 않았습니다.", "image_concept": "A magnifying glass resting on a thick stack of folders with thin threads linking each highlighted line to its page.", "img": "data:image/webp;base64,UklGRl41AABXRUJQVlA4IFI1AACQ0wGdASqwBCADPpFIoUylpCcrIVGouWASCWdu/+M9hf/qEF/tq/Obu8mJccNOTVlP3YczbVLsbzXzJhP/yf8dp+ObX1x/Q85nnvzaf9T1hfqL2DP7/5Vv6ze/HzB/zD/l+sX/xPU//Yf9l+yfwAf1n/cel37Jv7sewh+0npu/vJ8MX9n/2/7z+2B//9a5m/U7QJnaf+2+IRkb2yYCO56muZAXnn4Tn5Hog/97zPv0guY3x5Xm6SMeI0kY8RpIx4jSRjxGkjHiNJGPEaSMeI0kY8R8N+Pq+9+zapW+PLJMtYrmB46ShOGdjyHYIDdJ1tDzvSpk8LJiY32JpIx1/O0zQ43lebpIx4jSRjxGlgLi9poz0KJpI4+Z3WQ3x5XSmgfYkbTASHm6s/n/KbyvOIypql6DteK4jSUFrHigzVXrLnmICeQHlrWWLNUrfPm9iA+xNJzLzdvn51PCZ/4fhHj9fvubMWlB/e+JUDpqlZu6ecUBuPF9JD7Ei7tD8huHDqDr7N9Un+k30PzJtxnzGZf8M4pV4pmhxvc6eJkW0PYXlrHDsZCWVlVn9LOakKtl5jfnCnEaSNFxmDed4GRrE0kY8feTVaNJHDsY8Y15ukjJqMWkdl/c2J6pXYHbq6hvEwkouZFrGOsOD5Pl/y3Nd/gqhEwjTdSg6EkiBwTv9K4KbDKjCCu6xjxHeQCWKxNJGPnckdayucTtUF7f9nk/vzsc+YsU+cIX6QunLKch46aggEZ8QjMnvzSXUMhartswKFIUqBuwvLaHpKC5dN1FRMqgcumBukeg9GsSOHzdK3yUwgBeylw4v/xlIlVnF 8", "scope": "글로벌", "entity": "Stanford Medicine, Aimbient(옛 Surgical Safety Technologies)", "what_changed": "스탠퍼드 연구진이 11월 18일 JAMA Surgery에 연구 서신 ‘수술실 앰비언트 기록을 위한 컴퓨터비전 검증’을 온라인 게재했습니다(doi: 10.1001/jamasurg.2026.5500). 회사 측 설명에 따르면 연구는 스탠퍼드헬스케어 수술실 14곳과 시술실 1곳에서 8개월간 연속된 모든 수술을 대상으로 했습니다. 에임비언트의 실시간 컴퓨터비전 시스템과 수기 EHR 입실·퇴실 시각을 맹검 영상 판독 기준으로 비교했습니다. 두 방식 사이에 통계적으로 유의한 차이가 없었고, 간호 수기 입력은 평균 5~6분 늦었으며 야간과 장시간 이식 수술에서 정확도가 떨어졌다고 회사는 밝혔습니다. 에임비언트는 650개 수술·시술실에 배치돼 있다고 주장합니다.", "why_matters": "앰비언트 AI가 진료 대화 기록을 넘어 수술실 운영 데이터(시각 기록)로 확장된다는 동료심사 근거입니다. 수술실 가동률·스케줄링 지표의 기초 데이터를 자동화할 수 있다는 점에서 병원 AX의 실질 사례가 됩니다.", "strategy": "수술실 효율화 솔루션은 ‘사람과 동등한 정확도’ 검증을 도입 근거로 삼는 전략을 참고할 만합니다. 병원은 영상 기반 기록 도입 시 의료진 동의와 영상 보존 정책을 함께 설계해야 합니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://jamanetwork.com/journals/jamasurgery/article-abstract/2856949", "verified": "원문 직접 확인(논문 제목, 저자, 11월 18일 온라인 게재, DOI, 연구 서신 형태 확인. 증례 수와 수치 결과는 초록 페이지에 없어 확인하지 못함)"}, {"url": "https://hitconsultant.net/2026/11/18/aimbient-ai-automates-or-documentation-human-accuracy-stanford-jama-surgery/", "verified": "원문 직접 확인(8개월·14개 수술실+1개 시술실, 유의한 차이 없음, 수기 입력 5~6분 지연, 650개 방 배치 확인)"}], "verification_note": "정확도 비교 결과와 연구 규모는 회사 측 요약에 근거하며, 논문 본문에서 증례 수·통계 수치를 직접 확인하지 못했습니다.", "image_concept": "A stopwatch mounted above an empty operating table, its hand frozen exactly at the moment a door swings open.", "img": "data:image/webp;base64,UklGRk4qAABXRUJQVlA4IEIqAADQgwGdASqwBCADPpFIoEylp6alodD4oPASCWdu6j+NApl6HFAjAE9o2sp0fZY5FB/6zwFu2+J/v/7e/4vpauRvnf63/tPuv84+zvPa8n/bP0l/dveX/0vU/+hP91/Xf3////2B/qh+0frjetHzC/tr6zv+09Sn+Y/3/sB/2vqFPQT/c/05/Ze/rn/Y6gD//+3303/Zz/b+sq5W5isU7TQ2ZvOIAPrv5+80H8eo28rzfk/KDCH2JpI4UTSRwomlDK4zSRwomkjhRNJHCiaSOFE0kcKJpI32esMlVEn7lcPfI83xrPSyc1STweoxflehpI4gcOkdUdiyVCffGjQz9OTkdLJTpI3zwv4FGlR7WV1JW+SmNp+mycSOFBkH3Q0rmZ1AceUMWAIvA+MPgObt8B3lehpQOV/0QiYj37v8mj48skzHKuC+U1lMY2rrxJjSRwomkkmlTp/pYlyD88ZpJRyC9P9KBmoUTR1XlehpI4R5NHYdm8r0Nvn2Jpy8NsaIkYY5JKxzpYvwCOlb3/+cTMBJt3ub9iaR794HxU 었다는 연구를 인용해 전문가 중심 관리체계를 강조했고, 소비자단체 측은 법정 상한인 20개 품목까지라도 채워야 한다고 주장했습니다. 대한약사회는 확대 전제 논의라며 불참했고, 오후 분임토론은 비공개로 진행됐습니다.", "why_matters": "정부가 주최한 첫 규제갈등 해결토론회라는 점에서 이후 국조실의 연내 규제개선안 검토 방향을 가늠할 첫 공개 자료입니다. 제산제·지사제·인공눈물 등 확대 후보 효능군이 거론되면서 일반약 제조사와 편의점 유통 채널의 이해관계가 구체화됐습니다.", "strategy": "일반약 보유 제약사는 확대 후보 효능군에 해당하는 제품의 안전성 자료와 소포장 공급 역량을 미리 점검할 필요가 있습니다. 약사회가 11월 25일 별도 국회 토론회를 예고한 만큼 연말 국조실 개선안 발표 전까지 양측 논리를 함께 추적해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.kukinews.com/article/view/kuk202611190089", "verified": "원문 직접 확인(11월 19일 국회 개최, 주최 기관, 13개 중 11개 판매, 발제자 발언과 응급실 14.3% 수치 확인)"}, {"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=549361", "verified": "검색 결과 스니펫만 확인(본문 미열람, 소비자단체의 20개 품목 확대 주장)"}, {"url": "https://dailypharm.com/user/news/344805", "verified": "검색 결과 스니펫과 목록 제목만 확인(본문 미열람)"}, {"url": "https://dailypharm.com/user/news/344623", "verified": "원문 직접 확인(약사회 불참 방침, 약사회 11월 25일 별도 토론회, 국조실 11~12월 개선방안 검토 계획)"}], "verification_note": "국무조정실 공식 보도자료 원문은 찾지 못했고 언론 보도로 확인했습니다. 비공개 분임토론 결과는 확인되지 않았습니다.", "image_concept": "A small convenience-store shelf with a single empty slot between a few plain medicine boxes, lit by a hanging scale balancing above it.", "img": "data:image/webp;base64,UklGRgAkAABXRUJQVlA4IPQjAACQaAGdASqwBCADPpFIoE0lo6aooJE4kRASCWlu+EdOTPAtrbgXiiPrFFP0n9f7zMjvpv8d+P3Vx8+eTfjNwuPmed/zB7Wv9j63v0N7AH6efsD67frZ/qPoF/cf9wveg/3P7Oe7z/F+oB/W+pB9A/y4/Zq/tH/k9MD1AP//wavqS1b/IbmPs5l5YA+9Wmj/YlHPlFni/BkJTT4QwfWRLqafCGD6yJdTT4QwfWRLqafCGD6yJdTT4QwfWRPFdmlCL92qL6zZfhtMcPhDB9ZEuY1WQX0OAhkshuIfYbijVZEvz6+nJuUwVKjtfXxTtfXyDfVkc+69mX18g5LU08aLU0+EMH158BWUrfdL24ishgvhBvqyJdTT4kNUQHQqKZSL94O6E42HvX0Lpt4YPrK2HwOhZNLU0+EMH4CHltK7tb3awfWRkBDELBkEMIMYRfv3hhp8zvD5BvqyJdTT53r5CPMV2aT2bYj+rIyAhgv11o+siXX+3xErcQ+vina3u1g+uMeMLtm0ru2DdZMdek4BD4NvYLOrqljpUDrBROGD69s6KzKFXfFbS/PoTbn2ae9XhCmW+vkvXeyXSu7X33Y4+TZtLqYqv+AxX8NjFwxoYPrIyAhg+siXVF5bS6n5fWRK4onDEK+vriu/V+d6+KEtgKWCokmWh62ueZhtbZp72qL0KiPhDB9LdrCJWvkG+zq7tTT4QwfWRPFeviHFNzItgr6 년 5~6%보다 낮다고 보도했으며 주가는 약 2~3% 떨어졌습니다. 경영진은 가이던스에 대형 M&A를 가정하지 않았고 20억달러 이하의 중소형 거래를 이어갈 것이라고 말했습니다.", "why_matters": "주력 제품의 특허 만료와 IRA 가격 인하를 앞둔 상황에서 빅파마가 성장 목표를 낮춰 잡은 사례로, 업계 전반의 성장 둔화 우려를 보여 줍니다. 대형 인수 대신 중소형 외부 도입 기조를 밝혀 바이오텍 라이선스 시장 수요에도 의미가 있습니다.", "strategy": "노바티스는 이미 출시된 제품의 최대 매출 전망을 올려 특허 절벽을 메우겠다는 전략을 내세웠습니다. 장기적으로 매출의 약 절반을 외부 도입 자산에서 얻겠다며 초기 단계 중소형 거래를 계속할 방침입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.novartis.com/news/media-releases/novartis-projects-5-cc1-sales-cagr-through-2031-and-sustained-mid-single-digit-growth-over-long-term", "verified": "원문 직접 확인(2026~2031년 연평균 5%, 2029년 이익률 40% 이상, 케심프타·셈블릭스·레크비오 상향, 판독 35건 이상 확인)"}, {"url": "https://www.biospace.com/business/novartis-projects-slowed-growth-pins-hopes-on-billions-in-pipeline-potential", "verified": "원문 직접 확인(대형 M&A 미가정 발언, 20억달러 이하 거래 계획, 외부 자산 매출 비중 약 절반, 주가 약 2.6% 하락 확인)"}, {"url": "https://1027wbow.com/2026/11/19/novartis-sets-lower-annual-sales-growth-target-through-2031/", "verified": "검색 결과 스니펫만 확인(로이터 전재: 기존 5~6% 대비 하향, 본문 미열람)"}], "verification_note": "성장률·이익률·최대 매출 수치는 공식 보도자료로 확인했습니다. 기존 가이던스보다 낮다는 평가는 로이터와 BioSpace의 해석이며, 대상 기간이 달라 단순 비교가 어렵다는 지적도 있습니다.", "image_concept": "A long staircase whose steps become slightly shorter as they climb toward a distant door.", "img": "data:image/webp;base64,UklGRngYAABXRUJQVlA4IGwYAACwOwGdASqwBCADPpFIpEynp6uoIhOIYXASCWdu+ChucQl9ZLGNr/r6OzE/zdmPVqaD3dY1cEXmmiP6Fv5op4/Pf1X9xOKa1gZlXjj9B/9H+l+3r/i+q38oewB/g+jv5ovOQ/zfr0/0fqP/4zzgPY39EPy6/at/d3K5qnacTI0H83nLi8z7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz2WGK6eCGEykYrwFtwpFz3HS0siN2LzLnvO0ecuJ5ZhaZOgXF04S3Yw6zPtzPXDj/mA04S0WfbuUZfT1rnTqZSjzlxesJLXHmBl7eQfOoTbaQ9JgXHWxhOFKRuJEaLRivClI3C3aNhMpGdOFKPQLkQHM+3NCzugqo1g25wtc9wL28YsEMkNMn368Bk9eMXWhivClCaV4UpNUvKTI2xeEoN3y5O5y4vfX55+R4YvbV5qZ4LcTnA/H82jGhVMKPkLi8z7dwMQV1QKUecuLzPtpwluvDiI7XkBzPsBIcXk2GhfqeWc2z955y6NhSjzlxeZ9uZ9fNow298lgx/OkF5QSJPRynS0q3YvNkjCW5ewO7vBAG9YRkcEd47Ml4rkqobEiFLoqBTZfoxXgIBi6cJbrsTxLFc5O8cVRqvr/FeFLAsCD/sErbj4utg7 26년 11월 19일 각각 이사회를 열어 HLB가 HLB생명과학을 흡수합병하는 안을 의결하고 DART에 회사합병결정 주요사항보고서를 냈습니다. HLB생명과학 보통주 1주당 HLB 신주 0.0857532주를 배정하며, 합병가액은 HLB 3만63원, HLB생명과학 2,578원입니다. 보도에 따르면 주식매수청구 규모가 200억원을 넘으면 양사가 진행 여부를 협의하고 합의하지 못하면 계약을 해제할 수 있습니다. 양사는 지난해에도 합병을 추진했으나 매수청구액이 해제 기준인 400억원을 넘어 철회했습니다. 합병이 끝나면 HLB는 항암제 리보세라닙의 국내 독점 개발·판매권과 일본·유럽 수익배분권을 직접 보유하게 됩니다. 양사는 사외이사 특별위원회와 외부 자문으로 합병비율 공정성을 보강할 계획입니다.", "why_matters": "리보세라닙 상업화를 앞두고 그룹 안에 흩어진 권리와 연구 인력을 한 법인으로 합쳐 의사결정을 단순하게 하려는 지배구조 재편입니다. 지난번 실패 원인이던 매수청구 한도를 오히려 200억원으로 낮춰 조건이 더 엄격해진 점이 성사 여부의 관건입니다.", "strategy": "HLB는 신약 권리 통합과 함께 HLB생명과학의 의료소모품을 자사 유통망으로 교차 판매해 시너지를 내겠다고 밝혔습니다. 주주 설명회와 매수청구 결과가 성사 여부를 가를 것입니다.", "evidence_type": "공시", "sources": [{"url": "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261119000398", "verified": "공시 목록과 문서 표지만 확인(HLB 주요사항보고서(회사합병결정) 2026-11-19 접수 확인, 본문 수치 미열람)"}, {"url": "https://www.ittimes.com/news/articleView.html?idxno=88072", "verified": "원문 직접 확인(합병비율 0.0857532, 합병가액 3만63원·2,578원, 리보세라닙 권리 통합, 지난해 매수청구 400억원 초과로 철회, 특별위원회 구성 확인)"}, {"url": "https://m.news.nate.com/view/20261119n34061", "verified": "검색 결과 스니펫만 확인(매수청구 한도 200억원, 본문 미열람)"}], "verification_note": "DART 접수 사실은 공시 목록으로 확인했으나 공시 본문은 열지 못해 수치는 언론 보도 기준입니다. 200억원 한도는 검색 스니펫 기준이며 합병 완료 시점은 보도마다 엇갈려 쓰지 않았습니다.", "image_concept": "Two streams of ink flowing together into a single glass bottle.", "img": "data:image/webp;base64,UklGRgwgAABXRUJQVlA4IAAgAABwUAGdASqwBCADPpFIok0lpKc3IPP4KuASCWlu4IWt5prtC3tC9zjWB1pK+t/xn7of3T3+bm/lv7bzjVmed50n50PRp+mfYL/XDpieYT9qv3C93z0vf3n1Bv7j1QfoAfs76eHs8f2j/pcH/06fZsymHoy1Px5olPGAh9acOHDhw4cOHDhw4cOHDhw4cOHDhw4cOHDhw4cOHDhw4dBmz4vh9ALj/nHNZ/aiJfAiofCH+X9598ylyFqlOSeuzitQ3i4dbtOHDkBTjsQrBnW8Czo45AFLNo7tniNrFhBIIaKPfo1nxZGviaNZukhSbvdePB5EJp/f6rV9s2IevXsat14buSYdUd5RqKMjlWoWLGTJahYXrF0EdxKWanhIclu2Qp4WST5jmkX1G7YHLw61P8Bdcc3OQbYEWJ07xMoEDS+rXBmpIgrVszomHHRhf7gAPWHK7XkMhatWakpY4wREUsdkHOyCEYdrCUgQE+y4q12QgQNDzKSN5Hn2WWuBI8l5m2Qs8HkQVvF4+9xKUQOgOFmeqxP7RlsWLFiwdg0B0cC4jHzC/M5r2DBdSRkymFDxza2q+OBmpp8/jc/TbY const CATS = {

  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},

const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
