 최고가에 가산을 받은 조건으로 협상을 마친 것으로 알려졌으며, 건정심을 거치면 이르면 11월 등재됩니다.", "refs": ["reg-xcopri-price"]}, {"head": "면역질환 치료 기전이 IL-17·IL-6 너머로", "body": "애브비 루티키주맙이 화농성한선염 3상에서 IL-1 계열 효과를 보였고, 코센틱스는 류마티스성 다발근통으로 IL-17A의 적응증을 넓혔습니다.", "refs": ["bio-abbvie-lutikizumab", "reg-cosentyx-pmr"]}], "priorities": [{"head": "생성형 AI 기기 시판 후 관리 체계 선제 설계", "body": "FDA 지침 초안 전에 드리프트 모니터링, 이상사례 보고, 모델 정보 라벨, 변경관리계획(PCCP)을 제품 기본 기능으로 준비하고 병원 계약의 책임 분담 조항을 정리해야 합니다.", "refs": ["dh-genai-accountability"]}, {"head": "Epic 공개 MCP·API로 연동 비용 절감", "body": "Epic 고객 병원에 공급하려는 기업은 공개 MCP 서버와 템플릿을 활용하고, Epic이 기본 기능으로 넣는 신원 확인·약가 비교 영역의 차별화 전략을 점검해야 합니다.", "refs": ["dh-epic-open"]}, {"head": "비대면진료 시행규칙 의견 제출(11월 9일 마감)", "body": "플랫폼과 연계 약국·제약사는 처방일수와 지역 제한 시나리오별 만성질환 재처방 수요를 추정하고 의견수렴 기한 안에 근거 자료를 내야 합니다.", "refs": ["reg-telehealth-rule"]}, {"head": "해외 진출은 허가 전 현지 유통·조달부터", "body": "선주문 유통 체계, 대형 판독 네트워크 평가 계약, 국제 조달 가격과 장기 운영 재원을 허가 일정과 함께 설계해야 파일럿에서 매출로 넘어갈 수 있습니다.", "refs": ["ai-raonmedi-japan", "ai-krsnaa-azmed", "ai-khidi-unitaid"]}, {"head": "국내 허가·약가 일정의 예측성 확보", "body": "식약처 목표 허가일 준수 지표와 엑스코프리 가산 사례, 27일 종합감사 결과를 반영해 신청 품목의 허가·급여 일정과 가격 전략을 다시 짜야 합니다.", "refs": ["reg-mfds-review-staff", "reg-xcopri-price", "reg-abortion-pill-rmp"]}]}}, "archive": [{"label": "제4호", "date": "2026-10-23", "count": 21, "current": true}, {"label": "제3호", "date": "2026-10-22", "count": 19, "file": "https://drive.google.com/file/d/1xNJus1HEx8zmpysED3JVcKJFSk5ZvQWr/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제2호", "date": "2026-10-21", "count": 27, "file": "https://drive.google.com/file/d/1nJaSRTNRptetHTgBeQVovI5R-GMIY1cn/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제1호 · 창간호", "date": "2026-10-20", "count": 30, "note": "구글 드라이브에서 열립니다."}], "items": [{"id": "ai-rivanna-boneenhance", "cat": "ai", "title": "RIVANNA, 휴대형 초음파 ‘Accuro XV’의 첫 머신러닝 모듈 ‘BoneEnhance’로 FDA 510(k) 허가 획득", "short": "RIVANNA 골영상 ML 허가", "alt": "휴대형 초음파 탐촉자의 빔 안에서 반투명 유리 뼈가 은은하게 빛나는 미니멀 일러스트", "date": "2026-10-22", "scope": "글로벌", "entity": "RIVANNA(미국)", "what_changed": "RIVANNA는 휴대형 진단 초음파 Accuro XV에 들어가는 머신러닝 소프트웨어 모듈 BoneEnhance가 FDA 510(k) 허가를 받았다고 발표했습니다. 이 모듈은 볼류메트릭 초음파 데이터에서 뼈와 주변 조직을 분할하고, 2D B-mode 영상 위에 색으로 구분한 라벨을 겹쳐 표시하며, 3D 골격 시각화를 지원합니다. 원본 영상 데이터는 바뀌지 않습니다. 검증에는 8개 기관이 참여했습니다. 3곳은 학습 데이터, 5곳은 독립 테스트 데이터를 맡았고, 테스트셋은 233개 볼륨(173명, 6만 9,900장)이었습니다. 영상의학 전문의 3명이 정답 라벨을 정했으며, 볼륨별 라벨 예측 정확도는 95.1~100.0%였습니다.", "why_matters": "X선 촬영이 어려운 현장에서 초음파로 골절을 평가하려는 흐름에서 첫 단계에 해당하는 허가입니다. 다만 이번에 허가된 범위는 뼈 구조를 분할해 보여 주는 기능까지입니다. 골절 탐지 모듈은 아직 연구용이며 허가를 받지 않았습니다.", "strategy": "하드웨어를 먼저 허가받고(Accuro XV, 2026년 4월) 그 위에 AI 모듈을 하나씩 추가 허가받는 단계적 전략입니다. BARDA 계약(75A50121C00035)의 지원을 받아 응급·재난 현장을 겨냥하고 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "http://www.prnewswire.com/news-releases/fda-grants-510k-clearance-for-boneenhance-the-first-machine-learning-layer-on-rivannas-accuro-xv-platform-302917179.html", "verified": "원문 직접 확인"}, {"url": "https://orthospinenews.com/2026/10/22/fda-grants-510k-clearance-for-boneenhance-the-first-machine-learning-layer-on-rivannas-accuro-xv-platform/", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "회사 보도자료에 근거한 내용입니다. FDA 510(k) 데이터베이스의 허가 번호와 정식 적응증 문구는 직접 확인하지 못했습니다. 보도자료에도 정식 indications for use 문구는 없습니다. 상용 출시일과 가격은 공개되지 않았습니다.", "image_concept": "A translucent glass bone glowing softly inside a handheld ultrasound probe's beam.", "img": "data:image/webp;base64,UklGRiokAABXRUJQVlA4IB4kAADwnAGdASqwBCADPpFIn0ylpCooIXJoeUASCWlu+BA7Q8n0Z5Ifr2VzWRfwvwcjjnxLuEn+M0weFgXh3fZ7n73X7LqipX+vy+22bBEu5RP6dR7Zx54n6//Xz92enAEjAgA/+gIy6eNysEZdPG5WCMunjcrBGXTxuVgjLp43KwRl4ODnoCKnFRyCXbhKOngFGVhkleZYpnk5noCN5b3jlz8rBGZwlaPOKiLwNvppwZ3or/6AkvFICx/1yeNysEuBawLR5WGcLSCtAf/QEZbRLohIcI0/TQiwEZGDLp8xzOOx4AIqQT0A5XnGWnLPXic0FH6fJhQ51fycz0BGXVQSQHgDltvEyBjFZPavqkAQRstkTlQEZGVtEcopgD/YpVkpAKu/tYG5ADrukrtf/P60+P9C5n0CickrzPQEZp6PbGb7X+yoqV+VgjLaLK3jboypBcnjcq+qE/2KVDWYC7LFKkUeGnr+366mD1VETCPoQsffyuoAAguahP/oByn7E0kHq16byGuWq/9xccuqjBkLCXhYnlRYgCv1B+Qt2yq8z2Mtv , "scope": "글로벌", "entity": "Eko Health(미국)", "what_changed": "Eko Health는 하나의 청진판으로 아날로그 청진과 디지털 청진을 모두 할 수 있는 CORE 300이 FDA 510(k) 허가를 받았다고 발표하고 10월 22일 미국에서 판매를 시작했습니다. 성인과 소아 환자에게 사용할 수 있습니다. Eko 앱과 연결하면 이미 FDA 허가를 받은 구조적 심잡음 탐지 AI를 쓸 수 있고, 최대 35배 증폭, 능동 소음 제거, 실시간 심박수 표시 기능이 있습니다. 가격은 프리미엄 일반 청진기 수준이라고만 밝혔습니다.", "why_matters": "AI 판독 기능을 1차 진료의가 매일 쓰는 청진기 가격대로 낮췄습니다. 심장판막질환 같은 구조적 심질환을 선별하는 AI가 전문의 장비에서 일반 의료진 장비로 넓어지는 계기가 될 수 있습니다.", "strategy": "하드웨어 판매 가격 장벽을 낮추고, 앱과 연결되는 AI 소프트웨어로 사용자를 붙잡아 두는 플랫폼 전략입니다. 미국 출시 뒤 캐나다, 영국, 일부 유럽 국가로 판매를 넓힐 계획입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/eko-health-launches-core-300-to-bring-ai-enabled-stethoscopes-to-every-healthcare-professional-302914950.html", "verified": "원문 직접 확인"}], "verification_note": "보도자료에는 기기 허가 번호로 K261694, AI·소프트웨어 허가 번호로 K251494가 링크돼 있습니다. FDA 데이터베이스에서는 두 번호를 직접 확인하지 못했습니다. 문맥상 AI 심잡음 탐지 기능은 이번에 새로 허가된 것이 아니라 기존 허가를 활용하는 것으로 보입니다. 구체적인 가격은 공개되지 않았습니다.", "image_concept": "A stethoscope chestpiece split into two halves, one brass and one glowing circuitry, joined at the center.", "img": "data:image/webp;base64,UklGRl49AABXRUJQVlA4IFI9AAAw6QGdASqwBCADPpFIokylpLIoIdOYakASCWdu4Tq9o78fXWXhLHa5vvz0tdaFbRcH7jh7JepDyj5ijLvUn1f+z65dwZ5uPOa9R3+H37Xek/8Tk3HE0Z1IRu0g036vrK/b+oF57+DzQN8YHRY9jcFkKxwFungRl7aKYIDkcWALcrcyXtopgFuVuZL3lHooXtopgd0AW6Kj8XSEuvSTOIe0zLjxMDHN+olmS6+8BYK0Qa8a5Fsrb8ydq7XetH2I6e/icT9i6RZ5WRgXkf+smRS3mseYeKPcpQ30gu+O4SFC48S3Ml7a8ZcSPvB9cdOaKXX1ENHzvRpyMZrVvX86mAe8Q3MUwpsomAMuf8qarIyd08X3fs1cEdsv4hSoGmBMiZIASJyrjtFLrpjHSNH1OXF5K8mf5uvMl7plDMoe8K/ahWphJfXM5o1OVClepBpJkC0Ui2RpwlLRHTmkWiQumUzgVRcXp9TeGOQBaCvLckFy5eJb+2iOUWWqmJ4kxDaMvbRuBefLJkuf4vMl7a9N5IrdMEd4KYFa1kVujcAxAyzN8mwUfHNF/ZaRXrqWMyBb84LqYnop9mfZpgNPZgA3o2gWE2PtvqwLSs9HA3Qp51zAGPFRdcp3uA3S8QPdrhsIEgbqxwWsBIB96u0jjVuQoLOAxHD8lAXFuxeL844AN06DSIRSOSC/+3fxH2fTmH//o8nsokcxjICXnvBzllryTnFJqEqrhrui0EIPxWvjMx//wz8LMl7W4ITmeuH/pCjW3AHylWJCWAWeUzEg5T4IUXjljE5r0Rc8HEl/H1Sw/0JHMukHS2wxC0E+f84bf3+y 폐질환 의심자 약 2,000명 가운데 후속 진료를 마친 비율은 12%였다고 소개했습니다. CHAI와 협력해 AI 흉부 X선 소프트웨어 가격을 최대 65% 낮췄다고도 밝혔습니다. 아이도트는 온디바이스 자궁경부암 AI ‘Cerviray AI’로 몽골에서 5만 5,000건 넘게 검진했다고 밝혔습니다. 레메디는 필리핀 결핵 선별검사가 8.4배 늘었다고 소개했습니다.", "why_matters": "AI의 성능보다 확진 뒤 후속 진료로 이어지는 연결, 조달 가격, 장기 운영 재원이 실제 확산을 좌우한다는 점을 현장 수치로 보여 줬습니다. 국내 의료AI 기업들이 ODA와 국제 조달 시장에 들어갈 때 갖춰야 할 조건을 정리한 자리입니다.", "strategy": "국내 기업들은 오프라인 온디바이스 추론, 데이터 주권 보장, 현지 정부 입찰을 결합해 저자원 국가에서 시범사업을 넘어 지속적으로 운영하는 모델을 내세우고 있습니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.medipana.com/news/articleView.html?idxno=419880", "verified": "원문 직접 확인"}], "verification_note": "포럼은 10월 22일에 열렸고 기사는 10월 23일 게재됐습니다. 수치는 발표자와 기업이 직접 제시한 것으로, 독립적으로 검증되지 않았습니다. 같은 주간에 발표된 AI 헬스케어 서울선언(제2호 게재)과는 별개 행사입니다.", "image_concept": "A seedling sprouting from a cracked pilot's helmet sitting on dry soil.", "img": "data:image/webp;base64,UklGRqgvAABXRUJQVlA4IJwvAADQrgGdASqwBCADPpFIoUylpCMloVJoYLASCWlu4WjfA/KOm4sRVJ5fr7Q69DPwPBBzxD61+0f+09D/ndkV6/x8+lTK/6Daij4u0g8FeZVPL+gtQDzv8EGgd5Ov+/5hNRgH7TKyJjHD4QwfWRMY4fCGD6yJjHD4QwfWRMY4fCGD6yJjHKXXSWnjMIeMAm0xjh8IYPs+t4+PrImVmHwhg+r6+Ky6wf+iYpbK1d6x9xn1d2n0JtMY4fCgN/G2viIPrImMcQtBzCEZ+4IhppoBSdTcF1Xah+4x8IYPpaNDg0y+q/PoTaYxxF4bajAcShkStYfVkREJTd2n0bcIYPrImpvMBwhg+slyI+siYxw+ENMkqb6rEgtM5+ojFX7BXrSH8JfD/0S7EZTJK6Hwg+Aj6ytgtMZPbYKvDOvjh871/AKMntr4mVD6EtM5duml4qq0+t/emHgOEMNNyOTLEfDLGcbq7YmKKT6Yxw+EMf5weTDiSG4gCSAMKvxfEQnPhmIhFYLaYxGV4/Afbfh9PjJRYsPwQLRAzPljRtG760FiSIPrIn4T218eI9qno4QvGATaZMw7FkYxw/zj+cEPALD0SsjfmK7/E/x219GcPhQpK1D6+Ig+ujbX0qyfmgIFojWsOu1EVYH1pUMX2YNCUxA4zh8bs8bTIB5WNUIhQKusra+hNxXvkS6OJ+RFrHGWf7ojKHX8XxEH1sM6EtPoTatleSugrACMPhDCEqBQEdZ2TiP6FAoaOtfRmeuxMY2qtQ+vif1SyAgWmMcPGAfWH1X1qcDUNPq7FM3I38HY128qTI4odVmqu+kbQlrtzM1v6EWVD0Tv5MTGdRDGfV3alMPGAfXwTZJmGMctXSepVhvs3ouRMtBJ7hdFcrJPx/BKpMixGvv8a3QiVm06ZUabTGNpClbX8KWkLlj7S5Exjil+gG1dl6+jLAdOmPHsKqs3sUcrRleAnuLaARhXgnqLppetUaGRP/+ew+AtAXY7CXVBfTFTsS0P0JxnIpaQjZn/lQwpwW8RcwheI+lyJdUWmOj2kcTSoe0yPxbGzokTHEWr0zeoFtH2f98RqyQvoG9zacmD/0MAEbQm0PxlPRT 업은 단순 공급 계약보다 병원이 공동 개발하고 지분을 갖는 구조를 검토할 만합니다. AVIA처럼 병원 경영진이 솔루션을 평가하는 네트워크가 미국 시장 진입의 관문이 될 수 있다는 점도 짚어 둘 필요가 있습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://hitconsultant.net/2026/10/22/redesign-health-sheba-arc-global-merge-acquire-avia-health-system-innovation-foundry/", "verified": "원문 직접 확인"}], "verification_note": "기업 보도자료 원문은 검색으로 찾지 못했고 업계지 HIT Consultant 기사만 확인했습니다. 합병은 확정 계약 단계이며, 종결 여부는 기사에 나오지 않습니다. AVIA 인수는 규제 승인을 남겨 둔 합의 단계입니다. 거래 금액은 공개되지 않았습니다. 포트폴리오 가치 67억 달러 등의 수치는 회사 측 주장입니다.", "image_concept": "Three separate puzzle pieces made of glass, metal and wood locking together on a hospital corridor floor.", "img": "data:image/webp;base64,UklGRggwAABXRUJQVlA4IPwvAADwzQGdASqwBCADPpFIn0ylpCorIXJ4oWASCWlu3Mtbz4q+t4e1RubWzwrvPJp/5Yns1mtab9eXuNSnQElP1Loi7wfSCrHriUmu7U+q+RT2Tfa9FSg9yAayaWgycfC+vcSNer//s+ZcZ4OIDbsgqm1U+KFm3ZBVNqp8ULNuyCqbVT4oWbdkFU2qnxR+xuyCqbVT4VvmU1isOIDbsgqm1U+gkDcl01Nv9NU2qnxQs27IKptVPihZt2Nok6qqadMMFb5CS+mqbVT4oWbdkFU2qnwr8fzKaqfFCzZbqmbryqPQlkACT6YYULNuyCqbVT4oWbdkFUuwIRR27IKptVPihZuUm9CaD9MBSYZm1AA9BVNqp8UXChIKpw5w4aT6oSHjmU1U9OX+mqubUmb3rgm5mvqnxQs27INT2CqbTuqm1U+KGIMwKvFCuLX2M3puP5DoVS7DZGc1F4jsgqm1VAtsHHbVPihXFTA+mw9YE7fqlx4fvnKped6mT3rdBKY9lqetMOIDbrjOdU121T4oWbdjcr3QnoKm4AzTpc18rj8L08XpzpshFda01TaqfE15GvhA1TaqfFCzAq8ULNt/wYLKtL31EXvqcvZk3yvBuP4oyfFqwVvmU1SxqqaqfFCzbsgqa5cMvYynun2tk9AV7Mkb2ZFOE7G6Rr/4c32/FUNYQjVtHyXmEdkFU2qnxQs27IKptOlEoMTDNjnv+Y7luwl3Mx3fFhrUrgwfOHePmMybHAejIphe/NxluqhOqBt2QVTaqfFCzZbqXE3AGfAUcnYMnElTmvFEx5YUYRLrY9wmR6AQJNvpli6ioeee0c2ExTNCxRM+Z3fB2mqbB8Q9Nqp8ULNuxuAuvfEQcWIoTBYemhtH5xiTbmG0NRoQGdI2B7+wF7PHUhAGFWdVPBgKNLZ6MbDrW5Io+2WDiFXQ6A/xI7ap8ULNuyCqbCQkwkfOGLDTXq6FZzaaf77PNrepphzvO7LCK1ZdItip55jEZAaucXnCfSiZ9SlahRw5MV7XAFp1ND18k1U+KFm3ZBVL1PEU/Kvqdyj3Agr6zDAdYrDwXXi04Zi4lOBHB3M24/urLhRekfiDqoRTu9d9pCXPnAc9riqB36qfFCzbsgqm1U+KFmAcWyHJGLCio9hyt2Wuzlw6fXNI+Zg/1jLb58G1PDNcSitxBr0i4ZysfVqXRim7WJUaZmuGlNUuKbVT4oWbLrl3PId4lh3dhyVPFBZfY/GL9Bo/fVbyjUKR2CknAuIE+wJ6V2eIiUHumKtDCINNWkoMjtm7AfaCKssHvALdfN1m 모니터링 부담을 제조사에 넘기라고 요구하고 있습니다. 앞으로 나올 FDA 지침 초안에서 시판 후 감시 책임이 어떻게 나뉘느냐에 따라 앰비언트 AI, LLM 판독 보조, 정신건강 챗봇 공급사의 비용 구조와 미국 허가 경로가 달라집니다.", "strategy": "생성형 AI 의료기기를 개발하는 기업은 성능 저하(드리프트) 모니터링, 이상사례 보고, 모델 정보 라벨, 변경관리계획(PCCP)을 제품 기본 기능으로 준비하는 것이 좋습니다. 병원과 맺는 계약에서는 책임 분담 조항을 미리 정리해 둘 필요가 있습니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.healthcaredive.com/news/developers-not-doctors-held-accountable-generative-ai-medical-devices-fda/833738/", "verified": "원문 직접 확인"}, {"url": "https://www.medtechdive.com/news/gen-ai-policy-is-a-white-house-priority-cdrh-digital-health-leader-says/833551/", "verified": "원문 직접 확인"}, {"url": "https://www.aha.org/2026-10-19-aha-provides-feedback-fda-regulatory-considerations-generative-ai-enabled-medical-devices", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "여러 단체의 입장과 FDA의 지침 초안 일정은 Healthcare Dive(10월 22일)와 MedTech Dive(10월 21일) 기사로 확인했습니다. AHA 권고 세부 내용은 AHA 뉴스 스니펫에 근거합니다. FDA 공식 일정 문서는 확인하지 못했고, 구체적인 발표 날짜는 제시되지 않았습니다.", "image_concept": "A balance scale holding a stethoscope on one side and a circuit board on the other.", "img": "data:image/webp;base64,UklGRr5UAABXRUJQVlA4ILJUAACQJQKdASqwBCADPpFIoEwlpCalIjFI2NASCWlu/61cvwibJH8EKfZwjwMs6yV5muVcQvb/6RGcx3vhEYRf/57Hf73tw6W9vsn15/wfSB5s4/fkv3n/J/Mr4l8Ldrn8//X38/1q9qv0J1Dvbv65+Tb8kfGe3L/iftd7BfvB9y9Ab9Tzf/iPUC/XfjJfwf/o9gf9MejHpPfSv9wG7IVOdDTPhpZXdDTRar1SOR2Fqw0dScndDTPhpZyi1YaOpOTuiKlMGnrLqTlDJTVhMVFzclOTc7iXgGEap43G3Q0B6nV7uthcMLGgTYyYixgecyKlpD0yUWoKVw8r5WPQJzcnuJnc8APmAroLMmZPxzlNoj3dCu/VLK7oaZ8Q6NMDFQCremr5Cxj6HdRdE9KWlqndFBlEhCp7COXqpGy9/RcrXoZOTutB3yp7AHZKGeGXkyIQc3c6NTihAO8JZXdFDPJHug+bp9lP9XgB7HlFgZwezj6XF7xMnJN3X+ASeY2Omh1M/IXNbz6OzHmYsJUGqrYmwRfnQCZcoQA6xn8OGXO0uNI93Q07b7ap3Uap6lvVt63wvPqllOQFDCEG13L68Jr2w7nVPwjQahXszbVhxXxRAUetKeBgR7uhpWs1fi5rJNnnqWJQk0kZpnVZx42b82hcUZjK6xMHigVKPuwT6hzHFB1pCDupfg+rC06NPFphdQseatQQcPic5Oza1I4a7+ePGmMxDuQ4/Q8WtgS0vaf4Ve2dTAR8Bk/eW/RuwBwDalRLhVzkrEnQNPqlzzAFS5yUZ+CzG6KvdDQqrNstVQ5Le44vVI92MsP3BcMoGWdCOGeKI+1z7udrXNkBQn MM1oFFt8fnccR0m/ur8mUDTSRqbECeCBhPnJqf5xuEl6ZiY45jSP+xj68VX5DHgAAA"}, {"id": "dh-epic-open", "cat": "dh", "title": "[후속] Open@Epic 2026 결산… 공개 문서 MCP 서버, 모바일 신분증 MyChart 가입, 처방 가격 투명성 API 공개", "short": "Epic 개방형 API 로드맵", "alt": "모양이 제각각인 열쇠 수십 개가 걸린 커다란 황동 열쇠고리 미니멀 일러스트", "date": "2026-10-22", "scope": "글로벌", "entity": "Epic Systems", "what_changed": "제3호에서 다룬 Connectors(2027년 3월 Showroom 출시) 외에 새 발표가 확인됐습니다. 첫째, 문서, 플레이북, API 명세 전체를 자연어로 검색할 수 있는 공개 MCP 서버를 내놓습니다. 둘째, 2026년 11월부터 모바일 운전면허증이나 여권 기반 디지털 신분증으로 MyChart 가입 시 본인 확인을 할 수 있으며, 환자, 앱, 병원 모두 비용이 들지 않습니다. 셋째, 처방 전에 저가 대체약과 보험 제한을 보여 주는 가격 투명성 기능을 제공합니다(NCPDP RTPB v13은 2027-01-01부터 Part D 의무). 넷째, 11월 릴리스부터 Bulk FHIR를 리포팅 서버에서 처리하고, TEFCA 개인접근 앱의 UDAP 등록을 지원합니다. 회사 측은 참석자가 1,200명을 넘었다고 밝혔습니다.", "why_matters": "Epic이 외부 개발사 접근 경로를 MCP와 셀프서비스 API 중심으로 넓히고 있습니다. 대신 연결의 관문은 Epic이 쥐는 구조가 굳어지고 있습니다. 환자 본인 확인과 약가 투명성 기능은 신원 확인 업체와 약가 비교 업체의 영역과 겹칩니다.", "strategy": "Epic 고객 병원에 앱을 공급하려는 국내외 기업은 공개 MCP 서버와 앱 템플릿, 플레이북을 활용해 연동 비용을 줄일 수 있습니다. 신원 확인이나 약가 비교처럼 Epic이 기본 기능으로 넣는 영역은 차별화 전략을 다시 점검해야 합니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.oec.epic.com/", "verified": "원문 직접 확인"}, {"url": "https://www.oec.epic.com/s/OpenEpic-2026-Agenda-ez7h.pdf", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "Epic 콘퍼런스 사이트의 결산 페이지에서 직접 확인했으며, 각 기능의 정확한 발표 시각은 표기되어 있지 않습니다. 행사 기간은 2026-10-20~22로 확인했고, date는 마지막 날로 적었습니다. 공개 MCP 서버, FHIR 알림, UDAP의 출시 시점은 명시되지 않았습니다.", "image_concept": "A large brass key ring holding dozens of differently shaped keys.", "img": "data:image/webp;base64,UklGRpqTAABXRUJQVlA4II6TAADQ8gKdASqwBCADPpFIoEulpCMxo/TYujASCWdu/GfsgBH/Fz7a27qfJzf+UfohNOKnLuMfKQQNlHZXyn88zz+xnhD/fjk1BfI39dnW9Q/9f6c3qz51nT3aex+EeWHzTxfdPf2nSHzt9sepf9A/Ufpv2q/5fgr9HtRH85/tnppwzXEfhXzOfzfO/9x/3fsBd+H4wH57/1ewT/Vv9P6TOix7J9hXpwin2Xoj3JXKuSEjjYbbDn8xthtsKVtB3GO4x3GO4x3GO4zmDHcY7jHbmpPieL1MNIP8Pj6QL4HcDCWeOB96HEMNPsKRPC6wlyZB2eJMBo8AqmVRuAtsMRUmiik9pmHnX3LWPStYwovzD4xRJQIawEXYo36Yd+sSvGJ4xPGBBiFCQOVf+heKdVqjQ cat": "dh", "title": "b.well, MyDirectives 전국 사전의료지시서 레지스트리와 소비자 앱 최초 연동… MA 플랜의 CMS 상호운용성·별점 대응 겨냥", "short": "사전의료지시서 FHIR 연동", "alt": "스마트폰 옆 펼쳐진 진료 폴더 안에 봉인된 봉투가 끼워진 미니멀 일러스트", "date": "2026-10-21", "scope": "글로벌", "entity": "b.well Connected Health, MyDirectives", "what_changed": "소비자 건강데이터 플랫폼 b.well이 MyDirectives의 전국 사전의료지시서 레지스트리(A|D Vault Exchange)에 소비자 접근용으로는 처음 직접 연결했습니다. 이에 따라 사전의료지시서와 POLST·MOLST 문서가 FHIR를 통해 진료기록, 처방, 검사, 청구 데이터와 함께 통합 건강요약에 표시됩니다. 회사 측은 레지스트리 조회가 주 500만 건을 넘고, b.well의 CMS Aligned Network에 300개 이상의 건강보험과 180만 명의 의료 제공자가 참여한다고 밝혔습니다.", "why_matters": "CMS 헬스테크 생태계 상호운용성 요건과 Medicare Advantage 별점 지표(사전돌봄계획 기록)가 페이어의 데이터 연동 투자로 이어지는 사례입니다. 소비자 앱이 임상 문서를 넘어 법적 의사표시 문서까지 담는 쪽으로 넓어지고 있습니다.", "strategy": "국내에서는 연명의료결정 정보와 마이헬스웨이 개인건강기록 연계를 검토할 때 참고할 만한 모델입니다. 페이어 테크 기업은 규제 지표나 품질 평가 지표와 묶어 데이터 연동의 가치를 설명하는 방식을 눈여겨볼 만합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://hitconsultant.net/2026/10/21/bwell-connected-health-mydirectives-partner-digital-advance-care-planning-fhir-registry/", "verified": "원문 직접 확인"}], "verification_note": "업계지 기사로만 확인했고, 기업 보도자료 원문은 열람하지 못했습니다. 최초 소비자 연동, 조회 건수, 네트워크 규모는 모두 회사 측 주장입니다. 계약 금액과 상용화 일정은 공개되지 않았습니다.", "image_concept": "A sealed envelope tucked inside an open medical folder beside a smartphone.", "img": "data:image/webp;base64,UklGRvJNAABXRUJQVlA4IOZNAADQ8wGdASqwBCADPpFEn0ylozCwoTAo0hASCWluLZDgHwz//1j/geGZ/5Oyp9zXzU/9fWK3wftMBxLPXDJevFXJUEObR/i7azSw8An9Z//8fYvmm7DUmJ+BfzM3Dx3+Z7TmIn/OfztnL7QeAR8m8FvbLdT/vO+h5vXzPmt9dfYC/TD1s/6fkl/RP/D7Bf8o/yvrDf7PnY/SPQ7CpmYxn9oNQM88zGCigCNfCj1mYmW8vx6zMSr7/rMxK55wooA/LfNOMSJV+UsW1u9yRat5P3/WatUUXpDo6GbQrQ2C6bBM2j5mSXhwZH9fSsyjgPxgqlFcE4i4iEAQe/0kZsjwQRK2JJ8CPXYgh/0kod2l56v3rAaD7nfGY7s4531Dm93yCEWqX5Y1v5DXV/CfPGV59f9ZmJV9/0+N1N8S2qUmccLrqCIAz+ZiWB1qwRShGcGJJQVr/SRcjRauz35gNMy8VTwI9Z8A5HkupBIuWUHMSSgrViRKv8k48tNFtE8hMfJqubQE9+eM4B+QacaBdEq/AGr5Y5gopQM6RCvq/yGKWIw4wHqAlDrLVfgHTT9JkLu1CuDNj1MZZNeJSIR61j1pf7w1AGfzVbLwJY5Z3xq0qQe4SwdO5erLDiAY1XjJjGPI04LeOYm8vsZ72LWK5 개발 지원 프로그램 ‘NAIN’ 출범… 첫 과제는 알츠하이머 예방 가속화", "short": "FDA 신경과학 NAIN 출범", "alt": "신경 경로가 그려진 접힌 지도 위에서 황동 나침반이 꺼진 랜턴을 가리키는 미니멀 일러스트", "date": "2026-10-22", "scope": "글로벌", "entity": "미국 FDA(CDER·CBER·CDRH)", "what_changed": "FDA가 10월 22일 신경과학 의료제품 개발을 조율하는 새 프로그램 Neuroscience Advancement and Innovation Nexus(NAIN)를 출범시켰습니다. 의약품(CDER)·생물의약품(CBER)·의료기기(CDRH) 세 센터가 함께 참여하며, 신경·정신 질환, 물질사용장애, 통증을 대상으로 합니다. 첫 과제로 ‘Alzheimer’s Prevention Accelerator’를 띄워 예방·조기 개입 임상의 대상 집단, 병기에 맞는 평가변수, 인지 저하 지연을 입증하는 방법을 검토합니다.", "why_matters": "알츠하이머 예방 임상은 증상이 나타나기 전의 환자를 대상으로 하므로, 어떤 평가변수를 받아줄지가 개발의 가장 큰 불확실성입니다. FDA가 센터를 가로지르는 창구를 따로 만든 만큼, 약물·진단기기·디지털 도구를 묶은 개발 전략에 대한 규제 논의가 체계화될 가능성이 있습니다.", "strategy": "알츠하이머 초기·예방 파이프라인이나 바이오마커 진단기기를 보유한 기업은 NAIN의 이해관계자 참여 일정을 지켜보고, 평가변수 논의에 의견을 낼 준비를 하는 것이 좋습니다. 다만 지원 대상 요건과 구체적 일정은 아직 공개되지 않았습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.fda.gov/news-events/press-announcements/fda-launches-new-program-advance-neuroscience-medical-product-development", "verified": "FDA 보도자료 원문을 직접 확인했습니다."}], "verification_note": "프로그램 이름, 참여 센터, 대상 질환, 첫 이니셔티브, Kyle Diamantas 국장 대행의 발언은 원문으로 확인했습니다. 보도자료에는 참여 자격, 규모, 향후 일정이 나와 있지 않습니다.", "image_concept": "A single brass compass resting on a folded map of neural pathways, pointing toward an unlit lantern.", "img": "data:image/webp;base64,UklGRopYAABXRUJQVlA4IH5YAACQQQKdASqwBCADPpFIoEylpCMoIfKIsQASCWlu7ujxw+H+B6L3BmxTDfC9/Co1dSmA9df8en1oe9m3bebz087jnnnfP338Onz/Vnml+Rdhtlb7/4OffHJdy4+emopi925W7+Yp7u/j/Os+687/5L/TewJ53eB1QF/o/+P9JbRd9k+w905/SoDlgchyWvyBKsW3NM+S39oXWtH9q6p9esT1XFYYSAkHzJASD5kgJAadVQIdrQNkv6GCzldbIGXR4IqXZkJNRPpPhP4vRyb1MQ4AvomyDxdQRVapTqeQCuGSaLtfuQzUZrfCU/7GgiLgJiNWwj7DXPblr+jYYZ4+a1oIlgQazupDU93IVS3qCGrb6EUYzbnFRSnzef/cPaP5dYaaH5soeF0HJbH5cF2+jpo7QdjswmhFo0yD1hb1QLQIBNhAK5PVhnRLcKou3I/LpS8aSAwZqJT8nx0vqCa9yt8XdK08b7Lkclvn6iZcAuXRTMfxasEK04gTEgrBO+4fxb1FXvt65ECDZ/GTJl5tYdD0pvyA0tvYVuP+8d7spAj9WVyycZe2D8q9AjowuIS1vREM42V65Vuk7LFIswAtE9h8psJN7uxOmR9iuf/KdTDCkocqyP2BMV2ZoEuzDs6hAdf+Wp 가부담과 건보재정 영향 분석 보완을 요구했습니다. 이력이 확인되면 최대 90일까지 처방할 수 있게 해 달라고도 요청했습니다.", "why_matters": "본사업 시행을 두 달 앞두고 처방일수와 지역 제한이 플랫폼 사업성과 환자 접근성을 가르는 핵심 조항이 됐습니다. 의료계는 30일 예외도 위험하다고 보는 반면 플랫폼 업계는 7일이 과도하다고 맞서고 있어, 최종안이 어디서 절충될지가 관건입니다.", "strategy": "비대면진료 플랫폼과 연계 약국·제약사는 11월 9일 의견수렴이 끝난 뒤 확정안의 처방일수와 지역 제한이 바뀌는지 확인하고, 만성질환 재처방 수요를 다시 추정해야 합니다. 원산협은 서명운동과 규제합리화위원회 건의를 예고했습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80112", "verified": "히트뉴스 기사 원문을 직접 확인했습니다."}, {"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=546667", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}, {"url": "https://ggnews.co.kr/127171", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "입법예고일은 기사에 따라 10월 18일 또는 19일로 다르게 나오며, 복지부 원문은 보지 못했습니다. 30일 예외가 ‘평생 1회’인지 ‘질환별 1회’인지도 보도마다 표현이 다릅니다. 이번 호의 새 내용은 22일 나온 업계의 공식 반대 입장과 90일 요구입니다.", "image_concept": "A pill organizer with seven compartments filled and the rest sealed shut with tape.", "img": "data:image/webp;base64,UklGRhpGAABXRUJQVlA4IA5GAACwBQKdASqwBCADPpFIoUwlpC4tIhNIscASCWlLqHaD7vU0Rwzj9+Jd38rLat+PlTz7Vt/d2uXmFr7jf/Bk8Tqq8snpz7jfxakHsd241pb3l6GrL7Abcx9u/8Pm+vw/Nr99/0Gv7/VP+p6ln+z9ZPwxETDqG12Z94c1JUniBdk7J2TsnZOydk7LvzBiQEgJASAkBICQEgJAzzNGVeoyl+RqwOsyk6qKl1GXtCLsy1MPvDmsu6/T/O1IRqnc53Zn3dUPTc+r14EsEQcZIuLi8QLsYgBdmRkk6vpp7cgq9zCsmVeoKETddXfzPMJJC78wYahUcICHc7cby5quyKtPDrJ6e6sml2TD6/DjhEWfqMtk4K2e/S7OJgB7G8PSbD7w5rCxxAC9b/OdLtbwEulHDS7M+679XliQE+L8FHJR7SAb9RayXZNiPIiIyl+Rq10TnFu9b15AmJAdhIQEf62ro7FqfhogICYkU5TDgFKKtJjeGNFRPg6XZn3+8ROo+/CsDDUAA9Qa9k6cidOiLeZtCLqNudbSD8P2IqGQ2oDQ2C1WpWKEpuFUVa7fHRLB5GBk7J05E7GTBJk8RLWBlAAPWunx548uTHdRWPKyZAyFVIVZuGJaTzEyQLsn/ojE3lassDf1mvyw0+Qye6DR/XTwgTjPiG4R6OML2Ev+iRqtLEe8uNaUeA6DH7SDOW9UXYa9csxIns+x5CLqKjy6ZSTmTl5QwJE7YtbS7W8BGiZlIQJ20TIGQNYNMuJSC3MM8cfpU20LBqGBIGUstEndbmZLSfno62VDspAFbCEk7UIir9XuUKAksu0P7WeTumrPrzGQ5VlIs8rZLINbb2gnmwwEkhPccVsomewkERPZ7lr1YWR2wLU02feHG9oA0LoGTppOnvW7o8M9mv+P/Onw84wuIPiALsnffCSo9mzHbqHmgIZbeEeDVykxGh/bPi/GU  중에 재발한 환자입니다. 9월 18일 CHMP 긍정 의견에 따른 최종 결정이며, 3상 REPLENISH 시험에서 52주 지속관해율이 위약 대비 두 배였다는 결과를 근거로 했습니다.", "why_matters": "PMR은 장기간 스테로이드에 의존하는 질환입니다. 노바티스는 IL-17A 억제제가 유럽에서 PMR 적응증을 받은 것은 처음이라고 밝혔습니다. 스테로이드 사용을 줄이는 생물의약품 시장이 IL-6 계열 위주에서 IL-17A로 넓어지게 됩니다.", "strategy": "미국과 일본의 PMR 심사 결과에 따라 고령 류마티스 질환 시장의 경쟁 구도가 바뀔 수 있습니다. 국내 허가와 급여 신청 시점을 지켜볼 필요가 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.novartis.com/news/media-releases/novartis-receives-european-commission-approval-cosentyx-polymyalgia-rheumatica-pmr", "verified": "노바티스 보도자료 원문을 직접 확인했습니다."}, {"url": "https://www.globenewswire.com/news-release/2026/10/21/3385726/0/en/novartis-receives-european-commission-approval-for-cosentyx-in-polymyalgia-rheumatica-pmr.html", "verified": "검색 결과 스니펫만 확인했습니다(본문은 403 오류로 열람하지 못했습니다)."}], "verification_note": "EC 결정 자체는 노바티스 발표를 통해 확인했고, EC의 공식 등록부는 별도로 보지 못했습니다. 보도자료에는 지속관해율의 구체적 수치가 없습니다. ‘유럽 첫 IL-17A 억제제’라는 표현은 회사 주장입니다. 미국과 일본에서는 심사가 진행 중입니다.", "image_concept": "A heavy stone shoulder yoke being lifted away by a single slender key.", "img": "data:image/webp;base64,UklGRrRqAABXRUJQVlA4IKhqAABQXQKdASqwBCADPpFIoUwlpKMoI1cYcQASCWlu/9dnjrZRPXf//r/rDXiD7mH+9zfXn66l0Xrl/cceWkafQj//uDrdpS55vTtuF+d73XKd5p0/iPen+lfXP+3/S8beJT9f/nP/n1t9jf7D4imLfYqb15jWBnh5++f+HzyeNB/j+oj5On/j5qP2H/z+woHPRfL7JOHaxEEIKINzak8QQghB0kj/sxzhYEYm/931wcDRqIGgNXK5SaMMYZjimsDSG1NrY63XDGGSFAqggdSNCiK+2UDvfRcJ8AChbKiCEE2jVfa3i2pb8XQ1Thuo9nTh2AHroURYLCuASzD4hLIlzBQyaMZh35ln5nT8zgOQx3CMKaEO1BS9SwCG7AM0Hw49g1d1TYAEF7XhvzNcGszPBmwfm0m8Oy6UGpLUXnDfWFb7fxrCyICPZPatamwUwM/Jm2BZkzbDtQcvKK64rJNGQTmoDFV5ABM2uJ4qh8n5Pyt3D7nG7KUNfaXjulmUPFh60Gk492m7feZj1He8ZsLKrWSZJeWt0LzmZOtDo7F8yIft6gzDDVSrN6oQ3Vo+EZw8bu1/y8xaQcGoOEDz9fiwWIftPyZx+BapUAmhxcDQYl77o6COmgYHJ7t+YB46A+T48xmORk0XgmCLKMQE5SE4uert6kA8ecv3Q+KKQgHKJmtYGkyTZlFgErp5PxVDx0B8md18UPr7HLGe0BhjCjMW1yWzZKPXsag4HW8WkUJDhi8giWP3sgH97OrQy9uQAwthl891g0bLj2mEyH7kBrScmCot17TUS9SwIRyP/U0Dsg0JXHK2FpLGKdpcQ7R1R0m4xPdf1UDJEb5ZQU3v1XmCNAn5tLOeTq4z2ScxWn/W1xPBUIi7Y AAAy5/AAm45qVfAJDOobM9rBdAFIA8KVcDkAAAAAA=="}, {"id": "bio-menarini-gim621", "cat": "bio", "title": "메나리니 자회사 스템라인, 조지아뮨의 전임상 경구 면역항암제 GIM-621 글로벌 독점 라이선스… 최대 11억 달러", "short": "메나리니 GIM-621 도입", "alt": "작은 흰 캡슐 하나가 어두운 바닥에 방패 모양의 긴 그림자를 드리우는 미니멀 일러스트", "date": "2026-10-22", "scope": "글로벌", "entity": "Menarini Group(Stemline Therapeutics) / Georgiamune", "what_changed": "메나리니의 100% 자회사 스템라인이 미국 조지아뮨(Georgiamune)의 GIM-621에 대해 개발·제조·상업화 글로벌 독점 라이선스를 확보했습니다. 조지아뮨은 선급금과 단기 마일스톤을 합쳐 4,500만 달러를 받습니다. 전임상·개발·허가·상업화 마일스톤까지 합치면 총 최대 11억 달러이고, 로열티는 별도입니다.", "why_matters": "GIM-621은 아직 전임상 단계인 계열 내 최초(first-in-class) 경구 저분자 면역항암제로, 여러 고형암에 쓰일 가능성이 거론됩니다. 임상 진입 전 자산에 10억 달러가 넘는 총액이 붙은 것은 경구형 면역항암 신규 기전에 대한 수요를 보여줍니다. 다만 표적, 적응증, 전임상 효능 데이터는 공개되지 않았습니다.", "strategy": "메나리니는 스템라인을 항암 사업의 축으로 삼아 고형암 파이프라인을 초기 단계부터 외부에서 확보하고 있습니다. 조지아뮨은 핵심 자산 하나를 넘겨 받은 자금으로 임상 단계의 다른 프로그램 3개(GIM-407, GIM-122, GIM-531)에 집중할 수 있게 됐습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.manilatimes.net/2026/10/23/tmt-newswire/pr-newswire/georgiamune-and-menarini-group-enter-exclusive-global-license-and-collaboration-agreement-for-gim-621-a-first-in-class-oral-immuno-oncology-agent/2452135", "verified": "원문 직접 확인(PR Newswire 보도자료 전재본)"}, {"url": "https://www.morningstar.com/news/business-wire/20261022670635/georgiamune-and-menarini-group-enter-exclusive-global-license-and-collaboration-agreement-for-gim-621-a-first-in-class-oral-immuno-oncology-agent", "verified": "검색 결과 스니펫만 확인(본문 접근 차단)"}, {"url": "https://endpoints.news/georgiamune-sells-solid-tumor-drug-to-italys-menarini-for-up-to-1-1b/", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "보도자료 전재본에서 발표일(2026년 10월 22일), 4,500만 달러(선급금+단기 마일스톤), 총액 최대 11억 달러, 라이선스 주체가 스템라인이라는 점을 확인했습니다. 선급금만 따로 얼마인지는 공개되지 않았습니다. 일부 언론은 제목에 10억 달러로 적었으나 보도자료 기준은 11억 달러입니다.", "image_concept": "A small white capsule casting a long shield-shaped shadow across a dark surface.", "img": "data:image/webp;base64,UklGRq45AABXRUJQVlA4IKI5AAAwaQGdASqwBCADPpFI egy": "적응증 확대(안구 근무력증 신청 완료, 소아 근무력증 우선심사로 2027년 2월 PDUFA)와 2027년 하반기 자가주사기 출시로 시장 지위를 지키려 합니다. 포르테 인수로 얻은 FB102는 셀리악병 3상으로 넘어갈 예정입니다.", "evidence_type": "공시", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001697862/000169786226000034/a02earningspressreleaseq3.htm", "verified": "원문 직접 확인(SEC 6-K 첨부 실적 보도자료)"}, {"url": "https://www.globenewswire.com/news-release/2026/10/22/3386023/0/en/argenx-reports-third-quarter-2026-financial-results-and-provides-business-update.html", "verified": "검색 결과 스니펫만 확인(본문 접근 차단)"}], "verification_note": "SEC 6-K 원문에서 매출, 이익, 현금, 파이프라인 일정을 확인했습니다. 피부근염은 3상이 긍정적이었는데도 바로 신청하지 않고 등록 임상을 추가로 진행할 계획입니다.", "image_concept": "A tall glass flask nearly overflowing with bright liquid on a minimalist pedestal.", "img": "data:image/webp;base64,UklGRswuAABXRUJQVlA4IMAuAACQfQGdASqwBCADPpFIoUylpKOoILNIaQASCWdu+tLqOxLaBL3AOPg3geIiu/kqIPBKoxeas2e+d+OfpGcP1c55/Z/k/2Z+BnanmddEf9L/Fe23/r+wT/A+onzzv3c9SH7N/t57vX/V/c73Qftr6RXXLf3//weyR+4/rRf/D2n/8H/2vTL1ene/nliH/Lvmq6u/XL1R+6cf9IH+sd9CFt/SNXrwZ6Kf6bySP1j1BfKQ/1vO39h+mcDINeIXTup4AmMQundTwBMYhdO6nf+RbO5vqeAJjELp3U8ATFZhelBJ+ngA2fLDC17T0BMVmF6S0BGNzB1uYPMYgC0BMYhdO/8XczdM6TA1dJHsADcEXB5Ek7l4/HwbmwsvAExiF0s4XyeAJitEuBXHklVsxBOPlgExnBATniW+p4AmMQundTwBGN9TwBMYiNt9TwACCj7CYXOJ5eIXTplIPuMoA+D7usATGIXTup4Ai8LzGIXTupqmnfwmyULp+bpzibtP6tahlWd3c31PAExiF07qeAIxvsSwiE7kc6EOWKuAyIUYTO6mrFjUrU8ATGIXTup4AmMQqw2YXutgC6NCQn8vCCErDf1yVqZhKcSaRp9BTPLp6CFJ5aAmMQuncblub6ngAL1gTub6dWylv3OJ5eH9X7JS7+vzyRv/+qnm40khLyaxSCUDWmLseKf36EKHqzszI4VKo82vxR+1bOYundTtvRq5O21vqeAJemKPqeAA2xeTLPL2tOWjEbtQD8cLhQbHBDqnYFCNfE/FPHN2cuDW/YBKrtmq4Ywa4l3OyJZmihIcKDMQ9idTwBMYlqirMGdTv0jmDrbhDxeMb6ngANoaXgBGNzDeYixOoaGZkON+DaeFdskol2wlLaFmMriHaeiJTbo1wsOIXTup4AnaIXTv4TO6ngCMb6ngCYxCrDa307o343O4pEDeGWGLXgQNtOkdWkhFVSDCiFWQExiF06YOifz83TO6nba3xiZPAExiF07qzy4rfJhHb4lueytQAcpMxdK7CUnLc31PAEyXiNQJaAmKzFJ23jVlp2/JaA3qHLQSOp79cmrGfuEnJ2vp2UzyJR9TwAF8ngCYxC5JFH1NPJkyS8va1O/PYNIUg8qei7yi4RHxEkfzBwvk789nMLzGIXTup4AjHek1TIn3ZDHdzEi1O7B0YUgztaLnTsB1/B const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
