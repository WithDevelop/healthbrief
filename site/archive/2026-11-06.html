body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}

.date{font-size:12px;color:var(--muted)}

.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}

.syn .refs{font-size:12px;color:var(--muted);margin-top:4px}

.syn .refs a:hover{text-decoration:underline}

.chip{border:1px solid var(--rule-2);background:var(--paper);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}

.sources{list-style:none;padding:0;margin:0}

.note{font-size:13.5px;color:var(--ink-2);background:var(--chip);padding:12px 14px;border-radius:3px}

.archive a.go{color:var(--blue);font-size:13px}

footer{margin-top:44px;border-top:1px solid var(--rule);padding:26px 16px 30px;font-size:12.5px;color:var(--muted)}

const DATA = {"download_path": "download/2026-11-06.html", "download_name": "2026-11-06.html", "issue": {"no": 17, "published": "2026-11-06", "target": "2026-11-05", "lead": "bio-boehringer-sino", "side": ["reg-cms-pfs-2027", "ai-pulseai-arrhythmia"], "scope_note": "제17호는 2026-11-05 발표분을 중심으로, 제16호 이후 새로 나온 변화와 2026-11-06(KST) 오전까지의 발표를 담았습니다. 이전 호에 실린 사안은 새 진전이 있을 때만 별도 기사로 다뤘습니다.", "synthesis": {"trends": [{"head": "중국 초기 자산을 옵션·마일스톤 구조로 묶어 사들이는 거래가 커집니다", "body": "베링거인겔하임은 시노바이오팜의 전임상 ADC·T세포 인게이저 6종에 최대 70억달러를 걸었지만 확정 수취금은 3억5,800만달러입니다. 에보뮨은 하이촹약업의 VAV1 분해제를 선급 3,000만달러(일부 워런트)로 도입했습니다. 애브비는 일본 넥세라의 1상 완료 IBD 신약에 선급금 1억달러를 냈습니다. 빅파마와 미국 바이오텍이 아시아 초기 자산을 위험을 나눠 확보하는 방식이 굳어지고 있습니다.", "refs": ["bio-boehringer-sino", "bio-evommune-hinova", "bio-abbvie-nxera"]}, {"head": "미국 페이어·수가 체계가 디지털헬스의 매출 구조를 다시 짭니다", "body": "CMS는 2027년 의사수가 환산지수를 최대 2.31% 내리면서 일차의료·ACO에는 가산을 몰아주고 원격모니터링 개시 요건을 강화했습니다. 휴마나와 아테나헬스는 FHIR 기반 전자 사전승인을 전국으로 넓혔고, 오스카헬스는 의료비율 84.0%로 큰 흑자를 냈습니다. 보험·수가 규칙이 헬스테크 수익성을 좌우하는 국면입니다.", "refs": ["reg-cms-pfs-2027", "dh-humana-athena-epa", "dh-oscar-q3"]}, {"head": "의료 AI 허가가 판독 소프트웨어 밖으로 넓어집니다", "body": "PulseAI는 자체 기기 없이 웨어러블 심전도 분석 모델로 FDA 510(k)를 받았고, 에비던트 바스큘러는 AI 기반 혈관내초음파 시술 장비로 허가를 받았습니다. 게놈온콜로지는 희귀질환 변이 분류·판독 초안 AI를 검사실 워크벤치에 넣었습니다. 분석 계층 라이선스, 시술 장비, 검사실 업무 도구로 AI 적용 범위가 갈라지고 있습니다.", "refs": ["ai-pulseai-arrhythmia", "ai-evident-ivus", "ai-genomoncology-jalapheno"]}, {"head": "국내 보건정책은 지역의료 인력과 환자 부담 완화에 집중합니다", "body": "정부는 국립순천대 60명·국립경국대 40명으로 지역의대 신설을 확정했고, 다음 날 제3차 공공보건의료 기본계획안을 공개했습니다. 희귀·중증난치질환 본인부담률을 10%에서 7%로 낮추는 시행령도 입법예고했습니다. 공급(인력·병원)과 수요(환자 부담) 양쪽 정책이 한 주에 몰렸습니다.", "refs": ["reg-regional-medschool", "reg-public-health-plan", "reg-rare-disease-copay"]}], "signals": [{"head": "웨어러블 심전도에 제3자 AI 분석 계층이 생깁니다", "body": "PulseAI는 기기 제조사가 아닌 알고리즘 공급사로 FDA 허가를 받아 라이선스형 사업을 노립니다. 허가 적응증과 제품명은 아직 공개되지 않았습니다.", "refs": ["ai-pulseai-arrhythmia"]}, {"head": "PRV 매각 직후 회사 매각으로 가는 희귀질환 출구 공식이 보입니다", "body": "이게티스는 우선심사바우처를 1억9,000만달러에 판 다음 날 ANI의 약 5억6,000만달러 공개매수 제안을 받았습니다. 승인 자산 하나를 가진 소형 바이오텍의 전형적 경로가 될 수 있습니다.", "refs": ["bio-ani-egetis"]}, {"head": "두경부암 2차 이후 치료에 ORR 42%라는 새 기준이 생겼습니다", "body": "FDA가 피하주사 아미반타맙을 가속승인하면서 기존 치료 ORR 약 20% 이하와 대비했습니다. 이 분야 이중항체·ADC 개발사의 비교 기준이 올라갔습니다.", "refs": ["reg-jnj-rybrevant-hnscc"]}, {"head": "연방 의료기관이 TEFCA에 들어오며 데이터 교환망이 커집니다", "body": "보훈부와 국방 의료조직의 합류로 TEFCA 참여기관은 약 2만5,000곳이 됐습니다. EHR·QHIN 연동 수요가 늘 수 있지만 HHS 원문은 확인되지 않았습니다.", "refs": ["dh-va-tefca"]}, {"head": "청소년 중증 원형탈모에도 JAK 억제제 급여 문이 열립니다", "body": "약평위가 리트풀로의 급여 적정성을 인정해 12세 이상까지 대상이 됩니다. 약가협상과 세부 급여 기준이 남아 있습니다.", "refs": ["reg-litfulo-reimbursement"]}], "priorities": [{"head": "옵션·마일스톤 중심 대형 거래의 확정 현금 비중을 따로 봅니다", "body": "베링거-시노바이오팜처럼 총액과 확정 수취금의 차이가 큰 거래가 늘고 있습니다. 기술수출·도입 협상 때 선급·단기 지급과 옵션 행사 조건을 분리해 평가해야 합니다.", "refs": ["bio-boehringer-sino", "bio-evommune-hinova"]}, {"head": "미국 원격모니터링·사전승인 규칙 변화를 사업 모델에 반영합니다", "body": "2027년 RPM 개시 방문 요건과 2029년 인력 요건 유예, FHIR 사전승인 확산은 미국 진출 디지털헬스 기업의 운영 구조에 직접 영향을 줍니다.", "refs": ["reg-cms-pfs-2027", "dh-humana-athena-epa"]}, {"head": "웨어러블·시술 장비 AI의 미국 허가 경로를 비교합니다", "body": "제3자 알고리즘 510(k)와 장비 일체형 허가가 같은 주에 나왔습니다. 국내 의료 AI 기업은 자체 기기 없이 분석 모델만 허가받는 경로의 요건을 확인해 둘 필요가 있습니다.", "refs": ["ai-pulseai-arrhythmia", "ai-evident-ivus"]}, {"head": "지역의대·공공의료 계획의 예산과 일정을 추적합니다", "body": "부속병원 설립, 교원 확보, 공공 기능 보상 방안이 예산으로 얼마나 뒷받침되는지가 실행의 관건입니다. 공청회 이후 확정안을 확인해야 합니다.", "refs": ["reg-regional-medschool", "reg-public-health-plan"]}, {"head": "희귀질환 본인부담 인하가 고가 치료제 시장에 미칠 영향을 점검합니다", "body": "12월 시행을 목표로 한 7% 인하와 2028년 5% 추가 인하는 희귀질환 치료제 처방량과 건보 재정 논의를 함께 바꿀 수 있습니다.", "refs": ["reg-rare-disease-copay", "reg-litfulo-reimbursement"]}]}}, "archive": [{"label": "제17호", "date": "2026-11-06", "count": 24, "current": true}, {"label": "제16호", "date": "2026-11-04", "count": 20, "file": "https://drive.google.com/file/d/1OO2QDk-eD84LGOnQwIQbEJ1XutnrOQ3U/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제15호", "date": "2026-11-03", "count": 21, "file": "https://drive.google.com/file/d/1i ewswire/genomoncology-integrates-arup-laboratories-jalapheno-phenotype-matching-tool-into-go-pathology-workbench-under-multiyear-exclusive-agreement/2463187", "verified": "GlobeNewswire 보도자료 재게재본(2026-11-05)을 직접 확인했습니다."}], "verification_note": "다년 독점 라이선스, 통합 완료, AI 기능의 범위와 검토자 승인 구조는 보도자료로 확인했습니다. 계약 금액과 기간 등 재무 조건은 공개되지 않았고, AI 분류 정확도 같은 성능 수치도 없습니다. GlobeNewswire 원 게재 페이지는 직접 열람하지 않았습니다.", "image_concept": "A single strand of beads where one bead glows brighter than the rest under a jeweler's loupe.", "img": "data:image/webp;base64,UklGRs4tAABXRUJQVlA4IMItAACwngGdASqwBCADPpFGn00loyoxINO4eiASCWlu/7e454h1RX/3CvDMLuektVobJSMHr+aiulmBjCcn1b9t/PD8b7GYa+0LwCPGfAIgD7tSbR9y6gH+G9L/BPoD+MbpPVGQcjRB59fEQefXxEHn18RB59fEQefXxEHn18RB59fEQefXw/7fKgVWpiPDaY2fCCR1WjHp9CbPM3yop1HSJQp6Vbg2fCCOLtNMQqhnQwfhlC5m+qHQZB84SH1OF7HmaO+n0Js8zfKUQefZh5m+psFf635T0rOB3KCwVTGyp/U18RB7AYv9KqY2fCEU9nwhFPbL1svOS0+hNmf+pGR7mb6mwVDZn8IRT2fCEU9ni/2fCEo+9qF1c644TZoFdCEU9nzvXoFg2VTGz4QifWZUT+KaY2eL/Z8IQl7mb6mvgsBbPM32QcIRVbhNnmclrAlWEtVl1LRNswYUIRT0qpjfE7Y8zR30+hNnmb6ueqDIPZhVyWgyAwuH6oc4TTCpr4h5oH9TXxZu5bCIaDxs8zfVMghFPcyWeZjzl9fD/7nCO8eIAFnmiGNCEU9nwhSns+EIS9zN9TXxEHn3GmviIPPr4i7omv1UxBzOKVZQWeBlCqmqGj1cx0Js80d9PoUt+Zizxd8UzQIxs+d6w+pr6UKez3s1pHuZvqbjTXwTNfEUfJ31Q6EtHoTZ5mSAJwB7p9CbPM31NfShT7l3VF3Mz4QR9RODF5EIpvxJC/2fCET+KaY0qpjSqn4WeZvqiXJr5nFvslbv//xhF/HzFDPxbWCZwql4QBYCwvcjqYKmviZxW/9Z8IRTg3/b4iDuYK6+J/uzb5TnFwBtTtbRFrz1GyP9Mv50BsHa/eUiJh9mkoOuv3/0W4Wn35QhE+sFkGQfQmzzN9TXxFHXBc8xHmb6mGgeYaZK68Ct+BLldECC5a2QSvGyllmkGYQ3NPdEpDI+M0qew7dEKcKdKp+0p5v5gpaWfN4sR66ndEBBGqfylDw9zN9TXxEHm9MusrdIfQlk8Poz+DUXb9IPO+q+RwevTv0r8UmxjbF/lIDP2+OG9LyQVG9EUjFlscgN4nL2Dz7/kJWAmyNDNcrRY4usXOckQjprmAEFuvLvj8e4mqd78TepYo0uR5ni2aCz/BjjCbPAxs8zdbEk2/RjQgj0wgdCYn1fhCMe+bcmg78yjmfw0bCATCC6tQXtriit9TkxxAlZCBuPz399EcR5JGP6bpHs6ddUjFSukALMfHTwCPQ8VNPbpRdhXJ7FFROH69rMTyhOUzGZFuE2GwgkMlnmdBfXoFdfEQefXxEHdc8eBY25o9tHwhNY/HOASNIpW+8q3el8XaHpbSfz7SbgWAQ1oEpU22zsveEBRhOGYNtq54AQslyt0izpTALmW0Ub0SLWFAZL1xoFWIZEgixmnkJEvz77gmVTi3IKk1 26-11-05", "scope": "글로벌", "entity": "미국 FDA / 얀센 바이오텍(J&J)", "what_changed": "FDA가 피하주사 제형 아미반타맙(리브리반트 파스프로, amivantamab and hyaluronidase-lpuj)을 가속승인했습니다. 적응증은 백금 기반 항암화학요법과 면역항암제 치료 중이나 치료 후 진행한 성인 재발성·전이성 두경부 편평세포암이며, HPV 연관 구인두 편평세포암은 제외했습니다. 102명이 참여한 공개 다기관 임상에서 객관적반응률(ORR)은 42%였고, 반응자의 56%가 6개월 이상 반응을 유지했습니다.", "why_matters": "FDA는 기존 승인 치료제의 ORR이 약 20% 이하라고 밝혔습니다. 2차 이후 치료 선택지가 제한적인 두경부암에 EGFR·MET 이중항체가 처음 들어온 셈이며, 폐암에 이어 아미반타맙의 적응증이 넓어지고 있습니다.", "strategy": "가속승인이라 확증임상에서 장기 임상적 이익을 입증해야 합니다. 국내에서는 식약처 적응증 추가 신청과 급여 시점을 지켜봐야 하고, 두경부암 2차 이후 시장에서 이중항체·ADC 개발사들의 비교 기준(ORR 42%)이 생겼습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.fda.gov/news-events/press-announcements/fda-grants-accelerated-approval-new-treatment-head-and-neck-squamous-cell-carcinoma", "verified": "FDA 보도자료 원문을 직접 확인했습니다."}], "verification_note": "FDA 원문에서 승인일(11월 5일), 적응증, 102명, ORR 42%, 반응자 56%의 6개월 이상 지속, 혁신치료제 지정, 확증임상 필요를 확인했습니다. 회사 보도자료는 열람하지 않았고, 확증임상 기한·미국 약가·국내 허가 계획은 확인하지 못했습니다.", "image_concept": "A single key turning in a lock shaped like an hourglass, half the sand already flowing.", "img": "data:image/webp;base64,UklGRt4qAABXRUJQVlA4INIqAADQlAGdASqwBCADPpFIo0ylpKeoIZPYYQASCWlu+CMtmxT+fcwtn+iDrdbn+fM1qNNs08kcFBk03U9N+zPPkBb3Y9JHit9P7nhvOdvrTIsp7zsbjpUxsJbPK5XaI4N/2XnF/Qa0fQA8or/g82QvFz5IOFJIZCkkMhSSGQpXjtesV/1kyBGEMhSUhyY26kKSQyFJIYW5a9a6kQE2b11KebdS0G64pacfcuY/gQMJBzPxJZ+U7HCIk1rqQ0T7Z6TyU/cSxx8kHEBNdWupDb8/3LdlmruGD8INhzTwXIzh9x0pDnZ1C3LXrXUhSTLNxxHu5p27zM5YHLgCSOk82qVWTTCLku7+yn4R+oBWYFGQpI2Zt2P7bwhxIshETHyQtdiHxUsWAXN1X2ncT/Q8RzdspqN1Jn41P3PRfQutdQt8s6tJilmfgJlxBRxHHLou+0ACbT6SNwXK2qPsuVtUcQb7lVfYRUNks/KeKLEaniySDh7ulCGAhx7Ng/Tj5O+NiExX8SrBEx5Iu3fAUsI44g2vo9hYTcTGXlkfYg5eFPcmIivOWwltR65phkx4fCDVBtp8lg6ZeRIeryiGr0nbzDUPV5RDRg54tXmUmBwTbhSfn0Ge/fQrNaj5JSJFkMfc7Zx7v/OPduxxKv/Q0gcNaAJK2tRUdKJ7CEboGshfXrVEaGuOd8O2rcUDIHboxDjnRAkGH0ov+Jl+2LNS+sxn8THlgl4baalK6gZfurG1Dp88J3do88XuP+TNmKyXOQj3vEUiJJbmNKzc611H1oFWtCx33DCO+gGiMtw0Gw5n9HPFy3Om3K/Om3G5/iRS3/A24ZNUdvhZUHTn : "2026-11-05", "scope": "글로벌", "entity": "미국 FDA / BeOne Medicines", "what_changed": "FDA가 자누브루티닙(브루킨사)과 리툭시맙 병용요법의 보충 허가신청을 접수하고 우선심사 대상으로 지정했습니다. 대상은 조혈모세포이식을 받을 수 없는 이전 치료 경험이 없는 성인 외투세포림프종(MCL)입니다. 근거 임상은 3상 MANGROVE(510명)이며, 표준요법 벤다무스틴+리툭시맙(BR)과 비교한 중간분석에서 독립심사위원회 기준 무진행생존 HR 0.57(95% CI 0.43~0.76)을 기록했습니다.", "why_matters": "승인되면 이식 부적합 1차 MCL에서 항암화학요법 없이 BTK 억제제를 기반으로 쓰는 치료 선택지가 됩니다. 회사는 리툭시맙 유지요법이 없어 약 2년간의 주입을 줄일 수 있다고 설명합니다. 유럽에서도 심사 중이고 중국에서는 신청이 접수됐습니다.", "strategy": "전체생존 자료는 아직 미성숙하고, BR 대조군에 리툭시맙 유지요법이 없었다는 비판이 있어 라벨 문구와 심사 결과를 지켜봐야 합니다. 상세 결과는 12월 13일 ASH 2026에서 발표할 예정입니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://pharmacytimes.com/view/fda-grants-priority-review-to-zanubrutinib-plus-rituximab-for-previously-untreated-mantle-cell-lymphoma", "verified": "원문을 직접 확인했습니다(11월 5일 게재)."}, {"url": "https://clinicaltrials.gov/study/NCT04002297", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "Pharmacy Times 기사에서 우선심사 지정, 적응증, MANGROVE 수치, ASH 발표 일정, EU·중국 심사 현황을 확인했습니다. BeOne 원문 보도자료는 열람하지 못했고, 보도자료가 11월 4일자일 수 있어 발표일이 하루 다를 수 있습니다. PDUFA 목표일은 확인하지 못했습니다.", "image_concept": "A pair of scissors cutting an intravenous line cleanly in two, one half curling away.", "img": "data:image/webp;base64,UklGRrIuAABXRUJQVlA4IKYuAABQiQGdASqwBCADPpFIoUylpCOioNG4eLASCWlu+9uyZr9s759ZMNz378//Tx3GIrdRMfLfPJfye+H5NjbvXPmO/B6etwHzyPnb5FD1f+nqtayYdqv3bTp/4PgH83NQ54/R582H7Hzq+0mvxUBP59/ivSZ06P6IOypr4iDz6+JZPcn/VvoTZ6bHtyWZnU5CXaic+viIPPr4iDpx7C0uqbkALaMs3IEYANgEq4pVMeWxcmw293SdAFtGTf3ZUVePhiDPr4Jo0tD0fyEG+vf8FdWfxyHDCh62fCGlkzi3bDJizl48zfXcBuLzq/92EQqI+Hw4Hprrjnas9QALhG8F/fmqaoabjOCVPYjo48pRy0MCW+99Af33p0soWP0J9pjbqyYR6YW83JTnicYTZ+yGya1oMv86E1rUFXVFepgIeKA9/BYX3bnAs1y/++1Fk5fjMtEiZtPvL30y3tNLQmte2+eZvqYnWMrYtWOjkoMaRfu/1Z0vIiNISy1IB5VFHYkGPg12AFovoTb3u5wP+jb+HsQ0HP4zG54m1YFH7W1IBhxwZi0vI+eZvFtKtxNflhU+rWX70GPd8J8aPczfLRGGoTihByCjjAzV2X+g+oIyl/XfgCslWJrWyy0pP+2HykQ3vZC3dX+j5OXVAQ9ZQK+YuJSlMfH9TwZrzYiD2BZP/dzQcZvLxcNTuSPtfsemPhzQ1rvD/l8eKQtZ/CmQFe1 료 유지 등 공공 기능에 대한 보상이 수가나 예산으로 얼마나 구체화될지가 핵심입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.khan.co.kr/article/202611051607001/", "verified": "원문을 직접 확인했습니다."}, {"url": "https://www.ksw-news.com/news/articleView.html?idxno=3057274", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "경향신문 기사에서 공청회 일자, 주요 과제, 격차 목표 수치, 공공병상 9.4%, 거점병원 41곳 중 23곳만 포괄2차 수준이라는 내용을 확인했습니다. 복지부 계획안 원문은 열람하지 않았고, 총 예산과 확정 시점은 확인하지 못했습니다.", "image_concept": "A map-like quilt being stitched together, with thicker thread pulling distant patches closer.", "img": "data:image/webp;base64,UklGRvaUAABXRUJQVlA4IOqUAABQRQKdASqwBCADPpFIoEulpKMio5VY8LASCWlu/+NnCQO+q/+O/z+uoT9yegpgD/pc1Tr//R9QfgL/6+RshL4ncjnkF/9vHB/I+bD/Wf/fILvFfIVIvLP+Dy8TRHT0f7/aJ/2v7I/AB/QP7p6szUr0NfsjotNI/2r6iNKipOd+2FUhQGTtZU9am4J5019a/g/7HesHydxI/T/sv/n68V4/5nwF/wn9yz8f8nen+6f5XoKYade3uHFs/6+bf81/7eknwHjc/316ov3//4fvj7yX/dE0IVQ81tD+wB7gKLffhl42LtdAdBC30sEJgc+FMe06uIU+Bx0ls+Bv0YVRAOglFwaA4D6asbibeFtZsZeUoqJqg5pSSM0B0Er5VoNMmOy2CpoIqimMXA0ytwAZPZVuAhzb3kzxVGBvF6Xcph8WKgDoV6V+GKVaQQS+luOwSXgfNPJGr7h/C4fekwCEzHRUQI0zlwxHMyw93uVuWT+suKlUHWb9ocpG2ell77pK1sI7KzzEHVlaWTvH2qfcD8zhnKU25ByiopUMGTGYkLcYKoj95eAAcMDWFfiSyesk4D6e8XA0zqWA8yTPGhl4y5NZMZiSZrlcO2ZWBwqZj+FwzqbwKRlXZWhif1lHDtrgre8aoQDSu6JyJ0UUgDQgC4wTIFucMvHaOQuGXjMSFP949gah2A4VSA8d1p4uHCTiL0EKoWTocww2e9rUVBBF33Lyy4ZnNqMIgBGz3jIsDS5BFxUPsZod1uqe49OmKMiXgPdFElEVR05Xh7WlADyHxEMwPjnuXKzbUkCQmGnWBzMv2hEX69/mFF1OiNaPlLl627zIVzRSB80ENx+9LryCisRGKgJprmokh3yc8m9xpY+lH+wzMPCmQsAoxzw7jlUxtFtXLofRSKFtVADOhtNcMvG2eAdc+MqG4UjG2Y4CRpyvD3Foa8ECPK6L5yEb2BIjBkxmLmbnTgspHBW1m2owh/Wy4cvKoKNy6hHIUgpFGTb4PVaAoc1KZTgLQxyBhHhcM+Bp0fIkULiogHQLX5JUR6fxlxMiCcEsTjlf43Fe2kq1C/cuW/+9eC91862jT/TPox4hp6NOH98cL50sw9prUsKWM0KWaCGmGLHiZRGYx2laj+MIV0cia74ZdIr1x+LcO0ISm8UwzJfbfgzsJqS1p8jUxY5srIm5dM4cHCDVK84bi23maXWObJA8nDRpDZ7HKrv7HE4LcMr9oKqbHNwlRVTMJmGX0ReY5ey9UMMu/C+Ri2/juKHyPQl+BXrzybajDGzncuUnPVUnPSwps9xaOLNVwy8AjPPyFYtcGcbYIwibc7YUx8bgORVbVi/sYND78fDTRveElPu4nNJHIKIp4v1Ol281y7FALYAH 습니다. 12세 이상 청소년까지 포함돼 비급여로 고가 부담을 지던 청소년 환자의 접근성이 좋아질 수 있습니다.", "strategy": "건보공단과 약가협상을 거친 뒤 건정심 의결로 등재가 확정됩니다. 올루미언트처럼 기존 치료 실패, SALT 기준 등 세부 급여 기준이 붙을지 지켜봐야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=548279", "verified": "원문을 직접 확인했습니다."}, {"url": "https://www.ksw-news.com/news/articleView.html?idxno=3057197", "verified": "원문을 직접 확인했습니다."}, {"url": "https://view.asiae.co.kr/article/2026110520042516419", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "약사공론과 한국사회복지저널 기사에서 11월 5일 공개, 제11차 약평위, 급여 적정성 인정, 적응증, 후속 절차를 확인했습니다. 심평원 보도자료 원문은 열람하지 않아 이번 회차 다른 품목의 결과는 확인하지 못했습니다. 제시 약가와 위험분담제 적용 여부도 확인하지 못했습니다.", "image_concept": "A single green sprout pushing up through a small bare circular patch of soil.", "img": "data:image/webp;base64,UklGRq4sAABXRUJQVlA4IKIsAAAQegGdASqwBCADPpFIo0ylpKMloTaoMLASCWlu//Ps09Bq7Y35G/Gq38RfS9bGsfjf/Q4zy393u9qHRjagH/h08dx1//+uwel0zHXBuJ8V7b/Bf/p6j7K3z77r/25qn9m/pecntBwisLDy/iJ/AdF/iUf1efn1L/dYLJYMY//lvHJUHfin4tnZX/5//QMb2L+OHlfnXfmZy5cuXZAuF+PiJ/LZR6U+/AaRzghcCFsQDUX64MipjDGoyrdGA5CaNHMa5ACu7Bf7iTH5PB9yIsGupnEfwtPG5ValGC8CLUl6OwZVkOMN+KvGWsr3dzT7q14dbpzsgDT49022vecUt/8ixXTsRQU56fRr4omxBzQSvaEPuXB8p+vDHRvfVVgokpy5cuXDhqKaXApTl3ficlLOY8UASZ+LqguYx97KfIacqDE63lbNubyOCdz0K5fDitRt/TUiVAh/RSzI9FAFXM65hRNu9n9/CMaok1g4TL1GbyUH+64KeLHwXq0T35y/ApHqGqwMGr4hzfWHLpPGIezwlb7cyPDaNU+1fGfi6qY/RGEJkBf6Tka3DIJjXnAZUyFih41XkoodCSbvVReLecJgQhYNUe7xyF4XeFoFzhAmEoRXeJ70TWckT3ripDuakf38Ix+kf8B52zxkDnIAyv7JEYKhMTrTdnvBq/IJGf10BWCY+76m28kkU2pMa4+n0U2+W9nfq4fdGPmote8jr8UsffYiNJjEFg1OGByXnmvXxoPclhUK1eksrhbUYJdtgx6mDEv92BVT7oI0QL+vfGMOjdeQlVl7BJj52GLuCDaurz5vbrWYsFfVwt26EMNvmSJ7R9sRNW3TTETEl5cNgp2UknqZOuxVkymbxBGttia/oKkyKQw3i9iIQOM/v23nExbCDe4J6Dr9yLYXZ4+sFvfwR6CHhmBcNC2kvVre/ylditCbkO1XNA9L3EzrgpdS3qbWy2M2mVXGwXy78Frd6qc5PmdQnghb5aIQUApyLbdkrZDbRWJal/CagY0xeGEnlYJMNVAWNH1N2NmfEI4bWK9qX/aVMpwpw9Z3HOf28EChnFtcGZO238fwQO207zPxOcBnlS4jqdWj4KBlLLaSSy2cHmGvouAdR153p4WDSwOnnXxmOcxAPjPVSm8c UAQbosdUyWcOjQYpPuQUXvQeC1QAWdfbg0t0j07hh2Lty3v8Kn9Ikef9OcVui3r8rInlHegqiQ7g8CnI+N2KBnKwAA=="}, {"id": "reg-cms-pfs-2027", "cat": "reg", "title": "CMS, 2027년 메디케어 의사수가 최종안… 환산지수 1.83~2.31% 인하, E/M 수가 16%·ACO 32% 가산, 원격모니터링 개시 요건 강화", "short": "美 2027 의사수가 확정", "alt": "한쪽 접시엔 작아지는 동전, 다른 쪽엔 커지는 청진기가 놓인 저울을 그린 미니멀 일러스트", "date": "2026-11-04", "scope": "글로벌", "entity": "미국 CMS(메디케어·메디케이드 서비스센터)", "what_changed": "CMS가 2027년 의사수가표(PFS) 최종규칙을 발표했습니다. 환산지수는 적격 APM 참여자 32.95달러로 1.83%, 비적격 참여자 32.63달러로 2.31% 내렸습니다. 2026년 한시 적용된 2.50% 인상이 끝난 것이 주된 이유이며, 7월 제안안(-1.19%, -1.68%)보다 인하 폭이 커졌습니다. 외래 E/M 복잡성 가산코드 G2211을 수정자 B1으로 바꿔 E/M 수가를 16% 올렸고, ACO 참여자가 쓰는 B2 수정자는 32%를 가산합니다. MIPS 보고 종료는 2031년으로 미뤘고, 340B로 구매한 파트 D 약제의 청구 자료 제출을 2027년 1월 1일부터 의무화합니다. 원격환자모니터링(RPM)은 새로 시작하는 환자의 경우 청구 전에 대면(원격진료 포함) 방문에서 먼저 논의해야 하고, 치료관리 코드를 직고용 인력만 청구하게 하는 규정은 2029년으로 미뤄졌습니다.", "why_matters": "전체 단가는 깎으면서 일차의료·가치기반 진료(ACO)에 보상을 몰아줘 미국 수가 정책의 방향을 보여 줍니다. 340B 청구 데이터 수집은 리베이트·중복할인 논쟁과 직결되고, 원격모니터링 업체는 개시 절차 강화와 2029년 인력 요건이라는 두 가지 변화를 함께 맞게 됩니다.", "strategy": "2027년 1월 1일 시행입니다. 원격모니터링 업체는 인력 요건이 유예된 사이에 운영모델을 바꿔야 합니다. 연방관보 게재는 11월 9일 예정이며, RPM 코드별 금액은 최종 부속자료 공개 후 확인해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.cms.gov/newsroom/fact-sheets/calendar-year-cy-2027-medicare-physician-fee-schedule-final-rule", "verified": "CMS 팩트시트 원문을 직접 확인했습니다."}, {"url": "https://www.aha.org/news/headline/2026-11-04-cms-issues-cy-2027-physician-fee-schedule-final-rule", "verified": "원문을 직접 확인했습니다."}, {"url": "https://hitconsultant.net/2026/11/05/cms-finalizes-cy-2027-physician-fee-schedule-mips-sunset-aco-reforms/", "verified": "원문을 직접 확인했습니다(MIPS 폐지, ACO 개편 내용)."}, {"url": "https://blog.prevounce.com/2027-physician-fee-schedule-final-rule-whats-changing-for-rpm-what-isnt-and-what-could-still-change", "verified": "원문을 직접 확인했습니다(RPM 업체 측 해설 블로그)."}], "verification_note": "CMS 팩트시트에서 환산지수 값과 변동률, B1·B2 수정자, 시행일을 확인했고, AHA·HIT Consultant 기사에서 MIPS 2031년 연기와 340B 자료 제출을 확인했습니다. RPM 개시 방문 요건과 인력 규정 유예는 업체 해설 블로그로 확인했을 뿐 최종 규칙 원문으로 확인하지 않았습니다. 같은 날 나온 외래(OPPS) 최종규칙의 2.3% 인상은 스니펫으로만 확인해 본문에서 뺐습니다.", "image_concept": "A balance scale where one pan holds a shrinking coin and the other holds a growing stethoscope.", "img": "data:image/webp;base64,UklGRkREAABXRUJQVlA4IDhEAADQ4QGdASqwBCADPpFIoUylpCq7oVIIm3ASCWlu3LNpr0hqVjs/zEtbr9x18u5fq9kbjP++zfdbUadf/F06txv5Nh6Kw3Z880ZOC/8J30P+d67P67vBPNd503p9/tW/ub17/csmB+D/+r0v/HP6b/nf4vMvxO/mn6aicYBHszfiZ1vUL91PwnoozdPqzUB87u9FoG+UR/v+VH68CLj1S45Nx68VDIN47NHi20WmOTceo5SdeFLeFX7ClxyPrFdUu/Wt68U595N0M+pP3J7Chv0nmLvrguztLq7l1pS6M8/6MDlRG9izgbwnQZeUuhpi6T4h13qbP9cewdwVQV4DFJM3HJEEI1NjRF9PHkRMW0/oLUGFqiRfIqWpbJDlIsIehO9t8/MGZcjXV50nmV907JOk77EuUiPK8M0vE3jCr9nPbQCo/728LTbnosJDsnsRMtIdPGLC/e70ohg3jFT+As/Lu8L+ntfiMGBLsP9CkrjT3Afl9BkZ63AR1ikpg07rp5DMG8V0K9YX9WCIfChU0qHddq/DXSyPWv5UABGSWczewpLjoXcqEmuFhm3qtKQdJ5VQw8/QuG5EO+Upexang5KVnN/NTYguSn1QvhF39J3+N6YhKzcMgRuYfli/SjXYZ7h3n/rpmvum6Nae+qBkhy7+fHBnynUEOcDaeeSp4BiMHIg3zRmLbgU8o+Hjp2ZrrvKoYNsdgckLCtPJVLvsVPwnsn9Vu+aLahZQjmSoxNXX5N/pd2jWFnjMXDRx4ggpFZAzHoAn5ojzHFoXWz7vYalvP/LrOER/fJx7oxSTAqz+FChIADbIZZ98SFW6fo+0hK/kxGWCp/AWdj7pZjtNoL0r2suNogVrvPQQ0+J4XVuSZzSWMEKblVEOh8KABlu139rotlbv5+Dpt1ZbfHHs2MH2Eu8RrIMM0z1IgVEkPYy8sVPCWF5S6Sx4BFXKpkB+IDf/xip8Gr9uVFdDB4NckGYi6n6Vf7LoQy+fk3ExFhA0iePBQf/k/qtgrI3c09xeeJcvzCSe6Xyx3NyMhSM9vVkynXfXPs1qQJG0rIhZiMTyixgUBz/fyOx08J1K5G/+J4TMH5NEE4hx/Q93IN5ntE7ZoGDcgU10K4EYmBiBcbk3xQmW+9vHBRz6cC56+KGIzOS5tAIhoM5Wcu3tDD139MY4ZLgzQBvkUhh21cxY/C0v4o/NaWXGSihRIa0571vuMvdBcLNvQ9DKL7cN52OHcD82qR7zR+9YH+MlP6LSoQ8uLdK4rAJIkOXe4p5/fTdrGkA452lsUxAcF2AyU5nzUn3rbzxRvcDHladbachRHGMOWHp30IAWXGmxbQyN1iwP8nfAXWeypfmZEHtb1KR78z/7PLYPoydVgq2AemKOw+i5gWD5PF+LwuUlb+cEG9GVB2udNgwtaBNMkDytwhUEhPngKDW1Xybj8/pv/6j+UWRT+yzkHUOPDLdYsQPeU0U+IUxQ1Kp8pcAxMqi2iqBd6isX0YcZgtQ4TJPuemwFG8Z8V80M3Ul3eEkdDAQQmw2pw1qoGJuXAJ6DHOQeZ+Tt7VZbHgg8Yv/pG4S3qckhUS00lz3QiUmKobZQdGgyr00zjfK6hHNgxJDyhDNMrwcfSk6TtJgcdRcJm98L62CnmRMnDaTNyivqkDwsgIMIlgoUNvt0rnRyGpMvOg+3v4u1gfoQj1XZdw2/kKbjcI+h+5lUtPq/xXfsoc4ANJbM 랐고, 지자체가 대학을 추천했습니다. 목포대 등이 순천대 추천 절차와 부지 문제를 제기했지만, 정부는 외부 법률자문을 거쳐 반려할 하자가 없다고 판단했습니다.", "why_matters": "2월 보건의료정책심의위원회가 의결한 지역의대 신설이 구체적인 대학과 정원으로 확정됐습니다. 지역·필수·공공의료 인력 확충 정책이 실행 단계에 들어갔지만, 의료계 반발과 탈락 지역의 이의 제기가 이어질 수 있습니다.", "strategy": "2030년 첫 입학 전까지 교원 확보, 부속병원 설립, 의학교육평가원 인증을 마쳐야 합니다. 정부는 2029년 의사 수급 추계 때 대학 준비도를 점검해 2032년 이후 추가 정원을 논의할 계획입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.kyosu.net/news/articleView.html?idxno=212060", "verified": "원문을 직접 확인했습니다."}, {"url": "https://www.ksw-news.com/news/articleView.html?idxno=3056691", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}, {"url": "https://www.medipharmhealth.co.kr/news/article.html?no=121025", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "교수신문 기사에서 발표일(11월 4일), 대학별 정원, 평가 지표, 2030년 입학, 2032년 이후 추가 논의를 확인했습니다. 교육부·복지부 보도자료 원문은 열람하지 않았고, 부속병원 설립 예산은 확인하지 못했습니다.", "image_concept": "Two young saplings planted in a wide empty field, each tied to a sturdy wooden stake.", "img": "data:image/webp;base64,UklGRmQrAABXRUJQVlA4IFgrAACQkgGdASqwBCADPpFIokylpCcioXHIiOASCWlu+xnUU+lqHNl0SXXYcjIf2wyL7rxM8HHN/9ML+Zzf/kZ3rfcbYSu13gEPG7QLBX+688P53XZ5mnpD+FkXQdl5n25n25oLj7LzQTXYvM+3M+3M+4OSLO8KUec1Ly7D2HoFuwe0wJbsXuWCHS1fWVlkQmXGymNQ01TPikDpNeTPP4FSHrGhWFOSBMWOBEXt4zJp2bN81YmnxALM8N5Riw4ATCnmWVIDDPEceWeF59+BW3ZBj+ZN5AVQzzl5SXoI6wkiPO0ovM+3Nk1WO4Uo85cXShtDEpDOIcXoME/8f4l3jDlhi9gRC43B4p6d6MN8D3mwpr5MIoAyMygCSn/8J3p9x10YXyVDl9Aq+LzZNbA4unNxJtgprBb2cE2Akx5Dl1piiW7RsN0PbX68KftHo23HF02/jeAqYTEdZvWL1g9JzmQIwT8qxEcYpdWR3PM+5Sk36o6fEb3GL9ebYQZ/0ccc0afWhhxbRnJ7BOnmBT2Cd5MG1GO1I44qqmJ3Oc+4xd5W6zcgM8KTMQzaYp0UtKtyHSjzlxegwYv15IshN9oR6Yz3GLvGG83Nj+vDu7wl7WuDk/M8JlIxZCO57t2LzZNmvNIwWjcNdGeD77LzP2altfEbJz/QApXF/3y8Q/f3CVEPutB/XRGvENsPOXF5Oy5TwT0A0UMR2LzPW/+OZJvNhSapci3nFnRo1YTgG1ASs67B73Schy8y6oFT/mFYi+atQh2QJPo1XmWzhd50zvIAKfXUGEIEtARlfEbPwSIBcHPub65U4tiL45vJx59vi+28oJFEAEbD7xxi595xuo76TGbCDHaN6IhtEnMQgEsFJaYw+2EFCSI9TqhekTEcOCyobBnusNNs2wVhS/0up5L1TwlO2Z3J208FLFmaYarLb5Hg/KzOujwIhkt12J08wPCIlxCrV3V2PZL 국 매출 1억5,681만달러", "short": "SK바이오팜 3Q 최대 실적", "alt": "책상 위 메트로놈의 추가 동전 더미 위로 점점 커지는 그림자를 드리우는 모습을 그린 미니멀 일러스트", "date": "2026-11-05", "scope": "국내", "entity": "SK바이오팜", "what_changed": "SK바이오팜의 3분기 연결 매출은 2,584억원으로 전년 같은 기간보다 34.8%, 영업이익은 1,163억원으로 65.9% 늘었습니다. 일회성 용역수익을 빼고도 분기 영업이익이 처음으로 1,000억원을 넘었고, 3분기 누적 영업이익은 3,031억원입니다. 뇌전증 신약 세노바메이트(엑스코프리)의 3분기 미국 매출은 약 1억5,681만달러로 26.4% 늘었고, 미국 처방 건수는 전 분기보다 6.0% 증가했습니다.", "why_matters": "국내 기업이 미국에서 직접 판매하는 신약이 안정적인 이익을 내는 구조가 굳어지고 있음을 보여 줍니다. 올해 누적 미국 매출은 약 4억4,129만달러로, 연간 목표 상단(5억8,000만달러)의 약 76%를 채웠습니다.", "strategy": "소아 부분발작과 일차성 전신 강직-간대발작(PGTC)으로 적응증을 넓히기 위해 FDA에 추가 허가를 신청했고, 방사성의약품 치료제(RPT) 파이프라인과 후속 뇌전증 후보에 수익을 재투자한다는 방침입니다. 다만 후속 후보 오파칼림은 FDA 부분 임상보류로 신규 환자 등록이 멈췄습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.g-enews.com/article/Bio-Pharma/2026/11/202611051421237788b065b72042_1", "verified": "원문을 직접 확인했습니다(2026-11-05 보도)."}, {"url": "https://www.fnnews.com/news/202611051423262752", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}, {"url": "https://www.monews.co.kr/news/articleView.html?idxno=415158", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "회사 발표를 옮긴 언론 보도 본문으로 수치를 확인했습니다. DART 잠정실적 공정공시 원문과 회사 보도자료 원문은 직접 열람하지 못했고, 순이익은 확인하지 못했습니다.", "image_concept": "A steady metronome on a desk whose pendulum casts a growing shadow across a stack of coins.", "img": "data:image/webp;base64,UklGRk4zAABXRUJQVlA4IEIzAACQqQGdASqwBCADPpFIokylpDIwoVG4kkASCWlu3Jg6yfIqiNYFr9Bn/+PpYk/yOx5zD/av2fy1OmzuNPGOP3E+pANp5WyPe1XOl6TP7v5/HT38yfmvejPepOij9bH/HZMf8M/8vpZt617mautx+c4rOAi+PtC7MTVZ8PbA19J9Q3+c+kYEDFMg3Li+GL29aebGZMxBfbpLntPOXLxGXt4xb7t0rg6qGQXsQYkgxXgN+Pt9UrBE1zyHzgXMnKlfUGsdLeHiidaIj3tAOtP/0J7yZh6aOb7rJDKy6AhjdAAH2vnsRMBv8qHvF3BCsMz7aZfyvCaJl+XXmpO/9E7d0CQHGTfs9drfkm5Jm06qZ3hMuBH7LYruGkvMuyZQL0jZ5lzxyd4928sM/9CcqHSWvQm/STF5/kBGSCOdvizi9MmkPMuc0lu9ck2ED1z9O/mSrgv2xQmfOJMTduCKoe/w46QWXt3rrhc6s9aKVUuMEttLDlNB0dB2Xmeu65re3Ld0NsT+m3Yzzq/x/VEt12J0/FkIE/bm1/Hjl2gpgDMt29c5aGHZ2qDDpdJMJcecN2J4lYcXmgm5ponFZJ 입", "alt": "열린 종이 파쇄기 위에서 작은 풀 한 방울이 두 퍼즐 조각을 붙잡고 있는 모습을 그린 미니멀 일러스트", "date": "2026-11-04", "scope": "글로벌", "entity": "Evommune(NYSE: EVMN) / Hinova Pharmaceuticals(하이촹약업)", "what_changed": "에보뮨이 하이노바(하이촹약업)와 경구 VAV1 표적 분자접착제 분해제 EVO570(중국명 HP570)의 중화권 외 글로벌 독점 라이선스 계약을 맺었습니다. 선급 대가 3,000만달러는 현금 2,000만달러와 에보뮨 보통주 사전지급 워런트 1,000만달러어치로 나뉩니다. 개발·허가·상업화 마일스톤은 최대 약 11억달러이고 단계별 로열티가 붙습니다.", "why_matters": "VAV1 분해제는 노바티스가 10월 말 몬테로사의 후보물질을 도입한 분야로, 경구 면역질환 치료제의 새 표적으로 경쟁이 본격화하고 있습니다. 중국에서 발굴한 분자접착제가 미국 상장 바이오텍으로 넘어가는 사례이기도 합니다.", "strategy": "에보뮨은 선급금 일부를 주식 워런트로 치러 현금 부담을 줄였습니다. 미국 IND가 승인됐고 중국에서는 IND를 제출했으며, 1상을 곧 시작해 2027년 류마티스관절염 2상으로 넘어간다는 계획입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0002044725/000119312526447608/evmn-ex99_1.htm", "verified": "SEC 8-K 첨부 보도자료(2026-11-04) 원문을 직접 확인했습니다."}, {"url": "https://www.sec.gov/Archives/edgar/data/0002044725/000119312526448443/evmn-ex99_1.htm", "verified": "11월 5일 웹캐스트 개최 보도자료 원문을 직접 확인했습니다."}], "verification_note": "SEC 공시 원문으로 조건을 확인했습니다. 하이촹약업의 상하이거래소 공시 원문은 열람하지 못했습니다. 노바티스-몬테로사 거래는 배경 설명이며 검색 요약으로만 확인했습니다.", "image_concept": "A small drop of glue holding two puzzle pieces together above an open paper shredder.", "img": "data:image/webp;base64,UklGRoI5AABXRUJQVlA4IHY5AAAwqgGdASqwBCADPpFIo0ylp6slodKoiWASCWluc6jgH2/KT+800SWF+PVQR7yE9UL0jVk/e2z+evSFxn/fc5NVwgDYu7drzwqWNrOV/WX3R2M6SdB27X/N9dv+F6evpi5z3T3v5P0219S+9PR9cN7457ObtjHxD4BH0L1KIvns4lD+Gawfg/o6/2PkUfM/+76nn+d9YoJSxZDSzLBznqUohQc2HcnxSoGw7Y1F1U+KEsYdpql1isqprJJBcqgbD7CT3hCNOl+SFoaYMFW4YUS/khgrAgAO01jtIqqXTuOq5j/FXxN8KxrowzOoS3q8VAmniE2ImrzmtdqM5sOVj4XUPjfFAzSfVe+JsW1p1sMT+Kvfri6d1Vfg5rEdJy68qfF/Le5rl7AB2uuLq2EDYQ5FLqlkA2Ua6zFYq3OaLeuuVC772xuGDLjUuaXT0HsX9zhQ9OpzhpEHUlEwQh6dSOWvkMmdCp58bdU/aaEtU9Q5ugQpp1ccymqXNJs53V4p7Achen40vdWI4Gl6HWvgUqBv11oCiQIANmSAUHVPTbxHAGqftNTUm5U0pBjJXkyB8UHN3lImvNI/1ATCiomHCLB2LquVI4hkEYZ5NXmorOFhWywb0007kFHfI7IK9HhC7vFcVkQMpgYK1EdU+KBmk9ud1UplrA7ml1UyyjAjH19PJWh5gaGZViCGXBL6Y2Ow1azQSnNDFSV+mvz s-call-transcript/", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "SEC 6-K 원문으로 핵심 수치와 가이던스 변경을 확인했지만, 열람한 원문이 잘려 있어 나머지 세부 항목은 확인하지 못했습니다. 보고 기준 영업이익은 손상차손 87억크로네 때문에 고정환율 기준 9% 줄었습니다.", "image_concept": "A single white pill balanced on top of a rising staircase made of measuring tape.", "img": "data:image/webp;base64,UklGRjQWAABXRUJQVlA4ICgWAAAwMwGdASqwBCADPpFIpEylsyezIVS4EmASCWlu//+70r2F2nbEH2Sagzo+9Ml5XS4YvtFVPJ76Ch72r23nd9ftgv+hgUlEZq1atWrVq1atWrVq1atWsLlYECBAgQIECBAgQIECBAtAik1bDaStcB/eEsJUhIrIGh8lWOWbWqZwdiCdkUAcpJ38Ny2klKRBqlEgQIECBAm3xmB59eu4tgOmUD+FhR48ePSWrVq1muStdpmPq9omS1SVpK5xmyl8FYdHHk0EmFjw6bSJwsTBaes5KQHymzmzZs2yNpvJlNgAM4HMBevXr2FmrVrgQ+C4Wb39VHOvZ7D1bKl+Px0/0yf2+V69e09aPBoewIqQU/asABe+tbuPhzzp5bBAWMUCye4unaQwc1w9ID40ukeGwpwU6cayLCQRIzgQWsxPjMtzW1ySGEWsUtSq3Wep34TXqeloDPr4Ct6AsQqo4KoCMlBh/UfBcWenBGBWvC0g/bSVq35BRwgDwmHIFixYsIjYsY8M7WYKTe1qFYJgtOHDhw4cUxo0pEpR/Zx86scuPHkPxy7TSviDyYLTX9FAVmcftmAJvJSLAZXmpH6sOSEBDswDOhUxN/1hw2KLs8gzVyTDzTKSd9oabChjJXtPt51jvKh2vDr167i114QSiRI6IfBbtEtBqeSI0VCsnS1dwsqKZISJEfr1n114QUF+4JFZlhF6QSiRIkYYj8Lu2B4WaEGIHxoZEUXC0HKijE6SCoQEKovzyihH6fFxsRE0ZjWcfwuQ4SIJYb4Lhw9UvbJF5r0Qzt3169T2KAAESAnuLlySb1YB893GewcMy1IiHVBpqMT5ajFGcFinFPdZs2gdQmvXr174jl0ifxnr4DokxSlEEUdHW2RUKrpiSEyZ0Bw4Wb4BaEiB1n7pXpDGwZkONDB0UL8Sftihv9dwIKBYwslH7CM+sqsCj3w954wUQMh1hCdfmNcwORM5+CT1pw4ctZxcOHDhwcu9+4KH3GXkCiSKs+EA8T1T2fUnUncPaWL4yYoU2FU2cm7F5MFbje+UItf0O3MEAJ9eprGuNpufyQnChIgYFw4V8AoXEjFTVgPN9jnN5fPtQmIZ+3nLtPKDDZzC6vR7yxCCAQt4hDSlEuIpAKIsdH+ngRG5feotQ4chm8Bmsm4tDG7BScb/kkAkrLZ/W/k4j2u7Rca45sRIkP3QxreObr0MN3m++LEOdlY2W3sdkO3rzPZxeqaeuXI2HgTPlzW3Gc1AkF3M2bN1eo5jm7+/tACT4LdomTJkyZMmSyrynm/ijDD8/+IDAlKIqTkxQQpNoj0emi1Gj583xrLNesjzaI3T3lQJTJlLrRcuWwQAn169e+a3mw/A2cM+lc5BF89oeFOE4EAVRlKcFqlQWLFinj+EiP1eyXTkmvXqulfjxvwbP0mNd0uOkF9BCm6NV8E24keSQR6S1atKC9ep/I5vPXkShh8FixYtqwKO8wISdvoiI2ECcE2tACkpdNAd22lvJe84BVhwBY50eAoflUOMQU0vLp54tMzQ8xigrUmUePTzI3Yp5rJbhgQHxqRziv18kFLIDNsjHCfL6rBcQhqB/AQwKu1f8UNPXwe8F73pqwbVJ3R4BWnFTDsDp85FAnq0H31DtYC const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},

const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>

   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
