s-er-search-guideline"]}, {"head": "11월 5~16일 국내 바이오 임상 발표", "body": "AASLD에서 에피노페그듀타이드와 DD01 결과가, 11월 16일 CTAD에서 AR1001 글로벌 3상 결과가 나올 예정입니다. 일정은 단일 언론 기사에 근거합니다.", "refs": ["bio-kbio-yearend-trials"]}, {"head": "11월 7~8일 생애말 시민패널 토론회", "body": "약 300명이 연명의료 유보·중단 시점과 대리 결정 주체를 논의하고, 결과는 11월 말 의료혁신위원회에 보고됩니다.", "refs": ["reg-citizen-panel-eol"]}, {"head": "11월 16일 페이시라 공개매수 만료", "body": "연장되지 않으면 이날 만료됩니다. 발행주식 과반 응모와 반독점 요건 충족 여부가 비아트리스의 연내 완료 목표를 좌우합니다.", "refs": ["bio-viatris-pacira-tender"]}], "priorities": [{"head": "펨브롤리주맙 경쟁사는 FDA 수리와 특허 협상을 추적합니다", "body": "신청만으로 시장 진입 시점이 정해지지는 않습니다. FDA의 수리 여부, 미국 상업화 파트너, 특허 협상 결과를 함께 봐야 합니다.", "refs": ["bio-samsung-epis-sb27"]}, {"head": "재가 돌봄 사업자는 2027년 계획에 제도 변화를 반영합니다", "body": "방문요양 횟수 상한과 통합재가 제공기관이 늘어나는 만큼 인력과 물량 계획을 점검해야 합니다. 국비 지원 입법과 예산 진행도 별도로 살펴볼 필요가 있습니다.", "refs": ["reg-ltc-premium-2027"]}, {"head": "응급의료기관은 영장 집행 대응 절차를 점검합니다", "body": "가이드라인이 나오기 전이라도 자료 제출 창구와 진료 공간 분리 방안을 미리 정해 두면 진료 연속성 위험을 줄일 수 있습니다.", "refs": ["reg-peds-er-search-guideline"]}, {"head": "의료기기 업체는 사이버보안 제출 자료를 다시 맞춥니다", "body": "입력값 검증과 오류 처리 시험 문서를 개정 기준과 대조하고, 일부 항목의 미적용 사유 자료는 11월 26일 온라인 교육에서 확인하는 것이 좋습니다.", "refs": ["reg-mfds-device-cybersecurity"]}, {"head": "개발사는 안전성 패키지와 자금 여력을 함께 점검합니다", "body": "심사 연장은 출시와 자금 계획에 직접 영향을 줍니다. 심장 안전성 평가 계획을 개정 지침과 대조하고, 허가 지연을 가정한 현금 소진 시나리오도 준비할 필요가 있습니다.", "refs": ["reg-agios-mitapivat-pdufa", "reg-fda-qt-guidance", "bio-korea-weekly-disclosures"]}]}}, "archive": [{"label": "제13호", "date": "2026-11-01", "count": 17, "current": true}, {"label": "제12호", "date": "2026-10-31", "count": 24, "file": "https://drive.google.com/file/d/1Zpw9UQH6Wa_-1eE728hQ8cRiFUKeHWV3/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제11호", "date": "2026-10-30", "count": 22, "file": "https://drive.google.com/file/d/1-orZiLlR3rrSXRc7qrv9deqpxuikMPHL/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제10호", "date": "2026-10-29", "count": 20, "file": "https://drive.google.com/file/d/1yA1vQq-1H4u-IVdYJg93  11월 1일, 별지2 신규 약제 적용일을 11월 11일로 전했으므로 품목별 실제 적용일은 고시 원문으로 확인해야 합니다. 보도자료에는 건정심 회차, 환자 수 절대값, 연간 비용 변화가 없습니다. 본인부담률은 뉴스핌 기사로만 확인했습니다.", "image_concept": "Five different small bottle caps threaded together on a single thin brass ring.", "img": "data:image/webp;base64,UklGRp5GAABXRUJQVlA4IJJGAADwLQKdASqwBCADPpFIoUylpCqoIhO4qVASCWlu4VsRh8rmYcpGQCze6VCt6BbFdBj/VM9gr+8f9fm79Pe4255J9W/bPzjefWQlyGcz2WO2X9Z8Q7Ifu6Om8yzCzxO/k/UF8+/Bk/neZH0q9NqoyGLZkG16k5rAtfkBVRdsyEVgWvyAqou2ZCKwLX5AVUUAjEXbMhFYFmGLIwyYu8OaybrdCiUdUBgYLa6YAzga10FQvV9fsdsxAKQsm/6PPxqWyD4KVEq/tWZzuffR8UfdYr5yOZlRLxd4c611hKx3xSc9IuYjvQExjLfcdDKgyg/tPKlrES1AegwqoGO/vDmaaizF9I7q6Uqou30mVBlB/eHNX3Jb3hCuzIPgAK2EAqou2ZDocYJdjsUITRo+QFVF0uxkXa8OZo0fFCwqou2ZCKzXwsklq2ZCMWY3REII7eXl5efICqi7pSqgQzGRcksvHIGM4eefky1RiDA46XQVC9APpHxlFTyI5hWD82tXnGpZ6PQyQ7LsY0/9G5PatsFp3ITrF3Pm7gs2kMOfQlBrGKzOMCza1b7gFVF2zIRWBa/ICkO7MhHCsq6C3gu63QnPpLE/3nM9IC5LLsz+sCsIBVRXOVEKLgPXshffq3gASTIPmeXxxUyq9mwLxHZtcdDVPAUpZ82rU2QfM4kQYaRrlW725lkcljTkraDcU0cTE9c4vqf3sDgXn2BhESzS5ACJlQ4ifR7ktWzDyHfYmKR9DKDt9giEagfGBA9r2ZZf/sES//qHgVrT616SJ74QfEtjIKYRbPgqzIHkh7DdYbbGXtzWbfg7lR+7ScOXh+t6x9Rd43ZLOpFU+AUh3UVZSFKZwo5nR9gko17WEtIJp/Xm//92elLMCV/mcbNRhf9Ak4nnEIGGodjd54CUQhqo1X8LnXW9ByQBSESqfANTxuS21c/aQqKetfkAtwrk7t4ibDJYdZry58yTxT6k3csba/SSh8tpw+OWYMMb5CR1XAICIpudcYy0GXqiYJtr8fNbe3uLZLYeWt7eefq3I9HQrAi2iCTGDxi5lOXoPZd3u+WhZKipnBxlvypBQAEMzSGXZh7fpLFnn7hDX1vPkBVQMcVNkBHK1busHWI618CB6aAfT/fpnPnVAAuO+VMvXC4Vk+v1hQAFhfNQ5305AVUVz/3i6EO31LBWbkKUK3yTsBeLu7eNQgASi//1kNr/W1XQC8axK5NBRO6QiI4MQkYK2GmI2/a6x8KBOwI2l7a7+8PEOhahEjB7UgwiWwwMKqLtk6oO9T4Lauf+1Du/HCKyagstn4i/0Q73pvS5W0PNCAI/4BpZR8DaZRFKFSY2dTSbsLqazP1qYF4hS7MamhVGLI/xA9NdcFssR/Dv9CkuojqG8zEcYPAtbnZHUAKLvuPJu/799qlUOAstqjg1H8UJRwokLozut4qXYShjsUaE5IC+oXFKK+OZjYR0o7TrRb8vdejyApDU/6trHkdqJ/erIv1vl/ESnGrPqfTOVMFs0ged0lpzYo5nMxWD828gLiSgVUXu4InRpspy64yPr4VcHMSqcacCuxLoaM6ghVd31cWsaj1U/EqTaPnnGhYi3QYtH/+EmNioOvtq4HnuEfPdamFMKDqmOgfWoqzA4oZtoxPNc0mBKQtbmTE2iUVLoiKRI9uJBfosgA/VarYobZ77F+ezcXair2Av9zBbDCZxCid+yi07w 심사 연장", "alt": "위쪽 유리구에 새 모래가 더해지는 모래시계 하나를 그린 미니멀 일러스트", "date": "2026-10-30", "scope": "글로벌", "entity": "Agios Pharmaceuticals, FDA", "what_changed": "Agios는 11월 1일이던 PDUFA 목표일이 2027년 2월 1일로 바뀌었다고 10월 30일 발표했습니다. 회사에 따르면 FDA가 10월 9일 위해성 평가·완화 전략(REMS) 필요 여부 판단을 위한 추가 정보를 요청했습니다. 회사는 10월 19일 RISE UP 2·3상 공개 연장 구간의 약 9개월치 안전성 자료를 제출했고, FDA는 10월 28일 이를 중대 보완(major amendment)으로 분류했습니다.", "why_matters": "우선심사로 진행되던 약 10만 명 규모의 미국 겸상적혈구병 적응증 판단이 늦어졌습니다. 쟁점은 간세포 손상 위험과 REMS 부과 여부입니다. 회사가 인용한 AQVESME 라벨에 따르면 지중해빈혈 이중맹검 구간에서 301명 중 2명(0.66%)에게 간세포 손상 의심 반응이 있었고, 공개 연장 구간에서 3명이 추가됐습니다. 이 5건 중 2건은 입원이 필요한 중대 사례였습니다.", "strategy": "연장 자체보다 REMS가 라벨에 포함되는지가 처방 접근성과 상업성을 가를 변수입니다. 2027년 2월 1일 전후의 라벨 협의 결과와, 7월 첫 투여가 이뤄진 확증시험 REIGNITE 진행을 함께 봐야 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.manilatimes.net/2026/10/30/tmt-newswire/globenewswire/agios-announces-new-pdufa-goal-date-of-february-1-2027-for-mitapivat-sickle-cell-disease-snda-company-is-launch-ready-and-in-labeling-discussions-with-fda/2458197", "verified": "GlobeNewswire 보도자료 재게재본의 본문을 직접 확인했습니다."}, {"url": "https://investor.agios.com/news-releases/news-release-details/agios-announces-new-pdufa-goal-date-february-1-2027-mitapivat", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "일정과 안전성 설명은 모두 회사 발표이며 FDA의 공식 확인은 찾지 못했습니다. 회사 투자자 페이지 원본은 열람하지 못해 재게재본으로 확인했습니다. ‘겸상적혈구병 환자에서 지중해빈혈 시험과 같은 양상의 간세포 손상이 없었다’는 내용은 회사 주장입니다. 보도자료에는 유효성 결과가 없습니다.", "image_concept": "An hourglass with a fresh handful of sand being poured into its upper bulb.", "img": "data:image/webp;base64,UklGRpAlAABXRUJQVlA4IIQlAADQYAGdASqwBCADPpFIoU0lpK4ooHR4UcASCWlu4VsfDvB9WOImafR94i5CIXt5VIUpkV2z/SJuCOeN85bf0afm76cd91O1vgBPm3Gubd9BMY9Abi1Bhbp06dOnTqjwXJIl/mIntsKLJmReH8kM+5MmTJkyZMmTcyJEiRqEjxzBFGW9N+BYCP+fv8U1oMCUQn2+BojUvepPzon7LpERnLjx5do8ePVDKOiGdm/2AZ5mpMYBxtb/1MnM7rspooIL7VRGPjtAfLC7YTpd7QIRGbdgUoMVIkgwDcBNqJTOJdBey6cTE+5MrdL7k1dvd8Jnb/Vq1WOXHjx49Ja3dHk4+WH2dOnTthigXBlkmCxfOVLPeuOjFRE8jmybf+CX9LxnKgdnf35WffM8DS7To 획을 개정 문항과 대조해 볼 만합니다. 특히 S7B 신규 문항이 기존 비임상 패키지에 추가 요구를 만드는지 원문으로 확인해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.fda.gov/regulatory-information/search-fda-guidance-documents/e14-and-s7b-clinical-and-nonclinical-evaluation-qtqtc-interval-prolongation-and-proarrhythmic", "verified": "FDA 지침 페이지를 직접 확인했으며, 발행 시점은 2026년 10월까지만 표시되어 있고 지침 PDF 본문은 열람하지 않았습니다."}, {"url": "https://www.pharmavibes.co.uk/2026/10/30/us-fda-guidance-for-industry-oct-dec-2026/", "verified": "제3자 지침 목록 페이지를 직접 확인했습니다."}], "verification_note": "10월 30일이라는 일자는 제3자 목록에만 나오며, FDA 페이지로는 2026년 10월까지만 확인됩니다. 개정 문항의 구체적 내용은 지침 PDF를 열람하지 못해 다루지 않았습니다.", "image_concept": "A single heartbeat-shaped copper wire stretched slightly longer between two small brass pins.", "img": "data:image/webp;base64,UklGRsQiAABXRUJQVlA4ILgiAAAwTQGdASqwBCADPpFIok0lpCcooFLoMRASCWlu///o7/9nt7b0wukPPtWz+XnXcB+p2QeY/9bN+5QOjq1Bv97p6bi//+9YpB7Zcl6N2z42V//Z49I39/9KX01eoznWt2g9a3+N9N5fZPwH/9+tSyPzsw69vfUvqKOVsAvJztMPI8wKxS1RPc77Rrmc0H/Q+khqkhkXTWribKsMAPOzmoHR3BfL9wXzD8095prOnTp06dOnTp06dVp/ONa2VZUkeUE45dtBqXrvdkZQAWH+Lms7ck+bne401MjebPIXbnPMkAFVfD82CRrP39c/DSgHwvsgOdd9Ywl2gC+ORPCrvq5srF9aXb1vC3BoYCNpQ94CBM+efUyiKMStFQYZ71iQa26ccy5rRcvMN3Vi9Cj8j9RVfLLNUkzmoRBAicgHUUoVuI1nWZijV2yU8DPN7n7JeRBpHl8wAvODRk9ppD9RVi7qPKFdQTI+86K1FClmDY+Pap9MBarXERIKAH9DCe9f7OX0SQe3eJPtQW713xPCOr5t1oQZaAe83L2LtMCCiHLk/9UuezZ9I1oZahSsEfqbN3PQqL4ilLi/G6Qj45GZuHmA+S3uIw/AjsMUJiOSFAUFBbfTGumTsqfG8VD3ZWJOcGbKW1n7/bQq9/R2P9KHtU5wal3OaRWg6mTrjZaoq5uieQKfmvrQQInpvwpdpRcPMX4VEeBaKZECZHaFZlTrUE2p/rG0IkD+2dXnd+opcQ2seJer5uI80KfJUMFucjtareAfmVk7x2Lr3UpfQPMNcONu42JjxxKBNZ06dOnAsgFS2dDqcofMh9m6NBmEDt6pmDg92URjzKmMTml2oFvlRiuozT0Pdtp4FCVwh4kg1fZgOhj4QbWO+1capKp4J3Tde94d9UA95Rzj2opbyhhkCEHgBK8iTtz9MMiRacq0ORO3d9UHu+EXOwXdU5qdjlGbNJXpA8gUqodG0qwwQ66XzhP0rvkM8ZfrqXMtTr/5WaKa+3tQWgXqdkA902OdtKkyLCnBsDp7ijUPWZgKcuFAPzmuiq+jAp6A/27kWxHqvTI54yGLWdOju1sylANRAPrjYEb+SlgIMlFVQF7oQftZ2yWiHjjYJgWIAoUtriYyjtB+Emsfc8dkFSVK9PMTILufjDMhL5WUvrcvjq4JvlerVmCtdFLqpstj date": "2026-10-31", "scope": "국내", "entity": "한미약품, MSD, 디앤디파마텍, 아리바이오, 푸싱제약, 코오롱티슈진", "what_changed": "서울경제TV가 11~12월 주요 임상 일정을 정리했습니다. 11월 5~9일 AASLD에서 한미약품이 MSD에 이전한 에피노페그듀타이드 2b상이, 11월 8일 디앤디파마텍의 DD01 2상 48주 조직검사 결과가 나옵니다. 아리바이오는 11월 16일 CTAD에서 AR1001 글로벌 3상(1,535명)을 발표합니다. 코오롱티슈진 TG-C의 2차 미국 3상 결과는 10월에서 12월로 미뤄졌습니다.", "why_matters": "결과에 따라 기술이전과 거래 가치가 달라집니다. 기사에 따르면 푸싱제약은 AR1001 3상 결과를 보고 최대 47억달러 규모 옵션의 행사 여부를 정합니다. 디앤디파마텍은 글로벌 제약사와 기술이전을 논의 중입니다. TG-C는 7월 1차 3상에서 공동 1차 평가지표를 충족하지 못해, 2차 결과가 개발 부담을 가를 수 있습니다.", "strategy": "투자자는 일정 자체보다 평가 기준을 봐야 합니다. 에피노페그듀타이드는 지방간염 해소와 섬유화 개선, AR1001은 CDR-SB가 핵심입니다. DD01의 지방간염 해소율 62.5% 대 5.3%는 참여자 67명 중 분석 조건을 충족한 35명 기준의 회사 수치이므로, 전체 분석 공개까지 신중히 볼 필요가 있습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.sentv.co.kr/article/view/sentv202610300055", "verified": "기사 원문을 직접 확인했습니다. 기업과 학회의 공식 발표문은 열람하지 못했습니다."}], "verification_note": "일정과 수치는 단일 언론 기사에 근거합니다. 기사 URL에는 10월 30일 코드가 있으나 페이지 표기 일자는 10월 31일입니다. 검색 스니펫에는 12월 연기 대상이 아리바이오처럼 읽히는 표현이 있었지만, 기사 본문 기준으로 코오롱티슈진으로 정리했습니다. 결과는 아직 나오지 않았습니다.", "image_concept": "A single sealed white envelope resting on a clean white laboratory shelf.", "img": "data:image/webp;base64,UklGRmITAABXRUJQVlA4IFYTAACQNAGdASqwBCADPpFIoE0lq7gooRPYOwASCWlu+CQnbXCu01sOb+mi6sTQQ70Gm6iD0syEFAv/+8n3uZzxEzYwi3FE3hQcnAaD3Zi/7hjpCYAdGS37XeKxtL3FLXpIPdmL/uGOkJgB0VmOEwNhxwW7x/PorGhD/ISAWv+2kisZUh3P2q8rrUgxVQdE0GZp98nVApCOscImAHWCQsrdjxWOETAIdo7pOhV/nhvkUKvbMUNQdCBx0HGVI2q/7htV6d61ukJkhC1Gvp/V6TT8VpITeaEsZ/utSEvNlAzARCJ/xn8/ar2zkY07NqyTWkg9zhgxVQc+4x9vpeommy/2yI1ZO/G6K08HqvAsdkoSWr8cJgCqvJpvf+jIx4Z/gqVaRjwBZtRp7Spgbjvr6Bihqndlp8FIFdIiZ3EbpdITAER1jQe4KL4xDlZ4Y51ZVZuOB+gOisaD3aFKO0HUYi+qgt7kJqfNFY0HuxHOALfoquTSHAkEqC06hxw5YTC9EvqqMVITAW/n5orMcyTADorGiD7yle9sxgsFRM45R6pMKODgUNzqEQfmLLsdLeOhBjnOEY6OC/bwmG1diNOTucP2ENPj4Et5zfuH9EYIhE1BdFhPgAkY91h2LQSACIy9I/5E06iG6OL2zRScdv0gJOcc8CsLmyEHuzF/3rZ9FcBIIC8QfdiAhL9fOqdjpY+9Lp7SPncjRrl0vAYDzkAJY0IfdmMAtNd32KOXn+R0jgTPxbrh5YYpv+IrutYaqzDqowsG69Z2phf92y/EaG  방울의 액체만 새어 나오는 유리 비커 하나를 그린 미니멀 일러스트", "date": "2026-10-31", "scope": "국내", "entity": "메디포스트, 유바이오로직스, 이뮨온시아, 셀트리온, 젬백스, 지니너스", "what_changed": "메디팜헬스뉴스가 10월 26~30일 DART와 거래소 공시를 집계했습니다. 메디포스트는 미국 자회사에 200억4,450만원을 추가 출자합니다. 유바이오로직스는 유니세프에 콜레라 백신 유비콜-에스 104억6,081만원어치를 공급합니다. 이뮨온시아는 임상 계획 변경 공시 지연으로 불성실공시법인 지정이 예고됐으며, 최종 결정은 11월 20일입니다. 젬백스는 175억원을 단기 차입했고, 지니너스는 전환가액을 3,499원에서 2,450원으로 낮췄습니다.", "why_matters": "대형 기술수출과 별개로 중소 바이오의 자금 부담과 공시 위험이 드러났습니다. 기사에 따르면 메디포스트 해당 자회사는 2025년 매출 없이 575억5,200만원 순손실을 냈습니다. 셀트리온도 3분기 영업이익은 74.3% 늘었으나 순이익은 784억원으로 76.4% 줄었습니다. 메디칼업저버는 환율 관련 손실을 업계 공통의 순이익 감소 요인으로 전했습니다.", "strategy": "유바이오로직스는 공급 계약으로 하반기 매출을 쌓지만 콜레라 백신 의존도가 높습니다. 메디포스트는 카티스템 미국 3상에 자금을 계속 투입하는 단계입니다. 기업별로 현금 소진 속도, 전환사채 조건 변경, 공시 신뢰도를 함께 봐야 합니다.", "evidence_type": "공시", "sources": [{"url": "https://www.medipharmhealth.co.kr/news/article.html?no=120880", "verified": "매체의 주간 공시 집계 기사 원문을 직접 확인했습니다. DART 개별 공시 원문은 열람하지 못했습니다."}, {"url": "https://www.monews.co.kr/news/articleView.html?idxno=414922", "verified": "메디칼업저버 기사 원문을 직접 확인했습니다(셀트리온 3분기 수치와 업계 순이익 감소 요인)."}], "verification_note": "이번 호에서 확인 수준이 가장 낮은 항목입니다. 공시 원문을 보지 못하고 매체 집계로만 확인했습니다. 메디포스트와 유바이오로직스 건은 교차 확인되지 않았고 개별 공시일도 미확인입니다. 환율 요인이 셀트리온의 개별 원인으로 확인된 것은 아닙니다. 기사도 일부 공시는 원문 확인이 필요하다고 밝혔습니다.", "image_concept": "A small glass beaker with only a few drops of liquid leaking from it, on a plain grey background.", "img": "data:image/webp;base64,UklGRsA0AABXRUJQVlA4ILQ0AACwiQGdASqwBCADPpFIoE0lpCoooHLIYUASCWlLMNL+Q4p373TUSpz3dxZc5Kgb7mdwqy36v/r/qei7dn+q5xfn/Bnhf/PXzZlt9NPcd//3pu/ud726L5/7Fg8d8A1kL4L//fUx8d/3ejJoGZ5/svBjrJ8MfmbLt3SGlf8rxrfuHohTyP2yjezjzxn/B59AzEiGzeoYRgmoNWNbKcuXLly5cuXL+xcuXLlvHJKgLhjqAjok1J3WrAr0xv3ZThtJcQazsUfpMs0/CXmrlapsE/yb1TJ9zgJvP4srOYtQCEk/4/swrGt4y2GBm1QKxtM1eR7JK5W9UL8sacvcGDDjBuOXyO6gJjqotCT02ujRzjowWj/kKeGM9NlUTeyWy06c/yPG91pH1OIcbTHLf6k0KIKlqRnz6DdJ3+I9NQ3qSc+CZVmxsNkAWpEst5+5n0RsVUFSQCvM+GNIlzqUP5TNxePuOl9wbfk0pozOJZbmfmrX9g93eMeY2qeWfZl4m3dABBIrEm/GjTnufhNO3VT6CSzfHaryLduaAaK45xBxH 이번 신청으로 삼성바이오에피스는 이 시장의 미국 바이오시밀러 경쟁에서 허가 심사 단계에 들어섰습니다. 다만 신청이 허가를 보장하지는 않으며, 공시 요약도 심사 결과에 따라 상업화 계획이 바뀌거나 철회될 수 있다고 밝혔습니다.", "strategy": "면역항암제로 바이오시밀러 포트폴리오를 넓히는 움직임입니다. 앞으로 볼 지표는 FDA의 신청 수리 여부와 미국 상업화 파트너, 출시 시점을 좌우할 특허 협상입니다.", "evidence_type": "공시", "sources": [{"url": "https://www.chickstockfi.com/disclosures/20261030801097", "verified": "공시 미러 페이지의 제목, 공시일, 접수번호를 직접 확인했습니다. 본문 수치는 해당 페이지의 AI 요약만 확인했고 DART 원문은 열람하지 못했습니다."}, {"url": "https://view.asiae.co.kr/article/2026103016451490114", "verified": "기사 원문을 직접 확인했습니다(18개 적응증, 임상 규모, 키트루다 매출, 회사 발언)."}, {"url": "https://weekly.hankooki.com/news/articleView.html?idxno=7191578", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "적응증 수는 언론이 18개로 보도한 반면 공시 미러의 AI 요약은 20여 개 암종으로 적어 엇갈립니다. 이 기사에서는 언론 수치를 썼으며 DART 원문으로는 확인하지 못했습니다. FDA의 수리 여부도 확인되지 않았습니다.", "image_concept": "A single glass vial standing beside an identical twin vial on a bare steel laboratory bench.", "img": "data:image/webp;base64,UklGRrwvAABXRUJQVlA4ILAvAABwowGdASqwBCADPpFIn0ylo62toLKIwbASCWlu3Lrbn13GA/E7NpNXGdUh38mOH55Xk3/6Zi1aiyxuZt/1PiOdtODU3h53qFtdA8wZkvOiXfusdV/5PjGfb/Q4+y89v5noy8Nv756gX9E9If/T81H10EPDrjYOzYOzYOzYOzZepsHZsHZsHZsHZsHZsHZsHZsHZsHZvfAPhhfO03kw5u9Gq9mrz0LKFUuqTOCKNW8AbkGtjY3BUpIJ+akHrr/TeKIOsbcdg7Ng7Ng7NjKO32ejPAPOYghBm98HZsHZsG5kGF1RXXs1cSH64a667kGSHNg7N2WHaIamwn2K5GXt4xav0tUYtUbzYRvs2E6XVUrmoxanuDmrtq5NRh5cqJS6oxYO6wD4I3TvvgKFIrm5vpP10MrGGM7C4MJ5WP8hXo8H44G/MSpyHNg64LyxTgB2r8HNgHuux1GrBJZq4ixeDU9IG0WRh5XcWso2lsafLKBdRhVsy53aMPI9mZ9VZGx2RA5sHZzuc2SOSl3RExU7p46fcO2HGwUSmS6X46Wm37jOw7WFE01Rh19KjDyYnPZU3nPpBqiuvZsHXBr6kGpA1SGc2EZdB5ga0B5n4Admwdmwdolnfh68UUMKDmrkU/TLvFDCgZKX3KQHZq4HEBO/eUDCvHE9cermcYsEj1WFhPXHqaZWs5PKpdUYtUYtUYz6hBbt02WnYMGUwiQ5sG3ZmmmxNNV9GHjFBJwF1SnYoObBuSl1Ri1b5PC9UirhQF3NjB4XGwdstVUHeeOpN6Xd29mwj+WbNKKpdUV4KlxsBQn8xIDs2DtX4FxwC0hh5evCETZ74GEaV0miD4qxGIaNLjHoWrRw3+PcBannSc7K/zGG/BuBIDNaiDP8q7yEyGS5fSCmGP7VrdyROxJh1+1eEWog6mVLmO1RiwYT1ycxLGwj8s2esjkeWNXnjCW080zOLABmBEQopOIWR/jtnubxrC7OvnkrFQcD6BuydB 성 표피박리증 치료 후보인 D-Fi의 임상 위험을 양측이 나눠 지는 소형 바이오 합병 사례입니다. 펠토스 공시의 위험 요인에는 유동성, 계속기업 능력, 추가 자본 조달 필요성이 함께 적혀 있습니다.", "strategy": "펠토스는 지셀수비(ZELSUVMI) 등 피부 감염 중심의 상업 제품군에서 중증 피부질환으로 영역을 넓히려 합니다. PIPE 자금은 캐슬 크릭 부채 상환과 운전자본에 쓰입니다. 호라이즌 대출도 1,000만달러 추가 인출로 잔액이 4,000만달러가 됐습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001919246/000110465926120457/tm2628523d1_ex99-1.htm", "verified": "SEC 8-K 첨부 보도자료 원문을 직접 확인했습니다(거래 조건, 대가, 완료 시점, 경영진 발언)."}, {"url": "https://www.sec.gov/Archives/edgar/data/0001919246/000110465926120457/tm2628523d1_8k.htm", "verified": "SEC 8-K 원문을 직접 확인했습니다(계약일, PIPE 규모와 투자자, 호라이즌 대출 변경)."}], "verification_note": "SEC 공시로 조건을 확인했습니다. D-Fi의 FDA 승인과 3상 결과는 아직 없으며, ‘블록버스터 가능성’은 캐슬 크릭 CEO의 주장입니다. 종결에는 캐슬 크릭 주주 승인 등 관례적 조건이 남아 있습니다. 3상 상태는 보도자료 기준으로 ‘계획’이며, 검색 스니펫에는 ‘지속 중’으로 표현된 곳도 있어 차이가 있습니다.", "image_concept": "Two interlocking puzzle pieces, one smooth and one covered in fine stitched thread, resting on a soft pale surface.", "img": "data:image/webp;base64,UklGRlp7AABXRUJQVlA4IE57AABQbwKdASqwBCADPpFGnUwlo7YtIty4ssASCWlu11tLf//yRPn//tkkcZGavUC6s/OP/nFVKKzul/u0ZwN/SF8TaT6Anmlnq+bS0tpbnKJVz7XJ+PEz8uwX8vqM/tu8754PTu+iovtrqnpj5F+j3lH+O8Buy1/l9+PALww/5Xbb7p/v/QO9+8x/BP969QLyy/8vg7fhv/P7Avk5/83kY/YvUQ/sH+zDtzmbkn1Syu6GmfDvRoRisJHUnJ3Q0z4aWWYi7gPVL2wddwHqllduHfT69zwYXXc8CROmMHyYGFshMBGMRfpt8HW2/VJ5jXcCVpfqUY+qoE5JAPVztDsxfcYMDQ4V1aNrl7Jyhc7xlOyUr7SOu27i125mf5uLXdn5fT2mKnxHvL99Ze3NyGBf68AfBQa3du22l2qovnaXXf4vZKGGdtQ+jsu7rg3VEzPiHRws/gNzy56miW4OitxYGwWHL93dC3Jbu7OC9WFdkG7JQwNOq2qmttJANbbl1Bbt0GBzAaYNpYkuOHOAA3cNg6AB6pZXJICWjdXY/WVhVBgYIXsV0Hw4wJ24bdaPBXdqFd+t6UTIlAAbRXPB0k044yjr34UM4b/O8cEVihC7qp1eg9VD6DW+Ho7LuhpoLoWxT5sHQA7w/A9zcigTuhoO3cCnrhpdY06iUA9GnScOupZrV/EOlLQL9v8NX7h4iBHHYmNdvP3hnJ3LYjPlPVaTK5APVdzE9Umypgut1Y5AA+wQ5NGS30Q7i3O0sTIyLGShYimPJa125muCpZYXObAUnMVLTTEWLPZSV6K7qaA24qXg7Z3wddwd4nrj/AxFlmaz279YqdvtvVHeQW1x2Y6v9ae+uieTFbr1NcvCxeaxA+Om3bhsL+GlvL0qC/ErTmsrU6mznyzvT4Icdtv4WcTJugu1x6gODhVUE/Wf1vEUdS/YZe3OZ/e7A  완료 목표는 연내입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001792044/000114036126039024/ef20083514_ex99-1.htm", "verified": "SEC 8-K 첨부 10월 8일 보도자료 원문을 직접 확인했습니다(거래 가치, 전략적 근거, 자금 조달, 완료 목표)."}, {"url": "https://pulse2.com/viatris-launches-36-50-per-share-tender-offer-to-acquire-pacira-biosciences/", "verified": "언론 요약 기사 원문을 직접 확인했습니다(공개매수 가격, 만료일, 조건, 이사회 권고)."}, {"url": "https://www.citybiz.co/article/927090/viatris-launches-36-50-per-share-tender-offer-to-acquire-pacira-biosciences/", "verified": "검색 결과 스니펫만 확인했습니다(본문 접속 차단으로 미열람)."}, {"url": "https://www.mlex.com/mlex/dealrisk/articles/2544443", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "SEC의 Schedule TO 원문은 찾지 못해 공개매수 조건은 언론 기사로 확인했습니다. 개시일 10월 30일도 검색 스니펫 기준입니다. 거래는 아직 완료되지 않았습니다. 시너지와 실적 기여는 회사 전망입니다.", "image_concept": "A small brass crane hook lifting a single glass ampoule from a folded white surgical cloth.", "img": "data:image/webp;base64,UklGRjIlAABXRUJQVlA4ICYlAAAQaAGdASqwBCADPpFIoE0lpCo0IPMYOoASCWlu/8ZzFkAnu80kGJN6ePbBEkmwQBezD6g9wRzr7654qLLLhl6XP5ZBdzbhhqavp/sB/zL+r+r//p+Yr681F0F4nKcuXLly5cuXLly5cuXLly5cuXMxWWsMGvDQIECDWZIGiDw8Npm7gsbuCnnNS4eHaXeEuXDZhiErujN5zbik0CoQm5wqetxCUq6zmpy5cuG0Cn+2pMfiYyVqpsWjSf6BnNlGbvHjKupw/uLeLUgsWLFinm8y3uN5zVY3RPeKA+PG1cpyt+DOrRJ+v4nvDQFAtqTAWnTFAuJjqYD5b1DlUbQ9tS0SnLmxujP0FbB28WTXK341uxTi0l/dLECWWeF7yL3e78J/oZx0useI63Lx3ie9duwrR3z3lAPW6ejK5Ld75L0+4pbbo0nRZhuxX+x28+4UM0SZB1ALTpiinI5tLCKoJ16mRntwbzwRjgsIZAgKBaYUBR2WpBYsZilu8L5bVJgTNS6e1tQlG0Sr97vznuU7lOVvwWZ/XwEECypcKHkLRNQCxi7NEoE72DBfefT3rGM61CKRkPxX7RPeHWptPZfhAne9E925naIobi5PTzmpzYQWNi7c7FGZhFi6A8sHYKyg1COmy+c9iweViMBgMjFUZ8sR2Q2wcD5EDuZpq8ggJr3Mg/FSnpfoAC3+3C8MsAAkpSzS3UAcl5OLHbkLcc4DiAUstKKDnG60tGk/27VRacDhl74P5b7l5wWLCFMUwE2IZsuYw8RzA+kcwsXQIK7QVx1CBQxrQjFUsSAW9bSn2iCgCItSYhssqjKBd3gBy0iiXSCotQTcuXLhdoOKQfLYmcIfMfj1s5qqQh5v7WklYsc/PN2A0L3FjWN+DGhU0SnLwwNgpFXxAoEVp0xRD7Iz4lWrLhaWmC+8+nACdp6pbBVQEhmS8noH0795pDA+EtVNoHpWwr8suWpBTzmlmEkCijk73n0tt0aT 세라는 10월 30일 9개월 누적 실적을 발표했습니다. 매출은 277억4,200만엔으로 58억9,400만엔 늘었고, 영업이익은 전년 59억700만엔 손실에서 31억7,500만엔 이익으로 돌아섰습니다. 9월 말 현금성 자산은 166억1,300만엔입니다. 10월 1일 이후에는 신모사와 쿠비빅(QUVIVIQ)의 싱가포르, 태국, 호주 등 8개국 독점 라이선스·공급 계약을 맺었습니다. 선급금 액수는 공개되지 않았습니다.", "why_matters": "GPCR 신약 플랫폼 기업의 수익이 R&D 마일스톤 수령(10건, 전년 6건)과 제품 판매 증가로 개선됐습니다. 뉴로크린에서는 3분기에 1,000만달러 마일스톤을 인식했습니다. 다만 마일스톤은 시점에 따라 변동이 큰 수익입니다.", "strategy": "비용 절감으로 R&D를 좁히면서 아시아 판권을 넓히는 전략입니다. 이도르시아의 파브리병 후보 루세라스타트 옵션을 선급금 700만스위스프랑에 행사해 한국, 일본 등 권리를 확보하고 글로벌 3상 비용을 공동 부담합니다. 바모롤론은 10월 한국에 허가를 신청했습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://manilatimes.net/2026/10/30/tmt-newswire/globenewswire/nxera-pharma-operational-highlights-and-consolidated-results-for-the-third-quarter-2026/2458010/amp", "verified": "회사 보도자료의 GlobeNewswire 재게재본을 직접 확인했습니다. 회사 IR 페이지 원본은 열람하지 못했습니다."}], "verification_note": "수치는 3분기 단독이 아닌 9개월 누적입니다. 재게재본에서 연간 가이던스는 확인되지 않았습니다. 신모사 계약의 정확한 체결일과 금액은 공개되지 않았습니다.", "image_concept": "A small brass balance scale tipping gently upward on one side, set on a plain dark wooden desk.", "img": "data:image/webp;base64,UklGRvA6AABXRUJQVlA4IOQ6AABwtQGdASqwBCADPpFIoUylpCctoPKYobASCWlu/9pbn3jEc/h6mqi/7vGdUW34eWI+Af8LopeWrP/nfGF95bMs0/VuaAXeaYu7enzJb+Xzcj/Y78eOgzXAPu7/Pd6ff83vGueG3bX1xeirvuHtd6UrQHWr9C25cJ/yHgt/PPz5/Q9Y3ar80NQ73H6CsXXrrQN+h/37zQ/r/OD7GewD+qfi2+Nx9C/5/sF/yv/D/tH7wH+V5e/qr2G/6EEZn25n25n8xGXXTeZmLvkwXlJZ3TeZeZ9uZ9uZ9uZ9uZ9uZ9vDMwQ0Fa3cXYNBYuyeCM4uegH7RWCNlbk9jwrpwaXmfbuBnJ0wtNmdUr6Qf3aN/z4dbBYs+8jhN/NGpu8hrd4pYAty2OgC5a+YvOqAIy/HsGVoG43yCT8+HoDOGRiuwvX5c/GHMHZ9uZ9vC02WZ9uZ9uZ9uTueBQc3mZB1bTTeZegwYrcy8z7cz7aaFbmZBZddN6FJeURT4l+lvAfFdN3ilgC3MvM+violgC3MvM+3M+3M+v7lWXM+45HRLrpu8hu02wACwt3m83mZGMk2kh5xPt3OrXTehVj4QqWiTM0xPS3jOoyAqozlty7aj583BXUYAkctHC8t5vLXy7HOHvHSE50nXZ7Z3TeZeZ6/mL1hGkczQD4VAp8CknPDJO1Df8Hy6bBk9Ld54eJOF/3HWZ9uZ9fFRLAGWA4WAF96WsGajbgkgM5bw7hKtcwAuL8NPJCrQK3TkDhNF03miEp0Yrpu7WnTAaiBLyUYrpvx60ri66pjLj91CwJuqLI5PWvOc0I7D6KgDTQfj5AH9DQpKt8aNt6OtMdZcwYlxLtte3KynjFd14VoObzMgTSZ4UiI+tnYCc6Wl const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };

const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);

const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
