:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* synthesis */
.syn{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.syn{grid-template-columns:repeat(3,1fr);gap:0}.syn>div{padding:0 22px}.syn>div:first-child{padding-left:0}.syn>div:last-child{padding-right:0}.syn>div+div{border-left:1px solid var(--rule)}}
.syn h3{font-size:18px;margin:0 0 10px;font-weight:850;letter-spacing:-.02em}
.syn ol{margin:0;padding:0;list-style:none;counter-reset:n}
.syn li{counter-increment:n;padding:10px 0 10px 30px;border-top:1px solid var(--rule);position:relative;font-size:13.5px;color:var(--ink-2)}
.syn li:before{content:counter(n);position:absolute;left:0;top:10px;font-weight:900;color:var(--blue);font-size:15px}
.syn li b{display:block;color:var(--ink);font-size:14px;line-height:1.4;margin-bottom:2px}
.syn .refs{font-size:12px;color:var(--muted);margin-top:4px}
.syn .refs a{color:var(--blue)}
.syn .refs a:hover{text-decoration:underline}

/* inner pages */
.page{padding:26px 16px 0}
@media(min-width:768px){.page{padding:30px 28px 0}}
.ph{text-align:center;margin-bottom:18px}
.ph h1{font-size:clamp(24px,3.4vw,34px);margin:6px 0 4px;font-weight:900;letter-spacing:-.035em}
.ph p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}
.chip{border:1px solid var(--rule-2);background:var(--paper);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
mark{background:var(--mark);color:inherit}

/* article */
.post{max-width:780px;margin:0 auto}
.post .head{text-align:center}
.post h1{font-size:clamp(26px,4vw,40px);line-height:1.22;margin:10px 0 12px;font-weight:900;letter-spacing:-.04em}
.post .by{font-size:12.5px;color:var(--muted);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.post .by b{color:var(--ink);font-weight:600}
.post .cover{margin:22px -16px 6px;aspect-ratio:3/2}
@media(min-width:820px){.post .cover{margin:24px -60px 6px}}
.post .cap{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:22px}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin:0 0 26px}
@media(min-width:640px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts div{padding:10px 10px 10px 0}
.facts dt{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:800}
.facts dd{margin:2px 0 0;font-size:13.5px;font-weight:650}
.post h2{font-size:12px;letter-spacing:.14em;font-weight:900;text-transform:uppercase;margin:30px 0 8px;color:var(--blue)}
.post p{font-size:16.5px;line-height:1.85;margin:0 0 12px}
.post .pull{border-left:3px solid var(--ink);padding:4px 0 4px 18px;font-size:18px;line-height:1.7;font-weight:600;margin:6px 0 10px}

const DATA = {"download_path": "download/2026-11-17.html", "download_name": "2026-11-17.html", "issue": {"no": 28, "published": "2026-11-17", "target": "2026-11-16", "lead": "bio-aribio-ar1001-topline", "side": ["ai-mfds-innovative-device-forum", "reg-fda-giredestrant-approval"], "scope_note": "제28호는 2026-11-16 발표분을 중심으로, 제27호 이후 새로 나온 변화와 2026-11-17(KST) 오전까지의 발표를 담았습니다. 이전 호에 실린 사안은 새 진전이 있을 때만 별도 기사로 다뤘습니다.", "synthesis": {"trends": [{"head": "후기 임상 결과가 전체 환자군과 하위군으로 갈라지며 해석 리스크가 커졌습니다", "body": "아리바이오 AR1001은 전체 환자군 1차 지표를 놓치고 단독투여군에서만 유의성을 확보했고, HLB테라퓨틱스 RGN-259는 두 번째 후기 임상에서 1차 평가변수를 놓쳤습니다. 헬루스파마 HLP003은 유효성을 입증했으나 중대 이상반응 3건으로 주가가 약 17% 떨어졌습니다. 반면 CG온콜로지는 감시 대조군 설계로 위험비 0.32라는 큰 효과 크기를 얻었습니다. 1차 지표 충족이라는 표현의 실제 범위를 확인하는 일이 투자 판단의 기본 작업이 됐습니다.", "refs": ["bio-aribio-ar1001-topline", "bio-hlb-therapeutics-seer2-fail", "bio-helus-hlp003-phase3", "bio-cg-oncology-pivot006"]}, {"head": "범용 챗봇이 병원 운영 업무의 실행 창구로 들어오고 있습니다", "body": "루마헬스가 ChatGPT에서 병원 운영업무 59개 동작을 실행하는 연동을 공개하고 같은 날 포톤이 처방 기능을 붙였으며, b.well은 MCP로 AI 비서에 연결되는 진료 마켓플레이스를 내놨습니다. 오라클 헬스의 신형 EHR 채택 사례와 파자마에이아이의 인수는 기록 작성에서 실행·인박스 처리로 범위가 넓어지는 흐름을 보여 줍니다. 경쟁축이 모델 성능에서 권한 매핑과 감사 기록 같은 통제력으로 옮겨 가고 있습니다.", "refs": ["dh-luma-health-chatgpt-actions", "dh-bwell-health-space", "dh-oracle-health-shore-ehr", "dh-pajamaai-credo-affineon", "dh-league-ai-front-door"]}, {"head": "의료AI의 병목이 허가에서 지불자 등재와 데이터 접근으로 옮겨 갔습니다", "body": "식약처 혁신의료기기 포럼에서 통합심사로 병원 진입이 최단 80일로 줄었지만 허가 AI 의료기기 549개 중 건강보험 적용은 49개(약 9%)에 그친 사실이 드러났습니다. 정부가 추진하는 디지털헬스케어법은 가명 의료정보 2차 활용의 법적 근거를 열지만 환자 거부권이 빠져 있습니다. 뷰노는 딥카스 신의료기술평가 지연 때문에 314억원 유상증자 납입일을 12월 29일로 미뤘습니다.", "refs": ["ai-mfds-innovative-device-forum", "reg-digital-healthcare-act-optout", "ai-vuno-rights-offering-delay"]}, {"head": "빅파마가 외부 자본과 초기 자산을 묶어 파이프라인 공백을 메우고 있습니다", "body": "J&J는 올린바이오사이언스를 선급금 22억달러에 인수하면서 3상 비용 7억5,000만달러를 블랙스톤에 넘겼고, 릴리는 칼리트릭스바이오를 최대 15억달러에 사들였습니다. 시울프테라퓨틱스는 출범 당일 사노피와 최대 12억달러 라이선스를 공개했습니다. 동시에 아스트라제네카는 미국 상업조직에서 약 600명을 줄인 것으로 보도됐습니다.", "refs": ["bio-jnj-ollin-biosciences", "bio-lilly-calytrix-bio", "bio-seawolf-sanofi-license", "bio-pharma-layoffs-az-calidi"]}], "signals": [{"head": "국내 치매 신약 독자 3상의 결론이 하위군 하나로 좁혀졌습니다", "body": "AR1001은 1,535명 전체에서 p=0.4015로 유의성을 놓쳤고 단독투여군에서만 31% 지연(p=0.0266)을 보였습니다. 중국 푸싱제약 기술이전의 후속 마일스톤 전제가 흔들릴 수 있습니다.", "refs": ["bio-aribio-ar1001-topline"]}, {"head": "허가 AI 의료기기 열 개 중 아홉 개는 건강보험 밖에 있습니다", "body": "549개 중 급여는 49개이며 그중 21개는 한시적 비급여입니다. 한시적 비급여 종료가 임박한 제품은 매출 급감 리스크를 따로 보셔야 합니다.", "refs": ["ai-mfds-innovative-device-forum"]}, {"head": "경구 SERD가 ESR1 변이 유방암에서 위험비 0.38을 기록했습니다", "body": "로슈 지레데스트란트가 무진행생존 10.0개월 대 5.5개월로 FDA 승인을 받고 혈액 기반 동반진단도 함께 허가됐습니다. 국내 ESR1 검사 급여 논의가 앞당겨질 수 있습니다.", "refs": ["reg-fda-giredestrant-approval"]}, {"head": "식약처가 단일 개정으로 병용금기 295개 조합을 추가했습니다", "body": "비만약과 파킨슨병약·리네졸리드 병용이 금지되고 의견 제출 기한은 12월 7일입니다. DUR 반영 즉시 현장 처방 패턴이 바뀝니다.", "refs": ["reg-mfds-contraindication-295"]}, {"head": "국내 앰비언트 AI 스크라이브가 의원 단위 유료 전환 구간에 들어섰습니다", "body": "니어닥은 5개월 만에 의원 약 500곳에 깔리고 무료 체험 후 유료 전환율 70%를 제시했습니다. EMR 벤더의 쓰기 연동 개방 여부가 다음 변수입니다.", "refs": ["dh-neardoc-ai-charting"]}], "priorities": [{"head": "AR1001 하위군 결과를 전체군 결과와 분리해 재평가해야 합니다", "body": "사전 지정 분석 인정 여부와 FDA 사전 협의 결과가 다음 확인점입니다. 기술이전 마일스톤 조건과 연결해 시나리오를 다시 세우시기 바랍니다.", "refs": ["bio-aribio-ar1001-topline"]}, {"head": "의료AI 포트폴리오를 급여 트랙 기준으로 재분류해야 합니다", "body": "식약처 허가 건수가 아니라 정식 급여 28개와 한시적 비급여 21개 중 어디에 속하는지로 나누시기 바랍니다. 뷰노 사례처럼 평가 결과가 자금 조달 일정까지 좌우합니다.", "refs": ["ai-mfds-innovative-device-forum", "ai-vuno-rights-offering-delay"]}, {"head": "디지털헬스케어법의 옵트아웃 조항 추가 가능성을 데이터 계획에 반영해야 합니다", "body": "현행 기관별 심의 유지와 법 시행 후 통합 요청 체계 두 가지 로드맵을 준비하고, 결손률 시나리오도 함께 세우시기 바랍니다. 차등 프라이버시·합성데이터 역량이 심의 통과에 유리합니다.", "refs": ["reg-digital-healthcare-act-optout"]}, {"head": "EMR·환자참여 솔루션의 동작을 기계가 읽을 수 있게 노출할지 결정해야 합니다", "body": "루마헬스와 b.well 사례처럼 MCP·SDK로 노출된 동작 목록이 워크플로의 입구가 됩니다. 권한 매핑과 감사로그를 먼저 상품화하는 편이 유리합니다.", "refs": ["dh-luma-health-chatgpt-actions", "dh-bwell-health-space"]}, {"head": "후기 임상 자금은 금융투자자와 분담하는 구조를 검토해야 합니다", "body": "J i", "alt": "하나의 등대에서 여러 개의 작은 등불이 떠오르고 그중 일부가 더 밝게 빛나는 모습을 그린 미니멀 일러스트", "title": "루닛, RSNA 2026 연구초록 17편 공개 예고… 11편이 구연 발표로 채택되고 17편 중 15편이 유방 영상 연구였습니다", "short": "루닛 RSNA 17편 발표", "date": "2026-11-17", "scope": "국내", "entity": "루닛, 북미영상의학회(RSNA)", "what_changed": "루닛은 2026년 11월 17일 미국 시카고에서 열리는 2026 북미영상의학회(RSNA 2026)에서 AI 의료영상 분석 관련 연구초록 17편을 발표한다고 밝혔습니다. 이 가운데 11편이 RSNA에서 주요 성과로 평가되는 구연 발표로 채택됐고, 17편 중 15편이 유방 영상 분야 연구였습니다. AI 자율 판독 연구와 치밀유방 추가 영상검사 선별 전략 연구는 RSNA 프로그램 기획위원회가 선정한 유방 영상 분야 추천 세션에서 발표되며, 여러 AI 제품의 성능을 비교·평가한 연구와 유방암 위험도 예측 연구 3편도 구연 발표 대상입니다. 흉부 엑스레이 AI 판독의 단독 성능과 안전성 검증 연구는 포스터로 공개됩니다. 학회는 11월 29일부터 12월 3일까지 진행됩니다.", "why_matters": "AI 자율 판독과 치밀유방 선별 전략은 유방암 검진 체계에서 AI의 역할을 보조에서 대체로 끌어올리는 쟁점이며, 이 주제가 RSNA 추천 세션에 올랐다는 것은 학계 관심도가 높다는 신호입니다. 루닛은 볼파라 인수 이후 유방 영상이 매출의 중심축이 됐고, 발표 구성이 15대 2로 유방에 쏠린 것은 이 전략의 반영입니다. 다만 학회 초록은 동료심사 논문이 아니므로 근거 수준은 제한적입니다.", "strategy": "RSNA 2026 기간(11월 29일~12월 3일) 발표되는 AI 자율 판독 데이터의 실제 수치와 검진 집단 규모를 확인한 뒤 유방 AI의 대체 가능성을 평가하실 것을 권합니다. 루닛 투자·협업 검토 시에는 초록 편수보다 구연 11편 가운데 전향적 또는 다기관 설계가 몇 건인지를 기준으로 삼는 편이 낫습니다. 경쟁사의 같은 세션 발표와 성능 비교 연구 결과를 함께 추적해 상대적 위치를 확인하실 필요가 있습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.hankyung.com/article/202611170826i", "verified": "원문 직접 확인(2026-11-17 08:34 입력, 초록 17편·구연 11편·유방 15편·추천 세션 확인)"}, {"url": "https://www.thebionews.net/news/articleView.html?idxno=30335", "verified": "검색 결과 스니펫만 확인(본문 미열람). 동일 내용과 학회 일정 11월 29일~12월 3일 교차 확인"}], "verification_note": "루닛 발표 사실과 편수 구성은 한국경제 기사 본문으로 직접 확인했습니다. 루닛 공식 뉴스룸 보도자료 원문은 열람하지 못했고, 학회 일정은 다른 매체 스니펫으로만 교차 확인했습니다. 발표될 연구의 구체적 성능 수치(민감도, AUC 등)는 아직 공개되지 않아 확인할 수 없었습니다.", "image_concept": "Seventeen paper lanterns rising from a single lamp post, eleven of them glowing brighter than the rest.", "img": "data:image/webp;base64,UklGRlQkAABXRUJQVlA4IEgkAABwagGdASqwBCADPpFIoUylpCMioTMoOLASCWlu4Vse/fBRVz9B4ot8lz5nqk5m4/q/7z+6Xtrce91voLyN0dVaec90V5T/+X7Pf1h/2/cC/WbpyeYL9r/WI/1nqb/w/qAf1jqKvQG/cv06/Zy/sP/f4O3p0/CZsaATdt09jWgKxCYAqyLbTMCY9xgFwx1g  길 끝에 좁은 황동 개찰구 하나가 서 있는 모습을 그린 미니멀 일러스트", "title": "식약처 ‘혁신의료기기 정책 포럼 2026’ 개최… 통합심사로 병원 진입이 최장 390일에서 최단 80일로 줄었지만 허가 AI 의료기기 549개 중 건강보험 적용은 49개(약 9%)였습니다", "short": "AI 의료기기 건보 9%뿐", "date": "2026-11-16", "scope": "국내", "entity": "식품의약품안전처, 건강보험심사평가원, 한국보건산업진흥원, 대한의료인공지능학회", "what_changed": "식약처는 2026년 11월 16일 서울 LW컨벤션에서 혁신의료기기 지정 업체와 지정 준비 업체를 대상으로 ‘혁신의료기기 정책 포럼 2026’을 열고 통합심사·지정 제도와 특례, 디지털의료기기 심사 사례, 혁신의료기기(군) 지정, 건강보험제도, 소프트웨어 사이버보안을 안내했습니다. 2020년 5월 제도 시행 이후 2025년까지 누적 지정은 133건이며 연도별로는 2020년 8건, 2023년 31건, 2024년 29건, 2025년 45건으로 2025년이 역대 최다였고 그중 AI 기반 제품이 25건으로 과반을 차지했습니다. 부처 합동 통합심사 도입으로 허가·기술평가·보험 등재가 순차 진행될 때 최장 390일 걸렸던 병원 진입 기간이 최단 80일로 줄었습니다. 반면 대한의료인공지능학회 분석을 인용한 보도에 따르면 국내 허가 AI 의료기기 549개 중 건강보험이 적용되는 기기는 49개(약 8.9%)로, 이 가운데 28개가 통합심사를 통한 정식 급여, 21개가 평가 유예 후 한시적 비급여였습니다. 식약처는 2026년 지정 실적을 2027년 1월 공개할 예정입니다.", "why_matters": "허가는 빨라졌지만 수익으로 연결되는 보험 급여 관문은 여전히 좁다는 점이 공식 포럼 자리에서 숫자로 드러났습니다. 국내 의료AI 기업 매출의 병목이 규제 승인이 아니라 지불자 등재에 있다는 구조를 재확인시켜 줍니다. 2026년 1월 시행된 시장 즉시진입 제도(최대 3년 한시적 비급여)가 실제 급여 전환으로 이어질지가 다음 변수이며, 소프트웨어 사이버보안이 별도 주제로 편성된 점은 심사 요구사항 강화 신호입니다.", "strategy": "국내 의료AI 투자 판단에서 식약처 허가 건수보다 건강보험 등재·수가 트랙 진입 여부를 핵심 지표로 삼으실 것을 권합니다. 보유·검토 중인 기업의 파이프라인을 정식 급여 28개와 한시적 비급여 21개 중 어디에 속하는지로 재분류하고, 한시적 비급여 종료 시점이 임박한 제품은 매출 급감 리스크를 별도로 반영하시기 바랍니다. 지정 신청 단계부터 비용효과성 자료 수집 계획을 설계에 넣고, 2027년 1월 공개될 2026년 지정 실적과 급여 전환율로 계획을 재조정하시는 편이 좋습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.biotimes.co.kr/news/articleView.html?idxno=36178", "verified": "원문 직접 확인(2026-11-16자 기사, 개최 장소·5개 주제, 누적 133건과 연도별 8·31·29·45건, 2025년 45건 중 AI 25건, 통합심사 80일과 기존 390일, AI 의료기기 549개 중 급여 49개 확인)"}, {"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50496", "verified": "식약처 보도참고자료 제목과 2026-11-16 게시 사실만 확인(본문은 첨부파일로만 제공돼 세부 내용 미대조)"}, {"url": "https://dazabi.com/insurance_magazine/article.php?id=47467", "verified": "원문 직접 확인(식약처 보도참고자료 전재본, 포럼 일시·장소·발표 주제·김명호 의료기기안전국장 발언 확인)"}], "verification_note": "식약처 포럼 개최 사실과 날짜·장소·발표 주제는 보도참고자료 게시 기록과 전재본으로 확인했습니다. 549개 중 시더스사이나이 테크놀로지 벤처스가 참여해 병원 자체 영상으로 AI 알고리즘을 사전 검증하는 플랫폼을 확장합니다", "short": "영상AI 검증 스타트업 90억", "date": "2026-11-16", "scope": "글로벌", "entity": "테스트다이내믹스(TestDynamics), 헬시어캐피털, 시더스사이나이 테크놀로지 벤처스", "what_changed": "미국 오스틴에 본사를 둔 테스트다이내믹스는 2026년 11월 16일 900만달러 규모 시리즈A 투자 유치를 발표했습니다. 헬시어캐피털이 주도했고 시더스사이나이 테크놀로지 벤처스가 전략적 투자자로 참여했으며, 회사는 2023년 시더스사이나이 액셀러레이터 프로그램 출신입니다. 주력 제품 사토리는 벤더 중립 플랫폼으로, 병원이 구매 전에 자사 비식별 영상으로 후보 AI 알고리즘을 시험해 자체 기준선을 만든 뒤 도입 후 성능을 그 기준선과 비교해 모니터링합니다. 구성은 병원 내부에 설치되어 PACS·DICOM 라우터에서 영상을 받아 비식별·암호화한 뒤 허용된 AI 벤더에만 전달하는 사토리 엣지, 여러 도구의 결과를 한 화면에 모으는 사토리 뷰, 성능·사용량과 AI 결과 대 최종 판독문의 일치·기각·불일치를 기록하는 사토리 거버넌스입니다. 회사는 미국 상위 10위 의료기관 가운데 여러 곳에서 임상 사용 중이라고 밝혔으나 기관명과 기업가치는 공개하지 않았습니다.", "why_matters": "FDA 허가 AI 의료기기가 1,500건을 넘고 그중 다수가 영상 분야인 상황에서, 병원의 병목은 어떤 AI를 살지가 아니라 자기 환자군에서 작동하는지 확인할 방법으로 옮겨 가고 있습니다. 알고리즘 판매사와 분리된 제3자 검증·거버넌스 계층이 별도 시장으로 형성되는 흐름입니다. 영상 AI 벤더에게는 구매 전 실측 비교가 상시화된다는 뜻이어서 성능 주장의 검증 압력이 커집니다.", "strategy": "영상 AI를 판매하는 기업은 병원 자체 데이터 기준선 비교에서 성능이 유지되는지 내부 검증을 선제적으로 수행하고, 기준선 대비 성능 저하 구간을 미리 파악해 두시는 것이 영업 방어에 필요합니다. 국내 의료AI 기업의 미국 진출 전략에서는 FDA 허가 외에 이런 제3자 검증 플랫폼 통과를 새로운 사실상 관문으로 산정하시기 바랍니다. 투자 관점에서는 알고리즘 공급사뿐 아니라 검증·거버넌스·오케스트레이션 계층이 별도 수익 풀로 성장할 가능성을 검토할 만합니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://www.unite.ai/testdynamics-9-million-series-a-medical-imaging-ai-evaluation/", "verified": "원문 직접 확인(2026-11-16 게재, 900만달러 시리즈A·헬시어캐피털 주도·시더스사이나이 참여·사토리 엣지/뷰/거버넌스 구성·자금 용도 확인)"}, {"url": "https://financialcontent.com/article/bizwire-2026-11-16-testdynamics-secures-9m-in-funding-with-series-a-led-by-healthier-capital-and-participation-from-cedars-sinai-technology-ventures", "verified": "URL과 제목으로 2026-11-16 비즈니스와이어 배포 사실만 확인(해당 페이지 본문은 종목 뉴스 목록으로 바뀌어 보도자료 원문 미열람)"}], "verification_note": "투자 금액·투자자·제품 구조·자금 용도는 2026년 11월 16일자 기사 본문으로 확인했습니다. 비즈니스와이어 보도자료 원문 페이지는 열렸을 때 종목 뉴스 목록만 표시돼 1차 출처 본문을 직접 읽지는 못했습니다. 미국 상위 10위 의료기관 중 여러 곳 임상 사용은 기관명이 비공개여서 기업 주장에 가깝고, 기업가치와 검증한 알고리즘 수는 공개되지 않았습니다.", "image_concept": "A brass balance scale weighing a s 사실상 표준 후보로 보고 미리 정렬해 두시는 것이 유리합니다. 애플 생태계에 건강 AI를 올리려는 국내 기업은 헬스킷 연동과 24시간 삭제 수준의 데이터 처리 요건을 선제적으로 충족하실 필요가 있습니다. 애플이 결과를 바탕으로 건강 앱이나 음성 비서에 기능을 넣을 경우 소비자 건강 상담 앱 시장이 재편될 수 있으니 의존도가 높은 사업모델은 대체 채널을 확보해 두시기 바랍니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://americanbazaaronline.com/2026/11/16/can-ai-answer-your-health-questions-apple-opens-study-to-200000-americans-492404", "verified": "원문 직접 확인(2026-11-16자 기사, 11월 15일 출시·최대 20만명·12개월 이상·참가 조건·헬스킷 연동·24시간 삭제·HLTH 2026 공개 확인)"}, {"url": "https://itechpost.com/articles/237804/20261116/apples-new-ai-health-study-aims-make-healthcare-tools-more-effective.htm", "verified": "검색 결과 스니펫만 확인(본문 미열람). 동일 날짜와 연구 취지 교차 확인"}], "verification_note": "연구 개시일·규모·설계는 2026년 11월 16일자 언론 보도 본문으로 확인했습니다. 애플 뉴스룸이나 오픈에비던스 공식 보도자료 원문은 직접 열람하지 못해 1차 출처 검증은 하지 못했습니다. 연구 등록번호나 임상시험심사위원회 정보, 실제 모집 개시 인원은 확인되지 않았습니다.", "image_concept": "A single stethoscope coiled into the shape of a question mark on a smooth glass surface.", "img": "data:image/webp;base64,UklGRlwpAABXRUJQVlA4IFApAADQnAGdASqwBCADPpFIoEyluzgtoREIY2ASCWlu8Yk8nfC+63I5a/itZuGlJwXd7KF6n+6eovdn7d9OvVwIc7js53o4/UXsAfsN01vMB50HpJ/xHqP/4D0/PVo9EvphP3i4P/pv+13eX6UPX7dtd41vWhFWWd9a6EPTTw8DVelcO+cPamt8Z09qawhFBkFzxEF7IJ5mYvZBPMzF7IJ5mYvZBPQgxezafXBe3RFBkjFKMixA+FavYuakzA1K+awhFIsCrzxZBQEpXMYsKcwZxc0w91oGOGBRA+2heVktXrFzK3D4WGlcUlmmYUlhiIkzf3WHmYwVEF1WdXPp7V7qFfw/WqpVqtPMzPGMnamr2GKOKT5cJ0T1jV7m8nV2y1eWGbOuQyKCWMChBZMPODrvJtRIMw4UQNNYQigyC54Jn9u6uduwqX83QcdxkMgvEGUN4iSQ5496iP/x6Zq5hoDN6ExPTYUGqJNGax+lffH4kenbtEIuj8Gd3MQLL7ogvwlDDqizNBZNP1FDC1qjhq/kcT4J8QPMtkShSylRSkOXhBT0K7mS5f56+yaGeBNJXTSPdT9qyAHCcKEAWAlJaTTS2mcd/RQu7jLoUdCmLtgDddzOCb92wxePxGIaO0ortYeA2NcxJ9+39nk3cs+5dUSlhcSRYuBSgS2KbWzHJjkJLh9vqbYrxs36y+Q/Xxf3Dh6NNkq8ur4XvnIg9aZTetkz/aYz+t9acFmQiV//p0UWm8XShQSise3z/17LJfo//Rer1wyL8L0SGLJSa6Np2tzTUCW0UTyHDSiXf5elisu/SLmIIpYvRohHPxbrba4qeVG0+TYr3kGiaQJJCwo25JHrPLgROb8POP/6T7P37DfSKCRCrgLmBedrqVRekp7b9UgV7j2OYN2HP9zN3d1Mj07VMTR+/kigpKO4cQ3+sQlWnkUDxjazgSjOPfiwSbPmf2VZXLnA+ZNvO7mhL y_matters": "CB인사이트 디지털 헬스 50은 미국 중심 명단이어서 국내 기업의 진입 자체가 드물고, 올해 선정 기준이 운영 효율화와 환자 접근성으로 이동한 가운데 치료 워크플로 소프트웨어가 뽑힌 것은 평가축의 변화를 보여 줍니다. 국내 26곳이라는 임상 적용 범위와 FDA·식약처 3등급 허가를 함께 갖춘 사례는 해외 조달에서 판단 근거가 됩니다. 특히 탄소이온 치료계획 시스템의 3등급 허가는 중입자 치료 도입이 늘어나는 국내 상황과 직접 맞물립니다.", "strategy": "국내 디지털 헬스 기업은 진단 보조 영상 AI가 포화된 구간을 피해, 치료계획·치료 관리처럼 워크플로 전체를 묶는 소프트웨어에서 경쟁 지점을 찾는 편이 유리합니다. FDA 인증과 식약처 3등급 허가를 함께 확보한 경로는 후발 기업이 참고할 실제 선례이므로 인증 순서와 임상 근거 구성 방식을 분석할 가치가 있습니다. 중입자·양성자 치료 도입 병원이 늘어나는 구간에서는 치료계획 소프트웨어가 장비 조달과 함께 묶여 팔릴 수 있으므로 장비사와의 공동 진입을 검토하실 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80828", "verified": "원문 직접 확인(2026-11-17 06:30 게재, 8회째 명단, 평가 기준 4개, 국내 26곳·일본 1곳, 온코스튜디오 FDA 인증, 온코플랜 식약처 3등급 허가, ASTRO 2026 신기능 확인)"}], "verification_note": "히트뉴스 기사 원문을 직접 확인해 선정 사실과 제품·허가 이력을 특정했습니다. CB인사이트의 2026년 명단 원문 페이지는 접근이 차단돼 열람하지 못했으므로 전체 선정 기업 명단과 심사 대상 풀 규모, 다른 국내 선정 기업 유무는 미확인입니다. 기사에 언급된 투자 유치 건은 세부 내용이 없어 쓰지 않았습니다.", "image_concept": "A pair of brass calipers resting on a contour map, their tips aligned to a single closed loop.", "img": "data:image/webp;base64,UklGRmYuAABXRUJQVlA4IFouAAAQjAGdASqwBCADPpFIn0ylpC2ioPQ4gbASCWlu+Afp9VxkqOms6XIDn9lcXmCFW+Cd99C9XDUmEjQJ9j5/1s/w305+8L1C7I82Llr86e0b+2/rh73v0l+qnwAfqB+y/rYfoB7lf2s9QH7P+tv6HP856gX9i/63WUegB5bns3fuJ6XX//7P/p1+w2LrYZ/mNyl/l99crvAD3nv4vmX/T+oB55+BL6n7Bn6g9Yv/i8xueiDi+CyJwkl2Cr5qb1dqafCGD62JGL5Bwht0R9a6I+tdEfWuiPsCT9Df4/q7U097LLL0sRTXMRw/rYncwSwhwHADAfmCPnqsbdEfWvEuE34bWjrZqmiKWOteSPrXRH1nLhJ7L806KFp2hrbUGulkdxQyzM4INPL4F/V2pp8IYPrXRH1rqy9fRiB6zZ2swF2+NEX0LoEJW1NL0R9a6Q62fl9bLnxt0MEv6t0va4Yy/jXCIOZVNPg3w+g2Wnzv2HWTIPMwaOOi8gj8fhJC+K6QCOP8ERmUg5i8V5jHKe2iVya5jcPnHy70DWcWwmN0MXhDedDF3an5fWtAC9PK8f1dqYtF4jBppcMaFuIxGyBgDWgzdawkoNa6I+tlxmcT3d3V5IcP6qTdUN9ErdQbIZPviDfGNI8IbdIdDcotPhDCEg5p600hEkoyCIODmHD+rtTSprMRxBW5AaLjMiDC0fWuZd/rFUfOcVc2UEPQwUsvL610Sd4tzMIuUWlTWMEca13eB/PSafCGC0S+TP/bKn3G7fNalIRwFpCz/bb2XUGVlLAFJ2IRfFpixfIOEKItzxrjcUmuqNs9dpi439VQ9nQK93KwFJABJMNNxAERxTG  있습니다. 반대로 권한·감사·오작동 책임이 병원 외부 모델로 넘어가는 구간이 생겨 규제와 보안 검토의 초점이 바뀝니다.", "strategy": "국내 EMR·환자참여 솔루션 기업은 자사 기능을 MCP나 앱 형태의 동작 목록으로 노출하는 작업을 지금 설계하셔야 합니다. 핵심은 모델 성능이 아니라 기관별 규칙·권한을 그대로 승계하는 실행 계층이므로, 권한 매핑과 감사로그를 먼저 상품화하는 편이 유리합니다. 병원은 챗봇으로 실행 가능한 동작 범위를 미리 등급화해 조회는 넓게 쓰기는 좁게 여는 정책을 준비하실 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/luma-health-brings-59-actions-to-chatgpt-with-new-integration-helping-health-systems-run-full-workflows-with-one-prompt-302940564.html", "verified": "원문 직접 확인(59개 동작, 7개 커넥터 범주, 예시 워크플로 4건, 1,000개 기관·1억명 환자 수치 확인)"}, {"url": "https://www.prnewswire.com/news-releases/photon-brings-prescribing-to-chatgpt-302939815.html", "verified": "PR뉴스와이어 목록·검색 페이지에서 제목과 배포 일시(2026-11-16 09:10 ET)만 확인(본문 미열람)"}], "verification_note": "루마헬스 발표는 PR뉴스와이어 원문을 직접 열어 59개 동작과 커넥터 범주, 기관·환자 수치를 확인했습니다. 다만 기반 기술이 오픈AI 앱 SDK인지 MCP인지는 보도자료에 적혀 있지 않아 명시하지 않았습니다. 포톤 건은 배포 목록에서 제목과 일시만 확인했으므로 처방 기능의 구체 범위는 미확인으로 남겼습니다.", "image_concept": "A single brass skeleton key standing upright, its teeth shaped like dozens of tiny switches.", "img": "data:image/webp;base64,UklGRjQtAABXRUJQVlA4ICgtAAAwYwGdASqwBCADPpFIn00lpC2iITXIMbASCWdu4V/vAf/95i0UF6K0dqXnv8H6PldfuH9r+3P3b97XXnlt+afsP/Y/uHqi/Y33Pfn/9f/gD/WH9jvWj9U39+/63qG/qf+6/cv3hP9x+4Huq/rn+/9g7+h/5L/4dhb6BH7r+nZ+8Hwz/2X/u/vL7XH//1viYY2B15/k8X2JNYT5aPOvUUe72jvu1nF/b+cHiCcHpQM/TPo/Z/Pr7gSelmDMQZ1OqqcuXLly5cuXLly5cuXLly5cuXLly5cuXLly5cuXLqEpzY3T3EzXx62FgvjxbrhjnUnBfip1vZa5Cbgk25K0uZgtEaw10uH1w/5q6hqFn9Nu4jqYJWKEZcU0SCuI2172U5cvD0T3pFUsn+mJ7+FHtH/dvm8XL5gxKBX/cObW7Hw4jWHTv91wUwo8+pvP4ho+GCbrhjVwGBUZ7txczuBPnfckeluuGOjcyXSCtphyWgEuRub0IV3z2lfXcVJVLBgm3JWekC1LqsdPfYzG1bAkj3KeHoz+kVYXjMRRX2SNTjod9i7mpFBvpeEEZt7bfdjxRJWWajvgZj7vrvQ/SoxuuMXAplzP+lLHMQoPQkfFP8RkmZ3S9WnDjQlKTPxdSUIOAISaFW3cBXkVy4ff4vXz8UY5zQnSiMn5pOQFnBsmZx9q7VY6e0BmakbV6KX7fZn1eiiSr/j91uo64KXU5cuVqIOCqqShHpwDMdINi085jE96JnPdrmhStsW0tGFHv4qdPpmyDfnDw4hFW9wn67gQCyzNClstuUans/0y21Xsr/8uXK3414l2v1GNHpwCSPkKpg9ylqnk3UGkyxt -group-select-oracle-healths-new-ai-powered-ehr-to-create-a-more-connected-experience-for-patients-and-care-teams-302940524.html", "verified": "원문 직접 확인(2026년 2월 계약 체결, 196병상, 2027년 12월 구축 완료 목표, 적용 AI 기능 목록 확인)"}], "verification_note": "오라클 배포 보도자료 원문을 직접 확인해 계약 체결 시점과 구축 완료 목표, 병상 규모를 특정했습니다. 계약 금액과 기존 EHR 벤더는 보도자료에 나오지 않아 쓰지 않았습니다. 발표 시점(11월 16일)과 계약 시점(2월)이 다르므로 거래-계약으로 분류했습니다.", "image_concept": "Several mismatched paper folders being stitched together into one bound ledger with a single red thread.", "img": "data:image/webp;base64,UklGRnIqAABXRUJQVlA4IGYqAABQdgGdASqwBCADPpFIoUylpCqrILKYgWASCWlu3L9eP3K+V42cHbP3H38I66pTFp+77IXOv9zzC4gzFnbvbjbxjkC7z49+Z/oeeZ6a04tFr2foH85e3H/k+sX8ufr78BX9l/tfTq/svoK/cz1if8t+4XvO/yn+l9gD+8/5nrXvQg6YvyuNXcnaXb0N3xfhxqUmpQYWviIPpr4iD6a+Ig+mviIPpr4iD6a+IhHOLCD+9ewuP5mPprDamvivH5BwhFQ+xUrB/Z2kPoVM8ta+L1SRBKWJuZi9ivIHuIqG8wfdgp+v3MsTczNNXR4KkYMx0Zx5mYvYiD6gX6U4ppjZ4wmshzRmJuXVMLPMyOcBCLHuDZ8GoKrqkZlI5Fk0pu5uBXcaa+H/fuiKpRXJ7KpjZ72L6+Ig+gYfT2GDaXH4/b4iD6Yh+n7fpCTd8t+F646z+EJrIg+mviIPpr4f9vh/Uws8u9h1D6+CZsNiNMuawjk2Z1As80xD6+Ig+msMtiIL2Ig+msMqNp82Yh+qHQmz574g9TPPIp9Z5d2+CFEQoLgU8zgPEyCoyxTJsmx0FQqFYQhM0+pvyOeR0H0Js8zQuA514/eNNeebXsmbmYva+O+WnsCQPQvi+jCgfVakKa1wGpVXg5A8bEWycdi2+UPAVoTi4jEwdBU18EJvxew/SroTfK8VSnlxg2P1sXjXldpk/F3YGbwoP2LVJyq3s+rliWHJzOAQ4EgmxCwU3hl+4bgtxzO49ZHRgKjGEtHoTaMen0J0giD6q/Msx6d54DNqr/qLRheWYp5wUATNBsE8FNXsQuZB3yFCx04QXZfCiccJLk4Ah+aDOy2Xxy42nNDJ6/UZbBCbq0wXSCy74yHIW99TSfkkwRrGFMgTC8Ki9IG59f1/X9f2M39AaSsf7OEP0pncb4g6/5hMlFw6ZUqRcGqYnUU35gaRjZ8GpN/Y2a882Ig+u5/qezhkZ+uXsyK++DIpJ2axUOBjd+ZcsMIlogJTdXK3W7FWA2beYLoLYsQmbmY+qxLSD/4v0xpUKkoTT9IN5XDxzxoiDNGbjP8K9ZdNqVueGy1Zakw84hH4zFw+8tV8hJQ990g/5PC5TBhzlaOyqY26GxEH1Ml1nLTj5tpwio1/1KTAqB8r8EkvKnnX+ybq2Ac4Z/0kZeHFgbbSAPblh7pXWVBXYRIf1I0l7chy5FyHxFKcVOMgkr2/mFCjP+ts8yxHaslnmY+fj2Nm9KKR4JbFqsmridySnxqrOHf6IJVvK8zuGQecB8HoAWF/5e1OkTrxAtogVY4GF6OFz5hxC61fZYDYWIPjCpUK4C4nUCzzB9NYFMzMYYnpsOzxAHfE8NzL7jPB7NVsOmOP5JMpVeSHfdpc9F7jthinzCmORqX94JWj/4fgxLEsSwrEtGg+mWv+dEnnNkbBP3s05eNgq  숫자는 국내 시장에서도 구독형 임상기록 AI가 자체 수익으로 설 수 있다는 첫 신호에 가깝습니다.", "strategy": "국내 EMR 벤더는 외부 차팅 AI가 의원 단위로 먼저 깔리는 흐름을 전제로, 자사 EMR에 쓰기 연동 API를 열지 아니면 자체 기능으로 막을지 노선을 빨리 정하셔야 합니다. 후발 주자는 범용 요약이 아니라 과별·의사별 기록 습관 학습을 핵심 자산으로 잡는 편이 방어력이 높습니다. 공공병원 실증과 엔터프라이즈 모듈 출시 시점에 대형병원 조달이 열릴 수 있으므로 경쟁사는 그 전에 레퍼런스를 확보하실 필요가 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3044563", "verified": "원문 직접 확인(2026-11-16 06:18 게재·16:17 수정, 의원 500곳·누적 80만건, 만족도 98%, 전환율 70%, 3분48초에서 1분8초 확인)"}], "verification_note": "청년의사 기사 원문을 직접 열어 도입 규모와 시간 단축 수치를 확인했습니다. 수치는 모두 회사가 자체 조사로 제시한 값이고 동료심사나 제3자 검증을 거친 것이 아니므로 기업 주장으로 분류했습니다. 구체적 EMR 연동 방식과 가격은 기사에 나오지 않아 쓰지 않았습니다.", "image_concept": "A fountain pen resting in a shallow bowl of still water, its nib dry and unused.", "img": "data:image/webp;base64,UklGRnQ4AABXRUJQVlA4IGg4AACQDAKdASqwBCADPpFIn0ylpCatofGY4bASCWlu//I9rf857B4Wo05O/TcY+eKjtCQkgH1/P+R1SuiCO+Haq1O75tfk+VH953SvWD+jemf/zPYZ/L/+96Hv/C9bn0+/6LfZdzbyrL4b5Z/ina7+QfovNLsS72/M12W/ln7x4s/M5+y6F2TL+7enFOk/n9H/p74hh4vxBfnnoaBrqc2u4D1L3Shdte/D1L3Shf4roOD7CR5Qu2u4D1L3ShdtdwDS1QLCArOO6gsP8AV6lY9pRWtthtW+3FI55odRboPPlTACFHjsnUV3Xh6s4StwlYQ/Uw84aZvUzfuAai4+5lEiPGNohC5ITGuRCl+KCRzcM2H3hfCo5PUhZKCRzbjuqK+pe7d0zexIcSQr0b1fqSMpzAEkK72tQ+o8DjAuqGh4QNdwMk2gAldw89SPWNdxMlzcMvx58dkpR73lCZpaoKpanLVBYcbabjXqF20Ajzi7gPUvdKFyEbUoYnh5lgkeULkGYKUc35t61ULGcUVo2NB4tL8Hg5YxXDb3iKDLsVRBTug1/CAoLq+gEe1bJLK7OY+6ETZ0UXsgyhdu71E8eZda2+sQO+nVC+p7bxUEkC87vAlgMa7LUW3EYroflugnY8GJC4wtEvGIun1KEJWORrMfdALlXUTh9KUuFcoHLNk3dR93/b5yHoivK8PIxLk+YE3nqdIa0/FwQYLznS8Vtsa7zszfbmDzQ0jkxQYWhHHd2ZMhSsFit5cAUzqdnKTNb+WFRreBknZIElxpU+8NnS8TJ4oMI/qJM3uh2hAiZHECEwAvfsj/JaUnbQZUSRLWzhv1L3S3YUjmhqHfNlRkKP7IamQGOiAMyHgLUY2y/VlgjXZZzcMngDTndsS5SdkjcuJwu2ybUzZuGZv+Fk67gPUvdKF8Sd/XpPJ130LpzojyhfFSqszN6l7pQ6cQHAMWAzN6l7pQngdZXbdM8cmPKE8I+7pm9S5V8lcbHRs3DHdRchGFF8TYGDQPUveEChxUtOrIcoBNrd7/S/yG1GuJlCUg1gAIB+H+1DqKBLKEHL+tns1dNkRpRCQXC8jfOJ02WGCpuPnLVBVCHbd4bnihjiBQqtmzfxqSsm7FzYPlmGVqUA+P/remirOho 한 기록 수집 역량 확보도 선택지로 올려 두실 만합니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://www.prnewswire.com/news-releases/credo-health-acquires-affineon-launches-pajamaai-to-end-doctors-pajama-time-302939962.html", "verified": "원문 직접 확인(2026-11-16 09:00 ET, 거래 금액 비공개, 임상그룹 200곳·의사 3,000명·환자 500만명, 인박스 40~60% 자동화, 월 40시간 주장 확인)"}], "verification_note": "보도자료 원문을 직접 확인해 인수 완료와 사명 변경, 규모 수치를 특정했습니다. 거래 금액과 투자자는 공개되지 않아 쓰지 않았습니다. 월 40시간 환원, 인박스 40~60% 자동화, 고객 인용 수치는 모두 회사 제시값이며 제3자 검증이 없습니다.", "image_concept": "A desk lamp still lit over an empty chair at midnight, with a neatly closed stack of paper beneath it.", "img": "data:image/webp;base64,UklGRkomAABXRUJQVlA4ID4mAABQggGdASqwBCADPpFIoEylsyarIJNommASCWlu/7S6n6gg66SO4DZgBxvDO5bl2zHz+i50xadhlX6f/m+cx52+r6dD0EeeOf1+p/YA513mD85P0Q/3v/QexD/tOpB9ADpb/3Y4P/pzrmNsX6Lzsdr/8B4iOUHaNeB5gVq7qTeCNgM+ff932Cf6L/h/WQ8O4lOxCRt93Ium7Zw+SDhDboj6yKjh/dxw/u44f3ccP7uOH93L3fQL+ccAJC8cBt0ULCo6Jes2ry5PBEHTlmJg1McAJDdzf78Gyw0nD6X5stlDL3bOFQ/IkJj5IODlpIyPByu3do8heiabOFV+Za9ZHx+hcm7nds4fKFz+nw1t6KHwAkMH1mKjjBX4Nqi9HZ01ppBwht0VGqH/vbomuroWPEfa9g1efohmWxKNPkg4R3hLr96aTh8kI+16yKmm4tNKa5lNg5NttA8tzMUmn3c8LPQo04z4XbAwpWcxu5bJk6Mu2bVzF3PJeht0Reifx+OvRaVgegnTWbl7X4Ilo+r7eIOEOXbA6+EClGKxhGLb6zdEfWRUcP65JJNfZFWnJv/D++kkHEFlFsypDm1PdyN62K7jlrB9ZFRw/unFzF3bIyPUm+vNHVm5nu0cpblIP8DOpkuzf+4jmlMFvjP847HgLBZ4Q26JCQcw/69NhDboj9irbZGR3zQD0hmEU//JhKz2X1l7L/B53PwAku+gA4n1RME9gPLRopKrNP282iF3vnRIlevGhxt0R+AQqwhe1pQCDhDdbVXfxDR100mSYlfFMeVcDv447nMHRE3qq+IqyiW859WV2nlhphBMcP2nkh1PF3bOHxKlGoXWRUcPx1z+hxtvnUW927woofoFEpxrobLzEFmIOn4iZCQBcOkUuA1Yw+0t1ZXo59CBdJu7m7RUj+yXWCXouv/pySxrIcF4LfvLnnOYwXztnMYPrlXfXM/Epm5SEnDb2G7A2lEpLJlyKBqlHrgc+1yXBAu+i0vVx64nPa7Vo0KFnu4w1tL5lr16Nl8CS6QSF4uqdtZwuOCzi2dJHhDboiwuc0tQ1+LmYPyG55fIWHJeSSBRhg32/D6hYLCS2822HM7IYL3IDl++krDb2vZvRgBrFtAJ/SDJ+srMnYky4m6KDN0SwvogBT39tdumh3gu4zp6FJiG7QTI0TtGd8mgQuHnqCz4Zu1q6JepIT4jS8CmUdffdxw4uVYPL1KV5C8tyxrrtesine/MFCq4/Gbzgi8eFp34z4ivxpQU0Bv7vd//SqQQ2/RI5pFsE7bYfEmsio32Xq8f4EWcPkjwnZPvU9muUWXXOoPWfBHDmlh ntity": "퍼머넨테 메디컬 그룹, 카이저 퍼머넨테, 퍼머넨텍, 랩트헬스(Wrapt Health)", "what_changed": "북캘리포니아 카이저 퍼머넨테의 의사 조직인 퍼머넨테 메디컬 그룹이 11월 16일 HLTH 2026에서 의사 주도 혁신기업 퍼머넨텍을 출범시켰습니다. 현장 임상에서 나온 문제의식을 기술 제품과 파트너십, 독립 사업체로 전환하는 것이 목표이며 기존 기술기업과 공동 개발하는 방식을 함께 쓴다고 밝혔습니다. 모 조직은 의사 약 1만명으로 북캘리포니아 카이저 퍼머넨테 가입자 470만명을 진료합니다. 1호 포트폴리오 기업은 랩트헬스로, 며칠 전에 노쇼 가능성이 높은 환자를 예측해 자동으로 연락하고 우선순위를 매겨 비어 버리는 주사실 의자를 줄이는 플랫폼입니다. 북캘리포니아 22개 사이트, 524개 의자에 적용돼 노쇼율이 줄었다고 하지만 구체 수치는 공개되지 않았고 투자 규모도 밝히지 않았습니다.", "why_matters": "병원 AX의 주도권이 벤더에서 의사 조직으로 옮겨 가는 모델입니다. 미국의학협회가 2016년 Health2047로 시도한 구조의 재판이지만, 이번에는 470만명 가입자와 1만명 의사라는 단일 폐쇄형 진료망이 검증 무대로 붙어 있어 상용화 전 실증 여건이 훨씬 유리합니다. 노쇼 예측과 주사 의자 활용률처럼 수익에 바로 붙는 운영 지표를 1호 과제로 고른 점도 임상 AI보다 운영 AI가 먼저 돈이 된다는 판단을 보여 줍니다.", "strategy": "국내 상급종합병원도 산학협력단 기술이전을 넘어 임상 현장 문제를 사업화하는 별도 법인과 1호 과제 선정 기준을 제도화할 시점입니다. 1호 과제는 영상 판독 같은 임상 AI보다 노쇼·장비 가동률·수술실 회전처럼 재무 효과가 즉시 계산되는 운영 지표에서 고르는 편이 성공 확률이 높습니다. 국내 디지털 헬스 기업은 병원 주도 혁신 법인을 투자자이자 첫 레퍼런스로 동시에 활용하는 접근을 검토하실 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://medcitynews.com/2026/11/the-permanente-medical-group-launches-innovation-company-to-commercialize-clinicians-ideas/", "verified": "원문 직접 확인(2026-11-16 게재, HLTH 발표, 의사 약 1만명·가입자 470만명, 랩트헬스 22개 사이트·524개 의자 확인)"}], "verification_note": "메드시티뉴스 기사 원문을 직접 열어 설립 사실과 규모, 1호 포트폴리오 기업 내용을 확인했습니다. 투자 금액과 노쇼율 개선 수치는 기사에도 공개되지 않아 쓰지 않았습니다. 회사 자체 보도자료 원문은 열람하지 못해 언론 보도 한 건에 근거한 항목입니다.", "image_concept": "A single empty reclining chair in a bright room, with a small hourglass placed on its armrest.", "img": "data:image/webp;base64,UklGRpQuAABXRUJQVlA4IIguAADwygGdASqwBCADPpFIoUylq64tobMIkcASCWlu3M/kb66/Psvx/oFwfDwju1C6Q8YifleIud5Yt+O7ZXOOilJtO3mPuF+SqZH1SNJfvT8t5xXIvnQ/6PrS8wDyt+kHzAee3/qvU9/UPRV6kz0CfLy9p//A5ON2DWZ18R/f7Zw+X13enbjxpn1vnf/P6/X9Z9QbylgkZlNVPihZsPQVS6qfFC2RBZsPQVS6xWHEBsPQVS6qfFCzYjeyvsWsRzy2b0Qa9izDRLLPJ211QZEGZ2Pc3u31thjHBfhDqoLOclfi1U+L6zYSRAbDzZ0KpjPUxxnNh6+XsAHoKmmYmw9BVJtogSnYSqoGEB8PCLMoVeqmmrYQNh6H72V/p8UK4ahzxD4oWXi1U9RNnxAjIy2fXkvccyoc4gSiGmqnqJqp8TaqZq8lqp8 리 같은 시작 집단을 정해 예약·복약 안내, 증상 선제 확인, 보호자 응답 분리 처리, 프로토콜 기반 전문의 에스컬레이션을 수행합니다. 기반 플랫폼 포지는 승인된 지식만 답하게 하는 제약, 입출력 차단 가드레일, 평가 통과 전 배포 금지, 전체 맥락을 넘기는 인수인계, 드리프트 감지와 상호작용 단위 감사 기록을 안전장치로 두고 HITRUST r2·SOC 2 Type II·ISO 27001·NIST AI RMF 등을 충족한다고 밝혔습니다. 자체 평가에서는 안전 중요 메시지 선별 모델이 정확도 99.72%, 지연 0.374초로 비교 대상 범용 모델을 앞섰다고 제시했고 도입 기간은 최소 12주, 명시된 고객사는 없습니다.", "why_matters": "보험자 민원 응대와 환자 사이 기간 관리라는 두 영역이 에이전트 상품으로 정식 판매되는 단계에 들어섰습니다. 승인된 지식만 답하기, 평가 통과 전 배포 금지, 상호작용 단위 감사 기록 같은 항목이 기능이 아니라 구매 조건으로 전면에 나온 점이 핵심 변화입니다. 리그가 인용한 경영진 조사에서 도입 요건 1~3위가 내장 컴플라이언스, 사람으로의 자동 에스컬레이션, 실행 중 출력 통제였다는 점은 이 시장의 경쟁축이 성능에서 통제력으로 옮겨 갔음을 보여 줍니다.", "strategy": "국내 보험사와 건강관리 서비스 기업은 챗봇 성능 비교 대신 승인 지식 한정·에스컬레이션 규칙·감사 기록을 요구사항 명세로 먼저 작성하는 방식으로 조달 기준을 바꾸셔야 합니다. 범용 대규모 언어모델 단독보다 작은 전용 모델과 조합해 안전 선별 구간의 정확도와 지연을 분리 관리하는 설계가 비용과 책임 양쪽에서 유리합니다. 공급 기업은 자체 평가 수치만 내세우지 말고 평가 데이터셋과 재현 조건을 함께 공개하는 쪽이 신뢰를 얻을 것입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/league-launches-ai-front-door-and-ai-care-companion-on-forge-by-league-platform-helping-payers-and-providers-accelerate-ai-adoption-with-built-in-safeguards-302940866.html", "verified": "원문 직접 확인(2026-11-16 13:48 ET, 에이전트 구성, 포지 인증 목록, 자체 평가 99.72%·0.374초, 도입 최소 12주 확인)"}], "verification_note": "리그 보도자료 원문을 직접 확인해 제품 구성과 안전장치, 자체 평가 수치를 특정했습니다. 모델 성능 비교 수치는 모두 리그 내부 평가 결과라고 보도자료가 명시하고 있어 독립 검증이 없습니다. 고객사와 가격은 공개되지 않았고 인용된 경영진 설문의 원자료도 열람하지 못했습니다.", "image_concept": "A heavy wooden door fitted with a small sliding peephole hatch, slightly open.", "img": "data:image/webp;base64,UklGRjwbAABXRUJQVlA4IDAbAACwUgGdASqwBCADPpFIoUylp7GzIJOIumASCWlu2/NfLhz//f54hf9c4ar/4gf4DQufAOfFX+fCO+IOBCbYBmE0xUff+z6a2G0UOnVrx/Nbnt5wDn9eYDzd/Rj5wHUh+ib0x37c5W5PK6+AiW5noCN8upy4vM9ARl7aMV05cXmegIy9tGK6cuLzPQEZe2ef8it2J4L6TeV2QuLzQ5LRipJPj0BGXtns+PORP0vuO55noEOl20YriiTL1lt8ep7t2LydT3bsvEZe2jFdOXF5nn9UK3YvM9ARU49c+JDNRT7BJzunLi9wJBJ7d8paXsRXA/VuZ6AjL3HNFclP+JOd05br5ZPEnTDF7aMV05UKlALgfq46zPQEVOP6Ibl7Z649k6tdOW6+ky/E7aCpI4/oCMvbRhtZPeL4vM9A  예방과 급성을 통합한 처방이라는 경쟁 축이 생겼음을 전제로 제품 포지셔닝을 재검토하시기 바랍니다. 한국애브비 측 급여 확대 신청 시점과 심평원 급여기준 설정 방향을 주시하면서 트립탄 제네릭 중심 포트폴리오의 매출 영향 시나리오를 준비하시는 것이 좋습니다. CGRP 계열 후발 개발사는 ECLIPSE가 한국을 포함한 다국가 시험이라는 점을 활용해 국내 임상 데이터 요구 수준을 가늠하실 수 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.dailypharm.com/user/news/344635", "verified": "원문 직접 확인(급성 편두통 적응증 추가 허가, 2023년 11월 예방 적응증 허가, 3상 ECLIPSE 1,328명·149개 기관, 1차 평가변수 충족과 2차 평가변수 유의성, 주요 이상반응, 유럽연합 2026년 6월 동일 적응증 추가 확인)"}], "verification_note": "허가 사실과 임상 설계·결과는 약업 전문지 본문으로 확인했으나, 기사가 허가일을 ‘최근’으로만 표기해 정확한 변경허가일은 특정하지 못했고 보도일인 2026년 11월 17일을 기재했습니다. 통증 소실률의 구체적 백분율은 기사에 제시되지 않았습니다. 식약처 의약품안전나라 허가사항 원문은 대조하지 못했습니다.", "image_concept": "A single tool that unfolds to reveal a second blade, now able to do two jobs instead of one.", "img": "data:image/webp;base64,UklGRpYeAABXRUJQVlA4IIoeAAAQbgGdASqwBCADPpFIoEylq7+toPE4c/ASCWlu///pH8xkBaHZwOp5xcqzRZ6aJB7HZCv6d0WfFHjj5cmD/x39p7yD3g/pb2AP1V6cvmA86f/Qep7/S+oZ/aeos9ADy7PZ3/eDK3J6/1LslmHBBmU39+0dWWhwjEftPoTZ7T6E2e0+hNntPoTZ7T6E2e0+hNntPoTZ7T6E2e0+4+fhtqb7oRqIzxLTgM2jSRvQjT1EZd+p7gaigcFYiAK19Nb2BCd7mKYfs4CV+LPafQlp7TGzxZ7T5w/p9TX2IvOdT2eK0SRnOp7PFnnU2e1duaolNn94pMRRj6bipjQ31dUPBofr9Sr6ubzvBgN8Vlgr522pvsJwP/ujMz2n0Js9p7KpTs3sefX0oJoGXR6E4wmzzpj3xOC1eY6J5s8We1dmqLPdSc/FbGLz7AAMRtSAGENfjdeKmNniz2ojjpR8ItzebM/vCEvd1Wt2v3/4prHM9Ey8HgFggGTgMWad7Wxi9f6ZgNvQpvX4fqbjTX15PqY/qPp3tnvmFTXntGu8AjGyd7/RZRuESebLyeJtCbCXoOsraXt9YcqrISCeBZhafUADIzZQfH30+ihIzyb9viHhuSTi7Lvh+pr5nFzfSWCJa4FJIJz0Mqnx2dfb+sdDb4i4dEPimZ+7LzJ41FeIAt11Na78mYbZ3RGH8La+Ig7nEzEoSO/iM/FjSITfqnn0rXC63/1KHqRT0p3zmeTjs6fQuQYcnFvb1GC1wqp+LPafXp4vWXu0+cHVlk32fOWYF52hRnLmtWIjW3cuCkeTWz04sslp9xUSetmyuCV9RKbPaexHxefXwS1sJMdaFGft9RsERr4MKyzalVp7Cz2nsRgmmNniz2rtMbJ2pgyfPdpm82uKUPDrc1fizze9SN/NpmqLnv+0E4jQb5reYPN49rHDDzv/EHP7nZmcZJ9TEKPdp9CbNHmmH8F8Eg89VQ3vhVb7/d8Lz47uvV1iF3Zd8tOITWuBanCmDIGpMf4eJoCbNHMPcxCKekb4vPiIlp632dw93wNgqQHFq0l7ia+viIPPiVla347nCnFXz3/suS3mmNnitHxon1MMo3qevskEJDMAlNc35vw/Xm+dWEITRisHsod6QfOEiCVPnDSYbUZ6Is0eao3BKa8G7B 고용 금지에 대해 면허를 근무지에 결속시키는 방식의 위헌 소지와 이미 약사를 고용 중인 한약사 개설 약국 현실을 들어 사실상 반대에 가까운 신중 검토 의견을 냈고, 안전상비약 품목 확대와 판매자 기준 완화에는 찬성 입장을 밝혔습니다. 약사정책심의위원회 신설에는 복지부와 행정안전부 모두 기존 기구 활용을 들어 유보적입니다.", "why_matters": "교차고용 금지는 한약사 개설 약국의 영업 모델을 직접 겨냥한 것이어서 통과 시 상당수 약국의 사업 구조가 바뀝니다. 안전상비약 품목 상한을 법률에서 하위법령으로 옮기는 것은 국회 동의 없이 행정부가 품목을 조정할 수 있게 한다는 점에서 구조적 변화입니다. 복지부가 두 법안에 정반대 입장을 낸 만큼 소위 심사 결과가 약계 정책 방향의 분기점이 됩니다.", "strategy": "일반의약품·안전상비약 품목을 보유한 제약사는 상한 규정이 하위법령으로 이관될 경우를 전제로 품목 추가 신청 준비를 앞당기시는 것이 유리합니다. 유통·편의점 채널 기업은 취약지 판매자 등록 기준 완화 범위를 법안 원문 기준으로 점검해 출점 전략에 반영하시기 바랍니다. 약국 체인·한약사 관련 사업자는 교차고용 금지법의 위헌 쟁점과 복지부 의견을 근거로 한 의견서를 소위 심사 전에 제출하실 필요가 있습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.dailypharm.com/user/news/344644", "verified": "원문 직접 확인(11월 24~25일 법안심사소위 심사 전망과 16일 기준 안건 취합 단계, 서영석·한지아 의원 발의 법안 내용, 복지부의 신중 검토 및 찬성 의견, 약사정책심의위원회 신설안에 대한 복지부·행안부 유보 입장 확인)"}], "verification_note": "소위 일정은 확정이 아니라 전망이며, 기사도 16일 기준 안건 취합 단계임을 명시했습니다. 현행 안전상비의약품 품목 수에 대해 기사 안에서 서술이 엇갈려 본문에 수치를 쓰지 않았습니다. 국회 의안정보시스템 원문으로 법안 조문은 대조하지 못했습니다.", "image_concept": "Two keys of different shapes hanging on one hook above a single lock that only accepts one of them.", "img": "data:image/webp;base64,UklGRhQaAABXRUJQVlA4IAgaAACwRwGdASqwBCADPpFIok0lpCqroJMoUXASCWlu+AVIO6ZpNIe/vENv9J+WHT+7/eHPaT5xtm/9b+284r2AP126dXmA/aj1t/Qv+zXsAf3L/VdZB6CPS6fu36M2rpRkmsVai4lBsQX4nRPeGgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAUCHnrExG2n8iOka8kl06i5F3DcuXK34FLqcvD2HHm4R1htqfE5EYC61vKupg4FBalxVe0BQJ06iXhOnTp06HnidYbp06dOnTv6dOol4Tp06Hnie8M+W1UExkBNc8T3bhOnQ88T2cUwFAm1PE6KM90gvkNy5cuXLoGd/ly4Xmrw0B8tp83LdOnTp06dPIZ06dOnQzqffITZakGyRmiQINZxwIECBAgQIECBAgQIECBAjODBVVQS6CdOhnaf506Gdp0NKVMgQFAnTqJ2jKmQIECA+PT6i5Yt06bWi08TfFTmfqeJ0T6jpBfgLT/D8pKb6QX4nRGkt0PBxunUzWfzp02ot3KW/BfIbw9E94RbVTKDVyYJ06l3zp06dOnTp06dOnTqj/OnTp06bOLqcrfgvkNy5WreXx4t0PPEaH9V4z9RtQWpAmVXfSx54nu2UzVG93mWo3NfxW4gj/Om1PAGqQXyMefH9DafqniPdGBUtgIbbHDbQq+vfqwpGUAgPj0wDn0xc9t/gUmZakCl1OF5YKchuXLly5cv/f4a2RHt2scMgbWh2WeuSRwlrBZasWoQagtSNdvPphmNV5pXmrw0CBAgKBDz4 Fg+inBjgAAUfLTIbNAFBtI4AQCwABCMAF1FRvOdvQAABrkQYEhZuIgNLHP1QAAQjTXqgAAAdtqGH9a1wA2xCGFhROEyw825Bykc7AAAAA"}, {"id": "reg-kpa-otc-forum-boycott", "cat": "reg", "alt": "모든 자리가 채워진 둥근 탁자에서 의자 하나만 뒤로 빠져 비어 있는 모습을 그린 미니멀 일러스트", "title": "대한약사회, 19일 국무조정실 안전상비약 토론회 불참 선언… 판매업소 1,050곳 조사에서 97.2%가 준수사항을 위반했다고 밝혔습니다", "short": "약사회 상비약 토론회 불참", "date": "2026-11-17", "scope": "국내", "entity": "대한약사회, 국무조정실 규제합리화추진단, 보건복지부", "what_changed": "대한약사회가 국무조정실 민관합동 규제합리화추진단이 11월 19일 국회에서 여는 안전상비의약품 약국 외 판매제도 개선 규제갈등 해결 토론회에 불참하겠다고 밝혔습니다. 약사회는 현행 판매제도의 안전관리 실태 조사와 개선대책이 먼저 나와야 하며 실태 확인 없이 품목·판매처 확대를 논의하는 것은 정책 순서가 뒤바뀐 것이라는 입장입니다. 약사회가 미래소비자행동과 함께 전국 판매업소 1,050곳을 조사한 결과 97.2%에서 판매자 등록증·주의사항 게시 미준수, 판매수량 제한 위반 등 준수사항 위반이 확인됐고, 일반의약품 소비자 조사에서는 78.4%가 의약품 선택에 어려움을 느꼈으며 10% 안팎이 중복복용이나 예상치 못한 이상반응을 경험했다고 답했습니다. 약사회는 전수조사와 관리·감독 강화, 공공심야약국·휴일 운영약국 확대를 요구하며 토론회와 같은 날 국회에서 맞불 기자회견을 열 예정입니다. 복지부는 대통령 업무보고에서 12월까지 확대 논의를 마무리하겠다는 방향을 밝혔고 국무조정실은 토론회 의견을 정리해 복지부에 전달할 방침입니다.", "why_matters": "핵심 이해당사자가 빠진 상태로 토론회가 열리면 그 결과가 복지부 확대 방안의 근거로 쓰일 때 정당성 논란이 불가피합니다. 97.2%라는 위반율 수치는 확대 반대 논거로 쓰이는 동시에 현행 제도의 관리 실패를 자인하는 자료로 양쪽 모두에 인용될 수 있습니다. 복지부가 12월까지 결론을 내겠다고 한 만큼 향후 6주가 안전상비약 제도의 분수령이며, 국회에서 관련 법안이 동시에 심사되고 있어 입법과 행정이 맞물려 움직입니다.", "strategy": "편의점·유통 기업은 품목 확대가 추진될 경우 관리·감독 강화가 함께 따라올 가능성이 높으므로 판매자 등록·수량 제한 전산 통제 체계를 선제적으로 정비하시기 바랍니다. 일반의약품 제약사는 확대 후보 품목의 오남용 우려 자료와 안전성 근거를 미리 준비해 복지부 논의에 대응하실 필요가 있습니다. 약사회 측과 접점이 있는 사업자는 공공심야약국 확대안이 대안으로 부상할 가능성을 함께 검토하시는 것이 좋습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.dailypharm.com/user/news/344647", "verified": "원문 직접 확인(11월 19일 국무조정실 토론회 일정과 장소, 약사회 불참 사유, 전국 1,050곳 조사의 97.2% 위반율, 소비자 조사 78.4%, 같은 날 국회 기자회견 계획, 복지부의 12월까지 논의 마무리 방침 확인)"}], "verification_note": "토론회 일정과 약사회 입장은 약업 전문지 본문으로 확인했습니다. 1,050곳 조사와 97.2% 위반율은 대한약사회·미래소비자행동이 수행한 조사로 정부 공식 통계가 아니며, 조사 시점과 방법은 기사에 상세히 제시되지 않았습니다. 국무조정실 공식 보도자료 원문은 확인하지 못했습니다.", "image_concept": "An empty chair pulled back from a round table where every other seat is occupied.", "img": "data:image/webp;ba 고해 ESR1 패널의 규제 승인 경로와 국내 급여 전략을 준비하실 필요가 있습니다. 로슈가 보조요법 3상 lidERA 기반 추가 적응증 심사를 진행 중이므로 조기 유방암 영역까지 확장될 경우의 시장 영향을 미리 반영하시기 바랍니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.targetedonc.com/view/giredestrant-everolimus-fda-approval-esr1-breast-cancer", "verified": "원문 직접 확인(승인일 2026-11-16, 적응증 문구, evERA 등록 373명·ESR1 변이 207명, 무진행생존 10.0개월 대 5.5개월, 위험비 0.38, 객관적 반응률 27% 대 14%, 용법 30mg 1일 1회, 동반진단 확인)"}, {"url": "https://www.globenewswire.com/news-release/2026/11/16/3404197/0/en/fda-approves-roche-s-wilserdly-giredestrant-a-next-generation-oral-serd-for-er-positive-esr1-mutated-advanced-breast-cancer.html", "verified": "로슈 보도자료의 제목과 배포일(2026-11-16)로 승인 사실과 날짜만 교차 확인(본문 접근 차단으로 미열람)"}], "verification_note": "승인일과 임상 수치는 전문 매체 본문에서 직접 확인했고 로슈 보도자료 배포일로 날짜를 교차 검증했습니다. 보조요법 lidERA 추가 심사의 지정 형태는 출처 간 표현이 우선심사와 신청 접수로 엇갈려 본문에 단정하지 않았습니다. FDA 공식 승인 공고 원문은 확인하지 못했습니다.", "image_concept": "A single brass key reshaped mid-air to fit a lock whose internal shape has quietly changed.", "img": "data:image/webp;base64,UklGRk4pAABXRUJQVlA4IEIpAABwigGdASqwBCADPpFIoUylpC4oIVJoecASCWlu/+e9Sf4qMVe9G38C726oh2ds5Djd5K+D37G7K+itZPQB70fh+mjcQ8+t50u/M09jOmpY/J7lLsp2wN+JAP3oU4n70o3s2bg6Lq2fu6vWupCklL+f/P1rqQpJS/n/z9a6kKSUv5/8/WupCkor+WyFFq2ZVnFKOUiu4e1AlSINNIDuY7Bbqe8xlWmclenxwyales5WytvN/PefrXULpdLL+7UkpflS1/3akcS4lbGbiLoE1KYHMxt0E2KzcNT6SUump6kKSRvlmUcf/P4GPd1emwlzqvhBVetaU2Pd1eteAKr4GPXRpi88YNfP/czzGXc/5JB/QABEeApJS/loCkllqpTx/0AB7xdHcyRJB/P/n611ISJ/Ext1IUkpfz/5+tdR904Mxl5+mqdudnIz9a6kKUQJI4N1C+jK9aSboQdSFJIzQ/WtJN1IUkpfk6IfrXUhSSOYS93V6zlfimXn6axWupCkkcG6hUVa0k3UhIf7uJjbqQpKONOReHZfyv7015D8tCbFa6kKSUf4/qxMbdSFJKX5aIOpCklHzXGvJpB/PmYNfLALX0ZebvMX5jLz9a6kKSUv5/8/WupClBaQut4o93V611IXO9hy8/WbvEH8/+frOV66kKSUv5/8/W1syADbdz/5+tdR9gMuNvAFV611IUkpfz/5+tdSZ/1rqQpJ06SbrD0kpfz/5+tdSFKddofrXUhSSl/P/n1gQu4fz/5+tp7AFYuIOitUeuiw6WX8/+frXQg7G0e7q9a6kKRxVrqQkQFSlroQwllnJS/loCklL+f/P1rqQxkfrXUiApS/n/z9a6kKU8gHB3Hu5nmMvP1rqQpHViFMzGx4PA1FxRyXlshSSpQx+H/LQFJKX8/+fpsba+zdSFJKX8/+bWp5dA1PV2Fggb  75.6% 대 80.6%로 위약과 유사했고 26주 내 수막염균 감염은 없었으나, 중대·치명적 수막염균 감염에 대한 박스경고와 위험평가완화전략 제한 유통이 적용되고 첫 투여 2주 전 백신 접종이 요구됩니다.", "why_matters": "gMG 영역은 솔리리스·울토미리스 같은 정맥주사 C5 억제제와 FcRn 억제제가 경쟁하는 시장이며, 주 1회 자가 피하주사는 투여 편의성에서 분명한 차별점입니다. AChR 항체 양성 환자가 gMG의 약 85%를 차지하므로 적응증 범위가 넓습니다. 유럽에서는 2026년 9월 17일 CHMP 긍정 의견을 이미 받아 글로벌 동시 확산이 예상되며, 국내에도 희귀질환 산정특례·급여 논의 대상으로 올라올 가능성이 높습니다.", "strategy": "자가면역 신경근 질환 파이프라인을 보유한 기업은 MG-ADL 차이 -1.6, QMG 차이 -2.1을 새 비교 기준으로 삼아 임상 목표치를 조정하시는 것이 좋습니다. 나노바디·알부민 결합 반감기 연장 플랫폼은 피하 자가투여 전환의 실증 사례가 생겼으므로 기존 정맥주사 바이오의약품의 제형 전환 전략을 재검토하실 만합니다. 국내 도입을 검토하는 기업은 위험평가완화전략과 동일한 수준의 수막염균 백신 접종 관리 체계를 허가·급여 조건으로 요구받을 수 있다는 점을 미리 반영하시기 바랍니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.neurologylive.com/view/fda-approves-gefurulimab-generalized-myasthenia-gravis", "verified": "원문 직접 확인(승인일 2026-11-16, 적응증, PREVAIL 260명·113개 기관·20개국, MG-ADL -4.2 대 -2.6 및 차이 -1.6, QMG -4.5 대 -2.4 및 차이 -2.1, QMG 반응자 46.3% 대 25.2%, 박스경고와 위험평가완화전략 확인)"}, {"url": "https://www.mda.org/press-releases/fda-approves-klygefa-expanding-treatment-options-for-generalized-myasthenia-gravis", "verified": "원문 직접 확인(미국 근육병협회가 2026-11-16 승인을 발표한 사실, 이중결합 나노바디 C5 억제제 기전, 주 1회 오토인젝터 자가투여 확인. 임상 수치는 미제시)"}], "verification_note": "승인일과 PREVAIL 수치는 신경과 전문 매체 본문과 환자단체 보도자료 두 곳에서 일치했습니다. 환자단체 자료는 발표일만 밝히고 FDA의 실제 처분일은 명시하지 않았으므로 처분일이 하루 앞설 가능성은 배제하지 못했습니다. FDA 공식 승인 공고 원문은 확인하지 못했습니다.", "image_concept": "A single lightweight paper airplane carrying the same cargo that previously required a heavy cargo crate.", "img": "data:image/webp;base64,UklGRnYgAABXRUJQVlA4IGogAACwZQGdASqwBCADPpFIokylpC6loRKYUdASCWlu4WbPBPJSkm6tnkkeun6T+4dAVyB0Z9UojGyP6y/yl7AH6I/pj6yX6O/BH+Vegn+Q/8312PRZ/3vUK/7Hp+eqB6AHSuft9wf/Tj9qPOk0l1mv9Cig+OEyXaNbJ5hfuXn34O/5HRx31x4rwpZ5QNYcyup3U1ATK6ndTUBMrqd1NQEyup3U1ATK6ndTUBMrqd1QB/Y1ImHXLS5yyu44XCZXV/n1p3U1AaHE/U7qagJldTuw+tvfKvhicnNv/1i4D3wkrrMutEuMbqd1NQEyup3U1ATLMbM/dG48ura7nGlQR/IzocIsbO/hN/aP5GZldTupqAmV1ZKF07tNjY+sy9DcWro/kZmVtkkoPP5eJ+p3To8l4hdO6mp3Mrqd2Db+7jr14YCqQH8/  끈이 두 개의 퍼즐 조각을 떨어뜨려 놓아 영원히 맞물리지 못하게 한 모습을 그린 미니멀 일러스트", "title": "식약처, 병용금기 295개 조합·연령금기 9개·임부금기 6개 성분 추가 행정예고… 펜터민·큐시미아 등 비만약과 파킨슨병약 라사길린·항생제 리네졸리드 병용을 금지합니다", "short": "식약처 병용금기 295개 추가", "date": "2026-11-16", "scope": "국내", "entity": "식품의약품안전처", "what_changed": "식약처가 2026년 11월 16일 ‘의약품 병용금기 성분 등의 지정에 관한 규정’ 일부개정고시안을 행정예고했습니다. 병용금기 295개 성분 조합, 특정연령대금기 9개 성분, 임부금기 6개 성분이 새로 추가되며 의견 제출 기한은 12월 7일입니다. 비만치료제 펜터민, 펜터민·토피라메이트 복합제, 펜디메트라진, 디에틸프로피온은 파킨슨병 치료제 라사길린·사피나미드 및 항생제 리네졸리드와 병용이 금지되고, 펜디메트라진은 메틸페니데이트와의 병용도 금지됩니다. 메틸페니데이트는 라사길린·데스플루란·이소플루란과, 서방형 캡슐은 파모티딘·시메티딘·라니티딘 등 H2 수용체 길항제와 병용금기로 지정되며, 불면증 치료제 렘보렉산트는 클래리트로마이신·리팜피신과 병용이 금지됩니다. 연령금기로는 메틸페니데이트 서방캡슐 5세 이하, 디하이드로코데인 함유 5종 복합제와 단일 서방정 12세 미만, 렘보렉산트 18세 미만이 지정되고 렘보렉산트는 임부금기 2등급으로도 분류됩니다.", "why_matters": "병용금기·연령금기는 의약품안전사용서비스(DUR)에 반영돼 처방·조제 단계에서 실시간으로 차단되므로 지정 즉시 현장 처방 패턴이 바뀝니다. 식욕억제제와 ADHD 치료제처럼 오남용 우려가 큰 품목군이 집중 대상이어서 비만 클리닉과 소아 처방 시장에 직접적인 영향이 있습니다. 295개 조합은 단일 개정으로는 이례적으로 큰 규모여서 제약사의 허가사항 변경·설명서 개정 부담도 커집니다.", "strategy": "해당 성분을 보유한 제약사는 12월 7일 전까지 임상 근거를 갖춘 의견을 제출해 금기 범위를 다투거나, 반영이 불가피하다면 설명서·포장 변경 일정을 미리 확보하시기 바랍니다. 병의원·약국 전산 공급사는 DUR 코드 업데이트 규모가 크므로 시스템 반영 일정을 조기에 잡으실 필요가 있습니다. 비만·ADHD 영역 신약을 개발 중인 기업은 모노아민 산화효소 저해 계열 및 CYP3A4 강력 저해·유도제와의 상호작용 자료를 허가 신청 단계에서 보강해 두시는 편이 안전합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.dailypharm.com/user/news/344638", "verified": "원문 직접 확인(식약처 11월 16일 행정예고 사실, 병용금기 295개 조합·연령금기 9개·임부금기 6개 성분 규모, 의견 제출 기한 12월 7일, 개별 성분 조합과 연령금기 내용 확인)"}, {"url": "https://www.mfds.go.kr/brd/m_99/list.do", "verified": "식약처 보도자료 게시판에서 2026년 11월 16~17일 등록 자료 목록만 확인(해당 행정예고는 보도자료가 아닌 공고로 게시돼 목록에서 찾지 못함)"}], "verification_note": "행정예고 사실과 상세 성분·수치는 약업 전문지 본문으로 확인했고, 식약처 보도자료 게시판에서는 해당 건이 확인되지 않아 공고 게시판 원문은 대조하지 못했습니다. 기사에 공고번호와 시행 예정일이 명시되지 않았습니다. 추가된 295개 조합의 전체 목록은 공개된 범위에서 확인할 수 없었습니다.", "image_concept": "Two puzzle pieces held apart by a thin red cord that prevents them from ever interlocking.", "img": "data:image/webp;base64,UklGRhAgAABXRUJQVlA4IAQgAABwUQGdASqwBCADPpFIoUylpCc 이상 걸린다는 현행 병목이 공식 문제로 제기된 것 자체가 정책 의지의 신호입니다.", "strategy": "의료AI 개발 기업은 법 통과 시점을 전제로 데이터 확보 로드맵을 현행 기관별 심의 유지와 법 시행 후 통합 요청 체계 두 가지로 나눠 준비하고, 옵트아웃 조항이 들어갈 경우의 데이터 결손률 시나리오도 함께 세우시기 바랍니다. 가명처리만으로는 희귀질환·유전정보 재식별 위험이 지적됐으므로 차등 프라이버시나 합성데이터 등 추가 보호 기술 역량을 미리 갖추면 심의 통과에 유리합니다. 투자 관점에서는 의료데이터 중심병원 네트워크와 데이터 거버넌스 역량을 보유한 기업이 법 시행의 직접 수혜군이 될 수 있습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.khan.co.kr/article/202611162100005/", "verified": "원문 직접 확인(경향신문 2026-11-16 21:03 기사, 법안 명칭·복지부 장관 자료 요청권·거부권 미명시·데이터 수집 1년 이상 지연·NHS 옵트아웃 및 독일 사례 확인)"}], "verification_note": "법안 내용과 쟁점은 경향신문 2026년 11월 16일자 기사 본문으로 확인했습니다. 법안 원문(의안 번호, 조문)과 복지부 공식 입법 예고 자료는 직접 열람하지 못했고 국회 통과 일정도 확인되지 않았습니다. 단일 언론 출처에 의존한 항목이므로 조문 세부는 추가 검증이 필요하며, 보도 시점에 법안은 심의 중인 상태입니다.", "image_concept": "A single frosted glass jar sealed with wax, with countless tiny paper slips pressed against the inside wall.", "img": "data:image/webp;base64,UklGRnQwAABXRUJQVlA4IGgwAABw0wGdASqwBCADPpFIokylp7IoIpbYMkASCWlu+C1NR9bvCfFiW+bjXs2rGAfodvoqD4V/QeY2936i9x942/q/+oL+5b8b6AHTXf4zJ3PWPmBtDb58yr7Nr/8TvARxh70DatJDk38aY3Pj1BMnm8rZGXTzeVsjLp5vK2Rl083lbIy6ecNgCMunm8rZGXTz7q1qhqgCTPVmgM5ankn03kverz+OVhbeQJiz0BFO7S5GXbRG46WyMunkn08C5V0TJPpu5eitkEGxQXf0vZi5GXRNGeb0WCMunm8rZGW0S6eSAS6ea+tfwW546Gcd7IpH03lbIy6ebyW8wC26UqRW5V3YuRpHlS2l1xmA+W0U/S67LagBGXTzeS9mLkVI9CtytkZdE0Z5vOu3o1Rt08kAl083la1hKXIy6ebytjl6ZYpUg9TzeVscvTPP6ALxo9pP0REVARl083dQ1sFN5WyMunm8rWqFblbIqUHU3kvZyi1qWxmpx4YNELwEd9NlEzvexccZpgFuVsjLp5u6QN0BdOWp7iYy2kAzYRpEq0JSnKFgFEjBmGuMunm8rZGXTzd0f3vDyU3lXODXJiSzKtYR5kgLXPeus03E7Q5LR1BAC3K2OaPfZxFIBrq2RKkVxsVj8Q84hB6xUBGW0XxVSemCGEBa54aJVfy5G0TBIAl09htjPN5L2YuRltE08Fn0e7UNahmmAW6K+iGEZGxBqYoVuS0WRb1brNM19Hu0uRvLmp5LzIRTtWn3BGXTzeVsjLp5vK1qhW5Wxy9MsUSNYiyJWsplJcP2jy+f9y+c2ZYEscgFT9AFkusxmlYMgi1eKmrSpgP+0nYd2lSDzRLpy1PNgpvK2Rl05anLNEunknLRnm8lnHrjg0s21Drd9Exk4muA8Ka9wCNkhO9jgkxxzKeP+ofJGAdeaUJbSFecDrWF7A9+WgxGW0J3aXIy2iWyr0z0BGXTyP1eTQrQU3kvYd82zRHKJP+W7E8ne8BDUzV7hkoK/j9J+nUmDtxPyCPZQ/eCuooRdxauqsGZQvheJfZqhW5WyM 차 지표인 52주 CDR-SB 변화량은 전체 환자군에서 통계적 유의성을 확보하지 못했습니다(p=0.4015). 사전 지정된 단독투여군에서는 위약 대비 악화 속도가 약 31% 지연돼 유의성을 확보했고(p=0.0266), 시간으로 환산하면 약 3.5개월 지연에 해당합니다. ADAS-Cog13·Amsterdam IADL 등 2차 지표는 두 집단 모두 유의한 차이가 없었고, 뇌척수액 cGMP 증가와 단독투여군의 p-tau217 명목상 감소가 관찰됐으며 Aβ42/40 비율은 변화가 없었습니다.", "why_matters": "경구 PDE5 억제제 계열 치매약이 전체 환자군에서 1차 지표를 놓친 것은 아리바이오가 올해 체결한 중국 푸싱제약 대상 대형 기술이전 계약의 후속 마일스톤 전제를 흔들 수 있는 사안입니다. 단독투여군 한정 결과로 FDA 신약허가신청에 들어가려면 사전 지정 분석이라는 점을 인정받아야 하는데, 전체군 실패와 2차 지표 미충족이 겹친 상태에서는 설득 난도가 높습니다. 반면 AR1001군에서 ARIA가 아닌 설사·낙상·어지럼증이 주요 이상반응이었다는 점은 항아밀로이드 항체와 차별되는 안전성 포지션을 유지합니다.", "strategy": "투자자는 1차 지표 충족이라는 헤드라인이 전체 환자군이 아니라 단독투여군에 한정된 결과임을 분리해 읽으셔야 합니다. 회사는 추가 분석과 52주 이후 공개 연장시험을 진행 중이라고 밝혔으므로 다음 확인점은 하위군 분석의 일관성과 FDA 사전 협의 결과입니다. 국내 치매 신약 전반에는 병용 배경치료가 1차 지표를 희석한다는 설계 쟁점이 공통 리스크로 부각될 전망입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80835", "verified": "원문 직접 확인(CTAD 2026 2026-11-16 보스턴 발표 사실, N=1,535, 전체군 p=0.4015, 단독투여군 31% 지연·p=0.0266·약 3.5개월, 2차 지표 미충족, cGMP·p-tau217·Aβ42/40 결과, 주요 이상반응 확인)"}], "verification_note": "수치는 CTAD 발표를 전한 국내 전문지 본문에서 직접 확인했으며, 아리바이오 공식 보도자료 원문과 학회 초록 전문은 이번 수집 범위에서 직접 열람하지 못했습니다. 따라서 CDR-SB 절대 변화량, 신뢰구간, 단독투여군 N은 미확인 상태로 남아 있습니다. 헤드라인의 충족이라는 표현은 단독투여군에 한정된 것이므로 전체군 결과와 반드시 분리해 인용해야 합니다.", "image_concept": "An hourglass tipped slightly off level so the sand runs down one side only, on a plain grey surface.", "img": "data:image/webp;base64,UklGRsAgAABXRUJQVlA4ILQgAACQVQGdASqwBCADPpFIoE0lty2ooPIYOuASCWlu4WjTKFDCY2i7CZL7x/k/7z+QHUW9rdK/Zxct5HT3X+79S/8W/uH/P/r37//QP+oHnZesH+w/9v1D/z//O/uH76H++/YD3af8n1AP+F1FfoZ/rd6dfs/f2H/y5W31n3Zz+mk+A/5NKifO4xhjA0c7Mjw+QJxBYsWLFlolYt1tSYC1ILFjBiSBCxxwIECBAgQIECBaBAgSq1NqhF8ML9COu7wICz770U/52aBAgQIEB9B3rlRgLUgsbuCxYsWLFinvW96L21hxRy2qVIdLrE96A0EGI622BgLUh4W62qJezRPduI4AvLU24MxSx8DrLiLW1JgJjVzJAgKDZ4l/CJdqY4D4tSC4BXgYnLBB3IjnvDQIIi4LFixYsWLFixYsWEOxqcFkmEimQFAoZx0Z+W+HXTznaUZdN+cb8MBddLNTXRajeRCSjstTbh4W62pMBakFi0RpbqGA60aBAgQIEbtbCGQIECAoFs9mie8NAgQIE /www.biospace.com/deals/j-j-pays-2-2b-upfront-for-ollin-taps-blackstone-to-fund-eye-disease-trial", "verified": "원문 직접 확인(11월 16일 J&J 보도자료 기준 선급금 22억달러, 마일스톤 최대 11억2,500만달러, 블랙스톤의 7억5,000만달러 3상 자금조달, OLN324의 VEGF·Ang2 표적과 적응증, 이노벤트 발굴 사실 확인)"}], "verification_note": "거래 구조와 금액은 J&J 보도자료를 인용한 업계 매체 본문에서 직접 확인했습니다. 총액 약 33억달러는 선급금과 마일스톤 합산치이며, 전일 파이낸셜타임스는 최대 34억달러로 보도한 바 있어 총액 표기에는 매체 간 차이가 있습니다. 거래 종결 시점과 규제 승인 조건은 확인된 자료에 명시되지 않았으므로 아직 완료가 아닌 계약 단계로 보아야 합니다.", "image_concept": "A single empty eyeglass lens resting on a stack of blank paper, with a thin thread of light passing through it.", "img": "data:image/webp;base64,UklGRropAABXRUJQVlA4IK4pAADwogGdASqwBCADPpFIoUylpCcrIRJ4gWASCWlu//+91f/53/WELx4T3Xa7n4qwdEetZiv7Keobfnt//P7+x8ovof+N5n/w38X50P9P6l/7D6gH+k8rn1f+YPzuP+p6v/8Zvon9r9TDzpfWK/wmTuTPte+vPotYS/x/Bb9RhpXTnJHRyeXkonn9zlf1r8r07+IZ9b6JPtP//J6aAPL3ccrXUH1rqD611B9auqTpx8kHCklLhXmkbKSU2yklLhSSlwpJ0+ePprFa5/65KpirN1CKGc2L7kB/Fe7jH1Nd679jE6Sl2g3hceuJPSHCi8Nat2WQfWugEx8kHCkkblybEJpUllFOVr3R9a0G793u2vTK27Z37YndugAG3UNP7HHYxtqOT8B5HKZW1TBTxrlecmxKj3bvbtqPdxytdUddOPKzWo5L58kGW5a9a7EvLIPrXVxK8UvzlruXMe7z0ePFnpDiApR3vwyb28sBUlop34spJS4Ukb/VcrZqI1O2FPj7NaLeVrn+9dGXP27aj3ccrXUH1rqD10aO2vWuoPrXf7txmHQlXNsib2z0hwouuOimXbUDLXwpJG509iPgK5KXCklNspQJO/edDjbR1FMu2o91A0LJGcwHSHCknRd2VIPY+FJKXCRD0I+q/5JCjyGcrxTLtLiDhReGuy5O8DqD1xK6O8Rl2zwGtdUx+3en49eILfaQ2u+K6Nla6gu5qobGXbPSG+5Vf8kg4UjirXUH1rqjrZFf+WBYW8fsvp/VrR1DayMNZ6Q4R9lXXl8KSUsty11vu3bUCshV3nC+47STp6o7M0BU1jYugEyF3OMrzEeV50FvuoabWiXmM/TOlonJfEuDtV7qCPIZcR+dyQAw6w0lD8SpL+B5cEKMZOdkW0QUen2fYv2EV8la6g9cSo93HK2Xm3edUYDU+ULz7m/NUc7Y7RtxhJzx+OAw/+me7Dh9k/NEV9bITeVv8YBUuITxTi/+dUGv8AREmtaSZ1ENml5jOaZY+wJLm0660WTYeR6lAFL4WOPJyHvXAav7MoQM6tZJpj4nORvf9RVrpsquJcWjbn/inaBjjl0Xeegy3LTvEeBt1B9Mg6hcgJ2EBmTAuUKbPrM87WDAbAMxLHHyRAcr14jLtnoUNkBi3GX8BWta6wLJmI+9A4iVQilMnFQaT20iyY5NECbubXH8gVJ224GBn/vZfBgg5WVop13iK23LFVVyupbRHEu16awlVgiACKOWLTs/b9HJZKd7F3EyB4dZoku6+eU//CyZhi2BtDBLiUCJr6T1g45dLRmKFGSuWz3sUBNIa0gBp6fb1ri3d51d1FfKmcSnicTKf8wI5Xfr8o37 위 무재발생존 값이 제시되지 않았고 상세 데이터는 12월 2일 비뇨기종양학회 연례회의 레이트브레이킹 구연에서 공개될 예정이므로 그때까지 해석을 유보하는 편이 안전합니다. 감시군 대비 비교라는 설계상 약물 간 우월성은 입증되지 않았다는 점도 함께 고려하셔야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.biospace.com/press-releases/pivot-006-phase-3-registrational-trial-demonstrates-unprecedented-improvement-in-recurrence-free-survival-rfs-for-intermediate-risk-and-high-grade-ta-non-muscle-invasive-bladder-cancer-nmibc", "verified": "회사 보도자료 전문 직접 확인(11월 16일 배포, N=367, 약 90개 기관, 위험비 0.32(95% CI 0.23~0.45, p<0.0001), 중위 추적 17개월, 3등급 이상 치료 관련 이상반응 없음, 2027년 2분기 허가신청 및 BCG 불응성 신청 확대 일정, 12월 2일 학회 발표 계획 확인)"}], "verification_note": "수치와 일정은 CG온콜로지 보도자료 전문에서 직접 확인했습니다. 회사가 스스로 예비 분석 결과이며 전체 검토 후 변동될 수 있다고 명시했고 중위 무재발생존은 공개되지 않았습니다. 대조군이 활성 약물이 아닌 감시이므로 기존 치료제와의 직접 비교로 읽어서는 안 됩니다.", "image_concept": "A clear glass vessel whose inner wall is coated with a thin even film, lit from one side on a dark surface.", "img": "data:image/webp;base64,UklGRhQuAABXRUJQVlA4IAguAABwngGdASqwBCADPpFGn0yloyorILKIsWASCWlu3LS57ixf4dUEnXicqS04Dng+TECXtvc75mJL7bUDfImWtFLbq7jbyYECllUtdF70R/P8z75Hvdf9b1+82z0yfzf0W+fd5/+RUetJ/l8ncm/tzHSOlgeFcwHllL9/ue+Q0H/k+OR919QCat+60bGdueN/1vPD9hg6wZckzYUecuLzPQEZddOXFwGO7i8z0BGXoK3K3M9ARl105cXmeofAXrNQH/i83EHluUSZdcYZCkfToMumnDNrkBoRJj/MmWBs+PGVl1LqQBhU92iVfrqCRRABG8t5MBCuU31qd/dPNytzPQEZbeO3vmOncXQrY2xC4uUl3f/RcWAVPfVswYw0top3Tl+Yj/If/REyES66b9RU4CR9OXF5noCNI9OXwC1nzw9SJdds9QhjTha7kotOnLi8z0BGXex9xJl105cXmd4VdWgpL6hkLvUZbpVAmgKkyakObA2Wz+pIYpAFPRon3+CuL8LBX7d2AIu58bx0IIRTvyvjaQl4Apk3K3M2owsHKquHf1orQV0m8z2zfSzrWnxY5iVOk6AqieFntX3jybzYUcuYwwcW7F+8iw+gLV8G1uaB8gIqfx3S6Jy8otzPKkDylwEPFua8pEgmXXW5bnjmLK3+ingkZYx8IBEpNyZMBwkUDd+Z6BNEeO3JqhvNhYFjVUn5OT6v/FI+k5Ytsk3mvvDwr4kouw88MCdDfyoaT6aMs2I2DIy9SlG04+OalEfOjiyoCKkgjUfyiJPRx/QDjA3IKv71398wqoNEIuU4imkCjpv+JFGkDYCH1jifydssivCJ5Ndt36RuDP56nFN0Ul4eYWZ1VzqaMrEru8DCA1mSP1W9tOOnpI/jYYfOm143J9cdZnoCKd8c3GRjL4NrczuhqCH4AOFH/7hKUYA2XVGLw+NDlz4xLARtSjxN5h2rOrBYq1r78DajVAT83FvroS6aBxGW4XaOZg2r5pesgpBV8JTjN40DF0FaYO8OuF0k url": "https://www.biospace.com/drug-development/serious-adverse-events-mar-robust-efficacy-data-for-helus-psychedelic-in-major-depression", "verified": "원문 직접 확인(11월 16일 발표 기준 N=222, 6주 19.5점 대 11.9점, 2일 16.1점 대 11.0점, 12주 16.9점 대 9.9점, 치료 관련 중대 이상반응 3건과 자살 시도 경위, 주가 약 17% 하락 7.36달러, PARADIGM 프로그램과 EMBRACE 2027년 4분기 일정 확인)"}, {"url": "https://www.biospace.com/press-releases/helus-pharma-announces-positive-topline-results-from-phase-3-approach-study-evaluating-hlp003-as-adjunctive-treatment-in-major-depressive-disorder", "verified": "같은 날 배포된 회사 보도자료가 2026-11-16자로 게시된 사실만 목록에서 확인(본문 미열람)"}], "verification_note": "유효성 수치와 안전성 사건, 주가 반응은 회사 발표를 인용한 업계 매체 본문에서 직접 확인했습니다. 다만 1차 지표의 평가 척도명과 p값은 해당 기사에 명시되지 않아 미확인 상태이므로 본문에도 적지 않았습니다. 보도자료 원문과 규제기관 협의 내용은 이번 수집에서 직접 확인하지 못했습니다.", "image_concept": "A single tarnished brass scale balanced unevenly, one pan holding a smooth stone and the other a cracked one.", "img": "data:image/webp;base64,UklGRs4xAABXRUJQVlA4IMIxAADQnAGdASqwBCADPpFIoUylpCOtoNJIgbASCWlu8XDai3PYdsQEUjO3pxKTEwP/+a9nfOrlM68ib7fvY+jX+49ID1F8+F5zm/Fbtpk7nrXzveXGQn4/9o/s/NF0V1svzJ/K/w/p/4E/NbUIxQ7X3cPMU9vPvnmr/L+ef2P9gL+f/1f/Ych197/7HsC/0P/I+i7/6ecX669hT+fg082thybTGOmtXamr4LCiO/Nob8Y4+sebU0+EMIGxs0+EMH1jZ3WaokcPaJr0XGutOXkKb+UBx9huJs9K4jLjeZWojNq7YK5cHdy0JkKJolVjLLxO2GpHftiU2qY65dZmbL1QNXx+DfrTq0+XqHE1fEeTcmGwtD+XYj9nChj++Nhhx686DIjSM+eIJLTGOHjNpbdBZWnODG180Jxd/Bt4T+rc25M6K0/Hbo5NpdcBSJAYfk9tgqIcUAFG4jk2FY+c0CAwGBDXyZW5wj0YJoMLI7koB6OUR63UfWTzM0xkF9YxBilePPNrXx9djH0xj8AIvQmISR7bQknhkEH8/AZzIwGdHuHyYqXuGRgkJahO1IAgMvoks3uzAWOsbCRbrbttBjXPKbFaol5ZreQlGlLaVjISZEMH1tfiO/AXZ7DYO4RDyNmcjkjXNk8yASqagDdLB64LFfMT8PXMbTHXOLmlWZtTT4QvEeEO4+sbSNJ8b3oVQDq2EqK+eCLk761bw6KXz+azB0LmWDdLmlk66PwBuECnVc7nE0hbD4RER8Kz4QwnePGuxU92obzDl48uT1Qw751k9ArPD0neN1QSEkh41nNJjbvXvLwiC9+/mrndZy5HIjCY/dx4wEvA7Hiuevsf7eD2tUYj4QvEZjwkn7yhFObMDJ3UWhS+mmnC9tYNkUtk/0vKWQyz62SEMIMYQf4vtZLmqIJurBBMOHLUDXunn55ZVjFUH4FGn7j0+4tffNXXBbzahVUf6Fiuc6plByjT3q9qHpLLwxUX/p+CL+mRg+rzzoMRIVBPb0DPjuLau8CxT0ufZqpZc+ l", "cat": "bio", "alt": "납작한 돌 위에 안약 병 하나가 옆으로 누워 한 방울이 번져 있는 모습을 그린 미니멀 일러스트", "title": "HLB테라퓨틱스 RGN-259, 미국 3상 SEER-2에서 1차 평가변수 미충족… 발표 당일 주가가 29.98% 하한가로 직행했습니다", "short": "HLB테라퓨틱스 3상 실패", "date": "2026-11-16", "scope": "국내", "entity": "HLB테라퓨틱스, 리젠트리(ReGenTree)", "what_changed": "HLB테라퓨틱스는 11월 16일 미국 자회사 리젠트리가 진행한 신경영양성각막염 치료제 후보물질 RGN-259의 미국 3상 SEER-2에서 1차 평가변수의 통계적 유의성을 확보하지 못했다고 밝혔습니다. 투여 4주 후 완치율에서 투약군과 위약군 간 유의한 차이가 없었습니다. 회사는 11월 13일 임상시험수탁기관으로부터 톱라인 결과를 전달받았다고 설명했습니다. 이 임상은 미국 41개 병원과 이탈리아·스페인·폴란드 등 유럽 3개국 9개 병원을 포함해 총 50개 기관에서 진행됐습니다. 발표 당일 주가는 개장 직후 가격제한폭까지 떨어져 오전 9시 27분 기준 전 거래일 대비 700원(29.98%) 내린 1,635원을 기록했습니다.", "why_matters": "RGN-259는 앞서 유럽 3상 SEER-3에서도 위약군 완치율이 예상보다 높게 나오며 1차 지표를 놓쳤던 자산이어서, 두 번째 후기 임상 실패로 글로벌 허가 경로가 사실상 막혔습니다. HLB 그룹은 리보세라닙 허가 지연 이후 신약 개발 역량을 입증할 카드로 RGN-259를 제시해 왔기 때문에 그룹 전반의 파이프라인 신뢰도에 직접 타격이 됩니다. 티모신 베타4 기반 안약이라는 희소 기전에 대한 후속 파트너링·기술이전 가능성도 함께 낮아집니다.", "strategy": "각막 완치율처럼 위약 반응이 큰 지표를 1차 평가변수로 삼은 설계가 두 차례 연속 발목을 잡았다는 점은, 국내 안과 신약 개발사에 평가변수·대상군 선정이 기전보다 결정적일 수 있음을 보여 줍니다. 회사가 수주 내 전체 데이터를 받아 2차 지표와 하위 환자군 반응을 종합 분석하겠다고 밝혔으므로 다음 확인점은 특정 하위군에서 재설계 근거를 찾아내는지 여부입니다. 다만 하위군 사후 분석만으로 추가 3상 자금을 조달하기는 쉽지 않으므로 유상증자·자산 구조조정 가능성도 함께 보셔야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.hankyung.com/article/202611168295i", "verified": "원문 직접 확인(11월 16일 보도 기준 미국 3상 SEER-2의 1차 평가변수 미충족, 4주 완치율에서 위약 대비 유의차 없음, 11월 13일 임상시험수탁기관 톱라인 수령, 하한가 사실 확인)"}, {"url": "https://www.ajunews.com/view/20261116095816451", "verified": "원문 직접 확인(같은 날 보도에서 오전 9시 27분 기준 700원(29.98%) 하락한 1,635원 하한가와 임상 실시 기관 구성 미국 41곳·유럽 3개국 9곳 확인)"}], "verification_note": "실패 사실과 주가 반응은 11월 16일 당일 복수 매체 보도로 교차 확인했습니다. 다만 HLB테라퓨틱스의 DART 공시 원문과 회사 보도자료 전문은 이번 수집에서 직접 열람하지 못했으므로 1차 평가변수의 구체적 완치율 수치와 p값은 미확인 상태입니다. 전체 임상 데이터는 수주 내 수령 예정이라고 회사가 밝혔으므로 2차 지표·하위군 결과는 아직 공개되지 않았습니다.", "image_concept": "A single clear eye-drop bottle lying on its side with one drop spilled and spreading on a flat stone surface.", "img": "data:image/webp;base64,UklGRpYtAABXRUJQVlA4IIot  이는 3년간 15억달러를 절감하는 비용 프로그램의 일부로, 프로그램 초기 비용은 20억달러이며 일부 인원은 사내 재배치될 것으로 전해졌습니다. 파스칼 소리오 최고경영자는 15억달러를 쓰면서 일자리를 만들지 않을 수는 없다며 회사가 축소를 지향하지는 않는다고 말했습니다. 칼리디바이오테라퓨틱스는 인력의 약 67%(2025년 12월 31일 기준 29명 중 약 19명)를 감축해 연간 약 300만달러의 보상비를 절감하고, 자금 조달을 모색하면서 합병·인수를 포함한 전략적 대안을 검토한다고 밝혔습니다. 템페스트테라퓨틱스는 6~9월 사이 정규직 4명 중 3명을 내보내 1명만 남겼으며 9월 30일 기준 현금은 90만달러입니다.", "why_matters": "아스트라제네카의 상업조직 감원은 호흡기·면역 포트폴리오에서 특허 만료와 약가 압박이 겹친 구간에 대응해 자원을 성장 영역으로 재배치하는 신호입니다. 칼리디는 9월 30일 기준 현금 4,190만달러를 보유했는데도 12개월 존속 능력에 중대한 의문을 명시했고 M&A 검토까지 공개해, 소형 바이오텍의 자금조달 환경이 여전히 경색 상태임을 보여 줍니다. 템페스트는 정규직 1명으로 운영하면서 중국 허베이 센랑의 CD7 표적 생체내 CAR-T 플랫폼 옵션을 행사한 상태여서, 껍데기 법인과 라이선스 자산을 결합한 생존 모델이 확산되는 양상을 드러냅니다.", "strategy": "국내 기업에는 빅파마의 상업조직 축소가 공동판매·판권 계약 협상력 변화로 이어질 수 있다는 점이 실무적 함의입니다. 칼리디·템페스트처럼 현금이 마른 미국 소형사가 M&A와 역합병을 공개 검토하는 국면은 국내 기업이 임상 단계 자산이나 나스닥 상장 껍데기를 싸게 확보할 기회이기도 합니다. 다만 아스트라제네카 감원 규모는 회사가 확인하지 않은 언론 보도이므로 수치를 확정적으로 인용하지 않는 편이 안전합니다.", "evidence_type": "공시", "sources": [{"url": "https://www.biospace.com/biospace-layoff-tracker", "verified": "원문 직접 확인(11월 16일자 항목 본문에서 아스트라제네카 약 600명 감원 보도와 회사 확인 거부, 15억달러 절감 프로그램, 칼리디의 67% 감축·약 19명·연 300만달러 절감·현금 4,190만달러·존속능력 중대 의문·전략적 대안 검토, 템페스트의 정규직 1명 잔류와 현금 90만달러 확인)"}], "verification_note": "칼리디와 템페스트의 감축 규모·현금 수준은 미국 공시에 근거한 집계 내용으로 본문에서 확인했습니다. 아스트라제네카의 약 600명 수치는 블룸버그 보도이며 회사가 확인을 거부했으므로 확정 사실로 보기 어렵습니다. 감원 대상 사업장과 직무별 내역은 공개되지 않았습니다.", "image_concept": "A row of identical wooden chairs with several removed, leaving gaps in the line on a bare floor.", "img": "data:image/webp;base64,UklGRvoqAABXRUJQVlA4IO4qAABQcwGdASqwBCADPpFIokylpCOioTJYQLASCWdu4WdyPJ6kzmv0i+IuSD19cfN7z3+A9Pnj3tS9X9O3zlf1PQHtjzEuZ/zn/ePfT/hP1w/q/w6/un9t/Xb4B/7z/evWz6Nv7l6Bv289Xj/lerP+/eo1/lfSy9V3+zepL/APSg/9XtO/2v/vetvqbnqrzkl2/r5A66f0QHd/MX9zsELWM+xGbf6z6GfpIdp+DGRgF1NQExipAwC6mvvuMAupqAmMR5eJ3pjELjy3vuMCQyrkLFEe6KqFYAmMSrv1GEFnTiV/gcLLeu97eupsT4zMuwsVm4CYxGS2W91pWi8D0t1lsbWzYtJVyEZwODb3cQJZLOt8zFZokX+9GNvctG6SsoTLUczy8TsI7CZeSm2SVLuTQPrAEvZ1sW2mW+c6fXF7B5jEOh5jEAIKXQgA0DaWsxWAJiswvdtNpvM const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
