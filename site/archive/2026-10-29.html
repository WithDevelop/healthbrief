:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}

 시작할 수 있고, 기존 EMR을 교체하지 않는 원내 구축형으로 약 4주 안에 도입하는 것이 목표입니다. 회사는 의사국가시험 435문항 전부, 보건의료인 국가시험 3,009문항 중 2,980문항을 맞혔다고 밝혔습니다. 현재 상급종합병원 11곳을 포함한 17개 병원, 1만 병상 이상에서 솔루션을 운영하고 있으며, 우즈베키스탄 국영 IT 기업 우즈인포컴과 병원정보시스템 공급 본계약도 맺었다고 했습니다.", "why_matters": "국내 의료 LLM 기업이 영상 판독 중심의 기존 의료AI와 달리 병원 운영 전반을 맡는 원내 구축형 AI 플랫폼으로 시장을 넓히려 합니다. 정부의 지역·필수·공공의료 AI 확산 정책과 맞물립니다.", "strategy": "데이터를 외부로 보내지 않는 구조와 제품형 공급으로 도입 장벽을 낮춰 중소병원과 공공병원 수요를 노리는 전략입니다. 국가시험 성적은 회사 자체 평가라서 외부 검증이 필요합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.rapportian.com/news/articleView.html?idxno=241707", "verified": "원문을 직접 확인했습니다(제품 구성, 국가시험 성적, GPU 2장·4주)."}, {"url": "https://www.etoday.co.kr/news/view/2640944", "verified": "원문을 직접 확인했습니다(17개 병원·상급종합병원 11곳·1만 병상, 우즈인포컴 본계약)."}], "verification_note": "국가시험 성적과 글로벌 모델 3종 대비 우위는 회사가 자체 평가한 결과입니다. 우즈인포컴 계약의 금액과 체결일은 기사에 없고 공시도 확인하지 못했습니다.", "image_concept": "A compact server box placed inside a hospital bed frame, glowing softly like a nightlight.", "img": "data:image/webp;base64,UklGRqJOAABXRUJQVlA4IJZOAADQXQKdASqwBCADPpFIoUwlpKqqorKoyVASCWlu2CFK1vuyf/Ce+mOzUeQ4rCcHzbax+bFPluMgL6s+/3//Qw5L4+2oHlM+PYj2Cr1K84j1jf1/odfPgyKX0rsmWmrpf/6vY2xh/SdnOOk6d3pPxm9n/5PoI+1X3r0nJx/8JqBf5L018TagX+oPWK8HvnH8C/7kCBO+l6zHTdMg6IIdZ7Gvhus7x7fROsW95DqPJ7yHTINrEOpBRNrEQQLigPpgjyHhrBH6SeBzXw/g6iHSOs3N8h1Yt7zbRTM4ICQRPvq3vIdMEeQ9R4hzmL7+BzXw3WLe8bDUh9MEeQ8NYI8hztPdjaO53kOmCPHShqQ+mCPIdWKuAq3vIdMEeQ6sC3yoM2rG8C49J3kOmCPIdcmqg2q3vIdMEd0SSE74vf9c0nga2zEbvRZyxRaBVveQ6YJgvdzgwJd4cUeIdWLyWCjBRIgtLHnD1B+95YE1HEOPi26N5nSG6x7fXNdBChPMLb5wICPIdWBUch6k5W8CAjyHOzV2QpbXL29PeQ6aopQNZVwqP1RNxh3WLyWCAFBZsLlBvUz91chfg4ZrG1M1hQH0wR5C8zfQgguyFLqWMO1H39I4L8NAqAgtVvUighW6D8tLDbtPeQ6YI8h99W92NqgEz6FJ5NzoiomCPI68UjfI6/veFFH00zyydBRyHVi2y9/VyF54Kh0wRgv6Xny8jlTbL3oXAsna6FiH8QvX+r0Q+mFSTx88zcWB3FAfTBHjrXGLf8x7ZcW92ORIrCnIBmwP3scgFtlRRxJAs54Jc/SrUNOcB7zinKrbUSE5GCk/xfenuCI6DH15nBvahSDwIgtKzWFtwSB6PppO4/zeQNNUwV+KJgaJzXe2/Gx8mueOqicuv8KZjz0znLjHN7cvrSt+rcO0sInf1b7IjwArJ6Am77BzMGNOrFm7TLGcNi4ZggIwWKXL 노이드 학회 3관왕", "alt": "돋보기 렌즈가 엑스레이 실루엣을 흐르는 빛의 리본으로 굴절시키는 미니멀 일러스트", "date": "2026-10-28", "scope": "국내", "entity": "딥노이드(Deepnoid)", "what_changed": "딥노이드는 10월 28일 대한의료인공지능학회 정기학술대회 KoSAIM 2026(10월 24일 폐막)에서 수상 3건을 받았다고 밝혔습니다. 흉부 영상 비전언어 AI ‘GLINT’가 최우수 구연발표상을 받았습니다. 파운데이션 모델로 뇌 MRI 백질 고신호강도(WMH) 병변 분할 성능을 높인 연구와 고품질 병리 영상 생성 기술 ‘STREAM’은 우수 포스터상을 받았습니다. 회사는 이번 학회에 초록 7편을 발표했습니다.", "why_matters": "국내 영상 AI 기업이 단일 질환 검출을 넘어 비전언어 모델과 파운데이션 모델 쪽으로 연구 축을 옮기고 있음을 보여줍니다. 판독문 생성형 제품 경쟁과도 이어집니다.", "strategy": "흉부·뇌·병리 3개 영역에서 생성형·파운데이션 모델 기술을 쌓아, 8월 허가받은 뇌 MRI 정량분석 등 기존 딥뉴로 제품군 고도화의 근거로 삼으려는 전략입니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.biotimes.co.kr/news/articleView.html?idxno=35659", "verified": "원문을 직접 확인했습니다(수상 3건, 연구 주제, 발표 7편, 10월 28일 입력)."}, {"url": "https://www.medifonews.com/news/article.html?no=217892", "verified": "검색 결과 제목만 확인했습니다(본문 미열람)."}], "verification_note": "학회 초록 심사와 수상 단계의 성과이며 저널 논문 게재는 아닙니다. GLINT 등의 구체적 성능 수치는 기사에 없습니다. 학회 공식 수상자 명단과 대조하지 못했습니다.", "image_concept": "A magnifying lens that refracts an X-ray silhouette into a ribbon of flowing light.", "img": "data:image/webp;base64,UklGRj5EAABXRUJQVlA4IDJEAAAQLQKdASqwBCADPpFIoEylpCarITMo2WASCWlu8bG836rVtwu6aboDGZ2OXbR/9Cz9+r/ZOYDxY+Q8z727/n85npa8wboK+bXzofUr/j9+x9Bbzm/Wp/u2//9MvG8QAysaA1APow+fb+D57/1v+l9gD/H+l3/H8nWgX/NP8R6Sem17D9hfpiekyGgmPL8gKqAIPWBa/ICqgCD1gWvyAqoAg9YFr8gKqAIPWBa/ICqf0yqaHy1YJH6Fk0enYj64tWyTOhqhWF63IQCqgHW/L8fOZuluLC+QwxB6wa5BE6XZIvWvyAqnUGDRAKn9xYomLVnGJC6Ovx80s8/9cHgWvn1poPWTdfoknrVgWvyAqoAfmtwrFhethIn/Q/NLVskXpD1+QCsRcqZQA/PcsnVfWOqqoAg9mMDwda/IC9TkGig4t2QC9S/IC9RgAWFIV2K4pVZyDzIPqX5IAJboGUgSX81Ag/CsVzTYGFIb79bBxgXf0Mvybs3jVCzutWxaez3YQCI6gAm7LTIC5VOPHlvVxuX0MqhIY619DPXUd8r6w6X04iS36XweLVs8iuv3XVtP1reTZqc0WToIPWBa/RHCSZoB8+mX6Oc6WraqiJf4oWFVAEKOPQZITwEKSRJ0Rb5GQrC9iPihAQKDK1Sc/lppAVTgfbHebC/NJ+sKOD/Ntr8k7aUoG0QNQVMoAg9ZRa1sDBDfjeiCH+dRAlcEGBgtv4vPwL7B+MXHqorEg9YLWggFVAEHtguAMSzfRBIIMaSYf9/OWLwnHFF6Rb1qsDLlwsVaEnCLqnhA6/IIu9zRdivqKc7SnJdiv6XAt402fA9fj5  축이 처방에서 지속 관리로 옮겨 가고 있다는 신호입니다.", "strategy": "카운슬은 비만 치료를 고혈압·당뇨·이상지질혈증과 급성 진료까지 아우르는 1차진료 멤버십의 진입점으로 삼고 있습니다. AI가 맥락을 먼저 수집하고 의사가 합류하는 ‘채팅 우선’ 구조로 원가를 낮추려는 전략입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.financialcontent.com/article/bizwire-2026-10-27-counsel-health-launches-weight-management-program-bringing-continuous-physician-led-ai-native-care-to-glp-1-treatment", "verified": "비즈니스와이어 보도자료 원문을 직접 확인했습니다(2026년 10월 27일)."}, {"url": "https://hitconsultant.net/2026/10/27/counsel-health-launches-ai-native-weight-management-program-lillydirect-glp1/", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "지속률 32%·15%는 보도자료가 외부 조사를 인용한 것이며 원 조사는 확인하지 않았습니다. 회사의 이용자 수나 매출은 공개되지 않았습니다. 지난 호의 월그린스 49달러 체중관리 비대면진료와는 별개 사안입니다.", "image_concept": "A slim glass hourglass whose falling sand is guided by a tiny glowing chat bubble.", "img": "data:image/webp;base64,UklGRtwkAABXRUJQVlA4INAkAACQZgGdASqwBCADPpFIoU0lpCMooLQIQRASCWlu7x8uz+hatn93RhVr7/sZdK/4Ghr/+5Tuii1P6budVT3EeSW3qO388eyl6f9x3z2mnOU+f8G85toXvl7aZnYPXlVfWrJ/QA43waRpEiRIqZrjpAREiRIkSG+WooUKFChQpKtWrVq1atWrVq1atWt3cGlfzRP6fJOWpkyiO8vE5yZMh8atJXTy620FauP6RIkR8F6eZMmTJe/6Z1otWh9xOJGGIJxIkP3Tj0z+kP5OpFwcgg6ky/z5TcmQ+YEYcSJGOhmzZrcxLKpBWrVqscuPJMifwePHjx7KnHNqec2M+4X4HnsKAhz5nOLkk5plFNW98HHHx4Y7GSiJxIkSML8Mpm1jgZksGNsBzFAgg2faCIkSJjhD4C41a3crI/aEn4AgxzTggH/q0SMdIgXl4soU5uaoLB4CdOh4I15FxGS5mcfM9sH9048kghz2BC0cJkKmcPqWSSxnw+4QU+fufPYcXMNiguQQYfO/9om5Mn/5kMBScdBZjm7xY5ZjCoDMOHC0Vxk+ewQzTJkPcKKC102aOh/3s9qjLC7Tp06HnHRIf3RJw58uuZxbBDTy6tIuNMyystMFCiUFbNkBFLCumzSN8FZ/iOGoQ1wzaf0+YWObIQn9PpZLHSeb5UAMHFwcfK64VAm0+WuwCU/vUTcnRrEWb9ivS9gd1MsIqAb+56dHaAXrfrnCbfOgIyJAHFg+CgRB5PX4KecurSwmykPHjx48c27bcVDSD8wGd69dlr9ubxC9Z9sbGUK6u4GCP3YFBohBsrm3cbF5Fe2JCRgOcIoYhJfcoS0vtVBbLoocqb1eHH75Flp06gDlqxwOlb/T5ckkEIpcybK/QoEISzZxnvgSjrIiUAGHFSMX+cESvkIbE2PVnQBWNYeF+mZ27NlBUOIcoiL29/af5kPOQGJUauS+AcegrbIMOWnJ8tVzEpv82+f6FI5BckKTafX1Nq3LbJ8XhPC+8WKS0Kc5jmBrxYgAOTEPmHkFPpSdAV25phsE1XUMCmJBDjIZy7S95Vb4lk/D8gdxTDfe25CJ 일반병실 7%, 중환자실 10% 오릅니다. 중증 수술·시술 1,670개 항목의 수가는 20% 인상합니다. 비수도권과 수도권 취약지 종합병원급 이상에는 지역우대 수가 10% 가산을 2027년 1월 분만·신생아 중환자 치료부터 적용하고, 3월부터 수술·처치로 넓힙니다. 2.7조원은 11월 고시 개정을 거쳐 시행됩니다.", "why_matters": "오랫동안 묶여 있던 진찰료와 입원료가 함께 오르는 대규모 수가 재배분입니다. 지방 종합병원과 필수과의 수익 구조가 바뀌고, 의료기관의 장비·약제 구매 여력과 지역별 수요에도 영향을 줍니다.", "strategy": "지방 종합병원, 분만·신생아·중증수술 분야와 거래하는 제약·의료기기 기업은 2027년 상반기 수요 변화를 반영해 영업 우선순위를 다시 점검할 필요가 있습니다. 11월 고시 개정안과 연내 확정될 9,000억원의 집행 시기도 추적해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503000000&bid=0027&act=view&list_no=1492342", "verified": "복지부 보도자료 원문을 직접 확인했습니다(3.6조원 중 2.7조원 우선 집행, 9,000억원 연내 결정)."}, {"url": "https://www.medipana.com/news/articleView.html?idxno=420306", "verified": "원문을 직접 확인했습니다(진찰료·입원료 인상률, 1,670개 항목 20% 인상, 지역우대 수가 일정)."}, {"url": "https://biz.heraldcorp.com/article/10918129", "verified": "원문을 직접 확인했습니다(지역우대 수가 규모, 최종치료 보상 연 9,000억원)."}], "verification_note": "보도자료 원문에서는 진찰료·입원료의 항목별 인상률을 확인하지 못했고, 해당 인상률은 메디파나뉴스 보도에 근거합니다. 지난 호가 예고한 29일 ‘희귀·난치성 질환 치료제 건보 적용 확대’와 ‘K-제약바이오 프론티어기업 육성방안’ 발표는 조사 시점까지 확인되지 않았습니다.", "image_concept": "A large hospital scale tipping its weight away from a crowded city skyline toward a small rural clinic.", "img": "data:image/webp;base64,UklGRjg3AABXRUJQVlA4ICw3AABwqQGdASqwBCADPpFIoUylpCcloTGIiOASCWlu8/Ft00Qbi5SXQsjWmwpj7uf7rzHOU/Pb/hpQYkXaeen813rfTTuG+dX9Qv7D8Ff6DvTX/43JzvVfab/y/8L5M/kP3L+6/MbnnxR/m35//lfml7c/9nxd+Smop7U/W3vSPEM3DzDvaf7P+yPkJf7n+M9WP5z/UewH+ufHD/cf+1+yvwL/0j/Serr/eftj/rvWj+kf6T/4+4v+xvXdCZ7LRTALbq9opgFt1e0UwC26vaKYBbdXtFMAyxn7RTALbgIbTd1e0Uuul10wC26n7FJWXUtG/cLbq9nitFMBcdPznoSv7ecCYS67xT9bXIyMmXXTdUZUg9oDcyGP+9UtG6bur2irrxPVaIiquxTSbeJalscopgFt1e0UwC3gtOEvfsTIy66SYFwTizQy2LsJEf/z9o6fBRSAsgJbxuLV03dXYRTdWA5eCil1xyimASSR+VakDdN3YnD9WWizYJIG5GRky3CXUkUUD3imettShjn5+0Uuw+aoWIqL8dssuTI/ELH1IyUaGEtwl6A3jFHv0hvVCtuUfCyAEjAtqT/y4G1kSKbDoupGP/z9o6ggBIvIZuxMjNHKMuum7q9opnpcMLUOS0UwC4OL9eTAtuVnnH7K4l/YRRI2uaspv2JkZGTLqS46QUD3kadI8X/d1e0UgLIAkP/59gmNc+FwKu/NqQoB83d 이 담긴 플라스크에 작은 밀랍 인증 봉인이 찍힌 미니멀 일러스트", "date": "2026-10-28", "scope": "국내", "entity": "식품의약품안전처", "what_changed": "식약처가 28일 배지 제조업체를 방문해 원료물질 인증 준비 과정의 애로사항을 들었습니다. 인증제는 「바이오의약품 위탁개발생산기업 등의 규제지원에 관한 특별법」(2026년 12월 31일 시행)에 따라 수출제조업 신설, CDMO GMP 인증과 함께 도입됩니다. 세포주, 세포은행, 벡터, 배지 같은 원료물질의 제조·품질관리 수준을 정부가 인증하는 제도입니다. 식약처는 12월 초에 ‘원료물질 인증을 위한 제출 자료 안내서’와 ‘원료물질 제조 및 품질관리 가이드라인’을 발간하고, 인증 담당 전문인력도 양성할 예정입니다.", "why_matters": "대부분 수입에 의존해 온 바이오 원료를 국산화하고 공급망을 안정시키는 제도입니다. 국내 소부장 기업에는 CDMO 공급망에 들어갈 공식 품질 인증 수단이 생깁니다.", "strategy": "배지·세포주·벡터 공급사는 12월 초 발간될 안내서를 기준으로 인증 신청 자료를 미리 준비할 필요가 있습니다. CDMO와 완제 기업은 인증 원료를 쓸 때 공급사 적격성 평가를 얼마나 단축할 수 있는지 검토해야 합니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.koreatimenews.com/news/article.html?no=1300173", "verified": "원문을 직접 확인했습니다(28일 간담회, 특별법 시행일, 12월 초 안내서 발간 계획)."}, {"url": "https://www.paxmedicalnews.com/news/articleView.html?idxno=3287", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "식약처 보도자료 원문은 직접 열람하지 못했고 보도자료를 옮긴 언론 기사로 확인했습니다. 방문 업체명은 공개되지 않았습니다.", "image_concept": "A single glass flask of pink cell culture medium wearing a small wax seal of approval.", "img": "data:image/webp;base64,UklGRlQzAABXRUJQVlA4IEgzAABwwAGdASqwBCADPpFIoUylpCqwoPIYehASCWlu+Bn7I6ruwn5fSTTfq55l/rZmPRU9JcNj5Dx6lC//qs2FHypjxaYnZudnY69Nn+T3jPPE6eB0V/pQZNz7r9F9nGvExrsyO3n9p8Q790/2O/xDa5RnhTYn/wHRJg2EMcPhCSBsdK1dp9CaepOfU4ZvzaFC3ah9fJqvH18f31Y84ObXqOJr4mtevSC84sr2Xraj/C3SiCD4N8GzTtPtP/TxUR8IRjAJtl5u0vTuEUKKP5AfLyrynG+n4e1nFx/Va9E5xtUEWekFvslk9mmYmOHIpE6Sqpm82I7hVUCvsR/oc1EnKbvAOEv5JJzAjHr7ZYzrqsFJfOvFFJavSDGvrE0U0L6PnH4PrHm1RVoipjTqXVifq2Awi4+8c5pnUNHTJLT4StoRw97GmC2KshDObALDm97AhIvg/vq4u9fIPW0ZAfk3mvNvmj0VcwbG23Q/vqWT6vcAvilwAhvNtQv0kfY9bxfCQWERZ4qTMbdYjXf+gPWLyJu5vIY2B5E6LmiyAt6xOon96utGAbFbKV0qHowkaKTLFwF+sdiSaXQQ6B+IMlmHTORGUllAmhGvfzvEi24CL3JA90WnzlQeEJH0uRz6m0hy09i7hwKg7hfPk9rp8BgBlRXAQxSQR1GukHOs4egc8ZycsL+76fXH+B1rsf1uhaCr4ud6eE2TGrnBi4mvcKXw5wRj3Xmia0KizO6qmesTdpnLPuPq2g0ojjrIDkt3Wr4BJoUEb9V3reUQSBjfRxz6qLmKe1TokjfF WlhgDafyDVqF2QzAACDM+dN+yBmoOa0X7gVZzCrANNlvUdGmYAzHUUFyUAAKzObsgnCAXaLOfKwDMGFQAAAHaHkAB9ugiRBxlIAbSLTy3IDWuW0juhDJuMtnXc1VLSnd7cOyFuKQBI8AA="}, {"id": "reg-fda-individualized-gene-therapy-guidance", "cat": "reg", "title": "FDA, 환자 맞춤형 유전자치료제 ‘개별화 특성공간(IFS)’ 초안 지침 공개… 범위 내 신규 변이는 추가 임상 없이 BLA에 추가, CMS는 CGT 접근 모델 확대", "short": "맞춤 유전자치료 지침", "alt": "조금씩 모양이 다른 여러 열쇠가 하나의 열쇠고리에 달려 같은 자물쇠에 맞는 미니멀 일러스트", "date": "2026-10-27", "scope": "글로벌", "entity": "미국 FDA(CBER)·CMS", "what_changed": "FDA가 27일(미국 시간) 희귀질환용 환자 맞춤형 유전자치료제의 BLA 제출과 승인 후 관리에 관한 초안 지침을 공개했습니다. 핵심은 ‘개별화 특성공간(Individualized Feature Space)’입니다. 제품이 환자마다 달라질 수 있는 범위를 미리 정해 두고, 새 변이가 그 범위 안에 있으면서 분석 시험으로 안전성과 활성이 확인되면 추가 임상시험 없이 기존 BLA에 넣을 수 있게 합니다. 같은 주에 CMS는 메디케이드 ‘세포·유전자치료(CGT) 접근 모델’을 겸상적혈구병 이외 질환으로 넓히겠다고 밝혔고, 수개월 안에 제조사 신청요청서(RFA)를 낼 예정입니다.", "why_matters": "같은 유전자의 여러 변이를 겨냥하는 염기·프라임 편집 치료제가 하나의 허가로 적응 범위를 넓힐 수 있는 규제 경로가 구체화됐습니다. 지불 측면의 성과 기반 모델도 함께 넓어지면서 초희귀질환 치료제의 허가와 보험 접근이 동시에 앞당겨질 수 있습니다.", "strategy": "국내 유전자편집·RNA 치료제 개발사는 첫 BLA 단계부터 IFS 범위를 설계하는 전략을 검토할 만합니다. 초안 지침의 의견수렴 일정과 CMS RFA 공개 시점을 추적하고, 식약처 제도와 차이를 비교할 필요가 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.biopharmadive.com/news/fda-personalized-gene-therapy-rare-disease-guidance/873004/", "verified": "원문을 직접 확인했습니다(초안 지침 발표, 신규 변이 추가 구조, CMS 프로그램 확대 계획)."}, {"url": "https://www.biospace.com/fda/new-fda-draft-guidance-doubles-down-on-expediting-approvals-of-personalized-gene-therapies", "verified": "원문을 직접 확인했습니다(IFS 개념, CMS RFA 수개월 내 계획)."}, {"url": "https://www.hhs.gov/press-room/fda-cms-advance-gene-therapies-rare-diseases-patient-access.html", "verified": "검색 결과 스니펫만 확인했습니다(본문 열람 시 403 오류)."}], "verification_note": "FDA 초안 지침 원문과 정식 제목은 직접 확인하지 못했고 전문지 보도 2건에 근거합니다. CMS 확대 대상 질환과 시행 일정은 확인되지 않았습니다.", "image_concept": "A single master key ring holding many slightly different keys that all fit the same lock.", "img": "data:image/webp;base64,UklGRghfAABXRUJQVlA4IPxeAABQWQKdASqwBCADPpFIoUwlpCcoIjOo6QASCWdu4TSN83fb0xF/3 억파운드(10%), 호흡기·면역·염증 11억파운드(21%), 항암 6억파운드(23%)가 성장을 이끌었습니다. 백신은 26억파운드로 2% 줄었고 싱그릭스는 7억8,000만파운드로 5% 감소했습니다. 핵심 주당순이익은 54.6펜스로 1% 늘었지만 총 주당순이익은 38.5펜스로 21% 줄었습니다. ‘Accelerate Growth’ 프로그램 관련 구조조정 비용 3억2,800만파운드가 발생했기 때문입니다. 2026년 가이던스(매출 3~5%, 핵심 영업이익 7~9%, 핵심 EPS 7~9% 증가)는 유지했습니다.", "why_matters": "스페셜티 부문의 두 자릿수 성장이 백신 부진을 상쇄하는 구조가 굳어지고 있습니다. 다만 구조조정 비용이 커졌고, 시장 반응을 다룬 기사는 개장 전 주가가 6% 넘게 떨어졌다고 전했습니다.", "strategy": "구조조정과 대형 인수를 함께 추진하고 있습니다. 3분기 재무제표에는 누발렌트, RAPT, 35Pharma 인수 비용이 반영됐습니다. 회사는 2026년에 임상 3상 22건을 개시할 계획이며 현재까지 18건을 시작했습니다.", "evidence_type": "공시", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001131399/000165495426009181/a6993a.htm", "verified": "원문을 직접 확인했습니다(SEC 6-K 실적 발표문)."}, {"url": "https://www.investing.com/news/transcripts/earnings-call-transcript-gsk-beats-q3-2026-estimates-shares-fall-premarket-93CH-4979491", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "실적 수치, 가이던스, 구조조정 비용, 인수 비용은 SEC 6-K 원문으로 확인했습니다. 개장 전 주가 하락과 컨센서스 상회는 스니펫에만 근거했습니다.", "image_concept": "A balance scale with a heavy rising stack of coins on one side and a small melting ice cube on the other.", "img": "data:image/webp;base64,UklGRhxCAABXRUJQVlA4IBBCAACw1gGdASqwBCADPpFIokylpKcloZHoqOASCWlu9/PTKIqfgfgMOBPwmeV9WYXZ955mvKPpP/n1MMtXwPPH+n75vqS8q70IerH+n9FN6et7L3cDJ1fPf+t9Gnmh/O8VbG74Dwd7JH994R/NnUO/Lf6b/h/UGh08/fzPQR9evrv7EeuVNi+1tQT/K+l3iUUC/KI/1PNL+kf7H1Qv8aFLSRjxGkjHiNJWYXt7Njx1b8eXmHJD1E0kZXJK3x5YJ8kPYoV5JW+PK/nTlSt8+PODoN5avH6YHoWYVIbrmbc5OTjGndWMRulh6R4/cqVvnx5w1bx5/48Fm6Yjl6AqU88tYx4xxo9dayxNJGPEbC8tYx4jSRj2nTxicmDRb+n/9/pWbYz0LePp+VKiMb43UJVjHiUlUXJK3x5Xm6TlkmOA9RNJQWlR5TulccgSQU9Ekh6iRw+omkjHiNJGPEmr98GaDABV1WM0eHymvf2EoMwbyL9KrfHlebpIx4jSRjxGkjHkHajw1O1CWXVZE0EwNjvSzndRDToBAv8Kv2YBLK83SRjxGkjHiI4f189xZh0rg3I0VMZsieA0X2CIgsdLWPE+lb48rzdJGPEaSMeI2G+mR6PtPY4hZNlhlCVJvAdsZTxiTA3SRjxGZnD5C6SMeI0kY8RpIyE6pvVZk/qxYWCl/Q8jCCkweZC+Fjh9RI4fUTSRjxGkjHiNJGPEaSOPnJLWnUIr4HaIJbMMiY4CRgbpIx4jSRjxGkjHiNJGPEaSMeIzN8jeW8OdFHNpXz6iRw+omjqPzQ8tYx4WHxt 일러스트", "date": "2026-10-28", "scope": "글로벌", "entity": "Astellas Pharma(아스텔라스), Audax Biosciences(오댁스)", "what_changed": "아스텔라스는 오댁스의 전임상 단계 면역항암 후보물질 DAX-044에 대해 독점 옵션 및 라이선스 계약을 맺었습니다. 옵션을 행사하면 글로벌 개발·상업화 권리가 아스텔라스로 넘어갑니다. 오댁스는 선급금과 향후 옵션 행사금으로 합계 2억8,500만달러를 받으며, 두 금액의 비율은 공개하지 않았습니다. 여기에 개발·상업화 마일스톤 최대 10억5,000만달러와 두 자릿수 단계별 로열티가 추가됩니다. 오댁스는 임상 1상 개시(2027년 예상) 전까지 개발 비용을 부담하고, 호주·뉴질랜드에서는 공동 투자와 공동 판촉을 선택할 수 있습니다.", "why_matters": "IL-12는 전신 독성 때문에 개발이 번번이 막혔던 사이토카인입니다. 종양 주변에 활성을 집중시키는 설계에 빅파마가 전임상 단계부터 큰 금액을 걸었다는 점이 의미가 있습니다. 위험을 옵션 구조로 나눠 지는 초기 자산 거래가 늘고 있음을 보여줍니다.", "strategy": "아스텔라스는 회사 전체를 사들이는 대신 옵션 구조로 초기 면역항암 자산을 확보해 임상 진입 전 위험은 파트너에게 맡겼습니다. 오댁스는 1상 진입 자금을 확보하면서 호주·뉴질랜드 권리를 지켰습니다.", "evidence_type": "거래-옵션", "sources": [{"url": "https://www.prnewswire.com/news-releases/astellas-and-audax-biosciences-enter-exclusive-option-and-license-agreement-for-dax-044-a-novel-immune-targeted-il-12-antibody-cytokine-fusion-for-immuno-oncology-302920594.html", "verified": "원문을 직접 확인했습니다(공식 보도자료)."}, {"url": "https://newsroom.astellas.com/2026-10-28-astellas-and-audax-biosciences-enter-exclusive-option-and-license-agreement-for-dax-044-a-novel-immune-targeted-il-12-antibody-cytokine-fusion-for-immuno-oncology", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "보도자료는 미국 동부시간 27일 저녁에 게시돼 한국·일본 시간으로는 28일 오전이어서 28일로 표기했습니다. 선급금 단독 금액은 공개되지 않았고, 옵션 행사에는 반독점 승인 등 통상적인 조건이 붙습니다.", "image_concept": "A single key resting on a closed velvet ring box, waiting to be turned.", "img": "data:image/webp;base64,UklGRtJXAABXRUJQVlA4IMZXAABwPAKdASqwBCADPpFIn0ylpCKrIjPoyWASCWlu12OIf/7xsfad9Fkx68cnSCo4ehn+pziPC4ABgH+Y2VGz5v55WbNz8PMUPBoRgmB0aYnmyfLCjX1Pxk/M/83wF/O/z//d/uvay/2M9fyP/n47f7Bnf/6/D39j/1OU4/y8KIcH/n0J/+PTr5GX83oc//bz4fsH/sDXnm5HtcRIn5PyflAzmc2Fh05zNlUJ6SJ+T8qhkKGCXrDc6jKjh1XDPyZeXbXOgsx6s6OKyFxN6xR0uSgcIffVOrYk28l1saSN3lPNk7WyHoL4M3hGSj/IWKwtq/N4PTyxNcUErP71axOg0S14ptIGTaS27Wt3wEEweOh6+TS4fT4ulOVY4NLCKoqBjtNZGb8d6PQg0lh0QGzvY+/SMXkKtDfmobAVz49ePEei+kPkLuH9IoeJ9N7 로는 매출이 4.1%, 영업이익이 21.3% 늘었습니다. 솔리리스 바이오시밀러 SB12와 스텔라라 바이오시밀러 SB17의 글로벌 판매 증가가 성장을 이끌었습니다. 1~3분기 누적 매출은 1조2,893억원, 영업이익은 3,632억원입니다. 지주사 삼성에피스홀딩스의 연결 영업이익은 PPA 상각 등 비현금성 조정으로 1,050억원이었습니다.", "why_matters": "지주사 분할 이후 첫 분기 실적 시즌에서 일회성 수익보다 제품 판매 수익성이 개선된 점이 확인됐습니다. 누적 영업이익이 이미 작년 연간의 97%에 이르러 연간 최대 이익이 유력해졌습니다.", "strategy": "출시 제품 11종을 기반으로 후속 바이오시밀러 9종을 개발하고 있습니다. 키트루다 바이오시밀러 SB27은 8월 국내 허가를 신청했고, 10월 초에는 테바와 미국·유럽용 신규 바이오시밀러 2종의 파트너십을 맺어 판로를 넓히고 있습니다.", "evidence_type": "공시", "sources": [{"url": "https://www.pharmnews.com/news/articleView.html?idxno=307386", "verified": "원문을 직접 확인했습니다(언론 기사)."}, {"url": "https://www.ajunews.com/view/20261028155550921", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "수치는 팜뉴스 기사 원문으로 확인했으며 DART 공시 원문은 열람하지 못했습니다. 자회사(1,326억원)와 지주사(1,050억원) 수치가 다르므로 구분해 인용해야 합니다.", "image_concept": "A row of identical glass vials where the newest one glows slightly brighter than the rest.", "img": "data:image/webp;base64,UklGRt41AABXRUJQVlA4INI1AABQwAGdASqwBCADPpFIoUylpC4oIPMIycASCWlu+yEwcVGul3gOfB5WwWnY95y0mlG0R09/I+2qw75b37/P95L+tv///b2NtHnwnGTw3///bveRDocrzJ9fX//5O3un0O0Iccf0+2Z354BGJDxJ/Q9Cb3L0I8Q/7no277yRr1kf9jz6DDNHGLmrT456AKQJCMRYm28XNWmvcy014HtLeB0RIwoURr/SgPlLVB+8QY/VOyN24f2Szp0MaB+psM/9VN0K94MCZYKIE0JV94Xe7xBaa+/9NKctI2AZkGEGSFTQPUGID1whc1a7g9VKmOcJrM2KT65IxcDJJKN+wgPUTiOgJHy015NsrTTy07I1kJ9N7PASMjVS5sgPLTERq2f71nm6F+28D1NPUkKkpTi9OIzEOsdrJJQU9TXv9pn7BI7W2YNDPS7wXOPtxo0yfpP8GllToHyVj2mrzLQPXCF3YRnZd6l9Tb9tMbJQOkbWRBYAJ4VzIyNpJ6SGuVvBoo2vA81WMfZG84lA751F6O3Gl27JqDNNjl/sqt28YmvA2ID1l9ejJHypf8UOU2IGi79foh47lsLbTn/pXv2r6Jo4xtmEB6gxAeomYfqJGy+wnA88KQ9UMmA8SeTNeHzogPLXe5nMSCYmjjGk1NNbYhNeHWuvtuw/bbjdTYZ+evNYZL5A00EwiaSHA6R49hXZKXIISdBEqgj+I0chpvbQTsZ0eWqZS1dsxZgVPcUJ3AuOoTfq7+PulsaRhM+r9oJIx24C+Bn5r7GbzGLmrZ1OX5JRv9Uy2zcyo7eBWMVJ1yd30R3yjlghmgCUB7b//RTnQfploXafSloHtEG+JULN3cwPOt/9U3dGNkoK/EZfmRmSl2Qnln2TRaaOM9PaHsQdTSLU31XnT38oIp9r0VsswJYEk12Ho4rZfz2geoMkK2Q8Kp9ygVbb351x4GjqvVYlMRsGfGY99jpDxQuayHGK9/msvxGjeasHWap4RBjFTenFoxl4WwH 합병, 자산 매각, 청산 등 전략적 대안을 검토합니다. 9월 말 기준 현금성 자산은 약 3억1,910만달러(잠정)입니다. 국내에서는 28일 지씨셀 주가가 장중 급락했습니다.", "why_matters": "지씨셀이 2019년 원천기술을 기술수출한 대표 파이프라인입니다. 계약상 최대 7,700만달러의 마일스톤과 로열티가 걸려 있었지만 실제로 받은 금액은 없는 것으로 보도됐습니다. GC그룹은 아티바 지분 약 12.3%를 갖고 있어 지분 가치 하락도 피하기 어렵습니다. 동종 NK세포로 자가면역질환을 치료하려던 시도가 꺾였다는 점에서 세포치료제 업계 전반에도 부정적인 신호입니다.", "strategy": "지씨셀은 질환과 개발 전략이 다른 자체 CAR-NK 파이프라인이 있어 영향이 제한적이라는 입장입니다. 아티바는 3억달러대 현금을 바탕으로 역합병이나 청산 등 현금 가치를 회수하는 방안을 모색하고 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001817241/000119312526432806/d102135dex991.htm", "verified": "원문을 직접 확인했습니다(아티바 SEC 8-K 첨부 보도자료)."}, {"url": "https://www.medipana.com/news/articleView.html?idxno=420249", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}, {"url": "https://www.thebionews.net/news/articleView.html?idxno=29558", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "개발 중단 사유, 사망 2건의 경위, 인력 감축률, 현금, 자문사는 아티바 SEC 원문으로 확인했습니다. GC그룹 지분율, 최대 7,700만달러 마일스톤과 수령액, 28일 주가 급락은 국내 언론 스니펫에만 근거했으며 지씨셀 공시 원문은 확인하지 못했습니다.", "image_concept": "A cracked glass petri dish lying empty on a dark laboratory bench.", "img": "data:image/webp;base64,UklGRuJPAABXRUJQVlA4INZPAACwAQKdASqwBCADPpFGn0ylo6atoXNY4bASCWlLTrQ+f//+gf9F//Gx4k+CxXdn50h5Qtfr8J7y4nb6GG32Hho+n/5fpMf8DwEvB/832DPMYzZXCPNmaLtB2lRX/TvnDWD5sSNppKP15z9R+sGxH/D+CvZD/w/CP5v6iP5Z/WfOn/G/J3y3dt/5v7Sewp78fYPQ4/A9AP7X/UewH/kfTr/O+Jn6R+yvwDf0L+5ejrpM+tPYZ/oPVU9MANttMjLgjUPvEmJMSYkxJiTEmJMSYkxJiTEmJMSYkxJiTEsHZJiRS+8PxfpgdDpskHCaDIH+6hMxLUH0qgL9MwSszF4kxLj9VG2BIBqGBIY5/VdUZGXAToxIf+xTWzDqr8BBeKsZGXBGofeJuE52bs3ZuzZbE3DWzdnWDWvAp7qeWU/ZAp21ATR89fjbasJBpkZcEm9fLTfS9PnDvEl4mUaZVZsYeXsnHa193Lu1j+ynCWp993RAmYgSgUFCdrTA702U2zu4buYdoaiLMSYk6lAD5sYeYANhSJv9YcltTjeAM/BesqYiEGkX5Dv81D7xqdNQUgS0sE7aZfTCmLM9L6p7R4GTPJLS0XffEXs3Zuzdm7N3N+Cup4SUkfCnwvaKU8pUMTklFhFyfKrkTMkKP9NsRfQchu9u3ji4i1hLAJwx6lOOidKd3AQQuTqCP0qrfmLyDaZF9cjLhALsS9IMUbWG6eOoX17JTmpzj+smRlwQmRzyLLgxylLPaw/NF4jaCaJab6XqLJfLqzcXYlFOP0DtVUuRbj7L7CQOImExDVS1BxLTftjsEKZ const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
