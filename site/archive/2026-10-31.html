:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* synthesis */
.syn{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.syn{grid-template-columns:repeat(3,1fr);gap:0}.syn>div{padding:0 22px}.syn>div:first-child{padding-left:0}.syn>div:last-child{padding-right:0}.syn>div+div{border-left:1px solid var(--rule)}}
.syn h3{font-size:18px;margin:0 0 10px;font-weight:850;letter-spacing:-.02em}
.syn ol{margin:0;padding:0;list-style:none;counter-reset:n}
.syn li{counter-increment:n;padding:10px 0 10px 30px;border-top:1px solid var(--rule);position:relative;font-size:13.5px;color:var(--ink-2)}
.syn li:before{content:counter(n);position:absolute;left:0;top:10px;font-weight:900;color:var(--blue);font-size:15px}
.syn li b{display:block;color:var(--ink);font-size:14px;line-height:1.4;margin-bottom:2px}
.syn .refs{font-size:12px;color:var(--muted);margin-top:4px}
.syn .refs a{color:var(--blue)}
.syn .refs a:hover{text-decoration:underline}

/* inner pages */
.page{padding:26px 16px 0}
@media(min-width:768px){.page{padding:30px 28px 0}}
.ph{text-align:center;margin-bottom:18px}
.ph h1{font-size:clamp(24px,3.4vw,34px);margin:6px 0 4px;font-weight:900;letter-spacing:-.035em}
.ph p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}
.chip{border:1px solid var(--rule-2);background:var(--paper);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
mark{background:var(--mark);color:inherit}

/* article */
.post{max-width:780px;margin:0 auto}
.post .head{text-align:center}
.post h1{font-size:clamp(26px,4vw,40px);line-height:1.22;margin:10px 0 12px;font-weight:900;letter-spacing:-.04em}
.post .by{font-size:12.5px;color:var(--muted);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.post .by b{color:var(--ink);font-weight:600}
.post .cover{margin:22px -16px 6px;aspect-ratio:3/2}
@media(min-width:820px){.post .cover{margin:24px -60px 6px}}
.post .cap{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:22px}

 영상 판독을 보조 수단으로 쓰고 있으며, 척추와 요로결석으로 넓힐 계획입니다. 2026~2028 AX 실행계획에는 2027년 EMR 요약·심사기준 조회 AI, 2028년 이후 전산심사와 이의신청 적용 방안이 담겼습니다. AI 판독과 심사자 판단의 일치 건수, 오판독 사례, 누적 적용 건수는 집계되지 않았습니다. 심평원은 현재 이의신청에는 AI 판독을 적용하지 않는다고 밝혔습니다.", "why_matters": "국내 공적 심사기구가 AI를 심사 과정에 단계적으로 넣는 구상이어서 병원 청구 실무에 미치는 영향이 큽니다. 그런데도 성능을 사후에 검증할 건별 대조 자료가 없습니다. 심평원은 AI가 급여 인정 판단을 보조하는 수단에 가깝다고 설명했지만, 백종헌 의원은 10월 16일 국정감사에서 사람의 판단과 검증이 어느 단계에서 이뤄지는지 명확해야 한다고 지적했습니다.", "strategy": "요양기관은 무릎, 척추, 요로결석 청구 건의 영상 품질과 기록 근거를 미리 점검할 필요가 있습니다. 의료 AI 기업에는 심사와 청구 사전점검이 새 수요가 될 수 있으나, 일치율과 오판독을 추적하는 기능이 요구될 수 있습니다. 이 전략 판단은 보도 내용을 바탕으로 한 분석입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3044085", "verified": "청년의사 기사 원문을 직접 확인했습니다. 심평원 실행계획 원문은 열람하지 못했습니다."}], "verification_note": "심평원의 신규 공식 발표가 아니라 언론이 심평원 답변과 내부 계획을 정리한 단독 보도입니다. 날짜는 기사 입력일이며 AI 활용 자체는 2026년 9월에 시작됐습니다. 2027년 이후 내용은 계획 단계이고 이의신청 적용은 방안 수준입니다.", "image_concept": "A brass balance scale with a small glowing lens resting on one pan, weighing a single knee joint model.", "img": "data:image/webp;base64,UklGRnRHAABXRUJQVlA4IGhHAACw2gGdASqwBCADPpFIokylpDWoIRQokrASCWlu3ONqxDFlm+ux7/L7pXI13T9778OoTnx7Tvx6SOM/9PjEsYn/vJV0V2l9/sdO7cef/3rFHyLNd923vGAw/jjHstf+kb/Pekt6ZvT3zwfqA/sO/M9Ft62n+7yZb4P/8vSnZ6+Q/df7HmfxLPm36L/if4vjf+V+oR7j85iIn0l+69A72w+/+gN8p/1vSL7H/9z3Av5//Sv9f5YPiL/Yv+H7AX83/t37Wey1onet/Yb/oH+NCJ6VkErtcJdPHG5tp43KwRKc8blYIlnwGmO7ickpz5Pa8wrzCsESnPHUYAqWINfKz2q4wtdKRGALpx1E6P9bIvkaeEqBnu9jAMMFgjJdEJbP9FthaCtAwkTvb8nLKGAohOdikdIWbvJX6KlokO1PL6P7yiPN0Z83RzMb9PcmUpnngn9nCs2YzjtY3ANV083zuFhmtFhayfvnXYseZ9FH+7eF4JTo0dtFDck+easHwDE8NpHFgBYEKeoLpx1EJQW/B2Hy6geW8boqWov7b/nfvG35KLRK3AOxlUr+h06ZGztZURMtAEtDgrv0KpfU/s/Mk0N+56YkGebI6U156cDkv6Y+bgL1FQBP9p8jzEw/YoJlW3kxDfIAczN6TRBHBoj6NysEX/9PG5vCOTP8pVJkXDqeQBQI6iUxaGv3ambQs8ZvrBW4knydCqpnbteR9EwIuXjY5cZrkdbewrIIxM9SHDI7ufsjhjPAx8c/PQH/bSi/0dtKgZ4fZ5GC5Sk2ztdIAUfaJGVM78QfsbXfh9ufmH3MhYC7JbYLic7KY5nhROIsLQyoMsAP9eA7RTiWNRU2z9uflz5FeL08/IdqAV22nqaHCzK  등 19개 항목을 분석하는 AITRICS-VC를 도입했다고 밝혔습니다. 중환자실의 급격한 상태 변화와 사망 위험을 예측해 고위험 환자의 대응 우선순위를 정하는 데 활용합니다.", "why_matters": "EMR 기반 악화 예측 AI가 해외 판매 허가 뒤 현지 임상 근거를 쌓는 단계로 넘어가는 사례입니다. 회사는 지난해 홍콩 의료기기 허가를 발표했고 올해 5월 현지 법인을 세웠습니다. 일산백병원 사례는 영상 판독 중심이던 국내 의료 AI가 병동과 중환자 관리로 넓어지는 흐름을 보여 주지만, 도입 사실일 뿐 임상 성과를 보여 주지는 않습니다.", "strategy": "국내 의료 AI 기업은 허가에 그치지 않고 현지 전향 근거를 함께 확보하는 경로를 참고할 만합니다. 투자자는 MOU를 매출로 보지 말고 유상 계약 전환과 전향 연구 결과를 확인해야 합니다. 병원은 예측 성능을 자체 환자군에서 다시 검증하고, 경보 뒤의 담당자, 대응 시간, 경보 피로 조정까지 함께 평가해야 합니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.medicaltimes.com/Main/News/NewsView.html?ID=1171514", "verified": "메디칼타임즈 기사 원문을 직접 확인했습니다. 회사 보도자료 원문은 열람하지 못했습니다."}, {"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3044164", "verified": "청년의사 기사 원문을 직접 확인했습니다."}, {"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3044151", "verified": "경보 대응 절차를 다룬 칼럼 원문을 직접 확인했습니다."}], "verification_note": "날짜는 기사 게재일이며 MOU 체결일은 확인하지 못했습니다. MOU는 구속력 있는 공급 계약으로 확인되지 않았고 금액도 공개되지 않았습니다. 일산백병원의 도입 시점, 비용, 적용 병상 수, 예측 성능은 기사에 없습니다.", "image_concept": "A small brass early-warning bell mounted on a hospital bed rail with its clapper just beginning to swing.", "img": "data:image/webp;base64,UklGRj4rAABXRUJQVlA4IDIrAAAQkQGdASqwBCADPpFIokylpCqloPJYoVASCWlu/6W5CdYR0HyXAde47zQVSND46Sm6sr6w9Pk5JyCo0LQZc7g+seTjzfx4ZScG9H66clwfxLWz8GdOfiCyEeknpjkyoIwxXrXdEv+tU2FALcy8z8PiJvMwP15lPmCNCYy66bzLzPtzPtzPt3CT4/dD+XPoDiMaKmd03mXuBGl2zOzF1MMl764KVUC+lAu51Ze+jDhLri1fuEk2J8qdxGt6FJe4GMFcX080/XsTZ5lylni0t6ywc3pIBARl5swxXimEBF46s/McmhMU4XdDrJuk8tXThWrGobMPT3Dhk+3NWCa/zVuvh3ovGL5A5RVs0ajqv/3QWXo4WkeKk6y8fQUZEyHO6gyl00K3LXzE/YyDGq81BWzgNPSK0GUyhq995n1/XXxC0dJ+69gj775L3/7CSzobh8jxNks7tpzYObmTxUSoIuxLa/dYfQ5xp34GyVAyE3vN7D+Ahco7jATQDm+PJGS2gjmgK6bBzehjVtAjzwwQz9Wh/JFuYGgpHxawqf3uXmuRYNH20qBbmXmj2P+XOEsamgKvQMLM/NxtoAauLpwEsSsxddN5l6x3vBOahJPqiTBSOWrBXzL7GVNCtkEP06V8ooorjMMPC5hAliJnUCP+CxQvexd+2LjVnBK4s9aICAjMYLd4rpv8PaWjhMbjxLqWlS0rp2PhI098Bk+46zPtzPuOsz1s83sa3yungX+GT7dYRUtxJd id": "ai-fda-cms-state-sandbox", "cat": "ai", "title": "미국 FDA·CMS, 주정부 임상 AI 실험 확산에 규제 충돌 막기 분주… 스탯 ‘감독 없는 AI 임상 업무는 FDA 관할 가능성’", "short": "FDA·CMS 주별 AI 조율", "alt": "작은 종이 한 장 위를 맞물린 고무도장 두 개가 함께 누르는 미니멀 일러스트", "date": "2026-10-30", "scope": "글로벌", "entity": "미국 FDA, CMS, 주정부", "what_changed": "스탯(STAT)은 임상 업무를 수행하는 AI를 시험하려는 주가 늘면서 연방과 주의 관할 중복이 도입을 지연시킬 수 있다는 우려가 있고, 보건 당국자들이 물밑에서 이 문제를 다뤄 왔다고 보도했습니다. 주는 의료행위와 의료인 면허를, FDA는 의료기기를 규제하며, 사람의 감독 없이 임상 업무를 수행하는 AI는 FDA 관할에 놓일 가능성이 크다고 전했습니다.", "why_matters": "주정부 샌드박스에서 허용받아도 연방 규제가 별도로 적용될 수 있다는 점이 쟁점입니다. 유타주는 10월 5일 샌드박스 임상 파일럿 3건을 추가한 것으로 전해져, 이런 충돌이 실제 과제로 다가오고 있습니다.", "strategy": "자율형 임상 AI를 준비하는 기업은 주 샌드박스 승인만으로 사업 경로를 확정하지 말고, 제품이 FDA 의료기기에 해당하는지를 함께 검토해야 합니다. 국내 기업이 미국 진출을 설계할 때도 주별 실험과 FDA 인허가를 별개 트랙으로 관리하는 편이 안전합니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.statnews.com/2026/10/30/fda-cms-health-ai-regulation-state-sandboxes-run-into-federal-rules/", "verified": "유료 기사로, 공개된 도입부만 확인했습니다(본문 미열람)."}, {"url": "https://www.hklaw.com/en/insights/publications/2026/10/utah-expands-oaips-pro-human-ai-initiative", "verified": "검색 결과 스니펫만 확인(본문 미열람)했습니다."}], "verification_note": "미확인 출처: 두 출처 모두 본문을 열람하지 못했습니다. FDA나 CMS의 공식 발표가 아니라 언론 보도이며, 공개 부분에는 구체적인 주 이름, CMS의 조치, 당국자 직접 인용이 없습니다. 유타 사례는 로펌 자료 스니펫에서 가져왔습니다. 연방과 유타주 간 공식 조율 합의는 찾지 못했습니다.", "image_concept": "Two interlocking rubber stamps pressing down on the same small square of paper.", "img": "data:image/webp;base64,UklGRshAAABXRUJQVlA4ILxAAAAw8QGdASqwBCADPpFIoEylpCatofJoubASCWlu16l//yGmVHOXr8yybdcD7rZe2gOHN7cLNA7FY5/v/X9EH6x2dgzyh2De8Gle96MR9dX1x7g7zN+cTY2+TZTFupdrf209OrSv3sY9+c7ut4BdcH5CgC/0X+/eb1Ow+69B/pj5B53/wvkJJ0s1+WJAaebrAkHzJAadYEgJASAkBIDTrD5kgJASAlWayHzJDHRASdh/eaaZL8S1ZYQEgJDEgQWzfLE+Oq/9q7GCTpZtWGOce/xhGcv+mRs4DntTiYdZWYS1l9MU3+e458JWQRmYPwNhswYwyKtMhGOcc5FzI2kf6pEC6WH6SAc451DwFMr+XOFhjxRkZahXmMJDHP52VcYkCBkIZzunWBdUBASdh/eHOLveHOcAgXjsNH6aWbXM09Kw2jSlU123za6XHiRg4jEItx9pwYHvsRltadtMjOu7Rk9SzLYQ/iWXU7aZGWzIRj7U3pZr/WioIF4he2u ,720만유로로, 순손실은 920만유로에서 2,690만유로로 커졌습니다. iCRO 3분기 매출은 670만유로로 14.4% 늘었고, 9월 말 수주잔고는 사상 최대인 9,090만유로입니다. 회사는 eyonis의 첫 매출을 2027년 상반기로 예상합니다.", "why_matters": "2026년 2월 FDA 510(k)를 받은 영상 AI도 미국 판매 조직을 먼저 구축해야 해, 허가와 매출 사이에 1년 이상의 시차가 생기는 사례입니다. 다만 손실 확대에는 주식보상 860만유로와 유럽투자은행 워런트 평가 관련 750만유로 등 비현금 항목이 크게 포함돼 있어 구분해서 봐야 합니다.", "strategy": "미국 진출을 추진하는 국내 영상 AI 기업에는 허가 이후 상업화 비용과 매출 시점을 함께 가늠할 비교 사례가 됩니다. Median은 iCRO 현금흐름으로 제품 상업화 기간을 버티는 구조이므로, 제품 매출이 전망대로 시작되는지 추적할 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.auntminnie.com/clinical-news/ct/news/16050493/medians-revenue-climbs-as-eyonis-rollout-raises-costs", "verified": "오민트미니 기사 원문을 직접 확인했습니다."}, {"url": "https://secure.businesswire.com/news/home/20260722597303/en/Median-Technologies-Reports-Record-iCRO-Backlog-Accelerates-Commercial-Rollout-of-eyonis-LCS-and-Development-of-New-Indications-Across-the-eyonis-Portfolio", "verified": "7월 22일 회사 보도자료를 검색 결과 스니펫으로만 확인했습니다(본문 미열람)."}], "verification_note": "10월 실적 보도자료 원문은 찾지 못했고 수치는 오민트미니 보도에 의존합니다. 날짜는 보도일이며 회사 발표일은 다를 수 있습니다. 상반기 매출 1,180만유로는 7월 자료에도 있었고, 손익 수치와 3분기 매출, 9월 말 수주잔고가 이번에 새로 확인된 내용입니다. 2025년 상반기 매출은 보도에 1,140만유로, 7월 자료 스니펫에 1,130만유로로 달라 증가율도 4%와 4.4%로 차이가 납니다.", "image_concept": "A single lung-shaped seed sprouting from a stack of coins that leans slightly to one side.", "img": "data:image/webp;base64,UklGRqA4AABXRUJQVlA4IJQ4AABQxAGdASqwBCADPpFIoUylpCMrIhJoWWASCWlu+77PGwZ/NzzlQ/e0R/wdIg/8yZ9C1pyivvIkOs1PlHEOKvefv3PmkfOd9P05f3jpBeor+g9FLeXXpr5M77q9D+SZ3FzTwbvLC+waM/QWoD/yr/J82sZja3M9ALLZ8XpLucbrZ8XmszuVuktXkBblhxsENop/1jvThNEsPPBE5cdxxeZY87kf+x2+JtyoUsPJvM9nimnB5fAN6Z5M8hPtytOyWTI2ddMcoRQvWiZ7NhB7GsRLz+OQUMnpBe7cromaEDtmP20gIUxycuYXfLr58fyFLHZ+oP0LOoFxsIO183ck8kOdmriAff+K3LQiBblXxURSPGE9BqmqNc6hk847GIbRsu6gVCuCym9OST1+3iC616yV96m9xGX4BK/T5C4ukDdNCtyuI8PbI3C3TwMdzacbrXuU9Rbw/USRk9AOXwdOV+ZcM0o2dJgs5Hxc9j7meicKTL1PGXNwEwkpIvGTWNIKyV/YvMscsPOSJ64iCpUUxnb/LuqJRID8Q18OH2uxAc2c9p/xXUjfyMep38nzZhEUx8rWL1hYVLDqnrMGSi/ZbAs88gBo/Mdtqy5T3iaJ 대면 반대", "alt": "화면이 꺼진 스마트폰 위에 신경 검사용 망치가 가로놓인 미니멀 일러스트", "date": "2026-10-30", "scope": "국내", "entity": "대한신경과의사회, 보건복지부", "what_changed": "새 진전은 10월 19일 입법예고 뒤 의협과 약사회에 이어 진료과 단체가 구체적 수정안을 낸 것입니다. 신경과의사회는 30일 성명에서 초진을 접근이 어렵거나 불가피한 경우로 제한하고, 진료·처방 이력 환자의 최대 30일 처방 규정을 삭제하라고 요구했습니다. 지역 제한 예외는 중증 등록장애인과 장기요양 1·2등급으로 줄이고, 정기 안전성 평가가 필요한 약물은 비대면 처방을 제한하라고 했습니다. 환자 별점이 플랫폼 순위와 검색 노출에 반영되지 않도록 해야 한다는 우려도 냈습니다.", "why_matters": "12월 24일 시행으로 보도된 비대면진료 제도화를 앞두고 반대 논리가 일반론에서 진료과별 안전 쟁점으로 구체화되고 있습니다. 치매·뇌전증 약물 처방 기준, 전화 진료 절차, 플랫폼 개인정보와 사고 책임까지 요구 범위에 포함됐습니다. 복지부의 최종안이 초진 범위와 처방일수를 얼마나 조정할지가 플랫폼 사업 모델을 좌우합니다.", "strategy": "플랫폼 기업은 초진 지역 제한과 처방일수가 강화되는 시나리오까지 수요를 따져 볼 필요가 있습니다. 별점과 노출 알고리즘, 피해구제, 개인정보 체계는 규제가 확정되기 전에 먼저 공개하는 편이 협상에 유리합니다. 입법예고 의견 기한은 11월 초입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3044171", "verified": "청년의사 기사 원문을 직접 확인했습니다. 신경과의사회 성명 원문은 열람하지 못했습니다."}, {"url": "https://www.mt.co.kr/thebio/2026/10/19/2026101915523060880", "verified": "10월 19일 의협 반발 맥락을 검색 결과 스니펫으로만 확인했습니다(본문 미열람)."}, {"url": "https://www.khan.co.kr/article/202610202132015/", "verified": "12월 시행 일정 맥락을 검색 결과 스니펫으로만 확인했습니다(본문 미열람)."}], "verification_note": "이해관계 단체의 주장이며 복지부의 수정 여부는 확인되지 않았습니다. 의견 기한은 검색 요약 기준으로 시행령 11월 2일, 시행규칙 11월 9일이며 입법예고 공고 원문은 확인하지 못했습니다. 30일 처방 대상을 자료마다 다르게 표현하고 있어 신경과의사회 기사 표현을 따랐습니다.", "image_concept": "A reflex hammer lying across a smartphone with a blank dark screen on a plain table.", "img": "data:image/webp;base64,UklGRlYxAABXRUJQVlA4IEoxAAAQvwGdASqwBCADPpFIoUylpC4rIZVIacASCWlu3OHpr5lnlk3J+MyXVOU9t/8G2T8ktk8o/5Ob6rbfS4pwbkDySEMdc9cbg67kKex+G//T0lNGfFh8Rk80AiBXVtaH+I3+H6gHnh3zJlfRTqFfzoId05AC/VrqQpJR/n/z9a6kKFWz2vWupCklH7AjCkFBko/z/5+tdSo/2pVrFy0MDbX+Wwu8+klIJFJfniDaBLd4unHzMGvln8qt7EMf+qqutSgCwllnzBKidsfpoJR6UwN7GfmWSsEWn22chPBRAV/VPVwRMR95LOluP8s4TBrjovDYo93KzzGYKOYPrKxSL90vC6atqUmdeGetUfjwcGSkBzMbdR90xipWeadXvONBHzvdg+Uang3UKSx7u0ttnVC+5UlgblKcUfwneKpYtz9a6D+V66lPNu/qwXgMTkAHJW4rEZ+s5XuFs3UkJk t": "FDA 첫 RRP DNA치료제", "alt": "목구멍 모양의 매끄러운 돌 아치 안에서 유리 바이알 하나가 은은하게 빛나는 미니멀 일러스트", "date": "2026-10-30", "scope": "글로벌", "entity": "미국 FDA, Inovio Pharmaceuticals", "what_changed": "FDA가 Inovio의 Voceryq(doruxapapogene ralaplasmid·lalikinogene sifuplasmid-gxfd)를 HPV 6·11형이 원인인 성인 재발성 호흡기 유두종증 치료제로 가속승인했습니다. FDA는 이를 이 계열 최초의 플라스미드 DNA 기반 면역치료제로 발표했습니다. 근거는 성인 32명 대상 공개·다기관 임상입니다. 기저 수술 이력이 3회 이상인 26명 중 7명(27%)이 투여 후 1년간 수술이 필요하지 않았습니다. 제품은 CELLECTRA 5PSP 장치로 근육 주사합니다.", "why_matters": "수술 빈도 감소라는 중간 임상 평가변수로 가속승인이 이뤄졌으므로, 희귀질환에서 소규모 단일군 자료가 승인 근거로 받아들여진 사례입니다. 다만 Inovio는 시판 후 임상으로 임상적 유익성을 확인해야 합니다.", "strategy": "DNA 백신·전기천공 플랫폼 기업은 이번 사례의 평가변수와 확증시험 조건을 벤치마크로 삼을 수 있습니다. 경쟁 개발사는 27%라는 무수술 비율을 비교 기준으로 검토할 필요가 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.fda.gov/news-events/press-announcements/fda-approves-first-plasmid-dna-based-immunotherapy-adults-recurrent-respiratory-papillomatosis", "verified": "FDA 보도자료 원문을 직접 확인했습니다."}], "verification_note": "승인 유형, 임상 수치, 지정 이력(혁신치료제·희귀의약품)은 FDA 보도자료 기준입니다. 약가와 출시 시점은 확인하지 못했고, 회사의 승인 보도자료도 찾지 못했습니다. 임상 수치는 비교군이 없는 공개 임상 결과입니다.", "image_concept": "A single glass vial glowing softly inside an open throat-shaped archway of smooth stone.", "img": "data:image/webp;base64,UklGRqBIAABXRUJQVlA4IJRIAABwLgKdASqwBCADPpFIoUwlpKqqonNYsVASCWlu1+NnO7UYJaW+nzaeNnnaWCHQ+Snsn8G2o8eWmmF1APNi7tbPfAf//rnzbqdvw+uB9jCdH0v96fPt7Ff/P+X3v/3P/b/sfaO/9rpH/qyJ8+f/p5B/uv/Lw9vGg7O24dLY3Tv7gztAEYm/6u1A5KUuuUXDbiPcFtphNJ+T8n9OGhU+RKSP6MgBxihSE0rDFCkcpOy2qXtXJGCXlDe1MWmIWrvYYfaGH0bAUgPQY8KnAHIUah/pVE/wchLJJpwwNRJTibgLDa2FsVdORAyJBx6Iv4G2TfGbv6re4ggNNRiJfUnFkKSVbWNWL+UCQKh9JHliyawgcgtkRCzs7+do0jdp+OwcD9I7MXvBnyR9pFR6gkRt1IiQOPNu5oJAzVVSNqelpLSpJchee9tbbVkOQok23wKqadOSnLcAQd+ZYcNOA5BDtAd/1AQEEgDdzBMeoYgAl0kVJZ3rQlnCdrPHAXs0+naXYKMtsw0Ew5uTL/MRqtUK3wXU6gQpamH1GZ8gzBstzKr0paBz/20GdnbAeASgPx/MGYArAw6qnQ+0Ol8961jM0TVWWt+1S8QDbZ+RUPy5lXVGMDQNYY1j1HLNwZV5Tp5Fp9lW3D8vgKnRZv6rwababOcZrA0tUJF/5mGNRlwPrQjZWEQ9St/ua4vhdzkgrDeNMj7DhvV6Kf3H59OOSihF Pb9GKuLy1B4XQfR83h/A+p/lqm8kAGPQvF1Su3aBloPDWuvMwAAA"}, {"id": "reg-estradiol-patch", "cat": "reg", "title": "FDA, 에스트라디올 경피 패치 3종 박스 경고 삭제… 2월 6개 제품 포함 폐경 호르몬 치료제 라벨 변경 9개로 늘고 OTC 전환도 검토", "short": "에스트라디올 패치 경고 삭제", "alt": "탁자 위 작은 패치 옆에 떼어 낸 검은 경고 띠가 놓인 미니멀 일러스트", "date": "2026-10-30", "scope": "글로벌", "entity": "미국 FDA·HHS", "what_changed": "FDA가 에스트라디올 경피 패치 3종에서 심혈관 위험, 유방암, 치매 가능성에 관한 박스 경고 삭제를 승인했습니다. 2월 비패치 제품 6종에 이은 조치로, Pink Sheet는 지난해 11월 지시에 따른 라벨 변경 제품이 9개가 됐다고 보도했습니다. 같은 매체는 FDA가 일반의약품(OTC) 전환 가능성도 살피고 있다고 전했습니다.", "why_matters": "자문위원회 없이 안전성 표시를 완화한 결정이어서 투명성 논란이 함께 제기됐습니다. 패치 수요가 공급을 앞질러 품귀가 이어지는 상황에서 나온 조치이므로 수요가 더 늘어날 가능성도 있습니다.", "strategy": "폐경 호르몬 치료제 제조사는 남은 제품의 라벨 변경 일정과 생산 능력을 함께 점검할 필요가 있습니다. 국내 업체와 규제 담당자는 식약처가 유사 조치를 검토할지 지켜볼 만합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.raps.org/resource/this-week-at-fda-new-conops-for-drug-inspections-ai-policy-proposal-and-more.html", "verified": "RAPS 주간 정리 원문에서 패치 3종 조치, 자문위 미개최, 품귀 맥락을 확인했습니다."}, {"url": "https://insights.citeline.com/pink-sheet/drug-safety/us-fda-strips-boxed-label-warnings-from-three-menopause-hormone-patches-eyes-otc-move-RKGXTBTFDND6FIIKV5XYAJBMUI/", "verified": "공개된 일부 본문만 확인했습니다(유료 기사로 본문이 잘려 있습니다)."}, {"url": "https://www.yahoo.com/news/us/articles/us-health-department-remove-broad-152222468.html", "verified": "검색 결과 스니펫만 확인(본문 미열람)했습니다."}], "verification_note": "FDA 원문은 찾지 못했고 언론 보도에 의존했습니다. Minivelle, Vivelle, Vivelle-Dot이라는 제품명은 일부 매체 보도일 뿐이며, Reuters 기사 스니펫에는 HHS가 제품명을 바로 확인해 주지 않았다고 되어 있어 제목에서 뺐습니다. 다른 경고 문구의 유지 여부는 확인하지 못했습니다. 수요 증가 가능성은 작성자의 추정입니다.", "image_concept": "A small adhesive patch resting on a table beside a black warning band that has been peeled away.", "img": "data:image/webp;base64,UklGRuokAABXRUJQVlA4IN4kAADwggGdASqwBCADPpFIoUylpC4rIVKYecASCWlu1+/P+wYwTe43K2f6Uv4H4SxFX7L8IdwG+a3No4z7fNZ2R8l3Vt7zqp9CqvfQDYiW/S7px38k/oj9OvDi/z88hpM1EemWE/pefrXUhSSl/P/n611IUkpfz/5+tdSFJKX8/+frXUhSSl/P/dFub7ikjdSFI4tqkpXrXUhWLj6Elxoh/misirLFyMdJI4N1IUW , Yimmugo, Gamunex 배치가 예방적으로 회수됐습니다.", "why_matters": "면역글로불린 검토는 원인이 밝혀지지 않은 상태에서 정맥·피하·근육 투여 전 제품으로 범위를 넓혔으므로 혈장분획제제 업계 전반에 자료 제출 부담이 생깁니다. Deanxit 재평가는 결과에 따라 유럽 내 사용 조건이 달라질 수 있습니다.", "strategy": "면역글로불린 제조사는 PRAC 자료 요청에 대비해 해당 기간의 배치별 과민반응 자료를 정리해 둘 필요가 있습니다. 국내 허가·유통 제품이 있는 기업은 식약처의 후속 조치 여부도 지켜봐야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.ema.europa.eu/en/news/meeting-highlights-pharmacovigilance-risk-assessment-committee-prac-26-29-october-2026", "verified": "EMA 회의 하이라이트 원문을 직접 확인했습니다."}], "verification_note": "두 사안 모두 검토 착수 단계이며 인과관계나 결론은 나오지 않았습니다. 면역글로불린 과민반응의 원인도 규명되지 않았습니다. Deanxit 재평가의 요청 주체와 판매 국가는 원문에서 확인되지 않았습니다.", "image_concept": "A single blood-plasma bag hanging under a magnifying lens on a bare steel stand.", "img": "data:image/webp;base64,UklGRiIqAABXRUJQVlA4IBYqAADQfgGdASqwBCADPpFIoE0lpCo3INNoauASCWlu4V0vCvByUedktqobdn4/bZqQ+Xkjq3D6htxfzsvnO9M/63XoMdNh/h8nja94I2O8Uq3J238Ah7XaNe6n3r9gPWO/A83f5H1AuHioBf0X/NesP/e+Uj7A4DPpLA7gJ5l4vTS8VmXi9NLxWZeL00vFZl4vTS8VmXi9NLxW3VLxlgFKYaGwnmVb8rJeK0EgDXOD66SdUxzDD6Dp2N+nl/e064ilV73n5LchdSoTval4ppqlp2BQY09epAVmxd5aAWJ2KzMBwKUYqM+Hs7BBH0sy8Pm/6peKw+SnOTmAy0fFjAoMaXj+Hl41tpeg6EDOWTWXvV6aXisy67FaMgEvTPRSCtSUnP6WDNMV0zxdU6o9VPQKUUGaYrpUYExTZw0ECZJ489qXimcOSjkeLLAeuCV9TnloBSjGl1PCC5+xWyLHDmsuibd7Uupz2pUGtg7PbUvFZqMFAg00vGPCnOy/+uF4Z4VMAis/JbngMcrY0vFZsXe9NeCw869vI/96qtpYNG9BjPRSCnl/F4pf25uY29Q4K/FZl4vXbgolvDS+MGgOMUot7n4KuM7Xfs3PMvF6pJ1S8ViM1dCgKUBg8mA7ulGM8Sug3CeZeL0pgkXQJvQYz3lOQLCKQG5jkVQQbeBoY5+fq8quetSM0jVGV2c7bUucuOsExO7yA1n8KUY0upz3ABPO4KApBTzLxemp1VmVULmzSjP9ZlpDfeOs+jD6SRSEATm/gqzZLab79AN90UYEwHjeApSg3MxDpJT0BUmQUyOiCmW0vF+Fzm9hFIPcG0oVm5DDd9Kuondh5mVuLnndR7lximoEgM1zCZnzzoYJ/2GK8xQj9bxWr7qGoF7zLrsVmXh9LL/PdueUwMM+Dvi7owrN4Q7yPWub+9X6tVUhpdMW+SeLqqB0KdE1BPk4J6ZpxPFJqP+NQ/r8KdmQhC6Gv+qTQfJVU8v417s9FKMmAYpdOxbxWIML+QzKxvi0RtccOrUkVuprNbS/Q/Jgbhg8eOf1nRsjJbhOOFykGFUihOgENCivxDQUS90z2IVkLjNuz/HAFiSvV+1vxTAdjkFugG3e2PhPNJi9KZdX+cfCtsCgylC+rUooYk7lTep2j7rJmFLDFHAuAneMhOsi2ik30VUMHgzkBR5Y  "평가원이 민원인 안내서 형태로 가이드라인을 제정했습니다. 환자 보고 결과, 환자선호도 연구, 환자참여 활동, 관찰 설문조사를 주요 자료 유형으로 제시했고, 간병인 등의 경험도 포함했습니다. 개발 초기부터 시판 후까지 단계별 활용 방안을 안내합니다. 제출된 임상자료의 유익성·위해성을 평가할 때 보완 근거로 쓸 수 있으며, CTD 2.5.6 ‘유익성과 위해성에 관한 결론’ 작성에도 활용할 수 있습니다.", "why_matters": "환자 관점 자료를 국내 허가심사에서 어떻게 쓸 수 있는지 안내해 자료 활용의 예측 가능성을 높입니다. 식약처는 미충족 수요가 큰 희귀질환 치료제 개발에 도움이 될 것으로 기대합니다.", "strategy": "희귀질환 개발사는 환자 보고 결과 지표를 임상 설계 초기부터 넣는 방안을 검토할 수 있습니다. 다만 유효성·안전성의 핵심 임상 근거를 대체하는 자료로 계획해서는 안 됩니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50458", "verified": "식약처 게시 페이지에서 제목과 등록일만 확인했습니다(본문은 첨부파일에 있어 미열람)."}, {"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=547690", "verified": "약사공론 기사 원문을 직접 확인했습니다."}, {"url": "https://www.newswhoplus.com/news/articleView.html?idxno=73134", "verified": "뉴스후플러스 기사 원문을 직접 확인했습니다."}], "verification_note": "내용은 보도자료를 옮긴 언론 기사 기준이며, 가이드라인 원문은 열람하지 않았습니다. 직접 확인한 기사 2건에는 제출 의무 여부가 명시되어 있지 않아 이 항목에서 단정하지 않았습니다.", "image_concept": "A patient's handwritten diary lying open on one pan of an otherwise empty balance scale.", "img": "data:image/webp;base64,UklGRpo7AABXRUJQVlA4II47AACQxwGdASqwBCADPpFIoUylpCqtoVF4qbASCWlu/7k6UfF6eJnuFuXyn+/K77/x8/Fut6LCFBa3jPScR/8hZX98HxHll/Fd77/qevv+u/6fe//1/0aeeNu/3ra717/msnO9Z+d7zHfI93/snzV2e3mhqEYr9uUAX9A8xr8nzk/q/UC87O/KoB+MDo9+xQkAbDtNWmqnxQs2HaatNVPihZsO01aaqfFCzYdpq01U+KFl4sHFBHmnPTzrw4oY8M0HACYHoKqbVT6jR0Ml2r8QlJ6+qn1HHV+FrOZ/DTVTNUwilpZfI1GHaatSlcJ47mmrcBywNyOuKfFCy63/pq01U+KFmwjzpQjWwgx+3zKaqZnVheWqb5Hl2NMheGLCik6ZUS0ONWmqn0C9xrRN0lymapqqBhARqn0yiueWGDwRRKQM1r63Ds4gWs+emiPLMVnNBMJiC0p2Ha8sogc6bLwHKqV8wMn1QjcsKFnt5TBslgrfMpq+BgYOTv6RC0p2HKp8K1SwmwuzwplPibTurBzesUPhTJZXNNVXc40wfYjpqiVOgIfPTVyvWCrF7PGCqj1E1U+JsLQLI1GHKsRRMHY2hGIXaauzsnFSEMRv+Goc4f4ahze7VpqlzZ9HPx9ow5UubUOcQIyOXqXaHHfDiTNgUZgoOaqgSTEc0wR2Haa1fBlXqZSv1ItmLzA2PUOVT4tKUhtdYX3DnzmlNVPhW8eRTGNSyzQAKLKNOGn/OIywGw7W6gBdr1KrMCyXT6gNh4IolPyfXlwr3TftUZBDrsvpO5Rafx45CtkwtBWHBBHG2dvgInEBrGthBAw411zj+ZTTplhUC1IAoXiyXW2WTAI7EF6ndVnb  투여경로도 일치해야 합니다.", "why_matters": "첨단재생의료 치료 신청에서 2~3년의 선행 연구 부담을 덜어 진입 장벽을 낮춘 조치입니다. 개별 치료계획의 안전성·유효성 심의는 유지되고 세포의 채취·검사·처리도 세포처리시설에서 해야 하므로, 심의 자체가 면제되는 것은 아닙니다.", "strategy": "면역세포 치료 연구자와 세포처리시설은 근거 문헌과 동일한 세포인지 입증할 품질 자료를 먼저 갖춰야 합니다. 기업은 이 경로가 품목허가 전략과 어떻게 맞물리는지 별도로 따져 볼 필요가 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503000000&bid=0027&act=view&list_no=1492379", "verified": "복지부 보도자료 원문을 직접 확인했습니다."}, {"url": "https://www.medicaltimes.com/Main/News/NewsView.html?ID=1171525", "verified": "메디칼타임즈 기사 원문을 직접 확인했습니다."}], "verification_note": "보도자료에 별도의 시행일이 명시되어 있지 않았고, 고시 원문은 열람하지 않았습니다. 대상 질환별 신청 규모와 기업별 영향은 자료에 없습니다.", "image_concept": "A single cell culture flask placed on a low stone step beside a much taller staircase.", "img": "data:image/webp;base64,UklGRvBNAABXRUJQVlA4IORNAABwIQKdASqwBCADPpFGn0ylo6KoIdCY2QASCWlu12em+829g3tnbHmjHLEniA9FOPg+4BL6Yn0eUgbFPvOljfQ/nleqX6e83tqV9U8Uvzn/I8Ifzv9b92nt+/+ei/6P/68iX9szp91f7jw3civo3Qb+W/4D9ivZRk/9Ifp1kWuaAHwuIDrhubJuTcm5Nybk3Jz+P8Nybk3Jz1XNk3Jz1auZsm5Nya0Qi1M1pwoi4wNbtBZItKai8zNNbMAawmas2nLzPOf1uaGh+OTVDhaCbu5XYUk4kRU7XCi+fp6zMgEry9M2eXJKslQJysBBCFxLigzfDsH2BOnFk7jrx+XO8ThzMfjeIqx8faA+1pFBm5PIAZWQcSegjdOycrAVjPpnXlElrTcI09Y9QzqvxFnxBOfmMKoTJuGKIUdcRMNzcOvd/DsH2ptNV5Pxym5c5GHoy5XDHfdI8mcYCwD+1N0CwbxkkUt/EHFyEbSsd5N0WAsA/5viRyEq5Rjx8P7/JMZC4jeQMQHXDc2b25mJzp1g7r5gfZS8MJzf6aVe40wuva4pAs+bgNbPsKgTfmVDOJoOsARiA9Y8XFhdcHtxrx45N+wd3eQ5OOoKKbpOkNeF/pNq3Revj5NwqHTh7CBpWa7Q1ArBCDx8z3VRF0fGX0gieQu+gxUoCmdTI8awH/uojD/TCN3+doJkaPjQ+XxpGFBUiEqtPYBJshNeUUAzKuOgP+EpGvkjjC+ahtwlsgzByGj1HR2ynO+9Vt+HEhTxZNybuZSMZr1OO3XLg1FA8n4qs2rVXUIFnqYT67ocod7jiAA3v36Er+K0Uha8V0C48aR6Y3WNtA0mnOq6N/wnUvbAJx0CAOtOCkTfRLcxksyq4DFtEvvwDrlNzO5i+FnOe1z3eywTi7IGbgFJN40J25JpEnI/MzSNvMsnFkZeuAJvs/UUeQlkNybk3JHF25g13BJLjNo1ND4YqM+Kh3+GKtk+1hxBupu9OLCfTIkbvSohlY1EzTvb6wZUelpi5niZCTNW3r4+TgIYrdN42G+63RwyIWB128jWpdKi9guG5sGC1iAfNb5BkNEKD5SmA5UXergS+1NJqyatAPIUoloxSX5PXWZz7Rl8/uDxKyxSSmq3iVWwbH9qCeb2Yx3WtOp+Bo8J6YO _changed": "사노피는 3분기 순매출 144억유로, 고정환율 기준 14.3% 성장을 발표했습니다. 듀피젠트는 34.8% 늘어 약 57억유로, 출시 신제품군은 31.4% 늘어 14억유로였고 백신은 6.6% 줄어 32억유로였습니다. 연간 전망은 매출 10%대 초반 성장, 비즈니스 EPS 10%대 중반 성장으로 올렸습니다. 벨렌 가리호 CEO는 현금흐름을 후기 단계 또는 상업화 단계 자산 중심의 사업개발에 쓰겠다고 밝혔습니다.", "why_matters": "듀피젠트가 순매출의 39%를 차지하고 2031년 특허 만료가 언급되는 상황에서, 대형사가 인수 대상의 무게중심을 후기 자산으로 옮기겠다고 밝힌 것입니다. 후기 임상·상업화 자산을 보유한 바이오텍의 협상 환경에 영향을 줄 수 있습니다.", "strategy": "초기 파이프라인은 볼트온으로 보강하고, 임상·과학적 위험을 줄이기 위해 후기·상업 자산을 찾으며, 중국을 포함해 전 세계에서 혁신을 조달하는 구도입니다. 프랑수아 로제 CFO는 이번에 구체적 지출 한도를 밝히지 않았고 신용등급 유지 의지를 재확인했습니다. 지난 4월에는 연구개발 거래에 최대 150억유로, 상업 자산 인수 시 최대 100억유로 추가 여력을 언급한 바 있습니다.", "evidence_type": "공시", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001121404/000112140426000009/pressreleaseq32026english.htm", "verified": "SEC 제출 보도자료 원문을 열람해 연간 전망 문구와 거래 항목을 확인했고, 매출·제품별 수치는 검색 결과 발췌로 확인했습니다."}, {"url": "https://www.biospace.com/business/sanofi-targets-late-phase-and-commercial-m-a-to-offset-looming-dupixent-decline", "verified": "기사 본문을 열람해 경영진 발언과 4월 지출 여력 언급을 확인했습니다."}], "verification_note": "M&A 관련 발언은 실적 설명회 녹취 원문이 아니라 BioSpace 보도로 확인했습니다. 특정 인수 거래가 발표된 것은 아니며 방향성 발언입니다.", "image_concept": "A large compass needle swinging away from a single towering golden pillar toward a row of finished, sealed vessels.", "img": "data:image/webp;base64,UklGRnIqAABXRUJQVlA4IGYqAACQiwGdASqwBCADPpFIoUylpC4toNC4ccASCWlu+wnmo7lD5Vy3bVflJOKYK7g9tIDmc72G2id1I3tO+55itNi239l/df1/41fggbp5h3uF9f8+Oaz+r6gH+g9LvF1kR9X//c8v31nwTQcedR0NkE9wRREGNfOEusGaU2QUeqprBqMA3l1T29eFZmYvZBPNnD2qo5zy3UPD9NrJrBmlNksMgeHqnZW8svO16qzPvvV+wgrkBm/FvVVUr+sF7KjM5LczF6M0pt/o46hzI2XjjNtlOeN6P+WCfNNXOdJwBnBGmtImXvwadXzM4LhSXqn0ygBkO5y7liX8Pmi40pBRClYVmaYcFF3KHZeKtPNW4agXsLO0T0LfoQU99ELeCh22a3WDNIbXLTzLqyJRWuKpscqt/AvLzMhmbArsvvhj0w+6atGu9zPlFKLf7WZmL2QXLLFPqdvDYvxA9obUxcFEF7Q1kkEVMnhx6prBke4AKI9cAqUQXypYJpDazAo7NtnxbC7fjLVYMxQTj5TFUSwqXLO3j89qavQZ1sxeyWEZpSCf+am5algr/iVmaDs5SNrO8vpbHPPXwWmzV3Bn4duHq6/m+rg4ShNIUAnqfEHPg8ulN0Jir43vumHxlhEesmpYM93pGUqmL2RhjkbCNk7kxc9HFKex 어 내지 않고 반대쪽 접시로 옮기는 미니멀 일러스트", "date": "2026-10-30", "scope": "글로벌", "entity": "아스트라제네카(AstraZeneca)", "what_changed": "아스트라제네카는 3분기 총매출 162억900만달러(고정환율 기준 7% 증가), 코어 EPS 2.79달러(19% 증가)를 발표하고 연간 가이던스를 재확인했습니다. 함께 공개한 ‘Reshaping for Sustainable Growth’ 프로그램은 최대 20억달러의 일회성 구조조정 비용으로 연환산 세전 15억달러의 효과를 내며, 2029년 말까지 사실상 마무리할 계획입니다.", "why_matters": "성장 중인 대형사가 비용 절감분을 이익이 아니라 파이프라인과 신기술에 재투입하겠다고 밝힌 사례입니다. 경영진은 감원을 예상하지 않는다고 했지만, 전 사업 영역에 걸친 인력·자원 이동이 수반될 수 있습니다.", "strategy": "성장 수요를 인력 비례 증가 없이 흡수할 여력을 만들고, 절감분을 주로 파이프라인에 재투자하는 재배치 전략입니다. 파스칼 소리오 CEO는 회사를 축소하려는 것이 아니라고 설명했습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.biospace.com/press-releases/astrazeneca-results-9m-and-q3-2026", "verified": "BioSpace에 게재된 회사 보도자료 전문을 열람해 수치와 프로그램 조건을 확인했습니다."}, {"url": "https://www.biospace.com/business/astrazeneca-employs-1-5b-cost-savings-to-reinvest-back-into-growth", "verified": "기사 본문을 열람해 감원 관련 경영진 발언을 확인했습니다."}], "verification_note": "감원 미예상 발언은 언론 보도 기준이며 회사의 향후 인력 계획을 확정하는 내용은 아닙니다. 회사 IR 사이트 원본이 아닌 BioSpace 게재본을 확인했습니다.", "image_concept": "A set of brass weights being moved from one pan of a balance scale to the other without any being removed.", "img": "data:image/webp;base64,UklGRrI5AABXRUJQVlA4IKY5AABwsQGdASqwBCADPpFIoEylpCaloNDYmNASCWlu+CzqKqUc/6uplgZWrvJPFz6B8WtB8/D0cryujuNPoj/4VnLqUuNCrzfj5W1fT//oN5BzzvnOb+BT7fq//J9zH++8Vfx/7P/d8kWKb88/M/870B8KfmtqQflf9G84mHvyy/I9Av22/GegD+P55/wv+j9gP+ff17/peVp4ZX3v/uewF/MP71+zvso/V/pF/Qv9T+2XwKfzv+9f+H/DdsX0lQkbRcTG3UhjI/fgqn+khf5qyfna++cwsvOkB4Lg9w8tySMqVm1ezdSFJO9SvFt025JNiW6XuQt8yehwCprxz62KVmNzVDHHWPlSbCLh7cSzD9m8AcTcX7nUUhSOKzdSEgv3fwdgHSweeYzKy5Ltvn/z9ZjcaEpqKZlGLk34yUzrA/RY3RcLBbHvLSx7yr2btn3DL14A4e3FAW8+blHyzzp3WbuzQHrzn5Dpx/9VFII9T8YcTmH+1vANGYzcPz/5+0a+jxoGq3JCmmOhLnJw5CkneqNjZZeVF1825Ci1lJ9Lu3aDGkwJS/oAUJPOUh6AUfVL2vLrN67HDOAs5FS9Rf9U5G8wH2wG/6AKSXUw5ZIpsQpJGqXazcYIp6eX5ruKUEtwuJZh+zo3q2NlQSzept4ZLleupTph+sUjoSa1f610/P9hzZb/EvQH8xxeWiDTpfudRQtaYN+YMYQ+HtxMUskZHs3HygTpUtUFlJGVfFSoqxB+DP9j525VpXkdSG5sh+y/ data/0000872589/000087258926000032/exhibit991q32026.htm", "verified": "SEC 제출 실적 보도자료 원문을 열람해 매출, EPS, 전망 변경, 사노피 제휴 조건을 확인했습니다."}, {"url": "https://www.biospace.com/business/regeneron-achieves-clean-sweep-in-q3-with-myriad-pipeline-catalysts-on-deck", "verified": "기사 본문을 열람해 시장 예상치, 주가 반응, CEO 발언을 확인했습니다."}], "verification_note": "사노피 선급금 10억달러는 3분기 실적에 포함되지 않고 4분기에 인식됩니다. 듀피젠트 65억달러는 사노피 기록 기준의 글로벌 매출이며 리제네론의 인식 매출이 아닙니다.", "image_concept": "Two interlocking gears, one visibly newer and larger, turning together on a polished steel base.", "img": "data:image/webp;base64,UklGRtRoAABXRUJQVlA4IMhoAACQigKdASqwBCADPpFIn0wlpCoqonNpAVASCWlu3LfdH4fF2/Vqd6FVuRMna3+f4Vh46PkoCuCf7Dm3+PmMeV9z3d1ZaCIJ3b5nemR6739xP8eHyHsP/KfLb+H/HHa19/k53aXwEfzf+x8ACAX9a/tf7IetP+Z5yfxf/A/6XuA/m17V+BL637Av9S/w/rAf6PlU+u/Yb/ovVK9KoSuuynAc3S4xAqwJj/+TPtc4Dk04nxaCwSl9Y6NDrC9rl3/8+qJ53yXqXfn5U8WB/Zchcr/Je5SVTKzIoSHf51qls28pyScV5O3GUU7DSfCIznb2uXgVLISVMH5MHYk7pGfiN3cHAYlUGunp5PPLGTsXtikoNwHhV7XLatW+uL8Jnq2TWM/23DxgE6Qe1kgXlDW3P4BPOqdTkwbR42ZFEx8KIjGNf59kdO4l2k2t8ZsNWp2/m39DKyeQhB4Aie1lW5sYGYt7l42YxJJkXDomdW7vigGKrYNH6HF/1gtqFjxFX4MjCAaCLmied+fayhTLQnn1TL5auZWPO/RUISmJUaJhww0M30zcXx6hwQMTR9O/PyvV1cCKv0MTs6f8XVNMf1oltRL2qcnzfJj9fT0OmdHUArHINSgjv5ySSNy7npf9wuVfaKHallE6vSYUymxOJUfLtsmeMhN/z6kPWv/J9hznmby3fME7lgo/mmRRDjv3LwFXENGmipSI6vlgpC/ivWXgBfVfuGQhQtk6IamYen6moj+P/knyKOuTpjP7S7weOuX8FwXlh0XUWGEtU43ekZBiZc4XappgB+n2kybVKcrqhS1CkyRm62lqK6h4uKGPz0krOrhg/2N4jw4IxYAESxQ79AMjKiTVwsdgmvrVFR7IcyKJJs0p+sKAn1UVbc/cOC2pJ2c/zJ4HZSGc3HixmrIOOy1qoAIQmJm1pkfxJqasGNrDIxVMySgEtLGDiKhBcaKqyU6WSBYd4oAMa1gBaJkzU7PDblhQrA18l1JcZ8Ct0Bz/jMi7V55uh/1KQAXC+IrZIcNwuu9s5E0vht52QklWwJd8xGvtyyEljcAqZqlGJi8VapU+5HAUWNyEWt65mHn5uvky5+xIZMytyf+7rGW1jL8rb7WTevWoROkD6Ze6egKOq0e/B5qUw55IkNKUfbj4EWQHi5a7yY8WlHZo7lI3x3/Zr/2kM3+ufZyqxtPsJP1i+MsOLW5rHD/5hBdeXrH4hf5J1Rfn2y3jZyOM5jsgfZsu0WSAXMwPG/xSVkD5ttkU1Aaxi0asICjg5WusouLEABuregJvENVQKtmr/9dW79frFRsrkdJ8D/44ovchvqfdz2qvUCi4gBvr83H0drFIGLHebS2DfhyKMJSzpAid9rfvndXF4QVW53iFaoDiM9Bc5JPe3ur5G+ hort": "드렌 3.5억달러 조달", "alt": "덮개가 씌워진 엔진 아래 발사대에서 로켓 연료 탱크를 채우는 미니멀 일러스트", "date": "2026-10-29", "scope": "글로벌", "entity": "드렌 바이오(Dren Bio)", "what_changed": "드렌 바이오는 신생 벤처 투자사 주비아 그룹과 라이트스피드 벤처 파트너스가 공동 주도한 3억5,000만달러 라운드를 발표했습니다. 자금은 CD94 표적 항체 디보타투그(DR-01)의 후기 개발과 허가·상업화 준비, 적응증 확장, 후속 파이프라인에 쓰입니다. 대상은 세포독성 T세포 림프종과 거대과립림프구 백혈병이고, 1/2상의 1차 판독은 12월로 예정돼 있습니다.", "why_matters": "비상장 바이오텍이 데이터 공개 전에 상업화 단계 수준의 자금을 확보한 사례로, 임상 후기 자산에 대한 민간 자금 수요를 보여 줍니다. 12월 판독이 곧바로 가치 평가의 시험대가 됩니다.", "strategy": "사노피에 선급금 6억달러로 DR-0201을 넘긴 2025년 거래 이후, 남은 핵심 자산은 직접 상업화까지 끌고 가려는 구도입니다. 재생불량성빈혈, 골수부전증후군, 자가면역질환으로의 확장도 탐색합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.biospace.com/drug-development/dren-bio-lands-350m-to-push-rare-blood-cancer-therapy-toward-market", "verified": "기사 본문을 열람해 금액, 공동 주도 투자사, 자산, 판독 일정을 확인했습니다."}], "verification_note": "회사 보도자료 원문은 찾지 못해 언론 보도로만 확인했습니다. 라운드의 시리즈명과 지분·로열티·부채 구분은 기사에 없어 투자 구조는 미확인입니다.", "image_concept": "A sturdy rocket fuel tank being filled on a launch pad beneath a covered, still-unlit engine.", "img": "data:image/webp;base64,UklGRrwnAABXRUJQVlA4ILAnAAAQbQGdASqwBCADPpFIoU0lpCMooJNYYRASCWlu+AM6+8gSnHLpuoOF98SbvnHF+rM1Oo8vlvm4QDzUvS1pldlzzKuZX8zxJ7FU3Q5j7UvtuM35uaiPjfg2QBfXvwMNWLxD7AH6b8jd9g/5fsB/zP+9ftH7IWlR634KgLg1ZFtmMAuGOsARWRbZjAJG1vrAEVkW2YwC4Y6wBFZFtmMAuGO+mfW0rYm9UGoCKyMH3vJMIPKlPqjQttOBDoB+PwzUzYne+KKhvUl6NJCz+PsbHbjdJ5u2ZHBqT6y54pSjUBFZFtmMAuNHsVgkrALhkg4ci2y7HI3vKqiapVNDPHb4jIZFTDr9C3YPh/HMOPxkcCVfErjWwBiDWwBiGHnyAIrI0OAYBcOcsARYWqlLYaS2z7PSj28shhYBcbYs6C2lsNJb478ikiINQD7QewT0qqkVkW2I5tvcMNt9TPw58nHh44sLlrYE3qS0/e/smuP1AcBjs2gfIwEuxUNsxjzETve8jVQp5V41msbs5bQlb4qn7zSXDPQ3veIpmxO97yNVBqArXz6pEmHDCN1SUSydvikiILeEFu3WVguPSWr/yxWRbYjnAD874tsxjz11SHbSZO3xSW2YzRBNPtN65VdX/+1RAR2N2xAUtsxeweKyLbibsTep+LDUBFZFtmKGbWAXDHWAH2LGhNv/2m9T83K7ikWX2FDdsxej2Cv6aGgCKyTYJN6oNQGxcc6f2ZFBWJuZ2U9VkZEQlSyf0hgKW2XNK8PRbH/sum+Yoy8lL47U59PPk9cm2V6HtU/YpvXx+GqFQ4CKyLkY6pgcBFZpyNxsydZ8/LefScdpPWQ8Ln3tYYEFXo4GQ5qaatf7uuDU/OPmGMosx1gIZjrAETRB  brass valve fitted precisely into a long row of identical factory-made pipes.", "img": "data:image/webp;base64,UklGRvAoAABXRUJQVlA4IOQoAABQhQGdASqwBCADPpFIokylpKcloTOoSOASCWlu/9c7zfN6XqTYj4y15/qu/z9DcrUIHNP+RxlnkKvpabNPXcXeSNi1myDIPq/72ejvzcxrdJf07a+dNXTvu/+7eBtrbeCPYA4Lz7n/zvYR/nP9/9JnUIHVVG+pqAmMQxniz8HWzzGIY5g3OJ5eIYzupqAmMPdDZ9TUBMaG18OhtlHSqxKVMb7jmFqqQ8xc46bM4SpvMVmKtttm55kwAoKHR04nb081c3dUJjOCA31NQFLdc8Ugr0blN8moCYxDxu6CH5cscL5NQEXiCDFpfBSCXnSn++q0OuYxK5jNZHG11yYLMMQBdbsf6FBhrvkmwnif8n4v3aFf+wiTw5od9x5cxiV6fSUe8ioXOJ5daifZeJQI4097Q2zMN4R3aX6OyyAjNOQ7n7L7Q5eIYywlLIcmp3MYQxHl4hjO7jLtyao0QtoATfvJOOHdKAMFiSUrOb0xFc9IDzGIYrHjHQAXyagNDk6BgHdwReE0Vr7fwapqABJIsrz2zrcp/od5s/wiPeszCQ8jY3ZICZVgbEZzz4uCPylDfaRZ8sMUUFXCO5gV88KvhqY6xjmMZF5YWXACZNQYvk6TepPJN3Q6q6VdoMkBGES5Eupy6ttMUvSXCu5WG1uWiBgVy4RV7pZGa22ScaUAlSfOukbrAYzEgn7m0KZ9Z3GtU1ATssxlzd9VGqQkBMZE85k684qcSEF+NBJ4kGAAaC2G/GDFXolIARkeJSKQRwpSXnXWYXpT+3igWI1ATGKo1xA0xeKkWyifGl91/lQluQwLT3bLPJQ7khsxI+PvQAi+MHZ6xXBuSUBPTxdbPw175xgxPxgaDZ3bz+rq1cwoaHErC9+SugA7lOQuuiZ+Kjhkbxe19tFR2Pf4SA5vzyZpk31m+DJui8xiGRvrcbZNSSte899GP4AF64oRrLRu6COokdCBQEe0omlYfhNA2GbQi+NIhjDxcEe62AN6xso1Ta/uvc2IzoGDGEeWkINhOsxV+kmd+zuNanNKCjtrcpvkuTvUKiPP+XiGNoAMZ3VTehoXb7QARqAk+O8RDWDzJgPGMQE56QH3rMGMz1QBCHwfvHiYxcD3OgyYEcPVo06JL4rk3XVEWO/i42JnQlm+4IRTUADt3kSXC0J50x5jGW5ubV3hjC87KP0Q4xprI/GgfwSRaLloNomb246J6kYODBmbQAE5TjIrViCsEiHB+4kKGOUXP02GjBe97qkHOded2AxlqHdW3vkuTHM2gmi6N7AJcWCPmicTUVAhCxdDl5LOlFM3vfC0eE6GDzQyIZAbgKRdHekuT7gLm2VoU0OiX5Hgg/ccY2cRHxR2fdIx2FcoViFNaxDdm5zwlJez0e/VAeSPTA8Z60NorPAIDpsAMq21vjXc1rxqlpoEUuOae41eDYpR3rLFhtoV1fZvgWcyKn/ZLhwdWvYW88DkA89iM2ZUBHSoZkM7917R/quLvoiDrjL3ICzBLJWi9tEQFUsCijanGCNlIi4KIY+W2aC0ap1P+Q/GUI84cCqy9OsQB2gkZxgvV7G1fhXKVAqlLLJwhTGJf4G4FHvDfi3rEcDHzunpvIK71YlsC08yGjiuM7eQssT5YJYyoEfLcSeu7S053g0T528Il3tP8jTxEX9gw3fGFEiQoGcawKU87x6FSWwj9sIeh7dcqu5GxyHJCoq2QzUAKwlmM9YnE5oaIpHzCg1a1yj3wSKXB4baojuB3ytM6TFLonJmSMzsHfHE9/z4MHHcsH36CHH+CLHLcZF/2ek0VGV66926L9Z1T4ve8kQqJkqG4amWcBmI3AZu9AElQf7xxjS6p8frgnkGeCj7BclMBFKwU+Hz const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
</html>
