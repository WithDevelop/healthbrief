:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}

on-requirements", "verified": "원문 직접 확인(발표일, 15억 달러 이상 절감 전망, 예측형 DSI 투명성 요건 삭제, 정보차단 변경 미결 확인)"}, {"url": "https://www.hhs.gov/press-room/hhs-finalizes-hti-5-deregulatory-rule.html", "verified": "검색 결과 스니펫만 확인(본문 미열람, 접근 차단)"}], "verification_note": "삭제·개정 기준 수와 시행일은 ONC 공식 표에서 확인했습니다. 절감액은 언론 원문의 ‘15억 달러 이상’을 따랐고, 스니펫에 나온 현재가치 15억5천만 달러는 HHS 보도자료 원문으로 확인하지 못했습니다. (b)(11) 개정의 구체적 내용은 확인하지 못했습니다.", "image_concept": "A thick binder of regulations with a third of its pages neatly removed, lying open on a clean desk.", "img": "data:image/webp;base64,UklGRtQzAABXRUJQVlA4IMgzAACQvQGdASqwBCADPpFIoEylpDEtoPLogiASCWlu+ED9Z/6r6qgd77XfjK/9en/Xa/7vnHzW5c4HQVxT2hiWbXbwlJV2f/v/00qNuaa3gce7q/wHgT/Ofmh64u039l8QV4vy09B3EP/E83f3zzY+l3gS/j/UF8oz/f82+d2Di9XanYhH1rokc467U0+EMH1rokbfV2pp8IYPrXRH1roj610jHHG0B+gf5u2BkKyUFPJy6cmIYPrWgPoG5cZtQpHLMO+Bdf9dExzGO2y45gNug7Ljf1drWvnlroi+dk//qqIJljRTooLXr/yHXAcaeL8N36ogrjBNTv7TbilMF7iGjrYU1EE+E0zRC7XwL+fFyCTSEo096vrOKCcBIk8my9XamoAGnYKITThg+tdzqRqCvtdFP2oK2qu7lBz9Kxk31drZiiQJVPIBFquvj610Mr9EfWuiPrYtMFbuXVFiihqIyUU41rpr6BH0yMSTMXdqDwYi+P74aE2C0a2nwg+DH0DmnlMya8VpzBbMOH/QP7ol3d2p+X74w4OiPWBywAklowet9G+07n6hH3JtzL/hFwx9aztIj7XrXRF/fs/PLscBtnaEIxj1xGJDB9ZxbIcHMN9l2PrXSlII+YdM7WXokUMuyDmVf8PEiAfOZajTBSNlxHY3SlK0wnYtqhq9IOENuiL5wlGnDoXp4pjQSZTRqEClGqmnluaJtLVwTXx9cWoZQPD4XjdlSjT4QwfgX9Xn53fkiG3ki+cPrmYYaP55zdTiHRvdDydyJABiGSkX4LBdWIOENuiUEHMBPom0aaMU53zLfHGrnMQE97YFKNPvnD32RYQnQ27npheBNbGGI4gJY39XOdVqlcrChc5G2K6xSajkctB9CljaQ3rPGqxAaHOASvA0AcJWnzNFhHqmVDaCFf1VMw6qvOQGr/H9iGSvH9XamK+tOYLZh4qBW5urLsjR6+FgIA0Uo6jAj0eE0/fZp4eeSSOxqJnPKKMPezdvaF8jA9D246ai1pvcR2N0R9kWU1zgljPq7UBSEs1Xv/LDAQOsAoZR3+JsUHHg5R5TNId8NrN0M4B1M4zppSytlz429leP6u4mkGab+sIo1lyWheKSbFJrlTpZssO2U6FnvjiFGTWTeu9Mq9l56l5DadYxWkI4TYA+obL78uZ27ExdxFyiE92vng5kPiw21mEJCBhna5JtSo7r3HJp6B+KNBDvjqr6yiselWJhM4xbQHqpD4pCcT9o6+F4p2maFHVLfHIAD7PyG5wKhttpzOqZVXg1X83k4eDKoijVgiSLgFyuLCvqxTO+R0FsF1mI4cuMEIVo/2gj5A66QgjwSiaK5QvtaztIcmy9VT6kM1fpycNk14pY7aFDL2fk3f2KLO+seUOE+Y/CySfLFeuaxgIo8dHkDCkCrB85fYQUpJj 대웅제약, 아주대학교병원", "what_changed": "대웅제약이 AI 스마트 병상 모니터링 시스템 ‘씽크(thynC)’를 아주대병원 7개 병동 342병상에 공급해 운영 중이라고 발표했습니다. 9월 흉부외과·순환기내과 병동에서 시작했고, 10월 응급병동과 간호·간병통합서비스 병동으로 넓혔습니다. 웨어러블 센서로 심전도, 심박수, 호흡수, 산소포화도를 측정하고, AI로 낙상과 응급 부정맥을 감지합니다. 측정값은 EMR과 연동돼 60초 간격으로 자동 기록됩니다. 아주대병원은 성과를 검토한 뒤 최대 1,100병상까지 확대하는 방안을 검토하고 있습니다.", "why_matters": "씽크는 2026년 10월 기준 전국 218개 의료기관, 누적 2만54병상에 도입됐습니다. 상급종합병원이 일반 병동 단위로 연속 모니터링을 들이고 있어, 병원 AX가 영상 판독을 넘어 간호 업무와 병동 운영으로 확산하고 있음을 보여줍니다.", "strategy": "병동 모니터링 시장은 EMR 연동과 병동 단위 확장 실적이 경쟁력을 좌우합니다. 경쟁사는 수가 연계와 간호 인력 절감 효과를 근거로 제시해야 합니다. 병원은 대규모 확대 전에 경보 피로와 오경보율 지표를 반드시 점검해야 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.medipana.com/news/articleView.html?idxno=420037", "verified": "원문 직접 확인(10월 26일 기사, 342병상·7개 병동, 기능, 60초 EMR 연동, 1,100병상 확대 검토, 218개 기관·2만54병상 확인)"}, {"url": "https://dailypharm.com/user/news/343797", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://www.etoday.co.kr/news/view/2639874", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "대웅제약 발표를 전한 언론 보도로 확인했고, 회사 보도자료 원문은 열람하지 못했습니다. 1,100병상 확대는 확정이 아니라 검토 단계입니다. 임상적 효과를 보여주는 정량 지표는 공개되지 않았습니다.", "image_concept": "A row of hospital beds connected by a single glowing thread that pulses like a heartbeat line.", "img": "data:image/webp;base64,UklGRjYpAABXRUJQVlA4ICopAACwcAGdASqwBCADPpFIoU0lpDUxIJDYYqASCWlu//tdH+e/2sgIF/tH2Z6/0U196azSXRbK+sPrlfJ7b3eyZTzz7Q83t9H0e/4L0mOjlzuXpt85L0r/WW/qHqdedF63H+IyeNnX/Q8TfM/EwfRO+OAfgCvo2NzVQ8V9IPg1/fPUR/VvpUafwrqyLbMYBcU8MXDl8j0I/yMA2u8VkgaEAf5GAXDHWAIrItsxgpxw4S4lYUFw4a2BbTAx1kqNLKZOwF8Tve8jGn8+opXDOquMxr3K7UBFZFtmOBnCHpHPRN64aIt9iI8t6oNQEVk7ROcTVOJY9PUBwBW6LwBFZENsfVF7CHozDfJvVBvU3viktuJwVSdZ8ZQp5WtYG+BLeqDT/9pvP81JZZfxeJ3428jVjsMbLOk91kNOdww6fCB373xSW4XtQY60tbbZih1T3LbMUM4VsRCGOlP9j83K+tLbMX/e5pMtYBcMd9LeqQnCJtJBxDH1RewD7rA0/+bNljkCm9Y6utmw01c3xSW2fAj4v8/zR46oNQGwcBKfSQx1gCKyM/GUzuuDPqJmejnCSCPFj6ooBj+m65fV7ATvi2zGAXB3LI76aDP6b4y/9KY75eBvXzV3fSuxRavYx/mpIX2lZ8fHNUjxnyb1QvdKa3UNsxgnuqGrODiGPefcrreosK7uGOlZYbMcC9UQn 실 규제심사가 진행 중이라고 답했습니다.", "why_matters": "처방은 크게 늘었지만 DUR 병용·투여기간 경고 같은 안전관리 장치는 부족하다는 지적과 급여화 요구가 함께 제기되고 있습니다. 비만치료제 시장의 급여 범위와 사용 제한을 좌우할 사안입니다.", "strategy": "오남용 우려 의약품 지정 고시 시점, DUR 경고 기준 신설, 급여화에 대한 복지부의 공식 답변 수위를 확인해야 합니다. 국산 GLP-1(한미 에페 등) 출시 전략에도 영향을 줄 변수입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=547217", "verified": "원문 직접 확인(약사공론 10월 27일 05:52 기사, 처방 통계, 의원별 지적, 참고인 신청)"}], "verification_note": "처방 통계는 의원실이 심평원 자료를 분석한 수치를 언론이 옮긴 것이며, 심평원 원자료는 직접 확인하지 못했습니다. 186만 건 통계는 기사에 출처가 명시돼 있지 않습니다. 종합감사의 실제 답변은 아직 확인되지 않았습니다.", "image_concept": "A rapidly filling hourglass whose narrow neck is being widened by a small hand tool.", "img": "data:image/webp;base64,UklGRsRPAABXRUJQVlA4ILhPAABQ+gGdASqwBCADPpFIoUylpCqoIdWYqVASCWdu+qFs+5I99VVdZZPwRBKZRv8yTaIJE8G7740KLPbHRSm+MOjn43/f9DDkXzTjoYzXS+dv7n34fTX/W/UA5+nmc86X1E/5vfj96b/0OTnerPNRZub0PP+SJbi7Rf1vxC8Wu1G4fzEfe/8T52M5v6y1APO/wnKA/Go1FgtbJFx/rMxYXH+szFhcf6zMWFx/rMxYXH+szFhcf6zMWFx/rgOMtw/L0/1nKyJpUiFyI9GDjKLnYRLcXc5Ac+FcgPjSTWyJEEi4/4vn4z6QZdygTUn1kGuS3LSQkJBc2Fx/p4fApXEHqhR6+KtU+wuA/WYfFyI5dBGUDpaM+A/1mYsImBR6zLq2qhR6zD2hTQpCzujywlPcNblZFOyRFxu5UEQtT+PWLuW3+D1QpDV8eu7GblwZskWqXL8VGYqCtNCXVtLZGTvG5JILn1cPg7m0CZiD1QqHLgzTeZyrJFx/p7cQeqbJen+swjv1Xt2+cX3vzuy2zO0S0PUe2F5N+Z2/r509dnXA3EFeS0oA/RVqmlOiccJm/w5EUc1bZas5Q/Hnmq8N7CdA4gWw8oDVbVRAzYtdAUDAP3/WZiue+oNc08tVCjtFGc42dTMNPWo5zH8kbQDQ7BdrYfvkh/FsmBZQb3GXDFO2inaQJRedcOZO+9zwoFmLT7VudF78WFF3hkqZXacnz1uDQGxLhD1mYsez/rGMQeqFHr1Kf79TIEJiU/+1995qaJUSsgAKZv72+Sn4xvl6KzRkUaACkRpTsDX8QmCF/wEBLULQUgFTGYZAas+MSUHbO4e5hvnopCfi7nE5ts+6yHZ7lm0WPYJ0woa5xfJzUdawiFTLVQq31cHqhR21DyuXSQLnbl0qAMcGafL1JUSpDAKHg8VzPvqKz1eRS05WRetYw489A9kXxDM/01CswCJ1dliE0S+RDa7JFx8jdki4/1jGJRACU3LJP6Q3ThJndpeUZrk7w9apuw6wjP/8TZRMtF8BAcHVgSdWh6xI70KDWVjcWkbodLT1MWEV/Z1XhZmQDNyoz2ZT24aGUesDFWBt4chO/et4GhqWeA7zrGcjlykcB+sXctURBD5WRFEwEhR6e2o9apsEZmhgUQNh2gzoufXWaEZhGRhZllpPCVImU09478rOnX+s1WytG4INmyCIoK1UKO1B8orfAEzdq7JEJB7otHRU4qiNrYWtiH/uMBRDtN asundexian-nmpa", "cat": "reg", "title": "중국 NMPA, 바이엘 경구 FXIa 억제제 ‘아순덱시안(선하보)’ 세계 첫 승인… 비심인성 허혈성 뇌졸중 후 재발 위험 26% 감소", "short": "아순덱시안 中 세계 첫 승인", "alt": "쓰러지기 직전의 도미노 하나를 얇은 유리판이 막아 선 미니멀 일러스트", "date": "2026-10-26", "scope": "글로벌", "entity": "Bayer, 중국 NMPA", "what_changed": "중국 NMPA가 바이엘의 아순덱시안(제품명 Sunharbo, 50mg 1일 1회 경구)을 승인했습니다. 적응증은 비심인성 허혈성 뇌졸중 또는 고위험 일과성 허혈발작(TIA)을 겪은 성인의 뇌졸중 위험 감소입니다. 5월 우선심사 지정을 거쳤으며, 이 약의 첫 승인이자 FXIa 억제제 계열로는 세계 첫 승인입니다. 근거인 3상 OCEANIC-STROKE(약 1만2,000명)에서 항혈소판제에 추가했을 때 허혈성 뇌졸중 위험이 26% 줄었습니다.", "why_matters": "출혈 위험을 줄일 것으로 기대받아 온 차세대 항응고제 계열 FXIa 억제제가 처음으로 상용화 단계에 들어섰습니다. 아직 어느 시장에도 허가를 신청하지 않은 BMS·J&J의 밀벡시안보다 먼저 시장에 나서게 됐습니다. 미국(우선심사)·유럽·일본 심사 결과에도 영향을 줄 수 있습니다.", "strategy": "국내 허가 신청 시점과 이차예방 급여 경쟁 구도(기존 항혈소판제 병용)를 지켜봐야 합니다. 바이엘은 최대 매출 전망을 약 50억 유로에서 10억 유로로 낮춘 바 있어, 상업적 기대치는 따로 판단해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://pharmaphorum.com/news/bayer-gets-first-approval-stroke-drug-asundexian", "verified": "원문 직접 확인(10월 26일 기사, 적응증, 밀벡시안 현황, 매출 전망)"}, {"url": "https://www.rttnews.com/3702961/bayer-s-asundexian-becomes-first-factor-xia-inhibitor-approved-in-china-for-stroke-prevention.aspx", "verified": "원문 직접 확인(제품명 Sunharbo, 50mg 1일 1회, 미국·일본 심사 중)"}, {"url": "https://www.tradingview.com/news/reuters.com,2026:newsml_L6N46C0L5:0-china-approves-bayer-blood-thinner-asundexian/", "verified": "로이터 기사 제목과 검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://medipana.com/news/articleView.html?idxno=420119", "verified": "원문 직접 확인(10월 27일 국내 보도, 로이터 26일 보도 인용, 재발률 6.2% 대 8.4%)"}], "verification_note": "바이엘 공식 보도자료 원문은 열람하지 못했고, 로이터와 전문지 보도로 교차 확인했습니다. 대출혈 수치는 스니펫에만 나와 본문에 넣지 않았습니다. 정확한 NMPA 승인일은 확인하지 못해 발표일 기준으로 표기했습니다.", "image_concept": "A single domino held still by a thin glass pane just before it topples into a row.", "img": "data:image/webp;base64,UklGRoAjAABXRUJQVlA4IHQjAACwlQGdASqwBCADPpFIn0wlr7CwIzQYahASCWluz2MR9c5WwWvzaO/wvnr+TQCs13fhdP7bVNBnqJLtxB7rUUmdj0IvsXcfiQYfrmtZ2Ng8rX18D7smDfMkBICQEgJASAkBICQEgJASAkBICQEgKSaZFh g", "title": "FDA, 화이자 ‘탈젠나+엑스탄디’ 병용을 HRR 변이 전이성 호르몬 감수성 전립선암으로 확대 승인… TALAPRO-3서 영상학적 진행 위험 52% 감소", "short": "탈젠나 병용 mHSPC 확대", "alt": "여러 개의 자물쇠가 달린 높은 문의 아래쪽 자물쇠에 열쇠가 꽂히는 미니멀 일러스트", "date": "2026-10-26", "scope": "글로벌", "entity": "Pfizer, 미국 FDA", "what_changed": "FDA가 PARP 억제제 탈젠나(탈라조파립)와 엑스탄디(엔잘루타마이드) 병용요법의 적응증을 넓혔습니다. 새 적응증은 FDA 승인 검사로 확인된 HRR 유전자 변이(BRCA와 비BRCA 모두 포함)가 있는 성인의 전이성 호르몬 감수성 전립선암(mHSPC)입니다. 2023년 6월 승인된 거세저항성(mCRPC) 단계보다 앞선 치료 단계입니다. 근거는 599명을 대상으로 한 3상 TALAPRO-3이며, 영상학적 무진행생존(rPFS) HR 0.48(95% CI 0.36–0.65, p<0.0001), 3년 시점 무진행 비율은 약 77%로 추정됐습니다. 우선심사로 진행됐습니다.", "why_matters": "HRR 변이 전립선암에서 PARP 억제제 병용을 호르몬 감수성 단계부터 쓸 수 있게 됐습니다. 진단 시점의 HRR 유전자 검사 수요가 커질 가능성이 있습니다. 다만 3등급 이상 빈혈이 51%(대조군 3%)로 높고, 전체생존(OS) 결과는 아직 발표되지 않았습니다.", "strategy": "국내 동반진단(HRR 패널) 기업과 PARP 억제제 경쟁사는 mHSPC 단계의 검사 시점과 급여 기준 논의를 미리 점검할 필요가 있습니다. 빈혈 관리 비용과 OS 성숙 데이터가 향후 HTA 협상의 쟁점이 될 전망입니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://sg.finance.yahoo.com/news/pfizer-talzenna-plus-xtandi-fda-174100422.html", "verified": "원문 직접 확인(화이자 보도자료 전재본, 10월 26일 뉴욕 발신, 적응증 문구, rPFS HR, 안전성 수치)"}, {"url": "https://www.pfizer.com/news/press-release/press-release-detail/pfizers-talzenna-plus-xtandi-fda-approved-earlier", "verified": "검색 결과 스니펫만 확인(화이자 원문 페이지 403 오류로 본문 미열람)"}, {"url": "https://www.biopharmawatch.com/news/PFE/pfizer-talzenna-xtandi-fda-approval-prostate-cancer", "verified": "원문 직접 확인(10월 26일 기사, 수치가 보도자료와 일치)"}], "verification_note": "FDA 보도자료 목록에는 이 건이 게재되지 않아 기업 보도자료 기준으로 작성했습니다. 정확한 FDA 조치일은 보도자료에 명시돼 있지 않습니다. 보도자료에 ‘최초’ 표현이 없어 쓰지 않았습니다.", "image_concept": "A key being inserted into an earlier, lower lock on a tall door with several locks.", "img": "data:image/webp;base64,UklGRoAeAABXRUJQVlA4IHQeAADQQwGdASqwBCADPpFIoE0lpC2ooFZIgbASCWlu+xhG8fhzPFLqcBz04jvg6/khj2kiASZkB96+ecnZUfbn9D22/8yvmwenneqd6eyOihvcpdxs1QHNyUFkQ1nzIh51XvGDi46zMxC6d7HSw5lbm+pqAmVub6nGZ9kPC9zfU1ATK3ThvhdO7S96hgRcbMsxcEncvXnciDZ3cdE11XC7B59xuxTEzkT9TuNaq+42MJn5wKiR87ACbnzI9yQVxq7Q1f19ZIcQunz  "date": "2026-10-26", "scope": "글로벌", "entity": "Corxel Pharmaceuticals(미국법인), Amanat Acquisition Corp(AMAN)", "what_changed": "코어셀 미국법인과 케이맨 소재 스팩 아마낫이 10월 25일 사업결합 본계약에 서명했고 10월 26일 발표했습니다. 약 3억달러 PIPE와 신탁계좌 약 7,500만달러를 더해 상환이 없다는 가정에서 총 조달액은 약 3억7,700만달러입니다. PIPE에는 RTW, NEA, RA Capital, Invus, TCGX 등이 참여했습니다. 상장 대상은 1일 1회 경구 GLP-1 작용제 CX11과 전임상 단계 경구 아밀린 작용제 CX12이며, 급성 허혈성 뇌졸중 후보 JX10은 거래에서 제외됐습니다. 거래는 2027년 상반기 종결 예정입니다.", "why_matters": "CX11은 미국 2상에서 36주 시점 최대 11.5% 체중 감소를 보였고, 회사는 2상 종료 회의를 거쳐 FDA와 3상 설계의 핵심 요소에 합의했다고 밝혔습니다. 경구 비만약 후기 개발 자금을 IPO 대신 스팩과 대형 PIPE로 마련한 사례입니다.", "strategy": "모회사가 홍콩에 있는 코어셀은 미국법인만 따로 떼어 미국 자본시장에 상장하는 방식을 택했습니다. 비만 자산만 상장사에 담고 뇌졸중 자산은 모회사에 남겨 투자 논리를 단순하게 만들었습니다. 미국 내 CEO는 종결 전까지 영입할 예정입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0002112457/000121390026112236/ea030895401ex99-1.htm", "verified": "원문 직접 확인(SEC 8-K 첨부 보도자료)"}, {"url": "https://www.sec.gov/Archives/edgar/data/0002112457/000121390026112236/ea0308954-8k425_amanat.htm", "verified": "검색 결과 스니펫만 확인(본문 미열람, 서명일과 종결 조건 확인)"}, {"url": "https://www.biopharmadive.com/news/corxel-pharmaceuticals-spac-public-obesity-drugs/872772/", "verified": "원문 직접 확인"}], "verification_note": "기업가치는 공개되지 않았습니다. PIPE 금액은 감액 조정 조항이 붙은 수치이고 종목코드는 아직 정해지지 않았습니다. CX11·JX10 도입처와 3상 착수 시점(빠르면 2027년 1분기)은 기사 기준이며 보도자료에는 없습니다.", "image_concept": "A single small white capsule balanced on the edge of a narrow bridge spanning a gap between two cliffs.", "img": "data:image/webp;base64,UklGRsIsAABXRUJQVlA4ILYsAABQpQGdASqwBCADPpFIokylpKOiodaYcLASCWlu+n9A3KDqF99POWa3CE+7ke3D53kt0jxa5rhmxyVgw7Nv/x8ef27/Y0heLeqF0CvKA8JL5kKmKUecuLzPtzPtzPtzR8Cn25n25n26S5bsXmfzFPtzPtzPr5xzXPNDHca29EIQqHVuRTD9/jmQu5ko9Q6V07NWjLBXh4p8hcXm3NzpSapcUCQn52v8AxTJtwluWNxnQ93n5cnzfgpYFbrs1M7p4z13rj/l/JH7Lzrn89neS7xivClWkdfoUmbJOgTnQZPNoxU0Tdi8nZRQb3ItL09fD2z95y5Ty9uWkt0x9GwpR5y6NhSjznP2XoMElrpoWLtr0SmUSNOEN/Y5zTlsUJ2emm7kYneEyk+b8Au8g+KpDZ3gMntDHcgpT9vsZ7tHFSiwDswb8vbXP2ShOsbcRNuZ7BhQhTEdjDrO c-breast-cancer/839574/", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://www.fiercebiotech.com/biotech/biontech-sees-limited-benefit-adc-after-phase-3-reveals-modest-efficacy-ild-cases", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "보도자료에는 위험비나 PFS 수치, 간질성 폐질환 발생률이 없습니다. 2026년 BLA 제출 계획은 검색 요약에만 나와 미확인입니다. 학회 발표가 아니라 톱라인 보도자료입니다.", "image_concept": "A finely crafted key that fits a lock but turns only a fraction of the way.", "img": "data:image/webp;base64,UklGRmBFAABXRUJQVlA4IFRFAACQ5wGdASqwBCADPpFIoEwlpKMlInOIoLASCWlu+meq+8oYdb28icEChYi5gX4xp3boh4PD6+YZ5PPNLBQwFReH1XxafMsWOzY7kf2j/Q0YIVjLv+f9QPjTvx3qFf0P/J+lLqBexuCiHZvy4oZAaq18yQGqtEgJASAlWayBKtyaZGXBGpb4dY65nqmwlcOxZr8tN+Wm3x5dO+AJCTTfmHhi/s95qJkVGkcRp33FHqi/O/+KDdp0QlNn0/05NmN4JBlwWxHYW6eo9I1nW19J3cREQ5Jwvkg+u1LJT9Ykl+QvNNPA2LyY3I5nF/uFh18GgWQu0bTfUsyRrHFII1djRr+mYJZeqMjk98JLbT0/Oou7ourX2KTgskg0ri7M5MfYjTQMyOMj59LtWoAu8EbHvql4ZfhfWcUgjI+nM/iIrLglt1Ux/IU+LjYN40CkBI1LTAwFubfhHy4lxMOYFLIhCLkjPtKZ1rJlEwI/WiMWa+oyF7gnY0AVj7/k6X7wu4VhWtpp/hG9waggHkDfKzJDIyL8uX6zywykJCKcXoOKMfBVi/3h1i/s94X+8cGOsYLsSab6wxTAurkpY52Z1jrGAY5BqxLaOWlFOZZvnZ2tGTNCtJm7TQMxeH711fWbspMQJMDNcuV7VnP2CLo0EJ/niSPLuRDZfWXnv3BlsbdXFL5uzdm8ca4s3jbBPke4CcFzqyKGDl9vX/7gxO3fq/LO+OvVzAQHunx4of4tAVO32yd+MsZCBFTbOrR24VDxWCOol9jmHGxlxUWqvNNA3OtbHZNHdFTkMhF4jZkvxKhEITB4QJI5aaOz6sE58Du4f0q9dLZuHgFoOatD9i34etqkVZNFYI6zzhfceO8OMSkEZjUrfm4SfxRI8hN/CE+NgQM+W+ZfRfHkBPZar4E4RpuRooxpoGYvCDUOZ4H3vdNNMjLgje5uel5T2NYijXkDu3BJpPTp9GAJ+zP9DNYaSLbHXyYaGfX49+giGXxFUAa6ORl3O4gVsP8+eFgWF/h/AslNME3v0K/SezebYDhsy5V+XN9bM8R2PJa9zBDGW3Xnc2tnA0cuXiFzwmDAam9q8uI+JYQoP1yYe/r7HUqHAdRJbiqU6VTHs0pEVtuksqMvkrDyGB87vlxBCl7rmOWJiCqDTJJneSaY+oUG+KjHDkafpUEjWNktnFG2fbbjZtBHOu0bCdxv3Rv25iQB7KNWp9jpwrodzT64cW52OfSJmikQxUOoPK7G8f2JvgA8yWhObfhwQ1QvHMwFUa/jdRybXw6LbPuLJwjjjEBIGmGpsie7bXP/gfinPrZClqdkDaOfRyPNXNdhBA93JviC5fCbjh9xZTq4UIq9UM6gzhjg5PraVN3XJ76mIZqgj1DLM0dapde8+iQfKr8tN+ZXWzPk/+mk0p3gtqJe/NT12MO3MB+kd8UfnXleSXZ4k+Eb7Dio4rRglIAD5fI5lV6XiYisveRJGGn2Ep0lxFS7OHOA3a0c const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
