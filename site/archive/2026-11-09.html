:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}

 허가 시점이 다음 확인 지점입니다.", "refs": ["bio-abclon-ckd-car-t"]}, {"head": "ARDS 항체가 지역 판권으로 자금을 마련합니다", "body": "에데사는 일본 판권만 떼어 선급금 1,200만달러를 받았습니다. 승인 치료제가 없는 적응증에서 지역별 분할 라이선스 모델이 작동하는 사례입니다.", "refs": ["bio-edesa-kyorin"]}, {"head": "중국 자국산 PCSK9가 단독요법으로 확장합니다", "body": "이노벤트는 급여 등재 뒤 누적 100만 명에게 처방된 신트빌로의 1차 단독요법 3상을 성공시켰습니다. 중국 지질저하제 시장에서 가격 경쟁이 더 거세질 수 있습니다.", "refs": ["bio-innovent-credit5"]}], "priorities": [{"head": "비대면진료 사업자는 처방일수 시나리오 두 개로 수익 모델을 다시 짭니다", "body": "30일 예외 유지와 14일 축소를 모두 가정하고, 기관별 30% 상한과 의사 1인당 월평균 500건 상한이 파트너 병원 물량에 주는 영향을 계산해야 합니다.", "refs": ["reg-telehealth-rules-comment"]}, {"head": "약국 체인·투자자는 11월 27일 전에 계약 구조를 법률 검토합니다", "body": "매출연동 임대료나 경영 위탁 계약이 ‘둘 이상 약국 운영’으로 해석될 위험을 점검해야 합니다.", "refs": ["reg-pharmacy-network-ban"]}, {"head": "SC 제형·기술이전 기업은 파트너별 협상 노출 시점을 공개 자료로 정리합니다", "body": "관보 게재로 규칙이 확정된 만큼 시장의 불확실성을 줄이는 투자자 소통이 필요합니다.", "refs": ["reg-cms-negotiation-fr-alteogen", "bio-ingenia-msd-option"]}, {"head": "병원 AX는 촬영·회진 기록처럼 판독 전후 업무의 효과 지표를 마련합니다", "body": "재촬영률, 피폭선량, 의사 기록시간처럼 측정 가능한 지표로 도입 효과를 평가해야 합니다.", "refs": ["ai-samsung-gc85a-fit", "dh-mediark-symptomy-care"]}, {"head": "AHA 2026 AI 심혈관 레이트브레이킹 결과를 한국시간 10일 새벽 이후 확인합니다", "body": "WATCH-LV 등 스마트워치 AI-ECG·AI 심초음파 RCT 결과는 한국시간 11월 10일 00시 45분 이후 공개됩니다. 다음 호에서 국내 심전도 AI 기업 영향과 함께 다룰 예정입니다.", "refs": ["ai-amc-otoscope-ai"]}]}}, "archive": [{"label": "제20호", "date": "2026-11-09", "count": 15, "current": true}, {"label": "제19호", "date": "2026-11-08", "count": 11, "file": "https://drive.google.com/file/d/1sn_NtVlnclAYCDO4qE6fkmppWBNKz3FB/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제18호", "date": "2026-11-07", "count": 22, "file": "https://drive.google.com/file/d/1V-z-H2MtL6bF_BtHG4EkKbZ_EiSZydfX/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제17호", "date": "2026-11-06", "count": 24, "file": "https://drive.google.com/file/d/1ADuvdxOu7M3l4jjE3BCzib_sLRfX9iQG/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제16호", "date": "2026-11-04", "count": 20 본문 미열람)"}], "verification_note": "논문 원문(JMIR Medical Informatics)은 열람하지 못했으며, 수치는 언론 보도를 기준으로 했습니다. 논문 온라인 게재일은 확인하지 못했고, date는 병원이 결과를 공개한 보도일입니다. 참고로 AHA 2026 AI 심혈관 진단 레이트브레이킹 세션은 미국 중부시간 11월 9일 오전(한국시간 11월 10일 00시 45분~02시)에 열려, 이번 호 마감 시점에는 결과가 공개되지 않았습니다.", "image_concept": "A small otoscope resting beside a glowing lens that magnifies a faint pattern into sharp focus.", "img": "data:image/webp;base64,UklGRkxBAABXRUJQVlA4IEBBAAAwAAKdASqwBCADPpFIoEylpDSzITN4upASCWlu/+ZrL65otkn6j/PnsS/g+5n/uZo3Rk27e468nhAuFcxG0X9KZtCEfM9MPk/emL1Lc7l5tt9b/4LJgZ832DtR/a/ELyM7eDsPMLvv/0/N7+E/2+vf/ifNR6xngsGR9NWniA77T3w8UOmrTxAd83iA75vEB3yi9SPQjQ29SPQqnbiBok3hw41K9FGwBE5KaFyivG7fp3zfBif7sZe+cQNFZfTXzAnbqIE+hWJl+ZE/+Pz1K/X6Wm7ih01UchEBjqpGBN7FZUN77wNa5Zcx2c+KK0LzHSggJTuq3npmDpyG7J+SWgdjGWVLMhcMzD84LThEngaKzRmpExySJU3fJYSlfCop0hw8K+t1bFNARX1EGBmtfcuf+iF1LkrI6p8UQioPUedRPX/3wYXmiIvcgnJd46nr1WUyuPshyUx6iplmWrt63uQQV1Z1YjClQpFmMU/LhlPib1T15x/yWDIaRegAIne9NFTsGIDzeAu25ckd4bcu06sL37qXNThWIT/1GYDm8+6fFIZ7A1MBX/JIoun5jpxE6rTeQWxla6N6EaOK3aJ0MiAr58LKF3YzVMYf6Wgdf9VTi0z4fTVp4gO+bveK2GDNU8P9RiJiEdZtAY34t0+KHIqf+CNL29nSfEKjBCBGaq08OHo4r58P9LQOxjN18U6ja8Xs7tuwkX1uq5YPovPI9MvGID0I0zFTFVudd26qmfpQkfzoMJ7MbsKSpTROEasid4JKvGCyp25ZAjIbdPUTxAdqhPD/WCKcyXrpbRjxXL2/LcrZS/d/m71LG1HP+23LNeajeHAhGbTE13T6sRpHIREN0IMss2HS+UoGBQ5FGIDr/qpnYkjupMljqPyPgz2y3IlGWWzOONgog6DIPp067OMqPYC/rJpJVYCYK8k5RXfc3sYZ9Q4hPFMlJunxQ6t8RO6vPUa5sCnsdqkcp38s0xMTneE4/YeyAmxfTXJUSCo4YVk4h06UOP1JgxsqcodjZS7IKj/fnqCGpRkzOl+CBUjCCXSWrZ1YVtgxwQTr0UyhSb/EDojkuIBGBpevVStWvRP9kJKO+ToOiKxoD5WcZqTBk/L2vRg0ODWz3gRpwCr2kxHiEaUvBu7Z/Ga6ywbonDYgUEBIQdVHcsVIfFCp9DzHSggJToqVCyJfspu84zspVTfyb4+Equ0v0AM/o4qyeDAnYJ/PCSny4whCoGAFPbPo5BKuEoMZf/k3kUm1eWTT8KrXGQ9OmaihOlNw/Z/JlWPdTJ7Z6oO8vUby/ycsJPEC9BRYLskJCBoiPUR5BoE9ed6ujKBqsfmi4izLmWwnAQjwhVKpp4fgR1PIYFf0noed33C9B1WVW5N3a9KqTLyUSQLT4hTufZsnoISA//QmsKy7ff/+0eZ9tdPxCjfm3EPMhN2oqDShZydzAx+YnyYq9Sq5BZ2JSNGCJJAemisvpq1LQP8O5yqM6dl8k40uSe4J1W5g+OF21UCF72aIKbweXPx3dRKPnPI/OGZ58lb+KEnisPh/eUH1tMIHzRtuUpbpk0oPYL  child-sized empty bed.", "img": "data:image/webp;base64,UklGRs4fAABXRUJQVlA4IMIfAACQXgGdASqwBCADPpFIo0ylpCerILOIOWASCWlu/7To9159y4N/Jtf4pG7PMwYLj+jV6ddGvcf+X4iNKO6pJLvRIYy8+msJrBl6btw1zvFja5Nz8H/az2AXEHrxUevtwROtd2b0iJ0n5JpT9NPA5xXCXD7+G5v37IOjX1g4cI0Nl69evXr169evXr169evXr169kuePHlyrHjm1qnNGMdGljgzfuCz/g2O4qyQ/DrDiNLDw4Wb37g7coAWMRpYl5epxwALL16DtHQFhcM6TlOi8qCJkihBQTgNQkXlZvPewcbL049hIgX5olqFhQo8NWreW/+iZMmTHyVyBG+DqkePHssZGs7IRyIyPsBcN1pKsZEiRIkjCw4PFu2B4WZ7+4cN2lJ1qFyDCwoUKHXy1vnlioX1pZ/WEzpyYRgulzZu9PrvcDvomTJkyZM5+0TJahYUY3+nK1atkJBZpPChYVnCVMB3Fahz1iQHyl0uQsI6Z40UCFjGaqGb/ZxQcOz2BkexcO2dOTkmFAgQIEB8pk4VpJvBpela3Vnwj/olEicRXwZgREP8pk2bNhEUukfpZs2bNm5aZOmDj5TJ06PdeyXHPkLFhBUJK0nsNhxhw+ovyy5/jjMjt/3/XWGTfHKE6ljim+65SUQY9lHLCtjF4MnTnTn1Bopw2HvXaPFw3WXPZRC1QIi+nTNbr19E45iK1UVi/kRU9hvxZKgIQ+y+r6Knp/GfxhW0AKK9rSLD1M2839dBPYbN8E7zCXcGcj2LMcF6LT5CxTdp8hYsJbTBaP5gfPYYqS8zrLicSEEghYcdYrUc2sWMacZCpQT4pJ3BPYeHD0IWb32d2XPXHjz/9jj9/EoJo04ClbfTeh/tMC/3HU9OP5ITfOhSDjm2DEUFfEC1H7Yoecdua67rKT2PlqJOvXyDMXvwgAB2//3Fcf/2ewFVNa4bv/zqiyNZ0sSGM897gm8GmpHpI+iQERMmPny7fa/i4cWCMogcXdJKvzhXNK4u2d5Pt2s6Jl2dTwAdEiZuTeslkK04a/omTKSeI6rxBW35jyFJS4sgwzUE5TylEhqBeN3/SvHmnjk4C9+ivscPun9Dp4EI96snEr5xs/TlO6SkhKWOLyuCdvZ3Qqa31kAQ2sWKeChQoTRJCnsYNoKK0tQe77oKFY9fqkNnSllzd6tOVyFwEpCjIePJKPTZNXQxuDkygHhw4dl6O44cOH2ZB36kW4GYSrgDfXFVqA6ifcoooUFozgl1fpeXqcXvV2RrKNT0LsW+4WECvXqenpp7Wmqgm9HI56xMwWN+Jz1MjaH5tysqYIeHrGh8j87rSSYjCSsBcOHC0P9d/hH6NHi6oS9jIc5VfqR3U8UR6oVlFLWkifT7Vyx6/Y2b5qx32d2XMvQDqCJ72nrWULRtYsHXbdT3A7SPpEaOXjr1nUfiSkjBB8FyGdJgBI7FOmFY4afyls2S2DfRjAXEtJ9YHjzRHjm/Nlm7SQsae2GzSL56WVSoLPtGB4cMzzvX7CLl21QTKike3elYp3W/nw4nweSV+/b3M5K3Yfu2ACPX97vfuxZbOnSxbx7ShO71LFvJj2BWep6dQ2Yd/nbVcNnQukB0cTnO9YJ4Perto1sesoVoOwNqTsnVdnzTqmwAV24KWYoCcx6uZ0MWNZ06wmcIwRE3vMuLjYwf7FCCj51ILXi7vVD95IyajrnbjS1WGjkEAI5fICZ6Vuemgi62yIiZQDw3WpuPhsNh2AfsitG5ekXV8DSxAdmOyWdkUrEwT2zp6hDCrrZaxlSf9EyZLbzukqYrFRzGlhRu0H8LTbBm68Nnc1qp9TZsymFDwwRs+pyZwcm6XCW//r4LOOq0CRoBSE5bp7fO7RLPvXg36737+nK1ZoI1TVvgFim8RkF5Xkk7br6tdHqIi2KsqnvYEfJF s-solution-to-inform-pre-launch-planning-then-follow-treatments-after-approval-and-into-clinical-practice/2464948", "verified": "원문 직접 확인(GlobeNewswire 보도자료 전재본)"}, {"url": "https://www.globenewswire.com/news-release/2026/11/09/3398090/0/en/truveta-launches-care-insights-solution-to-inform-pre-launch-planning-then-follow-treatments-after-approval-and-into-clinical-practice.html", "verified": "검색 결과 스니펫만 확인(본문 열람 시 403 차단)"}], "verification_note": "수치와 사례는 모두 회사 보도자료에 따른 것입니다. 4월 Truveta Intelligence 발표 때는 1억3,000만 명 이상이라고 했고 이번에는 1억4,000만 명 이상으로 늘었습니다. 가격과 고객사는 공개되지 않았습니다.", "image_concept": "A clear hourglass whose falling sand forms a branching river delta at the bottom.", "img": "data:image/webp;base64,UklGRlA2AABXRUJQVlA4IEQ2AABQzwGdASqwBCADPpFIoEylpCorIVMIkWASCWlu9+zdPzunQS53G9FEN09OpRvh9FLfND5zzDPkf/bzn+mHcS88t54EPmcqP8zcSxd/OdmxO72czJMAffJT1P0vQ56c+LAeK/9vOr9xBH67F5n25n25n2wGO7i8z7cz7cz7cz7cz7cz7cz7cz7c1vz0RivoeSXyXwyTD43xeZ7AgptmjYiASca/rUN55u2D4AVuxilKCRSIW6xuEt2Nxpkt1s9tvaDyHOAdlDIXhNJbXPNC0uBSMiM5sLT34IRQy61hEUCukFk4nBR8j/cpScuSIhOXF00S3YngnQ5bG4kYtN+uoAuL8oHiDuTMpZDcRetwlu5gXlyjauVnTPPGK8BkS3Q7sXTTRHZeZ9uZ9hQv+8zwvdQKYXENuPOXF5NSiRAMs2FvCogveect2J3hS4pJSNwZWcMN/m5gLc2Cpr0jPMtkR12EJbvXHudMbeYBdZeMeQjL1p/vFaBLxjE0ChJk/Kx0HQWoKod1vYNyobY/SoI0FdGdkySjLv6D4DddmJ6U8RflvGFFNj8P6Kpcfwc9ngM3pMCJ8C6ZIPZP9+fYW86lDJ+JzPiFJH+3M9gQmHOBsT/LO//x4aSFcJTYuonQgCD/6ZK9aA7LezEBi6Z04QSJoaJzZZeI5DDyqKzuRQPfRFfrMURDg3uxO8KW8KW8Bkf78Fkxp3cNPhbwpMR3Xm8ZeFjjW2KDFAIWeyFNQxf7pAlfjyz9WFj6RdWYiy0cma9GZZ/wQpdy8f8iqy2Qp7StB4G6Fp9SC7NTPHFS8YqfW2DM+R/Yamew8UHV/F6GMDqgoHqnaBo/f9JSogt8jvHZOx9AaeOoa0p4H/N4QxOkoqfUatGK8kwRCXcpO6GXmgLKBeUl5n194RcF53bh+M+OBcJ5IAKmSvAw4uOINRQ7aGX0FG0hIx0VpzvRGK6eDcKz3V8ugddaWEwvLcuB+yf7Jbsozhm+9LzsHMzzZXK43j9UrrLVbRqCCS4n+4DP/WW8sb2CFPBpNeRqD5BTmjxleSATotDyZ4VRv7ztdb0Bt2pxBILeqbLWmuZn5mKvYb83avJ3OXFnxMRXS4b6w4YyEh2MDiS3YvJ3N9h3vBH7yF0eE2AIiqi5sRj7j8KBHe9IpA8pFsB+S3tzb8ZjMtJDIu56RgPBNMgJxru/dxRG83ytXbBYimeeMOIvW4S3Y3QHhbFg2qLK3DgQXoZRz2GZ8vZqggyevSv8qBdg6vFKLb9YQ  초진은 환자 주소지와 같은 시·도의 의원급으로 한정했고, 약을 약국 밖에서 받는 것은 섬·벽지 거주자 등 5개 환자군에만 허용합니다. 마감일에 약사회는 30일 예외를 비대면진료지원시스템 구축 뒤로 미루고 14일로 줄이며 재진 처방을 60일로 제한하라고 요구했습니다. 의협은 30일 예외 삭제(또는 14일 축소)와 초진 지역을 시·군·구로 좁힐 것을 요구했고, 원산협은 일률적 제한과 1회 예외 조항을 재검토해야 한다고 맞섰습니다.", "why_matters": "12월 24일 제도화 시행을 6주 앞두고 처방일수, 진료 건수 상한, 약 배송 범위가 최종 확정되는 단계입니다. 비대면진료 플랫폼 매출과 만성질환 재처방 수요, 야간·휴일 진료 비중, 약 배송 모델의 수익성이 이 숫자에 직접 좌우됩니다.", "strategy": "플랫폼과 원격의료 사업자는 초진 30일 예외가 남는 경우와 14일로 줄어드는 경우를 모두 가정해 수익 모델을 계산해 두는 것이 좋습니다. 병원·약국 파트너는 진료이력 확인 체계와 비대면진료지원시스템 가동 시점을 추적해야 합니다. 제약사는 처방 금지 목록을 고시로 추가하는 구조를 고려해 비만약 등 자사 품목이 포함될 위험을 점검할 필요가 있습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://mohw.go.kr/board.es?act=view&bid=0027&list_no=1492252&mid=a10503010100&nPage=1&tag=", "verified": "원문 직접 확인(보건복지부 입법예고 보도자료로 기간과 주요 기준 확인)"}, {"url": "https://www.dailypharm.com/user/news/344333", "verified": "원문 직접 확인(데일리팜 11월 9일 기사로 의견 마감과 단체별 요구사항 확인)"}, {"url": "https://dailymedi.com/news/news_view.php?wr_id=941564", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://www.segye.com/newsView/20261019513112", "verified": "검색 결과 스니펫만 확인(본문 미열람, 12월 24일 시행 전망 부분)"}], "verification_note": "11월 9일에 일어난 일은 입법예고 의견 접수 종료이며, 최종 시행규칙은 아직 확정되지 않았습니다. 복지부 검토와 규제개혁위원회·법제처 심사가 남아 있습니다. 단체별 요구사항은 데일리팜 기사에 따른 것이고, 원산협 의견서 원문은 확인하지 못했습니다.", "image_concept": "A pill organizer with only seven compartments open while the rest stay sealed shut.", "img": "data:image/webp;base64,UklGRo4wAABXRUJQVlA4IIIwAABwEQKdASqwBCADPpFIn0wlszewIvMYsvASCWlu+/fWNO3MyRjQ+rnmE2kZ/oY7yvMkp7vCYYcUnTcPfyxxy8f9DfUr0kOGbtmdvv79nZO68edOVl6suo8v/7eonSh/+YOCMJRNfIJ2sNJ7kyK7mbkf+o7oi10ea+G3TrztYaO5OvO1ic3UYd3w6K8GEw6eyvEbxpAhStszeDbIXc8GPQEPfOIZCDFprUxL2kzHItiZfOFYaO4SGFBbC5MDsEkdWPaclFibhqetH/r/ny91xqEsAmE/np1h9cGPd0N9Xett15onrsPSHW6WW9p1d0NblFtEXP9ZYAtkU5vu7Exa3J1d1ma7ob5xxBNBOr/1hMQRNC2F3Q1uUYdREOolA6NQo2zR+p1XMLZAHeET9cP06u3D3jS6v0iJip3YahrNa7sNXbDfi11+RcOeNb7e475EPR3tInTNwx3Qs1Ja43jO3nhhtiA9cGk6iL11LLIg3ECLEX93hl5djwyAhchwnOG3TrMMaeOVYeGuGO6GtydTnDn94e+ok CQmzAArZ66cqf6yAAAA"}, {"id": "reg-mohw-psych-inspection", "cat": "reg", "alt": "흰 병원 문에서 천천히 풀려 나오는 무거운 쇠 빗장을 그린 미니멀 일러스트", "title": "복지부, 입원환자 사망 잇따른 인천 원병원부터 정신의료기관 릴레이 합동점검… 11월 9~13일 시작, 심평원이 인력·청구 대조하고 연말까지 확대", "short": "정신병원 합동점검", "date": "2026-11-09", "scope": "국내", "entity": "보건복지부(정신건강정책과)·인천시·미추홀구보건소·건강보험심사평가원", "what_changed": "보건복지부가 11월 9일 보도자료에서 정신의료기관 운영실태 릴레이 합동점검을 시작한다고 밝혔습니다. 첫 대상은 인천 원병원으로 11월 9일부터 13일까지 점검합니다. 이 병원에서는 올해 상반기 입원환자 사망이 잇따랐고, 국가인권위원회 직권조사에서 의료인력 미배치와 부당한 격리·강박이 지적됐습니다. 점검 항목은 야간·휴일 의료인력 배치, 법정 시설·인력기준, 외부 잠금장치와 격리·강박, 입·퇴원과 계속입원 심사 절차, 기존 시정명령 이행입니다. 심평원은 실제 인력 배치와 요양급여 청구내역이 맞는지도 대조합니다. 연말까지는 인권위 권고나 민원·제보, 부당청구 의혹이 있는 기관을 추가로 점검하고, 발달장애인이 많이 입원한 기관도 점검 필요성을 검토합니다.", "why_matters": "인권 점검과 건강보험 청구 검증을 한 번에 묶은 것이 핵심입니다. 위반이 확인되면 형사고발과 과태료, 행정처분에 더해 부당이득 환수까지 이어질 수 있습니다. 인력 기준을 채우지 않고 입원료를 청구해 온 정신병원은 재정 손실을 볼 위험이 직접 커집니다.", "strategy": "정신의료기관은 야간·휴일 당직 인력 기록과 입원료 청구 근거가 서로 맞는지, 격리·강박 기록 서식이 법정 요건을 갖췄는지 먼저 스스로 점검하는 것이 좋습니다. 정신과 약물이나 디지털 치료 사업자는 점검 이후 인력·인권 기준이 강화될 가능성을 사업 계획에 반영할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503000000&bid=0027&act=view&list_no=1492478", "verified": "원문 직접 확인(보건복지부 보도자료 본문 열람)"}, {"url": "https://www.korea.kr/briefing/pressReleaseView.do?newsId=156788452", "verified": "정책브리핑 게시면에서 제목과 날짜만 확인(본문은 첨부파일)"}], "verification_note": "점검 기간, 참여 기관, 점검 항목, 조치 수위는 복지부 보도자료 원문으로 확인했습니다. 상반기 사망자 수(4명)는 보도자료에 나오지 않고 10월 인권위 발표를 다룬 언론 검색 결과로만 확인돼 제목에 숫자를 넣지 않았습니다. 추가 점검 대상 기관 수는 공개되지 않았습니다.", "image_concept": "A heavy iron door latch slowly being unscrewed from a plain white hospital door.", "img": "data:image/webp;base64,UklGRj4iAABXRUJQVlA4IDIiAAAQXwGdASqwBCADPpFIn00lo62ooFEImbASCWlu1NwVieQIR88HyaAiup8J/qxLfb9jTn/+zfp93a+QkeDQX//t9MfpcVNf3l6WTZBtjhQn5LcfCwSAw18RB9oVCga6mviIPp8rHi0un0JtLp9CbS8OzzuGS3TGzxaFFRhWeuWwrxeoFjIPdP6W/FoYGzdaeHv62KZYaV1LT5wlq6hrC3Pjx5mwuUxMAwmmO5XMssF0+b9magdCU2ldTXCcQfTXxFxcSiQ1habZi3Pvym7Y/1SnSmmXk8S4fejuQfQm3ZJfKb+cmjF0QQy6cOPBmVSrgrKG e.com/news-release/2026/11/09/3398164/0/en/edesa-biotech-announces-agreement-with-kyorin-pharmaceutical-to-develop-and-commercialize-paridiprubart-in-japan.html", "verified": "검색 결과 스니펫만 확인(본문 403 오류로 미열람)"}], "verification_note": "계약 조건은 SEC 8-K 보도자료에서 확인했습니다. 3상 수치는 회사가 보도자료에 인용한 것입니다. 8-K에 Item 1.02(계약 종료) 항목이 포함돼 있으나 무엇을 종료하는지는 확인하지 못했습니다.", "image_concept": "A single pair of lungs carved from glass resting on a folded paper map of an island nation.", "img": "data:image/webp;base64,UklGRq4uAABXRUJQVlA4IKIuAABQ1wGdASqwBCADPpFIoUylq7iwobKokxASCWlu8cVjMdUIwZRDnvWFrlzvNoWVMjlwUV3XTofT/2Ub1Bf3vEPrzEvrb2bxOA2dvP7NxqEIdwpBi/bjSl+H6I//4CRmU1U+KFmw9BVLqp8ULNiTsevqp8ULNh6CqXVT4oWbD0FzKIFnNEumqYNhaapOelAAeh45y38ye3WNpZ1TNU1U+KGZ5bNixufD/DT+bKaqfFC0IvV8Bm2AFr1tud/HZU4OIC8Wqruxh81oVTVUDCA9BVLqp8UHNKaqfQSBsJVT5eyvpqoktVM3XwcQGwlVPhS+jZRvE2Eqp8UXAuUlCzZBfRAxGbz7xQtZzQNiN4jtYKFqYaV1RaqfFBzSmqubqXJfrEdNqnygIqBsPQVTQGPq45lNO6hkvpoSKrJwcQL1MBVLhAS9kPCzYegQUdxsM1T1E1S6QZTVV3OVfBxAlOw9BUz/6apdz+Htj4HxQs5B2mqpap8YC0qX4WbEZpq2Aql1S4pg5w4aU/m2vmPFFv6apOqFm6BlNWwYIgYRyO1gyP+HoKivqyLZvPwYQHoK5yobNTuql1U+Jtnf07D3K9fc+8kUKpg51ioGwkGyGFHp7eU07+PFioGU2fDfgtODytd72jwUGa0GoPdes+Wzomqad1UuqWQo7DzcsC+Hm4ULLmdVaVA2HoEA9/TVLg2QwoVmgRg5J6+5YgTRt6GE2EBMp63FCN9VukGJgu1ewAegql1UzuEr2MPQkAGsNCMn0+ajJsQAdBhmUak7gu9vQtHkdiHmKjlxh2bDzi2/6apoWmqnxR66h8K/H+A2vunxN1wBXtvQIEhox9bQJOwammuGsDEwXayq5crBTql2NT6jQNh6BAASwH/KqJ/J6bN6M51PRCz309uZRBnB/Q81jMu1k/5SA3zKI1PihZtiKuCKxyUZSM4r2InzaNQ/jHNP6G7xTf/6743YpVWNWC67sM4gnEhR6KgJ1kKvGRQTyXcF3VsbxeNo5V13Ne81PWYuogF+DExiwAOnmY8ULN8hWPTVLq7wT8nYgnf5XEHRkl75St8eaB+YkoViNzH5kv+t/eCOAT3eS1LBOtTS1KOVh38ISjaV3ofaE3igffjLVljgo8g2PEKpVH30KLVqvq6kQB1vLKrOSolNSEid2gvVMnCUmzFxzYegrHQtYpmMemqd1Btr8pJn3TAEVh7NCVGjUQD8nk4/ufcPKEpJ5dBcTzElJRZS/PdlLTcd/knwAY3AcrFyWcyZdCH60EO+WsMWyfMDwS4D0gbdCYnxAif+N4kqwcePUYTjkH6iaqfUaBsVxcQGw9AgAPJqkQJDQrngL3ofW2ph7hvE2+ffaC7+1HM7nUcbQ+E5iRHO4HvsfpvCs5LuUnKpl2l+a9oj6j5mN9xhkuljbd0PJhQYuAc3W1RFR3tG1BAInQqQOwVlaz5xbwOjLemqXVLIUdh6Cv2G4YULNndNxioeXPm41 급·독점 판매 본계약을 지난 10월 종근당과 체결했다고 11월 9일 밝혔습니다. 종근당이 2025년 5월 122억원을 전략적으로 투자해 2대 주주가 되면서 확보한 국내 판매 우선권이 정식 판권으로 바뀐 것입니다. 앱클론은 허가·급여 등재·생산·공급을, 종근당은 허가 이후 대형병원 중심의 영업과 유통을 맡습니다. 계약 금액은 공개되지 않았습니다.", "why_matters": "국산 CAR-T 상업화를 앞두고 판매 파트너가 확정됐습니다. 네스페셀은 식약처 개발단계 희귀의약품과 GIFT 지정을 받았고, 재발·불응성 B세포 비호지킨 림프종 2상 중간 결과에서 객관적 반응률 94%, 완전관해율 약 68%를 기록했습니다.", "strategy": "개발사는 생산과 허가에 집중하고 영업망은 대형 제약사에 맡기는 분업 구조입니다. 종근당은 지분 투자에 이어 판권까지 확보해 세포치료제 포트폴리오를 넓힙니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.widedaily.com/news/articleView.html?idxno=303181", "verified": "원문 직접 확인"}], "verification_note": "계약 체결은 10월이고 공개는 11월 9일 회사 발표입니다. 계약 금액은 확인되지 않았고, 관련 DART 공시는 찾지 못했습니다. 2상 수치는 기사가 인용한 기존 발표 수치입니다.", "image_concept": "A single glowing immune cell handed from one gloved hand to another over a hospital counter.", "img": "data:image/webp;base64,UklGRlQnAABXRUJQVlA4IEgnAABQvgGdASqwBCADPpFIn0wlq62wItWoegASCWlu+8pstUiNy7KuB9y4reE7EuH2gJqqCu69W4tpd0Amt9NPr+/j4q9pv/O8cfg5PlrtbyOHeZngE77Wed/D0c+hWM8yHQ5LspjTzRq2ZCKxe0ICQEgJASAkBIPmSAkBICQEg+Zp1VF2oFKou1F06yB4Hr1tcvCBErIbfsEuu0UzpSD+YoHNYVzUw5v17GNfdRDkkPX0LgZbfg/kp2Bsn7I4z7yl1lEW53UZ2zIRW3xURTLs1RBlB/eF2vC7rtxExhICQEmodVf6nNO4VhW2kJdmQi/4P7zTL8fIEgJASAkBIEDHV5GmVZktfkKqyPIs5TA5LX5AkBICQEyPVkEIrCtfkCQEaKqFumpHanSgcKWWxUXbMlQbxW3HvuAkBIFQ/ZRnKWrZh5aHJvRjUtDktbz5GIiOiKw7jk5p+19DPswtUQmfIEhJzeciEZmQisK18/IV2ZCJmTsP2ntI+AXJ9knbc//Z1wcaTduxLXQqLdjCWyEVhWvyMRAVvOpRd0qQF1PWvzYUZ5/2bDmZb8fVLV5rDo+4EtfkCQEaJiQJUKMyOaqueNwA+ERV2yCKwrLdP6toYkBIp3UuOQ2yOZpkFgEEeDuOhpPrs7lzxmcql+lCpbenfz3z3ZpvhBpKW0DktbpPMqi7ZssatulzZkkx+0QWNtAhsLkt40BPi1fCXVBFfFdHYgY5MVO+da6iHuslxaRn4cls03AZjzk599x15/BaBGyx2OsYLtIkDNSFAvHCn/ZuLjQn5eNfjqUNHBxYmS4kmGz1sERfkg3sKgyg/tPFvw4NXkrrkBpoLFfRLaZiqB1wlAwrtr9jI2IE2pXf3h8aBRARqHInJbFEatjQMSR8KxdmZzIHDBxYt6RqFQEK40jKz5MkfJ1IVtnopE9ilGe7n4r1QHIKy2iNVQkSMeodQfxjeeSA5rCsue0OWXb8ttY9z2UXbJYCSz0CovjpS4pmxfoKYy0VHGgQEuxCp6TKyKfSLyKFWEmeI829myuBS6JYJbtaF5BGCJa89sLNDi4eefxPXJ+HQIS1+Q+ViqB6zHs5oXn6jgWnxPB1LfbCdHqOiqCwrZiQ3Ve   ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
