:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}

 허가 시점이 다음 확인 지점입니다.", "refs": ["bio-abclon-ckd-car-t"]}, {"head": "ARDS 항체가 지역 판권으로 자금을 마련합니다", "body": "에데사는 일본 판권만 떼어 선급금 1,200만달러를 받았습니다. 승인 치료제가 없는 적응증에서 지역별 분할 라이선스 모델이 작동하는 사례입니다.", "refs": ["bio-edesa-kyorin"]}, {"head": "중국 자국산 PCSK9가 단독요법으로 확장합니다", "body": "이노벤트는 급여 등재 뒤 누적 100만 명에게 처방된 신트빌로의 1차 단독요법 3상을 성공시켰습니다. 중국 지질저하제 시장에서 가격 경쟁이 더 거세질 수 있습니다.", "refs": ["bio-innovent-credit5"]}], "priorities": [{"head": "비대면진료 사업자는 처방일수 시나리오 두 개로 수익 모델을 다시 짭니다", "body": "30일 예외 유지와 14일 축소를 모두 가정하고, 기관별 30% 상한과 의사 1인당 월평균 500건 상한이 파트너 병원 물량에 주는 영향을 계산해야 합니다.", "refs": ["reg-telehealth-rules-comment"]}, {"head": "약국 체인·투자자는 11월 27일 전에 계약 구조를 법률 검토합니다", "body": "매출연동 임대료나 경영 위탁 계약이 ‘둘 이상 약국 운영’으로 해석될 위험을 점검해야 합니다.", "refs": ["reg-pharmacy-network-ban"]}, {"head": "SC 제형·기술이전 기업은 파트너별 협상 노출 시점을 공개 자료로 정리합니다", "body": "관보 게재로 규칙이 확정된 만큼 시장의 불확실성을 줄이는 투자자 소통이 필요합니다.", "refs": ["reg-cms-negotiation-fr-alteogen", "bio-ingenia-msd-option"]}, {"head": "병원 AX는 촬영·회진 기록처럼 판독 전후 업무의 효과 지표를 마련합니다", "body": "재촬영률, 피폭선량, 의사 기록시간처럼 측정 가능한 지표로 도입 효과를 평가해야 합니다.", "refs": ["ai-samsung-gc85a-fit", "dh-mediark-symptomy-care"]}, {"head": "AHA 2026 AI 심혈관 레이트브레이킹 결과를 한국시간 10일 새벽 이후 확인합니다", "body": "WATCH-LV 등 스마트워치 AI-ECG·AI 심초음파 RCT 결과는 한국시간 11월 10일 00시 45분 이후 공개됩니다. 다음 호에서 국내 심전도 AI 기업 영향과 함께 다룰 예정입니다.", "refs": ["ai-amc-otoscope-ai"]}]}}, "archive": [{"label": "제20호", "date": "2026-11-09", "count": 15, "current": true}, {"label": "제19호", "date": "2026-11-08", "count": 11, "file": "https://drive.google.com/file/d/1sn_NtVlnclAYCDO4qE6fkmppWBNKz3FB/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제18호", "date": "2026-11-07", "count": 22, "file": "https://drive.google.com/file/d/1V-z-H2MtL6bF_BtHG4EkKbZ_EiSZydfX/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제17호", "date": "2026-11-06", "count": 24, "file": "https://drive.google.com/file/d/1ADuvdxOu7M3l4jjE3BCzib_sLRfX9iQG/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제16호", "date": "2026-11-04", "count": 20 t": "떨어지는 모래가 바닥에서 갈래진 강 삼각주를 이루는 투명한 모래시계를 그린 미니멀 일러스트", "title": "트루베타, 미국 환자 1억4,000만 명 이상의 EHR·임상노트 기반 ‘케어 인사이트’ 출시… 제약·의료기기사에 실사용 패턴을 거의 실시간으로 제공", "short": "트루베타 케어인사이트", "date": "2026-11-09", "scope": "글로벌", "entity": "Truveta(트루베타)", "what_changed": "병원 연합 데이터 기업 트루베타가 제약사와 의료기기사용 Care Insights 솔루션을 출시했습니다. 매일 갱신되는 미국 환자 1억4,000만 명 이상의 비식별 EHR 데이터에 경과·시술 기록, 간호평가, 영상판독 같은 비식별 임상노트를 더해, 누가 치료를 시작하는지, 처방이 실제로 조제되는지, 왜 중단하거나 전환하는지를 거의 실시간으로 보여줍니다. 자연어 질의 AI인 Truveta Intelligence가 포함되며, 지금 바로 이용할 수 있습니다.", "why_matters": "보건의료기관 30곳이 참여한 데이터 연합이 출시 전 계획부터 승인 후 사용 추적까지 다루는 상용 제품으로 확장한 것입니다. 병원 EHR 데이터가 페이어·제약용 실사용근거(RWE) 상품이 되는 흐름을 보여줍니다. 공개된 사례에는 경구 위고비 초기 사용자의 3분의 1 이상이 GLP-1 신규 사용자였다는 분석과, 2025년 IUD 시술 환자의 95%에 통증관리 기록이 없었다는 분석이 포함됐습니다.", "strategy": "국내 병원과 데이터 기업은 비정형 임상노트를 비식별화해 상업적 RWE로 쓰는 모델을 벤치마크할 만합니다. 다만 국내 가명정보 규제 안에서 노트 활용 범위가 어디까지인지를 먼저 검토해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.manilatimes.net/2026/11/09/tmt-newswire/globenewswire/truveta-launches-care-insights-solution-to-inform-pre-launch-planning-then-follow-treatments-after-approval-and-into-clinical-practice/2464948", "verified": "원문 직접 확인(GlobeNewswire 보도자료 전재본)"}, {"url": "https://www.globenewswire.com/news-release/2026/11/09/3398090/0/en/truveta-launches-care-insights-solution-to-inform-pre-launch-planning-then-follow-treatments-after-approval-and-into-clinical-practice.html", "verified": "검색 결과 스니펫만 확인(본문 열람 시 403 차단)"}], "verification_note": "수치와 사례는 모두 회사 보도자료에 따른 것입니다. 4월 Truveta Intelligence 발표 때는 1억3,000만 명 이상이라고 했고 이번에는 1억4,000만 명 이상으로 늘었습니다. 가격과 고객사는 공개되지 않았습니다.", "image_concept": "A clear hourglass whose falling sand forms a branching river delta at the bottom.", "img": "data:image/webp;base64,UklGRsI4AABXRUJQVlA4ILY4AADQzwGdASqwBCADPpFIoEylpDEoIXTYiiASCWdu+CO7q2cvo/WQzrm7Oe8xVvcOHZy6F/vZphRx28+458kI7+/8oPo/QDtr+Q+nv3i+hfxP+885Tpjzwf631D/x7+9/r58A36neev+2/uk/uH/R9Qf9d/6/rmei7/leoj/gPTy9TP91vYf85T/5ey//bP/D6Y3qAf//25em3kXt2d+tDPG/9FuTOzmYSgA786dh/CUfmgieI 52&mid=a10503010100&nPage=1&tag=", "verified": "원문 직접 확인(보건복지부 입법예고 보도자료로 기간과 주요 기준 확인)"}, {"url": "https://www.dailypharm.com/user/news/344333", "verified": "원문 직접 확인(데일리팜 11월 9일 기사로 의견 마감과 단체별 요구사항 확인)"}, {"url": "https://dailymedi.com/news/news_view.php?wr_id=941564", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://www.segye.com/newsView/20261019513112", "verified": "검색 결과 스니펫만 확인(본문 미열람, 12월 24일 시행 전망 부분)"}], "verification_note": "11월 9일에 일어난 일은 입법예고 의견 접수 종료이며, 최종 시행규칙은 아직 확정되지 않았습니다. 복지부 검토와 규제개혁위원회·법제처 심사가 남아 있습니다. 단체별 요구사항은 데일리팜 기사에 따른 것이고, 원산협 의견서 원문은 확인하지 못했습니다.", "image_concept": "A pill organizer with only seven compartments open while the rest stay sealed shut.", "img": "data:image/webp;base64,UklGRiQxAABXRUJQVlA4IBgxAAAwwgGdASqwBCADPpFIoUylpDGrIbMocjASCWlu+9ZTwsAaE0/7eO8jXBu/6Pea6zIWtQDXNdv/xu6z31+39KnHW73/p+Z/0B+cPap/2PW//ZPUA/erpg+Z3z0vR36AH6N/////+/16rPoAecr/8Pax/0mTxzKm97k3cg+j7t/bO7Xf33xC3w/kz+Z452hPgzybeCCeW40v/CBHu3eHd42Muum9i8z0BGXXTexeZ6AjLrpvYvM9ARl103sXmib02noDdCnl2HfW0Yh1buUXQWXXTYoXeSng3hi3ABlV//S/pitFf9lbzhMw44Mo/XTexeZ6qxTYbsHnEJeTq2rRXJeZ6AjLqWMTMYG/cLirGNQddj+raaB9gbpKZsGRnQyx84YkRvirlhB5vYvM9CCitHNfPW1gBfsc0ZkJG1j+q2rbqCkmbDdg88G7F5noCMuum9kQCCytomCSPE+MIE9dIPbP/3P3KLacAj3/ukCT6jxIxGzCsTLcW28h28gp38XsmMZi07/IG8E7NIw0tSBpaN0kM2z7pll2C7jueZWy+lsQkrLhlQpZZN3wGEqDraQZmE0btpAuVI1O4EN23Li1dNhWWWeb5DO/QJJmfERvKJgem4V59vJTvkRbaXxVnfqHE8qHHeNaN0lM2ECIo9c0Mp/V/4rduMIzGBpIo/nE0LyHJmw2/Q45pLRpaFq9/8/qhW7E/leQJGfpf0m5k6Ka/PE8sxEu/i8z0BGRQROY8lH1ZaMN04D9XYzyW88G67Ns3TeOyclN7It71Lv6r/sWBz6tzPQEZddNih0Y5a5Y94fqjKkTdifzHcCRN2LzK3/tgYwFq9/9ATZtGZTYQegxCmOskXfXl67l1s/lWMTfLd4cxydBE5C8rU0xauko+qMoQs6b2J43k79nNcM+b7Pb+1gfnZURywQ0Mh/NTexeZ6qD+l/LHkyoCMtwUolXmr1hMgbNEQO0YaWjdN7F04Af4pCAxgbrZ//OJodFvPaP/GIqUf0GqaiJhEx2DzexeTvW+OFXfFHiDGyqRDSwq4oZSNRVimDlzD3jsExpfI0ljFqt6oiMmRk3lvN66aZnrHNGG6a9rcY/BCR3h1yGCb8rY9Or0zAepiTwPbBu7yeg02szpGLC6YarLtLf8JxTkXDwvb65dhj38MUT7VALzvuccYF/cVN0NxqTJBv4pNBsCzWQK199Fe1RW9ol784J2MdTJhDC2QmATj8EKvK1V7g/IwdH1EsEPDWi4w2rO 검 항목은 야간·휴일 의료인력 배치, 법정 시설·인력기준, 외부 잠금장치와 격리·강박, 입·퇴원과 계속입원 심사 절차, 기존 시정명령 이행입니다. 심평원은 실제 인력 배치와 요양급여 청구내역이 맞는지도 대조합니다. 연말까지는 인권위 권고나 민원·제보, 부당청구 의혹이 있는 기관을 추가로 점검하고, 발달장애인이 많이 입원한 기관도 점검 필요성을 검토합니다.", "why_matters": "인권 점검과 건강보험 청구 검증을 한 번에 묶은 것이 핵심입니다. 위반이 확인되면 형사고발과 과태료, 행정처분에 더해 부당이득 환수까지 이어질 수 있습니다. 인력 기준을 채우지 않고 입원료를 청구해 온 정신병원은 재정 손실을 볼 위험이 직접 커집니다.", "strategy": "정신의료기관은 야간·휴일 당직 인력 기록과 입원료 청구 근거가 서로 맞는지, 격리·강박 기록 서식이 법정 요건을 갖췄는지 먼저 스스로 점검하는 것이 좋습니다. 정신과 약물이나 디지털 치료 사업자는 점검 이후 인력·인권 기준이 강화될 가능성을 사업 계획에 반영할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503000000&bid=0027&act=view&list_no=1492478", "verified": "원문 직접 확인(보건복지부 보도자료 본문 열람)"}, {"url": "https://www.korea.kr/briefing/pressReleaseView.do?newsId=156788452", "verified": "정책브리핑 게시면에서 제목과 날짜만 확인(본문은 첨부파일)"}], "verification_note": "점검 기간, 참여 기관, 점검 항목, 조치 수위는 복지부 보도자료 원문으로 확인했습니다. 상반기 사망자 수(4명)는 보도자료에 나오지 않고 10월 인권위 발표를 다룬 언론 검색 결과로만 확인돼 제목에 숫자를 넣지 않았습니다. 추가 점검 대상 기관 수는 공개되지 않았습니다.", "image_concept": "A heavy iron door latch slowly being unscrewed from a plain white hospital door.", "img": "data:image/webp;base64,UklGRuAgAABXRUJQVlA4INQgAADwVgGdASqwBCADPpFIn00lo6oooPEIiUASCWlu7lSfu3eA56PlJGAfL4rXhKQZ5u6Ttf+Z/geeI7307tC7t/Mn92/jfOR/yP2A93P6d3ufmK85n0s71T0U3rY/33JxaGbkB16alhqwHo4OFJIYPrXRH1roj610R9a6I+tdEfWuiPrXRLC84j3dXrXM/EUImr1roj6aw1P1ZvuukOFI2b10tZj3VCJq9NYR8kiPXFKPXRYcKLnZAMvOJLPyRd2JtR8KnyBacfJBwpJDB9a6I+tdEfWuiPrXRH1roj61zP7PBl5xHvDuR68xsxMfIpzcz8TU+2vWuiPrOLpDhSSGD611ZfPkg4SAR4KSQyAGKN1etdEfWuhi7ziPkkR9a6Ivtr2mSDhc7+gaNui/6mE1euDF7VV5lvoj6zjj3dXrXRH1suN1gEgTV64RHrfPkg4Uy3mDzxwMmtdEfWuiPrXRH1rokJST0kLyWu6PXFrqdc0BVdch8aL8xl5xHu6vWuZ99MZWDMjzeSPrXRH1rquRYPcbVDS711KOgkw5nHoOTPUkg0OFJIYPprCPd1es445L6mE9btR8kiPrYGOAyukIX9f1/AnqQHK+ijTvqtFGnac3VqmkOqimRBhkM9JdEgCJIOFJLfPvpjL5s8C/UKSJCQexg+8YmMkmk9rJgX5alWg9ntNmipsTagWnHyP7vPz4k1rok7/dw+CI1roj62PugdBIOoLatMnnc94y3sT6SQwfWuiPrXRH1rok7/JB0+M4491Qxpvd5GJu4O56CamBUX9zRPc9tntBOdq9f15keRrwh3ap0X2PCkkLxdYMwPQcKZbz 형 전환 플랫폼 기업 알테오젠 주가가 16.01% 떨어졌고, 언론은 미국 약가인하 우려를 원인으로 지목했습니다. 알테오젠은 입장문에서 협상 의약품의 실제 순매출 감소는 일반적으로 20% 미만이라고 추정했고, 협상 대상인 자디앙과 엘리퀴스의 매출이 각각 32%, 21% 늘었다는 사례를 들며 SC 전환의 경쟁력이 여전하다고 주장했습니다.", "why_matters": "새로운 점은 규칙이 관보에 실려 법적 효력을 갖추게 됐고, 국내 상장사 주가에 즉시 반영됐다는 것입니다. 피하제형 전환을 특허 만료 이후의 수명주기 전략으로 내세운 국내 플랫폼 기업의 기술이전 가치를 시장이 다시 평가하기 시작했습니다.", "strategy": "SC 제형 기술을 가진 기업은 기술이전 파트너의 협상 노출 시점을 품목별로 계산한 자료로 투자자와 소통하는 것이 좋습니다. 메디케어 비중이 낮은 적응증과 시장으로 포트폴리오를 다변화하는 방안도 검토할 만합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.federalregister.gov/documents/2026/11/09/2026-22792/medicare-drug-price-negotiation-program-and-medicare-prescription-drug-benefit-program", "verified": "Federal Register API로 게재일·문서번호·요약 직접 확인(본문 페이지는 접근 차단으로 미열람)"}, {"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80626", "verified": "원문 직접 확인(알테오젠 입장문 관련 기사 본문 열람)"}, {"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80628", "verified": "원문 직접 확인(11월 9일 알테오젠 -16.01% 시황 기사 열람)"}], "verification_note": "규칙 내용 자체는 제18호와 같습니다. 이번 호에서 새로 확인한 것은 관보 게재 사실과 국내 주가 반응입니다. 주가 하락 원인은 언론의 해석이며 인과관계가 공식 확인된 것은 아닙니다. 순매출 영향 수치는 회사 주장입니다.", "image_concept": "A small syringe casting a long shadow shaped like a descending price chart.", "img": "data:image/webp;base64,UklGRtIZAABXRUJQVlA4IMYZAACwOwGdASqwBCADPpFIok0lr6croJCIKfASCWlu+/iRgOgddfX/9dhI3Hq3c37li6OfVRp8bjbzXEHtMZL9DP0OpFVwHoA5wD2ht6CyOOflzEzZ469qz+3+kJAscF+wf0z1FJrP8no69O/C4NLaT4ckSrzW19Os9cs1Eq81sbLT6y1C1tfTp06dOnTp06dOnTrM15ra+ooPh7knf0Xk09onUWe1Aq+JTW5pqsNfWUFdub7Dgbr4OH5IGvOC+a4FGvd2CT6h12t9mjwvwwjdzXSajk4oa/ILYUXFK2hxFPCos3zX04Ftc1h54aWUBkldLrrFXC8ofJoxo22em3PDE1b4I6HmhZpmJyay2gxh3e+GwONjMeNSd9Sdf6XYB9poDCs3f5sjL2uD4QieK5/5vIqcltnAD94AjJz8Iet44CEeht4lLyh8odUeM28dRhuVesX58Pcb6eydVDf2BI8g0Dwv4AUIai8uGC8RH8ule56ASxDO4v6wqUS0MJ/whXqmpHC+WrEhIxnm8VkfgYDIfA/njY8IFCuEPMQuhiXCgMbOkMufSIQLXpj6aSUVb3HCZPrJpnEVHK3FMPmbl76R/hRy7nmETL8XB7jvIjrEQMmhfUZ79+tfR35CpEaJolYQNmSq3d7WdHeTLglpN6kwKMtFd1l7LqmirKSMkTCpUVtDllSKhL7LeqDdZSUR6s3m lobenewswire.com/news-release/2026/11/09/3398043/0/en/unnatural-products-to-be-acquired-by-argenx-for-up-to-1-15-billion-to-advance-next-generation-medicines.html", "verified": "검색 결과 제목만 확인(본문 403 오류로 미열람)"}], "verification_note": "선급금·조건부 지급액·총액·종결 시점은 SEC 6-K 보도자료에서 확인했습니다. 마일스톤별 금액과 발생 조건은 공개되지 않았습니다. 2025년 7월 공동연구 조건(마일스톤 최대 15억달러)은 검색 결과 스니펫 기준입니다.", "image_concept": "A small ring-shaped key slotting into a large antibody-shaped lock on a laboratory bench.", "img": "data:image/webp;base64,UklGRmAxAABXRUJQVlA4IFQxAABQnQGdASqwBCADPpFIoEylp6ooIbK4kUASCWdu/5y4hnj+uL78vGB9KdSHwXYbpz+6/wmzD+Q+5X4NbU/j/pu92HmB2z6H3mH7B5yv+p6ovMC/i38y///+j64XmC86v/d/tv7vf8v6gv9X9Pf1RP/P6jHl4ezT/Vf+D+43//7QD//+3/028kdx/v7oDV/sAHsx4AWTHaYAF73mcl+o0eGU0eI7/g3XKgbD0FUuqnxQs2HoKpdVPihZsPQVS6qfFCzYegql1U+KFcVfBxCXXXF1U+KPTYegql1U+KFmw9FXGEtEBMDKbrTDiA2HuV6+r4BxCXTVLqp8ULNh6CqXVT4oWbCWfGc2HoKpdVXdjD0FUurYQLyyWqnxQs2IVogbXwcQlyIEByFQ/HMpqp8ULV+Fmw9BVLqp8X1pTeWS1Vgb+lh1+mqTqeZu8iiBlNVPihZsgouqnxQs439NUm3n49YqS+b2LvfeZTAz8AyyS+msa63kFGDnGc2HoKpdVPihZvlrRBPh/ir4aRwlPizMIM+EeQ9VvCWk2A2HuV6+qruxh6ChreHX38cymrcBAwgtiax7nj6G4f4aYPsPhCBocYwS527n3ihZstibEb2zSEBJX84lXAQAJ268TJ9BBIBVLqliZVl1UvZXVHp4p7Pn4YB2iEWk3T0pWzBMDKaqfFCzYegxEWKhFiislKgdf+9BrPd8CwokGwsIoTJiFp42j/jf1b0rT6QlGF0dCbbxmTxxx94qVpRZgp+aYIDjE2VyRuAw2SvbTsPXzA2vgvATAymqW/uJpvvWcbW64WPznVjzAQRj5KEnTQ41SU/1CQM7USqQAMGl2SHZuiRbN/iDCAlO/jsj/lfTW6IGU1U+KFlulXlS8MTDmh3HhzCkaGPNDi/9Vi0hzy7ZXKfUQfdpUOqawTebNitwy67i2M+8wLPRCR14zfmJ02gdgMAbGrHxNqlwNcGzDjVLqp8UHNEr1fBZVn90OKzImy8WJNqajijfRJdRuje71cDrconnlv2+0T87UGJJB+OJTZ9SfIxj+Q6WoSPL5Xp/GJqAKo5BwZR0pnI2nEDeIHS7pDqOzRujC7odtX0Rs7/vqTMoWXi1a7hEoMnt2GQqkjmsq8KBJgGnQ2KjHpTzR9QAn3B8WkS2oAEjnJtmXJ4iWLXF4eaBf9rfNaCxRrYSIv6BqQHsBfty1G8Kes02orKXy0sSnqWWdEIkjFrDiHPDzcsDBB2rjMUdiN7Zxk9TbFFxDHS1Qsbj42hmT1iAzWFicA9KoPVWAGvJc6rFoDw5CHseWRrCvdIetbadM0NukoILcIFUcg4SalnlXmN5WCwGozTbZ8B4jMt5aOVWOnAjsPQ8cymEBMDMbqRPxdnxAbD0TSWVCK6k3rar4GEbZeU/8MjGmTOk8MWn56sUzL8Jpj5GNh+XleQX3Ewd4o1arAw/BpRE4T/W4DWuHiRSalnlFHgrmXFlxEqF ", "why_matters": "이 사업은 프론티지 2025년 매출 2억5,670만달러의 약 40%를 차지했습니다. 찰스리버는 현재 생체분석 매출 가운데 임상 단계 비중이 약 15%에 그쳐, 이번 인수로 전임상에서 임상까지 이어지는 검사 서비스 구간을 넓히게 됩니다. 중국계 CRO의 미국 사업장이 미국 기업으로 넘어가는 사례이기도 합니다.", "strategy": "찰스리버는 생체분석 시장이 2026년 약 60억달러에서 2031년 80억~90억달러로 커질 것으로 보고 임상 생체분석을 확대하려 합니다. 인수 자금은 신용한도와 보유 현금으로 조달하며, 2027년 비GAAP 주당순이익에는 중립, 이후에는 증가 효과를 낼 것으로 제시했습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.stocktitan.net/news/CRL/charles-river-laboratories-to-acquire-frontage-s-bioanalysis-and-h3vufvjyye5r.html", "verified": "비즈니스와이어 보도자료 전문 게재 페이지 직접 확인"}], "verification_note": "찰스리버 보도자료 재게재본으로 확인했습니다. 프론티지의 HKEX 공시와 찰스리버 IR 원문은 직접 확인하지 못했습니다. 주주 승인, 규제 승인, 케이맨제도 법원 인가가 남아 있습니다.", "image_concept": "A single laboratory sample rack being lifted out of a larger cabinet and placed onto a different shelf.", "img": "data:image/webp;base64,UklGRlAmAABXRUJQVlA4IEQmAACwmQGdASqwBCADPpFIoUylpLyoIPUY25ASCWlu+A2Oyq8t1fTs3nsIGid0PN59P7L++9AV4NqT58fdGbXW0/TD3efm72BP790cf6n6EP6V/ufWm9NX/M9P/qnPRN86j1kP3k/bv329TN7oLfsWf4PaFDx+kuPz+47uDMPML9vPu3ppzdP5mjqzijyPDshW4QlsDNJHCj0rfHlgZpI4Uelb48sDPbjhR6Vdf9gi4/zVDa6SOFZA067wzBeOR4O82n7HZNz01c0ncdUWTKJo6rzXCxmiIyKRMgZs7mwUNJKnjO3MZCWsb6QWPalrGQ3BeC5/fIKGZD7m/YkPJM6f6VvjywM0kcKQxQYTYylzymAOM+C6fMzqkRywOHSMjIZYEzShbTk4UZgAAwtOQUOKQSpVxpGTnPh9KGkjhUL71fQ3XLM5mZ0/2oAjIKGk5zxs2FDSRwo9NZWM1N5UDduCfmn7HpsGaHFBhRc18p69/IFJW7aDdYAZo6ryzZnFnMdS1e/jmGnYybXsLnKnYxomxFOnI+1CX5RdaMjpEYDSVm0zu7fwmHaHLByqSeBQzIfcmLXQoqPFF/ANJ6RNOQc/02Wwl3XMzpXIahPDo+GJmpmxMAHjIE5aWlZsrxiusRcWRpvDBkUnYpz9BR2Taxw3H3iwo4lTaxxK84s23gkdY30gukjhR5/iM9uQhlHlREg3xvh8MgLUPrKErfLKPjQeBVwg5RU+xlAV8goRye+BomQW+aSSvm8sDMzqj4t1lleQG/IEPw3XTl4Lj/aeMzHIfxMfn5YGZj1q23BQVY4UhigAMKUqRvsIAuBFgUelb44AZpI32ErNlfcbe+ISt2z9fJLXfYSxcio9/IJs0hLgkloGPuWq+llivqI5YGb6a0qpHAo7JqpHG8mLxU3eLOit3oN6e/kIl6SRjMUGFCPalz2o7J6dMZ+KSH3vjywMzMiUNxnUf+59v/eg/+bmv3VlFFOdPS47aUXaI4XmfapBiLxKh72zdku8sDNJG+zlgZpIydBQzN+Sg94yOlx/tRPzi27TFeSUJcr0si3XsHnwZNLHQ3LAoawo7pvkeUtNpvH59y6npS1468fmn0guZoAR7AgkJCPZx 섬나라 모양 종이 지도 위에 놓인 유리로 조각한 폐 한 쌍을 그린 미니멀 일러스트", "title": "에데사 바이오텍, ARDS 항체 ‘파리디프루바트’ 일본 판권을 교린제약에 이전… 선급금 1,200만달러·마일스톤 최대 약 1억3,400만달러", "short": "에데사·교린 일본 계약", "date": "2026-11-09", "scope": "글로벌", "entity": "Edesa Biotech(에데사 바이오텍) / KYORIN Pharmaceutical(교린제약)", "what_changed": "에데사가 TLR4 표적 단일클론항체 파리디프루바트(EB05)의 급성호흡곤란증후군(ARDS) 적응증 일본 독점 라이선스를 교린제약에 부여했습니다. 에데사는 선급금 1,200만달러를 받고, 개발·허가·판매 마일스톤으로 최대 약 1억3,400만달러(일부 엔화 표시)와 일본 순매출에 대한 두 자릿수 단계별 로열티를 받을 수 있습니다. 교린은 급성신손상(AKI) 적응증에 대한 우선협상권도 확보했습니다.", "why_matters": "3상에서 28일 사망률을 위약 대비 유의하게 낮춘(보정 사망위험 39% 대 52%, p<0.001) 자산이 첫 지역 파트너를 확보했습니다. 승인 치료제가 없는 ARDS에서 일본 제약사가 상업화 비용을 부담합니다.", "strategy": "에데사는 일본 외 권리를 모두 유지하고 제품을 직접 제조·공급합니다. 지역별로 판권을 나눠 파는 방식으로 자금을 마련하면서 미국 정부 지원 플랫폼 임상 등 글로벌 개발을 이어가는 구조입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/1540159/000117184326007242/exh_991.htm", "verified": "SEC 8-K 첨부 보도자료(EX-99.1) 원문 직접 확인"}, {"url": "https://www.globenewswire.com/news-release/2026/11/09/3398164/0/en/edesa-biotech-announces-agreement-with-kyorin-pharmaceutical-to-develop-and-commercialize-paridiprubart-in-japan.html", "verified": "검색 결과 스니펫만 확인(본문 403 오류로 미열람)"}], "verification_note": "계약 조건은 SEC 8-K 보도자료에서 확인했습니다. 3상 수치는 회사가 보도자료에 인용한 것입니다. 8-K에 Item 1.02(계약 종료) 항목이 포함돼 있으나 무엇을 종료하는지는 확인하지 못했습니다.", "image_concept": "A single pair of lungs carved from glass resting on a folded paper map of an island nation.", "img": "data:image/webp;base64,UklGRrI+AABXRUJQVlA4IKY+AADw7QGdASqwBCADPpFIoEylpC2toXLoobASCWdu4V8/BPFEd2VUqagfZ/R79U/t+fpyX448DeeLz394/7XnKdS+dz0p/2D1Df7b6W/UB/yvQj5uf/W/db38/4z0bvTL/7fs6/3v/u+xB/L/+N60nrL/3n1h/MA///t0dNfHIYyr487vbr+1f03M0xBXDt9Hh9/H7Df926Ib/28/Pnr7bgVV6ptVPiiRsynXuZRAb8+qfJLzJPcZHxWBZBxAbdkFU2qnxQs5p7Nxr/Mps/4w54iCAbBjT8z5MLY4+gkDbginxR6beJxKvqqICobzsUnqpQWjM7+CAB6+YEJUu9PLr6qZ9FsfwqSbVsIJY6DI6Qmy3dF01TaqfFHpt2YgMHsymrxEJTQpvFwqDYXAJdNDnDoXQ5xAbd85t8CX2apdIMp2eRa1sIG3bLNhLvPQMBXH0t78Fthgl/KOtU0UDoJA271z7NztcpL6zcCrZi/TVNhIcVVDpIEVJ0FIW b+RFA5Jt8gfGrgkQQpiUcFQyj/mmW2czTPoWAAAA="}, {"id": "bio-innovent-credit5", "cat": "bio", "alt": "막힌 구리 파이프 한가운데로 매끈하고 투명한 통로가 열리는 모습을 그린 미니멀 일러스트", "title": "이노벤트, 중국 첫 자국산 PCSK9 항체 ‘신트빌로’ 단독요법 3상 성공… 12주 LDL-C 64~65% 감소(위약 4~7%), 중국 적응증 확대 신청 예정", "short": "이노벤트 PCSK9 3상", "date": "2026-11-08", "scope": "글로벌", "entity": "Innovent Biologics(이노벤트) / 타폴레시맙(SINTBILO)", "what_changed": "이노벤트가 중국인 비가족성 고콜레스테롤혈증·혼합형 이상지질혈증 환자 198명을 대상으로 한 무작위배정 이중맹검 3상 CREDIT-5에서 1차 평가변수를 충족했다고 발표했습니다. 12주 시점 LDL-C 변화율은 2주 간격 150mg 투여군 -65.19%(위약 -6.61%), 4주 간격 450mg 투여군 -64.01%(위약 -4.31%)였습니다(모두 p<0.0001). 중대한 이상반응은 보고되지 않았습니다.", "why_matters": "신트빌로는 2025년 1월부터 중국 국가건강보험 약품목록에 등재돼 누적 100만명 이상에게 처방됐습니다. 스타틴 병용 없는 1차 단독요법 근거를 확보하면 처방 대상이 저위험 환자군으로 넓어집니다.", "strategy": "이노벤트는 가까운 시일 안에 중국 NMPA에 1차 단독요법 신규 적응증 허가를 신청할 계획입니다. 이미 급여가 적용된 대사질환 제품의 적응증을 넓혀 항암 외 일반 바이오의약품 매출을 키우려는 전략입니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.prnewswire.com/news-releases/innovent-announces-phase-3-credit-5-study-met-primary-endpoint-sintbilo-tafolecimab-injection-as-first-line-monotherapy-treatment-for-hyperlipidemia-demonstrated-potent-lipid-lowering-efficacy-302932681.html", "verified": "원문 직접 확인"}], "verification_note": "회사 보도자료 기준이며 동료심사 논문은 아직 없습니다. 신뢰구간과 대부분의 2차 평가변수 수치는 공개되지 않았습니다. 발표 시각은 미국 동부시간 11월 8일 19시입니다.", "image_concept": "A clogged copper pipe with a clear, smooth channel opening through its center.", "img": "data:image/webp;base64,UklGRh5cAABXRUJQVlA4IBJcAACQnAKdASqwBCADPpFIoEwlpLEwI3KY2iASCWlu+kap+n8ySOJRMtYslfwjv4Gcb0SoPHcT7mf9q3X3yT+t+ip6NUgHxgc/r/regpPl8q4/oSHlVnI9n/cec664ygb7Lz+PK/3zzieiT9H+wBztvMB51//D9ZH949QD+8dSl6FfTC/2nf/+ln7ceY20x39/yf7T2wf97P38Z2cU7X/T4f/r3iO3cfCYvh6FmBfi5/JdHXjTSW+mrq185vbEEvwv78y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/mX8y/oeCv5kvYUj2zuMdxjuQvpsGSTPnOud+C/nTEM2teO7Hx/qJ8IXD35hGS20cZfzWvZILhGLOawBMbYe0bYbbgb7ApFHthweUTwX8y/mFPFPgmB1HrBuBG9J4xr8gmNsdNbYTgwSaYQxi4UAY3b1mIzShRIfgc59mLnuLKUX5iEh0zxi6zopxqPDN+SD4VNKy8L+/E03XU8RJ69d+ZfzWrvzNRM2jcO4xRDsKo const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
