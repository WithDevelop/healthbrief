:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

"note": "구글 드라이브에서 열립니다."}], "items": [{"id": "ai-om1-phenom", "cat": "ai", "title": "OM1, 단일 헬스케어 파운데이션 모델 PhenOM으로 예측과제 1,770개 검증 주장… 80%가 AUROC 0.70 이상, 4억 명 데이터 학습, 동료심사 전 프리프린트", "short": "OM1 파운데이션모델 검증", "alt": "작은 자물쇠 수백 개가 걸린 벽에 열쇠 하나가 걸려 있고 몇 개는 이미 열린 미니멀 일러스트", "date": "2026-11-02", "scope": "글로벌", "entity": "OM1, Inc.", "what_changed": "OM1이 자사 생성형 파운데이션 모델 PhenOM의 첫 성능 연구를 medRxiv 프리프린트로 공개했다고 11월 2일 Business Wire로 발표했습니다. 추가 학습 없이 1,770개 예측과제를 검증했고 그중 177개를 대표 표본으로 제시했습니다. 과제의 80%가 AUROC 0.70 이상, 30%가 0.80 이상이었습니다. 주요 수치는 1년 알츠하이머 위험 0.92, 미진단 특발성 폐섬유증 선별 0.91, 폐동맥고혈압 선별 0.89, 1년 심부전 위험 0.87, 1년 전체 사망 0.87입니다. 4억 명 이상의 비식별 환자 기록으로 학습했고, 학습에서 제외한 약 2억 명 홀드아웃 집합에서 검증했다고 밝혔습니다.", "why_matters": "질환별로 모델을 따로 만들던 임상 예측 AI를 하나의 파운데이션 모델로 대체하려는 시도입니다. 회사는 알츠하이머·심부전·뇌졸중·유방암 등 6개 질환에서 1년 예측력이 CAIDE·QRISK3·Gail 등 기존 위험점수와 비슷하거나 높다고 주장합니다. 사실이라면 위험 선별, 임상시험 대상자 발굴, 보험사 케어관리로 쓰임새가 넓어질 수 있습니다.", "strategy": "OM1은 자사 리얼월드 데이터 클라우드(20억 환자-년)를 경쟁력의 핵심으로 내세웁니다. 의료기관·보험사와 외부 검증 파트너십을 넓혀 플랫폼형 예측 서비스로 상용화하려는 것으로 보입니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.financialcontent.com/article/bizwire-2026-11-2-om1-publishes-validation-results-from-a-single-healthcare-foundation-model-across-more-than-1700-predicted-clinical-outcomes", "verified": "원문을 직접 확인했습니다(Business Wire 보도자료 전재본, 2026년 11월 2일)."}, {"url": "https://www.01net.it/om1-publishes-validation-results-from-a-single-healthcare-foundation-model-across-more-than-1700-predicted-clinical-outcomes/", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "동료심사를 거치지 않은 medRxiv 프리프린트이고, 프리프린트 원문은 열람하지 못했습니다. 모든 지표는 OM1 자체 데이터에서 나왔습니다. 외부 검증은 일부 과제에만 이뤄졌다고 저자들이 직접 밝혔습니다. 기존 위험점수와의 비교는 대부분 10년 예측용 점수와 1년 예측을 견준 예시적 비교일 뿐 직접 비교가 아니라고 명시돼 있습니다.", "image_concept": "A single master key hanging on a wall of hundreds of small locks, a few of them already open.", "img": "data:image/webp;base64,UklGRrAEAQBXRUJQVlA4IKQEAQAQHASdASqwBCADPpFIn0qlpKMkqBPZCLASCU3fffJRbsLK2Q1rJeqHtRRMtn3lRIQRPsFYv8sfwv8X+Q/uqc tegy": "근골격계 중심에서 편두통 프로그램, 그리고 Cylinder Health 인수로 확보한 위장관 프로그램(2027년 출시 예정)까지 질환군을 넓혀 같은 고객사 안에서 교차판매를 늘리는 전략입니다. 3분기 현금흐름표에는 인수 관련 순현금 지출 약 9,740만달러가 잡혔습니다.", "evidence_type": "공시", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001673743/000162828026068872/hnge-q32026112xex991.htm", "verified": "SEC 8-K 첨부 보도자료(Ex.99.1) 원문을 직접 확인했습니다."}, {"url": "https://datatooza.com/article/20261103061314928552ef3c7c8e_80", "verified": "국내 기사 원문을 열람해 사장 사임 내용과 순이익 수치를 확인했습니다."}], "verification_note": "매출·이익·가이던스는 SEC 공시 원문으로 확인했습니다. 사장 사임 건(2027년 1월 1일 발효)은 국내 기사로만 확인했고 8-K 본문(Item 5.02)은 직접 열람하지 못했습니다. 회원 수는 보도자료에 나오지 않습니다.", "image_concept": "A sturdy joint brace resting on a rising staircase of polished steps.", "img": "data:image/webp;base64,UklGRl4+AABXRUJQVlA4IFI+AADw7wGdASqwBCADPpFIoEylpC2toXLIubASCWlu1Mv+M++r+Hev2PIVjZIcT7GZdQH94/O+9qu+3fT5zufsT0z2kPB7ToWWs5/7waVdn/O21x/huLp14j8ftlmgBBmWj9TUdWWDw4GyYYrhJVFmj3SRjxm4VCW60RFrIE0Iyygby3mpKotwXIpAuGMoG9YM0kc1X+cwNgIFkxncvKCTTLWMe45430XQ05JFa2BucGbfzKOybSdPpWybsUcz3dHBBZ6J94LX00ixwx0UkY8bNgpQkSb+MqnSRkSjij5Q8OPIKe0uWKbr2jyQq9MagUgSk3q/ZaftyFJV5I80QmR6RHl0pzM4gGk447GTaVHu6znxbKqpxH6aRDlfJkskUFSPKYf3vDUP8lZONvqOYukeUvOVJJ4Tw9Rc56W6Gk6wY6Lm0QxW5DyQ1Oc+l4BZX89fISJ2y/vo3hNkIN7qG9XlNZXSRjxLJwebzecpj6iIqLf0d9MZtGh4CLg9gfbTQ9qrFgMY2frsKEbqFZ8kteFEU4W+tapjX3P2tSP+y8cUjgsEYGnkSGkjNNn+lb7wHCVwdNgouWfspUeW5sY26G1VfpOHlJbOB++TGYwMdq0sQ2y+aJXxUZAI4PyOpO5ZD6kiKhVEEOayNjLo9p2Nv9gM0kanDLV5Ss+TavRvIp3zSKAsSNT5PKP0q7BUrUXI2J2GhhLxKLlLo1Fu/xslLEzEYRL1JnkCEPQKrwCHTZbVENvHZwSZIe1NL0bIQYQQyO8ZGoOEs11zxGoQGc3cRnU5NcjZFMKbB3ujKvqyiSnKuGHHEOoEMPiqiqyFJ0haaguFPHiNlf7EjHT0Qr/ZXITYxnJP3tVHnAQAuUv/gBhYepmZw/stKy0tOlQGsdLedKkVIzfINah6O5GaOwMDIZJVhLSNHUBR8lMvQK0DJdObkMqhf0G0FJic+njGimjM8IMxR5GQKc5TZTJn0ZBzOsWMsUoXFtN2YSghXJdkjgQLTEWsfJoXRLd0vEyEHcsGREi0bk9P6Qbdw51I130gsCMpBm56dfXrySKZ6Yt2UnMMCgts5Cj0ODiM2O1wuaWI3OREJ6wyiObL4fDFbIsNn8qMXgpAdHo3ZfBPMaFAZbpDxwD/SudTjoB96crRBXsPVf/7vGgWDOPzdq3x4FetF7FIojBkDwfRTGqV6SSKw1sTDbNHEVerZJp837sNVZYmc6R9 Zb25THGvVtcynIb8I3Ag4GdOGDDpuA49LJ8mcnknR1+FWaWRrO92MCYAAAA="}, {"id": "dh-grindr-freddie", "cat": "dh", "title": "그라인더, 미국 PrEP 원격진료 업체 프레디 인수 완료… 총액 2억5,000만달러에 성과연동 최대 7,000만달러 추가", "short": "그라인더 프레디 인수", "alt": "스마트폰 대화창 말풍선 안에 작은 캡슐 하나가 담긴 모습을 그린 미니멀 일러스트", "date": "2026-11-02", "scope": "글로벌", "entity": "Grindr (NYSE: GRND), PurposeMed(Freddie)", "what_changed": "그라인더가 9월 30일 발표한 Freddie 모회사 PurposeMed 인수를 11월 2일(미 동부 시간) 완료했습니다. 인수가는 총 2억5,000만달러로 현금 1억9,000만달러와 보통주 6,000만달러로 구성됩니다. 2027년 실적 목표를 달성하면 2028년에 최대 7,000만달러를 현금으로 추가 지급합니다. 미국·캐나다의 적격 이용자는 이미 그라인더 앱 안의 헬스 센터에서 Freddie의 HIV 예방(PrEP) 원격진료를 이용할 수 있습니다.", "why_matters": "월평균 활성 이용자 약 1,600만 명을 가진 소비자 플랫폼이 원격진료·약국 역량을 직접 사들인 사례입니다. 비의료 플랫폼이 특정 질환 원격진료로 헬스케어에 진입하는 모델로, 국내 플랫폼 업계에도 시사점이 있습니다.", "strategy": "자체 구축에 최소 2년이 걸릴 임상·원격진료·약국·환자지원 기능을 인수로 확보해 Grindr Health 사업의 기반으로 삼는 전략입니다. 앞으로 앱 안에서 더 통합된 경험을 제공하겠다고 밝혔습니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://www.stocktitan.net/news/GRND/grindr-completes-acquisition-of-freddie-accelerating-grindr-14mqwsnx1qnr.html", "verified": "보도자료 전재 페이지를 직접 열람해 날짜와 거래 조건을 확인했습니다(회사 IR 원문이나 SEC 공시는 미열람)."}], "verification_note": "거래 조건은 보도자료 전재본 기준입니다. Freddie의 환자 수나 매출은 공개되지 않았습니다. ‘자체 구축에 최소 2년’은 CEO의 주장입니다.", "image_concept": "A small medicine capsule nested inside the speech bubble of a smartphone chat window.", "img": "data:image/webp;base64,UklGRigeAABXRUJQVlA4IBweAACwSwGdASqwBCADPpFIo0ylpCeoILKYYQASCWlu7yB/v5ualdwvYCefB5M/5vF+E/qKy++vtLOWAL/vz2dYGsnt0Hy77mt1d6Fjs35/TydvT5mPOX85bfsN6TyOOirXhtfNJSyRvbDsjD1XWAOUiPLxO+noePIWRC4yC3monTHWe7LCORrjD1i97GUJPkFoQuMQYPUWImwgziuiUMsk2ttUK8kGs57UQEffSKg8+nOVCSFrMbgBod0RT3KOQCNh6rrARDlBF/ifKQUfWpEqmzzKjpcYqEroTxiQvL+ppeWqqGkHDNqusyA5yVVS62zuKsH4gNoFG52FCeYjhfeTcwVsWA0hs7h8kjJYDnsgFET6NcYep/BcTLsP0a8/wf3XDRoRDWdCzqJuEaJwxW82UiSXBLaVcmMpdKeYxC41BixQT1C8WDD34FobMfUBW6KlzreIstNk68jD/nTK6wBO0IhqADZdzh1hDeqIQ424/DZO6dLsIiAwGB0cpA9K+YOPNagCgeAUb5BcUuFp6YXH2AWHAzltgq1JFQ/DXmTS8ilwZw7avt4hci8Qz+yC4iJH083M75Vrg720LjDm113 ed": "의사 진료 지원 기업 프리비아헬스가 Cano Health의 American Choice Healthcare가 운영하는 메디케어 공유절감 프로그램(MSSP) ACO 사업을 약 3,600만달러에 인수한다고 11월 2일 발표했습니다. 2027년부터 메디케어 가입자 3만6,000명 이상을 추가로 관리하게 됩니다.", "why_matters": "가치기반 의료 계약 인구를 인수로 늘리는 흐름이 이어지고 있습니다. 2025년 에볼런트 ACO 인수에 이은 추가 거래로, 의사 그룹용 데이터·청구 플랫폼 기업이 위험분담 계약 규모로 경쟁한다는 점을 보여 줍니다.", "strategy": "전국 ACO 네트워크에 가입자를 더해 공유절감 수익을 늘리고, 자사 기술·운영 플랫폼에 볼트온 방식으로 통합하려는 전략입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.globenewswire.com/news-release/2026/11/02/3393159/0/en/privia-health-expands-vbc-footprint-with-acquisition-of-american-choice-healthcare-mssp-business.html", "verified": "원문 접속을 시도했으나 403 오류로 열람하지 못했습니다."}, {"url": "https://www.lawrenceevans.com/2026/11/02/healthcare-news-deals-and-investments-update-november-2nd-2026/", "verified": "투자은행 뉴스레터 원문을 열람해 금액, 날짜, 가입자 수를 확인했습니다."}], "verification_note": "회사 보도자료 원문을 열지 못해 2차 출처에 의존했습니다. 계약 체결 단계인지 거래 완료인지, 대금 지급 구조는 확인하지 못했습니다. 프리비아의 3분기 실적은 11월 5일 발표 예정입니다.", "image_concept": "A single puzzle piece shaped like a stethoscope sliding into a larger interlocking puzzle.", "img": "data:image/webp;base64,UklGRrwpAABXRUJQVlA4ILApAAAwlAGdASqwBCADPpFIokylpCqrIXFoiWASCWlu3I40jrDO/EKrWaCSwZd2FqcivnTuJHFXyLUeaARkj3G3xfPbT3tPBJHe3qjeMN4UtWGdl5n25n25rZbsdxxgcSW7F5n25n25pHzsHmfzct2MxfZsMz7cz2L6gUfKNIsx4y/eNrgGB9batrUxDqc4G6TqpvGgULPZ3gHiFHnLdiWIugYvQilEz6K3pMzB3vI8Cn5gQXLjMXJEKYpfdu0bJApi4j5DF3kyQeG8Bdq8r05fjkDDTAeT9LCn27uXF5n26GnF5orILNhNBcqIfdRH2LzLmLvGXKN76Uv2SjzfZCKt11fz5AU/Lpc6eDdF3hSkCmFCYzT+EJl7nnjDpM8UvNujHSj21+/Exsd5k8KCYbDdDotFzecuLyiKawKA7J5tu4S3cpLzLpn2S9XJy5eKyaLdouJDmqxk9e0B+CeoNbuGkvNui57Ri2oIU7MmXkCTY1gdmHIJDkQDMBSFPuQ2p9vE1dtc80TwQ+f2AgF2M9aMB5GudZtOVBKGdPt1nxKDckTBLI5Ifx0z4NE32WIjhMZizArbmeZnghhuiNycuRvh5OvNTK0aqHznt3KeuxPSZUxDbCTqZ3TzVvZeZ9vslWTfJN8HeHiRWMpuFFhyfGGQujTzPNb7kpd6xeYecuMD9DPM+2nCSR6HSj0EiemqipPMeMs1zzO8Bli1MSDoMRgtsS8dVTBqSk/3YAOGBPg1dHouIpxEMNVhWFWxXiQFmQGA02nwXIjVPhptPC2Fs+5A4yNOf/vqfAo5+pn3Ibk6u3edNj+28312HdieEYK2CzzjLvCzOAp1rZbXnkykr55yqgdikkEf  세포·유전자치료제 역가시험 지침을 대체합니다. 제조사는 배치마다 정해진 역가 기준에 맞는지 출하 전에 확인하는 ‘역가 보증 전략’을 세워야 하며, 이 전략은 위험 기반으로 IND 초기 단계부터 BLA 승인, 시판 후 확인까지 이어집니다. 원료 변동성 관리, 공정 중 시험, 생물학적 활성 확인 분석법을 다루고, 유효기간이 짧은 제품·바이러스 벡터 유전자치료제·환자 맞춤형 치료제에 대한 별도 고려사항도 담았습니다.", "why_matters": "CAR-T·AAV 유전자치료제 개발사에서는 역가 분석법이 허가 지연과 보완요구서(CRL)의 주요 원인이었습니다. 이번 지침으로 FDA가 개발 단계별로 무엇을 기대하는지가 분명해졌습니다. 이 분야에 진출한 국내 CDMO·세포치료제 기업도 미국 IND·BLA를 낼 때 이 기준을 따라야 합니다.", "strategy": "진행 중인 파이프라인의 역가 분석법과 출하 기준을 새 지침의 위험 기반 틀에 맞춰 차이를 점검해야 합니다. 12월 10일 FDA 웨비나에서 단기 유효기간 제품과 환자 맞춤형 제품에 대한 해석을 확인하는 것이 좋습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.fda.gov/news-events/press-announcements/fda-provides-clarity-support-cell-and-gene-therapy-development-and-quality", "verified": "FDA 보도자료 원문을 직접 확인했습니다."}], "verification_note": "지침 본문 PDF와 docket 번호는 열람하지 못했고, 보도자료에 의견 제출 기한은 나와 있지 않습니다. 인용한 내용은 보도자료 요약과 CBER 국장 발언 범위 안에 있습니다.", "image_concept": "A precision balance scale weighing a single glowing vial against a calibrated brass weight.", "img": "data:image/webp;base64,UklGRgwmAABXRUJQVlA4IAAmAABwcgGdASqwBCADPpFIokylpCqoIPI4eVASCWlu4UDuu8FfXWT7EGO+n37VxbRfqM45xsv66A7ef/PF6j/9XvJ/670W3pm3m/dzMnO7R+pnJb7Vf4fxEX29ojg54FaZWeL/4vNj9hA6NfVj0lZH2PNp9CbPafR9Z7T6E2e0+hNntPoTZ7YRCbdKbrtmz2oXJTTDVRSCn3HLZX/nyzGq+U1WPNqCwr0UJJhJXXc7c1BGqyWR6+J42ecg2Gt++rHmdMt+y7T65X9p9BkVrPepQAQFNYA1Vp84VjzOps9p9Ca0jf3xz1YX6dteiGvanb6wPc79Z7T6E2rAgnmzv4RyQk/Rh/ZVv3yuBY+Utwu0jXv4RTu0+cNJtV1Bo/0FvR9C2htziJOps9pmk5m6k91RBb0fQZUeM5bdL39pnLOo5NR/cPhBPNngxrQnjZ7UEeprXrKRTqezMcPhCMYAxta35Jm1dLiP+TmAnd4Wm1F/poBAZxYNUcQX6x+NX3sX16Q1tckzBVk5w/yc5qQhIdZw2af7jVeyxqbUOsrgBGqOxXy11U0zafRoJlfB/JM+8E82HsrGpZPnDS6hGLGic/lgSC/j8GOFuKOXDS7/f1evj2aL14pdNpH+ESdHHgwuD++rHiRweOTKQTzxP90XLsFWnzYL9LtqH18iJE5cYMlfwYaWYFZ0RVTNzfSewVXs69KI7M+7+EJr2Gk4fCEi+CYBk+hLR5w0FojRMQANGz3rI027Hq0Y2qtXEHtqbYOT7RcTLzktM5e/zg/yWW0XrzZbGBoOqzNmkgK33+LblV+K3FIIBS4BU0uzd6CSTiNTMdypbHD+QKriQo6iey+wW8SsLcitSh3tDKKQrEPrE8oMhL/U+PJ72Oe1twZOCZNB8Vy2e0+hOOB53JLSldgIjMTLva82Xs8zN0RclftmA8cad B+5ZA7l6BO8OfSoqgKQPdeyKhgNKmHrQggAAA=="}, {"id": "reg-lenacapavir-generic", "cat": "reg", "title": "FDA, 닥터레디스 제네릭 레나카파비르 잠정 승인… 연 2회 HIV 예방주사 연간 약 40달러로 저·중소득국 공급", "short": "레나카파비르 제네릭", "alt": "봉투처럼 접힌 세계지도 위에 작은 주사기 하나가 놓인 미니멀 일러스트", "date": "2026-11-02", "scope": "글로벌", "entity": "Dr. Reddy's Laboratories, 미국 FDA, Unitaid·클린턴보건접근이니셔티브(CHAI)·Wits RHI", "what_changed": "FDA가 인도 닥터레디스의 연 2회 HIV 예방(PrEP) 주사제 레나카파비르 제네릭에 잠정 승인(tentative approval)을 내렸고, 제조사와 협력기관이 11월 2일 이를 발표했습니다. 잠정 승인은 오리지널 특허가 남아 있는 제네릭에 주는 지위로, 미국 정부가 해외에 공급하는 HIV 의약품의 품질을 확인하는 프로그램에 따른 것입니다. 저·중소득국에서 1인당 연간 약 40달러에 판매될 예정이며 미국 내에서는 판매할 수 없습니다. 미국에서 길리어드 오리지널 예즈투고의 정가는 연 2만8,218달러입니다.", "why_matters": "길리어드가 로열티 없는 라이선스를 준 6개 제네릭사 가운데 FDA 품질 확인을 처음 받은 사례로, 장기지속형 PrEP의 저가 공급이 실제로 시작된다는 뜻입니다. 매일 먹는 예방약과 같은 가격대가 만들어지면서 글로벌 HIV 예방 조달 시장의 가격 기준이 바뀔 수 있습니다.", "strategy": "글로벌 보건 조달 시장을 겨냥하는 국내 제약사는 PEPFAR·글로벌펀드 입찰에서 FDA 잠정 승인이 진입 요건으로 작동하는 방식을 참고할 만합니다. 나머지 5개 라이선스사의 승인 시점도 지켜봐야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.wsfa.com/2026/11/02/fda-approves-more-affordable-version-hiv-prevention-shot/", "verified": "AP 기사 전재본 원문을 직접 확인했습니다."}, {"url": "https://statnews.com/pharmalot/2026/11/02/lenacapavir-generic-version-approved-fda-hiv-prevention-dr-reddys", "verified": "STAT 기사의 유료 장벽 이전 도입부만 확인했습니다."}], "verification_note": "FDA 공식 보도자료와 닥터레디스 공시 원문은 찾지 못했고 AP·STAT 보도에 의존했습니다. AP 기사는 120개국으로, STAT 도입부는 ‘수십 개 저·중소득국’으로 표기해 대상국 수에 차이가 있습니다.", "image_concept": "A single small syringe resting on a world map folded into a paper envelope.", "img": "data:image/webp;base64,UklGRl5yAABXRUJQVlA4IFJyAAAwdQKdASqwBCADPpFInkulpKmlI/MJUTASCWlulphQXz/FY+6/9vCykeJFBMofzNP5HT+Zu//Hl/NQCF8wXu1BLb2m05VfZf4/hJHjv9PvH0A+MXaI6R3/d5ABzcv3Jrye3Rt99LXKK6Xz7/cP/bzfen7+r//zfcc7S+q/y3yA/Mv8Xwp9tvKr2/cUfzPdc/mH/z1tf9Hfn6//UFxC/+fhG8H5jWDHiT/W/+n1Mf+v118I7+Zz8P3z60vuf97fgVFtCkJLQtlVloWyqy0LZVZaFsqstr0lotACSFDstcPFC2Y+Q16g0HlS3hEWLXCChSCnBAvLnRTOPv/Z+tojn/wC13PhA+YvPHxgFwQpe/oTYvACZ6lP2Vf70+t39ZZZkBbJuQKbDR ers": "총 14억6,000만스위스프랑(10월 말 환율 약 2조3,700억원) 규모로, 국내 제약바이오 M&A 중 최대 규모로 평가됩니다. 강제매수 요건까지 넘으면서 사실상 100% 자회사 편입 경로가 확정됐습니다.", "strategy": "항체, mRNA, ADC에 이어 비만약(GLP-1) 수요로 커지는 펩타이드 CDMO까지 사업을 넓히는 거래입니다. 남은 변수는 EU·인도·호주·브라질의 규제 승인입니다. 확정 결과는 11월 5일 발표하고, 대금은 승인 후 10거래일 안에 지급하며, 거래 종결은 2026년 말 또는 2027년 1분기로 예상됩니다. 이후 SIX 상장폐지가 예정돼 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80433", "verified": "원문을 직접 확인했습니다(회사 발표를 인용한 언론 보도)."}, {"url": "https://www.thebionews.net/news/articleView.html?idxno=29748", "verified": "원문을 직접 확인했습니다."}, {"url": "https://www.biopharminternational.com/view/samsung-biologics-polypeptide-tender-offer-provisional-result", "verified": "원문을 직접 확인했습니다. 결제일 연기와 SIX 상장폐지 계획이 나옵니다."}], "verification_note": "잠정치이며 11월 5일 독립 감사인 검증을 거친 확정치가 나옵니다. 회사 보도자료나 SIX 공시 원문은 직접 열람하지 못했습니다. 원화 환산액은 기준 환율에 따라 약 2조3,700억원(10월 말)과 약 2조7,000억원(7월)으로 다릅니다. 해외 기사에는 참여율이 97.99%로 인용돼 표기에 차이가 있습니다.", "image_concept": "A single glass vial being slotted into the last empty space of a nearly full laboratory rack.", "img": "data:image/webp;base64,UklGRiJbAABXRUJQVlA4IBZbAACwvgKdASqwBCADPpFIn0wlpCowIfGpYgASCWlu1MiQRxmYVTpAbJ6jPvAr13GYlnv9WxxmYN5O0V9h8OLVLI3Jz3Pzid4z7R9dB/A6R/hdsrxRwj8LjqbKp5OE877K/a+wLxef370PvSG8Led6JffwuTWouz6gfBtl5/4XJj3qaLs+oHwbZef+Fzt50MvP/C5Nai7Uj9xh/cnagEMWyimfu0LlS6OHkkWevP/EIyHIvbnE74W/3eZdPU+UHDBPAkuAlwkouzsBugGEy0l7rUXCyH8dnRElydWO0qBEutRJSFDuf/hUM5rz/wuTQcUuHZ9QYx/4Ilzv8+RUe97A2If8Lmq+r/SRLhqGyaxgPR0vwbWek6F93wzEgiTXdZ0t4WqtRmsn5j62TlE2u5sM39wuzsLmk1lnQSUXEeep8w4SF+LaS3qFp8CS5RwYRQF1zsREHLSUXZ9QPg2tNgSKB1zX6gdbcu6xgS5UP2ZIDJZIj5x4x+VKjEOADIaEAG+Svamrb0Ax3NUXvu+FyQCmXWYvrvdDF6yMmtRdvbOhuV0UhdSWXXc0OtuXYN6L+PXk4Zki3zkDziTMSCGLdFJRdnYDfAS4STVq7irLUIBwkoko7Pu9PSXJsGx3yNzXWouKtQGN4phyHRydycYmDbL+Du9/xi9Wp5WouzsLur1wlJy2Y7DkJmvjyJMxATBJzQa/C5Kheu91rjZd4bMS8nH+HF4015+1G1wl9EM4CW864LhLROqDg8xd9fjmCs3w1+AjMVu/z4CJgSLOTvTJNR3JrFXd9riLlu8E3QgjthMaY1KWyLSNg/G3zk52yM3Y8XJdMwt/WcBrM516xCFdkh3z8Epd+l8  사례입니다. 국내 에이비엘바이오 그랩바디-B 등 같은 계열 플랫폼의 거래 가치를 평가할 때 참고할 사안입니다.", "strategy": "바이오아틱은 해지가 노바티스의 프로그램 중단 결정 때문이며 플랫폼 기술과는 무관하다고 밝혔습니다. 단기 회계상 매출은 늘어나지만, 파트너를 다시 찾아야 하는 과제가 생겼습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/bioarctic-collaborator-novartis-terminates-agreement-302926980.html", "verified": "회사 보도자료 원문을 직접 확인했습니다."}], "verification_note": "표적 항체와 해지 발효일, 권리 반환 조건은 공개되지 않았습니다. 해지 사유가 플랫폼과 무관하다는 설명은 바이오아틱 측 주장입니다.", "image_concept": "A key pulled halfway out of a heavy lock on a closed door.", "img": "data:image/webp;base64,UklGRrwiAABXRUJQVlA4ILAiAAAQWQGdASqwBCADPpFIoEylpCorILCoiWASCWlB0frqvmJIP2UOhJ1DHVcNWX4S7T/gSIbkOONjc/TTuEudB3Wmd4aI/qdDe6vs3BrjZ4/wsiWIAbZBGEIqH9XamnwhFQ/rYkl1TFl1fhQ+cPhCLWaEVNDhh8IRkUBtZJ+iBVrj4+iH3GkwE9YEQyjUxWi7To/OL283BEPjFb0dqeITQ0gUXCw0hSIPrIl1d2pt2k/rFuru1NPFGrIl2vpkeeYkxjhVWs1NPhCKkxyJjHD4NdHGlrrrCaGIgUmGk11KXORxCyyOlx9ZE5uIqlpJm1CkUdFxAQjp9jg+uPh1M4LAAW+vgzmbiFFeJ1KyJjG0gj1F5e4Wd4tsgk2BES6JOgY97F/Wbqh+HShMJwfVkTHSle6kgOF8HCqDmWrtUXnz5zhMmPwiHwdMs+AbV2r8QWprUB9jwhFQ/yGZm52UK4OnVNqMEwvgV8tJp8IRUP57xfGcDTDIHlZfFQiqUmOz85zBQWl1xiqO1xSafCGhp1pkNYWmMRkQfV+fRFa7fUqXKEcWOH11op1STGFpjG1VSB/Kx9z5ZYAvulPI91oS2QOkZiEOGhjyBDN1ZFberfpd5X7X5fl+X5fdJnwbo0HoZzw8cJarmEf1ZHP2Npu6afCfHAb1c7tBQUR5V8s9rcizi97twLzkyzC/vsdfRKyTt0uB77RaBfW7rt7ZdqEQadz3FDay01QAt0Vr1Q/q51ySKRB9KjGvgjWK1dtPnzi8hUnhTU3yGDxZ1Swax/BzoUa3rf2ywy1FNYVrH9heT23Fxp4sOuCxXewY4AMR9dV8p/ZIwBB6RejZNJhqanYyTt0yeNkLDGsYYDVPQIJFxiFVwK69zepyfhJ7k9Sl9WR0V/xtwyhkxWHvtAV4+s2k7G1V7cr91AHuI9w7/++4QFaZPIrRgpFMh2mcx3SxT9tQiFWQxPDV/SY4CZxS0yIPW1IQmbnYtQSqYsrNBVypXKdm6+fVyfqXz090v4v9WXTWaKzVXLNaw6JjHCl7Exjl1W6KmKrz9IUiJ+B/rxfBM9VDqMk4HPGMNXV7Av3JZ0hSe4UlFF3gW5cch7BYJgpCj/0dr2WZtTT3sjHSuogv2Xo1HcNRjmcHN0kBNYh7iRzUpf06fglaQo6jHTIORmCDqDmImJ2zpCsRB6quU3DzzglnTCCOvixXex22KsC6c2uvZxBA0gxjiDZ7rtmnut3Bidljjc2FLTY2ae9htAV1wQAt2A3pT0YMqu5zpwVAozOigakQc4l7B/CK+AN1xGYy6inFOfrhei321D8UE+gftJyTOD0e2qqbhF5xY46hKSliKh/VzIQprYVTElwE6YR7JvWff0cM2K4zmtD7wh/vXiwSZtgsDNT ": "현지 파트너가 허가를 갖던 구조에서 개발사가 허가를 보유하는 구조로 바뀌면서, 앞으로 파트너를 교체하거나 협상할 때 삼천당제약의 주도권이 커집니다. 일본 아일리아 바이오시밀러 시장에서 제네릭 영업망이 강한 다이이찌산쿄 계열과 손잡은 것입니다.", "strategy": "회사는 경구 약물전달 플랫폼 S-PASS 제품의 일본 파트너도 DSE로 일원화하는 방안을 추진하고 있습니다. 미국과 중남미(프레제니우스 카비)를 포함한 지역별 파트너 체계 속에서 일본 권리 구조를 정비한 것입니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.thebionews.net/news/articleView.html?idxno=29752", "verified": "원문을 직접 확인했습니다."}, {"url": "https://www.yakup.com/news/index.html?mode=view&cat=12&nid=334644", "verified": "목록 페이지 요약만 확인했습니다(본문 미열람)."}, {"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80440", "verified": "목록 페이지에서 헤드라인만 확인했습니다(본문 미열람)."}], "verification_note": "계약금과 계약 규모는 공개되지 않았습니다. 거래소 공시 여부와 회사 보도자료 원문은 확인하지 못했고 언론 보도에 근거했습니다.", "image_concept": "A relay baton passing from one hand to another over a running track lane.", "img": "data:image/webp;base64,UklGRr4zAABXRUJQVlA4ILIzAADwpQGdASqwBCADPpFIoUylq6qlodJ4cXASCWlu3JVbbz+8MvbP7jSUqWvGP35hHNwUhEXNUIAeZ31wNKKO+iN/e1v9z++c95eP75fnH0l+oM+uxl/yvVL+p96z5m/PO84Lfj96z/ueTgTtnavjn66nj4AX41/NP8/wJnQPPxnqfoWiT058IbGEVMeKecuLzQTXYwP2HlWoK+w8bITeOzT7cz7g4kt2LzPw44vM+3NbXHUvM+wZVDyy8+a/+dtJqSLoGKCGWj5oG5GFLzQJyt2LzRV+LxF9AN5y3koyP1fMuicw/d58sE7p2gxehWbG73+ZFLmPF0Vou05VF4ywVPLLXOmX8uFX2MvKbz5t0lyUdB/OBabFF7epumEatFc/F8d/YZKh1bidjVt2/E1WySYrWspvHJsFeWLkwMq5BPSnMo9cf7fZTiqmSqRUevk7oQj1rtmn/te7hbx4dhiBTCmnasOOUUPOxu8KQ6+dy14w28rHcKbKxkFGYPhRs2Desv2wmZx/tpl/K6Zek154nVtyHY7aLAP5vWORY5knea80VSB44RwITp8nwUT/mTrLxiunhzqT03hjbx41zYWYXwOLOIxU0RANwbjEAQ6glDl+Bw05bQZR3C5TPeXTs1WvNTO8Bd8Jwv1rvXFJuiwdLd2F73eJ1l3vV7f5uZDn7L6LQYumiW67EsRe3jDiQvCVN8rwFtt2AC+nIU04Uo87HB45f9hflmn25n3QmLi8z7cy50o87G8cmpbGrnZ6eDF3jFeFKWxpT0CvgIDi5OXF9AkhL0GKO5RKREMyiZZoXHx1y8ONAq42JmvJ3bkS8kHiHsE6y8Yr1cDoThmogFKTm8z7dBjfIvJ5xhtuUnNkl4rV8OxkcQ4vNBNfWjHZeTucym8mKEt92EnbfEYBIZGK8kDxT01ivDx1m4nGksIcprHozBdTUrHcKUecuKGx43DTU9uSZCEqZzXm07KT5CCz0Mb5Xif9r6lF9g0jpzjJT/YMfbd7t5oWehEJv2jOqqtHaIF+un/2yN0nmGADxarFRCcXUV3jhnwUqNeOJ5nm6jKKcYL4srRjSDW51GyQ7F5lzpaWz/xu+y3 const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
