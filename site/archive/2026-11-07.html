라이브에서 열립니다."}, {"label": "제3호", "date": "2026-10-22", "count": 19, "file": "https://drive.google.com/file/d/1xNJus1HEx8zmpysED3JVcKJFSk5ZvQWr/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제2호", "date": "2026-10-21", "count": 27, "file": "https://drive.google.com/file/d/1nJaSRTNRptetHTgBeQVovI5R-GMIY1cn/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제1호", "date": "2026-10-20", "count": 30}], "items": [{"id": "ai-lunit-learningunit", "cat": "ai", "title": "루닛, 300억 파라미터 의료 특화 모델 ‘러닝유닛 2.0’ 오픈소스 공개… 9개 병원 6개월 실증, 다학제 암 치료권고 86.2% 임상 타당", "short": "루닛 의료모델 공개", "alt": "병원 서버 랙 안에 놓인 밀폐 유리 상자 속 작은 빛나는 뇌를 그린 미니멀 일러스트", "date": "2026-11-06", "scope": "국내", "entity": "루닛(과기정통부 의료 특화 파운데이션 모델 과제 23개 기관 컨소시엄 주관)", "what_changed": "루닛은 과기정통부 특화 파운데이션 모델 과제의 결과물인 의료 특화 모델 ‘러닝유닛 2.0’을 허깅페이스에 오픈소스로 공개했다고 6일 밝혔습니다. 전체 파라미터는 300억 개, 연산 때 활성화되는 파라미터는 약 50억 개로 병원 내부 서버에서 돌릴 수 있게 설계했습니다. 국민건강보험 일산병원, 건양대병원, 고려대의료원 등 9개 기관에서 약 6개월 실증한 결과 다학제 암 진료 치료권고의 86.2%가 임상적으로 타당하다는 평가를 받았습니다. 응급실 중증도 분류(KTAS)와 약물 이상반응 인과성 평가는 각각 98%가 전문의 판단과 1단계 이내로 일치했고, 보험 심사·청구 질의 답변은 85.6%가 실무 활용 가능 수준이었다고 회사는 설명했습니다.", "why_matters": "영상 판독 AI 기업이 진료·응급·원무를 아우르는 언어 기반 파운데이션 모델로 영역을 넓혔다는 신호입니다. 환자 데이터를 외부 클라우드로 내보내기 어려운 국내 병원에 온프레미스형 의료 LLM 선택지를 제시해 병원 AX의 데이터 주권 문제를 겨냥합니다. 다만 성능 수치는 회사 발표이며 동료심사를 거치지 않았습니다.", "strategy": "단일 질환 판독 솔루션 판매를 넘어 임상 의사결정, 응급 분류, 보험 청구를 잇는 병원 인프라 모델을 선점하려는 행보입니다. 오픈소스로 생태계를 먼저 확보한 뒤 병원 내부 구축형 사업으로 연결하려는 전략으로 보입니다. 회사는 120B 규모 GPT-OSS보다 정확도가 높고 상용 GPT 5.2와 비슷하다고 주장했습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.hankyung.com/article/202611069853i", "verified": "원문 직접 확인했습니다."}, {"url": "https://www.biotimes.co.kr/news/articleView.html?idxno=35960", "verified": "원문 직접 확인했습니다(2026-11-06 게재 기사)."}, {"url": "https://www.joongangenews.com/news/articleView.html?idxno=561693", "verified": "검색 결과 스니펫만 확인(본문 미열람)했습니다."}], "verification_note": "한국경제·바이오타임즈 기사 원문에서 파라미터 수, 실증 기관 수와 기간, 성능 수치, 허깅페이스 공개를 교차 확인했습니다. 루닛 공식 보도자료와 허깅페이스 모델 페이지, 라이선스는 직접 확인 지역 대리점과 함께 지방 병원으로 단계적으로 확대하며, 대형병원 실증을 유료 구독 계약으로 전환하는 것이 단기 목표입니다. 인증 7종 확보는 이전에도 보도된 사안으로, 이번에 새로운 것은 영업 전략과 시장 근거입니다.", "why_matters": "일본은 2024년 4월부터 의사의 연간 초과근무를 일반 의료기관 기준 960시간으로 제한했습니다. 일본 후생노동백서(2024년 조사)상 CT 판독 지원 AI 이용률은 전체 의료기관 4.9%, 400병상 이상 16.4%로 아직 낮아 성장 여지가 큽니다. 국내 의료 AI 기업이 내수 한계를 넘어 일본에서 반복 매출을 만들 수 있는지 가늠할 사례입니다.", "strategy": "대형병원 직판에서 지역 대리점 유통으로 넓히는 단계적 진출과 구독형 과금 전환이 핵심입니다. 인증이 실제 계약과 매출로 이어질지는 지켜봐야 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.newspim.com/news/view/20261106000665", "verified": "원문 직접 확인했습니다(2026-11-06 게재 기사)."}], "verification_note": "뉴스핌 기사 원문에서 인증 7종, 영상 모달리티, 영업 전략, 후생노동백서 수치(4.9%, 16.4%), 근무시간 규제를 확인했습니다. 7종 제품명, 계약 건수, 매출 목표, PMDA 인증 원문과 회사 보도자료는 확인하지 못했습니다.", "image_concept": "A small bridge of seven stepping stones crossing a narrow strait toward a quiet harbor.", "img": "data:image/webp;base64,UklGRnIjAABXRUJQVlA4IGYjAABQiAGdASqwBCADPpFIn0yrpKorIlVYYXASCWlu/55k/1fOeZPkffTnn9o9R3S6RrvlvRDEsquKgSX76vGhd8PiWyYeZf5SZv/yLmdj4x2++7qhPYAH6PQ/JgRiuVFAv5/5508L9mo4c2I8R4gA8HrkBS6qfFCzYdpPXICl1U+KFmw7SeuQFLqp8ULNh2k9cegR3yPEmw7SaEaEyPTGT14JUuquVKgbDtaVcgKXVUJ1QNh2ln/i4awHxaqfQ3waM1lS7GT1yUOBreQF1ziHojJ65BIFLqp8ULSpeXs7hA2EQ12R3RzNV4tnvLqZCzZX2Ai0Oq9+vccVElqp8UW/pVv74OzL1/FgyJh+g0kzMPOe9Pihbm99xjEDHvE2A1WJ1zenxR6bCIIdW8K0A+HAjdmJwSeZ1BkPihZ2dme7VEB4a7vTPY5mB4REAvyFUnLSeuQFLqqBa1W8QQa4z1JnE+ONEqqo4RPlQ9OBOHBwg6G1CBHYdkA6/IBsvPbbQjdoTeCVCx5DkziFuu+nFhmHzXrhfgPldg2p8KRBOw7SeuGC06UB1T4m1U+FLu1S6qZnaxtcj9psfAPW70+KFyck4cHtIiEZPXICl2Bk0xV6E2EQ4pmiPtJ7BPCYP5+PhfEdeZS6qZWIa7g7SeuFZqXVT8gpdVUPyZdo1lDTVfxhATsuGHlLqp8ULNhIZMudENsjJ65AUvucAdpPXCs1kkDtGft6lxTQtnUSeKXViVH6Nh6wZZbChZrFzuIEoqiSeuQIZql1U+KftnC0uq58nrkBS6roE2RHtCQtVPihcnlGZ9Ul9J65AUuq58nrkBS6qfFCzYghXiHNh2k9YbtUuuGMmlEfbuKfFCzca+KXVT5IknrobFqp8X1mw7SfHwofOnYVDaKfFCzYq3s1T4oWbDtJ65An6oWF7ChZsO0nrkBS7Ac08HZk9PihZsO3cU9Q1jn90QtVPihZrF1T4oWXi1U+KFmw7SfPHSeuRAAe3lnT8KV+7inxQs2HaT1yBmT1TVKty1qY3f3QE/SB2k9cgT9IHaUzL4k9jJ65AzJ6fFBy0uqnxQs2HY0w/KTk3VVB/cKRqP+AP1KmFgq y": "자체 의원 네트워크를 레퍼런스로 삼아 AI 운영 시스템과 개원 인프라를 패키지로 외부 클리닉에 판매하고, 필리핀 클락을 시작으로 해외 거점을 넓히겠다는 전략입니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.newstap.co.kr/news/articleView.html?idxno=337326", "verified": "원문 직접 확인했습니다."}, {"url": "https://thetracker.co.kr/View.aspx?No=4300372", "verified": "검색 결과 스니펫만 확인(본문 미열람)했습니다."}], "verification_note": "뉴스탭 기사(2026-11-06)에서 4개사 명칭과 수치(17개 의원, 1,051억원, 300곳 목표)를 확인했습니다. 매도인 엔지켐생명과학의 DART 공시를 10월 20일~11월 7일 범위로 조회했으나 관련 처분 공시는 확인되지 않았습니다. 회사별 계약 체결 여부가 명확하지 않아 거래 완료로 볼 수 없고, 금액도 공개되지 않았습니다.", "image_concept": "Four mismatched puzzle pieces snapping together into the outline of a small clinic building.", "img": "data:image/webp;base64,UklGRhI9AABXRUJQVlA4IAY9AAAwtwGdASqwBCADPpFIokwlpCqqojKYmVASCWluc5DcLzz/81BfnP//mr//zt+QX//4JFV8NPp/Cg8L44L4Swqqzi+1k6gsXKEvkhtNDbP+px0IW2+mFetc/P4DvheojyyOlL/W+hs3Y711Oi19J7JpO2WN0V0Z/pIHuyHSvLe+g9B/6To28CX7l/yvYI/mf+b9K7TqNWyResoGoAg9YFlA1AEHrouYwVUDUHjAwqpKLVgWUDUAQesDBRkxZ+FdPfl+uJ/bZi5v5bTy/ygLLN7lFM5ZYrPl01JnKBZ1soAg9YFnWygCD1gWUDPr0O3qCkNJ6sCvhmnl8/Uzo0OMCygai8YVUAQesYrC9ZQNQBBsHgWUE/8kXq9dsdfkBVtc8rq1VQBB7/SResoGrOQfLeY8DukUXICyxVgWUOMG4UsYYGFk03XNV9YFvkMMDCqoBmKqAJRAEHrGKwj4ZbAXq6AJRAEUWArFIi9yNcoc0Z7r8cwDEhamjHMRUPBbt3CqgCKLFOddkH5V1qwrp79ZTCq39gmY8eBJF6ygag4BAE+CkkvvLRO3fnrAr4NOwRVvk1YKQr0eivmDfId6mxHrVfb/u0AEAagCe/GBhYxRRnuT3jfb16nuf05cLrFZq9DMmm5GQro8/kh2oDKEgTgApouxX+JWmjGBhSFiLeJW4j4+InTXHzF/dg0tzUYBqlKQKOTL8TlimX4+b0D9R1ZcfbnMk70bnP8rCkJOckizMAQesCM3pf50s5/9KhOAJjc/nHE0tsVm1fGHqp/LwFLLvbgLKBp1mXvXmdGQZdygamQLKc9uUmDAkUd+/PWBFZG8Wj7dOdnsQ+zWv4CL66ZHbK0SScBLRDaE4ntc3aHRkg8eFlEKMGDo+29eZ1XWuXBGC24PvNf/RE+uXBFlMx+W09J6zGB35HJOmZ4eJW5HIe/g28dEULHQKL/OYP8//gpJO9qyBhQyVAoibzCUW3UjDyUl/0+uciif7g1ce1YNMqlWhMX86WH4L18sWKeBX7WNwT+QCMM98gKqAw028N2186f1Fa8H5/h7PTz7SsBFMTwqYtvdmCWk6eyJxAE2JGf3YMPvoOvwLjAgQiQlamZf4FVky2EX0/4NeaV8FWSdi33pkTcWyB0t97kO2etV9v209irVgV8M18tGFNXHPq6TRO++nV3/6d4xwux+9pTf/2+EzbXLLHGEhyoH2xYPMIGatoVA7TVrnYYUkoTEDZw8Faz/Q5xIS/wmtlKg8dpg4tYqtBrL6sBuOiXjy/IGkhx  320만달러 순손실)를 냈다고 SEC 8-K로 공시했습니다. 총회원은 110만 명으로 36% 늘었고 GAAP 매출총이익률은 66%에서 76%로 올랐습니다. 조정 EBITDA는 1,240만달러였고, 연간 매출 전망을 3억3,400만~3억4,000만달러에서 3억4,400만~3억4,600만달러로, 조정 EBITDA 전망을 3,200만~3,400만달러로 올렸습니다.", "why_matters": "상장 디지털 만성질환 관리 기업이 회원 증가와 마진 개선을 동시에 보이며 흑자 구조를 굳히고 있어, GLP-1 시대 가상 케어 모델의 수익성 논쟁에 실적 근거를 더합니다.", "strategy": "GLP-1 치료 지원을 포함한 가상 우선 모델로 회원 규모와 평균 이용 기간(약 2년 4개월, 10% 증가)을 늘려 단위 경제성을 높이는 전략입니다.", "evidence_type": "공시", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001611115/000162828026070989/q3fy26pressrelease.htm", "verified": "SEC 8-K 첨부 보도자료 원문을 직접 확인했습니다."}, {"url": "https://www.fiercehealthcare.com/finance/omada-health-hikes-2026-outlook-after-strongest-quarter-ever-q3", "verified": "검색 결과 스니펫만 확인(본문 미열람)했습니다."}], "verification_note": "SEC 8-K 보도자료에서 발표일(2026-11-05), 매출·순이익·회원 수·마진·가이던스 수치를 확인했습니다. GLP-1 관련 별도 재무·회원 수치는 없었고, 실적은 미감사 수치입니다.", "image_concept": "A small potted seedling growing steadily out of a stack of coins.", "img": "data:image/webp;base64,UklGRhoaAABXRUJQVlA4IA4aAAAQNwGdASqwBCADPpFIok0lpCqooPI4IVASCWlu6Booo1Oy/WpJXKxe1ut2oizM/MC5283PpA2+fmH86/TtfQd86b0isnbO/6P0+PuUCLcoD8Vo4cr08oB+GdOnkJHwaNGjRo0aNGjRo0aNGjRo0aNGjR4LevXr169d/BQdChw6tWrVmnSI5ZnUB407Q3Cg0qoXkyfumFX3q2QX6OQbI3xik2bZ9d+pkyZMtGgbjmkPIWLFim9A5psh842wk69p9FJlafBlsWqUzkxNx8GotWsJKpUUzJkPBmCTzb98VC8n8tZtiQ8eXXG6hpoebjXIgkfki/BAxDNmzZCr9gtX20ZbGYuWdqRep1BMrp069PR06fFj1dWvbIWN2zp7xeTJ4SFrD144ftmvw8g10kvEQs8SV0fCS6dOnR5Kyzr169hZdHweD5acwTwxrGXr169evYWr5YCAPF2eEUnJut12NCYWUYg7B8TsjyTii2e8cg5mrCHl6980KI3YIEhfVsHHsqF/yzTs2bNn3oycePHjx5/47Ny02bNhW48ePHNbOvR05MJI9cqHDmnSHkLFixYsIIg10fBo0aNF9/a8eTYWyPHjx48ePHjx48ePHjx48ePHjx5diF3uCA/2sIJcM7NIeQsWMxELyZMmS9EXeTJejoFYWvXrtwBBpVQvJl0e2bPK9gzEs5N70eu9WrsjWIHlO0xD/lxWY/yUgPkNESnTqB5s2bjXHjx49JXPfNSTx1FaL71dgzzGQ5rUwktwAaFJ0DgDzLjEZjKWBS0Qtba0vQuyFaNGjRpL8eeePOnA9coTgqD6gv63LIDHLNmiXUWrG7b+mfU1Q1FBIh+twpsvEQDfmbx3LGKC1Q0ys1XhYsx3p094vpfBNslSmWFI+DRo2P5aT4c4MWQh4oDeVNkYlKzPgsgnm+7qAwrPTbqVERQpHwcp7aCmVC/5a9shYsWEEPIKy  자료제출약과 신규 생물의약품까지 수수료 현실화가 확대됩니다. 식약처는 이를 심사 인력 확충 재원으로 삼아 고난도 심사 품질을 확보하겠다고 밝혔습니다.", "strategy": "개량신약·바이오 파이프라인을 가진 국내사는 2027년 이후 허가 예산을 다시 짜고 의견 제출 기한(행정예고 11월 26일, 입법예고 12월 16일)에 대응해야 합니다. 수수료 인상과 함께 처리기한 준수와 심사 인력 증원을 요구하는 협상 카드로 쓸 수 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50478", "verified": "게시 페이지와 첨부 보도참고자료 본문을 직접 확인했습니다."}, {"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80564", "verified": "목록 페이지의 제목만 확인(본문 미열람)했습니다."}], "verification_note": "식약처 첨부 자료에서 예고 기간, 품목별 현행·개정 금액, 신약·바이오시밀러 기존 개정 내역을 확인했습니다. 시행일은 보도자료에 명시되어 있지 않습니다. 6배는 자료제출약 허가 수수료 기준으로 계산했습니다.", "image_concept": "A toll booth barrier being raised higher on a road leading into a laboratory.", "img": "data:image/webp;base64,UklGRoglAABXRUJQVlA4IHwlAACwiAGdASqwBCADPpFIokylpKqoIZR4kVASCWlu98ttHSr/A+7xnO3jmvNYvWPWuxm11m19AgRPTXuGfNP50Xp+3rrercjG6sAv87vbn+4eIc8rcp5r60gRMymqODhnxQc2HaapdUcHDPig7Igc2HaapdUcHDPig5sO066nvTpg9MS9woUJBqaglS6pUnrgCpKNVniaxWvH2MyjERgis8MgYIHeJgbYRpjAl5kFUwc4Z8UHNlfVxzLyWDhJbQBF745HZBrnMDcPTLqOZTZkZLU+rJi4OGfL2QOzrEvPFqOFSUHNhyqfL2HaapOiEgxI0Lk1jXaWxjX/tNTUVIy6pJ0Bw0J6ZAwQJGhCccKEgOZSv01vCcc0oKpoWu4PW8NAwEePHAQhTafSO01S6b0i6h1zefxzFAFNT4pa9NqOw7SfgV9/ORBBgU1OLh2QVS6o5kvePvg81vIp8U9HgOJL6aqlqSIfC01lKMGDt6Fw0DBA5O7GEEmPacVZIEAMjg4Z/WAa8395z0AvtXYDPeslcHsqTC3hnx5S9VdaVYfCrcr6HgDsiGpfDqpdUcIcBjQnU/AHabQEO5ebETNsWRS60utv01ZIR4eQMphS8MzO17TmIP0ql1RwcK5ET4OGfFBzYR7E776wGm19UDd7XLgO01S62/SicPwHaaslSAqg57ogZXVFqjg4mD8ARiRIhVLTTOtyM8a/P1LnyGTGyfbo0/AEYq4Hah+ZnTQ+PJnDxuVZBH9bel3nVS7nAtVDDBGlWkGVvjCPmv5Nz1h5+IGzvRQWl1PpiYDtNtj9NUunRQ47WALdg2MKsQ/PyGU1RwcoyCwS7215eqQSy5ICiJNoc/SB2mz9IHaapdUcG8/mSAoT6sjspe+Gt4egFzJ5MrSf+Vc/xpRFBY+/yCoQQA+eXktN8CCEgql1t+mqTlpqySckpDgppvgOyfD2QVS6n0RlowH/H0CSbY2a6sZ1vDtW9K8uOw7TiRn3ItUcHVxMSRgU/AHabP0gd0V8xa/FeHC8Y/iHn//Ekfbf3K4R+OhlieoxktUFNlfecz4oOXXgykTYdpqaX6apdN8B2mqpZgevFSVzCElSCcskHZEQghK93qkAo6gdzEsKh0i1R8thyroBVLqsaZJYA7VyBLlv9f7r6CGFhqBmgqJLdVdgCTHHMpqjhC/tJ+A5VXb7YT7+L  Set·Catheter)을 긴급도입 의료기기로 새로 지정했습니다. 이로써 긴급도입 의료기기는 총 43개가 됐으며, 전남대 어린이병원 소아청소년과가 지정을 신청했습니다.", "why_matters": "체중이 작아 자동복막투석기로는 소량 투석액을 정확히 주입하기 어려운 신생아·소아 환자에게 체격에 맞는 기기를 공급할 수 있게 됐습니다. 소아 필수의료기기 공급 공백을 국가가 메우는 사례가 이어지고 있습니다.", "strategy": "소아용 소량·소구경 기기는 시장이 작아 공급이 끊기기 쉬우므로, 국내 의료기기사와 유통사는 긴급도입 품목을 정식 허가와 급여 등재로 전환할 기회를 살펴볼 수 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50475", "verified": "게시 페이지와 첨부 보도참고자료 본문을 직접 확인했습니다."}], "verification_note": "첨부 자료에서 2종 제품명·제조원·규격, 누적 43개, 신청 기관을 확인했습니다. 국내 대상 환자 수와 공급 개시 시점은 확인하지 못했습니다.", "image_concept": "A tiny glass burette with fine measuring marks resting inside a newborn's knitted mitten.", "img": "data:image/webp;base64,UklGRoAiAABXRUJQVlA4IHQiAABwZwGdASqwBCADPpFIo0ylpKMoIVVIMQASCWlu+iU28bHUQK7oyPg0pk+n0HeVBFJjz5Y49TIg61PffD3Yp+g/nf/Xg8xI/RPQR/2+FP8V/y+cF/3vVui3fDteP1D/1dI/dDc/hsNe8fZkBhLjEmCYpIPkYBcMdKAmM2mCYpIPkYBds5ikg+RgFwxzC2etM3ld/W9UFzHx2RrxxIcoCYp2Txh7uZsxq3bTLrC8MBBUzKl3v6p5ioEcvS+H/DUBMUipGOlAAbNrALhgIQfJtwE04BcMdKAmIr8sjWmzHSgJikg9v+EY53hBqLtmKJFYxN6oNQEYm9ZBMt59ZLeqDUBMUkHyMeQPkYBR5qgR6oNQExSQfIwC4Y8PT8kVFJB8jAM5VQagK1JhcMat20y3qg1nQmKSD5GAXDbQeAJiK0DUGoCYomNVBqBgyviD5GAXDHSgYMPYBMUkHyJ/aD8jALhnXSgJikg+RQwCYsAoLeYpFSMdKBgxZO0xSQfIxJgmKSD5IqIxGOlARib1QagJikg+RgFwdzUkHyMAo81JB8jANrvMVyD5HlgAWW9UGoALLefWS3qg1AVmg8xSQf00xSQf+fpikg+RgFw0vaSD5GAUeakj03gst6oNQFSb0beqDUBMVxUjHSgJiuQfIwC4pciD5GAW04OkZXNsrnAExSQfIwC4Y6UBMUkHyL1vLAiD5GAXDHSejc4Qxq3Zz7tpj2ARib1QagJikg+RgFwx1g70xSQfIwC4O5qSJbaXgrFehYLQL3ULdWoutfkb9wjQExGIx0oCYpIPjsVfOjpQEYm9UGoCYpIPkXsHE0t5qRT0vzJ2XvTFJFXR0okxp6L188DzFJCIo7FWC9gExSRA8LeEFx9bptlfeJuaIYKnzl9xteTnpN9RQGqGyFrxzzFJB8jALhjpQExSS13e3DTeqDTzwDJNwdzRiMdJ//AIrePV7b2rQZDmrNOjuhMwZ1c1HxlMx8BK4UYGSTuCFw5rMUkHyMAuG1YBcMatyw8HemIxGOePrjALhjpG1PNIxBVU9WyyURGRlK5y5110qGC/5SiaxHQqn12QN/CoshTtK4dp/1Xw9sfIwC4Y6UAGiJ3qbTHq2uBeqDUBMUkHybcBMUkHtr/po57a6Ngab/+j+chZYKl/7FgKSiuLKR6VY72PAnyq9UnMlZbQkxW8qtLHzrvW4kMqsx1ACzwbS3qg2K+9MiXeg+RgFtLIj0lbALhjpQEx ns-supports-lasting-drug-savings", "verified": "원문 직접 확인했습니다."}, {"url": "https://www.cms.gov/newsroom/fact-sheets/medicare-drug-price-negotiation-program-medicare-prescription-drug-benefit-program-final-rule-cms", "verified": "원문 직접 확인했습니다."}], "verification_note": "CMS 보도자료와 팩트시트에서 발표일, 시행일, 연방관보 문서번호 2026-22792, 고정복합제·소규모 바이오텍·파트D 조항, 4차 선정 일정을 확인했습니다. 절감액 추정치는 확인하지 못했고 연방관보 원문은 열람하지 않았습니다.", "image_concept": "A heavy steel price tag bolted permanently onto a pill bottle with rivets.", "img": "data:image/webp;base64,UklGRgomAABXRUJQVlA4IP4lAADweAGdASqwBCADPpFIn0ylq7CoIRHIehASCWlu18qrNikaDhcvCO5/VSZPyZ6g0c/+rmzEr0L0Uuo95s/B9N3il9TjzAec/6Of9JvzG9SZHV8+8rfrA+i6LVDAxRxi8v776aR+IIn9ziQwsLtnD6ET6/tnD5IOFFuiPrImOH1/bOL/J9CJ9f71w2YrvPyW41MQkS3uqIp7yGvVWeyXSD5mia1Z8qb7ajTw0GwMb7AI6Ct50SeEzBtEBO+acRraXUH1poYiP1r8p4m0DHBf9xULxwiLsMN2ArGoZh6TZl8zQwm4TaPmtyjRlWOHN+zIAUt5HA3mmzhVgjc/pkivLxtgbsCoPEUdcitJFS8AYaFF9jxI+BONbl8VTXx+Bw5zsY+f2ziF7G9GEKkTxC2UnfZDy+/t44JlFiUa8I8djIWq0o+H4/xNvzSv0vx+SH1GQ1LPsfL7RLF3b7YJSmFehQqOqLu32wGvX+lAaKc3SdzxnIPaDi8kWnDIkGUU4fDro7Nm2thpOx9LX5x1w08LHL0MM1SWq4R6uyt0NNm1eHZH8vSECkG5bGUZo1DJWrEZL4BXQFi516Nw47PyGD+VIypE2p69OSitqz6jjmeu59d4F1kTHJmBD4k2CBjfONZLjMToERWSZi6rjKUaVZpbsee/RsjC88afLedHIdkIjxNlkl7lyOOXcSJthmd3QKZrIrfgSIS9S+6/MJSzLr73X1jlVA1Lhg5orxzgHY2TNPEvbOZ+VIqYvOH2Bu1G8DBtgF5qiW34VTXKMpc0xFp9GBNd7XMg3bo+Har+qiidw0g983xBpfUOCogTOutfKxHUm4HoFuTrY23/JhmNPrdUpAJF/4fPXH4BceCnbov/PZxXQhVYYE0+JwS9gGnu+sQUiVdG/oM/KO4Q7l8VRtDwPF8wLZHtpigQSfAiWc2nkc9xwm7tPU/z+ijrEabunRGjOweo/siJceUGAnBw1M+9oN6VfaLgdn6/LqN38HbJT0rEfVWibWPVujn3HRviv0VDUFC7um8+eaoXOviqG853s53XtA9dJk1aVUAbLOkONHd4FovofrjD392HZC8dqe52Cc9ceufzEncD89yiQKnrkBPKNmwtV9jpODsaOpS2YZT4R+DY1hAjyAziFuiPpbbH8E+CRIK3u2ZjoJF8qNLoxRAWmIxsfe6YpJNBxIzlHkd+CfpfNr0SYoTAR2cB5x7eURkcp9dcp3X9DP+iPuvc3RGUe5N26BYk56DhG595/c/gfON8Xtx327bwl9ZiW83ja9f5XJRaufMuJMKNmicsg5y/BGXAuBcC3186oUTLL+J3WYV3QFzx4iRRA2rGOK66u1Rh+ZVeW5oCryLT3kL0U++v/doQW6YzX10cIjHE04YPrIlyge7Us1kM8eOgvmfbvG61yBYA/bnEfvzuocXezxrCpNbr3CoUUQK8kUtXb9I 제하는 내용입니다. CMS는 3억2천만달러 절감과 326만 시간 이상의 업무 경감을 추산했습니다.", "why_matters": "산모 안전 강화를 위해 도입된 산과 진료 조건이 시행 전에 철회될 수 있습니다. 미국 병원·요양시설 규제가 완화 방향으로 크게 바뀌는 신호입니다.", "strategy": "미국 의료기관·요양 서비스 사업자와 감염보고·교육 솔루션 기업은 의무 수요 축소를 사업 계획에 반영해야 합니다. 의견수렴 결과와 최종규칙 확정 여부를 추적할 필요가 있습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.cms.gov/newsroom/fact-sheets/medicare-medicaid-programs-cutting-administrative-requirements-excellence-patient-care-care-cms-3484", "verified": "원문 직접 확인했습니다."}], "verification_note": "CMS 팩트시트에서 대상 유형 수, 주요 삭제·개정 조항, 절감 추정치를 확인했습니다. 의견 제출 기한은 확인하지 못했고(연방관보 문서 2026-22812 미열람), 3억2천만달러가 연간 수치인지는 팩트시트 문구로 명확하지 않습니다.", "image_concept": "A thick rulebook with many pages being cut away by a pair of scissors.", "img": "data:image/webp;base64,UklGRtYxAABXRUJQVlA4IMoxAABQrgGdASqwBCADPpFIo0ylpKsoIZSYaWASCWlu+9N3u+AeZUJPNGrGM2ncfk7aEGewXM1eB/bPYMxi+kc+et/6m/0lvSf7r6LvPG85/0/+qM3pzIx/V3mo8zccX0H9F/2f7n3eL9/4/dr/mGRt///+Dxj/KP6vxb/3fze4m3CGgr9K9LSbp/q6TPT/vRTx//n52P0H/0BBOP/n611IUko/z/5+tdSFJKP8/+frXUhSSj/P/n611IUko/z/5+tdSFJRUhSSj/P/n611IUko/z/5+tdSFJRUiApR/n/1Tij3dXrZeq63ij3dXrXUhSSj/P/n611KebdSFJKP8/+fXlgH8/+vXAZbdTpJ0KqvWupCklH+f/P1rqQpJR/u1JKP8/+hK93U7m0zF0ktdCQp4G3QkKZ2kjKl4plY30ko/yz/a9a6r7XrXQfy6pCq9a8IGn2aaGqfWE9iallCPvreLo+7E4o/tz9a6w9JKP9H+hcMzG3QkKZehQznGZ+gLSW0DFr6WP+aJdskKSUf6AtJdOQAHNco26EHUhUm2LeKPd1emsU2ODYDSpa0g2ktj3dXrxTL1Tij+3P1nJtUeI23tetdSFFqvgdpJR6WP8/9xGHMxt1KebeD1K/5JGVLOdJH/nPPPV0ko/yvA61oCnQplZQPycz4j7ztij3dXWCJqjOoW5bKEfdTvOipJSA4JLy8C1mYpVOLqV4VtGfLywD+f+4j7yY288mNvAFU+1W9TWmLyFbum9SF2yQpJR/n/z9bXIjP1rqWg26kKSUjwx1kfanklNSsGuKY4Nt3P/n611IUko/0CZij3cr/kl04/9xH3jzm0vUhSSt8JAEKGwobmXn611IUko/z/6pxR/bn611JoChH4EkFao93V15TWVZ60NcwBLyKB/P/n611IUkogf+7sTh7K9Gp7CwG2hfppUtaGh9c8uwVjV/nDeIfz/5+tdSFF1xt1IbqhIBs8so26kQbT2dFIdBsL///GwOff1eLbi7eNj90nXjh4ZVa76j/LQnGgh6Q3WupDc610JCmXobfd1ewJYqVrqTP+tc/tnRuF/+8rtrZtrUjkkU+TdEZqlUUEgUcRctCMmhF8SbcuFfrGeylYHFu+DhmiqvYErreHhk6oGPd1etdSFJKP9AWLC+gsnTcmH7/8ea2dwcCeAWm1vQ1D7iV4DFofJjTBI+CIMP6IgeaqV "date": "2026-11-06", "scope": "글로벌", "entity": "일라이 릴리, 힘스앤허스(Hims & Hers Health)", "what_changed": "릴리와 힘스앤허스가 11월 6일 제휴를 발표했습니다. 힘스앤허스 플랫폼에서 처방을 받은 환자는 사이트를 벗어나지 않고 릴리의 자가부담 가격으로 젭바운드(티르제파타이드)와 경구 GLP-1 파운다요(오포글리프론)를 구매할 수 있습니다. 시작가는 파운다요 월 149달러, 젭바운드 월 299달러입니다. 이전에는 환자를 릴리 직판 플랫폼 ‘릴리다이렉트’로 연결하는 방식이었습니다.", "why_matters": "비만약 판매 경로가 보험 중심에서 텔레헬스·소비자 직판(DTC)으로 넓어지고 있음을 보여 줍니다. 조제(컴파운딩) GLP-1으로 성장한 힘스앤허스가 오리지널 제조사의 공식 유통 채널로 들어갔다는 점도 의미가 있습니다.", "strategy": "릴리는 자가부담 가격과 외부 텔레헬스 채널을 함께 써서 경구제 파운다요의 초기 수요를 확보하려 합니다. 힘스앤허스는 릴리 GLP-1 조제약을 판매하지 않겠다고 약속해 규제·소송 위험을 줄이고 브랜드 의약품 플랫폼으로 전환하고 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.pharmexec.com/view/hims-hers-partners-eli-lilly-sell-obesity-medicines", "verified": "원문 직접 확인했습니다."}, {"url": "https://www.biopharmadive.com/news/lilly-hims-alnylam-boehringer-ultragenyx-sevasemten-ani-egetis/873843/", "verified": "원문 직접 확인했습니다(11월 6일 뉴스 라운드업)."}, {"url": "https://investor.lilly.com/news-releases/news-release-details/lilly-and-hims-hers-expand-access-fda-approved-lilly-medicines", "verified": "접속이 차단(403)되어 본문을 열람하지 못했습니다."}], "verification_note": "발표일, 대상 제품, 월 가격, 기존 연계 방식과 달라진 점은 두 매체 기사로 교차 확인했습니다. 릴리 보도자료 원문은 403 오류로 열람하지 못했습니다. 수익 배분 등 재무 조건은 공개되지 않았습니다.", "image_concept": "A single shopping cart filled with a pill bottle and an injection pen rolling through an open digital doorway.", "img": "data:image/webp;base64,UklGRgo7AABXRUJQVlA4IP46AACwywGdASqwBCADPpFIoUylpCqoIbKYmVASCWlu7v8/15xWIznx13rx+2t7rFz+T88z5+w3fz/T0rMrfsrOj97+f/tA/6Xrv/wfpVdJH+v+knzSdPP/sPTb32rM05NeuXlH6Mp4mJP5XwY/lW1a8SdQu5L3hnAeY17/ffPN6+w8z/6P/K8ul4ln2P/v+wN/Pv9h6x3/H55/0H86AracSe1iaUaGR8U+mrTYSG+ATHn3iT2sTRxjprIfEzRxjpq02g6Wmwe8nuCdmEqO88vH9vBM1u6AkEpr7y0w/JaNLXVjmQjNopYrh97665EOV8+JIMNeE+SRMJ5b4ySnhcwzCembZks0xpIGmuXNprp8fEcY6aqaMpeMtd9hGMNK4Xe9PuKfJLQP26HD895rAEQHoRo3kJp+g1aa6ZqfDhGiqQvQ/vo6lMCjcq6ru5KNPoSs2fTTU5+hEaMqqVO4sFpq3ap0dIgkWJtF1PJ+kFQsTsu8KMZ0aSaRRCuRf7z16H8PX4xQlVSb+iMmwGzXufh/3N32S4B1juq011LAblIZsRaSaRG3lQ9mN598 3 섬유화 MASH 환자 381명에서 섬유화 악화 없는 MASH 해소율은 4mg 56%, 7mg 63%, 10mg 61%로 위약 13% 대비 모두 유의했습니다(p<0.001). 섬유화 1단계 이상 개선은 7mg 52%로 위약 21%보다 높았고 대조군 세마글루타이드 2.4mg은 25%였습니다. 10mg의 섬유화 개선은 유의성에 도달하지 못했습니다(p=0.072).", "why_matters": "수치상 MASH 해소와 섬유화 개선 모두 세마글루타이드보다 높게 나와 3상 진입 가능성과 한미약품의 향후 마일스톤 기대를 키웁니다. 다만 세마글루타이드와의 직접 통계 비교는 보고되지 않았습니다.", "strategy": "연구진은 효능과 안전성 균형이 가장 좋은 용량으로 7mg을 제시했습니다. 이상반응에 따른 중단율은 10mg 11%, 4·7mg 3~4%입니다. MSD는 9일 AASLD에서 구두 발표할 예정이며 3상 일정은 확정되지 않았습니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80571", "verified": "원문 직접 확인했습니다(AASLD 초록 인용 기사)."}], "verification_note": "모든 수치는 히트뉴스 기사가 인용한 AASLD 초록에 근거합니다. 초록 원문과 MSD 보도자료는 직접 확인하지 못했습니다. 학회 초록 단계이며 학술지 게재 논문이 아닙니다. 정식 발표는 11월 9일 예정입니다.", "image_concept": "A single liver-shaped glass vessel being drained of cloudy fat, leaving clear liquid.", "img": "data:image/webp;base64,UklGRowvAABXRUJQVlA4IIAvAADQuwGdASqwBCADPpFIoEylpCarIPLYgWASCWlu/+89rf85mMDnEuT9mv+H630Wzxcs7NcHoUx/zAbz2juOszplB5vb6vtIKyqv9vK87f17ePs153Tjpp7v4xRsaH32Hoj/r89fomvgfWum7b+rtTT4QwfWuin39XuW3RLCmpvV2pq+CBj5anD+rtWN+H6epp6iDLlxUwZMvhuxTFsG7d6K2FtdfPh2zpt2UT3U+hggcBuBejw26GG46OOiH6oHJiTGHhQkMIAjZHYeW6/If1dqafCFpiSrp+59xi5DHKLExifQBK7XZWhxuNg88TGKExyggCSuds0+ELxXiMxMczQwesBBIZCJMRKFx0cBpBps81j+u00cYNVc/+bEWENcW5Di3c36i4iwhg/YuhgjUFqP9Eay10SFN9Chg9FWDBDOuTURQuq+GjpNJJj/FXH9M6L/R2dFPv8+YcQQDtetZ0//eryL0Oi5x+uqk08Z2hcsYIJt8AvvNc2Z8YmLpVDLBvO2lFD6rR9MjEi/dqaffHadSgphopmTgGuV58QNvbU3PcT1qjli0igbdHlDciYQXNdEVOMOhxtzPxM83XznlxErAGYjn07G8l8wPDxno4YjLUToZaFbGG+ZdPGVQOCOmSAO+cBt0RfO2aeM9Iz5fguY4hUpJdax8vt4bMH0R3Ju/7k1NSrQpThPv2OZz6YHuysZekge7EzfBTPZEHwegQ/ZJ44cOa69dkedf+eKwErcVbzsy5ZfknRh4xtpmoxHfML70mtdyHhk4QRuNMSzL3Y5Zmn+MkGyGCG2doLN2Re3zb7mOzYz//RuIZfgLkbS5W0d/2iXwGpQ5i/HFOXDzjVDmYwXkJKCD0jE/1ZMijFmZt/ecaYyE82/N51xh2gWSlbkKrFOEcbaA4Yt0XFEFvSMwOkPSNZTdxNQqXkhwccQfEGfv0Udo2dymIZNoyWTE/vC/lUYSa09sSveYy43eZbRiKqUnWWiTj2hRUKzVfVFPtudCEJvVnAFdOVSzjczoSh2+A5OHRrYQ5xa6Q4sVHko0ZeE7ntFp9hl const CATS = {

const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
