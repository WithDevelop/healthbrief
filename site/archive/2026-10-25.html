:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}

body": "교차투여 보정 OS도 HR 0.85(p=0.53)에 그쳤고 FDA는 이미 추가 임상을 권고했습니다. 에이비엘바이오의 마일스톤 유입 시점은 컴퍼스와 FDA의 협의 결과에 달려 있습니다.", "refs": ["bio-abl-tovecimig-companion002"]}, {"head": "자가면역 CAR-T의 안전성 문턱이 다시 높아졌습니다", "body": "BMS 졸라셀의 다발성경화증 환자 사망 공개는 노바티스 rap-cel 사망 사례와 겹치며, 종양보다 위험 허용 폭이 좁은 자가면역 적응증의 위험·편익 논쟁을 키웠습니다.", "refs": ["bio-bms-zolacel-ms-death"]}, {"head": "신흥국 공공병원이 국내 의료 AI의 새 레퍼런스 시장으로 떠오릅니다", "body": "몽골과의 보건협력 MOU 개정 이후 탈로스는 국립중앙병원 도입을 협의 중이고 아이도트는 온디바이스 AI로 5개 이상 병원에서 시범 운영 중입니다. 다만 아직 계약으로 확인된 건은 제한적입니다.", "refs": ["ai-korea-medical-ai-mongolia"]}, {"head": "대체조제 실시간 연동은 2029년, 약국 채널 변화는 느릴 전망입니다", "body": "심평원이 제시한 의사 EMR-약국 연동 일정이 2029년이어서, 당분간 대체조제 확대는 제도 개선보다 장려금 구조 조정에 기대야 합니다.", "refs": ["reg-hira-substitution-audit"]}], "priorities": [{"head": "소세포폐암·DLL3 파이프라인의 개발 전략을 1차 치료 기준으로 재점검하십시오", "body": "DeLLphi-305 수치를 기준으로 자사·파트너 자산의 목표 제품 특성(TPP)과 병용 설계를 다시 맞출 필요가 있습니다.", "refs": ["bio-amgen-imdelltra-dellphi305"]}, {"head": "AI 병리 파트너십은 계약 조건과 동반진단 전환 여부를 추적하십시오", "body": "루닛-서밋 계약은 금액이 비공개이고, 아젠디아 AI 맘마프린트의 일치율은 10월 30일 초록 공개 후 확인할 수 있습니다. 두 건 모두 다음 공시·발표가 실질 가치를 결정합니다.", "refs": ["ai-lunit-summit-scope-io", "ai-agendia-ai-mammaprint-esmo"]}, {"head": "중국 발 데이터와 승인을 글로벌 경쟁 변수로 반영하십시오", "body": "TAK-921·이자브렌은 중국 중심 3상으로 OS·PFS 근거를 냈고, 렐피데스는 중국 미용 시장에 들어갔습니다. 중국 진출 국내 톡신·ADC 기업은 가격과 차별화 전략을 다시 계산해야 합니다.", "refs": ["bio-takeda-tak921-ghope001", "bio-bms-izabren-panku-breast01", "reg-nmpa-galderma-relfydess"]}, {"head": "중증근무력증 약가협상 결과를 FcRn 계열 국내 가격 기준으로 활용하십시오", "body": "협상은 통상 60일 안에 마무리되므로 연말 전후 결과가 바토클리맙 등 후발 FcRn 억제제의 국내 진입 가격 협상에 기준점이 됩니다.", "refs": ["reg-gmg-zilbrysq-vyvgart-pricing"]}, {"head": "라이선스보다 가벼운 임상 협력 구조를 적극 검토하십시오", "body": "젠맙·인사이트처럼 비용 분담과 약물 공급만으로 병용 근거를 만드는 방식은 국내 바이오텍이 큰 거래 전에 글로벌 파트너와 데이터를 쌓는 현실적인 경로입니다.", "refs": ["bio-genmab-incyte-kras-crc"]}]}}, "archive": [{"label": "제6호", "date": "2026-10-25", "count": 14, "current": true}, {"label": "제5호", "date": "2026-10-24", "count": 21, "file": "https://drive.google.com/file/d/1Cwp5VtGdare4I s-announce-agreement-to-apply-ai-powered-scope-io-platform-for-tumor-microenvironment-analysis-in-immuno-oncology-development-302918571.html", "verified": "원문 직접 확인(배포 시각, 계약 범위, 재무 조건 미공개 여부, 이보네시맙 임상 수치)"}, {"url": "https://www.manilatimes.net/2026/10/24/tmt-newswire/pr-newswire/lunit-and-summit-therapeutics-announce-agreement-to-apply-ai-powered-scope-io-platform-for-tumor-microenvironment-analysis-in-immuno-oncology-development/2453150", "verified": "검색 결과 스니펫만 확인(본문 미열람). 같은 보도자료의 10월 24일자 전재본입니다."}], "verification_note": "공동 보도자료 원문으로 확인했습니다. 계약은 ‘research agreement’로 표현됐고 선급금·총액은 공개되지 않았습니다. 이보네시맙 관련 수치는 보도자료에 실린 서밋과 아케소 측 자료를 인용한 것이며, DART 공시는 확인하지 않았습니다.", "image_concept": "A glass microscope slide stained pink and purple, overlaid with a faint glowing grid of tiny measurement points.", "img": "data:image/webp;base64,UklGRgSTAABXRUJQVlA4IPiSAABQ3wKdASqwBCADPpFInkwlpCaqo1qosVASCWlu3MVoX5++xrjR/Ulzz+NPlokPwM8/8jnSCt0TmlH/odNLcb+RseDTh+Xx8vXG5X+VP//8/19M8Xx7EzwfeqD/AdJb1fc8L51+/Absvkx/wH/2ejvzWxWfOvqPgu5/+37Ua8l84f9f3s/MTUFw+/4vbF7j/u/2+9gj3j/Mf/z0hPzvNj+H/4XsB/trxUFAPt4vTN7/+47+4H/+7Pwjap26uVrL2goVSelpTeUt4bltigzzcbtOAxjEpqCgoNTHdfaOrH3MgmsOpCSBVyaE1C7bxuzeYjwbm00QmtjhdmGLGB4f0eFx6kA8WX8h3YPTKk5baNm/VG7TPKWcFN9+3+E7ftlR1ElfCBD5dkqZ/Kp7Yyic2pkAfYpsBQxKo7E9uhvnv5E4oRxK1to7LaE41f40wdHpBwkKV2+fn82sgNjbnSvHP7CsdJg7psfaOonNb6+T6tMxYONfKdPdmoj3YYnFhUfH11PUni0C47v42LfNUg1htbWbcWCwas7JaomSTKt71pY+3miZ9HSi7NE1HHWqITGf9UjVS3iHq3eY+kIErMrGXIYd/h8y43duCt9a1p14La/FkQCobgwwHq8tuOG0dV7ygT2FSSwptmughjqESKA8Om5clBYWutP4Z6e1i3LC+IdnSIBIQ+teTcyZC2FPlO+D2b3uOQh28Hx8gtqJE+rHSY2g5Aou2XOGLJPBsbkS8P41JUl5S/BtY6LR3eHIGCc/1ICuriq2ztq4nDKqRQYVj+bpDUsSSPTc9Ym+tQU6gwQ7rdR3W6juV0PayNSNSU0qY8bqdLSexWjqx/uEvMFm2DvGQB56jGafvi7FK+H1/9B0vaUio1POq5cFR1iXYI+57hNKnI7lJAYYVTpCS2zXJCZKKDyt58hzCnQ7yQAYStphH1aMRjixxOswI7R8F53Xxw28sBvAzvHNB5HFbe0DdR1X8Q+oI+tKheogT24zGv+IBWKdhLelK+wChBGK31Y2Hy/GblulEnn3Grhjdmm9UjL5tUuD/nb7HOPbvs6vUzpII1Ilm22/5KFw4PNFOFJC6Rv4WbZAc/SD0xXupbwfTwmoKCgwQqQFewsZMJUez9bhqN2WN+ 쟁점이 될 것으로 보입니다.", "strategy": "주 1회 인슐린 경쟁사와 국내 당뇨 사업부는 성인 자료와 소규모 약동학 시험을 묶는 이번 허가 경로를 소아 적응증 확보의 참고 사례로 검토할 만합니다. 국내 도입을 준비하는 기업은 식약처가 소아 외삽 근거를 어느 수준까지 인정할지 사전 상담으로 확인해 두는 것이 좋습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.prnewswire.com/news-releases/novos-awiqli-receives-fda-approval-as-the-first-and-only-once-weekly-insulin-for-children-10-years-of-age-and-older-with-type-2-diabetes-302918384.html", "verified": "노보 노디스크 보도자료 원문을 직접 확인했습니다(2026-10-23)."}, {"url": "https://www.ajmc.com/view/fda-extends-once-weekly-insulin-to-youth-with-type-2-diabetes", "verified": "AJMC 기사 원문을 직접 확인했습니다."}, {"url": "https://www.pharmacytimes.com/view/fda-approves-awiqli-once-weekly-insulin-for-children-aged-10-years-and-older-with-t2d", "verified": "Pharmacy Times 기사 원문을 직접 확인했습니다(ONWARDS 2·3 수치 확인)."}], "verification_note": "FDA 보도자료나 개정 라벨은 직접 확인하지 못했으며, 승인 사실은 회사 보도자료와 언론 2곳에서 교차 확인했습니다. FDA의 정확한 승인 행위일은 확인하지 못해 회사 발표일을 날짜로 적었습니다.", "image_concept": "A tiny insulin pen resting beside a single circled square on an otherwise empty weekly calendar grid.", "img": "data:image/webp;base64,UklGRhQnAABXRUJQVlA4IAgnAABQjwGdASqwBCADPpFIn0ylpDQoINEI2oASCWlu3Ja5X8FjRyT/2FAz8tV34Z8zY0+4mUFD62beOIg9zeb9XGaw/hH/t9OjSDxsfK5Rxtpw0f3ewKnjPCINc/0rfHlebpIx4j4YFebpIx4jSRjxGmGoYDy1jIk+kjHiNJIbu7fKxebpMLfHleu1/WMDSMQOo+E0P9bPY8fTMDy6J2dQF0TSw4rz1o3SRiwU9W+Ze0FE0kY7BxybwNjpcvc7sFvw6JFk98Nghe/W2mjdvDRvMGI/1vkM2SBXIiogXH/syHi6mHhPu/raPkiTMKseMuSMQSMdgsKTVRpJDfAXGk3YnMWafN9XxyqfMRcNoC6OgFa3bQEcuGUO7T9iaTnL09YjdPgTkmbLaHpJDyVn/Zgw+gNWVCs6WJekoLWOMPHiOTk0mLGUzA2IJXWNGlmzI5Ay39ANXbJLwcYM2XG0zA+S11GPy+1tPhnN7len8ieoE90BmMStSSoJpsEgkf6mhEJBpT+2ToP8xkLq28Nn3PDfkuDbPMulC+eWEUGCAtI0XGWrzxoKJP2DiyIyZXm6O1PC0/bYdHkK3HYUXt59f6eMYgddBcf6V13TRK6lf/Xq/DkBe6WbZNU2sY8Rmjj2nma0Fx/oKEXRmmSeeyP2TdTXxoGF2oWn7EzJMuKlNmf9HNl9VT5urPIlrzYsyGZUSn0rCF0c8IN5TugoRHlfGzIfViNJFh0dPMJB+GksZ6mczqhYgzWJsLyqkc1HMukjJESSfTnabyfkVRU2ESlYjuBMYOyuhXulW2I0nOaPLETGL5D7OoSHApSV9vEG90o76xW0qgC+2rTM2U/D2JQgLmwveJxGub0Rella what_changed": "라이트팜텍은 10월 23일 아트로핀황산염 0.05%·0.025% 점안액 ‘마이오클리어’를 소아·청소년 근시 진행 억제 전문의약품으로 허가받았다고 발표했습니다. 용법은 1일 1회 취침 전 1방울이며 안과 전문의가 처방합니다. 근거가 된 국내 3상(STAMP)은 18개 기관에서 5~12세 475명을 등록했고, 12개월 시점 두 농도 모두 대조군 대비 근시 진행을 약 62% 억제했다고 회사는 밝혔습니다.", "why_matters": "소아 근시는 고도근시로 진행하면 망막박리 등 실명 위험 합병증이 크게 늘어 조기 관리 수요가 큰 분야입니다. 국내 대규모 3상을 근거로 한 저농도 아트로핀 제품이 나오면서 해외 도입 제품 및 다른 국내 제품과의 근거 경쟁이 시작됩니다.", "strategy": "회사는 농도별 라인업(0.025%·0.05%)과 국내 3상 자료로 처방 차별화를 시도할 것으로 보입니다. 경쟁사는 급여 여부와 약가, 장기 투여 후 반동(리바운드) 자료 확보 여부를 지켜볼 필요가 있습니다. 회사가 추진 중인 IPO 과정에서도 이번 허가가 핵심 근거로 쓰일 수 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80154", "verified": "히트뉴스 기사 원문을 직접 확인했습니다(회사 발표 인용)."}], "verification_note": "식약처 의약품안전나라에서 허가일과 품목 정보를 직접 확인하지 못했고, 기사도 허가일을 명시하지 않았습니다. 보도된 ‘국내사 최초’ 주장은 태준제약 ‘마이오텍트점안액’(2026년 1월 허가로 검색됨) 사례와 충돌할 수 있어 제목에서 뺐습니다.", "image_concept": "A single glass eye dropper suspended above a child-sized pair of round spectacles resting on a nightstand.", "img": "data:image/webp;base64,UklGRpAgAABXRUJQVlA4IIQgAADwTwGdASqwBCADPpFGn00loyMloFGoWLASCWlu/+lbn67FO/e6oB9M6nltQUzANeOFLzXWVdY/M26+xId90lY9szOl38xlP789HTsX/Wf7Qa/v+C9QnxS9MGov0pgQlo8BOdOnTp06dUoySJEiRIkSJEiRIkSJEiRIkSJEiRIkSV+Qhq1QDqiRIkRpJQSDpwvWFChNgqdRq6pG5EcsSIuCzwePg5nPE7vnRZRIkSJEhjYLFnbbdw8adXq6JEqvDhyUAnOTyXTvHieokSJEidfHN0MAF3zp1CoDTYAe9Bpoeuf4F/kcBCg8GxwbSDNMnFKPHjmI/euOihnc6dOnTp0sc7ijyIK8FqWCDVOdZHJD9yCWaUSJwkzTFGPJEhj2AAI7EKCeLEkJoijEYJbOFJqHIZAjp1DO6YlCyozUTjuY2NonUjidFFDlbVhfivBalx6gk8idOnJMokSJHmLcHmcCc9ixCiA5wU85p0v50UPyHVw0TdOgVlxrNydL8Jq6bTml8k2mjYqTMKQMfEdhSPoaItKek21B0RU0mMNWgUCgTUQJIz24LFixYtkBZ9C/DOdUvXJkvgCdAJB51+Ptlep1CLnTp05RF1wSrZ7UEdQ0yRItOFChQslYiM7enw5YKzXVJ3H3964gLhuuJYEOby6MCgxNbNq1QjIpY4cN2p/AkP9DziB0A4c1U8/EThUgATnT3kiRIk1EiNIcpsdTO+qso+QIgQID44+I3Z6IoaTdDKhIn7PuhszFFRaNAx0t2AtE6A24z0Auag3YiKJp6uiNIhF0A859fgsU85uMB95kGsah6uazFL3bmbLK/Ec4VuUZcRFbBZ4PHknGiRIkSJK/USaiRGkOnTpYiBGe3cVpokUY9kSPvu4zQN1/3ebjhpJpLW8kr2UEiM6SDLFhDu1VlLf24N1SIHS _matters": "9월 8일에는 1차 지표 충족 사실만 발표됐고 이번에 처음 수치가 공개됐습니다. 현재 표준요법의 OS 중앙값은 약 1년이고 2차 치료까지 가는 환자는 약 40%에 그칩니다. DLL3 표적 T세포 인게이저를 1차 유지요법으로 앞당기면 대상 환자가 크게 늘어납니다. 3등급 이상 치료 관련 이상반응은 20.9% 대 10.8%였고, 사이토카인방출증후군(CRS)은 49.6%였지만 4·5등급 사례는 없었다고 암젠은 밝혔습니다.", "strategy": "임델트라는 이미 백금 화학요법 이후 진행한 ES-SCLC에서 FDA 승인을 받았습니다. 암젠은 각국 규제기관과 결과를 서둘러 공유하겠다고 했지만 신청 일정은 공개하지 않았습니다. 직전 호에 실린 로슈의 자임웍스 ZW209 도입 등 DLL3 후발 주자들은 이제 OS HR 0.42라는 높은 기준을 넘어야 합니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://investors.amgen.com/news-releases/news-release-details/imdelltrar-combination-imfinzir-reduced-risk-death-unprecedented", "verified": "검색 결과 스니펫만 확인했습니다. 본문은 403 오류로 열람하지 못했습니다."}, {"url": "https://biotechcatalystcalendar.substack.com/p/catalyst-alert-amgn-imdelltra-plus", "verified": "원문을 직접 확인했습니다. 암젠 보도자료와 NEJM 논문을 요약한 뉴스레터입니다."}, {"url": "https://www.targetedonc.com/view/esmo-2026-presidential-symposium-i-late-breaking-recap", "verified": "원문을 직접 확인했습니다. 10월 24일자 기사로 OS·PFS·ORR 수치가 일치합니다."}], "verification_note": "암젠 공식 보도자료 본문은 접근이 막혀 열람하지 못했습니다. 핵심 수치는 2차 매체 두 곳에서 서로 일치하는 것을 확인했고, NEJM 원문은 열람하지 못했습니다.", "image_concept": "A single glowing lighthouse beam cutting through a dense night fog over dark water.", "img": "data:image/webp;base64,UklGRhI1AABXRUJQVlA4IAY1AABw8wGdASqwBCADPpFInkwlpDOqofPZEnASCWlBZ9HQSdVNnU8Frj51n9nOAsQvg3emJeoRFcSznfbv/E/9nxKfL/7d0u39l3gncv9x7AHGLtGs+TyqDrp/5xoi+nk+Pqb/d4YeFTa5bejeXXp55OdMb8i/4uuooPV9H/JoC/w+XCpEZw/GkZPdiUc+h0cZuX8Ykc60S32q51olvtVzrRLfarnuE+0fNq51olvtVzrRLfarnlQoIrkPQWOUo5DUh5JRKDFkxmKVkfGO3Y4G3WyDeUaHjsqMEcf9bGjXfILkY5BB/n7yhCsXRjA8NEgbgoMa0iIYt9TJYsFakYK1YeNHzaudWHb83Nj43M+TuV9x8jAWB8g/z7R826KIKrGKCR4aPm1c60TiTQVtrENrXWiW+1XUjrWz+JJ+nij+4uPwo6PNw9qutQbsPaZSMkk68838+0TLiVNWdtrSJtoiwxAtID6C3naICN3wReTonmmBOQ3m5RY23jXWiVScUPuQJlvNr36+kRP+hCurbbSB0u1qkYNtaPGLBgfPNKH2l4D60S7tNq51YbhawxwN8cCRiO2yh+KLYjd3W1G1ZigWskibgdT3NtXOt3wq1oY75RTFoT1UjFPolUgkvV+v9LkOpkBzUG8Z2OQOy1RTWiW+4znpVgAStVzqyvqrCrS8D8iXho2EYYJRBb5uZy24TOxxLDxxOTu1ZVMr5CYB8fNq5 =0.53)로 통계적 유의성에 미치지 못했습니다.", "why_matters": "4월 발표된 ITT OS는 HR 1.05였고, 이번 사후 탐색적 보정에서도 생존 이득을 입증하지 못했습니다. 컴퍼스는 9월 22일 공시에서 FDA가 BLA 제출 전 생존 이득을 입증할 추가 임상을 권고했다고 밝힌 바 있어 허가 불확실성이 커졌습니다. 3등급 이상 TEAE는 93.5% 대 64.2%, 사망으로 이어진 TEAE는 5.6% 대 1.9%로 병용군 부담이 컸습니다.", "strategy": "에이비엘바이오는 2018년 11월 한국을 제외한 전 세계 권리를 트리거테라퓨틱스(현 컴퍼스)에 이전했습니다. 개발·허가 마일스톤은 최대 9,600만 달러, 상업화 마일스톤은 3억 300만 달러이며 한 자릿수 로열티도 받습니다. 컴퍼스는 ORR·PFS 개선을 근거로 추가 임상 없이 허가를 추진하겠다는 입장이어서, FDA 협의 결과가 마일스톤 유입 시점을 좌우할 전망입니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.newsway.co.kr/news/view?ud=2026102421053579374", "verified": "원문을 직접 확인했습니다. 10월 24일 입력 기사로 수치와 BLA 경과를 담고 있습니다."}, {"url": "https://www.thebionews.net/news/articleView.html?idxno=29294", "verified": "원문을 직접 확인했습니다. 10월 22일 입력 기사로 발표 예정과 계약 구조를 다룹니다."}], "verification_note": "컴퍼스의 공식 보도자료와 JCO 원문은 직접 열람하지 못했습니다. ORR은 사전 초록 기준 17.1%, 최종 분석 기준 18.0%로 보도마다 다르며 여기서는 최종 분석 수치를 적었습니다.", "image_concept": "A half-built stone bridge stopping short over a misty river gorge.", "img": "data:image/webp;base64,UklGRsZNAABXRUJQVlA4ILpNAAAQdAKdASqwBCADPpFIn0ylpCKrIbCZAWASCWlu/9XbDy3FncGJJoJnfLIPNU7Qc+6uTphDx86LiHT2p3x3E66w/h+P7xR8Wnynsl9ofKj2gqeHjg/nMdr1v1F4IfnzD1kNPpFoCO4/+fn2+4A0VS092IeEn4V8Nuq3u9d3Yt7sQjUnpae7EO7FvdiHdi3uxDvPZoHdt8RPRZrdoHdh1w9kecNw64b8sKAIM0rkNu6OVqrg4buBwVeT0QwvdRIjvPCsNgkQu2rfnBo9lBDIB82FQ7OGiXLEQhUxAiDL2Tby289H5b1BJknc2QYUAQmI8CDNCDtwUorChg7miAHRIqaYGgYshvCLbZYd5O7EOtpsgXapqig6FbDbqt7meEh+/YbQLr3XrbCB/EDun4hcSuiHeIOulhunPgljmjCtvT3lv5p93AqNpNUcCEU7FRCYVLT+kpX+7EO6HHOUmcED2snuyBriEE9e7E6Fqb24jz38FACh/pd1YJWw+Kaol5mVLUDczCwWoPbfqhi6cGdX643KajFnevVa11/3Em3i/JPSHqwJl7ZmFTER9iZIDSB693tQ76h3xQ5CwxHfEkhsjl1ZyxKS8+Ttzs7mIQtlw2bf9LmxCnEGLeoGtxCwThQw7Nsw1hdKH5P1Ybd8iN0ld8+9TuxK3FhxbTfVxb3YjmxCus6lprZ/wyQruy2VbufeAUucH589CcxGAfaITYekLwI/AuCDXk7en9X43nzxB+t8LD1qUrNrX1R3THsqXoTEeHw5LJaGX/cBiP9LlcLq7q3tY5DFtk+Vaf6ffmvEZrMr1sj2BsAINykhagzdmpHrLAuhAxqgRWjFvdmhVhtINIR4fJcSAgzu+RSGWw/BQb2tv09AiMEBWmI6jkhCgq4D5sAtbPOTd0WZeJPyywoXqxTS7yLcHdg 의 EGFR×LGR5 이중항체 페토셈타맙에 인사이트의 경구 KRAS G12D 억제제 INCB161734와 표준 화학요법을 더한 1/2상 시험입니다. 젠맙이 시험을 수행하고, 인사이트는 비용을 공동 부담하며 INCB161734 임상 물량을 공급합니다.", "why_matters": "KRAS 변이는 대장암의 약 40%에서 나타나며 그중 G12D가 가장 흔하고 예후가 나쁘다고 양사는 설명했습니다. 지금까지 페토셈타맙의 3상 2건은 RAS/BRAF 야생형 mCRC에 한정됐습니다. 이번 협력은 젠맙이 머러스(Merus) 인수로 확보한 핵심 자산을 KRAS 변이 환자군으로 넓히는 첫 단계입니다.", "strategy": "INCB161734는 췌장암 1차 3상 DAWN-303이 진행 중이며, 인사이트는 비용 분담 방식으로 대장암 병용 근거를 확보하게 됩니다. 라이선스가 아닌 임상 협력·약물 공급 계약이며, 비용 분담 비율, 데이터·상업화 권리, 시험 개시 시점은 공개되지 않았습니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.inderes.fi/en/releases/genmab-and-incyte-announce-clinical-trial-collaboration-in-metastatic-colorectal-cancer", "verified": "원문을 직접 확인했습니다. 젠맙 공식 보도자료 전재본입니다."}, {"url": "https://ir.genmab.com/news-releases/news-release-details/genmab-and-incyte-announce-clinical-trial-collaboration", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}, {"url": "https://www.globenewswire.com/news-release/2026/10/24/3387672/0/en/genmab-and-incyte-announce-clinical-trial-collaboration-in-metastatic-colorectal-cancer.html", "verified": "검색 결과 스니펫만 확인했습니다. 본문은 403 오류로 열람하지 못했습니다."}], "verification_note": "금전 조건은 비공개입니다. 보도자료 전재본으로 계약 범위를 확인했습니다.", "image_concept": "Two different keys inserted side by side into a single heavy brass lock.", "img": "data:image/webp;base64,UklGRhRzAABXRUJQVlA4IAhzAAAwcwKdASqwBCADPpFIn0wlpCatI1RZAaASCWdu+la4l9WX2l8xxK1QY2TNyZ7H6CBCa9/W1KJcVageVB0WmkJK6Vd5fbXKJeWXxfmzP0emz+1bxnndfUf/bt/I6Kz0jsnOlC+hde/57+Y/9P9f7S98P33wf/rv85z4/9Hhz+6f5/oTYz//HvLBbcuP521AuKmoH/0X/F+sB4Q9R7ps+loKrnyFv30qmPkLSqY+QtKpj5C0qmPkLSqY+QtOeLkx8haVTHyE51pE13pE5VHEjXpWZJ1XKaBAVTHyFp6DvHOtLcQWrhNVEA6B/C48cJmZcRi1xFzUtvKhWfdmNoAesM6SlUHrBlt/R4R06aDBPFR1Z0JLUieA6rNeLeLhufHr/XVjJKQDQQSrz5ElXsxZM84uGkDJKI/+yStin/dqGWJ7POy0qmWYn51pT9viL2yMWfcXRBSa7ZWuIualoINFkYBDKz5Cc60qmPkLSqdPailUVt9yRRvvUjuGHRMSNsLg2Sb+3akVwGF7Y0gWqi9XW2pskj4DYBKIB0EELpxrbtAHAeaCkRIy6MW/fNjKXs6+ASucFr8x+8wTB3ciaWPgn34XOlr87hDpJBDXCckGO0Y6yD0aZckYCQZx5Tc7cs0CqFZ8Z6CsLfzAlCyZHBE7DcNX9/Jmu , "alt": "섬세하게 균형 잡힌 황동 저울의 한쪽 접시가 검은 조약돌 하나로 기울어진 미니멀 일러스트", "date": "2026-10-23", "scope": "글로벌", "entity": "브리스톨마이어스스퀴브(BMS)", "what_changed": "BMS는 10월 23일 MSToronto 2026(ACTRIMS-ECTRIMS)에서 CD19 CAR-T 졸라셀(zola-cel)의 1상 Breakfree-2 데이터를 발표하면서, 고활성 재발성 다발성경화증 환자 1명이 패혈성 폐렴으로 사망한 사실을 공개했습니다. 이 환자는 주입 후 지연성 ICANS 운동 증상이 생겼고 스테로이드와 IVIG로 호전되지 않았으며, 주입 44일 만에 사망했습니다. 회사는 자가면역 1상 전체 190명 중 다른 사망은 없다고 밝혔습니다.", "why_matters": "BMS는 8월 말 안전성 신호를 이유로 일부 자가면역 졸라셀 시험을 자발적으로 중단한 바 있고, 노바티스도 rap-cel 시험에서 사망 3건이 나와 시험을 중단했습니다. 빅파마가 자가면역 CAR-T에 걸어 온 전략의 위험·편익 판단이 다시 시험대에 올랐습니다. BMS 주가는 10월 23일 약 2% 하락했습니다.", "strategy": "효능 면에서는 용량 2단계 환자 전원이 마지막 추적 시점까지 질환조절제(DMT) 없이 지냈고, 이 중 9명은 12개월 넘게 추적됐습니다. 전체 66명 중 CRS는 42.4%로 모두 1·2등급이었습니다. 회사는 사망과 약물 간 인과관계를 확정하지 않았으며 중단된 시험의 재개 일정도 밝히지 않았습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.biospace.com/drug-development/bms-reveals-death-from-septic-pneumonia-of-multiple-sclerosis-patient-in-car-t-trial", "verified": "원문을 직접 확인했습니다. 10월 23일자 BioSpace 기사입니다."}, {"url": "https://finance.yahoo.com/healthcare/articles/bmy-stock-falls-2-patient-194818944.html", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람). 주가 하락 근거로만 사용했습니다."}], "verification_note": "BMS 공식 보도자료와 학회 초록은 직접 열람하지 못했고 언론 보도에 근거했습니다. 사망은 데이터 컷오프 이후 발생했습니다.", "image_concept": "A finely balanced brass scale with a single dark pebble tipping one pan.", "img": "data:image/webp;base64,UklGRnA5AABXRUJQVlA4IGQ5AAAwsAGdASqwBCADPpFIoEylo6aoIREIiQASCWlu7l450eIDnr+WPGE9tS1I22gB14+sxkIW6+/LAvVCLxT+J77vCv5gd4z/VeiZ9OWPXelhk7kxvmV/C8YfRJ88mcXK/zX8yf0PQrwj+ZWoR7T83CGNzp+8/Zj2CPbD8L59Hyv/i9If4H/A/9D/AfAD+rvF2/WP9Z+13wBfyn+2/+3/Beyv9Zejz9I/2H7QfAp/P/8aD8xuD/nyXTj5QuNrm1ezg/58mCTB/z5Lp+K1pbXjHdL+fJdOPkuq/SaaWDAE2I5c9g/wFRiYj7ybjAKYZlnB/0k8IyvyXUrQ+oypEjHYsxn99Rm/1LDRVjAij/M+rSawizFiDg3M4VGQ/jY99Nm6oeLzQC7B/ysFaH5Ls754A/JeSfyXTj91+ipJS/nlWzD9Zgt0yTP+SXTU0eCp6XdEA6RyoIqA3OswWXqzg/ywQg/58UbwFJI5bHupIQXyo93V8fUMvR91fW5NO8+S7Z2wU+f01MU0P3z+iJczQrpdiLVL+fJdOPLKpAEymePNWKXKKYLODAMf5cPNGbpMu08Wufr const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
