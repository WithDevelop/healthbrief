splay:swap}
:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* synthesis */
.syn{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.syn{grid-template-columns:repeat(3,1fr);gap:0}.syn>div{padding:0 22px}.syn>div:first-child{padding-left:0}.syn>div:last-child{padding-right:0}.syn>div+div{border-left:1px solid var(--rule)}}
.syn h3{font-size:18px;margin:0 0 10px;font-weight:850;letter-spacing:-.02em}
.syn ol{margin:0;padding:0;list-style:none;counter-reset:n}
.syn li{counter-increment:n;padding:10px 0 10px 30px;border-top:1px solid var(--rule);position:relative;font-size:13.5px;color:var(--ink-2)}
.syn li:before{content:counter(n);position:absolute;left:0;top:10px;font-weight:900;color:var(--blue);font-size:15px}
.syn li b{display:block;color:var(--ink);font-size:14px;line-height:1.4;margin-bottom:2px}
.syn .refs{font-size:12px;color:var(--muted);margin-top:4px}
.syn .refs a{color:var(--blue)}
.syn .refs a:hover{text-decoration:underline}

/* inner pages */
.page{padding:26px 16px 0}
@media(min-width:768px){.page{padding:30px 28px 0}}
.ph{text-align:center;margin-bottom:18px}
.ph h1{font-size:clamp(24px,3.4vw,34px);margin:6px 0 4px;font-weight:900;letter-spacing:-.035em}
.ph p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}

4WqJMPApUtjzxyWRVwnp+7vLBPQIRcNFmTQenB4DFM24/7tnylmXZaQAAAA"}, {"id": "ai-diagens-ct-509", "cat": "ai", "alt": "수백 개의 작은 칸이 한꺼번에 빛나는 벌집을 그린 미니멀 일러스트", "title": "홍콩 상장 DIAGENS, 흉·복부 CT 509개 질환·소견 분석 모델 공개… 내부 검증 매크로 AUC 0.855, 핵심 249개 0.930", "short": "DIAGENS CT 509종", "date": "2026-11-12", "scope": "글로벌", "entity": "Hangzhou DIAGENS(HKEX: 2526)", "what_changed": "DIAGENS는 의료영상 파운데이션 모델 iMed-6.0(Thoth·Aegis)을 발표했습니다. Aegis를 기반으로 비조영·조영 흉부·복부 CT의 질환·소견 509개(흉부 263개, 복부 391개, 중복 제외)를 분석하는 CT 모델도 공개했습니다. 약 4만 건의 CT 검사·판독문 쌍으로 한 내부 검증에서 509개 전체의 제로샷 분류 매크로 평균 AUC는 0.855, 국제 공개 벤치마크에 있는 핵심 249개는 0.930이었다고 밝혔습니다.", "why_matters": "중국 의료 AI 기업이 소견 하나하나를 따로 학습하는 대신 파운데이션 모델로 수백 개 소견을 한꺼번에 다루는 방향으로 경쟁 축을 옮기고 있습니다. 다만 성능은 내부 검증 수치이고 허가는 받지 않았습니다.", "strategy": "MedBench 종합 1·2위(64.4·61.7)와 MMMU 의학 분야 1위(74.9%) 같은 벤치마크 성과를 내세워 기술 리더십을 강조합니다. 병원 99곳과의 R&D 협력, 400곳이 넘는 의료기관 고객 기반으로 상용화를 넓히려 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.prnewswire.com/news-releases/diagens-leads-medical-ai-benchmarks-and-extends-chest-and-abdominal-ct-analysis-to-509-imaging-targets-302937990.html", "verified": "원문 직접 확인"}], "verification_note": "PR Newswire 보도자료(2026-11-12 09:46 ET)를 직접 확인했습니다. 성능은 회사 내부 검증이며 동료심사를 거치지 않았습니다. 보도자료에는 규제 허가 언급이 없습니다. HKEX 공시는 따로 확인하지 못했습니다.", "image_concept": "A vast honeycomb where hundreds of tiny cells glow at once.", "img": "data:image/webp;base64,UklGRgKSAABXRUJQVlA4IPaRAACwOAOdASqwBCADPpFIo0ulpKOlI1KZALASCWVu4VhRs4glMU7b26onTBT+iv7rzytV/Ev4P2u+7b2X8m8j+uzVQ8/5a9p3//evH+++oR+pf6sf5n4uepDzAfy3/oesJ/6P3Y983+89Qv/ldSz/R//F/////8C/8H9Jb//ezX/l//j7Sf7QeoB///b+6d/tL5PPKnHL8j+9fcZyNImXlHz0/A3if+af2HoNYy/87xMtx/5Poce/3v95+f4v/u/0Xrh/S+oH/svSvwh/zH/k9hr+Tejh/0eVr7M9hD+w/4v/+/2zt/qcAlEA6CCUQDoIJRAOgglEA1X/crCclH3Fw3PkLSqY+QtKpj5C0qmPx+Shhhl4+UzAt7ZrN/bAgP4XQLFgGhAAQcNy4HefOi58he/az36xpC5Br8YA6CCFHJuK2MV2PBnEma5WfKZnjj7pcN1lkyNslCvsjgrYXEuHGCiilUwZiWAaA7HlzAnEbOE5UBVG/oGvEikicqmUgbtAD158hODXQRUFl5uTYd+Wp6CtZZvPPdtR8PIgY8J0rCsLVvuLgiQLxAmJ0UqA545cRctj IR·노바라드, 에이전트형 AI 판독문 작성 도구를 PACS ‘NovaPACS EI’에 내장… 별도 앱 없이 한 화면에서 판독", "short": "PACS에 AI 판독 내장", "date": "2026-11-12", "scope": "글로벌", "entity": "RADPAIR, Novarad", "what_changed": "RADPAIR와 Novarad는 전략적 제휴를 맺고, RADPAIR의 클라우드 네이티브 에이전트형 AI 판독문 작성 소프트웨어를 Novarad의 영상저장전송시스템 NovaPACS EI 안에 내장하기로 했다고 발표했습니다. 영상의학과 의사는 영상 보기, 이전 검사 확인, 자연어로 판독문 작성·수정, 최종 서명까지 한 작업 흐름에서 처리합니다.", "why_matters": "판독 AI 경쟁이 개별 알고리즘의 정확도에서 PACS·판독 워크스테이션 안의 자리 다툼으로 옮겨 가고 있습니다. PACS에 붙지 못한 AI 업체는 유통 경로를 잃을 수 있습니다.", "strategy": "RADPAIR는 Intelerad·Lifetrack·Fovia AI에 이어 PACS 업체와의 제휴를 늘려 유통 경로를 넓히고 있습니다. 설치가 필요 없는(제로 풋프린트) 구조라 병원 IT 부서가 기존 환경 안에서 바로 배포할 수 있다는 점을 내세웁니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://prnewswire.com/news-releases/radpair-and-novarad-partner-to-bring-cloud-native-agentic-ai-reporting-directly-into-novapacs-ei-302937241.html", "verified": "원문 직접 확인"}], "verification_note": "보도자료(2026-11-12 09:00 ET)를 직접 확인했습니다. 계약 기간, 금액, 독점 여부, 도입 기관 수 같은 상업 조건과 성능 수치는 공개하지 않았습니다.", "image_concept": "A puzzle piece sliding perfectly into the last empty slot of a nearly finished puzzle.", "img": "data:image/webp;base64,UklGRjQsAABXRUJQVlA4ICgsAACQmwGdASqwBCADPpFIo0ylpLKtoTMoklASCWlu+9NMG7r/b1f642T+gf8WmS+WXeZcwbjTyrj56F9UHp+IdzeHAPR3lVvNfj9/T3+QfDT8+/pX8AHOx8wvnJ+iH+2+mB1IHoO9MpkZzYeU/ge+aP3bSIctHm/qF3J+7g23/aegd7u5df3/nb9i/LI5If71/1vYL/mvpAf4fmW/P/9V7Df886oIS/QVLXcrcz0zJy3K3M9AXGYV/F9WYIy9C3SFimindOXF5n67lb7OMrCeaYWtITVMSpGkehSPqCRLzQ5O2oFuVu6HWppy/Lt9KJ5yJl5oclpFRRZ3UAXWJYPqCtuYZvOMyaem1OXE/YvJ1OVCikeONBtgFriBdkvi8zufmLkP2OWHnLyhczuLlxcutyR9OXF5OpznCjQrc7Q94swVuWX8chSwTQwmMDdTVRHCzWQuP7bmwzjMWcSa+YvMrnEyA5BZi7E2VuXLpy4vM84wbN7tFO6TeZ8an9v8Xmi/W1OCIpIp3FzXAnLxTCC2n6ecp279tmcbL7yqXF5xoLIAxGlZdCvIkvFOlqQQ6+0BcuSwT7W5noEHhZCMvHbPKUUkU7pv6UXRsUd+NMozcETVt6mVpkwwl2LQkRgvqAkzZ4FkXIaqV2iP62nhR5N42P2cIPmiOy/nKLjqmh08pSpIuunnegqFndSbUEUCoU9RJqbviOpbT0N/BSKveW/UvMoJqTlHm+tdJD+Rwp4sbjvFCFJ719QLc7Nv9EgmRRgPeqjOy0U7pOY4TvmZ4ErCmhWgpyoVxLCCy66c7N5NFxTuoaxeUr4qhScfau5A3KBfLCdZ8xeaFhE 스트", "title": "삼성서울병원, 호주 의료AI 기업 하이디와 MOU… 주 300만 건 진료를 지원하는 음성기록 AI를 의료정보시스템 ‘다윈’에 적용 추진, 하이디의 첫 한국 진출", "short": "삼성서울병원·하이디", "date": "2026-11-12", "scope": "국내", "entity": "삼성서울병원, 하이디(Heidi Health, 호주 멜버른)", "what_changed": "삼성서울병원은 11월 12일 하이디와 의료AI 기술 협력 업무협약(MOU)을 맺었고 13일 이를 공개했습니다. 의사와 환자의 대화를 실시간으로 텍스트로 바꾸는 하이디의 기술을 병원 의료정보시스템 ‘다윈’에 적용하는 것이 협력의 중심입니다. 하이디가 개발하고 있는 의료기관용 AI 에이전트로 원격의료와 진료 예약까지 넓히기로 했습니다. 하이디는 190개국, 110개 언어에서 주 300만 건 이상의 진료를 지원한다고 밝혔고, 이번이 첫 한국 진출입니다.", "why_matters": "국내 상급종합병원이 자체 EMR에 해외 앰비언트 AI 스크라이브를 붙이기로 한 사례입니다. 그동안 국내 AI 진료기록 시장은 국산 sLM·폐쇄망 솔루션이 중심이었는데, 글로벌 업체도 대형병원을 통해 이 시장에 들어오기 시작했습니다. 다만 MOU 단계여서 실제 도입 범위와 일정, 한국어 성능은 아직 확인되지 않았습니다.", "strategy": "하이디는 국내 대표 대형병원을 첫 레퍼런스로 삼아 한국 시장에 들어오고, 진료기록에서 예약·원격의료 에이전트로 제품을 넓히려 합니다. 삼성서울병원은 다윈 위에 외부 AI를 얹어 기록 자동화를 시험하고, 원격의료·예약 영역의 에이전트로 넓힐 선택지를 확보하려는 것으로 보입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://view.asiae.co.kr/article/2026111308463749422", "verified": "원문 직접 확인(아시아경제 기사, 병원 발표 인용)"}], "verification_note": "협약일(12일)과 발표일(13일)은 아시아경제 기사로 확인했습니다. 병원이나 하이디의 보도자료 원문은 찾지 못했습니다. 주 300만 건과 190개국은 하이디의 글로벌 수치이며 국내 실적이 아닙니다. 법적 구속력이 없는 MOU입니다.", "image_concept": "A hospital stethoscope whose tubing gently transforms into a flowing ribbon of handwritten paper notes.", "img": "data:image/webp;base64,UklGRi4qAABXRUJQVlA4ICIqAABwnQGdASqwBCADPpFIokylpKcoITP4cQASCWlu/HA2QNMvQ+b+uar0cLZz5YB3+j5/u+dDT0uasdwU9T9F/rl8AH6ydNjzAfuD62/oi/xnotdRf6AHTCZGP7A9DRjszfvvABd41PX+x6N7MNPC+EoT/B3Qm6I+si1jyQAyzcSYh0e2yHD6F9DjyjLc2IFuiWGxAt0Sw2UoWpsyzogPrC+c0Eb/xxACuUXWNWPnlrId126rEClpCoH6LzBKlE2QpB65HYE2MudyUDJLon1gdfpm7w2mK6XtNb6suy7budduqILsGRbNPm5OPrInPP75dUCBBjPKMVzE1QZnEeeSF2UeHyJnwgbNvV2ZzgWsnojoqafJJU/HqpKE3IMXbnxJhYnHvJvam8fbxRcxyOJeMuzO/tJOxPhH1kTLmBdrygEh/5H+Fkgf4woQP9NttwZDN7YBBIYQBBIPdX6NuXamnxJNjbGeHEVf/ljB1VSzj3MrdUe50CgxkQ+8H+Qtsx6FASsOsiYw4sycUvzxmK7yBXi/GhrPyXIlyxvN0R+g5RjI8ITdF/oayP8IMumZUIb2hClt2YQNm8lgw2WAKx88ak3jUyFLrxqFzBHYJlzulkI1lcYzEVOn4wq2MPke3PiS+xSmvSafEtiPCDKPD5H+DfDnh8 조정국(ONC), 메디케어·메디케이드서비스센터(CMS), MITRE, 드러먼드그룹", "what_changed": "ONC와 CMS는 전자 사전승인(ePA)의 처음부터 끝까지의 흐름을 운영 환경과 비슷한 조건에서 검증하는 10~12주짜리 공동 테스트 스프린트를 시작했다고 발표했습니다. 시험 대상은 HL7 FHIR 다빈치 표준 3종입니다. CRD는 사전승인이 필요한지 확인하고, DTR은 보험사가 요구하는 문서를 진료 흐름 안으로 가져오며, PAS는 승인 요청을 보냅니다. 참가자 모집과 매칭은 MITRE가 운영하는 보건 연방연구개발센터가 맡고, 테스트 환경은 드러먼드그룹의 FHIRplace가 제공합니다.", "why_matters": "2027년 1월 1일부터 메디케어 어드밴티지, 메디케이드·CHIP, ACA 거래소 보험사는 표준 사전승인 API를 갖춰야 합니다. 긴급 요청은 72시간, 일반 요청은 7일 안에 결정해야 합니다. 마감 50일 전에 정부가 실연동 테스트를 직접 주선한다는 것은 업계 준비가 덜 됐다는 신호이기도 합니다.", "strategy": "규제기관은 규칙 집행에 앞서 다자간 실연동 테스트로 병목을 찾으려 합니다. 사전승인 자동화 벤더와 EHR 업체는 여기서 낸 테스트 결과를 시장에서 쓸 수 있는 적합성 근거로 내세울 수 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://hitconsultant.net/2026/11/12/onc-cms-launch-electronic-prior-authorization-testing-initiative-fhirplace-2027/", "verified": "원문 직접 확인(HIT Consultant 기사)"}, {"url": "https://www.drummondgroup.com/services/fhirplace-epa-pilot-program/", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "ONC·CMS의 공식 보도자료 원문은 찾지 못했고, HIT Consultant 기사로 확인했습니다. MITRE의 역할도 이 기사로만 확인했습니다. 2027년 1월 1일 시한과 72시간·7일 결정 기한은 기존 CMS 규칙(CMS-0057-F) 내용입니다.", "image_concept": "A row of interlocking puzzle pieces being test-fitted on a workbench under a bright lamp.", "img": "data:image/webp;base64,UklGRrQlAABXRUJQVlA4IKglAAAwcAGdASqwBCADPpFCnk0lpymxIVAokiASCWlu/5a3p6Y0kYVgrQ47HuULzexZh6As1EWLrlh5zsh/P/4P2u8fRPQ9R55/SH/T9Yn/U9ef6M9g39WupH5jv2T9ab0R/4D0YOo//uPqAec96xH+H/7XB69Of2xfhyQDbnBmvuXVuVkJkHpAd+D614HYVVy3YvNBNdi8z7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz7cz7fUyP7Ba8mLlkKaLki7p6KCJmSrezTKWLQyU/NoxXhS3hS3v8vbxvLyd7Bn84xGXt3rutXbxWjAo7k9278JL2LzPtzPtzPw44v2S6TKsOTdykn81Cagk6bPNwlu5WTQjUGK8KbIRnddMv5Xv8kHsvNQzmsgMWLOq3Q7l2pJAWftl/dGKn1l3veQKbHsrtc9BiiKYW8KXSZm9UJApNJUO9085cXoMULct2J/sl1bvCyQEZg4CEXscyFRcX7JbwGR/YEEy6PRfF5n25n25O5OZsLeFLpMy9vFaKJb1N6axXwoFnH+3Js6xuEt2LydzlxeZc6S27rLXbjpHsVPgHYvM+3NQzzlxdNEuZ0FhdLTXfaTMvcN7jYUtNk3IdLe/zBwDsvM+3NEJz2nnKh0t4UlvJOPQxnFLe/qcpB2C5RRLdjcJ90vGK8KbIRsu8KW6eDUN rategy": "미국 신속 심사를 기대하는 국내외 기업은 바우처 대신 혁신치료제·우선심사·가속승인 같은 법정 경로를 기준으로 일정을 다시 잡는 것이 안전합니다. FDA 지도부 공백이 해소되는 시점을 함께 지켜봐야 합니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.pharmtech.com/view/fda-shelves-priority-voucher-pilot-stalling-fast-track-drug-reviews", "verified": "원문 직접 확인(로이터 보도를 인용한 전문지 기사)"}, {"url": "https://www.pharmacytimes.com/view/fda-reportedly-shelves-commissioner-s-national-priority-voucher-program", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "익명 소식통에 기댄 언론 보도이고, FDA의 공식 중단 발표는 없습니다. HHS는 사업이 계속되고 있다고 공식 반박했으므로 ‘사실상 중단’ 보도로 다뤄야 합니다. 로이터 원문은 열람하지 못했습니다.", "image_concept": "A golden fast-pass ticket lying forgotten in a dusty drawer beside a slowly ticking hourglass.", "img": "data:image/webp;base64,UklGRqA5AABXRUJQVlA4IJQ5AABw2wGdASqwBCADPpFIn0ylpDewoVFY+vASCWlLabx+wXfrOEN+7k13k5lgy1/wfweBx0v3CrjaX/9fxkbkqFE9tsMSBs/8WHdPOT+N7n2hb/p3o689fzzN+W6K/1nv8tk2Uy/qpacVI9Edd35z+5O658Am3voEd+PPem9fjzOX986IvwgkAZ+T8qhkKGbSRQM2kifpIn5P0kT8n5VCeT8n5QM2T8n5Pyfk/KCUtk88xPlTrh0jzAz8n5Q8TygZo8ByG1afkzto4j0ZG8x2W7iF7pOuHT8TLfDQmptTam1NqbU3VRl7pOu5qSq9x1UqUtqfqkYUS90nXDpusHFr5JGfk/J+WM7n5TF0nXDpu+qRjs3WqcQw8m1NqbWkS963lDxcXShCA05whtdc4vStN11UuLXVSYqn8lPwy+Iwte6UZYCA6qhBKx7HXDpu+qVtGvIl71yiLBi4uk64QN42CVkbrM4MFuC21ysTzy6ypFsuo4Q2tT9U54Ac9dvkwY3ZJ0bsjUmBWSOonAHYW+kxNo9EwKo+gzDo4qSVpMPK6pdLVXyCpBm6bat3gC6Tt1fAK9w6brqolUJbYfXQLvGl+xH3XpA0GEqW6/6yVGhK+xGPTbocqtvgpIoBh0eXEX0SDFz4C5niXxAKG8q/NCFXygsBAWAsYcGjpCAsBBINrU23BaKrupYz37JfP0eWFFF9jY0HTt5/HXl8XUjvdhb+FiUlS2m2jy7zF43z3XwfJvTSZ3sgU/VIKhPFDQO2tlVbTqrvraYW7n+7iz8pi6TrtAuMraYB36eDhbPV25QpnJNgUecnMf8LOdSCGX8bD78enFzPQP9wfj1HQ/SQR04f8NNxK2Kjh05JIni175nTv4Y2ZtmLUgGiZxp0uS+cdm7efbn1IdQJPjK545cgYSWqEIWuIyuEEBPwtYwToMhyp1w6a/dgsk1BcXSQ6SAtcIUrMlyQAnES4E7X3z4l5VEV5zhWnar0CRAMY4ulQmPRLEdgq4VHCGdXGEg2dO4oPjZLh03k1FbRdQu1QVTI5Dvmdq+rzMISpzxBFZh0ZcEsdwpqYeduliA5vugD7ihoRd/ysRt2K8Q/ZC90nS42tTe4yEuHlOyPjXEGptNCT/kC9Bt586WlTrh01wQvfYC9gbHX5okJCRdOGlqqgvrxOUyIc6Qc4cOm1NqcsW3rf4Uo5FEAmqEz89InkPnlgJoYVu ow stays slightly open.", "img": "data:image/webp;base64,UklGRtJQAABXRUJQVlA4IMZQAAAQegKdASqwBCADPpFIn0ulp6oxo9K5KjASCWlBgCquWCYCDDLjeZo3svy//Z7Ub0rfrroxtQuT+pVl/Xqt367/AO0PX3z1O8cHb/bzp+Xzejf1jod92l9CLpyvTgyXr3J55/lf+T//P+L2eX97+z9tD/qutf9vWk+5/6KRd6/TNeEVu3hbREL2J/+e/s9NUVYM+DJ+cGT84Mor8PGc4Mn6AaKZwZPzgyficti/ETsfvnY/fOx+cLbNbuU1s/x0CWK3oJdhBygom+uFNqejbFjLKPa/vOTNZQ85ga64YjzKUtAfumL2CgGwpHc++fQIUnvofvmT77aUz4MmHhda9t2Kc+P/45CKnp7dt5wymukzhlwRfIPtvnUF5yh5xlypjA2sptrCI6jziTYDUzg1DhoTGAFVDE1z+sAfbYUBOenunou55P6xtrd402qZ4s7PYLTE++dimd1mLwJ2Iidu5W+aU0Aq7hkzWT84MzMNTOlNAHdsTBTfxwvZ6tJifev1SJO+6NrB5DYVkZ93J3C5nGBpm5Sr7RJxik8GGgBpKpwyfMpoxWMjPDnT+ZmY44eczLTWTToMObyE0+mBHtQP6YcOelFKAHnAGnHUjFM+VGnFnMCtH/0J85QXnJ80afOOmgOoLzk/KUz4NuOJviYUu3IpdZnrqrCWDjOcGJeFkxgYE+Gxu3WAn2E/fOoLzk/ODJ+cG3G41ksmC9tKZuNDkQI6W1wFNxqejbE+wpDdypSblrEytfxiMgADyZrLOCYjrEwEnzh7YOOr3KvgxZE+LAIMM+DEjkIRtkodEyfXNf81vKWl6dsva9J5iLIG+2APMdaU+VG9UecZSrJxpZ5i02EQGHLjC0m5pfnst1nHjk7moXSBXDsA/zMuUisE3mcFknaeZZsmRLQtGOFsTvl4Pu+ZC3V0N1DOvbPgyfLeNxNqsVE4KrvK4B1xzW7JMUKdJ0onHLHm6wN6ZfzozgS4rcMIFTN6WxwkTVh4luhrv6/I/tQgCcdZG+A+qa/X5ecTsL0spIarBAEICtfn08DTBHtcDCMrp1Oe9kWgzGPLOZlwFVXtdwK3dtdOjHiJXyCgF2JRwBqyMofvmQ5lAj3gT7CgH+ojwz3Jt087JZJjGBRzXUDyceU5yJmT3OGUC3g/i8iljUwDIF+w3sepaPeBOXaLwe0YSPU3pcdWcVmjwyzCp6dty+7GX1GUpvvoSMrRDjYhRVw3hNMQAVIB7vphGyGYt8AWU5XiK/qgNfy8+DLRPPvX/YqfrcTasmg+Q1gBvmT75yfv4tvupJTU0CpogDLX9FYxz52E6RYGKF0hYvY0T2njSVg7YBg/13xgQwslZFeB/nS65fWMBjuFERd0Snx4pR4JgnL1/lR0tzJryOSwa2T+NCfmrRIsdTDbbYZj58y4EP5LxpEeddKTR8Spna+j3QLQInVj75Xq9Xq6RSNXSNTo89jJgCB++dP1SgY2xVkWtV9v0GH4DxXFzD/cZwisng6usF1AVMys8Kub2klfdz+zrJnGGVLk1j3fMO90T3h2VskZrSEXQM/hoHf8X7sGIxGIwfA06ATp4PG2m6tCKI9I6f/ak1ja4BaMMTCB8ALMFgvvrBpM2IUHY+MBGhMIrfhWoaPIQ2AfRAoGYz2oJf6TwRcZgRyO5KFqtT0bcAEzcU2DMI+cIa0ujQTPsoQ/lbZjr6QUcv7rRVLGTKXLxlz41QpIfuIShwFa5jOsJPUZFXiY4+1gzk7HxCSO2GvMq+mIqtjKCtQVI13QFoB281TVlg/s6PW4CTetTJqQkZ9L5OfjmypPHgE6SbZzntZRNX1KX1sP+zgu1c+vkm/WqhirTizMoZ0pnwZQhmm9B/WBNS2+qbd6IHZITKsLrv50y6FwIqUcHUdFeMl47SC4c0S5Nk7/To2cQXF03Zr  보도에 따르면, 중국 국가약품감독관리국(NMPA)이 릴리의 경구 저분자 GLP-1 수용체 작용제 오포글리프론(상품명 파운다요)을 체중관리 용도로 승인했습니다. 중국에서 이 계열 경구약이 비만 적응증으로 승인된 첫 사례입니다. 노보 노디스크의 경구 위고비(세마글루티드)는 NMPA가 허가 신청을 접수해 심사 중이고, 화동의약과 항서제약도 경구 비만약 허가를 추진하고 있습니다. 파운다요는 이미 미국·영국·UAE에서 승인됐습니다.", "why_matters": "세계 최대 과체중 인구를 가진 중국에서 경구 비만약 시장이 처음 열립니다. 주사제 위주였던 경쟁이 먹는 약으로 넓어지고, 노보·중국 토종 기업과의 출시 순서 경쟁에서 릴리가 먼저 나섰습니다.", "strategy": "경구 GLP-1을 개발하는 국내 기업은 중국 진출 시 릴리와 현지 기업들의 약가·급여 전략을 기준점으로 삼아야 합니다. 국내에서도 경구 비만약 허가 신청이 언제 이뤄지는지 지켜볼 필요가 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.pharmaceutical-technology.com/news/eli-lilly-oral-glp1-ra-foundayo-nmpa-approval-weight-management/", "verified": "원문 직접 확인(로이터를 인용한 전문지 기사, 11월 12일자)"}, {"url": "https://allsci.com/news/approvals/orforglipron-china-approval-approves-lillys-oral/", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "직접 열람한 출처는 로이터를 인용한 전문지 기사 1건입니다. NMPA 공고와 릴리의 공식 보도자료는 확인하지 못했고, 정확한 승인일과 임상 수치도 확인하지 못했습니다. 중문·영문 별도 검색에서는 승인 보도가 잡히지 않아, 공식 발표로 재확인이 필요합니다.", "image_concept": "A single small white pill casting a long shadow over a row of empty injection pens.", "img": "data:image/webp;base64,UklGRvIkAABXRUJQVlA4IOYkAABQogGdASqwBCADPpFEnkylo7atoRBI0tASCWlu//I8u7RDD50x6KVJT34X3TDaafuTerf8Tmc9T7p93PppNHoeCMTzWkm+2PXSNIjvfNv6Q87vo98wDn4fuV6gP2q9ZH/keqP+5eoB/i/7p1rv9e/6/sLedb/5/aS/xH/W9KDV3Jv/jH+Z4y+8gl/5HKzIU3PyTbWeCzjy3Q0keJ9ZmJGPGaYZseszErLHrMxKyx7XRIx4zSRjxqSp9jnKqWO68jBS/lGBIJDtMLdvH3dZNZ6poDrD0kWJSZPBlMzvHd1IQVEPRFNpSOABlta1O9mo6K8OiYkh5Mn/0h2ysy25sk1xMugUkfPnBYoDXk/65HS4+RvFzRTNYsdgx748657XxBQsIwkxEZomYaaSLj/Wg3cYtOq3hWmAUJ7abZWBUU+nD48v8gNl0If+k6M5TDByCe2/nboacwU9zirrpcfHJHVBWjHjNJQaGJows/A24Cwh/gQHNb48t1G3Q0mGacf6zDZHClohoaEiv8o46W7diX008MdpSz9szMiwN55JlODiFWeMeM7SjWoPgJRAb+wszEjJqK/zTxXz9j1ydz/HIXaoDHFf0hxrGKFHtdwdDbJ3BOaEekQGseszEjHuUQtdHO5KGJGPGpjMWI3AubIjJxIrqd/nIQWhfJL3mliJKoUe48QBBVg5G6Sssenpw+PFdYmHlsPQi79dnWjNUK8mTynQG9QqHFMua/xW+Si6ozRXRyDHMOPdh5cd8105wC5Ls6tR5kxIJ8TjX3+wTNbAFiySG2TzxX7BFWj4w+6u/WMVGaiBmkjHiWYudP94lFUTE 지 추진", "date": "2026-11-12", "scope": "국내", "entity": "보건복지부, 건강보험심사평가원, 건강보험정책심의위원회(건정심)", "what_changed": "복지부와 심평원이 11월 12일 남인순 의원실에 낸 자료에 따르면, 비대면진료 시범사업 기간(2023년 6월~2026년 5월) 동안 지급된 30% 가산 수가(관리료)는 308억8,900만원입니다. 의료기관 275억4,100만원, 약국 33억4,800만원이며, 연간 지출은 40억5,500만원에서 95억6,000만원, 119억5,600만원으로 늘었습니다. 복지부는 이달 건정심 의결을 거쳐, 본사업이 시행되는 12월 24일에 가산을 폐지하고 일반 진찰료·조제료(100%)로 되돌릴 방침입니다.", "why_matters": "가산이 폐지되면 연평균 약 120억원(의료기관 107억원, 약국 13억원)의 건보 재정이 절감되는 것으로 추산됩니다. 반대로 의료기관은 건당 약 3,774원, 약국은 약 1,054원의 추가 수입이 사라져, 비대면진료에 참여할 유인이 줄어듭니다.", "strategy": "비대면 플랫폼과 참여 의원은 가산이 없어진 뒤의 수익 구조를 다시 따져 봐야 합니다. 11월 건정심 안건과 결과를 확인해야 합니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.dailypharm.com/user/news/344512", "verified": "원문 직접 확인"}], "verification_note": "수치는 복지부·심평원이 국회에 낸 자료를 보도한 데일리팜 기사로 확인했고, 제출 자료 원문은 보지 못했습니다. 건정심 의결은 아직 이뤄지지 않았습니다.", "image_concept": "A small brass bonus coin being lifted off a stack of identical coins on a scale.", "img": "data:image/webp;base64,UklGRlIhAABXRUJQVlA4IEYhAABwcQGdASqwBCADPpFIo0ylpC8rITO4WeASCWlu/+q9R5zfWjqL96Hg0aB27ZUTYuuYHobyHzQb+J0cfTTMf8u7lrzcem7zDegB5lfOg9IO89egB0TOTtnc97v8HtIyM4zf9l39GncjTOt/fqPbK9PHAv+JgRVVPb0DR7Czy+zi0GQTMs8vGNfMvF7INnl4xv5dmcoiDZ5sThmdEVNj8rdMdCn/fljlhiz7nKucse4bsLAA37iJmaIbKygnCVEpB7Ka7af487gogUNhkiShQD/fXYKBQ2Qa1bTWMvVcaD6uF7/VNYM0h0QZI4qmsHQbmvRO8JvrVbbpii9j5Bkup+HkvGICUoFDZBrWPCfZmgUNkGs8lUYEBjzLy35yCvcaX/U+TzouKIFvK+7HLC0IVXP54fPShXQ0ZpaF2+/LUAZqdbb/PptZNrH4hbKvxWfpAgUOl/eJfaHlNTqyYJWBzpB5aDxpyzy8XtZOiKMzy8XsfIMlj+34Z/lusHRMVNj8M/bL+3O89aBrQzjNpK8T1lHX1Qe1NfaZo4PYgTPEq2z0mL2QbPM5OqaiMaOkGNqbzSfHyN7H9vqjI2QzqBcZyCZmZU1V/0VNYEmxs0Ys0hrR4+++EuK5yW/DILrPLw+1q12GSbfSFiBEOiIcfPj8QXFGgbsNNNjL/SIos8uu9DxnDZBIpsg2eXi4po6KvxWuGXtTWGcBp/TvlZNyxh7U2rXV8F6JfwVAekHtTWEBdrNTJH9PD9L5ADpAHFabMzeLI1p0IFDYykwS8P0PQBI3o3E3JkDqazy8Xomr8WeYDsme2y2mElILsqL2PhU2VuZBtAPqarWP/35iO/TE98XEgQbF4mm99u9RXIKc30QDM/mt1UcONmxANBLcBGKoq7pz8kBxUoFDeVAobINn3BRAuAYJssp3WfYaYbwvogvVYiD7skGNoCM9WdRw6380kmP15Jt0HWinvz2LCYnP2sNlO/cYp 대면 진료 비율 제한을 약국 쪽에도 맞추려는 취지입니다.", "why_matters": "12월 24일 비대면진료 본사업 시행을 앞두고 플랫폼을 통해 처방이 대형 약국으로 몰리는 ‘전담약국’을 막을 입법이 처음 국회에 올라왔습니다. 대한약사회는 앞서 약국당 하루 25건 제한안을 제시한 바 있습니다. 복지부령에서 상한이 몇 건으로 정해지느냐가 비대면 플랫폼 사업 모델에 직접 영향을 줍니다.", "strategy": "비대면진료 플랫폼과 약국 체인은 상한을 하루 25건 안팎으로 가정해 처방을 여러 약국으로 나누는 구조를 미리 점검해야 합니다. 복지위 법안소위 심사 일정과 복지부령 초안도 지켜봐야 합니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.dailypharm.com/user/news/344523", "verified": "원문 직접 확인"}, {"url": "https://dailypharm.com/user/news/342494", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "발의일, 조문, 제재 내용은 데일리팜 11월 13일 기사에서 확인했고, 국회 의안정보시스템 원문은 열람하지 못했습니다. 하루 25건은 약사회 제안이며 법안에 들어간 수치가 아닙니다.", "image_concept": "An hourglass-shaped funnel pouring prescription slips evenly into many small pharmacy jars instead of one big one.", "img": "data:image/webp;base64,UklGRlwxAABXRUJQVlA4IFAxAACQxAGdASqwBCADPpFIoEylpCaloZLYkNASCWdu/mAZCeBjeEeE2zrhTOD8VN/9rwWZD9ZfxP8h6f3G/eh7K+//sP4u/6XjhHR7r85H+89VX689gf9b/1s65PmV/cH9kfeu9Qv+F9RD+8dTv6DHl4+z7/V/+X1AH//9uHpr+0m53qu66y8fgJmbA32HpR2sefA5CWka/Sbqjg4Z8UHNh2mqXVHBwz4oObDtNUuqODhnxQc2HaaplZODquRUC2VfBw0KzD/vISYBLz1ql2OjqHCYG19Rq/BXTuxBy38hfxzYRrsPU2n0jvOAqlwYcQZTVHBw52xceGXZvYaFMEbGKuab4IHZFliQVS6o6jZODhnqHQIKpjPOGkapvmIixUCEl/CsOI4N52pogZTVHMeKDmyB4m3zEGXksCKfHyDJ6yrNE8qor4jg4mD7i8Fv9ATAyocu4TAyfo/qjmPMX4l/JC0NlNPwzJ81vDheRufgj7t+gwYDtNUxoSZi53bkqhfyIg68B2SAnbAy8lqjg4bkV66GfFAyzUGHm3RBxcH6jsOToBtSOhVLgRT4oGaY9hOAkPiawprFD4flUypC0nKA63sJwX2PM19Rw0jU0JqycF2GqXAfdVMtzhabM6+pUr3Nth4/49jNoDQJN2VScOEwNQ09pvDqWhbgtVqfTsLUfkwfrUmabAaBJpfklm60p9/GucM9NGdfX/IguxccymqN7tkZ5dmJUfxgpEuuC/+vru+nMQYHrYNxQIEWORa1XQQebHUQ/+W4V7feHUAxBlNUb4iRi4uAdc1ruSews4v44PHRsB2QYdQX3L0hh8iYOY/SZDqh9s1aKI8ekYzY5QsVsHM/sqZV2mqXVHBxtDcM+L58Adpql1PiLkuj/AO9PoRSE8O1T9GVznIhlsIugpOgytEpJyzINnaExvoS6j/IOj/AeFlATvl7YJgdMTlNkEBKZPlkleSepO4ZFjEDXkqfgEEJBrnNGSZDkUwWRJD1a4U4D+gPMCJZrpYVcQdr+q8oy3S2BxooyKRN/nA26Sytgkm8KPJM7NYJvWqlU9HP+8n3wrBQkLaMqMUW+166Q8skR+0bB+o7Dk322LvaibmG9UXs2SySBRmgmwlEyyZtdJhst changed": "프레스티지바이오로직스가 상업용 원료의약품 위탁생산을 위한 154억9,548만원(약 1,159만달러) 규모의 단일판매·공급계약을 맺었다고 공시했습니다. 최근 매출(2026년 6월 말 별도 266억6,514만원)의 58.11%에 해당하며, 계약 기간은 2026년 11월 12일부터 2027년 12월 31일까지입니다. 생산은 자체 생산이고, 계약 상대방은 비밀유지 요청에 따라 2027년 12월 31일 이후 공개됩니다.", "why_matters": "임상용·소규모 수주 위주였던 회사가 연매출의 절반을 넘는 상업용 물량을 확보해 공장 가동률과 매출 기반을 끌어올릴 계기를 만들었습니다. 국내 중소 CDMO가 상업 생산 실적을 쌓는 사례입니다.", "strategy": "바이오시밀러 개발사의 생산 설비를 CDMO 사업으로 돌려 외부 수주로 고정비를 메우는 전략입니다. 대금은 원·부자재(49.93%), 생산(45.29%), 출하시험(4.78%) 항목별로 계약 시 50%를 받고 나머지는 단계별로 받는 구조입니다.", "evidence_type": "공시", "sources": [{"url": "https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20261112900312", "verified": "공시 목록에서 접수번호와 제목(단일판매ㆍ공급계약체결, 2026-11-12)만 확인, 본문은 열람하지 못함"}, {"url": "https://www.topstarnews.net/news/articleView.html?idxno=16275324", "verified": "원문 직접 확인(공시 내용을 옮긴 기사: 금액·기간·대금 조건)"}, {"url": "https://www.newspim.com/news/view/20261112001192", "verified": "원문 직접 확인"}], "verification_note": "공시 서식상 ‘계약금·선급금 유무’는 ‘무’로 되어 있습니다. 항목별로 계약 시 50%를 지급하는 조건이 있어 일부 언론은 이를 선급금으로 보도했지만, 공시상 선급금이 아니라 계약 시 지급분입니다. DART 본문은 직접 열람하지 못했습니다.", "image_concept": "A row of empty stainless-steel vats with one valve newly opened and liquid beginning to flow.", "img": "data:image/webp;base64,UklGRkAtAABXRUJQVlA4IDQtAACw3wGdASqwBCADPpFIoUylpC4toXIYycASCWlu9G2WjUc+EpaQHPMh8++Tm9hM8BWPVI6WXkqHN0I/+vwHpzuBWIYtvg/ou/V/pfXdt1edz046nz54HPF9t36PtspI5WSz/7/v3dG8wX2e+9ekbNc/iqO3Mw+x9Ej4XB3GDXIIBVQBB6wLKCAVUARr5LQs62STHksoSS1MWlpyWUEAqn9ZaIPWUWnzMdK+wbc74q00aa6HUh5BbA5TaCHS0CLAKWbqQVTAQ8m9CrCE1i5AkipZb9YcluXHl+TX19G1cyJrbl8MctHVuUxl2F5cf3es1zsq97a0gRsDOHqzNAkLeHQT4U6p2W/xhNkF6wOjbfXXEr5JOMceX+ba+EW0Gq6i8WUMuEOgF1GxJOfufv2/OYpQBCJw+leWH+GDkkRkn9cw8ym8DWkaIBy6SoDqP9hPyU/OY/U5ospXVtZkHp+yinJej0suKqyhKYhCiFSf7QDNxI0ZRIwAKxZpl2/E5Ou0+nLhfTYUarAOuKp52x+Zf5TXBChlv2MJTBY3jI0QTlU9hINkWddPnmtK67eVlX3BtdfkBVQBPn8OXnHi3Yu4y6t06coICHqnVlAf8ahSmQgwIiXI8oVzT0rRAJZeDUIIPctZqCEK7JOTBacYStJJrudeuHSpR0B/VRXw1vmgNHwAq+qXMn67HkfZ1SUqSf2K1rtV9u88/IXlpLRoENTXYf69kjl0KLnf56qca6E4BSvNsHrAssU const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}

   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
