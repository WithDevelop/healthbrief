:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}

… 누적 13번째", "short": "코어라인 대동맥AI FDA", "alt": "정밀한 측정 고리가 일정 간격으로 둘러진 채 빛나는 곡선 유리관을 그린 미니멀 일러스트", "date": "2026-10-23", "scope": "국내", "entity": "코어라인소프트(Coreline Soft)", "what_changed": "코어라인소프트는 흉부 CT에서 대동맥을 분할하고 해부학적 구간별 직경을 측정하며 대동맥 구간을 분류하는 AI 소프트웨어 ‘AVIEW Aorta Metrics’가 2026년 10월 16일 미국 FDA 510(k) 허가를 받았다고 10월 23일(미 동부시간) 발표했습니다. 이 제품은 곡면 재구성(CPR), 단면·3D 뷰와 분석 리포트를 제공합니다. 회사가 밝힌 누적 FDA 510(k) 허가는 13건입니다.", "why_matters": "회사의 미국 흉부 CT 포트폴리오가 폐결절 검출, 폐암 검진 분석, 관상동맥 석회화(CAC) 점수에서 대동맥 평가까지 넓어졌습니다. 한 번 찍은 흉부 CT에서 추가 촬영 없이 여러 질환을 함께 찾는 기회검진(opportunistic screening) 모델에 필요한 구성 요소가 하나 더 생겼습니다.", "strategy": "회사는 INFINITT North America와 PACS 연동 자동화, Optellum과 폐결절 관리 경로, Oatmeal Health와 폐암 위험 평가·보험 상환 분야에서 협력하고 있습니다. 11월 29일~12월 3일 시카고 RSNA 2026 AI Showcase에서 LCS·폐결절 CAD·CAC 제품을 선보일 예정입니다. 같은 CT에서 여러 판독 결과를 묶어 파는 업셀 구조를 노리는 것으로 보입니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/coreline-soft-receives-us-fda-510k-clearance-for-aview-aorta-metrics-expanding-its-chest-ct-ai-portfolio-in-the-us-302916220.html", "verified": "원문 직접 확인(PR Newswire 보도자료)"}, {"url": "https://manilatimes.net/2026/10/23/tmt-newswire/pr-newswire/coreline-soft-receives-us-fda-510k-clearance-for-aview-aorta-metrics-expanding-its-chest-ct-ai-portfolio-in-the-us/2452931", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "허가일(10월 16일)과 발표일(10월 23일)은 회사 보도자료를 근거로 적었습니다. FDA 510(k) 데이터베이스의 K번호는 확인하지 못했습니다.", "image_concept": "A single glowing curved glass tube resembling an aorta, with precise measurement rings spaced along its length.", "img": "data:image/webp;base64,UklGRtAsAABXRUJQVlA4IMQsAADQhAGdASqwBCADPpFIokylpCcoINMYSQASCWlu/CHNMuu6sn9HNv2D+f55INbYP/mUzoh9WCnNtf+53Nc1/J/yrOT63dNCxgMdjv0+f1XeUc7h6cf8/v6+9PZGrPo5v45VpHmztokBF9vaKWqOrd4W9gDiNvT/YN/mv969X//W8tP1wCWP6+OSa/HKe8VWNFQhGRkHuU5bxySn73qMMdIPnvFVjPhyOTm18VqQYhRkVp4Tcb6P9pBPKaoIeMdN8A/xVY09fVPFkdAe5p5+UmkFJpElP48F/XLqn5Egn1LFvVBd9KSEC/uU5cN1sUU+qxo9JWoC4PDFZocrtQ4e+6xGVje59n1gLf7x8HNEgsV 보드의 종이들이 한 줄기 음파 리본으로 바뀌어 흘러가는 미니멀 일러스트", "date": "2026-10-23", "scope": "국내", "entity": "에이아이트릭스(AITRICS), 강북삼성병원, 서울 AI허브", "what_changed": "에이아이트릭스는 서울 AI허브가 주관하는 ‘2026년 AI 전환(AX) 지원사업’에 강북삼성병원과 함께 컨소시엄으로 선정됐다고 10월 23일 밝혔습니다. 개발 과제는 외래 의무기록 고도화와 과거 진단·투약 이력 요약, CT·MRI 판독 결과지 경과 요약, 간호 인수인계 음성의 텍스트 변환(STT)과 핵심 요약입니다. 병원은 적용 대상과 필수 기능, 검토 기준을 정하고 실사용 평가를 맡습니다.", "why_matters": "중환자 악화 예측(바이탈케어)으로 알려진 회사가 LLM 기반 임상 문서화로 사업을 넓히고 있습니다. 같은 주 삼성서울병원·화순전남대병원도 EMR 연동 음성·요약 AI를 내놓아, 국내판 앰비언트 AI의 실사용 경쟁이 본격화하고 있습니다.", "strategy": "예측 모델에 의무기록 자동화 같은 워크플로 제품을 더하면 같은 병원 고객에 대한 교차판매 여지가 커집니다. 병원은 공공 지원이 끝난 뒤의 사용료 구조와 EMR 연동 범위를 미리 계약에 넣어둘 필요가 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://medipana.com/news/articleView.html?idxno=419920", "verified": "원문 직접 확인(메디파나뉴스)"}, {"url": "https://www.widedaily.com/news/articleView.html?idxno=302281", "verified": "원문 직접 확인(와이드경제, 회사 발표 인용)"}], "verification_note": "회사 발표를 전한 언론 기사 2건으로 확인했습니다. 서울 AI허브의 선정 공고 원문은 열람하지 못했고, 사업 기간·예산·정량 목표는 기사에 나오지 않습니다.", "image_concept": "A nurse's clipboard whose paper pages are turning into a single flowing ribbon of sound waves.", "img": "data:image/webp;base64,UklGRmggAABXRUJQVlA4IFwgAACwZgGdASqwBCADPpFIokylpLWtoTTIQrASCWlu8ZfdUnCfDqRahzKtwXW+7RjOGXCS2/3OyPrf7Udr1kx2vuAE9HtCPar6/5usyb6UYrqA3lGf8PlpTQAdVNqJp3pjELjALqagJjELjALqagJjELjALqagJjELjALqcZYEPxzG903endTRtYBhV8TvTGIXFDgJjEOUIJHBqZv5bGy3uOuqeCvSScxTzFp3pjELjALsGy3uOuqa/Bzh/qLbLhDTb3HWAJjERtgF1N9MAmMnSYxC4zFcbFs8aAmMQuMAvjp2ddUMFwyqzk8Y7d2hLYBdTRvRzFxf+aYxC4v/NMYhcUAf8FkRJajnCekDCsATGIXkcxbs6EYTUBMYhcYBdTUAFlvcBi20zGUUV28id6YrMwhzxClVXRhYxC4ocBMecttMt7jrAExiADQaIxGEEdcxcpYApfFxpAhSQ+CYydIxt7jrAExiFxgF1NQAaHmLlMPAPdohcT/xBekxPPoC4v2+WFxgF1NQExiFxgF1NQY95IPgl6P7Y8xh//o/BMYgB87xCd6ZNmyMAupp6NvcdYAmMQt2NVrrYA1FXADQGVf7NX7dYATvXFxf+aYxC4vV9YBdTUBMYRLUBMYQIP7HmMQqBxCrbLFiAS5qurr0pVxhMex6wC6nGWAS9nk1AS9o8/E70xWaoaTabo/V19s91uqb2oYgBBS6EAGgh9YAmMQvH1FKur88MvIcbVAH1xgSqNIaSQRlXWAJjEOTTGIXFDgAst7lDoCYxC4wNKFQTYmLbXk8NPP/ZgxGD6XpNL2eTUBMVmF7t 6개 손질", "alt": "폐기함 대신 열린 문을 통과해 컨베이어 벨트 위를 지나가는 봉인된 약병 하나를 그린 미니멀 일러스트", "date": "2026-10-23", "scope": "국내", "entity": "식품의약품안전처", "what_changed": "식약처는 10월 23일 청와대 영빈관에서 열린 대통령 주재 제2차 규제합리화위원회에서 3개 축 6개 과제를 발표했습니다. 첫째, 개발 과정에 AI를 활용한 의약품의 허가·심사 가이드라인을 12월까지 마련합니다. 둘째, GMP를 지키고 최종 허가사항과 같게 제조했으며 공정 밸리데이션을 마친 경우 품목허가 전 생산분도 허가 후 판매할 수 있게 합니다(지금까지는 폐기). 셋째, 동등성이 명확한 수용성 주사제 제네릭은 동등성 입증자료를 면제하고 안연고제 등은 대체시험으로 갈음합니다. 넷째, 투여경로가 같고 제형 차이가 작은 일반의약품은 제출자료를 줄입니다. 다섯째, 12월 31일 시행되는 바이오의약품 CDMO 특별법에 맞춰 수출제조업을 신설하고 정부 GMP 인증과 원료물질 인증제를 도입합니다. 여섯째, 디지털융합의약품에 제품별 공동대응팀, 맞춤형 임상시험 설계 가이드라인, 원스톱 통합심사 체계를 마련합니다.", "why_matters": "허가 전 생산분을 폐기하지 않아도 되면 출시 초기 재고 손실과 공급 지연이 줄고, 생동성 면제와 일반약 자료 간소화는 제네릭 개발 비용에 곧바로 영향을 줍니다. AI 활용 의약품은 그동안 어떤 검증자료를 내야 할지 기준이 없었고, 디지털치료기기와 의약품을 결합한 제품은 심사 경로가 나뉘어 불확실성이 컸습니다. 신약 심사기간 단축에 이어 허가 이후 상업화 단계까지 규제를 손보는 흐름입니다.", "strategy": "FDA·EMA가 올해 내놓은 AI 의약품 개발 원칙에 맞춘 규제 조화 성격입니다. CDMO 특별법 외에는 시행 시점과 고시 개정 일정이 나오지 않았으므로, 허가 전 생산분 판매 세부 요건의 행정예고 시점을 지켜봐야 합니다. 수용성 주사제 제네릭 개발사는 생동성 시험 계획을, CDMO 기업은 수출제조업 신고와 GMP 인증 준비를, DTx·제약사는 결합형 제품 후보의 사전 상담 신청을 검토할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50434", "verified": "식약처 보도자료 게시 페이지에서 제목·등록일·담당부서만 확인했습니다(본문 첨부파일 미열람)."}, {"url": "https://dailypharm.com/user/news/343737", "verified": "원문 직접 확인(데일리팜, 3개 축 6개 과제·CDMO 특별법 12월 31일 시행)"}, {"url": "https://m.sedaily.com/article/20105234", "verified": "원문 직접 확인(서울경제, 6개 과제 세부 내용)"}, {"url": "https://news.jkn.co.kr/post/1044388", "verified": "원문 직접 확인(재경일보, AI 의약품 가이드라인 12월 마련)"}, {"url": "https://www.medicaltimes.com/Main/News/NewsView.html?ID=1171370", "verified": "원문 직접 확인(메디칼타임즈, 디지털융합의약품 원스톱 심사)"}], "verification_note": "세부 내용은 여러 매체 보도로 교차 확인했습니다. 식약처 보도자료 원문(PDF)은 열람하지 못했습니다. CDMO 특별법을 뺀 나머지 과제는 시행 시기가 공개되지 않았고, 디지털융합의약품의 정의도 기사에 나오지 않습니다.", "image_concept": "A sealed medicine vial resting on a conveyor belt that passes through an open gate instead of into a disposal bin.", "img": "data:image/webp;base64,UklG {"id": "reg-mohw-cell-data-reform", "cat": "reg", "title": "복지부, 자가 면역세포치료 ‘저위험’ 재분류·가명정보 연구 IRB 면제 추진… 바이오헬스 규제합리화 방안 발표", "short": "면역세포치료 저위험 재분류", "alt": "배양 플라스크 하나 옆에서 실험실 경고 다이얼이 주황에서 초록으로 돌아가는 미니멀 일러스트", "date": "2026-10-23", "scope": "국내", "entity": "보건복지부(범부처 합동)", "what_changed": "복지부는 10월 23일 같은 회의에서 바이오 분야 규제합리화 방안을 발표했습니다. 자가 면역세포치료를 첨단재생의료 ‘중위험’에서 ‘저위험’으로 재분류해, 2~3년 걸리던 선행 임상연구 대신 문헌자료를 내고 치료계획을 심의위원회에 제출할 수 있게 합니다. 제대혈은행 등이 보관한 원료세포 활용을 위한 첨단재생바이오법 개정도 추진합니다. 무릎 골관절염과 만성통증 등 줄기세포 치료는 정부 주도로 2년간 330명 규모 임상을 진행합니다. 적정하게 가명처리한 데이터 연구는 생명윤리법 시행규칙을 고쳐 IRB 심의를 면제하고, 포괄동의 제도 도입을 위한 법 개정도 추진합니다. 의료데이터 가명처리 국가표준(11월)과 원격분석 환경 기준(12월)도 마련합니다.", "why_matters": "자가 면역세포치료가 저위험으로 바뀌면 선행연구 기간이 2~3년 줄어 병원과 세포치료 기업의 첨단재생의료 진입 문턱이 크게 낮아집니다. IRB 면제와 가명처리 기준 통일은 병원 데이터를 쓰는 RWD 연구와 의료 AI 학습 데이터 확보 속도에도 영향을 줍니다.", "strategy": "시행규칙만 고치면 되는 과제(IRB 면제)와 법률 개정이 필요한 과제(원료세포 공유, 포괄동의)는 시행 시점이 크게 다를 수 있습니다. 세포치료 기업은 저위험 분류에 필요한 문헌자료 요건을, 데이터 활용 기업은 가명처리 국가표준 확정 시점을 확인해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1492314", "verified": "복지부 보도자료 본문 직접 확인"}, {"url": "https://news.jkn.co.kr/post/1044388", "verified": "원문 직접 확인(재경일보, 가명처리 가이드라인 11월·원격분석 기준 12월)"}], "verification_note": "보도자료 본문에서 재분류, 330명 임상, IRB 면제 내용을 확인했습니다. 법령별 개정 일정과 시행일은 본문에 없었고, 첨부파일은 열람하지 못했습니다. 가명처리·원격분석 기준 일정은 언론 보도에 근거합니다.", "image_concept": "A laboratory warning dial being turned from amber to green beside a single culture flask.", "img": "data:image/webp;base64,UklGRjQ4AABXRUJQVlA4ICg4AADwwwGdASqwBCADPpFIoUylpC4woVMokhASCWlu2ARq+wkv8+z/dU6U5KzR+/1O+qzfWTjoSu7G1zuPeOVFTTtv35gPPH9PH+U31DegsidnpfV+zngCva7QXv16FM3r7x1APOzw8KAflE/8HmjGJ5y4vM+3M+3M+3M+3M+3M+3M+3M+3M+3M+3OqAIy9vGK8KW6eF4yMbYLye0uP/Nbc8m0Lr3bedPrOiklIbYkX09fecZlBIr8tv63CW67E/acJB63uYQNZuWN73nx/s9jOlcgilp9Za4/0/leGOTunTCLYieSIkEnk/UGLWGZ/MOYXpNiIdNPt0tc6aJb/Gk5mwt4Ut4VEF7z5C4n+1lFQDmUNYvhad1rezanUQV4DI/1/moFj/T+XvPsDi826ttl6TYTESD2XnGuPxeZ9gI2zwiUg+K8Bke51EFi : "규제기관 결정", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1492310", "verified": "복지부 보도자료 본문 직접 확인"}], "verification_note": "심의는 10월 22일에 열렸고 보도자료는 10월 23일에 게시됐습니다. 수행기관명과 부적합 사유는 공개되지 않았습니다.", "image_concept": "Two small glass syringes lined up in sequence on a tray, one tinted blue and one tinted violet.", "img": "data:image/webp;base64,UklGRrBCAABXRUJQVlA4IKRCAABQ/QGdASqwBCADPpFIn0ylpC2rIVH5KbASCWlLk7AfdY439XVfau+a3pJ27X/Ibv6OFV8M72ojev92V6n4Hhh+o/3rpPf8XwkO3f6/2Bv6Z6MGZf/jbZBPm8xX2bkVdJqq9S5vfRb7Deu21TeXd9tzSOq+PHdm238V/yX+Z5rbTlAUxW75b53nz9kvNh9Rv+L5fX3v1Ef6h/oPWF/4POx9jBsfxNPlcTT5XE0+VxNPlcTT5XE0+VxNPlcTT5XE0+VxNPlcTb7z+K16jW4XrNpEFa/kO8+xgrNC0X2VlcTUePiajxxOxzD9A7iTAm4oSxNpm+yBDmoitVwdxJUz1LJSdWc1bYf2naTAptwn7VFhJSGQhxXjkbVcl5Y5lYkdZtam9oitVf+9zYroeEfUzBToqOoM2IDv+JgSO5RBgSS8whDNq5FH7gUElMFVG8sEDcJfLdMFCEOhopgm4J8ria8uJPU/Vam9ogq9IstcoKadqggcSs+Hp7RFZKiKLWbVK4KRTBVXDtThwlhY7EZ8UgLjH1ygoJNHYUqGRxjcolkH3olcTURQSIOo0o9uOI1QHtwI/VwlZKiKyL94eojn8h3n2naaIJIo3N0GNQuqq43T8KiLKZSwKSR1m4S9/IeDgd/t8faLdBQ2NuzmkgI12iK+t6sYLAbd8Ya1/IVnNM0PQntEVq5vcuHefaIzB0/Fpe6Gg0QSZCWo6cAMjuSOsi3eC+iqIrcL9jp+FzhkftUD59oIAZu9AmCiF/U+UlRERrC1h4NfW3CfH8RWqv/dugIvVhS94KrkQqmXoH/7t3Er2qIovb6qv/gbEhrzm1aq3Y+k+xUoXv42WClJBgSeN7uE4hx+x4m7zhkfFBQD/2BDm8B7t7s7kfvrUA5HVFIpkrPiafGfEmjAhq6X2NVlI5rjd6sYEfgwJKYOCXH2KV3xT2g1wXsrRFGzH4jEUXfcw1DsJglCCVe+MNceKafYkrRFaq/96BMINeg4Q7z5ABQSZI65NN7/uqPtoIDtpRm5zWxNNvyQLh3s2/HNWui7o+4reN9nfIKYJJRCGvuhPlFRNtDJtO0pgoJKSYAG///iD7uu4/V5iypTLCCTbZIe02pGEx2NALbykLsWwVl9M0mvzTuStCXIhpy3lc37k1LyZIaNKokBMsmqROyEdOZ+8IdNrWQkVCRgSZ3EmEQuhNo825zb6X1M+ZZFarjwbVqb2iKA+Q0H/cZ/JviyJEP6HWfyzKATasA4ZqECSj/lXwjkBFpTwf+7LleXs4IFeib5HDjSjk9btPQh1Vr+7JqPyr/gQUa7HSCYMAaFIdw84gcTwotEMtKewhWv5D+uCga058+QAT1ErhzDdqDjZTwDiwlVvK7CwB2f9M5/jGPiRV/MP0uuvmiX3SzGcnqsduxc4u/3c1dtIVYB9tjtbGhpr5Sz8U1/Vb0nPJFMvmog/UrSjSGq98V+8uarAq0k9Zq8kifypmMojxVH2BK5I/ceQ72sWniupjvUas55v8+1ahef5deBKiLEtSrDqsGOq7eDAXpyX4sCpEsslES9pd/6lO5U+c7j1sN1X/zIg+jUwFQUK1oG 계열 후속 물질의 가치 평가에도 참고가 됩니다.", "strategy": "시장의 관심은 출시 후 매출과 로열티 규모로 옮겨 갔습니다. 마일스톤 금액은 공개되지 않았으므로 한올 공시를 따로 확인해야 합니다. 한올은 중재 결과로 상대방 비용 약 98억원을 부담해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.prnewswire.com/news-releases/harbour-biomed-receives-china-nmpa-approval-of-batoclimab-injection-subcutaneous-injection-for-the-treatment-of-generalized-myasthenia-gravis-302917545.html", "verified": "하버바이오메드 보도자료 원문 직접 확인"}, {"url": "https://biz.newdaily.co.kr/site/data/html/2026/10/23/2026102300140.html", "verified": "원문 직접 확인(뉴데일리, 한올 발표 인용)"}], "verification_note": "NMPA 공식 공고와 하버바이오메드 HKEX 공시는 확인하지 못했습니다. 마일스톤 금액은 공개되지 않았습니다.", "image_concept": "A long-sealed envelope finally opening to release a single coin.", "img": "data:image/webp;base64,UklGRgRqAABXRUJQVlA4IPhpAABwOQKdASqwBCADPpFIn0wlpCKlIxNZQLASCWlu+V+m+3091/9WWfW8d0q+J7mS/ountz4/9nOI//vO/+///zEo+F91shLD/4WoY5Vmge///B/Wry3/NP7L7AHkgf4/Zs/3/sAf1PkA5+v/V9AKjn/oeNP9o/5XqG8uL2iud6A0lcirhbE7W45517Twqfb9X/6TznfQOwH9A/Wf9/+y9pr/eyj/G//Hjx/nmeT/s8L/3P/Z8X3+z9Sn/jwNb4eg1fp/6+Ot/v9Sf/X9dPJx/sdDn/5/vh6utRQTmv9nxkzRR+zSh4msYtkjkpdURfIHAqL/HGWPeBUa5crZpQXIvkDgVevnZWqH4iXHPPSvcuM0oTl4FTT8aQvm9DoQlDneaHLUERykgxmlBfaoMdMNIgeMFXU0zexCPwpQFFN6UYHf1Btr08gcWSXdFv+ovoxREZR3tnsrUUdEDCxoJbLcGSCYVGn40rkXtnpWzSgHuQOBUZN9Ic5mfiCFUYuSt77L+VBKjREjdZoHmRGuqIvucls0oPTJOWicPedK2uYgUHxrqMwZyOLKR9LZdKfN9pMRqjFr0XpoqXRUYDzQa81RHS7M2McJ2R+I2JLmM4LVyL5A4EP5CzcL/KnvHD5v0wzGlPhTHvAqMnGEpb9pZxYrXzSu5q2lQ68CowP8hBnvn3xq+RHwJP+fmemisGUUkRxaM575n1cF+vri18Zkn4HUO9mc458Bv2QoiYsfktlwP8fjU6KIwgOp73mvS30OuFmJrlrnL+VXQDjUroEzYlP5xpXC/HmHV2qdRqydNjZXCaS5KCr8kxjQXcWnHjQM+G/uKkXdUIh0uH5ybT5GW+wrNw2SjG+XMZpVdNiUX+NIe7nPmYMEbKWQS2aUAwOtHFqOvWbMOLm4aGasu4eq8Dn/tLE7Yj2OoGYMQYiffilCOcMdRgOBUX+NMAWnKmHAtX5jCmPeCy7zPW3NL0vsgwXkrxh9PdqSfhSAtSeVBC7ORczz43DtgTMASI/W5/lhe1zVU/MJ9RrhQfERm40rkXyBwKjAHGNBLaX4PbaoyNPTAqgiXLCopgpqdoGqH//3CFLGtZdaOSqNdOhes9KJcZPPAdgzipVm8MTqphMaqL/Glci+YdYLziqNBPkDfXlx0VDkYAgk7xmUpaF5ID50viRviaBdxkra5sIFQ7JVcLzgfFWJh6y23M8kHOa4 석 기준 지분은 프라나 주주 약 51.7%, 사모 투자자 약 41.4%, 기존 볼트 주주 약 6.9%입니다. 자금은 2028년까지의 운영비로 쓰입니다.", "why_matters": "현금이 부족한 상장사를 비상장 I&I 자산의 상장 통로로 쓰는 역합병 구조가 다시 활용됐습니다. 기존 볼트 주주의 지분은 7% 미만으로 줄어 사실상 회사가 바뀌었습니다.", "strategy": "새 회사는 반감기를 늘린 IL-4Rα/TSLP 이중항체 PRA-216 하나에 집중합니다. 천식·COPD·아토피피부염 2상이 진행 중이고 호산구성식도염 2상을 준비하고 있으며, 데이터는 2027년 2분기부터 4분기 사이에 나옵니다. 8~12주 간격 투여 가능성을 듀피젠트 대비 차별점으로 내세웁니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001641281/000119312526429647/bolt-ex99_1.htm", "verified": "원문 직접 확인(SEC 8-K 첨부 보도자료)"}, {"url": "https://www.sec.gov/Archives/edgar/data/0001641281/000119312526429647/bolt-20261023.htm", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "8-K 첨부 보도자료로 지분 구조와 조달 조건을 확인했습니다. 시리즈 D 전환우선주의 보통주 전환에는 향후 볼트 주주총회 승인이 필요합니다.", "image_concept": "An old empty shell with a new hermit crab moving in.", "img": "data:image/webp;base64,UklGRtBnAABXRUJQVlA4IMRnAADwpgKdASqwBCADPpFIoUwlpKOqoxMo8VASCWdu/7dS5S7PBu+CXQpN8fHP0XPz6193pf/IWTzbE9Ov9N9Rzzxeo/zI+bh6if7/6gH+q6rH0GumJ/uHnZ6sf608zlone9mFdye3P6zakz6u0Rvm8VPED4eKgj5OfhA+4P3rEPnHc47nHc47nHc47nHc47nHc47nHc47nfdaaQryCY2w9pntLveiBMg7hfSmn/4joefOPp47nHc5UHoazsOM/w/xviehpYHrMicdzjugvL+J9NIxPrPTfE/ltufX/j70N8UCMJkKs5O2HtM9pnukjbD3LoL6UuvDD+dMQzaGbQznw3URf/FXztfXhxp3Hc47nHc5UHoaVfkFko/79EawlhRebM4CdBcXZf35nzmYRxYv6nVSoreHTA+s6PbFAA5F6CjrFjGmI1eyeGqZ+DMnlM9sCIfjXSRmEx6Uu9YsEwPhh/P0pF5szkE471nUbfdaZ7U8L7dDL+GS8TOXhSEAXjHsdBph16wjE/kExmEM14Z9gxsKoxTL/LPQzcTQt3/OYxAExtiyAF4TLx2BeYuL+/Mv5l/NDqRTe9yFNCherFjyn8gmN2+jvz2muDh7TXb1zTOaMRvL8y/mX8wsDlfzKVzHwDkExs/RrExthvF1dViWN8T+Mj0mLiJeFfzfE/kFWZH2RMisszc+C4xjXdI3l5MAIxN/VC0vgAOts8lFLUDRDjcT+TGrOF/fmWj68XqvsJgvxMB+C9KsQ3H23Mdh3ly/vzDrjnPMMWFHP85xc6T//C0waDkBca+0gkWZUdz42ySyAyeNqVg9kUvMG642Xd+MU4fg2PDE/j9DMzjuceilOWMSVZCi8K/8kEG0rCMU0RSFEMP/FXDhbCSD7lemDi2uRNftR81v1Ht70YGVjsRVx8I6Mh10E3zWPOvFfK2vIbre2u2lpn6oMWG99/Emv8tt4gMRbKJR1vQ0gGA7kQEa5mCl/fnTEM2ih584zeTVg5dv2d/fTdj8/VMrYjaedmM7ii9pq6yZfVBJESQPWhxY/9M0oXvZbCQAtHOyrgsqDSKBqEob ="}, {"id": "bio-oric-enozertinib-ph3", "cat": "bio", "title": "오릭, 비전형 EGFR 폐암 1차 치료 에노제르티닙 1b상 ORR 84%… 2027년 상반기 글로벌 3상 착수", "short": "오릭 에노제르티닙 3상", "alt": "좁은 길을 비추는 작은 랜턴 하나가 커다란 돌문을 향해 놓인 미니멀 일러스트", "date": "2026-10-23", "scope": "글로벌", "entity": "ORIC Pharmaceuticals", "what_changed": "오릭이 ESMO 2026 발표에 맞춰 데이터를 공개했습니다. 비전형 EGFR 변이 비소세포폐암 1차 치료 1b상 26명에서 에노제르티닙 80mg 1일 1회 투여 시 연구자 평가 확정 ORR은 84%, 독립 중앙 판정(BICR) ORR은 80%였습니다. BICR 기준 뇌전이 반응률은 67%, 6개월 무진행생존율은 88%였습니다. 회사는 FDA와 1상 종료 회의를 마쳤으며, 약 360명이 참여해 오시머티닙 또는 아파티닙과 비교하는 3상을 2027년 상반기에 시작합니다.", "why_matters": "환자의 65%가 뇌전이를 동반한 집단에서 높은 전신·뇌 반응을 보였습니다. 오시머티닙·아파티닙이 맡아 온 비전형 EGFR 1차 치료 시장에 직접 비교 3상으로 도전하는 근거가 됐습니다.", "strategy": "오릭은 하나의 약물로 EGFR 엑손20과 비전형(PACC) 변이를 함께 겨냥하는 전략을 등록 임상 단계로 끌어올렸습니다. 이번 데이터는 향후 자금 조달이나 파트너십 협상의 근거가 될 수 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.datatooza.com/article/20261023210345402cd1e7c119b_80", "verified": "원문 직접 확인(데이터투자 기사, SEC 공시 인용)"}], "verification_note": "SEC 원 공시와 회사 보도자료는 직접 열람하지 못해 2차 보도의 수치를 그대로 썼습니다. 소규모 단일군 결과라 3상 결과와 직접 비교할 수 없습니다.", "image_concept": "A small lantern lighting a narrow path toward a large stone gate.", "img": "data:image/webp;base64,UklGRtpZAABXRUJQVlA4IM5ZAABQSAKdASqwBCADPpFIoEwlpCMqopO4uVASCWlu+qD7ohWYQdzOE96B80BZcGdAD/d8iQ+W5zw/XGhz5+/SeZe916g8J107r+LdN1favqXy5WaPmuzGd68HOyX/peJf0P1F/dHn+RbuzFBn6B5Es935/ous6OgJ+p/V18Euo+HElQVObXcBzvDpO5QuLVcNM+GYqCpza+Ee83DMVBU5teEvNwzIJ4rR3at05he06A53h0ncrIvpD1eISJ9PZH+ClmF7lDAGyZYwEzqDWmF73dM5u1s6s+GaoGMOh3GXnAc7x3nIKnYmLJZtMvlppvnZk5XHZU9UqBYjZFijwOEmu2INwzAE0eHO8NaUEWzPbeRNpKpyi5zPPHv5+btUCy7c+CEcM3cH1+UsCVwr2cSQjDwb8tOGXXZLNqXPkzsbIe6o6FIOyt7md4EJ28WUuSQdk3DMVBRl5wHP4KYqFFmqK8lrcqLecMOLw+51azc/3WKpE+iM+VKYqCpw+ctiMm4Zf6yJUi6MSjo1BU58Tb9oJGu5bC2JBsLiBecBzvCV6cvvjF1EhFXcP/ShFrtp6lb47ZLXnsRiQ6svl9PRUcUaANhij5tuaQcMxTlkzbj5fVXkbbqR0KgVCOKGNKBsFqqjt24BY74bYwKqmq3GKYfCoFaDci1ELVKoZUKzGF0fjYFU1LLkK4Vphbr+M4zdqgVGGO758pnV4uazPNMCimlBnDWHm9DsTvhf6uOY850gzCBfklOqUz42NtJRMlwR2R+dB5wpVeWW6Xy7ff const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
</html>
