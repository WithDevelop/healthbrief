:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* synthesis */
.syn{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.syn{grid-template-columns:repeat(3,1fr);gap:0}.syn>div{padding:0 22px}.syn>div:first-child{padding-left:0}.syn>div:last-child{padding-right:0}.syn>div+div{border-left:1px solid var(--rule)}}
.syn h3{font-size:18px;margin:0 0 10px;font-weight:850;letter-spacing:-.02em}
.syn ol{margin:0;padding:0;list-style:none;counter-reset:n}
.syn li{counter-increment:n;padding:10px 0 10px 30px;border-top:1px solid var(--rule);position:relative;font-size:13.5px;color:var(--ink-2)}
.syn li:before{content:counter(n);position:absolute;left:0;top:10px;font-weight:900;color:var(--blue);font-size:15px}
.syn li b{display:block;color:var(--ink);font-size:14px;line-height:1.4;margin-bottom:2px}
.syn .refs{font-size:12px;color:var(--muted);margin-top:4px}
.syn .refs a{color:var(--blue)}
.syn .refs a:hover{text-decoration:underline}

/* inner pages */
.page{padding:26px 16px 0}
@media(min-width:768px){.page{padding:30px 28px 0}}
.ph{text-align:center;margin-bottom:18px}
.ph h1{font-size:clamp(24px,3.4vw,34px);margin:6px 0 4px;font-weight:900;letter-spacing:-.035em}
.ph p{margin:0;color:var(--muted);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 22px}
.chip{border:1px solid var(--rule-2);background:var(--paper);font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.empty{text-align:center;color:var(--muted);padding:40px 0}
mark{background:var(--mark);color:inherit}

/* article */
.post{max-width:780px;margin:0 auto}
.post .head{text-align:center}
.post h1{font-size:clamp(26px,4vw,40px);line-height:1.22;margin:10px 0 12px;font-weight:900;letter-spacing:-.04em}
.post .by{font-size:12.5px;color:var(--muted);display:flex;gap:8px;justify-content:center;flex-wrap:wrap;align-items:center}
.post .by b{color:var(--ink);font-weight:600}
.post .cover{margin:22px -16px 6px;aspect-ratio:3/2}
@media(min-width:820px){.post .cover{margin:24px -60px 6px}}
.post .cap{font-size:11.5px;color:var(--muted);text-align:center;margin-bottom:22px}
.facts{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);margin:0 0 26px}
@media(min-width:640px){.facts{grid-template-columns:repeat(4,1fr)}}
.facts div{padding:10px 10px 10px 0}

refs": ["dh-hinge-q3-preview"]}, {"head": "11월 4일 희귀질환 신속등재 대상 선정", "body": "14개 약제 중 최대 5개를 고르는 절차로 보도됐습니다. 환자단체는 선정위에 참여하지 않겠다고 밝혔으며, 복지부 공식 공지는 확인하지 못했습니다.", "refs": ["reg-rare-fast-listing"]}, {"head": "11월 6일 식약처 바이오의약품 가이드라인 교육", "body": "제·개정 가이드라인 15건을 3개 분과로 나눠 교육합니다. 희귀질환 유전자치료제 임상 설계와 mRNA 백신 개정 내용이 포함된 것으로 보도됐습니다.", "refs": ["reg-mfds-bio-workshop"]}, {"head": "11월 16일 CMS 재택의료 심사 확대 의견 마감", "body": "캘리포니아 확대를 위한 정보수집 개정안의 의견 마감일입니다. OMB 승인과 시행 시기를 알리는 CMS 후속 공지가 다음 확인 대상입니다.", "refs": ["reg-cms-home-health-rcd"]}], "priorities": [{"head": "임시등재 의료 AI 기업은 종료 일정부터 확인합니다", "body": "12월에 사용기간이 끝나는 제품은 종료 30일 전까지의 신의료기술평가 신청 시점이 당장 중요합니다. 차등 보상과 퇴출 기전은 아직 연구 제안이지만, 실제 진료 영향 근거는 미리 쌓아 두는 편이 유리합니다.", "refs": ["ai-permanent-listing"]}, {"head": "검사·영상 사업자는 2027년 계획에 수가 조정을 반영합니다", "body": "복지부도 검사 비중이 높은 일부 기관의 수익 감소 가능성을 인정했습니다. 진단검사·영상 관련 기업과 수탁기관은 수요와 단가 영향을 점검하고, 11월 건정심 안건을 추적할 필요가 있습니다.", "refs": ["reg-fee-reform-followup"]}, {"head": "비대면 플랫폼은 입법예고 기간에 서비스 흐름을 점검합니다", "body": "의약품 선택 화면, 진료 흐름, 제휴 수수료 구조를 하위법령 논의와 대조해 볼 시점입니다. 비만치료제 매출 의존도가 높다면 대면 연계 모델도 함께 검토해야 합니다. 입법예고 기한(11월 9일)은 공고 원문으로 확인하는 것이 좋습니다.", "refs": ["dh-platform-preselect", "dh-efe-telehealth-ban"]}, {"head": "유통·재택의료 기업은 부정 청구 감독 강화에 대비합니다", "body": "국내에서는 건보공단이 특사경 수사단을 추진하며 간납사·CSO를 권한 공백으로 지목했고, 미국에서는 CMS가 재택의료 전수 심사를 캘리포니아로 넓히려 합니다. 계약 구조와 자금 흐름 기록, 심사 대응 인력을 미리 점검할 필요가 있습니다.", "refs": ["reg-nhis-special-police", "reg-cms-home-health-rcd"]}, {"head": "희귀·중증 약제 개발사는 급여 경로를 이중으로 준비합니다", "body": "신속등재 미선정에 대비해 기존 평가 경로를 병행해야 합니다. ICER 탄력 적용은 후속 협의에 의견을 낼 준비를 하되, 기준 완화를 전제로 가격을 설계하기에는 아직 이릅니다.", "refs": ["reg-rare-fast-listing", "reg-ipf-icer"]}]}}, "archive": [{"label": "제14호", "date": "2026-11-02", "count": 20, "current": true}, {"label": "제13호", "date": "2026-11-01", "count": 17, "file": "https://drive.google.com/file/d/1nYrRBg9zN2iEgTKezyD0VQi3RCg1ve9x/view?usp=drivesdk", "note": "구글 드라이브에서 열립니다."}, {"label": "제12호", "date": "2026-10-31", "count": 24, "file": "https://drive.google.c 등재안, 2027년 1분기까지 마련 계획… 임시등재 17개 항목 전부 비급여, 코어라인소프트 등 올해 12월부터 사용기간 종료", "short": "의료 AI 정식등재안 윤곽", "alt": "임시 나무 다리가 단단한 돌다리 바로 앞에서 끝나는 모습을 그린 미니멀 일러스트", "date": "2026-11-02", "scope": "국내", "entity": "정부 의료 AI 보상 협의체(위원장 신현웅 한국보건사회연구원 부원장), 보건복지부, 건강보험심사평가원, 제이엘케이, 딥노이드, 코어라인소프트, 에이아이메딕, 루닛, 뷰노, 메디컬에이아이 등", "what_changed": "의학신문은 정부가 2027년 1분기까지 정식등재안을 마련할 계획이라고 보도했습니다. 2026년 9월 4일 17명으로 구성된 협의체는 9월 4일과 22일 두 차례 회의를 열었고, 2~3차례 더 논의할 예정입니다. 2026년 10월 기준 임시등재 17개 항목은 모두 비급여입니다. 사용기간은 코어라인소프트 CT 뇌출혈 검출과 에이아이메딕 관상동맥 CT 압력측정이 2026년 12월, 제이엘케이 허혈성 뇌졸중 판별과 루닛 흉부 X-ray 검출 보조가 2027년 2월, 메디컬에이아이 급성심근경색 진단 보조가 2027년 3월에 끝납니다. 제12호에서 다룬 지불체계 논의에서 나아가 정식등재 일정과 제품별 종료 시점이 이번에 새로 확인됐습니다.", "why_matters": "현재 비급여 상한은 MRI·CT 등 방사선 특수영상 1만8,100원, 초음파·내시경 1만1,800원, 심전도 및 일반영상 등 3,100원 또는 9,300원입니다. 정식등재로 넘어가면 이 수준이 유지될지 불투명합니다. 보상 수준, 임시등재 기간 임상근거의 인정 범위, 심사 중 경과조치가 주요 쟁점으로 제시됐습니다.", "strategy": "사용기간 종료 30일 전까지 신의료기술평가를 신청하면 평가결과 통보일까지 운영기간을 연장하고 임시등재 수가도 산정할 수 있어, 종료가 임박한 기업은 신청 시점 관리가 우선입니다. 심평원 발주 연구는 기술 수준별 차등 보상, 성능 미달 시 수가 하향, 퇴출 기전을 제안했으므로 양성예측도와 실제 진료 영향 근거를 미리 쌓아야 합니다. 다만 이 제안은 연구 단계입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.bosa.co.kr/news/articleView.html?idxno=3015327", "verified": "의학신문 기사 원문을 직접 확인했습니다(2026년 11월 2일 06:00 입력)."}], "verification_note": "기사에는 복지부·심평원 관계자의 직접 발언이 없고 정부 원문 문서도 확인하지 못했습니다. 날짜는 보도일이며, 계획이 처음 제시된 시점은 확인하지 못했습니다. 정부 안이 확정된 것은 아니며, 정식등재 이후 기업 부담에 관한 내용은 기자의 전망입니다.", "image_concept": "A small temporary wooden footbridge ending just short of a solid stone bridge over a calm river.", "img": "data:image/webp;base64,UklGRvw6AABXRUJQVlA4IPA6AABQDwKdASqwBCADPpFIoEylpCaiopPYgNASCWlu/8bWv43EN/b5jekQVG5u2Ym6td8gDzUxEaWd0fkn+tbjtMjdovd1JI0W/MMaW/+ssmYt5h/R+Efa93M7B7DL/RYw3n7lI8sGP1x2oI/QvMun8fjdHJnMcjyDZ+X49atki96dFAEHrAsoGoAg9YFlAy4tpFAEHrAsoGoAg9YEZzFCPXRygadZaaMvx61S3Fj2xnLXbJGMSELSfEsoGf3IQtp9dgyV2PFIxIk04XSChXT668UnmT+pRB39N2DXwjK6e2rAiyVq09uCEskTPIdA8Hh6wSKMhWEapULVtn4KWXp8Kx7ND39b1JXrKQ+AhBISygagCUQDrhcEWm0+0ZUW+SGuB1faXL8vy 옆에 접힌 종이 지도가 놓인 모습을 그린 미니멀 일러스트", "date": "2026-11-01", "scope": "글로벌", "entity": "Heartflow, 연구책임자 Carlos Collet, CoreAalst BV(등록상 스폰서)", "what_changed": "하트플로는 TCT 2026에서 공개된 P4 무작위 시험 결과를 발표했습니다. 미국·유럽·일본 23개 기관의 안정형 관상동맥질환 환자 1,105명을 CT 기반 PCI 계획군과 시술 중 IVUS 유도군으로 나눴습니다. 12개월 표적혈관 실패는 4.1% 대 4.6%로 비열등 기준을 충족했다고 회사는 밝혔습니다. 시술 시간 중앙값은 46분 대 63분, 조영제 사용량 중앙값은 150mL 대 170mL였고, 고급 석회화 조절 시행률은 9.2% 대 3.8%였습니다.", "why_matters": "시술 전 CT 분석이 시술 중 영상 유도를 일부 대체할 수 있는지를 무작위 시험으로 검증한 결과입니다. 결과가 확인되면 AI 기반 CT 분석의 쓰임새가 진단을 넘어 시술 계획까지 넓어질 수 있습니다. CT군에는 Heartflow FFR CT 분석과 PCI Navigator의 이전 버전인 Heartflow Planner가 쓰였습니다.", "strategy": "회사는 Heartflow One 플랫폼에 PCI Navigator를 더해 진단에서 시술 계획으로 사업을 넓히고 있습니다. 함께 공개한 NAVIGATE-PCI 등록연구(203명)에서는 약 70%에서 치료 계획이 바뀌었습니다. 시술 현장 도입과 보상으로 이어지려면 논문 원문의 비열등 마진과 안전성 세부 결과를 확인해야 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.quiverquant.com/news/Heartflow+Announces+P4+Trial+Shows+CT-Guided+PCI+Matches+IVUS+Outcomes+With+Greater+Efficiency", "verified": "Quiver Quantitative에 재게재된 회사 보도자료 본문을 직접 확인했습니다. 회사 IR 페이지는 접속이 차단되어 열람하지 못했습니다."}, {"url": "https://www.hmpgloballearningnetwork.com/site/cathlab/meeting-update/tct-2026-late-breaking-trials-and-clinical-science-watch", "verified": "검색 결과 스니펫만 확인(본문 미열람). 11월 1일 발표 일정만 확인했습니다."}, {"url": "https://clinicaltrials.gov/study/NCT05253677", "verified": "검색 결과 스니펫만 확인(본문 미열람). 시험 설계와 스폰서, 목표 등록 1,090명을 확인했습니다."}], "verification_note": "보도자료는 NEJM 동시 게재라고 밝혔지만 NEJM 원문은 확인하지 못해 동료심사 성과로 분류하지 않았습니다. 보도자료에는 비열등 마진, P값, 별도 안전성 비교, 한계가 없습니다. 시험은 회사가 지원한 연구자 주도 시험이고, 등록 사이트의 주요 평가변수 표현은 주요 심장사건(MACE)으로 보도자료와 다릅니다. PCI Navigator의 FDA 상태는 보도자료에서 확인되지 않았습니다.", "image_concept": "A folded paper route map resting beside a lit miner's lamp on a dark stone floor.", "img": "data:image/webp;base64,UklGRjQkAABXRUJQVlA4ICgkAADwgwGdASqwBCADPpFIn0ylp7szIZVIS2ASCWlu/8a8p6/KZr254f3P67nbytnMy3f1G+LVE+P8vh771Bf3f0melFzr2nT/03pq77T0rz+X2nugcGTunmF+3OXfgx/TejrjkTv/hZFEyEnmZjzfwhFPZ8IRT2fCEU9nwhFPZ8IRT2fCEU9nwhFQ WkMmfxPhAbbJMcgXRwAGDtK2YAAAA=="}, {"id": "dh-platform-preselect", "cat": "dh", "title": "비대면 플랫폼의 약물 사전 선택 서비스, 법적 쟁점 부각… 복지부 서면답변과 장관 발언에 온도차", "short": "플랫폼 선택처방 쟁점", "alt": "균형 잡힌 저울 가장자리에 알약 모양 다이얼 하나가 놓인 모습을 그린 미니멀 일러스트", "date": "2026-11-02", "scope": "국내", "entity": "보건복지부, 비대면진료 플랫폼 업계", "what_changed": "오승준 변호사는 메디칼타임즈 칼럼에서 복지부의 10월 국감 서면답변을 전했습니다. 환자가 플랫폼에서 약물과 용량을 고른 뒤 의사 진찰을 받는 서비스를 의료법 위반으로 보기 어렵다는 입장으로 알려졌다는 내용입니다. 다만 진찰이 형식적이면 평가가 달라질 수 있다고 덧붙였습니다. 앞서 정은경 장관은 10월 27일 국감에서 이런 사전 처방을 시행규칙·고시·가이드라인으로 금지하겠다고 답했습니다.", "why_matters": "현행법 해석과 앞으로의 규제 방침이 달라, 플랫폼 관리 기준의 문구가 사업 모델의 존속을 좌우할 수 있습니다. 칼럼은 플랫폼과 의료기관의 수수료 구조가 환자 유인·알선 금지(의료법 제27조 제3항)에 해당하는지도 검토가 필요하다고 봤습니다.", "strategy": "플랫폼 사업자는 의약품 선택 화면과 진료 흐름, 제휴 수수료 구조를 11월 9일까지인 입법예고 기간 안에 점검할 필요가 있습니다. 의료기관은 진찰의 독립성을 입증할 기록 체계를 갖춰 두는 것이 안전합니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.medicaltimes.com/Main/News/NewsView.html?ID=1171545", "verified": "2026년 11월 2일 05:00 게재된 변호사 칼럼 원문을 직접 확인했습니다."}, {"url": "https://www.dailypharm.com/user/news/343907", "verified": "2026년 10월 27일 국감 발언 기사 원문을 직접 확인했습니다. 맥락 확인용입니다."}, {"url": "https://www.fnnews.com/news/202610181817064568", "verified": "검색 결과 스니펫만 확인(본문 미열람). 입법예고 기간 확인에 참고했습니다."}], "verification_note": "복지부 서면답변은 칼럼이 ‘알려졌다’고 전한 내용으로, 원문을 확인하지 못했습니다. 온도차는 칼럼과 장관 발언을 비교한 해석이며 복지부가 인정한 사실이 아닙니다. 입법예고 기한은 검색 결과 요약 기준이고, 해당 주소와의 일대일 대응은 확인하지 못했습니다.", "image_concept": "A single pill-shaped selector dial sitting on the edge of a balanced scale.", "img": "data:image/webp;base64,UklGRoQbAABXRUJQVlA4IHgbAAAwSgGdASqwBCADPpFIoUylp7ioITVoGxASCWlu/9W79f/6Af4+j98v8s2q8DMOsj9xoU0/Tmai56cWvXNdBpEnoP+Kvv/T7uMv5/0Xb631r7RPYAH7Y0zEe7fzs5e3L5Nd844ZcAyBAJ9eq4iRIkSJEiRIkSJEiRIkSJEiRIkSJEiRIkSJEiRKWdkchTwUWSTuCjDHXge8Bc5r17Bgw9/0iVfVYeFMiME8nYJYwVItnVjrK45I7dNUpFZob0OfU7BIkQSiVkEpBgfBOjYvMVNf7AgD17sSrN+6sstBE+hN5K3lebCZjEkFcxQIECCuYnymU8J29Hs+7NyUgIiaNKibHO2bh1fC/qIyqBI1TqOYiHqq1Zp9PKtTSwp9cg4Bl+nL+PKlTpOgafGFMiI6Av6rZB+IhYQp4OTJaDcIT7lWzqAP/kdAUvdCwBKiUfYh are-fast-listing", "cat": "reg", "title": "희귀질환 100일 신속등재 시범사업, 11월 4일 대상 약제 선정… 14개 약제 중 최대 5개, 환자단체는 선정위 불참 논평", "short": "희귀약 신속등재 선정", "alt": "좁은 모래시계의 목에 유리구슬 몇 개가 기다리는 모습을 그린 미니멀 일러스트", "date": "2026-11-02", "scope": "국내", "entity": "보건복지부, 한국환자단체연합회", "what_changed": "한국환자단체연합회가 2일 논평을 내고, 4일로 예정된 정부 선정심의위원회에 참여하지 않겠다고 밝혔습니다. 신청 약제가 모두 환자에게 절실하다는 이유입니다. 신청은 13개 제약사 14개 약제이고, 앞서 복지부는 최대 5개를 선정하겠다는 입장을 밝혔습니다. 연합회는 선정 후 실제 급여까지의 기간 단축, 사후평가 과정의 치료 연속성 보장, 미선정 약제의 기존 절차 등재 노력을 요구했습니다.", "why_matters": "10월로 미뤄졌던 선정 절차가 이번 주 결론을 앞두고 있어 9개 안팎의 약제는 탈락이 불가피합니다. 연합회는 2024년 12월 허가·평가·협상 병행 대상으로 뽑힌 핀테플라액이 2026년 9월에야 급여등재된 사례를 들어, 선정이 곧 빠른 급여를 뜻하지 않는다고 지적했습니다.", "strategy": "신청 기업은 미선정에 대비해 기존 급여평가 경로를 병행해야 합니다. 4일 이후에는 선정 약제 명단과 선정 기준, 사후평가 조건을 등재 전략의 기준점으로 삼을 수 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80404", "verified": "히트뉴스 기사 본문을 페이지 수집 도구의 요약으로 확인했습니다."}, {"url": "https://m.dailypharm.com/user/news/343257", "verified": "10월 8일 데일리팜 기사 본문을 페이지 수집 도구의 요약으로 확인했습니다(최대 5개 선정 입장의 근거)."}], "verification_note": "공식 발표 주체는 정부가 아니라 환자단체이며, 논평 원문은 언론 보도로만 확인했습니다. 11월 4일 개최는 히트뉴스 보도에 근거하고 복지부 공식 공지는 찾지 못했습니다. ‘100일’ 명칭과 10월 발표 연기는 관련 기사 검색 결과 스니펫으로만 확인했습니다.", "image_concept": "A narrow hourglass with a few glass beads waiting at its neck.", "img": "data:image/webp;base64,UklGRj4dAABXRUJQVlA4IDIdAADQSQGdASqwBCADPpFIok0lpCOuIJP4McASCWlu/ELObRF/R0DVi/Y+f+Gcnv0H9n2zx2dtbCGQGoM0q+m58J/9vp0s4d7ncDNAB5co9YmPFf7/m1C2xPAyyZMmTJk1JvccF3jhw4cOG8XqKfUOHDhw4cOHDhw4cWwu5y7QR7/7MI8923cMauXc4iJWqb+T3NstbPC+GUbv5BR6gHkpXEtBXrRo+Wc3iqcpJpZRbBdN4+4W9Mkmc+bZ+Owts+8EzqrZETkHwXve/Id4/J5BjRX2xN9Fltt0+DINbeu/fKWsolXfy31DLKiERvg0X3m+Qa7BIn8k4iEO2qJWIT9aSZMekzAM9zW2nlDhxH1INED0q6BnuIkcDvz1MTbZZz9bQgQIEBx/O7mlm8VjHW0H+xo0kt/xT8GIz1EEG0VSJIUUsCy3Avrzs8xHvSobLjhbC8BfBjKYAFEFNJNHX+E5Ml/j5eD9UT58n0SxeD0btUSr4PKG/V72C9La3NJVy0/cTlvZYCDW2H6AecNfhCkrcKjxlgx4PXecQoIb/Yicg/ng5BjQEaNGf8Q7Gi/ZJIO6jIYP3mwXjub7KzdQzG7/kMf1N67fTyqRRL6SNVXLfMWo4fzu76 유전자치료제와 백신 개발사는 허가 담당자를 분과 교육에 보내고, 반복되는 보완 사례를 신청 자료 점검표에 반영할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50462", "verified": "식약처 게시물의 제목·등록일·담당 부서를 확인했습니다. 본문은 첨부파일에 있어 열람하지 못했습니다."}, {"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80405", "verified": "히트뉴스 기사 본문을 페이지 수집 도구의 요약으로 확인했습니다."}, {"url": "https://www.dailypharm.com/user/news/343816", "verified": "10월 27일 데일리팜 인터뷰 기사 본문을 페이지 수집 도구의 요약으로 확인했습니다(가이드라인 내용과 해외 연사 근거)."}], "verification_note": "15건 등 세부 내용은 첨부파일이 아니라 히트뉴스 보도에 근거합니다. 데일리팜은 10월 27일 협회 인터뷰로 행사를 미리 보도했으며, 식약처 공식 안내일은 11월 2일입니다.", "image_concept": "An open field manual with a single glass vial resting on its page.", "img": "data:image/webp;base64,UklGRrRBAABXRUJQVlA4IKhBAABQCgKdASqwBCADPpFIoEylpCowoVMoohASCWlu6Blo1TTsPRwWcBVJKKPLv/2Q9P8NbS16hz871h5t7Ne+Bts4M/gPBTszdo+5f4SP2m8Ii4foNYWf5fmv/I/6L2A/O3wZPwv/S9gn+b/5n1iv9rzaP0QsbymqnxQc2H1eU90qEOoyiHUZTTUDYdyeLVT4oObDtNU2qnxQNTjYQSnYdqH/3YxKsF8cWLVT1RZ91EBMGVMWqnxQc2V07aptUuJrCCoiz57EEbxa5fteqrQv9NU58p7rWPETNh2mqbVT4msLwHaa4JZKUUQ78vbQ1NieAjEZTNdxtVPTe4wuktVPig5sO01TaqfFBzYcqXAoXMudmJKtYhAVE9CAhaZBVNq7wCe7uw/ig5sI2BKDsgqm1U+KBe/4uqfKdxVzBRGI8vF1aXZMepox4RuVUdkFUuzXauqw7JlNVPigZluAEDVUsOLu+AhI7B6hLXCPDCFq0snKDYiyWnd2HlWIhk0VIHaaptVQz0hG4ZmLchir8qUUIZUhlkhrdt5Mmsma+qZWinkI51daGwMny01Tad3LKT2PP5abJ26EM5VLzucLdDKXWw8YtdpDGJDmsXO2qbVT4oOXXgt/vsVlXpBF+5v4sFZ8qBsPq8qcqAbOyl4tWwzFP9Kkvpqm1U9Q4OcvFSqS+mqczzPNkw+WHeKfFB1mk/TVNhA+z82WHGqbVT4oF8UIaw8WCmBO2BlNWJKychIlUOPSSWajSGaSJAOqFvhaqem77apzPMkpzeIGqnxQcvFgXQom9LJ85sO01S2xitIgo+Ocrau1qQ7u9JVYTkHTYXJ9m3ebT06u5/8G4ae7cyBzYdpOpnsd1UIKOyCqbVTEyayEaJj7hum3ZU5ukJaeHiP/pinGjaW+cso9mWaUnaqfFG8DEimVYh8wGvW6HiKfE0/Hz49wdpqa0GWQ9ts8pUhD0k1KUVDps+jrJikUQF7q/3T3p9xjqO04s2oS45iAbmdycv63u0w20H4LDVNp0IhBoTYcneAVaw4tF1ry5+t9BwO1c43l3iogg7qcFkB6GrXc221VHfH77VrvugBBfYmjI5+zy+MlQnWF7wqyuqLAyXA2X00KK6dWw0jiI/O9B2A22QT/SgQeddw6gW5lOsBf8sODo/9Y9Qf4vX8YKJ8fPmiM5rJPkPXG3NBn9J4UWBZloP3haITqX6pUAU1wyCs7+RDeLozBKSJ8OS0 ’ 1상 중간 결과 공개… 엔허투 경험 유방암 10명 중 5명 부분반응, 12월 SABCS서 업데이트", "short": "리가켐 IKS014 1상", "alt": "금이 간 방패에 기대 놓인, 끝에 작은 캡슐이 달린 정밀한 화살 하나를 그린 미니멀 일러스트", "date": "2026-11-02", "scope": "국내", "entity": "리가켐바이오사이언스, 익수다 테라퓨틱스(Iksuda Therapeutics), 복성제약", "what_changed": "보도에 따르면 엔허투 치료 경험이 있는 HER2 양성 유방암 환자 중 평가 가능한 10명에서 5명이 부분반응을 보였습니다(ORR 50%). 전체 105명의 안전성 분석에서 3등급 치료 관련 이상반응은 15.2%였고, 5등급 이상반응은 보고되지 않았습니다. 데이터 마감은 2026년 4월입니다.", "why_matters": "엔허투 이후 치료 옵션을 노리는 ADC 경쟁에서 다른 페이로드(MMAF)로 차별화를 시도하는 자산입니다. 다만 10명 규모의 단일군 중간 결과라 다른 임상과 직접 비교할 수 없으며, 반응지속기간과 무진행생존기간 확인이 남아 있습니다.", "strategy": "권리는 중화권이 복성제약, 중화권·한국 제외 글로벌이 익수다에 있습니다. 복성제약은 중국에서 캐싸일라 대비 3상을 진행 중입니다. 12월 8~11일 SABCS에서 추가 등록 환자를 포함한 업데이트가 나오면 후속 등록 임상 설계와 파트너 전략을 가늠할 수 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.medipharmhealth.co.kr/news/article.html?no=120900", "verified": "메디팜헬스 기사 원문을 직접 확인했습니다(2026-11-02 보도)."}], "verification_note": "단일 언론 보도로만 확인했습니다. 기사에 공식 초록 출처가 제시되지 않았고, 추가 검색에서 SABCS 초록이나 회사 보도자료, 같은 수치의 2차 보도를 찾지 못했습니다. 2026년 1월 ASCO GI 식도암 하위 분석에도 ‘10명 중 5명, ORR 50%’라는 같은 수치가 있어 혼동 가능성을 배제하려면 초록 원문 대조가 필요합니다. 동료심사를 거친 결과가 아닙니다.", "image_concept": "A single precision arrow with a small sealed capsule at its tip, resting against a cracked shield.", "img": "data:image/webp;base64,UklGRq5kAABXRUJQVlA4IKJkAADwCwKdASqwBCADPpFIoEwlpCMqopUooVASCWlu+ozJO2u9cXw9OYgTYAWzPvo1eRr+Xzie/T/CYG1jN6L2ttpBgbQ9E/pl+xcg93blKup6ntxXzsfnYb9vT6swzzr+l78/zvZpxQbdfZn+0f6XoHY1f/TuXAD9zhOk+atQLhOqA36K9Xr/a/bX0u/ZXsJ/z3z8fZ76Xwg0PJowxhjDGGMMYYwxhjDGGMQMnc7HVJwNSx9k9QmgPr4aiBmLUIxTJTTaeptTYMVHBlDa0XuCNNl1wUwJOJkwNlmvFDcXI8Yx0WZg0gHiZNgHhUJzAReQipAHZJ9euYWZxhhvxzt1USK0IMVipAOnQHl9CTsbY3gQ6S03BBVLn8bapLW+HjGP0+GmmwG4ikcDRMnD6oq60BJnsgcDna5NyblCIah7CdCcTK6+IQnCR0qV9wbwGKj7qTToSlmudtTanFf+2nMKmMO0PVaz8tG9l2GoQSOhKqp8hLG7RjVEQHGB3sJ6ogdSJOJ9CaclhwUiCGa0EEXwnByTFh2NRdPamwcSoFCUYsBEjkYoRrmAyX6bMq7fJL0phDhyW+Y2VNhImGv1A/apgScKhNLddAPknC0yXT5zFb5FyDTZVpLWvNORgDzARePZdZi8gftxUVHUP32Cykw6/Cye/BPe4QnFA5pe/NZA7jxl/z7B  첫 환자 등록을 11월에 시작한다고 밝혔습니다. 약 360명을 대상으로 전체생존기간을 1차 평가변수로 삼으며, 중간분석은 2028년 4분기, 최종분석은 2030년 2분기로 잡았습니다.", "why_matters": "약물이 아닌 기기로 항암제 전달을 높여 생존 개선을 입증하려는 시험입니다. 다만 비용은 약 400억원으로 추정되는 반면, 언급된 외부 지원은 집속초음파재단의 300만달러(약 43억원) 의향 수준이어서 자금 조달이 핵심 과제입니다.", "strategy": "코넥스에서 코스닥으로 기술특례 이전상장을 추진하며 2027년 기술성 평가부터 준비합니다. 다만 실제 시기는 시장 상황에 달렸다고 했습니다. 재단 기술투자 펀드와의 투자 논의, 전략적 제휴와 M&A 가능성도 열어 두었습니다. 수익 모델은 기기를 원가 수준으로 팔고 시술용 일회용 키트로 반복 매출을 내는 구조입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.thebionews.net/news/articleView.html?idxno=29687", "verified": "더바이오 인터뷰 기사 원문을 직접 확인했습니다(2026-11-02 06:20 입력, 07:29 수정)."}], "verification_note": "회사 대표의 인터뷰 발언이며 실제 첫 환자 등록은 확인되지 않은 계획입니다. 임상 등록 사이트와 회사 공시는 대조하지 못했습니다. 재단 지원도 지급 확정이 아니라 지원 의사 표명으로 보도됐습니다. 탐색 임상 ORR 64.3% 대 38.5%는 소규모 결과여서 본문에 싣지 않았습니다.", "image_concept": "A single curved ultrasound lens focusing faint concentric waves onto one small point.", "img": "data:image/webp;base64,UklGRgIiAABXRUJQVlA4IPYhAACQdgGdASqwBCADPpFIn0ylp7CtoXO4QhASCWlu/E2U8wDHtXGKuxMAG9DN95P+hycq7j7yljYqEf/VmtjdJ8ph/Cf/h6nrl3i2XS7qQAu3X+c/8fKZ6+r9H+Pqnpa/1nolQMF8y8cqGwEEpQL4/w+jtxRKvkFW3KMZ45WZfZ8+7OSjFs9TvUeuyzMy9p45TLUmDWUs/+g5pwaCd/VBk/jMjD2liXFgQH0TwqskvTFGOQZ98rYDRLR9mPxTPy5SDGd6OIXcnF43f3q3NbDrEdytRPVK3uRVQfJN8atqnUKLp2J+K26ndQoU8LngKYotiRD7oLlzXDtq/bxRu/zagyVmZuW2U6lkvUAzMpn3bw9O6mxy8gvcsKdC0v04WYUfONH9LizKJiWquXtO8Wdq2MbgWaVXggLkLp3iztc8ddj1bAAiaxcwHdgsTUQZl+WMPZJguKPGXus+5CTo28/yrm4kGO8dl0PtZfxeKzM/CWB/bmScGNgCbGkFiSvPt+Kbw96Q0vq4XTxGikjPVJLxzND8yNaTdzuZWMkdFEgzn99xfXMrCNaQBE7cym6IlH0oPByL/y8VmZuW82Wmcmliz1ERdPD3ymOoMLhnnbeffqA4QexWGsqKaGQwaqM/zrpqTK1yhliPFHRdnWGQPD1LYE8pOSxC325hAKSPxXLTw1IC9sBZfbPEq8UwFmZyFed4y8BXxeKZ5mdnZiekUf5WPSOhO8yFH6DuYrwE48oSASAVE6Pw/FctPMzk2yDHWPtmiS8y8v9W7n8t9VuZTAMeblbISdBIy0C9U4rMq3xWX+e7DxUXtlhVPNj9NkC4hNErId0f0VZ+8x15lFHv7QqKsOHLInzw2PSbtE6a+aPjpIUQ3RfRUJxbvEty8PUSI7oMaICZhn+UuoosA+bYJzJtu/gXCSNgm75Te13FvmiIyPQwJlOF2DyrZ1oGZo0FZpMPtglNzBd/Q8nqbG1VFoHv4eXu6pVY3K0Yh8R0OPALruirqQgpCSt+9NmTj+UxUgUTzPA ma)", "what_changed": "즈멍바이오파마가 KCNQ2/3 칼륨 채널 개방제 CB03-154의 중국 중추 2/3상 등록을 15개 기관, 255명으로 마쳤다고 밝혔습니다. 1차 평가변수는 39주차 ALSFRS-R 점수의 기저치 대비 변화입니다.", "why_matters": "치료 선택지가 제한적인 ALS에서 중국 바이오텍의 후보가 허가 신청을 노리는 단계로 들어섰습니다. 결과 시점이 2027년 3분기로 제시돼 있어 사업개발 측면에서 지켜볼 시점이 생겼습니다.", "strategy": "회사는 결과가 긍정적이면 중국 CDE에 조건부 허가를 신청할 계획입니다. 이 약은 2023년 10월 FDA 희귀의약품 지정을 받았고, 국소 뇌전증 2상과 주요우울장애 2상(2026년 6월 CDE 승인)으로도 적응증을 넓히고 있습니다. 보도자료에는 ALS의 미국 등 다른 지역 허가 계획이 없습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/zhimeng-biopharma-has-completed-the-patients-enrollment-of-its-investigational-drug-cb03-154-in-the-pivotal-phase-23-als-clinical-trial-302924801.html", "verified": "회사 보도자료 원문을 직접 확인했습니다(2026-10-31 미 동부시간 01:00 게시)."}], "verification_note": "효능 결과가 아니라 등록 완료 소식입니다. 보도자료는 2027년 3분기 결과를 ‘2상 톱라인’으로 표현하고 3상 부분의 별도 일정을 밝히지 않았으며, 무작위배정·대조군·눈가림 여부도 설명하지 않았습니다. 임상시험 등록 사이트와는 대조하지 못했습니다. 비상장 여부와 자금 상황도 확인하지 못했습니다. 회사명의 한글 표기는 음역한 것입니다.", "image_concept": "A single nerve-like branching copper wire with one small channel gate standing open along its length.", "img": "data:image/webp;base64,UklGRu49AABXRUJQVlA4IOI9AABQowGdASqwBCADPpFIoUylpCOrITQ4aWASCWdu/+BrVB1j35KCOfLVt92vaba3OP+hm+MonRz6hlPncff/3r4HM5rxr6g9ffTq497rd7vW7zmOkc0v3vvif731L/X/7sv//6X/nD88Pzd9/P3rL+3ZOq1jv99BE9zDXad2SP7/vl+Zuod0y8HTvXmR+7uc3hX/Reh/028JU8H4AdRkHwhjh8r2qZoRUPr4eBbP1ZD2pp8iIPrIe1NPkRB9xChcnxJj5EXWW9QPktJszeTJBCb+i1fkQ8TdmZp7aipUAgkEdhsQmbnZh13Yxiydh7UxVdm++/MqliflMkES1MSPeshFRiXWyEXz+i0ldUPr4iEAGWrxRKa5t9g/ZxXd/VUp+Y0GbQ6+GBN+rdE4sxSE2hpsdHNJV6E9eADioDhRTqm6lgfK+QcMch7M6cl6CiwimZhZSkWatnujL5FJiAo3tk70q1JiqMbPg43n3yhngahHRIM18RETW1LQPHBJ9ZD2Y1Fy1dqxkLxi0egyKao7n8ggIxOtwMsFV9Ow0/GP9k1MajkjP5ak3AGG7+awJtfEQ3Myyd1WnNI6LozoVck9hsetpOFV+rImKPMbQaLxtn9yAUxjYbnWMAh1HF8gBgYRd7WWdXZdLOgR78M7NWriMNKjZeOqhAiBSloAl1a+rNq/9crxa7d2wV9kPZmayINRp1oBfD7ZnWEU5bZpyjoQMmrOmpKzJLrDqr60ieBaJi+Jhf1ypUJmp/vnth12oeoz310Zp+2EKazMzOxaO1UMWOtckDlDUELSNu3swxDHcNFWH5mJc9CEdqwLWPVc/y4hHPOyXiEzVeA6JUT0tVJ const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
</html>
