:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#1a6fe6;--blue-ink:#ffffff;--focus:#1a6fe6;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#5b9dff;--blue-ink:#0b0b0c;--focus:#5b9dff;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}

그라십을 앞섰고, 로슈는 1차(Krascendo 2)와 보조요법(Krascendo 3)으로 적응증을 넓히고 있습니다. 허가 신청 시점이 다음 확인 포인트입니다.", "refs": ["bio-roche-divarasib-krascendo1"]}, {"head": "PD-1×VEGF 이중항체가 폐암 밖에서도 표준치료를 이겼습니다", "body": "담도암 1차에서 임핀지 병용을 OS로 앞선 결과는 머크·화이자 등이 확보한 같은 계열 자산의 적응증 확장 가치를 끌어올립니다. 다만 중국 단일국가 임상이어서 서밋의 미국 등록 임상 결과가 필요합니다.", "refs": ["bio-akeso-ivonescimab-harmoni-gi1"]}, {"head": "CLDN18.2 표적은 ADC 두 개의 경쟁 구도로 짜였습니다", "body": "아스트라제네카 Sone-Ve가 3차 이상 OS HR 0.47을 보였고 다케다·이노벤트 TAK-921도 위암 3상에 성공했습니다. Sone-Ve는 PFS 유의성 미달과 위장관 독성이 심사 변수입니다.", "refs": ["bio-az-sonesitatug-claritygastric01"]}, {"head": "개인맞춤형 mRNA 암백신은 허가 가능성과 상업성 평가가 갈렸습니다", "body": "인티스메란은 3상 1차 지표를 충족했지만 RFS HR 0.58로 기대 하단에 그쳐 모더나 주가가 21% 떨어졌습니다. 신장암 보조요법 데이터가 플랫폼 가치를 가를 전망입니다.", "refs": ["bio-merck-moderna-intismeran"]}, {"head": "비대면진료 플랫폼의 데이터 수익모델에 퇴출 기준이 생깁니다", "body": "환자정보 영리 판매는 1차 위반부터 영업정지 6개월이고, 초진 처방일수 제한까지 겹쳐 플랫폼 매출 구조 조정이 불가피합니다. 의견 제출 마감은 11월 9일, 시행은 12월 24일입니다.", "refs": ["reg-telehealth-platform-sanctions"]}], "priorities": [{"head": "KRAS G12C·CLDN18.2·PD-1×VEGF 경쟁 자산의 포지셔닝을 다시 점검합니다", "body": "ESMO 정면 비교 데이터로 2차 이후 시장의 기준선이 바뀌었으므로, 같은 표적 후발 자산은 1차 병용이나 바이오마커 선별로 차별화 근거를 다시 설계해야 합니다.", "refs": ["bio-roche-divarasib-krascendo1", "bio-az-sonesitatug-claritygastric01", "bio-akeso-ivonescimab-harmoni-gi1"]}, {"head": "타그리소 내성 환자군의 MET 검사 체계를 준비합니다", "body": "타그리소+사볼리티닙은 FDA 심사 중이고 OS 근거까지 확보했으므로, 내성 시점 재생검과 MET 과발현·증폭 검사 흐름을 미리 갖춰 둘 필요가 있습니다.", "refs": ["bio-az-hutchmed-saffron"]}, {"head": "AI 병리 사업은 동반진단 인허가 로드맵을 구체화해야 합니다", "body": "루닛·템퍼스 모두 연구용 단계이며, 밸류에이션을 뒷받침하려면 스코프 매출 실적과 첫 CDx 인허가 계획, PD-L1 1% 경계 구간 판독 차이 보정 방안을 제시해야 합니다.", "refs": ["ai-lunit-esmo-scope-posters", "ai-nh-lunit-scope-valuation", "ai-tempus-he-prescreen"]}, {"head": "비대면진료 플랫폼은 12월 24일 전에 데이터 제공 구조를 정비합니다", "body": "환자정보 제3자 제공, 제휴 마케팅, 데이터 판매 계약을 점검하고, 초진 7일 처방 제한에 맞춰 처방 중심 매출 모델을 조정해야 합니다.", "refs": ["reg-telehealth-platform-sanctions"]}, {"head": "국내 제약사는 약가 규칙 변경에 맞춰 등재·영업 전략을 재설계합니다", "body": "11월 약평위의 구강붕해정 기준 개정, 약가유연계약 활용 가능성, ~500억원의 매출이 추가될 수 있다고 봤습니다. 동시에 AI 바이오마커는 아직 상용화 선례가 없고, 검사 가격과 대상 환자 수, 파트너와의 수익 배분이 불확실하다고 지적했습니다. 남은 CB 원금 약 600억원과 추가 자금조달에 따른 단기 희석 가능성도 위험 요인으로 꼽았습니다.", "strategy": "이번 리포트는 10월 24일 서밋 테라퓨틱스 협업과 9월 10x Genomics 협업을 근거로 스코프의 성장성을 강조합니다. 연구원은 비용 절감에 힘입어 2026년 조정 EBITDA가 흑자로 돌아설 수 있다고 봤습니다. 루닛은 앞으로 스코프 매출이 2026년 전망치 170억~200억원에 실제로 도달하는지 보여줘야 합니다. 첫 동반진단 인허가 계획도 구체적으로 제시해야 이 밸류에이션이 뒷받침될 것입니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.fnnews.com/news/202610260819301979", "verified": "원문 직접 확인(2026-10-26 08:25 기사, 애널리스트명·5,000억원·13배·스코프 매출 전망·리스크 확인)"}], "verification_note": "증권사 리포트 원문은 직접 열람하지 못했고, 언론 보도를 통해 확인했습니다. 기사 요약에 스크리닝 사업 2026년 매출이 ‘약 9,000억원’으로 나왔는데, 오기일 가능성이 있어 이 수치는 쓰지 않았습니다.", "image_concept": "A single brass balance scale with a glass slide on one pan and a small stack of coins on the other.", "img": "data:image/webp;base64,UklGRn5LAABXRUJQVlA4IHJLAACw5AGdASqwBCADPpFIoEylpCMtoPGosbASCWdu+CZdJ3zAzgqrUpX1ZDet0fl88n+SkdzMR7NzX/ee+b/2fV9/b/SG6PfnK86T06/5Tfjuiu9ar/E5Or6n85nlf/G8S/yH7R/Yetfhz+E8Ef55+l/6Hnr4J/JfUL/J/6d+uHqS/Vd3trf+7/Z/2CPZv7P+zXscfV/rF6tf23+n9gH9bP+h/cven/aeJZ+K/5/sB/zL/Beid9gekv9L/2nsL/zvqtBSuU+/M+/M+/NbPLpKn/XN6epT78z78z8uOk+EdkY/fmffmffmit0lzyquEVubJGPhsOL7eqW8KXBDCl1ChT8IL9wFCqW8KX3ns/dn0c5kQQKZXE9M96YyhGYZ6lRW6wqglqwn35n3+yW8KXErD4aSTPrbH0nl0q2RsQKW8Bke6UtQOSrOsS9heU++nBqqBFTwpcNQjdJPLqfKped+amUq249Ut4Ut4U+KtvLNkmF0pEUN3++0/SIKU9lzyVi4YEeVUQVPsCl0pafep8PfB4osfwJEqD0vgLoXQOCt9kt4Y5pdPer3gzssrApdKW6ZQQOakY4JPiE/ClvCaPwqriNjrCnd0m/OEwAc3p6lPv3Bdsj2k9ImwD+t7Wiz/MTuafPVvdGKX0tAEGroX7Ckxn/YxwVcz9/b0yPdSk6LKma5vaJb9MR6OZ9Ah4p3XhGX//Jr7MM4BxdA0r9+Z9wGleVTsAwWCGFLT6yKFYCFYNbAYHU85Xlj4lKQyEt93n4oVSdtbAUv475kEXrulLeAjU+2Q5+oFY4GWaFZuC5T2QQ7y/TZTnaAoFBzrHcJAIdCDqKSnkzOSFLeFLvzkx7yGR5URS9AUMYNwXKffmW3nq1MaHGKzinpwciNBEwgjeSXgxA+bWSCd147Dj9VpAmWDsumY8vY0qZjG3Os+S7lun1ScKbHtFcWKaTP35N0ACA19yCQ1BTFfvwVEUOHWvHEkpN7ZRhjpI7MaRxkabC5YX/z06jOqXqP8Of6KUHWo2xtFPJy+d+XqIcAY+0UvCogr3/78z8cFX7iRULrPAPdkMCZGzYYDqWdpn+AUzwDPajxOL0GYfl7MClB 스터 5편 발표… 일본 비소세포폐암 993명 PD-L1 AI·병리의 일치도 73%", "short": "루닛 ESMO 포스터 5편", "alt": "어두운 실험대 위에서 희미한 격자무늬로 빛나는 유리 현미경 슬라이드 한 장의 미니멀 일러스트", "date": "2026-10-25", "scope": "국내", "entity": "루닛(Lunit, KOSDAQ 328130)", "what_changed": "루닛은 ESMO 2026(마드리드, 10월 23~27일)에서 AI 병리 플랫폼 ‘루닛 스코프’를 활용한 포스터 5편을 발표했습니다. 4편(#287P, #313P, #322P, #346P)은 10월 25일 12:00~12:45에, 소세포폐암 내피세포 분석(#3810P)은 10월 26일에 발표했습니다. 일본 LC-SCRUM-Advantage/MRD 연구(#313P)는 수술 절제한 비소세포폐암 환자 993명을 분석했고, 병리의와 AI의 PD-L1 TPS 전체 일치도는 73%(κ=0.58)였습니다. 병리의가 TPS 1% 미만으로, AI가 1% 이상으로 판정한 211건 중 204건(97%)은 AI가 1~10% 저발현으로 분류했습니다. 췌관선암 181명 연구(#322P)에서는 종양-기질 비율이 높을수록 무진행생존기간이 나빴으나(HR 1.89, p=0.046), KRAS G12D 변이군에서는 결과가 반대였습니다(HR 0.50, p=0.047).", "why_matters": "PD-L1 음성과 저발현의 경계(1%)는 면역항암제 적응 판단에 쓰이는 기준이라, 불일치가 이 구간에 몰린다는 결과는 AI 판독을 임상에 쓸 때 핵심 쟁점이 됩니다. 프랑스 ICO가 주도하는 AIforHER 프로젝트(#287P)는 HER2-low·ultralow 판정용 AI 도구 7개를 비교했고, 루닛은 실제 임상 평가 단계(Study B)에 진출한 2개사 중 하나라고 회사는 밝혔습니다. 다만 Study A의 수치는 보도자료에 공개되지 않았습니다. 이번 연구는 모두 학회 포스터이며 동료심사 논문이 아닙니다. 루닛 스코프 제품도 연구용(RUO)이라 진단 결정에는 쓸 수 없습니다.", "strategy": "루닛은 영상진단 매출을 기반으로 삼아 병리 바이오마커를 제약사 협업 사업으로 키우고 있으며, 이번 ESMO 발표도 그 근거를 쌓는 과정으로 볼 수 있습니다. 10월 24일 서밋 테라퓨틱스 협업에 이어 AZ·다이이찌산쿄가 참여한 AIforHER 결과까지 공개하면서 항체약물접합체(ADC)와 이중항체 개발사를 고객으로 겨냥하고 있습니다. 앞으로 지켜볼 지점은 AIforHER Study B의 실사용 성능 수치와 동반진단(CDx) 인허가 착수 여부입니다. PD-L1 저발현 구간의 판독 차이를 어떻게 보정할지도 상용화 단계의 과제로 남아 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/lunit-highlights-ai-powered-pathology-insights-across-cancer-types-at-esmo-2026-302913661.html", "verified": "원문 직접 확인(2026-10-20 보도자료, 포스터 번호·일시와 993명·73%·κ=0.58·211건·HR 수치 확인)"}, {"url": "https://www.medicaldevice-network.com/news/esmo26-lunit-scope-studies-highlight-ai-based-pathology-benefit/", "verified": "원문 직접 확인(2026-10-22 기사, 73%·97% 수치 교차 확인)"}, {"url": "https://www.etoday.co.kr/news/view/2637710", "verified": "원문 직접 확인(2026-10-20 기사, AIforHER에 AZ·다이이찌산쿄 참여 및 Study B 2개사 진출 확인, 결과 수치는 없음)"}], "verification_note": "보도자료는 10월 20일에 판매하면 1차 영업정지 6개월, 2차 12개월, 3차에는 신고수리가 취소됩니다. 거짓이나 부정한 방법으로 신고하고 운영하면 1차 위반부터 신고수리가 취소됩니다. 의료법상 개인정보 처리 위반은 1·3·6개월 영업정지, 분기별 통계 보고 미이행은 시정명령 뒤 15일·1개월·3개월 영업정지가 적용됩니다. 의견 제출은 11월 9일까지이고, 시행일은 개정 의료법 시행일인 12월 24일입니다.", "why_matters": "비대면진료 제도화 이후 처음으로 플랫폼 사업자에 대한 구체적인 퇴출 기준이 생기는 것입니다. 데이터 기반 수익모델을 운영하는 플랫폼 업계에 직접적인 규제 리스크입니다. 의료기관도 시정명령 대상이 됩니다. 대상은 요건을 충족하지 않는 환자 진료, 처방일수 제한 초과, 전체 진료 대비 비대면진료 비율 초과, 오남용 우려 의약품 규정 위반 처방 등입니다. 영업정지와 신고수리 취소 권한은 복지부장관에게, 시정명령 권한은 복지부장관과 시장·군수·구청장에게 있습니다.", "strategy": "플랫폼 사업자는 12월 24일 시행 전까지 환자정보의 제3자 제공 구조, 제휴 마케팅, 데이터 판매 계약을 다시 점검해야 합니다. 1차 위반부터 6개월 영업정지가 내려지므로 사업 지속성에 치명적입니다. 23일 보도된 별도 시행규칙안이 초진 비대면진료 처방을 7일 이내(만성질환자 등은 1회에 한해 30일 이내)로 제한하고 있어, 처방 중심 비즈니스 모델의 매출 구조도 조정이 필요합니다. 피부과·가정의학과 의사회가 초진 30일 처방에 반발하는 등 의료계 의견이 엇갈리므로, 11월 9일 의견수렴 결과에 따라 세부 기준이 바뀔 수 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3043955", "verified": "원문 직접 확인(청년의사 2026-10-26 06:15 입력, 처분기준·의견 마감·시행일)"}, {"url": "https://www.dailypharm.com/user/news/343754", "verified": "원문 직접 확인(데일리팜 2026-10-23, 초진 비대면진료 처방일수 7일·30일 예외 시행규칙안)"}], "verification_note": "입법예고 시작일은 기사에 나오지 않아, date는 보도일(10월 26일)로 기재했습니다. 복지부 입법예고 원문은 직접 확인하지 못했습니다. 입법예고 단계이므로 최종 확정 내용은 달라질 수 있습니다.", "image_concept": "A smartphone sealed with a single heavy padlock resting on a medical clipboard.", "img": "data:image/webp;base64,UklGRlwsAABXRUJQVlA4IFAsAACwkAGdASqwBCADPpFIokylpCcrILN4qWASCWlu9/7H6/Be8tmfqFk0dOddq/NK4h/jMHn1E//rp5zH5fc8yXl3j06gRzbjv5h+eYuOAv8t3oXxO8B36f0F6x/XL9iOfC8TP6j/vPYF/kX90/ZH3iP+DzpituZLrpvmUIyimjxmwhJSElIAW5YcdeuVukNcqXeVuZLrpvK3Ml5GF/oCl2tzJ2TmTGEgh1bmLXFgTYn+OtDIgIlMAtytzJddN7mAuWr8glQ2j6YzfnMlvO/kFpurjrN8xVPYGAXFyc0mi6bCVPK/P29mcf2YCSCW1+TV/I0CDH8y4tw8Cv/9DI7NCop9sOOPGAW5W7fg0tG6bytzV8V49vObCAFoKbytzKfpf3r2Ircrc4FLcyXUvMkALcl/MTmS66eBcrcziW5kuunBmAijjVf/QESmAW5W5vkt5vK3MUjwK3K3NXcIAW5W5KvMl1xaunB38x8/K3Ml103uYC3Jg5uTJgN03lbRyEAEbwoWAnTv2zABEpgFwzjMvVnCAFuVuZMYaQrx/Dk5kuxg3mlQXcOiN/l63sH1xxmCzhAQi79KJLrp t": "구강붕해정 등재 제동", "alt": "닫힌 톨게이트 차단봉 위에 녹아내리는 알약 하나가 놓인 미니멀 일러스트", "date": "2026-10-26", "scope": "국내", "entity": "동아에스티(170900.KS), 건강보험심사평가원·약제급여평가위원회", "what_changed": "릭시아나(에독사반) 후발약 25개사 64품목이 11월 11일 급여 등재될 예정인데, 동아에스티의 퍼스트 제네릭 에독시아구강붕해정은 이 명단에서 빠졌다고 보도됐습니다. 이 제품은 12월 1일 등재될 것으로 보이며, 다른 후발약보다 약 3주 늦습니다. 구강붕해정(ODT) 급여 일반원칙 개정 논의가 9월 약평위에서 결론을 내지 못하고 11월 약평위로 넘어갔고, 그 결과 신규 진입을 준비하던 ODT 품목 전체가 함께 지연되고 있습니다.", "why_matters": "7월 시행된 새 약가제도는 계단식 인하를 강화하고 다품목 등재관리를 도입했습니다. ODT가 이를 피하는 우회 수단이 될 수 있다는 문제 제기가 나오면서 제형 차별화 전략 자체가 심사 대상이 됐습니다. 쟁점이 된 사례는 로수바스타틴+에제티미브 ODT 복합제의 약가 산정입니다. 에독시아 ODT는 2021년 12월 15·30·60mg 3개 용량으로 허가를 받았기 때문에, 제도 논의 이전부터 등재를 준비한 품목이 피해를 본다는 반발이 예상됩니다.", "strategy": "개량신약·제형 변경으로 약가 방어를 노리는 국내사는 11월 약평위에서 ODT 급여기준이 개정되는지, 어떤 세부 요건이 붙는지를 확인한 뒤 등재 일정을 다시 짜야 합니다. 원본 에독사반 시장에는 30·60mg 기준 혁신형 가산 1,219원, 일반 914원, 기준요건 1개 충족 732원 품목이 11월 11일 동시에 진입합니다. 그래서 3주 늦은 진입도 초기 처방 선점에서 불리합니다. 30·60mg은 2027년 11월 11일 다품목 등재관리에 따라 777원(기준요건 1개 충족 품목은 622원)까지 추가 인하될 예정이어서, 제형 프리미엄을 인정받을 수 있는지가 수익성을 가를 변수입니다. 아직 건정심에 오르지 못한 ODT 품목은 개별 대책을 마련할 것으로 보입니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.dailypharm.com/user/news/343769", "verified": "원문 직접 확인(데일리팜 2026-10-26, 등재 지연·약평위 일정·허가 이력)"}, {"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80178", "verified": "원문 직접 확인(히트뉴스 2026-10-26, 에독사반 후발 64품목 상한금액·다품목 인하 일정)"}], "verification_note": "등재 제외와 12월 1일 등재 전망은 언론 보도이며, 심평원·약평위 공식 회의 결과 자료는 확인하지 못했습니다. 동아에스티는 공식 입장을 내지 않았고, 심평원에 의견을 전달한 것으로만 보도됐습니다.", "image_concept": "A single dissolving tablet resting on a closed tollgate barrier.", "img": "data:image/webp;base64,UklGRowoAABXRUJQVlA4IIAoAADQcAGdASqwBCADPpFIokylp6crIPOYYWASCWlu3Ixbnzy8nvY/4jU64qmn+Xr1jDfNem3MdZlwf/6QPn3z1ASH9/SB5gH6ndO3zD+ex50V9SZGZQdtgeFc0U6L5U88L73o4c6zgg/DB0HldU1dZl4vTTV1mXi9NNXWZeL001dZl4vTTV1mXi9NNXliSusPyQ1oDFn7LSjF0x8U5BU2Xlausv41ofrT9dUKUY01dc9YjewDyOTzQovo813WVtTE8OEEFNluQVPMvF6cgqfKYqWKCJ3ZJCTt9WYAxZegRO7JRY0f0r6nl/GrXXamrrMqodzFNf22n67xemmrrm26zLxenUXhOUUnhr 원료를 생산한 경우에만 인정됩니다. 따라서 자회사나 계열사가 국내에서 원료를 생산해도 법인이 다르면 가산 대상에서 빠집니다.", "why_matters": "식약처 집계로 올해 상반기 신규 등록된 원료의약품 471건 중 수입이 440건(93.4%), 국내 제조는 31건(6.6%)이었습니다. 인도 223건과 중국 181건을 합하면 404건(85.8%)입니다. 원료 국산화를 유도하려고 만든 약가우대가 원료와 완제를 별도 법인으로 분업하는 국내 산업 구조와 맞지 않아 사실상 작동하지 않고 있다는 점이 수치로 드러났습니다. 공급망 안정성 측면에서 EU가 추진하는 핵심의약품법(Critical Medicines Act, 미확정)과 정책 수단이 다르다는 점도 비교 대상이 됩니다.", "strategy": "유한양행·유한화학, 한미약품·한미정밀화학, 종근당·경보제약처럼 원료 계열사를 둔 기업은 인정범위가 넓어질 경우를 대비해 품목별 원료 공급 구조와 원가 자료를 미리 정리해 둘 필요가 있습니다. 복지부는 인정범위를 넓히면 가산 대상이 늘어 재정 부담이 커진다는 점을 고려하고 있습니다. 그래서 단기적으로는 약가가산보다 생산기반 지원 같은 별도 수단이 먼저 나올 가능성이 있습니다. 원료 전문기업은 국가필수의약품과 연계한 국산 원료 공급 계약으로 제도 개편 수혜를 노릴 수 있습니다. 다만 신규 등록 건수 통계는 실제 사용 물량이나 금액 기준의 수입 의존도와 다를 수 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.medipana.com/news/articleView.html?idxno=420007", "verified": "원문 직접 확인(메디파나뉴스 2026-10-26 06:03 입력, 국감 0건 수치·복지부 서면답변·식약처 원료 등록 통계)"}], "verification_note": "복지부 서면답변 원문과 식약처 통계 원자료는 직접 확인하지 못했고, 언론 보도의 인용을 근거로 했습니다. 0건은 원료직접생산 가산에 한한 수치이며, 다른 약가우대 실적까지 없다는 뜻은 아닙니다.", "image_concept": "An empty laboratory flask on a balance scale outweighed by a pile of imported shipping crates.", "img": "data:image/webp;base64,UklGRrRKAABXRUJQVlA4IKhKAAAw/wGdASqwBCADPpFIoUylpCqoIXIoyVASCWlu/8g3xr2GADnu+UABYz/fWFAPNR6u0aSo9K2+RcNIqN5Ffn+WX9t3v/UZzjPVb/TeizvLH0wsnAm4cr/7H+G/yfmf6K/s03e5Pq78Df17+k9Aj2h4Re4a2n/h+gv7Z/YP2M9eP8/za/lv9p7APC8/cvUG8ob/K8sf1kFfLFhx39Se3kEHZWpiw48vyABtcfkBVQBB6wMalVAEJMyyggFVAEMM/18xgs9bebDkAwPy9b7ExDDAulAPy61AEodTHli1E2Z8fNPFuiqCpYRBKNzB7cMfR8tn7utBISUmrXCxTCOni1NOi9tOfXR8HJFR5re1/zgDHxSNcdaDRD3UV/HzTyii6PKS7JHhjCwI6vVsXPFS3kp6PkBVQEpe/9YfpQwEp6M3VLTN+rNKrV3VbSh+3SMQBUcCF7UN+N5/E5ZQZGboArTcXGjAaEDPtySOexBKACe6HM8qqcSNEMGWUEAX8szb8wzKAyKzGUVvVzrZQBCkYIw0Ypj+sIG1M99iJ009k8IiAqINWxE5+jSAbT4+kp4E9ks6Zg7lBAKp1tYsuyCD1U6wIsaX6+QiIr/PWBZiSg2wlLUM3x8wNDAK9tZyCD1gfdZmLdeyRx6yfu9WUE2fms/89Xs08YWQUgFaAkceMDItiEtRwLKB+S/yxbsn+kAH9OWZth10YLBQrEYJ9DOTvLlCqtbVVBKBRQJ2OOsFdp8LWj9FrOi0pvFEGI8c+ylRrDe7b1ClSjQK4r1Ghi ) 루마크라스(소토라십), BMS(BMY) 크라자티(아다그라십)", "what_changed": "로슈는 2026년 10월 25일 ESMO 2026 Presidential Symposium II(LBA5)에서 이전에 치료받은 KRAS G12C 변이 비소세포폐암 환자 338명을 대상으로 한 3상 Krascendo 1의 1차 분석 결과를 발표했습니다. 디바라십군(167명)은 소토라십 또는 아다그라십 대조군(171명)보다 사망 위험을 44% 줄였습니다(HR 0.56, 95% CI 0.41–0.78, p=0.0005). 중앙 OS는 17.7개월 대 12.0개월이었습니다. 무진행생존(PFS) HR은 0.58(95% CI 0.44–0.76, p<0.0001), 중앙 PFS는 9.8개월 대 5.7개월, 확정 객관적반응률은 58% 대 32%였습니다. 결과는 NEJM에 동시 게재됐습니다.", "why_matters": "1세대 KRAS G12C 억제제와 직접 비교한 3상에서 PFS와 OS를 모두 개선한 첫 사례입니다. 이 때문에 암젠·BMS가 차지한 2차 이상 KRAS G12C 폐암 시장이 다시 짜일 수 있습니다. 치료 관련 이상반응으로 인한 중단율은 4.8% 대 11.7%, 치료 관련 중대 이상반응은 7.8% 대 15.2%로 내약성도 대조군보다 좋았습니다. 투여 기간 중앙값도 11.3개월 대 5.0개월로 두 배 이상 길었습니다. G12C 변이는 비소세포폐암의 약 12–14%를 차지합니다.", "strategy": "로슈는 보건당국과 긴밀히 협의 중이라고만 밝혔고, 구체적인 허가 신청 시점은 공개하지 않았습니다. 디바라십은 2022년 FDA 혁신치료제, 2026년 희귀의약품으로 지정됐습니다. 로슈는 1차 치료(펨브롤리주맙 병용, Krascendo 2)와 수술 후 보조요법(Krascendo 3) 3상을 진행하며 적응증을 앞단으로 넓히고 있습니다. 같은 학회에서 일라이 릴리도 1차 치료용 올로모라십 데이터를 발표해, 1차 치료 KRAS G12C 시장에서 로슈·릴리·암젠의 경쟁이 본격화할 것으로 보입니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.roche.com/media/releases/med-cor-2026-10-25", "verified": "원문 직접 확인(2026년 10월 25일 바젤 발표, OS·PFS HR과 중앙값, 중단율, 후속 3상 확인)"}, {"url": "https://www.stocktitan.net/news/RHHBY/roche-s-divarasib-demonstrated-best-in-class-efficacy-advancing-the-dhx9geybaoro.html", "verified": "원문 직접 확인(보도자료 전재본, NEJM DOI 10.1056/NEJMoa2605703과 ORR·DOR 확인)"}, {"url": "https://www.targetedonc.com/view/esmo-2026-savolitinib-presidential-symposium-divarasib-nsclc-krascendo1-saffron-clarity-gastric01-harmoni-gi1", "verified": "원문 직접 확인(학회 리뷰 기사, 3–4등급 치료 관련 이상반응 24.6% 대 34.5% 확인)"}], "verification_note": "핵심 수치는 로슈 공식 보도자료 원문과 대조했습니다. OS는 1차 중간분석 결과입니다. NEJM 논문 본문은 직접 열람하지 않았습니다.", "image_concept": "A single precision key sliding smoothly into a lock that an older, worn key had failed to fully turn.", "img": "data:image/webp;base64,UklGRhRfAABXRUJQVlA4IAhfAADQAwKdASqwBCADPpFIn0wlpCKtInXYqaASCWlu+hlNf//xh/g3/bmrXz+jyXIp6XmjR5pv52u1ABN ": "아케소는 중국 NMPA에 우선심사 지정이 제안됐다고 밝혔지만, 허가 신청 제출 여부와 날짜는 명시하지 않았습니다. 중국 외 권리(미국·유럽·일본)를 최대 50억 달러 규모로 도입한 서밋은 10월 21일 ECOG-ACRIN과 담도암 1차 등록용 2/3상(EA2251)을 함께 진행한다고 발표했습니다. 이 임상은 이보네시맙 병용을 키트루다 또는 임핀지 병용과 비교하며, 미국 기관 개시는 2026년 4분기로 예정돼 있습니다. 서밋은 이를 이보네시맙의 7번째 국제 등록 임상이라고 설명했고, 중국 데이터를 글로벌 허가로 잇는 브리지 전략을 추진하고 있습니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.prnewswire.com/news-releases/positive-overall-survival-results-from-the-phase-iii-harmoni-gi1-trial-of-ivonescimab-plus-chemotherapy-versus-durvalumab-plus-chemotherapy-in-first-line-biliary-tract-cancer-presented-at-the-esmo-2026-presidential-symposium-302918768.html", "verified": "원문 직접 확인(아케소 10월 25일 보도자료, OS·PFS·ORR, 안전성, NMPA 우선심사 제안, 서밋 EA2251 언급 확인)"}, {"url": "https://oncodaily.com/gastrointestinal-oncology/harmoni-gi1", "verified": "원문 직접 확인(682명 설계, 3등급 이상 이상반응 82.0% 대 72.3% 확인)"}, {"url": "https://marketchameleon.com/articles/b/2026/10/21/smmt-ecog-acrin-ea2251-phase-2-3-ivonescimab-first-line-biliary-tract-cancer", "verified": "원문 직접 확인(10월 21일 ECOG-ACRIN 협력, 2026년 4분기 미국 기관 개시 예정 확인)"}], "verification_note": "효능 수치는 아케소 공식 보도자료 원문으로 확인했습니다. 중간분석 결과이며, 데이터는 아케소가 생성·분석했습니다. 서밋 계약 규모(최대 50억 달러)는 아케소 보도자료의 기재 내용을 인용한 것입니다.", "image_concept": "A single two-headed arrow piercing a target dead center while a conventional arrow lands just off the bullseye.", "img": "data:image/webp;base64,UklGRvJvAABXRUJQVlA4IOZvAABwFwKdASqwBCADPpFIn0wlpCalItQYyNASCWduloNZLvrFx+u/+fCCkOL5CLmnzEUcPKo/I5x3gc7ROkcYHdv6NstEx4N/uOXQqwUB+bq5T86SlZ4MRw2F5Qfu87kP1oAhCPX+l7zCuhN5oPOr9QX+W347enshz92963pe/pvu49uWuOfzdqf7N4hfiT09/8O9OAH+j/3D9gvXo7Z+l38l6gHnf/1vFy9j9gH+m/4z0jdIX1l+2fwJ/0L/Gem3///eH6Rv7i//8Sh/7VO4Wo7r7YxKe2fFTScCMXRQX9xqgUklNLjd/ppcbsFBR0PcbLWG5tqx9iFZ/lLqkJ0xTT5c/PCuPjLDitIn3G8SEXarJQAXqJnMBMeAL3/ERQFShrxKzMbVVuhH9oRrejz0O8wkAaFGH3xCWaAavrY/+o9XLHuWPLBnSaXLm6vrDhbi3koaRjdB3LfIusRzvpTC+vTuTCbNKvLmqEkb4qokl+15cgZoQw9qz/I3nY/oKaGdduH1OUoTSJFh5i63clAuO4dZZWIkKyuxkITT7/sQ+1WAMsxYzDrP7HMGHgO5b3LMMm9Qb4Q/I7 일 ESMO 2026 Presidential Symposium II(LBA7)에서 CLDN18.2 양성 진행성 위·위식도접합부암 3상 CLARITY-Gastric01의 결과가 공개됐습니다. 594명에서 Sone-Ve는 의사 선택 치료(라무시루맙+파클리탁셀, 이리노테칸, 아파티닙 등)보다 생존을 늘렸습니다. 전체 OS HR은 0.58(95% CI 0.47–0.73), 중앙 OS는 10.6개월 대 6.4개월로 보도됐습니다. 이중 1차 지표인 3차 이상 치료군에서는 OS HR 0.47(95% CI 0.36–0.62), 중앙 OS 10.0개월 대 5.0개월이었습니다. 반면 PFS HR은 0.77(P=0.053)로 통계적 유의성에 이르지 못했습니다.", "why_matters": "항 CLDN18.2 ADC로는 처음으로 3상에서 의미 있는 OS 개선을 보여준 결과입니다. CLDN18.2를 겨냥한 ADC·이중항체 경쟁에서 아스트라제네카가 선두에 섰습니다. 아스트라제네카는 Sone-Ve를 자사 ‘첫 완전 소유(wholly owned) ADC’라고 설명해 왔으며, 다이이찌산쿄와 이익을 나누는 엔허투·다트로웨이와 달리 수익을 독점할 수 있는 자산입니다. 3등급 이상 호중구감소증은 10.3% 대 25.4%로 적었지만, 오심(54.4% 대 26.6%) 등 위장관 독성은 더 많았습니다. 사망에 이른 이상반응은 4.2% 대 2.4%였습니다.", "strategy": "적용 대상은 종양세포의 25% 이상에서 CLDN18.2가 발현된 환자로 넓게 잡혔습니다. 아스트라제네카는 이를 근거로 넓은 CLDN18.2 양성 환자군에서 새 표준치료를 확립하겠다는 입장입니다. 허가 신청 일정은 아직 공개되지 않았습니다. PFS 미달과 위장관 독성은 규제 심사와 처방 확산에서 변수로 남습니다. 같은 학회에서 다케다·이노벤트의 CLDN18.2 ADC(TAK-921)도 위암 3상 성공을 발표해, 이 표적에서 두 ADC의 경쟁 구도가 짜였습니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.targetedonc.com/view/esmo-2026-savolitinib-presidential-symposium-divarasib-nsclc-krascendo1-saffron-clarity-gastric01-harmoni-gi1", "verified": "원문 직접 확인(학회 리뷰 기사, ITT·3차 이상 OS HR과 중앙값, PFS P=.053, 안전성 확인)"}, {"url": "https://www.astrazeneca.com/media-centre/press-releases/2026/astrazeneca-present-survival-data-from-four-pivotal-phase-iii-trials-at-esmo-2026-featuring-sone-ve-imfinzi-tagrisso-orpathys.html", "verified": "원문 직접 확인(LBA7 일정과 ‘첫 완전 소유 ADC’ 표현 확인)"}, {"url": "https://www.astrazeneca.com/media-centre/press-releases/2026/sone-ve-improved-survival-in-gastric-cancers.html", "verified": "검색 결과 스니펫만 확인(본문 미열람, 7월 톱라인과 CLDN18.2 25% 이상 발현 기준 확인)"}], "verification_note": "구체적인 HR과 중앙값은 학회 리뷰 기사에서만 확인했습니다. 10월 25일자 아스트라제네카 공식 결과 보도자료는 찾지 못했습니다. 기사는 3차 이상 OS 개선을 주요 결과로 다뤘습니다.", "image_concept": "A single slim key cut precisely to fit a claudin-shaped keyhole on an otherwise smooth steel door.", "img": "data:image/webp;base64,UklGRg4cAABXRUJQVlA4IAIcAA 24일 ESMO 2026에서 발표했습니다. 이 데이터는 학회 전인 10월 22일 온라인에 실수로 먼저 게시됐다가 삭제됐고, 머크가 곧바로 보도자료를 냈습니다. 무재발생존(RFS) HR은 0.58(95% CI 0.45–0.75, p<0.001)로 재발·사망 위험을 42% 낮췄습니다. 원격전이 무발생 생존 HR은 0.62(95% CI 0.45–0.85, p=0.002)로 보도됐습니다. 전체생존(OS) 데이터는 아직 공개되지 않았습니다.", "why_matters": "개인맞춤형 mRNA 암백신 가운데 처음으로 3상에서 1차 지표를 충족했습니다. 그러나 투자자 기대치(HR 0.50–0.59)의 하단에 그쳤고, 2상 HR 0.51보다도 약했습니다. 데이터가 유출된 10월 22일 모더나 주가는 21% 떨어진 193.65달러, 머크는 1%가량 내린 147.93달러를 기록했습니다. RBC는 허가 가능성은 높지만 상업적 성공은 훨씬 불확실하다고 평가했습니다. BMO는 다른 암종으로 확대 해석하는 것을 경계했습니다.", "strategy": "두 회사는 규제당국과 협의 중이며, RBC는 FDA 승인이 2027년에 나올 수 있다고 내다봤습니다. 신장암 보조요법 데이터는 2026년 말–2027년 초에 나올 예정입니다. 비소세포폐암·방광암 등 후속 임상 결과가 플랫폼 가치를 좌우할 전망입니다. 코로나19 백신 매출 감소를 암백신으로 메우려는 모더나에게는 신장암 데이터와 실제 출시 가능성이 더 중요해졌습니다. William Blair는 하위군에서 효능이 고르게 나타났다는 점을 긍정적 신호로 꼽았습니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.biospace.com/drug-development/esmo-2026-merck-moderna-shares-fall-as-cancer-vaccine-disappoints-after-data-leak", "verified": "원문 직접 확인(10월 22일자 기사, HR 0.58, 주가 하락폭, 애널리스트 평가, 학회 발표 일정 확인)"}, {"url": "https://www.emjreviews.com/oncology/news/new-personalised-mrna-therapy-improves-melanoma-outcomes-esmo-2026/", "verified": "검색 결과 스니펫만 확인(본문 미열람, HR 0.58 95% CI 0.45–0.75, 1,137명 등록 언급)"}, {"url": "https://www.onclive.com/conference/esmo-congress", "verified": "원문 직접 확인(10월 24일자 ‘Adjuvant Intismeran Autogene Plus Pembrolizumab Improves RFS and DMFS’ 헤드라인 확인)"}], "verification_note": "수집 기준일 이전인 10월 24일 학회 발표로, 확장 범위 규정에 따라 포함했습니다. 핵심 수치는 10월 22일 유출과 머크 보도자료로 먼저 알려졌습니다. 머크 공식 보도자료 원문은 직접 열람하지 않았습니다. 원격전이 무발생 생존 HR과 등록 환자 수는 2차 매체 스니펫 기준입니다.", "image_concept": "A hand-cut paper key that is personalized and intricate but only partially turns a heavy lock.", "img": "data:image/webp;base64,UklGRvpqAABXRUJQVlA4IO5qAACQUgKdASqwBCADPpFIn0wlpCKqo3Jo+VASCWdu+d+HO5r9ff8OZlexvseBRAo1ea5+Jr0BZrg3ZbR2241DPMF4X+/8Gg75dy/120ZtB1ID/e8fv7v6C9KijOPepX7P+9eo5dH9V+fva14zdqefT0l5v/9x+yvuv/VPsDeON6tfMV50n/f/bz30/5D0Q+pw9CLplv7V6v2nSeu/Npah+cfofK7wR/A7mvtp/Y const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
