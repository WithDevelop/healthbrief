ficate-clinicians"]}, {"head": "비대면 정신건강·중독 치료가 현금 결제에서 보험 급여와 지속관리 모델로 옮겨 갑니다", "body": "텔라닥 베터헬프의 보험 적용 매출은 1년 새 370만달러에서 3,210만달러로 늘었지만 본인 부담 매출은 25% 줄었습니다. CHESS와 리아 헬스는 비대면 알코올 치료에 24시간 동료 지원을 붙였습니다.", "refs": ["dh-teladoc-q3-2026", "dh-chess-ria-health"]}, {"head": "미국 규제가 과학 심사보다 규제 완화 기조를 앞세우는 사례가 늘고 있습니다", "body": "HHS는 FDA 과학자 반대에도 미승인 펩타이드 6종의 조제 단속을 유예했고, ONC는 비용 절감을 이유로 AI 투명성 의무를 없앴습니다.", "refs": ["reg-hhs-peptide-compounding", "ai-onc-hti5-model-card-repeal"]}, {"head": "국내 바이오 자본이 초기 기술이전과 해외 CDMO 인수 쪽으로 움직입니다", "body": "녹십자·한미는 1/2상 단계 자산을 선급금 7,000만달러에 넘겼고, 삼성전자·삼성물산은 폴리펩타이드 그룹 인수 재원인 삼성바이오로직스 유상증자에 약 1조5,850억원 참여를 확정했습니다.", "refs": ["bio-gc-hanmi-biomarin-fabry", "bio-samsung-biologics-rights-offering"]}, {"head": "미국 투석 묶음지불에서 약제 가격 보고 의무가 엄격해집니다", "body": "CMS 2027 ESRD 최종규칙은 인결합제를 묶음지불에 편입하고, 제조사가 ASP를 보고하지 않으면 TDAPA 지급을 중단하도록 했습니다.", "refs": ["reg-cms-esrd-2027-final"]}], "priorities": [{"head": "미국 EHR 연동 AI를 파는 기업은 의무가 없어져도 모델카드 수준 공개를 유지합니다", "body": "학습 데이터·편향 검증 정보를 계약서와 제안서에 자율 공개 항목으로 넣고, 11월 HTI-6 제안 내용을 추적합니다. EHR 안 연동과 환자 맥락 결합을 제품 로드맵 우선순위에 둡니다.", "refs": ["ai-onc-hti5-model-card-repeal", "ai-openevidence-nyu-langone"]}, {"head": "의료 LLM 제품에 용량·상호작용 검증 계층과 실사용 오류율 지표를 넣습니다", "body": "국시 점수 대신 용량 조정·상호작용·신약 질문에서의 오류율을 제시하고, 여러 AI를 함께 운영하는 병원을 위해 감사·관리 기능을 제안 범위에 포함합니다.", "refs": ["ai-doximity-dosecheck-llm-errors", "ai-notable-flow-compass"]}, {"head": "가치 기반 지불 전환에 대비해 건강성과·비용효과 근거를 미리 쌓습니다", "body": "의료혁신위 권고안의 혼합지불·정책 영향 평가 방향과 미국 CMS의 묶음지불 강화 흐름을 함께 보고, 제품별 성과 근거와 가격 보고 체계를 점검합니다.", "refs": ["reg-healthcare-innovation-committee-cost", "reg-cms-esrd-2027-final"]}, {"head": "바이오시밀러·중소 바이오 기업은 개정 지침과 프론티어 공고를 개발 계획에 반영합니다", "body": "반복투여 독성시험 면제 요건과 최소 배치 수에 맞춰 품질 비교동등성 자료를 다시 설계하고, 분야별 선정 쿼터와 단계별 성과평가에 맞춘 마일스톤 계획을 준비합니다.", "refs": ["reg-mfds-biosimilar-guideline", "reg-k-biopharma-frontier-200"]}, {"head": "단일 제품 의료 AI 기업은 얼라이언스와 개방형 플랫폼으로 유통 경로를 확보합니다", "body": "제약사가 묶어 파는 병원 단위 AI 패키지와 에이전트에 개방된 예약 인프라가 새 판로가 되고 있습니다. 니코틴 제품처럼 저위  임상 AI 탑재… 연 외래 1,240만 건 의료망 대상", "short": "오픈에비던스 NYU 탑재", "alt": "환자 종이 차트 폴더 안에 얇게 펼쳐진 책 한 권이 끼워진 미니멀 일러스트", "date": "2026-10-29", "scope": "글로벌", "entity": "OpenEvidence, NYU Langone Health", "what_changed": "NYU랭곤헬스와 오픈에비던스가 10월 29일 협력을 발표했습니다. 오픈에비던스는 NYU랭곤의 에픽 전자의무기록 안에 ‘Patient Aware Clinical Intelligence’라는 이름으로 들어갑니다. 의료진은 차트 안에서 자연어로 임상 질문을 하고, 동료심사 문헌에 근거하면서 해당 환자 정보를 반영한 답변을 받습니다. 적용 범위는 병원, 외래 네트워크, Family Health Centers, 의대 수련의까지입니다. NYU랭곤의 규모는 의사·교수 6,000명 이상, 전공의·펠로 2,000명 이상, 연 외래 1,240만 건, 응급실 방문 42만1,000건 이상입니다.", "why_matters": "독립 앱으로 쓰이던 임상 근거 검색 AI가 EHR 안으로 들어와 환자 데이터와 결합하는 단계로 넘어갔습니다. 10월 13일 존스홉킨스 협력에 이은 대형 학술의료기관 도입 사례로, 임상 의사결정지원 시장에서 EHR 안 자리를 차지하려는 경쟁이 본격화됐음을 보여줍니다.", "strategy": "국내 임상 LLM·근거검색 기업도 독립 서비스에 머물지 말고 병원 EMR 안에 넣는 연동과 환자 맥락 결합을 우선 과제로 삼아야 합니다. 대형 수련병원을 첫 거점으로 삼는 진입 방식도 참고할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://nyulangone.org/news/openevidence-and-nyu-langone-health-partner-bring-patient-aware-intelligence-12-million-visits-new-york-city", "verified": "NYU랭곤 보도자료 원문을 직접 확인했습니다."}], "verification_note": "계약 금액 등 재무 조건과 단계별 도입 일정은 공개되지 않았습니다. 존스홉킨스 협력(10월 13일)은 검색 결과 스니펫으로만 확인했습니다.", "image_concept": "A slim open book tucked inside a patient's paper chart folder.", "img": "data:image/webp;base64,UklGRqA5AABXRUJQVlA4IJQ5AAAQoQGdASqwBCADPpFInUwlp6m6ofRpY1ASCWluUHpcvyq8Dv8/jjs4PhYMLvp51w///6X/3AC30U6fdTxj+z/d9Ry7zxPHI27OlX4KP6Pzs9JGvmwfV+wzSIEHepH/qQP5fW/vP0L/MP9///diKsz0Ef+PdF8MXzbbRHd/yf/jPoU+lD/9+u/V9BP36i0raEouz6p08DX18H6Jef+Fya1lF8mtRdn1A+f6LW6c94xsauNEMa3n/hfxQcR7X9ZgS4CW876XJ3LAf0j9ZzDibnqVg+Lhp3wGPL41xJcmg/kilwk255Jof4FDWRk1qJN3hpvd86wsLiQtVxEiwf+n9jezHUEywLblTXWL8Wy+BeFyPhMG2Xt9Lc15//hwzJHJr9QSk4SmGs+XaGxFv+EQSSB8EvO2da630aUZ+co550RHo3Jy42xa03vPnwY20whnK5XrrhgT7484coeL7+WugUi1LqK9ASh96ANdeWBHX5T3EXv61qY3AcIHEP+F6Eou0b1bAXPQ31JIScq86eFMS9pEOFFkIJhCS4SUnIxit3VppVp06R1/KSH+dr9+8YLO3NejjSToku7TPoKL5Rs+KyEM5rsS6MzKaKrwf+FyaBLWmpBMEoHJK5H/6ISlRVAA4RR8P1YsCV1pCj3zu/zHvMQDwIPtaoRTF/gNoeV91G/kX1NoW4XZ9gzA 8loWXddsmsC/dtXMhAsdYHoztFK+a8KzzwYS6YjhvqLj/YhnfDQL6t1gWEqJ5C1fARDb0i+VhMkWjTzQIA8Nct/t09pyiDqwtrjbkAAA=="}, {"id": "dh-kipu-agentic-ai", "cat": "dh", "title": "키푸 헬스, 행동건강 AI 에이전트 정식 출시… 이용심사 에이전트가 계속입원 심사 2만3,000건 작성, 6,000개 시설에 공급", "short": "키푸 행동건강 AI에이전트", "alt": "지칠 줄 모르는 태엽 인형 사무원이 탭이 붙은 서류철을 쌓고 옆에 고무도장이 기다리는 미니멀 일러스트", "date": "2026-10-29", "scope": "글로벌", "entity": "Kipu Health(키푸 헬스)", "what_changed": "행동건강(중독·정신건강 치료시설) EHR 기업 키푸 헬스가 자사 플랫폼 키푸 헬릭스(Kipu Helix) 기반 에이전틱 AI 기능을 정식 출시했습니다. 첫 기능인 이용심사(Utilization Review) 에이전트는 심사 마감일을 알리고, 출처를 단 차트 요약을 만들고, 페이어 제출 전에 빠진 임상 기록을 찾아내고, 의학적 필요성 서식 초안을 작성합니다. 지금까지 계속입원 심사 2만3,000건을 준비했고, 모든 페이어 제출은 임상의가 검토·승인해야 합니다. 회사는 2조 단어가 넘는 임상 데이터를 바탕으로 했다고 밝혔습니다.", "why_matters": "앰비언트·생성형 AI가 기록 작성에서 페이어 대응 업무(이용심사, 사전승인)로 넓어지고 있습니다. 행동건강 분야는 계속입원 심사 때문에 삭감과 승인일수 손실이 잦은데, 이 업무를 에이전트가 맡으면 병원 수익에 바로 영향을 줍니다.", "strategy": "키푸는 6,000개 시설, 사용자 15만 명, 진료 에피소드 500만 건이라는 설치 기반에서 지난 2년간 AI 보조 임상노트 300만 건 이상을 만들었다고 밝혔습니다. 이번 출시는 문서 AI에서 에이전트형 업무 자동화로 넘어가 EHR 락인을 강화하려는 전략입니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.prnewswire.com/news-releases/kipu-health-launches-agentic-ai-powered-by-2-trillion-words-of-clinical-data-extending-its-lead-as-behavioral-healths-most-widely-adopted-ai-platform-302923822.html", "verified": "PR Newswire 보도자료 원문을 직접 확인했습니다."}], "verification_note": "심사 2만3,000건, 2조 단어, 문서 작성 시간 60% 절감, 매출채권 회수일 50% 단축 등 수치는 모두 회사 주장이며 독립 검증이나 동료심사 연구는 확인하지 못했습니다.", "image_concept": "A tireless brass clockwork clerk stacking neatly tabbed folders beside a waiting rubber stamp.", "img": "data:image/webp;base64,UklGRhRWAABXRUJQVlA4IAhWAADwKAKdASqwBCADPpFIoEylpCMlofSIsLASCWdu+/O7ezhr69toOMC2OsT/ZYN9x/RkqRcZ4oetfq4kf5f8m4/X93xc+U/63oD+999b/u+sj+u+jj6FvTd5rvOz84Xfmeid9bL/T+s/p4/b30deb+Peu4xb/E+C20kdA9QjE/uWd3/5foQe+X4j0OPqPOn+W/2nsBeeH/Y8RCgP/Q/9J6wn+x5b/ssLXFw9YVfqTw5LZjCVYqLuLh6wrX5sKNWzIPWFa/IEgD9rPY35b2w1zwB/UBKMs5m7UjZkDHJa+hlUXbMhAR6BiRRN48vdPeUMclre1vtcIogg4waHJ8MpdGgGPHWbTy2HykBpld9XpUgJE9lAyZhg1CBW url": "https://www.newswire.co.kr/newsRead.php?no=1045837", "verified": "뉴스와이어 배포 보도자료 원문을 직접 확인했습니다."}, {"url": "https://rapportian.com/news/articleView.html?idxno=241759", "verified": "라포르시안 기사 원문을 직접 확인했습니다(10월 29일 입력)."}, {"url": "https://www.inthenews.co.kr/news/article.html?no=93710", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "아직 열리지 않은 전시를 예고한 것으로, 계약이나 도입 성과는 아닙니다. 씨어스는 제외 목록의 카자흐스탄·베트남 사안과 별개로 이번 전시 참여사 중 하나로만 언급했습니다. 의료 AI 분야와 디지털 헬스 분야 조사에서 함께 나온 사안이라 하나로 합쳤습니다.", "image_concept": "A single hospital bed assembled from many differently colored puzzle pieces fitting together seamlessly.", "img": "data:image/webp;base64,UklGRpqLAABXRUJQVlA4II6LAACQoAKdASqwBCADPpFIoUulpKMspDQ4sZASCWVu3JPX3wa7fvkMsPzD7aJjUGqIFHOC97Ul7RO7K79sh0qrD7yV5/Hm1z5vKQOZlfi32b/I/w/pt8d9s/yT7v50/H/3n/weeh7J3rf9X+0nus/Rn7MfAV/bf8Z55nrT/tX/p9S39S/6/rIf+n1v/5T1Mf9F1NH+d9SHplv7Jv//TDxM/LOxnVrYX/h+xlnN/w/AH5lah3t/0EOVXg+7L/vfQI9jPrP7N+v5+V5uf2/qBf4r0s8DP8z/4vYJ/mP+b9JbSK9mewt/Qv38/dbuzelOLPZtnHc47nHc47nHc77bZgDucdzjyrmAO5x3OPKuYA7nHdhtbZgDQCbCZyF7C5tyYo3VcbYb2SqsSJe8CMM0Xs2cdhfGO9Y+pJtTR2FmPNA9bac1nDucdzjsBKztkZYuDOO5x3N1QO5x3rHc47nGgBzJLo9WSE1nwTsK1U9DVaNzcHITNwchM2zAJPbOrZjupMDupMDvZJ7hrc0bm2YA8Rc5T240E2FgowCoWjc202JJaNzbMAd2pAAbCgfMI62zAHc47nHdBgYs7nHesdzjubqtMYUtG54cx3fsKbjRubVnNig7tmGmCZyx3OVC0bm1Zhy6pL2cdyNvtmKaznC9DVZU9QW5Sa9NswB3OO5xopgXsKHiHEAOTjbOO5x3OO5x3OZEjEQfXo1G6aD4/8o9sPbMAdhV+dUOtWKOtmASfPpCaNzUdbMAf2x3Ij1QJYLYX8ZINCeO5ugwwB3OO79hDammfsI0TUbm1eK8gkALFyP6wqd957bOPp3VAz6y9YTGIt2VH35jRNRsVQylFWLFgsXWWblqoRxRHcjCfxNh1bMdzjxSGCnWl181mO5x3ORIbOM+qxsvT6z2TffjU4xZ0cZgLiqxNUhdfy7ERTccYCcHhQ9tUfx2FCvIH3rgVaX8zol3I0TUbm2X/WG+doINzbMB9ufN+kWus2tswB3Nq9VWtFIYlbN/sMyXdXFnj/AVJw3oQ/q2tosvcwMjJI3P6UlpkBnUGX49sdwQw2kkY1W5b08VcBvJDVm38ovFePqgjwGo2A2NhGibUFth7ZgDyrmAPW3bO5x3PgJdPFbkwQKiubXf+UWsOHyym5XNO9NN6vLOouLdTKDNxtTcqdSMv9HPyzsRTz4Lb9yTAZ040s7l7wptlQX+At8PE9CyS47nHc4+xZ3IgQ7HL1mAO9Y0NIbm2YA7kGQ+KyORUfOR1hntFUzHPagMCOzVgjgdbsgLxFL31hIzr4o05soKPJQPsm3oAxLT2Ts6lB8I6BhQm 닥, 플랫폼을 AI 에이전트에 개방… 7월 이후 에이전트 트래픽 약 30배, 의료진 20만 명 예약 MCP로 연결", "short": "줌닥 AI 에이전트 개방", "alt": "작은 놋쇠 열쇠 하나가 무거운 진료실 문을 받쳐 열어 둔 미니멀 일러스트", "date": "2026-10-28", "scope": "글로벌", "entity": "Zocdoc(줌닥), Instinct(인스팅트)", "what_changed": "미국 병원 예약 플랫폼 줌닥이 자사 인프라를 외부 AI 에이전트에 공식 개방했습니다. 등록한 에이전트는 MCP 서버, REST API, llms.txt 안내, 딥링크로 접속해 의료진 검색, 보험 확인, 확정 예약까지 할 수 있습니다. 첫 파트너로 AI 에이전트 인스팅트가 줌닥 MCP에 직접 접근하게 됐습니다. 줌닥은 9월 초부터 에이전트 트래픽이 약 10일마다 두 배로 늘었고, 7월 이후로는 약 30배 늘었다고 밝혔습니다. 에이전트는 신원을 밝히고 등록해야 하며, 예약 전에 환자의 명시적 동의를 받아야 합니다.", "why_matters": "환자의 진료 접근 경로가 검색창과 앱에서 AI 에이전트로 옮겨가고 있다는 신호입니다. 줌닥은 검증된 의료진 20만 명 이상, 보험 플랜 1만 개 이상, 스케줄링 연동 175개 이상을 보유하고 있어, 이 데이터를 에이전트 표준(MCP)으로 열면 예약 인프라 사업자로 자리를 잡게 됩니다.", "strategy": "다른 플랫폼이 에이전트 접근을 막는 상황에서 줌닥은 등록, 동의, 데이터 보호 원칙을 조건으로 내걸고 문을 열어 에이전트 생태계의 관문을 선점하려 합니다. 인스팅트는 줌닥의 케어 액세스 네트워크에 합류했고, 이 네트워크에는 이미 구글 제미나이, 아마존 헬스 AI, 옐프, 블루실드 오브 캘리포니아 등이 들어와 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/as-others-put-up-walls-zocdoc-opens-its-doors-and-welcomes-ai-agents-to-reliably-connect-patients-to-care-302921530.html", "verified": "PR Newswire 보도자료 원문을 직접 확인했습니다."}], "verification_note": "트래픽 증가율(약 30배), 의료진·보험 플랜 수, 진료 접근 속도 설명은 모두 회사 주장이며 외부 검증은 없습니다. 거래 금액은 공개되지 않았습니다.", "image_concept": "A heavy clinic door propped open by a small brass key that fits many different locks.", "img": "data:image/webp;base64,UklGRmQnAABXRUJQVlA4IFgnAABwdAGdASqwBCADPpFIn0ylo6aloJOY2NASCWlu2BhLefxzqQZ7ANz7vKkKYD7v1/Aq2wb76PI12sRDHIxbat45++v6d/LK9O3qW50zddZ3l/ZuTd3/47a/8KeARil3LOqeGR9p9B+an+B/jNdP+4eXf0ddMcqEawMpqqUB6CrTVUoD0FWmqpQHoKtNVSgPQVaaqlAegq01THKy+nXi/nLgZr41D26qUB1+Je2La60wvLis85q/V5Y5sPQVaYPksKFl16rTVT918UqBsOxdmCOHfxxc+N4gSgV2sDKavjihZsPQISPt5PqhWENc2TilQNhKLq0zHjntFRrBlT67D0FWmqpQHoKs9usZrNX6vKglOw9BVS/01aia1ibDsXZgoWphgzeEq+IDa/I4MrAymqpQHoNU2qpJJg+SsNHa69dmncz9mOC9DrTYegqpc62TACjshGs/edE1VKOR2sDa+KVA1hlQjTMMlY9VGM0CdaTtdUzJA08vA4IN73AClZlCBCaqlAk4aEYBuKw4a18Up/Gt/MpgfTV8Ujic/U5QNoRtf7jgdYt323/n0 tobacco-465-toxicity-disclosure", "cat": "reg", "title": "정부, 국내 판매 담배 465개 제품 유해성분 검사결과 최초 공개… 궐련 256·궐련형 104·액상형 105개에서 46종 분석, 전 제품서 IARC 1군 발암물질 확인", "short": "담배 465개 유해성분 공개", "alt": "밝은 검사등 아래 실험용 시험관 안에 담배 한 개비가 놓인 미니멀 일러스트", "date": "2026-10-29", "scope": "국내", "entity": "보건복지부·식품의약품안전처 등 정부합동(담배유해성관리정책위원회)", "what_changed": "2025년 11월 시행된 「담배의 유해성 관리에 관한 법률」에 따라, 정부가 20개 제조·수입판매업체의 465개 제품에 대한 유해성분 검사 결과를 처음으로 공개했습니다. 궐련과 궐련형 전자담배는 각 44종, 액상형은 20종(중복 제외 46종)을 분석했습니다. 모든 제품에서 니코틴, 포름알데히드 등 IARC 1군 발암물질이 확인됐습니다. 궐련 개비당 타르는 11.7~40.4mg, 궐련형 전자담배는 10.3~32.0mg이었습니다. 액상형은 105개 중 99개에서 포름알데히드가 검출됐습니다. 측정에는 WHO가 권고하는 강화포집법을 적용했습니다.", "why_matters": "정부는 일부 성분이 적게 검출됐다는 사실만으로 ‘덜 해로운 담배’로 볼 수 없다고 못 박았습니다. 검사 결과를 발췌·비교해 저위해를 암시하는 광고는 표시광고법 위반 소지가 있다며 모니터링하겠다고 밝혔습니다. 궐련형·액상형 전자담배의 ‘위해 저감’ 마케팅에 직접 제약이 걸린 셈입니다.", "strategy": "담배·니코틴 제품 기업은 마케팅 문구를 다시 점검해야 합니다. 2027년 합성니코틴 담배 검사·공개, 액상형 배출물 시험법 개발, 멘톨 첨가제 관리방안 검토가 예고돼 있어 후속 규제 일정에 대비해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1492357&tag=&nPage=1", "verified": "보건복지부 보도자료 원문을 직접 확인했습니다."}, {"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50450", "verified": "식약처 게시물의 제목·등록일만 확인했습니다(본문은 첨부파일이라 열람하지 못했습니다)."}], "verification_note": "수치는 복지부 보도자료 본문의 표를 기준으로 했습니다. 정부는 담배 유형별 수치를 직접 비교해 건강위험을 판단하는 것은 적절하지 않다고 명시했습니다.", "image_concept": "A single cigarette resting inside a laboratory test tube under a bright inspection lamp.", "img": "data:image/webp;base64,UklGRlofAABXRUJQVlA4IE4fAABwQAGdASqwBCADPpFEn00loyaxIFQIQiASCWlu+/YWeVf9eBQPpa1++XyzFT22kef95ROhL09xXXl+IPdnyiKsW0q+rfwT/7+qqbuSKq68b/EOZdgC/PPKTnALE0dHo/aT3rUDYjq1atWrVraqDXR8GjRo0aNGjRo0aNGjRo0beHTp06kgdM2eUOGWWWVGbyxQy/7dm3t+C/Nh3U2QYb+JozYUAqlQ5cuYHEwMaNYRz+niYK8Wz2Rgpl8ocPlVckJ/UEFztERiCUFBxIcG3wK6dRSNXvW48RGYbMwAAZOspnzGARQFpl4GYBos60IGqmSPSULXPi037Rb4MMnBBCAABpOZr7hyFAU2DOV0fBqk5vg0gk+URTSyWfMyR6gEp07wC/+xYSXVacfgQb4NF9tGNGsTfRZbipX3WVHiBAqcB+q3AJTpv9QwlhxXrErVOQeH+xfedV4EOeo q9qalgBIMIG51RwXi++FbUQCZvEqvyE1X/gXnkxXS5YsJAtHDtk7mNAAAAAABrLKzCZ4Jb9bgAN8AAG+HFt20KD8U7GTELc9fdBUurNw0yrtACBaOY8RX53iJClplkhaOLh7jOhymbmwAlG88L6QuaN4sAmYrY067ZyuAbf/A6M0wGYfBMTcHjrj0HEaAAAAA="}, {"id": "reg-hhs-peptide-compounding", "cat": "reg", "title": "미 HHS, 미승인 펩타이드 6종 조제 단속 유예 임시정책 발표… BPC-157·TB-500 등, FDA 과학자 반대에도 503A 약국 조제 허용", "short": "미 펩타이드 조제 단속 유예", "alt": "약국 카운터 위 라벨 없는 작은 유리 바이알 옆에 열린 자물쇠가 놓인 미니멀 일러스트", "date": "2026-10-28", "scope": "글로벌", "entity": "미국 보건복지부(HHS)·식품의약국(FDA)", "what_changed": "HHS가 BPC-157, 에피탈론, KPV, MOTS-c, 세막스, TB-500 등 미승인 펩타이드 원료 6종에 대한 단속 유예(enforcement discretion) 임시정책을 10월 28일 연방관보에 제출했습니다. FDA가 503A 원료 목록 규칙 제정을 진행하는 동안, 주 면허 약국·연방 시설·면허 의사가 이 펩타이드들을 조제해도 단속하지 않겠다는 내용입니다. 관보 게재는 10월 30일이며, 의견은 게재 후 2주 안에 받습니다. HHS는 이 조치가 FDA 승인을 뜻하지 않는다고 밝혔습니다.", "why_matters": "7월 약국조제자문위원회가 6종의 조제 허용을 권고했지만 FDA 내부 과학자들은 안전성·유효성 근거가 부족하다며 반대했습니다. 이번 조치는 그 반대를 넘어선 정치적 결정이라는 점에서 FDA 과학 심사의 독립성 논란을 키울 수 있습니다. 원료 공급과 조제 시장도 단기간에 커질 수 있습니다.", "strategy": "펩타이드 원료(API) 공급사와 미국 조제약국 관련 기업은 정책 조건(FDA 등록 시설에서 생산한 원료 사용 등)에 맞추는 것과 향후 정식 규칙 제정의 방향을 함께 살펴야 합니다. 2주 의견수렴 기간도 활용할 수 있습니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.ajmc.com/view/5-things-to-know-about-hhs-s-interim-peptide-compounding-policy", "verified": "AJMC 기사 원문을 직접 확인했습니다."}, {"url": "https://www.cnn.com/2026/10/28/health/fda-peptide-access", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}, {"url": "https://www.usnews.com/news/us/articles/2026-10-28/us-health-department-to-allow-temporary-sale-of-some-unapproved-peptides", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "HHS 보도자료와 연방관보 원문은 접근이 차단돼(403) 확인하지 못했고, 언론 보도를 기준으로 작성했습니다. 약국이 지켜야 할 세부 조건의 개수는 검색 요약에만 나와 있어 본문에 넣지 않았습니다.", "image_concept": "A small unlabeled glass vial sitting on a pharmacy counter beside an open, unlocked padlock.", "img": "data:image/webp;base64,UklGRthBAABXRUJQVlA4IMxBAAAwrgGdASqwBCADPpFGn0yloy2oIRD5GbASCWlLEqv+Sf/OfL8k/+c2jif2+ZkkMZw9Nv+xy/+H/FPuFd7UPanZAldDG78Lwrj7O y": "릴리는 비만약에서 번 현금으로 아타이베클리(AtaiBeckley)·큐레보(Curevo) 인수 등 외부 자산을 사들이고 있습니다. EPS 전망을 낮추는 것을 감수하고 파이프라인 다각화를 앞세우는 전략입니다. 분기 말 이후 완료된 메리다 바이오사이언스 인수 비용은 3분기에 반영되지 않았습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0000059478/000005947826000104/q326lillysalesandearningsp.htm", "verified": "SEC 8-K 첨부 보도자료 원문을 직접 확인했습니다."}, {"url": "https://www.cnbc.com/2026/10/29/eli-lilly-lly-earnings-q3-2026.html", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람)."}], "verification_note": "매출, 제품별 매출, EPS, 가이던스, IPR&D 비용은 SEC 공시 원문으로 확인했습니다. 릴리 IR 페이지는 접속이 차단(403)돼 열지 못했습니다.", "image_concept": "A large glass jar overflowing with coins while a few coins spill out through a small crack at its base.", "img": "data:image/webp;base64,UklGRuRFAABXRUJQVlA4INhFAAAw4AGdASqwBCADPpFIoUylpCclodKIcOASCWlu8mP6S9jtfpmNEHsdjv/R/B1T81/Ic6Ps9Qm7MfpfKo+F75n/i9a39T6Tfpy577zu9+23rb++5PHLka7+T/a+BW8P4IdXXgf9CZkO4M2j/e+hZ78fiPR0/I88v631Bv8H6Z+C7NH9IT/j8xw1sUJy4vM+3M+3M+3M+3M+3M+3M+3M+3M+3M+3M+3M+3hnmjlRFDRVp08jIw4i6Bif6fyp9ZOP9uTucuLzbbc5TzhuZKPOkUQAk6utwkkzYtxsDvWX2YL5iG2HnOftFps965a8ZbyYk1sWyYNsPsnEVAU8McFHnu0WetFCb+Ozbn2bm8mAaF4oDdlObl7f8aQvX9f5Y3rNh+0J27q3wYy9bgvlPLLxlvJihRjG3yebhbvbXPJsVCct2J3Twtc9weeDgXIgAp9f5sJR5y5FoQHkR2LzjYFLTj/YCN1ukFmftaw6EfdJ1RLiZhxzZ5/86VahOrVNny2cLxnUh/NGkiPuPgOqt2iCMV4eKcum3Be3jOmnheMXtSL/PbO8KQkXrcJbsXmfmACn25lzpR8hbsTunyhctkkz7Xin1/moFCHH+3M+3NE8HJF4nF8tD+Kx2NagKfbSRs9UQ1SRhxF7atj1x/YJ00TQzCU9y1AU9bHxP9ktyHT+OCc5+y8259bf+hY3qeWWuP5m54IUxHYvM9cORc+wUHic7xN81uxdNEwO5c0vv0EMca0fT0LGZzjxn///OCsi+fWgyUo85bsTxLFPHpvBXTEdif7JbvlpHM6aF2jptxUyxF7eMruY1I+phza/sFKQRZNmMJzvndVZnP973Hti6TLk1ynnC8YqZHxe3jFeAtuEt2MxqmCU3Jy4vWFPtzPtzK8Gn/yDqyb//3/19WXpyivomYD9uwpJwltsBeXYFNzB1A5wUXzTrGtygvqLSAiiWBPeLt4Z2Tza0V6wpc6UJwIG7IgAp9uTvaYzCenRFPuOp5QvZ3qJQyB/kzREak/xR0CjsnX/8Ldjc6GkPUsPG9hxjHkZ8rw4oswq2vHbW0gOWfCVYVoFNF2lzZCxiU8pT3H6PE31Iy4vNHwKfbmfdiGUC4vM+2mikQkrNr1z0/lOQ4TBGglKgwgYP/LFpHBn5fy2cHddudLf7dwbHS+h1O5kX4u1hGTdcAao9wxGNsCtwvg3lVsridBy0ZUCRQcJ3rJpw2Hc nces-Third-Quarter-2026-Financial-Results-Highlights-Multiple-Milestones-Advancing-Broad-Diverse-Pipeline", "verified": "검색 결과 스니펫만 확인했습니다(본문 미열람). 키트루다 관련 구매 시점 효과 2억달러는 이 스니펫에 근거합니다."}], "verification_note": "매출, 제품별 매출, EPS, 가이던스, 사이브런치 라이선스 비용은 공식 보도자료로 확인했습니다. 사이브런치 계약의 선급금과 총액은 확인하지 못했습니다.", "image_concept": "A sturdy old oak tree with a young sapling growing beside its roots.", "img": "data:image/webp;base64,UklGRhZCAABXRUJQVlA4IApCAAAw9wGdASqwBCADPpFIokwlpKOiolMYgLASCWlu7x1v7fxw3UzMX4uAPnLbU9jThSySq1cf1r1/9KDS17We/exS46w2H7B/4vps7Pf0vGAwCPzD+l/77hFQCfof+H8z78nz1/ifUB88vAQoD+Tf/yeWzUNC/FJMCJbjNiaUIydyZBvUoSoES2F8HRcZ6wRuGA7wjEOklUhxEX8gRavnOjIFg/21JHY5Iv3hVlvqIJuw6kMyLwtKgMBPB+5bpXsOH8fPZEpslgA1J1wgx1C6GkpsYJgJVGdaZDqWsYs+zaaSQ3x5boaqcU6k6rynPvyYq61mOm0qzhs7cG3IdJZcpfzvCs7iYkJECkH+LLAKJqOAf2HNZuWd1P+MSkk6oyaoKqtrzFSRizYqSvGnzSRjzGDlTmcY/0xY4FE7SMeMetEO/k8hH04ddDqJZ06HwXLhoVvue8+BAe6G4SgZuauR/PacNwwHuPl74lE+KqVagPGzu0AqarHg4Z+5bqWn1bvfUjY/LlS/BbLVu3SjjCSMeFZEnafxjNZxaPLdEfQi+DcRf5+FfT/mKWcWsT3h1w5+7nwhL2BFelDbDwwOTx/nI76tGjqZ8TrGQmnLc32YIf5oSsWqVc+DE6PUssk474Z9pC3//dMhZgoOSLj+w0Hoq/FvZYpmkiuSVn1Z0fnjZigAopssXv8t0CkWlSmy/R9/wKaBK2wyOX5FxXd8IIX1GkKEaSgu4FfdeG65mdP9LVGPkMOfMQ2ABLnqk+mo0x5Z5Kw5W/uI0lBc9LabPd0kpoWr0chBeFhsZfjiZ8BCNJuev+LnH+oVoFbmwd2zy5C23lH/UmzwPm/JIyJ/cWazki4/9sM0lElvvocaHFXaWbJtXo3gRpk9DNZUNDBBwjh7vZsd4zKIDl+2Cx8EBwxYgkbJcqdlZvIzgfq3x9Dwq+AP2oN7hQ2IgG8iZ0eNRLWMe08AxdHNzsd1EtKj0fRZS44Qdp21fGHavgx2B9kLdr1uH4Cm+xtweGXKDX1MNWsampHPKDIhgn9YWR2hRd5boR17MT2qqSk3zlkI9TivR9eQAr3fYiukTRAvO49IfTH6/iyn7t+lBJ1fumJvQqmiIGnAA1tcioHGRB/RIr5X2xKrv/fJrQu+sxZHCVlVff5wzPxB/y2pPRjHyF9q1dFYmSNG5A/K1tp9jN2em6Z73FUOzDkCZlBloO0rUsovNirXqhsRjf/h/+R+OMqPLtBYqUApl7Idl/Gkg5wiRq7f6gujudnc+orCKtptNK4zPLOadifH1P+00wxJLz45cJWnnfQt2VzPd/sec/hRo3p4/2TCs65RxYaaeI0jyvW/9ZL6gRLWWXEac2+osPGSUC/JBypIxG06sqotwLq229KU3c/7DsyzrCMVNrVkuG5LJrXSL9mEeqsBo3NhDQpVAFahqE9RpXkSS66pS3tGmKddK/j51KHoCJa4rJSAxJVOZMLTjzaC4/0re/7gWporC6pnvc8rPy5q6J4CSpksEjrByFWpUdOnJOyxwKjiayV/5XpE4YqGXTJEVsPPoK9RD3XWH pe": "공식 발표", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0000014272/000001427226000022/a2026q3ex991-filing.htm", "verified": "SEC 8-K 첨부 보도자료 원문을 직접 확인했습니다."}], "verification_note": "매출, 제품별 매출, EPS, IPR&D 비용, 이전·변경 가이던스는 SEC 공시 원문으로 확인했습니다. 엘리퀴스 25% 증가의 원인과 IPR&D 비용의 개별 계약 내역은 공시에서 ‘최근 라이선스 계약과 진행 중인 협업’으로만 설명돼 있어 확인하지 못했습니다.", "image_concept": "A balance scale tipping as a heavy new weight is placed on one side while an old weight slowly erodes on the other.", "img": "data:image/webp;base64,UklGRuA1AABXRUJQVlA4INQ1AAAQngGdASqwBCADPpFIoEylpCMloTK4eLASCWlu+tsp+xqk64ixrduVBjhonFJO5Vo//fl4EvfZWDz/rewH+87yvni/ThvatPwzOeWvsPlNonFsvs/+X2oR7T/1nASgF/Of7/5704/6+Ymvw3qAeMDop+sfYfB8XbdOD7Ao83RH3IE/OjGXbUe5tqPc21HubnoRWLX0Zdz0IP58ijVhqttG2m17Jdbj5F1OlgsZKtESe99ueUteSPrNviPZkx6n+tEZdtePQlkAQjieA6CGgUkvKZ+7nMj5tqPvFLCON/hFNrYhIgZ+4p4TRHCKzauUQyFJPhH1ss/Z6xTOwkevVrZx8tqHhzY/mxl24BiGRIsyghvUOJIZCklAkOVz5SR3wD9QcRrKm7c8VjZzdzu2oCw2EgErOPkgDZFS23c8p425okTHmxg0c6O5wG4/nJwwG+UmsJGStbIpLPys1xl8p/egiZwVzbUetA1nswD/nHJoTHgUsI9aKdjXAG0gn5yJL3om2jPFhMY1/hotLQNO25IFJ749lvu2fjFfgj2j1954XOGnHzQAyNnRIIa22LEHeByIbJ37A/PkhIwmOI+8brbXplXduy9zPLZF3EqiuDdE0DqHU9zSHflARUlRG17m0RRyRUVkMhRc8a23lsqhuKuLNakBg/4sI9zbPWkq1b4g/LRdyF6rvbaZ/JB0v/9dr1roj610TR/JuXUct5WuiRL6WgvHKwdEfmpca3j8BwFcg9vGHMWe3imlCGf6uzZM+8hKgUht0mwqC68kkMjP1XCv4CeFRn9uxqfR65dGHEfPZZbpCWF22q3AEIZCi7NcZfKwFJ7+eykkMhSSIcx9y0gOzoN/jr7vt1JfdJbKnrxhdqxDDJ+G1cfU6NuiabUck3hK4xDF3P27akFA1qU7wNZ7XvNI3RF87Z+IhgriVmdiV/5oFNhIaUTtZcfmaWyJZGMX/0vHFjGPKi7IMcoz1FoNjfSWwjvc3rMW7InXBq06/kYBjiPjjA2nMD84fzTiM7ISPSQ/7lstetdDGJPX48t3JwI3CqSpjMQwiPRNdK7XGwNtYejselS5QpqOOkmNDvyKRvpRIdDBcjt4rmx2hZBVESS98yK0yk/GwXamcawBQGNwUOhR+hmRj7uH+588baA9aIFVsm5HJY1JezvPXgpZ4EGy99vp0wZEZ6OcdZmwogOXP+v+o386C2nHsRkVHv8oJcgsapXxjI6H7U8etIOiXfZbbaCgBHfvd4hSrbQcI+tdEeoMf8VROObHTvhaBPPIBkEkRbfN9UvxD4G6y3awNQMDMMmrEc7LiLJgDyKfjZB67NM6C1zV+uQRFG8CRH300gkk0euO5JjtR941xcBpsapkx7U06oQfiiqhUdswFgiPkEYrNKfh3ZG/WKuI5i9o3iJhuk5RrMx0lF6YFmXS1yw0UEG/XXU3akDNeQXUnfI3sarb const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
