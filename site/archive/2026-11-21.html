:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}

026-10-20", "count": 30, "file": "https://bio.withsong.co.kr/archive/2026-10-20.html", "note": "웹에서 열립니다."}], "items": [{"id": "ai-neca-general-ai-roundtable", "cat": "ai", "alt": "빈 원형 나무 탁자 한가운데 저울 하나가 놓인 미니멀 일러스트", "title": "한국보건의료연구원, 11월 30일 ‘범용 AI 시대 의료기술: 가치평가부터 임상 적용까지’ 원탁회의 개최 예고… AI 의료기술 평가 범위 확대와 혁신비용 분담을 논의합니다", "short": "NECA 범용AI 원탁회의", "date": "2026-11-20", "scope": "국내", "entity": "한국보건의료연구원(NECA)", "what_changed": "한국보건의료연구원은 11월 30일 오후 1시 30분부터 5시 30분까지 서울 코엑스 아셈볼룸에서 2026년 제3차 원탁회의 ‘범용 AI 시대 의료기술: 가치평가부터 임상 적용까지’를 연다고 20일 알렸습니다. 회의는 범용 의료 AI의 국내 정책 현황과 쟁점을 살피고, 가치평가와 임상 적용을 잇는 근거 창출 방안을 논의합니다. 토론 주제로 AI 의료기술 평가 동향, 주체별 역할과 책임 및 평가 범위 확대, 혁신비용 분담, 국가 의료기술평가 허브로서 연구원의 역할을 제시했습니다. 참석은 무료이고 사전등록 없이 현장 참석도 가능합니다. 발표자와 토론자 명단은 기사에 나오지 않았습니다.", "why_matters": "뷰노 딥카스와 에이아이트릭스 바이탈케어의 신의료기술평가 결과가 이달 나올 것으로 예상되는 가운데, 평가 기관이 AI 평가 범위와 비용 분담을 공개적으로 논의한다는 점이 주목됩니다. 국내 의료 AI의 수가 진입 경로와 근거 요구 수준을 가늠할 수 있는 자리입니다.", "strategy": "신의료기술평가나 수가 진입을 준비하는 의료 AI 기업은 원탁회의에서 나오는 평가 범위·근거 기준 논의를 근거 생성 계획에 반영할 필요가 있습니다. 범용 AI를 다루는 기업은 단일 적응증 중심의 기존 평가 틀이 어떻게 바뀔지 주시하는 것이 좋습니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.medifonews.com/news/article.html?no=219030", "verified": "원문 직접 확인(메디포뉴스 11월 20일 등록 기사에서 주최, 일시·장소, 회의 제목, 토론 주제, 무료·현장 참석 여부를 확인)"}, {"url": "https://news.mtn.co.kr/article/2026111716335234175", "verified": "검색 결과 스니펫만 확인(본문 미열람; 딥카스·바이탈케어 신의료기술평가 결과가 11월 중 발표될 것이라는 업계 전망)"}], "verification_note": "연구원 공식 보도자료 원문은 찾지 못했고, 언론 기사로 일정과 의제를 확인했습니다. 딥카스·바이탈케어 평가 결과는 11월 21일 현재까지 발표가 확인되지 않았고, 이 회의와 두 제품 평가의 직접 관련성은 확인된 사실이 아닌 맥락 설명입니다.", "image_concept": "An empty round wooden table with a single balance scale placed at its center.", "img": "data:image/webp;base64,UklGRmI3AABXRUJQVlA4IFY3AACwzwGdASqwBCADPpFIoEylpCorIVMImWASCWlu3Pza3//D+//6qf7H69wbf+zxFsl5/7P+uy/6vU5/5eXxlZs41aR6KTzf/u0xLyMyZPXty2+nRuNf+n00EHrtyTfI/w3OW+N6b+dt1H+082znHz1f8D8O/gh+m/1f+AD+s9DzzC/t761v/C/Zn3H/1v/h+wN/aP9J1jfoJeXd7On9f/4vB/9NP3r71/N5UBq839Uin9uP794iMANwbma+FvM35ND6x0SY 전달에 그치던 소비자 예방검진 서비스가 전문의 예약·방문 채혈·보충제 구매까지 묶은 진료 연계형 멤버십으로 바뀌고 있습니다. 가족 단위 가입은 고객 획득 비용을 낮추고 가구 단위 건강 데이터를 확보하는 구조입니다.", "strategy": "국내 검진·건강관리 플랫폼도 검사 결과를 실제 진료 예약과 후속 관리로 이어 주는 연계 기능이 차별화 요소가 될 수 있습니다. 가족 요금제와 데이터 공유 동의 설계는 개인정보 규제 범위 안에서 벤치마킹할 만합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://hitconsultant.net/2026/11/20/function-adds-membership-benefits-action-plans-specialist-referrals-supplements-family-plans/", "verified": "원문 직접 확인(2026-11-20 게재일, 액션 플랜·전문의 예약·SuppCo 연동·Getlabs 149달러·가족 요금제 340달러/표준 365달러, 임원 발언 확인)"}], "verification_note": "펑션헬스 자체 보도자료 원문은 찾지 못해 업계 매체 HIT Consultant 기사만으로 확인했습니다. 회원 수나 이용 성과 수치는 공개되지 않았습니다.", "image_concept": "A single family-sized lunchbox with several compartments, each holding a tiny blood vial, symbolizing shared preventive health plans.", "img": "data:image/webp;base64,UklGRoAcAABXRUJQVlA4IHQcAABQVQGdASqwBCADPpFIok0lpC60IRH4MoASCWlu4WufA/EIhCWXXM1WLlch0H/U583y37N7D2EZ3jmd+6/w/nP/6XrU28fmZ/cT1mP+f61P7N6WfU5f231D/2k9ab1of85k9UyTucxL/a93fcDAi9vBtnhPZ1+IWo3nmfH2HfXie9JAgQIECBAgQIECBAgQIECBAgQIECBAgQIECBAgQHyxZ4z+je81OGy1G+66MNN1aqKNzaTAWpApb3+J86J70kCBAUCdOnTp06dOnQ876X2GCdNp+JA0fXxN+T68bwuNKz0kCBAgKBOnTp06Hm+T6+J0RpKprMgFWf1sZfKcr86dOnTZpL5saBAgQHy2qDo0fXxOkSCvyFlbrIblyt9veaniAZgLUgvxOfH+fnTp06dOooDWgE18paJS34LW6fmxoECBAgQID48/E6J70kB8sR2nK/RO0BNTNjfidE6xu586NJyqZ4nv2gwq/E6/E6J70kB8tqkwFpzQTp02ohEL9NCQzqj/Om0/exxNEUX9m2qTAWpBfidE96SBAUCdOoVGMsbkqmeI0P4/RjQIEBP6fidE96SAn9PxOie9JAgQICgTstpeHlLF5QdGk5X502mpsmMgQIECBAgQIECBAgQIECBAUCGR9iJ7xVMgfgvxOidZX502aXU4bLUgvxHv8F+J0T3pIECBAgRu1vxOidZX4eeJ1lfh4RJjfidE9o2nsA0nK/OnToed9HJ4m/E6+N1vNTly5W/BfidE96SBAgJ9LODAWnNBOnTp06dNp+J0USaEyVvLy2IFybGgQICfzS6nLly0Hjb3mpy5cuXLly5W/ApMyyi4wLUb3eZZV5qcrfgvxIGk5VMkfa/OnTp06dDzxUTjQIECAm4NXwCW9Z1W64j3+C/E35Tlfm0/E6M/o3u8y1IL8TojWHGfLYnptxtts4bmUGh+mT4igo1BBLwsbp9slwPFlovjVLnQiEIa668lhZStzN6bkiRMo2+2j37hig6mtGUrRT0GcM7TPqrxGh9VeJ70igTps0upy5cuXC82MoE6EDAKY16sLVrE67jUsz/t1YKepLFUYks5/AQwL+ODz0/5dpdMWyI3qMKBQEvujSzfuYxvoZSa34LWwALU 026-11-20", "scope": "국내", "entity": "보건복지부, 국민건강보험공단, 건강보험정책심의위원회, 큐로셀, 한국화이자제약", "what_changed": "보건복지부가 ‘요양급여의 적용기준 및 방법에 관한 세부사항’ 일부개정안을 내고 12월 1일부터 신규 등재 약제와 급여 확대 기준을 적용한다고 밝혔습니다. 큐로셀의 CD19 표적 CAR-T 치료제 림카토(안발캅타젠오토류셀)는 건보공단 약가 협상을 마치고 건정심에 상정됐으며, 1회 투여 상한금액은 2억8001만6050원으로 킴리아(3억6003만9359원)보다 22.2% 낮게 정해졌습니다. 림카토는 2차 이상 전신치료 후 재발·불응한 성인 DLBCL·PMBCL 환자가 대상이며, 고가약 성과관리 대상으로 투여 후 1년간 6개월·12개월 시점에 반응과 부작용을 평가합니다. 4월 29일 국산 42호 신약으로 허가된 뒤 허가·평가·협상 병행 시범사업으로 약 7개월 만에 급여에 진입했습니다. 같은 개정에서 화이자 혈우병 치료제 하임파지(마스타시맙)는 12세 이상·35kg 이상 억제인자 없는 중증 A·B형 환자에게 급여되며, 첫 투여는 병원에서 해야 합니다. 빔젤릭스 오토인젝터의 건선성 관절염·강직성 척추염 급여 기준, 아뎀파스의 만성 혈전색전성 폐고혈압 확대, 리툭시맙의 NMOSD 선행요법 요건 삭제와 결합조직질환 연관 간질성폐질환·IgG4 연관 질환 허가 초과 급여도 들어갔습니다.", "why_matters": "국산 CAR-T가 처음으로 건보 급여권에 들어오며, 다국적 제품보다 낮은 가격이 공개됐습니다. 허가·평가·협상 병행 시범사업이 고가 세포치료제의 급여 진입 기간을 실제로 줄인 사례입니다.", "strategy": "고가 세포·유전자치료제를 개발하는 국내 기업은 병행 시범사업과 성과관리형 등재를 기본 진입 경로로 놓고, 6·12개월 반응 데이터 수집 체계를 미리 갖춰야 합니다. 경쟁 CAR-T 보유사는 공개된 상한금액 차이가 병원 처방 선택과 재평가 협상에 미칠 영향을 점검해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.dailypharm.com/user/news/344835", "verified": "원문 직접 확인(11월 20일 기사, 12월 1일 시행 급여기준 개정 내용과 림카토·하임파지·빔젤릭스·아뎀파스·리툭시맙 기준 확인)"}, {"url": "https://www.yakup.com/news/index.html?mode=view&cat=12&nid=335525", "verified": "원문 직접 확인(림카토 상한금액 2억8001만6050원, 킴리아 대비 22.2% 낮음, 건정심 상정, 12월 1일 적용 확인)"}], "verification_note": "복지부 원문 고시·건정심 회의자료는 열람하지 못했고 전문지 두 곳 기사로 교차 확인했습니다. 위험분담 계약 여부는 기사에 나오지 않습니다.", "image_concept": "A single glowing living cell resting on a polished balance scale pan opposite a stack of coins.", "img": "data:image/webp;base64,UklGRtQnAABXRUJQVlA4IMgnAABwtQGdASqwBCADPpFIoEwrq6ooItMYQXASCWlu+D27k1z1Bef7+LXLoomsqNFRJjB+J/+8mvpr1v6d9xzzwfn0Q+5QfknqDFgBejwW/KOXzuptT8M7Rfw1/0Oj3w8DyPhiENVUXPwHgB0umPwGvLyNZqBsPq8p7w87joEYcHEBsO0pj6p8ULNPf9crxMevLSjPFmd29DCg5p00phFMlucKYS8VpU2Har8LfP0Ic/UFsTnZzC6Ty6TPzKE+oEEQzYdpPLpM5DhpvBJfSgLpxJ63YQtNqcIYAiZ5dQEOZEJ3lYuGL1hJZhXiRzzM5nb9AWBvQemP21uiBqGxy80EkD4oWbDwROuk8uk8ukzkO3NSgql1U+FnHtJ5 항도 포함됐습니다.", "why_matters": "3,500만 명 넘는 가입자의 MA 시장에서 품질보너스 지급 기준과 위험조정 방식이 바뀌어 보험사 수익 구조에 직접 영향을 줍니다. 파트B 협상약 가격이 MA로 넘어오면서 제약사의 MA 경로 매출에도 가격 인하 효과가 커집니다.", "strategy": "파트B 협상 대상 약을 가진 제약사는 MA 경로 매출에 MFP가 적용될 때의 영향과 청구 자료 흐름을 다시 계산해야 합니다. MA 보험사와 협력하는 헬스케어 기업은 줄어든 15개 별점 지표에 맞춘 성과 개선 서비스를 제안할 기회를 찾아야 합니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.cms.gov/newsroom/press-releases/cms-proposes-reforms-strengthen-competition-elevate-care-quality-expand-beneficiary-choice-medicare", "verified": "원문 직접 확인(11월 20일 보도자료, 별점 15개 지표, ADVaNCE MA 모델, 60일 의견 수렴, 3,500만 명 가입자 확인)"}, {"url": "https://www.cms.gov/newsroom/fact-sheets/contract-year-2028-policy-technical-changes-medicare-advantage-program-medicare-prescription-drug", "verified": "원문 직접 확인(팩트시트의 본인부담 상한액, 90일 진료 연속성, 2029년 시작 10년 모델, MFP 적용 조항 확인)"}], "verification_note": "규칙안 단계이며 의견 수렴 후 최종 규칙에서 바뀔 수 있습니다. 재정 절감 추정치는 공개 자료에 없었습니다.", "image_concept": "A row of small brass stars pinned neatly to a weathered wooden board, with empty pin holes between them.", "img": "data:image/webp;base64,UklGRkplAABXRUJQVlA4ID5lAACwYAKdASqwBCADPpFIn0wlpColIhTpAUASCWlu//ndH67Cu/V//+mbida54dn7HaV6d/1uhvkz/7un/zbkEPC36UR36PZp5d/zaZBq8jnTcaeOIiNQW8O13yLO7viP+x9fXW/mseTfsP+s/qnVO8wD9VOm95gP2c/cj3gv9J6kP65/nv1s+AD+0/5X//9gV6Avl2eyf/Yv+d+6/wCfs3//+zw6d+H7591w/o33j/r/0Puo4H/sPB3/G/z//160Ox3gO4EdwDqP/E9DL3I/I+oLOb/FaPPKf/x+oT5Rfhz+4PVz/5gdw+Zq2gd5cLanE75QNBGLog2atoHefaPm1c4nfKFS4Id59o+bVzl7+UFBgh1KznuCMuXXX1oDN3x2MYTCPjCCHUkG20fE3IEefaJByhPQoFVLSdjSKQgk3Kk475QUGCHT5YOu0mdB1JBDvPkFtO0e35uo7z45H7IMCaqDUd/kiN1KP2o4FW+DAvkFL59tEE+qlMeRRyTcBrtSPh9j1mSbaucPzK9sVFas/M+6iPJLkS4VqVlHE+dK4A0eQlr3No+bSKO8+SUO1qhSHIFWfzD8lz1VKX0bRke5tH56t5tpUn3hLqcYo4Bw6jvQJhM6o+VyAEUv8wT7Vu7HwX2FG+Bf6q5t0kDWJKmFSzQbdxdRt2cBIBrHygpqN2rD4o8x85daDPyOwK9o+bVzh86j5x5SuT/JI9xWHgSo8Uck4ncSYNi+/JUeNdjPpgpcWIpYtAQY1GxgI7W57742UFBgawIVJlVXIml8jqIzwl2clL6sqlfxxu0iWLe0DWxvt53FjF6Hvux8m92aMB4T2iPZ37HUFiQEcAVf0a9cYz4n6bNGL792PgvttNi07qBXGrH4BbbtwSU5lcUfgK1/IdSGu LEVATE에 총 4,700만달러를 지원할 15개 기관을 발표했습니다. 약 450건의 지원서 가운데 경쟁 심사로 골랐습니다. 대상은 메디케어 가입자의 심부전, 치매, 당뇨, 비만, 고혈압 등 만성질환이며, 모든 과제에 영양 또는 신체활동 요소가 들어가야 합니다. 영양사 코칭과 가정 혈압 원격 모니터링, 당뇨 환자 대상 작업치료 보조, 인지장애 환자 낙상 예방 교육, 비만·고혈압 대상 가상 생활습관 프로그램 등이 포함됐습니다. CMS는 2027년에 최대 15건을 추가 선정하는 공모를 낼 계획이라고 밝혔습니다.", "why_matters": "메디케어가 약물이 아닌 생활습관 개입의 비용·품질 효과를 공식 모델로 검증하기 시작했습니다. 결과에 따라 디지털 헬스·영양 서비스가 메디케어 급여 대상으로 넓어질 수 있습니다.", "strategy": "원격 모니터링·디지털 치료 기업은 2027년 추가 공모에 맞춰 메디케어 가입자 대상 비용 절감 근거를 준비해야 합니다. 비만·당뇨 약물 개발사는 생활습관 개입과의 병용·비교 근거가 지불자 협상에서 요구될 가능성에 대비해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.cms.gov/newsroom/press-releases/hhs-announces-47-million-maha-elevate-awards-15-organizations-test-chronic-disease-prevention", "verified": "원문 직접 확인(4,700만달러, 15개 기관, 약 450건 지원, 대상 질환, 2027년 추가 공모 확인)"}], "verification_note": "지원 기간과 기관별 금액은 보도자료에 나오지 않았습니다.", "image_concept": "A small potted seedling growing out of a stethoscope chest piece placed on a kitchen table.", "img": "data:image/webp;base64,UklGRhotAABXRUJQVlA4IA4tAAAQqAGdASqwBCADPpFIoUylpKcioXNYYOASCWlu+BCdPvwFWBb5LvrXwlToejft/88slvPJ8lMk3nf8p+7XSJ8n6fukt+Xz9zqP03+rvwBfrf03f3d9QH7Z+s//p/VD/lvUA/uvp8epR6Cf7send+7fw6/23/tcHh04/bnz/+deXKvKrwT5AJnvsdz8LzPHxD/rvRf6a+Jdk6I9s1BCsTdEfWwzsTOX1FRr/CZFmhluXuU3YK4WUW7C5oznDOHqK49EW8IZmaKH/IX4jKo533H/I/xBddDF4Y63BuXojZpPqhPyG+3HcMBGVAxtXZjej6ythIYL6HkbiH2he/9GimXa3LreAQprs/XASZgFxfu1CkQfXGQ08LbF390/mZ17ZYkXgMB+r9yPpbtXi7ur3N0SOQjCY4fnIihFUeHH+OHyda2QgUDNhDnAyc0bxlo18RxmTlYlP9mcz8dGaokMISjT6s4F3CrREz6RA1d+7bm7uJAC4jywxtP5WQwEJrXx9LOf/ZdmcrHs6Z7rV4vCKnWAWL5s9ppVgotn9Pot1aRVOD4sQaoUiD6yIgIvv1o+gaLDTU10SvI+hfxlSd6e2HoGi7VjQa6ol23a6tsV3s3a9n422UX4AqcWyZfTDJIbd4F8VQMR1TqvEFwChvpQrG6I+siXd37x+Pq/PtuN0h4QT+4/YjvaY7/amnkv53drXx9LUZIy7M5kJfAFt6PZ6QgFeodmy/LtQoTm+jSbA6DVMu0YVE0uoL4whfVl2thLoeB6czAGH3UVx7Aqu4flK0AZVifbqazL94XnJSsEvR2v/4R2k2kzXcTM/+0pm3/v7CtP++hC5c/iddUOITYsXRo9wDEYjbnH62DXqLlx6SP5b2KovZesk6Z7rW4paUlzx9X59RbpYh95iqM5G1WSCbokP8AIddJeug27iahSgJt9nYrLjfZdqa6JY0NiJssDt3 목을 넣어야 합니다. 의료기관은 업체 보고 내용을 확인·정정 요청할 수 있으므로 결제 조건 문서화를 정비해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.medicaltimes.com/Main/News/NewsView.html?ID=1172027", "verified": "원문 직접 확인(11월 20일 공포·시행, 할인 전 거래대금 기재, 할인 한도 1.8·1.2·0.6%, 공개 시점 변경 확인)"}], "verification_note": "복지부 보도자료·관보 원문은 열람하지 못했고 전문지 기사 한 곳으로만 확인했습니다.", "image_concept": "An old paper receipt with a faint ghost of its original price showing through beneath a stamped discount mark.", "img": "data:image/webp;base64,UklGRkAqAABXRUJQVlA4IDQqAADQaQGdASqwBCADPpFIoE0lpCoooNe4YUASCWlu992IiFGd/+cZz7HroQ3SXFpBcP6+YgbQjCfOr8b/bvx398yyP7fyc+pkcjvKx0/sB7jPzP+tPwDf3XoK/uR6gP59/nfWL/2/7me5r/D75D6AHSuf4X0pOrn4O3uU2dl1Hdrwk98EAbeC0/GgNxt884F6q431QCNccdmjfVAI1xvqagJldG/Y2WHMro31NQEzCG5F0b6moCZdUjfU1ATK6kq6moCZdUj+l66zLxlVxvqeDy8ZVccQQrMvELjfU1ATK6OIIVmXj1ICfU1AlxF0b6mouGhkXRvqa++431NQEyujfU1ATK6NzB10b620QuN9TUBMro31NQEyujfU1nYBF0b6modgIuj+ldvVG+prOwCLpEHMro31NQ7JeYukq6modgIvmG/HqzM5Oj+ldZl4hcf0r/h5eIXH9K6zLxlVxxBCsy8QuN+PVrHi6+Yb6w87Ve6QuOIIfyrVeIXG/HqzLxC44ghb1RvqagJldH9K/4eXumVXY2ZlgZLWPF10b6mvvuN9TUBNOl0lXU1ATK6N9TUBMro4ghWZeIXG/JH2IXG+pqAmXVI45WcoGS1jXiFxvx6sy8QuN9OhSTnpH1PHVRvqagJldSVePVmXjK3kz0EK1jXiFxvqagJmDNpZVT6spiNBlb07qa++44isakq6w7Mzk6P6V2dqvELjfU1FnKIpwI78eCIIlcOzIwRl1bDsI4OYz62bS58F7M5dutBJfK+2d6DYD+kl/Ohob/bS61KhhcfWZOaTinXtvE56sy8QuN+Po+MzK6kq6moCZXzDiCFZl4hU1gFZxyqwz+kFfae/+fXR+OYxcHehpuHZ/slWxcvm+9ZzGmSzM8qV1rGvELjfU1ATK6kq6moCZpWbokxYaSshtQstydFVPUj0CjkCP0ga5b5HGxCt91NQEzBl1mbE6moCZXRvrDszOTo31NQOOO5XSIz87HW2D5X84T0AadGlGzzrPw7n1n8XXzDfU1AlxF0b6xbLo31h2sa8QuN9TwjWKoN9ohRS67y/OX/j81ZN09vtzsF0U/ND6DQGDLgr5Xqmh1E3/m5+fKMsC0sy8NZiL2UahvX0rrMvELjfU8Hl4yq6SryJdZl4hcb6moCzj08IyaAtI9ERgbJLCkM19WwaCNDVkvdxp+vS8EQ0YWlEqXtGIoXOSInk4FygE4e46zLxC431PCMa8Qukq6ms7AIujiCH8POoqZQEo5EcwWJqElaFtuVhbzIqNjEv3gmzkZmV0cQQrMvGVXG+prOwIiFxvqagS4i+YjyU8BUBDqSPHE38BAILSYDQEzO6moCmwlx/xGNe6QuP6V1mXiFxvrDsy60BQeB+W8IsnOt7D6rYihH38MMReC5mh/SuszYnU1ATTpdLjBNOmTDfW2iFxxBCsy/aVh6dKMNnsaYugNYssbhfj0BAagOEseDEg1Cp 자 7명 가운데 4명에서도 미확정 부분반응 등 반응이 나타났습니다. 최대 12mg/kg까지 용량제한독성은 없었고, 기존 FGFR 저분자 억제제에서 흔한 고인산혈증·손발톱 이상·중심장액성 망막병증은 관찰되지 않았다고 보고됐습니다. 바이오헤븐은 내년 상반기 FGFR3 변이 요로상피암에서 가속승인을 겨냥한 허가임상을 시작할 계획입니다.", "why_matters": "파드셉 이후 치료 옵션이 부족한 요로상피암에서 FGFR3 ADC의 초기 활성이 확인돼, 국내 바이오텍 기술이전 자산이 허가임상 단계로 넘어갈 가능성이 커졌습니다. 다만 표본이 10명이고 반응이 미확정이어서 효과 크기는 후속 데이터로 확인해야 합니다.", "strategy": "바이오헤븐은 저분자 FGFR 억제제의 독성 문제를 ADC로 피하는 차별화 포지션과 가속승인 경로로 개발 기간을 줄이려 합니다. 에임드바이오에는 허가임상 진입에 따른 마일스톤 수령과 플랫폼 가치 재평가의 계기가 될 수 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.biospectator.com/news/view/30473", "verified": "원문 직접 확인(ENA 2026 구두 발표, uORR 60%·10명, 파드셉 경험 7명 중 4명 반응, DLT 없음, 내년 상반기 허가임상 계획 확인. 에임드바이오 계약 조건은 유료 구간이라 미확인)"}, {"url": "https://clinicaltrials.gov/study/NCT06874335", "verified": "검색 결과 스니펫만 확인(1상 설계·목표 등록 140명 정도만 확인, 결과 미게재)"}], "verification_note": "바이오헤븐 공식 보도자료는 사이트 접근 차단(403)으로 열람하지 못했고, 수치는 바이오스펙테이터 보도에 근거합니다. 학회 발표 수준의 중간·미확정 반응 데이터입니다.", "image_concept": "A tiny brass arrow lodged precisely in the center of a single glowing cell-shaped bead.", "img": "data:image/webp;base64,UklGRnQhAABXRUJQVlA4IGghAABQZwGdASqwBCADPpFIn00lp6oroHNIUXASCWlu8aDQfdVQgaYrsLPi0nGCFo/inqDfqF+me8q84zz3PUe/zmSp/tLwf/Tb97/Vn693md4K1MtT3bPei0eBgv7UAf645yUnIECBAgQIECBAg1mKBAgQIECBAgPIWzluTJkyZMmTJkRVRm4L5jTSVJXUKCKiW4/1jmnGag2ZS5RVCeSfRF7cFPesRuHDhw4cPrB6n5Ol/Oie3lyTbSwpKtcCNfxSJM4vPSRH6YEe1atkEpm48OO+e1n9bJnRQiwXEDYI4DO7fhZxwUzsevdmrVrd0vZx7zBB3ifZW3fxRJ2FNnd+KHTp06yPSJEZyyiumsIFOnTp06bT4XNciLSv/tRB4jcLN79+4N9LFDNpkOz4AeX7PDiM5ZtTzl6mQwmrQgVcdE9rgDh3vAjbjie1dOfPtC4dqLuMYSBpCid86dOhge/OrOtB5rPM50UwM2j5rkrVq1cf7Vqscsxz8muh1SGhIoLChY8+jj70D79i+4OJ0q/A4wWLFixYsWsEpVKt4z/OnZaBemBAgKGdQoULJWVwQPn5NcQJL1HNMVoj036AAVhgZA/wxnJ+9vgK6aRvjkthrjth9LIZSlniNutwbNKN7n6VwawppYUKF6Oew/DhUBl2lCzaxYsWLCEPldO5CN2AXpgQINVDEDnOnTasj8MTwHpKhPIZ0OmML7rUQfE+ddO0mUm7i+g0h8e31CzRd49XFDGZrxNFXHVAZWgQ/eR3yPaR8BmtbKVCLYzxbGCKyR+r/Np8LLOIzlw5qK6orVICHa/j8tmp5UVLUu6YMBX1SyHTD/hVmHtUnT16hpaBXMrthjmVTcQR6AITxUyZSQHE9qr9CixSTkjIK3ls6 const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
</html>
