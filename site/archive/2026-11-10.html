:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}

count": 30, "file": "https://bio.withsong.co.kr/archive/2026-10-20.html", "note": "웹에서 열립니다."}], "items": [{"id": "ai-smartwatch-ai-ecg-aha", "cat": "ai", "alt": "나란히 놓인 두 손목시계가 서로 다른 빛을 내는 모습을 그린 미니멀 일러스트", "title": "AHA 2026 레이트브레이킹: 인천세종병원·메디컬에이아이 스마트워치 AI-ECG, 2,211명 대상 애플·갤럭시워치 모두 좌심실수축기능부전 판별… 9%(200명)는 두 기기 판정 엇갈려", "short": "스마트워치 AI-ECG 결과", "date": "2026-11-09", "scope": "국내", "entity": "인천세종병원 세종의학연구소 디지털헬스케어연구소(이학승 교수), 메디컬에이아이(AI 모델 개발사)", "what_changed": "AHA 2026 레이트브레이킹 초록 27869로 실제 결과가 공개됐습니다. 직전 호에서는 발표 예정만 다뤘습니다. 심초음파가 예정된 성인 2,211명이 같은 방문에서 애플워치와 갤럭시워치로 30초 단일유도 심전도를 연달아 측정했습니다. AI 모델은 두 기기 모두에서 좌심실수축기능부전(LVEF 40% 이하)을 비슷한 수준으로 구분했지만, 200명(9%)은 한 기기에서 양성, 다른 기기에서 음성으로 판정됐습니다. 집에서 자기 스마트워치로 측정한 외래환자 146명 코호트(94% 갤럭시워치, 하루 중앙값 2.4회 측정)도 분석했습니다. 측정일이 5일 이상인 108명에게 ‘연속 3일 중 2일 양성’ 규칙을 적용하자 LVSD가 없는 70명의 위양성이 18명에서 9명으로 줄었습니다. 대신 LVSD 38명 중 31명을 찾아내 단일 양성일 규칙(33명)보다 2명을 더 놓쳤습니다. 일관되게 양성인 참여자의 81%, 일관되게 음성인 참여자의 약 6%가 LVSD로 확인됐습니다.", "why_matters": "소비자용 스마트워치 두 제조사 기기에서 AI-ECG를 직접 비교하고 가정 내 반복 측정까지 다룬 대규모 데이터입니다. 한 번 측정한 결과만으로는 판정이 흔들릴 수 있다는 점과 반복 측정 규칙으로 위양성을 줄일 수 있다는 점을 수치로 보여줬습니다. 웨어러블 심부전 선별을 실제 진료에 적용할 때 운용 기준을 설계하는 근거가 됩니다.", "strategy": "메디컬에이아이는 단일 측정 판정 대신 반복 측정 기반 판정 알고리즘을 제품 차별점으로 내세울 수 있습니다. 다만 단일 병원·심초음파 의뢰 환자 대상이고 동료심사 전이므로 일반 인구 선별 효과와 치료·예후 개선 근거는 추가 검증이 필요합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://newsroom.heart.org/news/ai-analysis-of-ecg-data-measured-by-smartwatch-may-help-detect-reduced-heart-pumping-function", "verified": "AHA 뉴스룸 보도자료 원문 직접 확인(초록 번호, 대상자 수, 불일치·반복측정 수치, 한계 확인)"}, {"url": "https://newsroom.heart.org/events/scientific-sessions-2026-public-newsroom", "verified": "AHA 공개 뉴스룸 목록 원문 확인(보도자료 게시일이 11월 8일로 표시됨)"}], "verification_note": "학회 초록 발표이며 AHA가 직접 ‘예비 결과, 동료심사 전’이라고 밝혀 학술 성과(동료심사) 대신 공식 발표로 분류했습니다. 보도자료에는 AUC·민감도·특이도가 없어 정확도 수치는 기재하지 않았습니다. 보도자료는 AHA 뉴스룸에 11월 8일로 게시됐고 발표는 11월 9일 LBS 세션입니다. 보도자료에 WATCH-LV라는 연구명이 나오지 않아 프로그램상 WATCH-LV와 같은 연구인지는 확인하지 못했습니다. 메디컬에이아이의 국내 공식 보도자료도 찾지 못했습니다.", "image_ p7ZQo1wiKpT//RPfpqXRHkiqfOmoICgC0dI2E9i6LROagEAAA="}, {"id": "ai-kaiser-echo-ai-rct", "cat": "ai", "alt": "반쯤 쓴 편지 옆에 만년필과 모래가 절반 내려간 모래시계가 놓인 미니멀 일러스트", "title": "카이저 퍼머넌트 AI 심초음파 판독 무작위 시험: 1,200건에서 대폭 수정률 50.6% vs 인간 49.7%로 비열등… 심장내과 전문의 판독 시간 8.5분→4.6분", "short": "AI 심초음파 판독 RCT", "date": "2026-11-09", "scope": "글로벌", "entity": "Kaiser Permanente Northern California(Keane K. Lee 박사 연구팀)", "what_changed": "AHA 2026 레이트브레이킹 초록 28202로 AI 보조 종합 심초음파 판독의 맹검 무작위 시험 결과가 공개됐습니다. 직전 호에서는 발표 예정만 다뤘습니다. 2025년 3월 2주 동안 21개 의료기관에서 시행한 일상 진료 심초음파 1,200건에 대해 AI 도구, 소노그래퍼, 심장내과 전문의가 각각 예비 보고서를 작성했습니다. 이 초안을 심장내과 전문의 20명에게 출처를 가린 채 무작위로 배정해 최종 확정하게 했습니다. 대폭 수정 비율은 AI 초안 50.6%, 인간 초안 49.7%로 사전에 정한 비열등성 기준을 충족했습니다. 확정에 걸린 시간은 AI 초안 4.6분, AI 없이 8.5분으로 약 46% 줄었습니다. 연구팀은 측정값과 해석을 포함한 전체 심초음파 보고서를 AI가 작성하는 도구를 무작위 시험으로 검증한 첫 사례라고 밝혔습니다.", "why_matters": "영상 AI가 개별 소견 검출을 넘어 전체 판독문 초안을 작성하는 단계에서, 정확도는 인간 수준을 유지하고 전문의 업무시간은 절반 가까이 줄였다는 무작위 대조 근거입니다. 판독 인력이 부족한 심장영상 분야에서 생성형 판독 보조 도입 논의를 앞당길 수 있습니다.", "strategy": "의료기관은 AI 초안과 전문의 확정이라는 협업 구조로 판독 처리량을 늘리는 운영 모델을 검토할 수 있습니다. 판독문 생성 AI 기업에는 비열등성과 시간 절감을 함께 입증하는 RCT 설계가 규제·도입 설득의 기준점이 됩니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://newsroom.heart.org/news/ai-interpreted-echocardiograms-comparable-to-human-reports-cardiologists-time-cut-by-about-50", "verified": "AHA 뉴스룸 보도자료 원문 직접 확인(설계, 수정률, 판독 시간, 한계 확인)"}], "verification_note": "학회 초록 발표이며 AHA가 ‘예비 결과, 동료심사 전’이라고 밝혀 공식 발표로 분류했습니다. 보도자료에는 사용한 AI 도구 이름이나 개발사가 나오지 않습니다. 장기 환자 결과 개선은 평가하지 않았고, 참여 전문의가 연구 참여 사실을 알고 있었다는 한계가 있습니다. 세션 프로그램 명칭(LBS.06)은 검색 결과 스니펫으로만 확인했습니다.", "image_concept": "A half-finished handwritten letter resting beside a fountain pen and a small hourglass with sand half run through.", "img": "data:image/webp;base64,UklGRmw2AABXRUJQVlA4IGA2AADQygGdASqwBCADPpFIoUylpCctoTIokbASCWlu/+fqb6tnlj76Ae8/o2rP/RzhNu/g7L/LP+NpKM6zdajn6MdHfcef/3rdIOk7+96CjvrT0yA/e8zv4Dvg/9P1l/p32APK1/4fXZ/ZfQN/SP9/68PpQ/4vpdenx6rfRP+s//dcmW+Hf+X/b+sdo74tfkvBfrB78fkjqBey/8Z4o/Af2L/h+g17B/U/ 예측", "date": "2026-11-09", "scope": "글로벌", "entity": "NYU Langone Health(뉴욕대 랭곤 헬스)", "what_changed": "11월 9일 네이처 커뮤니케이션즈 온라인판에 논문이 게재됐습니다. 연구팀은 응급실 환자의 외상 경위 진술을 3단계 생성형 AI 파이프라인(PREVIA)으로 분석했습니다. 1단계는 외상 당시와 응급실 증상을 찾고, 2단계는 위험·보호 요인을 따지며, 3단계는 인구학 정보와 외상 유형을 합쳐 위험 점수를 산출합니다. 응급실 환자 145명을 분석한 결과 위험 환자의 95.4% 이상을 식별했습니다. 30건 대조 시험에서는 이후 PTSD가 생긴 사례를 PREVIA가 모두(100%) 잡아냈고 PTSD 전문 응급의학 임상의는 89%를 잡아냈습니다. 모델은 Llama와 Mistral 기반 오픈소스이며 추가 학습이나 미세조정을 하지 않았습니다.", "why_matters": "임상 대화와 서술형 기록을 LLM으로 분석해 고위험 환자를 선별하는 방식입니다. 앰비언트 AI와 진료기록 AI가 문서화를 넘어 위험 선별로 확장될 수 있음을 보여줍니다. 미세조정 없이 오픈소스 모델을 썼다는 점은 병원 자체 구축(온프레미스)이 쉬울 수 있다는 의미입니다.", "strategy": "연구팀은 PREVIA를 위험 환자를 찾아내고 그 이유를 설명하는 AI 선별 도구로 제시하고, 예방적 개입의 시기를 앞당길 수 있다고 밝혔습니다. 다만 표본이 145명이고 대조 시험은 30건으로 작아 외부 검증이 필요합니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.prnewswire.com/news-releases/ai-predicts-ptsd-risk-based-on-stories-about-what-brought-patients-to-the-emergency-room-302926212.html", "verified": "기관 보도자료(PR Newswire) 원문 직접 확인, 학술지 논문 원문은 미열람"}], "verification_note": "수치는 보도자료 기준입니다. 보도자료에는 AUC, 특이도, 신뢰구간이 제시되지 않았습니다. 논문 원문에서 지표 정의를 확인하지 못했으므로 95.4%는 민감도 성격의 수치로만 이해해야 합니다.", "image_concept": "A paper hospital wristband unrolling into a long ribbon passing through a magnifying lens.", "img": "data:image/webp;base64,UklGRrQlAABXRUJQVlA4IKglAACQcAGdASqwBCADPpFIo0ylpLatoVSIMtASCWlu/8zpc/xvN/g4u/Ds3Xe85/5k0qoz+lnRm3GflfgvEtF3Hyf5pdOT0F4+/pHUIcf5gW5fq6/5/q6/KX/X9wD9TfPI9e/9V9AH8w/yP7q++B6If+L6hv/A88z2Mf3M9m7y7v2Z+Gv92fTC1c6fXbTwAvDnCKgD+vPpiTcf3ijwzKzYvLNqKgwlxgFwx53SVckHyMAuGPO6Srkg+RgFwx0oCYpIPkYBcMdPRqTT2TewK2r/yy8qqtVS0yMxHOSgJeXPfgqIH3JpeCs+uJa7gMU8AtODpQF1lAcokg+S4VhntI/e3JpikhYLDUBF0HA3JJKSDzb7UNWNgKBCYnn/hqdhZcd7jm/MvhAlvUl4qUaI8ewALLeqFPJKvHB/TTcsDBwp3tPzhCa0ixqtGKMYPo1bATjzIJLda2HrDJXATsmY1UGoNFo2UQf00xGgNRqi4whB8i+AThIXeT+9dg37VDyTbMNYAAFQHCnr9g4WbDh0OTTuDtmFPVSIjfEBewsNp20sIg9vwVhbuZTzQ0j/hxRfeQfMjMRjpQOYhXqySEe0sCjoCFWbIqmBfRsim5wBMUkHyKGABUCIMXODSwhcc4O7Mm5ICislvPrJb19WZbz6yWTtMRiMBCDg/  {"id": "dh-peopleandtech-skt-ai-agent", "cat": "dh", "alt": "병상 난간에서 뻗은 빛나는 선이 창밖 먼 집으로 이어지는 미니멀 일러스트", "title": "피플앤드테크놀러지, SK텔레콤과 ‘모두의 AI’ 헬스케어 에이전트 MOU… 국내 1만 병상 이상에서 운영하는 스마트병원·RPM 역량을 병원 밖 AI 서비스로 확장", "short": "피플앤드테크-SKT MOU", "date": "2026-11-09", "scope": "국내", "entity": "피플앤드테크놀러지, SK텔레콤", "what_changed": "의료 AX 플랫폼 기업 피플앤드테크놀러지가 SK텔레콤과 AI 에이전트 사업 협력 업무협약을 맺었고, 이 소식은 11월 9일 보도됐습니다. 피플앤드테크놀러지는 과기정통부와 NIPA가 추진하는 ‘모두의 AI’ 사업에서 SK텔레콤 컨소시엄의 협력 파트너로 참여합니다. SK텔레콤은 8월에 이 사업의 수행기관으로 선정됐습니다. 협력 범위는 헬스케어 특화 AI 에이전트 연계와 서비스 개발, 실증과 상용화를 위한 사업모델 발굴, 기술·콘텐츠·운영 노하우 공유, 홍보·마케팅입니다.", "why_matters": "병동 원격 환자 모니터링(RPM) 중심이던 병원 AX 기업이 통신사의 대국민 AI 에이전트를 통해 병원 밖 소비자 건강 서비스로 들어가는 경로가 생겼습니다. 정부가 지원하는 무료 AI 서비스 안에 건강 정보 기능이 들어가면 의료정보의 신뢰성과 의료기기 해당 여부를 따져야 하는 문제가 함께 생깁니다.", "strategy": "회사는 국내 1만 개 이상 병상에서 스마트병원 플랫폼을 운영하고 있다고 밝혔습니다. 이 병원 도메인 역량과 SK텔레콤의 AI 역량을 결합하려 합니다. 다만 구체적인 서비스 기능과 출시 시점은 공개되지 않았고 협력을 검토하는 MOU 단계입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.venturesquare.net/1126693", "verified": "언론 기사(벤처스퀘어) 원문 직접 확인(2026-11-09 게재)"}, {"url": "https://www.dailian.co.kr/news/view/1712390", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "회사 보도자료 원문은 찾지 못했고 언론 보도로 확인했습니다. 1만 병상 이상이라는 수치는 회사 측 주장입니다. 계약 금액이나 구속력 있는 조건은 공개되지 않았습니다.", "image_concept": "A hospital bed rail with a thin glowing cable stretching out through an open window toward a distant house.", "img": "data:image/webp;base64,UklGRhgjAABXRUJQVlA4IAwjAABwgQGdASqwBCADPpFIoUylq6qtoVJ4obASCWlu8AMOAbP8THEPfteOgQs9GLMarKT1v+G/HPXANAHwbNv+C723+o/XH3pfoT2AP1Y88v1//1z0Gfs765HpD/43pQdTl0TvrI/3n0zNTcnCOyuL68fgB+bKlxzBk/886dV+8Ueebhx9GeDenxQc2HaaptVPig5sO0zGWqQO01TaqfFBzYdpqm1U+KDmyvkgJ3j6jaq5Up+6kjfRDCg5ddeqma7japceIIfF8habVUJ1QNm1bbxqm1U+KDnO/pqs+qfE1khJ5Cj+QtVXgv7ymqruwB2mqbVL2Y1TaqfFBzbKqfFEv5D//xdSyXlU2qnxNYXgO0n8i1U+KJgq8pqp8UHLxa4ZBVOHNttU2qnxkobDtNzJ6Zl8VKCptfpqm1U+KDmw7TVNriXEJaqfFBzYdyVr/4ObDtNTbZzVcwh8UHNh2k6lK/TVNqp8eUvLTVNqp8UDKNqXbJvT1DTBpFCoPdU+KDmw7Ihptfpqm1S5P0EWqnxQdkQF8AQO2Te 해정의 급여 대상을 삼킴 곤란 환자 등으로 제한하는 일반원칙 개정을 하지 않기로 했다고 보도했습니다. 판단 기준은 ‘ODT가 일반정 대비 추가 재정 부담이 없어야 한다’는 것이고, 가격이 일반정보다 충분히 낮으면 별도의 환자군 제한은 필요 없다는 결론입니다. 로수젯ODT는 개편된 45% 산정률로 단일제 가격을 합산하는 방식으로 논의됐습니다. 그동안 멈춰 있던 ODT 등재 절차는 로수젯ODT를 시작으로 차례로 재개될 예정입니다.", "why_matters": "제네릭 약가 산정률을 53.55%에서 45%로 낮추는 약가개편 이후, 업계가 ODT 같은 제형 변경으로 계단식 인하와 다품목 등재 규제를 피한다는 우려가 있었습니다. 이번 결정으로 제형 변경만으로는 약가 우대를 받기 어렵다는 기준이 정리됐습니다.", "strategy": "ODT 개량신약으로 약가를 방어하려던 제약사는 기대했던 가격 이점이 줄어든 상황에서 출시 여부와 가격 전략을 다시 짜야 합니다. 정식 결정과 고시 시점은 심평원 약평위 결과 공개를 확인해야 합니다.", "evidence_type": "전문가 대담/추정", "sources": [{"url": "https://www.dailypharm.com/user/news/344361", "verified": "원문 직접 확인(2026-11-10 06:00 게재, 업계 9일 전언 인용)"}], "verification_note": "심평원의 공식 발표가 아니라 업계를 인용한 언론 보도에 근거합니다. 약평위 개최일과 구체적인 상한금액은 기사에 없어 확인하지 못했습니다.", "image_concept": "A small tablet dissolving in a glass of water beside a perfectly balanced scale.", "img": "data:image/webp;base64,UklGRtAyAABXRUJQVlA4IMQyAAAQsQGdASqwBCADPpFIoEylpD6oINGow9ASCWlu9++6T1WNs/8vMB+AZWX8JXrKtExOjiRGrjXn13mr5AbJs7Wz0/ge/V6ov8xvE/6t6C/Oq07HouvTPyc6bL1ZYp/jtyt2u/v3iKPg/CGY77o5i+E/8j5LPIbfcvUG8o3wjjOIWbDdFtGvGEmU1U+KBhbRqm1U+KFlARhwSmO8gqm1U+KFmw7TVNqp8UemwjFPizMEVEBY7A5XiHzwgRXtDiOdAhkWmptTkVh4jrP7tDtUCULNh3iYELadNU2DjVNg2IYWjtOpxdIS7IcseTsgqm05y4nM01U9RmV0hprD+g4vAPibVT4oWbIdAJAXi2fEBsOVsIF4eWk+i7IzfIVsQHOzinxZmyDEUhr9NDZfVRIaszbTrFhsh3pQ2hBb9q45lNXwY8WXbqruuLr9KDvmQ+JtVPTeu7jfZnEBeMOcP7s0B2QYgymr3VdpoanXOIC8WDifnImv0n5cYbhBiWhshhOKaXOU3wqm3PpjxQs2V9OMKU06IC28fHiLftOuoWLjQnRlKnEuBsi7iczTTu3oYYCzWLr4MeKLZxT4m1U+JtnxAYHBv2IYvZmc/sELVT4oVwUwIbi01gko91NEDlv5ryy2W8vAQ8BXoL4xJfTVVtgI5gd/Mpg41Nr07aptO7jxYvymqtIh2xDUvRBvdPwHKznVTGqIVNr1Sx8BDmbBhu0SXa9TNNVPoIw6DEqcSx89/xL1M007uOZPog4uEDWLDjQnRWvOpwU1U9Q2BiPH9kAKfuLLqqBxV0AbC01S8skMKDf8Zu7Y1rzFPhW+ZUC2qmZfXw/wXmbsmVRsiDnWXFTJuIDYRiruwFs2PmZYTYdpqbX6aptVQmvhVNufPd8lMLS8JruNU2DjVNqp8ULShwXsQMAcqmZ3zFND14EhN8jvWShmu3BnekdpJ7/cMHN3ggb3QoPKu4WzLIBzwuiJHaz042PmtMuAOTQ/LQAyxEE4fLnmcrO2sfwcQGw7TW6/nOlj0kyfRCQVNUidppj4oM9uDqH5iF9b+Lau8i7ff  적었지만, 여기서는 FDA 발표의 26%를 따랐습니다. 약가와 출시 시점은 확인하지 못했습니다.", "image_concept": "A single dam gate partially closing on a flowing river, letting a controlled trickle pass through.", "img": "data:image/webp;base64,UklGRvgsAABXRUJQVlA4IOwsAABwiwGdASqwBCADPpFIoUylpKclobSoUOASCWdu/+Br4/FlX6aCafdVl94/rrZvJ/+xpJX/uUXo1dOWnfuQPLSPnGT5KXiPGf13/A/8v+7dNXzP9b/XPV+n4sNfr97iPzH/5P7j+////+wD9Iv14/u/v9/wv7Ae8D+cf8H8o/gJ/QP9N673od/8nqAf570/vVH9DPy5vZp/qv/j4OPpp5YvjP8x5M60vL3814F/pkNU545AL4/uO9P8w72k0Y8KP+f0j+nutFeG389B/7iaQo5mkceHbZFuDEHZDh8hCk5xHttVw5KQtg2OKpSES/+6/uHi2e16yKjfZIklrdxRUvLHk20nD5H+EhrjOCtQVGd4fcfyjjbP4RfAiWxbF8+j7OGyNjtxTKHEHNWtmnlJGbokTK2SqfO+onOoWDIrEH3Vcu/kf4Uk92yT0Cg1gl6kvLEmg7N3fwT4ErIl/5Ht5tdDEtwO5FPlt94z+8JQmigszjonyo1TEjv5XfItJqHut2ZzEi+duwDrYQDUYgBp86sFKctnPBfYA1/fsopJ/yzhWUj2TmIxXpjGxb67qk3E2OxSpUmr7rstPnbMVFFKUVBpRTBkhI+syGT/76x860opQ/Qcey+thnSGb639gZ73mzYOJfeB1v1WbAp3fJpLBlIzTKQkjFigM6JoGr7BEsvUKuRxE9myxn1Qnl7F5w3u0n4lw79zhYhE79YKSQTE46L/Kr13sCSSEYu/rRNrflr0rWYqMGmEAjhkveGlnP4UXOy0FqRS/fjWPZRFIg9bScKt966jiB1rO8YeESU3KTr7KSNfXhC8Ir1JIRi7tQoTlxvr+1NmUhI/Mx5nRxzuOKWk0zQmYym3Cik0+R/hyWe3TblFVHVB1/OAyc3M/HxU0pnoqOH33Iq/XD5F3GDWAtD+SSYru/lmot0ZtIh2cuJskpJBRIqO4/yP/GH5VqtMic82eSJf9RKgQJASqO05gcqKY0ZG1bB9hNQQiXDz1FRt4013z4d8GWYB8jahhkQlFiRV+wxKXg0vUhZrYJkg26GLqSpXd+yhRK0FwYHwhMw+eWndqGH6V1EhaH2v1cltn2a1Vr1j6eF9cY6pE0m2Z1o1tSlnLQoamzLh9NRfZ9j2DL6JyjZpGURfo6lAOKlC9ciHjV+pFq60JjoYy8cfXl4VMVWvV+wxJHItCa8mU+wUkhKFb0mzpJIL4UtMPg/Di5uhoABQ0GyEP//zqGNBEK4hncaa38SoXS2KWIQcubtULySux8TBRVj/vGw+TestZ79K5U5ukchnQKjVRa9VfD7jw9VkvsaVhWYPt37dFtC4LzNMm5hft5mc9S5y8vfhc5p76Y7r6t6psmcTL/0zNVzOhGw//4+8E40Gcmc4nqbURVmYzFAxTBg4Uvzq4iQWkgbgqXklNB/WSe+IxQzv5Qht38EAkQf1TG9gr9+XdOMJkwNTaY2coeCK81/U3gBOyI67GDtCpQFu3AzqW+CFZUvo/60XugXEiS1mJHkGxFJ55+iqij9zEWV4v09IhcpCpSSSsxoR1lIo2mfF5gp+SFp/EilqSZzM3G+1EH2CTClt3h9PViWZGtvxq5wkKJNG5AcNPdezEWSyHe9SLGpavghCOmApeOJuyfiQYQTOgDy6VSmjhI8IobMkPwliqcDElfiYhAu8UUM9vwth8pBtsnreU09aR1np2QjH/4qMPuCPSNi+JgrjAbJw+bkuQFL95Gyg6uuMjH1/NGymxxlpD6zu3Lxx0piLZprFwnUzW 러입니다. 최다는 텍사스(2억8197만6026달러)와 알래스카(2억7265만3149달러), 최소는 뉴저지(1억4233만8224달러)와 코네티컷(1억5365만2078달러)입니다. 이번 배분으로 누적 지원액은 200억달러가 됐습니다.", "why_matters": "이 프로그램은 5년간 총 500억달러를 지원하며, 앞으로 3년간 300억달러가 더 남아 있습니다. CMS는 각 주의 연간 진척 보고서를 검토해 배분액을 정했고, 대통령 체력검사나 의사 영양 보수교육 같은 정책 이행 여부도 배분 요소에 넣었습니다. 연방 보건재정이 주정부 정책 순응과 연계된다는 점이 드러났습니다.", "strategy": "지원금은 예방·만성질환 관리, 인력, 혁신적 진료·지불 모델, 기술·데이터에 쓰일 수 있습니다. 원격의료, 디지털 헬스, 의료 IT 기업에는 주정부 조달 기회가 열립니다. 미국 농촌 시장에 진출하려는 국내 디지털 헬스 기업은 주별 배분액과 사업 계획을 추적할 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.cms.gov/newsroom/press-releases/trump-administration-announces-10-billion-second-year-rural-health-transformation-awards-all-50", "verified": "원문 직접 확인(총액, 주별 최고·최저액, 5년 500억달러, 배분 기준)"}, {"url": "https://www.cms.gov/newsroom/fact-sheets/rural-health-transformation-program-year-2-awards", "verified": "CMS 뉴스룸 목록에서 11월 9일 게재 사실만 확인(본문 미열람)"}], "verification_note": "수치는 CMS 보도자료 원문으로 확인했습니다. 1년차 약 100억달러는 누적 200억달러에서 역산한 값입니다.", "image_concept": "A watering can pouring evenly across a row of small seedling pots on a long wooden bench.", "img": "data:image/webp;base64,UklGRqxCAABXRUJQVlA4IKBCAAAQ1wGdASqwBCADPpFIn0ylpCorIdH4sWASCWdu/+xdr+q/ksyIYFxSc+1/yF3FcdTchfUOFoE96D+y8zK+Nltvlghf4p+W/vuvMeX/rn5J/AvY/7//V/1b/bvdL5vdoean5D+r/ob2i/3D/WewX9D/+T+//v////sB/jf9J/Y3/V+19+jHuH/vn/h/Dn4A/13/Z/tJ/4vh3/xf7C+5H+0/7X8tPkA/r//L///YFegP+7H//9d/2Tf65/zP3t9sj////f3AP//7dHTP9q/8/6nfNz+d/evOv8e9yRJT+JfPXte7IeAL+Q/2PeIQBdxz8j5i/ab2AP1r4qD8h/3/16+Af+i/470mdJox6PkBVQBB6wLKCAVUAQesCyggFVAEHrAsoIBVPzCMQBB6wLIDknO5ztSTRGsAoqoBUT+mUyhIdeCTNc/o9eAcERHKD4vURYvxICqhErm/kBSFdmH9GfJFLUxYXou5QQBWJ/IBbDGue92mT+fjVp/SiD1gWUEApCuotXSTZKWsoC8HY0N6rmLDJjGd6yggFVPogFaAyDzTV9yy4FlILmA8HXBOp9EArQGqJ/SiD8KPwesD+MqgCDZXEe3B9gNCsoN85GHr9QbIIagCUQAi2hAHpQbiD1jFYzkbBilYVUAQer7f0Rxbc5CAZaw19KGhc1thwdKUgvKKv5vb/KgrucoHU2SUUd6pagA/xqJdkoCpdmSiZEgCD1gWUGRxelKMgqcoD+8X+MQlAC+wXaju/+JUODFFjjpPJ1DFgsW9VHyMHRogF63fICp9zpT087ryUU/56zObF3JCDcUNtV9n+1UO94W8QNpfdIsZ9xWJpZVqCnLfnYC le": "FDA, 노보큐어 ‘옵튠 마이아’ NSCLC 뇌전이 PMA에 ‘승인 불가’ 서한… ‘임상적 편익 정도 불확실’, 안전성 문제는 제기 안 해", "short": "노보큐어 PMA 승인불가", "date": "2026-11-09", "scope": "글로벌", "entity": "미국 FDA / 노보큐어(Novocure)", "what_changed": "노보큐어는 11월 9일 FDA로부터 옵튠 마이아(Optune Mya) 시판 전 승인(PMA) 신청에 대해 ‘승인 불가 서한(Not Approvable Letter)’을 받았다고 공개했습니다. 신청 적응증은 비소세포폐암(NSCLC)에서 뇌로 전이된 성인 환자의 정위적 방사선 치료 후 사용입니다. FDA는 ‘임상적 편익 정도에 대한 불확실성’을 이유로 들었고, 안전성 문제는 지적하지 않았습니다.", "why_matters": "종양치료전기장(TTFields) 기기의 적응증 확대가 FDA에서 효능 근거 부족으로 막힌 사례입니다. 의료기기 PMA에서도 FDA가 편익 크기를 엄격하게 보고 있음을 보여줍니다.", "strategy": "노보큐어는 추가 임상 없이 승인받을 방안을 찾기 위해 FDA와 회의를 추진하겠다고 했지만, 승인을 보장할 수 없다고 밝혔습니다. 항암 기기를 개발하는 기업은 PMA 설계 단계에서 임상적으로 의미 있는 편익의 크기를 FDA와 미리 합의해 두는 것이 중요합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://finance.yahoo.com/healthcare/articles/novocure-provides-regulatory-u-fda-120000073.html", "verified": "원문 직접 확인(Business Wire 재게재 보도자료, 11월 9일자)"}, {"url": "https://investor.novocure.com/news-releases/news-release-details/novocure-provides-regulatory-update-us-fda-premarket-approval", "verified": "접속 차단(403)으로 본문 미열람, 검색 결과 스니펫만 확인"}], "verification_note": "FDA 결정 내용은 회사 보도자료로만 확인했으며, FDA는 이 결정을 공개하지 않았습니다. 근거 임상시험명과 수치는 보도자료에 없어 쓰지 않았습니다.", "image_concept": "A key that fits halfway into a lock and stops, unable to turn.", "img": "data:image/webp;base64,UklGRponAABXRUJQVlA4II4nAADwjgGdASqwBCADPpFIoUylpKcrIROYiWASCWlu/+BkP9tsd+tzS6OLUP6rmB0r/hv2ic0bjbxykM4//if7XtWHgv7p+6X9a6Z7iXpP62VFHrj7/ebfaf6Pv0D7AH8K/nH7G9djzAfud65Hoc/yvqAf3b/pev16lXoAeXh7Mv9j/6fUAf//gsqEjsHkQha5Z7b8RbDTdbLUXFkVUxUhSSl/OxbPa9nB/z5Lpx8l04+S6cfJdOPkunHyXTj5Lpx8vMZiAaaMAx/z5Lt3Z2XSwMTVkLrCPVNQP10EqfhAD8srh2M/Z3kmfhUf8Ut+1ezg/58l04+SMEpfz5IpiRaCUull/QvTRFlSU+fJSnhHKrwCMEpf5meP+fJdOPkuo/wNxuDAMf8+SMMGQ+7a9l6ZDfjGVKQI/uXeqlbcpAx7ur2cH+WCEH/KwFF4bD0jOQuz0QXV12yXXglm2M2rBCDAMf9H4x7yyGJqyQpJS/q2Cq/XRRCkRvyIDkhudnB/0Ltiu17OEO8lmIS5601MVVfIS9eYwIEsG+GYFewx+fCYpxSWrKUv58TujmyEqs4Ly7jcRZaJYHWqMAc2VtUP0SpaDcH/Qus1ocFZmHpGH1ell0sv6D5a/4TuylL+fFLlG3gtumY5PtC7d5MbgwDI 격 협상의 근거가 되는 만큼, 경구 비만약 경쟁에서 릴리의 차별화 요소가 될 수 있습니다.", "strategy": "릴리는 비만이나 과체중이 있는 성인의 중등도~중증 수면무호흡에 대해 2026년 말까지 미국 FDA에 허가를 신청할 계획이라고 밝혔습니다. 파운다요의 적응증을 체중 관리 밖으로 넓혀 상업적 가치를 키우려는 전략입니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.prnewswire.com/news-releases/lillys-foundayo-orforglipron-significantly-reduced-obstructive-sleep-apnea-severity-reinforcing-its-potential-to-improve-health-beyond-weight-loss-302932877.html", "verified": "원문 직접 확인(릴리 보도자료, 2026-11-09)"}, {"url": "https://doi.org/10.1001/jama.2026.24080", "verified": "검색 결과 스니펫만 확인(JAMA 논문 본문 미열람)"}], "verification_note": "수치는 릴리 보도자료 원문 기준입니다. 관해 또는 경증 도달률은 매체마다 다르게 인용해 본문에는 넣지 않았습니다. 위약 대비 통계 수치(p값 등)는 확인하지 못했습니다.", "image_concept": "A single small white pill resting on a crumpled pillow, casting a long calm shadow.", "img": "data:image/webp;base64,UklGRmwqAABXRUJQVlA4IGAqAAAQtgGdASqwBCADPpFIn0ylp62rIZYYubASCWlu3LNk/8m/nr+RZ+2c8g8HaBug1dXqyWyy3zPJKeP5f2wfGMdx5l/jeb/7l+0fnf2cf9r9ffd55gfjl+vnzGfzP/d+tJ/qfXN/Z99R/tHqH/ud60/rV/5/Jlvh3n6u2/EP5fmE576kEfGcd6v2FUhL2snnq/AwooAg9X4GFFAEHq/AwooAg9rRHrMxWvwMrfZIzXoP9UcyrcVsSQBZ/huMuULeJCzQ31+BhRWdUU+VWaOMD1cry2pges9vV9uRvMaaUAtV2pOk3K3+DAwVQY7lkMezp5uIbDi2qVmYrX21SszIAt+YAq4FOM3rwGzCkA3RQBB6v7+2gYFExWyCFkx8nxeAvCE89gdar91ZhR6zMgDNb8zjVcBK9I41Pu32SUEvDmerSKvtBcogqV210CRxp1i71dlU3Z59VsSJBvdVEASifODEkWtrULKWrXs58ZUTrLVfgYZ0HkzcmgkE/09yQYK8zituKDdPnPZego7Rce5aqfQUP+tIrgQAABhRP6DDLF1GRqAU4N08twoxvmqmAYUlMH8/gYUTrLcJ5r8xuyrIwwx7IMFDlPZar7aDUhZ5C0I6wNvNlRD/OY3WhKv/Bucry2pq4PrPAPOU1euCPAALMz0UUAQestxhRP6Q1+BhRQAfz9tRipT2L3zTQh8RcMDCigCDZQCQdxNOsBQZ4u0rM5VqyHSlBIEL2FFAKigA8NpEroYeBhgxJM26mfbedR+Y4T1IXCCklpg3YtrgQRB9Xhg4tyN5jThrERBgYUUAQer7ckUFhoGConieY0zeW4P5/AwooBYKNxVkJTmnaYLHSrMbg8Jwbskn5zDl3qyCcG7I0KZ+FDYvJ7GH9Q8KZ+XqxzK7rT9wlJvzdRMVZDcZ9dg6vK+tXjP4fFyyBPHu3Kt+H6F7K7gJ+BgoSXtPUujogAs2h/crxnpTlfXDNS0CIzMZa1S/dQ1/hRRAv876Pr2ULB5Bej64lrB/kbh8iLljw2ATX7C9d0VYUNYbMYBRQA/Cfyq4UF6FxvxXYUUFNtqOiTxufS2mhKqW6xeIUNkdH6Snmx4Yugk9Ffjt6GiEc0dweGf0s02886Ep7pJcr0w .", "why_matters": "글루카곤/GLP-1 이중작용제 가운데 대규모 심혈관 안전성을 처음 입증했다는 점에서 허가 신청의 핵심 관문을 넘었습니다. 다만 심혈관 이익은 입증하지 못했고 중단율도 높아, 세마글루타이드·터제파타이드와의 경쟁력은 여전히 과제입니다.", "strategy": "질랜드는 비만·과체중 등록 임상 프로그램 SYNCHRONIZE가 마무리됐고, 베링거가 비만 적응증의 글로벌 허가 신청을 진행한다고 밝혔습니다. 개발과 상업화는 베링거가 단독으로 맡고, 질랜드는 라이선스 수익을 기대하는 구조입니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.biospace.com/press-releases/zealand-pharma-announces-boehringer-ingelheims-survodutide-is-the-first-glucagon-glp-1-dual-agonist-to-demonstrate-a-favorable-cardiovascular-safety-profile-in-global-phase-3-synchronize-cvot-trial-with-significant-cardiometabolic-benefits", "verified": "원문 직접 확인(질랜드파마 보도자료 게재본, 2026-11-09)"}, {"url": "https://www.globenewswire.com/news-release/2026/11/09/3398585/0/en/zealand-pharma-announces-boehringer-ingelheim-s-survodutide-is-the-first-glucagon-glp-1-dual-agonist-to-demonstrate-a-favorable-cardiovascular-safety-profile-in-global-phase-3-sync.html", "verified": "검색 결과 스니펫만 확인(접속 차단으로 본문 미열람)"}], "verification_note": "수치는 질랜드 보도자료 원문 기준입니다. 체중 감소 13.7%는 보조 2차 추정치이고 제2형 당뇨 환자를 포함한 집단의 결과입니다. 허가 신청 시점과 질랜드가 받을 마일스톤 금액은 공개되지 않았습니다.", "image_concept": "A sturdy glass heart standing unbroken on a weighing scale.", "img": "data:image/webp;base64,UklGRu4lAABXRUJQVlA4IOIlAACwbQGdASqwBCADPpFIoE0lpCMooPQ4WRASCWlu63kyr3vKALQLkrH8zmt9l587/hvTguP+l5eBHvdxnJ9Hn6v9gP9S/1768fmC/cL1zP9p6yf9Z6gH+G6iL0C/2w9O/2Tf7R/zPTE9QD//+2R04/a/F6MVfxfZiDrb1ghvK/+66NjMv4QCEbWqgEemd1NQExiFxvqagJjELjfU1ATGIXG+pqAmMQuN9TU7mMIlqAC+Ukn6mqoErZYvIu8R68DVNQAXyb6YBM88AB0BN3p3U1ATHvVPqagJjJ0mQXCYxC5Zu46ttb6mpJXWAMpQX1gCd6wlqAmTAXk8xciVFr3vAij42NLbmTKqfwl6bTGES08+IeLzGIVCcnBF0cGGusAReGR9W2t9TUBGN9g6NFCW3/CZZpjELjmbpndTUACPMq4uN9TUBMVmKwBGMAR9TUBMgweJfTupq0cb4v4Tro5HuOsATtEKhKg/nejcpvWtU1ARjcxuPU1C8xkTwNMYgB0BL2tTT0j6moALQmRsWwlQlxuZOujfYNnuVfnLo3xxIhcb6moANsLjBpjELjfU1ATGiz2md1NQEyYADoCbFySAl6xp6QASR7zlgMd4hcb6cWmoCYydJjEKkgIxvqagJjELjfU5Ofl48hcuN9UOQFnM/Jxm9G+nN6N9UedMmRsXRv+C7WgQpOukfShJcb6cWmjLdTl4iAsAS9Jb5BP//Ps8T7iE6qMv4 /* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){

function viewAbout(){

}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
</html>
