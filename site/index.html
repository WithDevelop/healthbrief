:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */
.hdr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:18px 16px}
@media(min-width:768px){.hdr{padding:22px 28px}}
.hdr .l{display:flex;gap:6px;align-items:center}
.hdr .r{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ib{width:30px;height:30px;display:grid;place-items:center;border:1px solid transparent;background:transparent;border-radius:3px;cursor:pointer;color:var(--ink-2)}
.ib.box{border-color:var(--rule-2)}
.ib:hover{color:var(--ink);border-color:var(--rule-2)}
.logo{text-align:center;line-height:1.05}
.logo b{display:block;font-size:clamp(19px,3.4vw,34px);font-weight:900;letter-spacing:-.04em}
.logo small{display:block;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;font-weight:600}
.cta{background:var(--blue);color:var(--blue-ink);border:0;border-radius:4px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta[disabled]{opacity:.6;cursor:progress}
@media(max-width:560px){.logo small{display:none}.cta{padding:6px 10px;font-size:11.5px}#insBtn{display:none}}
.searchbar{border-top:1px solid var(--rule);padding:12px 16px;display:flex;gap:8px;justify-content:center}
.searchbar[hidden]{display:none}
.searchbar input{flex:1;max-width:520px;border:1px solid var(--rule-2);background:var(--paper);color:var(--ink);font:inherit;padding:8px 12px;border-radius:4px}
nav.main{border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
nav.main ul{list-style:none;margin:0;padding:0 8px;display:flex;justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
nav.main ul::-webkit-scrollbar{display:none}
@media(min-width:960px){nav.main ul{justify-content:center}}
nav.main li{flex:0 0 auto;display:flex;align-items:center}
nav.main li+li:before{content:"";width:1px;height:12px;background:var(--rule-2)}
nav.main a{display:block;padding:11px 12px 10px;font-size:13px;color:var(--ink-2);border-top:3px solid transparent;margin-top:-1px;white-space:nowrap}
nav.main a:hover{color:var(--ink)}
nav.main a[aria-current="page"]{border-top-color:var(--ink);color:var(--ink);font-weight:700}
@media(max-width:959px){nav.main.collapsed{display:none}}

/* shared */
.lbl{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--blue);text-transform:uppercase}
.lbl a:hover{text-decoration:underline}
.lbl .dot{color:var(--muted);margin:0 3px}
.date{font-size:12px;color:var(--muted)}
.ev{font-size:11px;color:var(--muted);border:1px solid var(--rule-2);border-radius:999px;padding:0 7px;white-space:nowrap}
.ev.claim{border-style:dashed}
.t a:hover,.t:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
.pic{display:block;overflow:hidden;background:var(--chip)}
.pic img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease}
@media(prefers-reduced-motion:no-preference){a:hover>.pic img,.pic:hover img{transform:scale(1.035)}}

/* hero */
.hero{display:grid;gap:24px;padding:18px 16px 8px}
@media(min-width:768px){.hero{padding:18px 28px 8px}}
@media(min-width:1000px){.hero{grid-template-columns:200px 1fr 240px;gap:0}.hero>*{padding:0 22px}.hero>:first-child{padding-left:0;border-right:1px solid var(--rule)}.hero>:last-child{padding-right:0;border-left:1px solid var(--rule)}}
.hero>.c{order:-1}
@media(min-width:1000px){.hero>.c{order:0}}
.side article{margin-bottom:26px}
.side .pic{aspect-ratio:4/3;margin-bottom:10px}
.side h3{font-size:15px;line-height:1.35;margin:4px 0 6px;font-weight:800;letter-spacing:-.02em}
@media(max-width:999px){.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side article{margin:0}}
.lead .pic{aspect-ratio:3/2}
.lead .lbl{display:block;text-align:center;margin-top:12px}
.lead h2{font-size:clamp(22px,2.9vw,30px);line-height:1.28;text-align:center;margin:6px 0 10px;font-weight:850;letter-spacing:-.035em}
.lead p{text-align:justify;text-justify:inter-character;color:var(--ink-2);font-size:13.5px;margin:0 auto 10px;max-width:600px}
.lead .by{text-align:center;font-size:12px;color:var(--muted)}
.lead .by b{color:var(--ink);font-weight:600}
.latest h2{font-size:11px;letter-spacing:.14em;font-weight:800;margin:0 0 6px;padding-bottom:8px;border-bottom:1px solid var(--rule-2)}
.latest a.row{display:grid;grid-template-columns:minmax(0,1fr) 64px;gap:12px;padding:12px 0;border-bottom:1px solid var(--rule)}
.latest a.row:last-child{border-bottom:0}
.latest .row b{font-size:13px;line-height:1.35;font-weight:750;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.latest .row .pic{aspect-ratio:1;width:64px}
.latest .row:hover b{text-decoration:underline;text-underline-offset:2px}

/* sections */
.sec{padding:26px 16px 0}
@media(min-width:768px){.sec{padding:30px 28px 0}}
.sh{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--rule-2);padding-bottom:7px;margin-bottom:16px;gap:12px}
.sh h2{margin:0;font-size:11.5px;letter-spacing:.14em;font-weight:800;text-transform:uppercase}
.sh h2 span{color:var(--muted);font-weight:600;letter-spacing:.02em;text-transform:none;margin-left:8px}
.sh a{font-size:12px;color:var(--blue)}
.sh a:hover{text-decoration:underline}
.grid{display:grid;gap:26px 18px;grid-template-columns:1fr}
@media(min-width:560px){.grid{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card .pic{aspect-ratio:5/4;margin-bottom:10px}
.card h3{font-size:16px;line-height:1.32;margin:4px 0 5px;font-weight:800;letter-spacing:-.025em}
.card p{margin:6px 0 0;font-size:13px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card .m{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* synthesis */
.syn{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:900px){.syn{grid-template-columns:repeat(3,1fr);gap:0}.syn>div{padding:0 22px}.syn>div:first-child{padding-left:0}.syn>div:last-child{padding-right:0}.syn>div+div{border-left:1px solid var(--rule)}}
.syn h3{font-size:18px;margin:0 0 10px;font-weight:850;letter-spacing:-.02em}
.syn ol{margin:0;padding:0;list-style:none;counter-reset:n}
.syn li{counter-increment:n;padding:10px 0 10px 30px;border-top:1px solid var(--rule);position:relative;font-size:13.5px;color:var(--ink-2)}
.syn li:before{content:counter(n);position:absolute;left:0;top:10px;font-weight:900;color:var(--blue);font-size:15px}

 "date": "2026-10-25", "count": 14, "file": "https://bio.withsong.co.kr/archive/2026-10-25.html", "note": "웹에서 열립니다."}, {"label": "제5호", "date": "2026-10-24", "count": 21, "file": "https://bio.withsong.co.kr/archive/2026-10-24.html", "note": "웹에서 열립니다."}, {"label": "제4호", "date": "2026-10-23", "count": 21, "file": "https://bio.withsong.co.kr/archive/2026-10-23.html", "note": "웹에서 열립니다."}, {"label": "제3호", "date": "2026-10-22", "count": 19, "file": "https://bio.withsong.co.kr/archive/2026-10-22.html", "note": "웹에서 열립니다."}, {"label": "제2호", "date": "2026-10-21", "count": 27, "file": "https://bio.withsong.co.kr/archive/2026-10-21.html", "note": "웹에서 열립니다."}, {"label": "제1호", "date": "2026-10-20", "count": 30, "file": "https://bio.withsong.co.kr/archive/2026-10-20.html", "note": "웹에서 열립니다."}], "items": [{"id": "ai-deepnoid-cytopathology-jkms", "cat": "ai", "alt": "렌즈 아래에서 빛나는 현미경 슬라이드 위 세포 한 무리가 푸른 고리로 표시된 미니멀 일러스트", "title": "딥노이드, 위암·대장암 복막 전이 판별 세포병리 AI 연구를 JKMS에 게재… 병리 전문의 5명 평가에서 AI 보조 시 정확도가 76.5%에서 91.5%로, 판독 시간은 슬라이드당 약 100초에서 50초로 줄었습니다", "short": "딥노이드 병리 AI 성과", "date": "2026-11-19", "scope": "국내", "entity": "딥노이드", "what_changed": "딥노이드는 삼성서울병원·서울아산병원·세브란스병원 등과 함께 복수에서 채취한 세포를 분석해 위암·대장암의 복막 전이를 판별하는 AI 연구를 Journal of Korean Medical Science(JKMS)에 게재했다고 19일 밝혔습니다. 연구에는 전국 214개 의료기관이 제출한 세포병리 슬라이드 719장이 쓰였습니다. AI는 암세포 의심 영역을 시각적으로 표시해 판독을 돕습니다. 병리 전문의 5명이 평가한 결과, AI 보조 시 평균 판독 정확도는 76.5%에서 91.5%로, 전이 양성 탐지 민감도는 66.2%에서 92.6%로 올랐습니다. 슬라이드당 평균 판독 시간은 약 100초에서 약 50초로 줄었습니다. 회사는 아시아디지털병리학회(ASDP 2026)에서 갑상선암 유전자 변이 예측과 면역항암제 반응 지표 분석 AI 연구도 발표했다고 밝혔습니다.", "why_matters": "흉부·뇌 영상 중심이던 국내 의료 AI 기업이 디지털 병리, 특히 세포병리로 영역을 넓히는 사례입니다. 다만 평가자 5명, 슬라이드 719장 규모의 판독자 연구이며 성능 수치는 회사 보도자료 기준이라, 실제 임상 성능과 허가 여부는 따로 확인해야 합니다.", "strategy": "병리 AI는 판독 시간을 절반으로 줄인 효과를 앞세워 병리 인력이 부족한 중소 병원과 수탁검사기관을 겨냥하는 것이 현실적입니다. 경쟁사는 세포병리처럼 조직병리 중심 기업이 덜 다룬 틈새를 주시할 필요가 있습니다.", "evidence_type": "학술 성과(동료심사)", "sources": [{"url": "https://www.fnnews.com/news/202611190852596466", "verified": "원문 직접 rified": "검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://m.news.nate.com/view/20261118n27910", "verified": "원문 열람했으나 인코딩이 깨져 일부 수치만 확인했습니다"}], "verification_note": "논문 원문과 DOI는 확인하지 못했습니다. 한 보도는 논문이 10월 7일 온라인 게재됐다고 전해, 18일은 병원 발표일이며 논문 게재일은 다를 수 있습니다.", "image_concept": "A single precision balance scale with a tiny glowing microchip on one pan, tipped to show it falls short of a nearly full measuring mark.", "img": "data:image/webp;base64,UklGRkQzAABXRUJQVlA4IDgzAACQpQGdASqwBCADPpFIoEylpCa/oTIYm/ASCWlu/+e8P3+gA1/lquhLq1kWekqQzlP/E8Bc5Hovyi6fDrXx//Ueo253zdege9398f6V/4vuAfwP+a/q7/eu1N+zvqC/o3+K9dD0pf5P1AP9f6f3qc+hf5dPssf2f/nemD6gH//9vnpv+0v+o/uXiY/gP9p/fu8z7nKiV8s/PmSLkX+Z+IF+N/z7/Of2b1p+w3cD3H9AX3g+xfsD7Ykyb8b1Af8Z6cd4p/Y9QPygP8Tyc/YnsNhH+3hi9vGK8KUecuLzPtzPtzPtzPtxq2fF5n25n25n8xGXt4xlMbqAZC010Z4IGCh0o8m8z3zbLEy8ALPHveMlk/20QU3Jzn62bZtZgRl7e+jDbZBnm0YrwF3ef9AuXgMnrxXPsyBM4vMozl64G4PCkvNCzWzzYUect18xdOEtyHwGbrE2jFeFQSRwvbxiunhau/mf15jCP7sc3Ynm19GL3nnLi80K+cyknLeYYqcl/mbr3WEwBJnkFLArchzKPXIbXzE/6XzSTRHjSZbzXGMvbvXIdE/mM71owToLTPNhR5y4vNuo4xFPTS+jFeEy3PGK6eF4xYIZoulZciKy8z+YjL27z5VhLfS79ow4ajzlAUq3YunCW7F04S0Y3cJaK3jo0zacFHnLdMA4vWyqmIbXzE8qRSkTWcyc5cXTtMQoUuAfuSjpR5y5EAEZe2uPLLfm4rLzPr/sluyjRkPCVX/KjXfEoY0dm3GDKO9auVxjRRRS+oMdqZC6tqL7td3QeNAUoKYKwyQUo8m8zuPueN92euSX2T+Z36ect2Oi+LzPuOP7JbisWQ0vM+cIt+U/644l/ASpOINzT5zFfAFhSauCPRAtbvQfA5gG5IZGzhxP9kt3JR0oTsCMvbxldqIi6Bi6SkDp8vim7qTOtYgfAOmVeVqhV2Rw2kAj21sVwufIfeLRWwzofqsYxFWqqWE5wfdmc7GAPlJe23Ep+fMv3Nzb/Pui7ddfMwDckMnOXGEf5EAGO5uTaFrpG55630QOtJkSAvObLQ/77v1elpvPVEzCDv9l5ieepErXn6GNsFotwF3mjBTMj5gvED92gk5CCLwH+QEhPOF98cRe3jFeFKPJlmvFOJINRfgJg0D8PwVtgnqAnTLRdfSLq11HewW9lpAZ/PEUFnex6ooUGUwbDp6aiNI72zFL1H2xMy5NEHn4bBiIEx3OmXUdTgthLORvGak7eecZ68YbbPO8Bd4xXgLvGK8KtxJgKHLis/zIeHHkeoB3+lvlLbVsOVi5yjdrqJN6JAwYsrSi2IoW1pbXtJNcZvmbdk6l3u3BKwyIgqozB7nHte3nl8MXyGtzPtzP2aMkPbkIma8UePkZYMjTAAZRg2dW0UqTZHZ3OwwrjmN+JY4hPBIVOAZN0B8nc6M7nnXMrghJHUdAjIi0Idi6lOWgVTrZ55hrRw6pQucVc5ch/H4vJ80LdMA3TPQLDJEnBrHNrqDJoZ9ykHToyJ09si6e/o2tP32NDl5lrQsMCBdxj "alt": "끝에서 작은 안내 빛을 내는 가느다란 내시경이 느슨한 나선으로 감겨 있는 미니멀 일러스트", "title": "메디인테크, AI 로봇내시경 인티온 에스로 338억원 시리즈C 유치… 에이티넘인베스트먼트와 케이비인베스트먼트가 공동 주도했고 누적 투자는 약 622억원이며 수술로봇으로 확장합니다", "short": "메디인테크 338억 유치", "date": "2026-11-17", "scope": "국내", "entity": "메디인테크", "what_changed": "의료로봇 스타트업 메디인테크는 338억원 규모의 시리즈C 투자를 유치했다고 17일 밝혔습니다. 기존 투자사 에이티넘인베스트먼트와 신규 투자사 케이비인베스트먼트가 공동 주도했고, 스마일게이트인베스트먼트·에스엘인베스트먼트가 후속 투자했으며 케이투인베스트먼트파트너스가 새로 참여했습니다. 투자금은 11월 2일과 13일에 나눠 납입됐고, 회사는 연내 추가 유치로 라운드를 마무리할 계획입니다. 2022년 시리즈A 80억원, 2024년 시리즈B 200억원을 포함한 누적 투자는 약 622억원입니다. 주력 제품 인티온 에스는 모터 기반 정밀 제어에 AI 진입방향 보조(EndoPilot)와 병변 추적(EndoTrack) 기능을 넣은 로봇내시경입니다. 투자금은 제품군 확대와 진단에서 치료·수술 영역으로의 확장에 쓰일 예정입니다.", "why_matters": "AI 진단 보조가 소프트웨어 단독이 아니라 내시경 같은 하드웨어에 결합된 형태로 대형 투자를 받은 사례입니다. 다만 라운드가 아직 마감되지 않았고, 누적 금액은 기사 속 회차별 합계(618억원)와 약간 달라 확인이 필요합니다.", "strategy": "내시경 AI 소프트웨어 기업은 로봇·장비 제조사와의 결합 모델을 검토할 만합니다. 투자자는 이 라운드를 하드웨어 결합형 의료 AI의 가치 평가 기준으로 참고할 수 있습니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://wowtale.net/2026/11/17/268164/", "verified": "검색 결과 스니펫만 확인(본문 열람 시 403 오류, 투자사·납입일·누적액은 스니펫으로 확인)"}, {"url": "https://m.news.nate.com/view/20261118n02606", "verified": "원문 열람했으나 인코딩이 깨져 338억원·누적 약 622억원·KB인베스트먼트 참여 정도만 확인했습니다(뉴스1 11월 18일 기사)"}], "verification_note": "미확인 출처: 본문을 온전히 열람한 출처가 없어 스니펫과 일부 깨진 본문으로만 확인했습니다. 발표일은 11월 17일로 수집 기준일보다 하루 이릅니다. 회사 보도자료 원문, 인티온 에스의 허가 세부 내용, 시리즈C 최종 마감 금액은 확인하지 못했습니다.", "image_concept": "A single slender flexible endoscope coiled in a loose spiral, its tip emitting a small guiding beam of light.", "img": "data:image/webp;base64,UklGRjwyAABXRUJQVlA4IDAyAADwwAGdASqwBCADPpFIo0ylq68todN4WeASCWdu+9r/3L9YPFUNXJNOaNtSHjrMQ/0e4y9957+7/k3799sfxn9z+3f3jeSckzwDzZ/439XPcd+hv1U/8/yAfrX0tP7/6Av65/4fXP9E3+99G709/U99ADzlPWC/u/pg9X/048eHx3tf/HevWrmj4bqXxh/6bgnd28w72hzw8Jv8r0fem/gyHif/TzOi8Xn7+UtUtNSCorKP8+SD+fJB/Pkg/nyQfz5IP58kH8+SD+fKGEW3u3RY3MTHFH+fe9NLIG/Fx/k1Kg8TRvopLOPeWQ2vtOcG/rRSO7J5ieP87LMZeftFH8opxVgrFx/z5IP6L9QqrJdqOVV8M8IK/H7ur2ij0pgsos0xl6FEYQKDJR6gSks0/puPpZA3Ayec 드 연계 창구를 IR 경로로 활용할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.etoday.co.kr/news/view/2649383", "verified": "원문 직접 확인(포럼 일시·장소·참석 규모, 협약 내용, 정책펀드 운용사 5곳, IR 5개사, 고속도로 35곳·72곳 확대 계획 확인)"}, {"url": "https://www.newspim.com/news/view/20261118000379", "verified": "원문 직접 확인(11월 11일 시범 개통, EMR 연계 에이전트 중심 3단계 프레임워크, 수가 개편과 포럼 정례화 계획 확인)"}, {"url": "https://www.rapportian.com/news/articleView.html?idxno=242618", "verified": "원문 직접 확인(프레임워크·수가 개편의 세부 내용과 펀드 규모는 기사에 없음을 확인)"}, {"url": "https://www.medipana.com/news/articleView.html?idxno=422121", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "언론 보도 3건 본문으로 포럼 내용과 협약 내용을 교차 확인했습니다. 복지부 보도자료 원문은 직접 열람하지 못했습니다. 펀드 규모, 수가 개편 세부안, IR 기업 이름은 확인하지 못했습니다.", "image_concept": "A highway interchange made of glowing medical record folders merging into one road toward a hospital silhouette.", "img": "data:image/webp;base64,UklGRugpAABXRUJQVlA4INwpAADwkgGdASqwBCADPpFIo0ylq6OrIfNYYXASCWdu9/xhYRK/AJe2D3KeZPjB7booGLtRPjcxZuM/V6N7y3UVza+4s+v3/vm/8/1kfpP2BP8H5bfsI/tnoT87//n+vj/a78B6AHnTetD/mt//6ceP/4x29++rvQgGYNm5eYF69Zr+H/8zsE/1X0GQf/tzPtzPtzPtzPtzPtzPtzPtzPtzPtzPtzPtzPtzPtzPtzLXBhq+PC3CRRQrdjEPmDPH3e//bTLIrSLAIYHYJMgBgHIS8nc5g8iMuxY8fVlne/i9YTaSYMsxeZ9uZ9uaD/qnbk7FsACztydzlyLec2mKRt9JHUsmaep7t2LzSB/opdden8wC0VFIAW7eoyoVIAkA+80LO3M+3M+3WEU4ZEcwGRFIQhARluFI9Rl1JFE9aBucuL4mtppvqI66cuLzPr+xdNCyzGRqAbpv1iJIrkJeZ9vE1a6TIQcQCd/3Ef4umhWioo/7iSnYp0bi5o0RFbsYR+iHPBlP6v3JYG35nrRJzb/6/pit100eOxGMXfxPyFSAuK+bLl0nbTpy3XyxzfxeTZo+wbSBF105UL0dhk7kyB84WeK1+Nt/TFbkLI5cXmfbTLaYBINZrUTKf1QrciIFIAW5CDZqKPrphgv+3M+3M9fyyZDButxtFIEXXTlQurCzxWeJhHR/3u0xlaKXX0dWiOUUgRebIMf98unLi8y5UgBbjr4vM+3MuUvE5+QqL2xlaI6c0Uv75SRssz7cnc5cXTQrRUUgBbsXmXKkALchUXu9agW78YjLrpy4vM+2kbvzPX9MWAJM2EAJCEICMiihkP/62IQgIqUT7c0LO3M/MADl7/90agHClzGwWil10wXGdvGm2SK3IVIAYBoUiaFEddN/I2pFJM2EAJBqy3hIooVuxdNzAoL8vVpu7oQBn3qW5V5n25n3QziIB5JbANeI6XunziIsuT6HzSaWil1xxt9NCtyIgUYIuunL8e7g7zq420nlbDXBNYXmtV3TTL65NO/7N3hMnoC8hBUxt0Fnbmfc2IEivBl6+y/eYn4NUt7cY/TtkpIVPNI 계 239곳 이상 의료기관에서 누적 유료 처방 330만건 이상을 기록했다고 밝혔습니다.", "why_matters": "병원용 심전도 AI가 소비자 웨어러블로 내려와 가정 내 반복 측정 기반 1차 선별 도구가 될 수 있음을 보여 주는 데이터입니다. 다만 학회 발표 단계로 동료심사 논문이 아니며, 스마트워치 버전의 별도 인허가 여부도 확인되지 않았습니다.", "strategy": "원격 모니터링·비대면진료 사업자는 웨어러블 심전도 AI를 심부전 고위험군 선별·추적 경로에 붙이는 시나리오를 검토할 만합니다. 기기별 보정과 반복 측정 판정 규칙이 실사용 성능을 좌우하므로, 도입 시 기기·측정 프로토콜별 성능 근거를 요구해야 합니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://supple.kr/news/cmwly9zmfa1mctevdgk3xrt70", "verified": "원문 직접 확인(발표일, 모델명, 2211명·AUROC 0.907/0.895, 146명 반복 측정 81%·약 6%, FDA 510(k), 239곳·330만건 확인)"}], "verification_note": "보도 기사 1건 본문으로 수치를 확인했습니다. 회사 보도자료 원문과 AHA 초록은 직접 열람하지 못했습니다. 모든 성능 수치는 회사 발표 기준이며 동료심사 전 학회 발표입니다.", "image_concept": "A wristwatch whose face shows a single heartbeat line flowing into a small paper heart.", "img": "data:image/webp;base64,UklGRm4fAABXRUJQVlA4IGIfAABQUgGdASqwBCADPpFIokylpCcrIPHYOWASCWlu+F6ZRZj2xTV/XXeoc4Z2YlOv5/Aw37qjmX88ez3/few3+9eoV/bejt5i/269YH/peqT9h/yj+EnqTf63/qvYM/kf+8643+1/+L9qva51eNqlocOX8AJ6385gQ+bP2k1xD8N0R/g1Dao1OXLly5f+/y5SIbN1tSYC1ILFixYsWLFixYsWLFixYsWLFinnT2U5WtSJM8bmh8ouYM1GQMHqbdGyf46zsvC4Pyi7lKg/bj/UR9U0CBAfLWhv94KF959ixTzmp47gCbxJ07QARCkEncBNe5AY3+ee1ikFjGfLHw7ZcCiMLID5Yjn7F4wSYC1ILFnjsHdbUjbkOkDjw4n0/OQV2yebwTWog2Kefpzoplue/rDQIgjrZ7QMbixl4sgkdnJbLKoz5bGb6W63YGAsrEWjdbcF5HF6Vnx/Kzcpy5cLi285pXAi2M33ngRaTMsqiLEaUDSXeF8eCtRUMCBAfLatUAsqiLYzie8M79LsuV0P6QUM0SnTuIHqJP9paNKD7BITAWVLfhDjQf+gYedQkjND2NukYC2GuYpbrTOJ7LzWP/3SMh52bvvPp509lOGyZYmvA8aJS4eM+tqEb6W62pMBLoKGdlw96jLTpigW1JgQE+1S2LCGKFbaQOty7ozdyASC7tDIECBAUEVzDjAvewNJ/tqTAmjpR330t1DOOifyvD1tJiW2P+otjA8/KhpRGZyl80612/wRyeDwnXCrltkxGDN6A069NBbUI4nvDQQPkFXD3QgPvXuoHAQL+xgt1pQ4i7s9QAwh5gZifFeVKT4g6p7ys6eRbmTe0CMqZAgJoiU4R7LtLqcNllVKfSWPuN4rSaXbRz4x2/XJ+xaefS3W1I06DXhk1WZcremVQtqhHE94ZQTm/BqTAWSg1rk69sUtHM2tG7nZP10aQJxIvT+tkxif3L/BTyHnRpOiy/h30dnap9TfidN5dehN5rKw2fNbMujktuzn6ux04NidQWcwNElstOok1aoHAPRxPduFtSYC6aSuXDZMY+W1SYC05DGCmRArs4JJJCP87Om9l/eP1BmuQSd2EzFeVl/dS+Dq8VuHLcBn35rfiowk1M1wgFD60tKO9nnoIH8LFAodQZ 달러 조달을 발표했습니다. 구성은 마시펜캐피털파트너스가 주도한 시리즈A 지분투자 2800만달러와 제너럴캐털리스트 고객가치펀드(CVF)의 성장금융 2억달러이며, 누적 지분투자는 6500만달러가 됐습니다. 펜틀랜드벤처스, 킨십벤처스, 한화 등이 참여했습니다. 회사는 누적 환자 20만명 이상, 검사 75만건, 건강지표 2500만건 처리를 제시했으며 테스토스테론 대체요법, 폐경 호르몬 치료, 체중관리, 펩타이드 등을 원격으로 제공합니다. 자금은 대사·염증 등 진료 프로그램 확대, 전신 MRI·DEXA·관상동맥 CT 등 정밀 진단, 검사·병력·투약 데이터를 묶는 AI 도구, 임상시험 인프라에 쓰겠다고 밝혔습니다.", "why_matters": "전체의 약 88%가 지분이 아닌 매출 연동형 성장금융이라는 점에서, 현금흐름이 확인된 직판형(DTC) 원격진료 기업의 투자 구조가 지분 희석 최소화 쪽으로 이동하고 있음을 보여 줍니다. 다만 매출과 의료진 수는 공개되지 않았고 펩타이드 등 일부 서비스는 규제 리스크가 큽니다.", "strategy": "국내 비대면진료 사업자도 유료 멤버십·검사 연계형 모델에서 매출 근거가 쌓이면 지분 대신 매출 연동 금융을 검토할 수 있습니다. 해외 롱제비티 원격진료 모델을 벤치마킹할 때는 컴파운딩 의약품·펩타이드 처방의 규제 차이를 먼저 확인해야 합니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://finance.yahoo.com/healthcare/articles/hone-health-raises-228m-expand-144500695.html", "verified": "원문 직접 확인(PR Newswire 보도자료 전문: 금액 구성 2800만+2억달러, 누적 지분 6500만달러, 투자자, 환자 20만명·검사 75만건, 자금 용도 확인)"}], "verification_note": "회사 보도자료 전문을 확인했습니다. 성장금융 2억달러의 상환 조건과 인출 방식은 공개되지 않아 전액이 즉시 집행되는지는 확인하지 못했습니다. 환자 수 등은 회사 주장입니다.", "image_concept": "An hourglass whose lower bulb is filled with tiny glowing lab test vials instead of sand.", "img": "data:image/webp;base64,UklGRpYlAABXRUJQVlA4IIolAADwcwGdASqwBCADPpFIoUylpK4oINQIWcASCWlu6BJI25UjhGwoPU4+W/JQS/yfkGvsf9b1k/2bd7+b3zh/Tv/e9+X3pb/MZPHMMbefmXoLrM/28n4n6j2d/8OIfF99xgLjrAExiFxgLjrAExiFxgLjrAExiFxgLjrAExiFxgsh1fngeXsoDYlXXiFxgLjrqklgBGNvzSsATGIANAS9uohqNZ6oFMYCvKGO+CLfMxVwFpPGNvca9zD3QeYwk/23uOsUJjFSBgLjrPfyZ1amoCXs82iZEM7uOZulzyzyagJezybTuu7NxXukqs8moCdohcYC47Mqk09JfFt0YxC4ogBMYhcYIFzyG2FxRACYxC4wFx1gCYxC/AlmC+YdgHMwpTupo2sBcddU+8+wiGoCYxCpAAL45u2lIeYxCo7KKYwFyQVZVTUBMYhcYC46wBMVpanWiwDxgLjY1q317xjb3HSsQW3uOsA5ljEreXs8mno3BngKW2WBXBAod1lSltlimL3Dgi2cwUxgLjrA6wvk1JABsQuMBca920zuLzJqADbC4wFx1gCYxCo7ZT7s808ExWaDoCYxHl4nfBFtpndTUBL4c6moIYUtuAhOxbe4CltpndTUj/6l8W2XACYxC4wFeBqWoCYxCpKNEVcbbj95N5WvFCsIn/OPktYC5RSXMJBuOsARjbosItsuAExiFyKjN+6rCpM7i5m3a38jB1RdSSuLSU+BJ1mlVRd0NgS+OhJ/BgSSatu1tX0wFh66usrq5sAWGI9qLTAfbkcxbsckDZbe4 LD0L1EbscsoCTVNAavNxAAA"}, {"id": "dh-haii-sarcopenia-pilot", "cat": "dh", "alt": "새싹이 돋은 우유 그릇 위에 손 악력계 하나가 놓인 미니멀 일러스트", "title": "디지털치료기기 기업 하이, 2027년 1~3월 서울 구로·강서 복지관 2곳에서 60세 이상 40명 대상 AI 근기능 측정 기반 근감소증 예방 실증 추진… 악력·상지·하지 근력과 균형 4개 지표를 AI로 분석해 운동·영양 프로그램과 연결합니다", "short": "하이 근감소증 AI 실증", "date": "2026-11-18", "scope": "국내", "entity": "하이(HAII), 피에스플러스, 연세대 디지털치료센터, 매일유업", "what_changed": "디지털 헬스케어 기업 하이는 11월 18일 고령층 근감소증 예방과 신체 기능 관리를 위한 AI 기반 에이징테크 실증사업을 추진한다고 밝혔습니다. 실증은 서울 구로구 궁동종합사회복지관과 강서구 가양4종합사회복지관에서 2027년 1월부터 3월까지 60세 이상 어르신 기관당 20명, 총 40명을 대상으로 진행됩니다. 하이의 AI 근기능 측정 시스템 ‘근육첵’으로 악력, 상지근력, 하지근력, 신체 균형 4개 지표를 측정하고 개인별 상태를 분석해 운동·영양 관리와 연결합니다. 피에스플러스가 키오스크·측정 장비를, 연세대 디지털치료센터와 쏠루션이 8주 근기능 강화 체조와 주 1회 강의를, 매일유업이 식이 제품·영양 가이드를 맡습니다. 하이는 범불안장애 디지털치료기기 ‘엥자이렉스’와 근감소증 관련 기기 ‘바로리햅’, ‘차근’을 보유하고 있습니다.", "why_matters": "디지털치료기기 기업이 수가 진입이 더딘 병원 처방 시장 대신 지역 복지관 등 비의료 돌봄 채널로 측정·관리 서비스를 넓히는 사례입니다. 다만 대상 40명, 기간 3개월의 소규모 실증이며 예산과 성과 지표는 공개되지 않았습니다.", "strategy": "디지털치료기기·헬스케어 기업은 허가 제품과 비의료 웰니스 측정 서비스를 분리해 지자체·복지관·식품사와의 B2G2C 경로를 병행할 만합니다. 실증 설계 단계에서 근기능 지표 변화와 지속 사용률 같은 정량 성과를 미리 정해 두어야 후속 사업화 근거가 됩니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.unicornfactory.co.kr/article/2026111813213430772", "verified": "원문 직접 확인(발표일, 복지관 2곳, 2027년 1~3월, 40명, 근육첵 4개 지표, 협력기관 역할, 기존 제품 확인)"}], "verification_note": "보도 기사 1건 본문으로 확인했습니다. 회사 보도자료 원문과 사업 예산·주관 기관, 성과 평가 지표는 확인하지 못했습니다. 실증은 아직 시작 전인 계획 단계입니다.", "image_concept": "A small hand-grip dynamometer resting on a bowl of milk with a sprouting green seedling.", "img": "data:image/webp;base64,UklGRrIzAABXRUJQVlA4IKYzAADQDgKdASqwBCADPpFIoUylp7GtoZJI2jASCWlu/968Q5vlM+Zoqfg3bjFhhptOBZdhr3e1h+o+2PjAZ5MGbozvVfej+a/1w+ADxjPYF5hf2u9a30Y/53fQ/QA6X3Ix50XjvbD7nqEldNeTv8/NxVn66yh/3b03fsPPz/B6N/AlPFeF7PBDIaWJASAkBICQEgJASAkBICQEgNOusgSAkBICQEgJASAkBIBq6+N0wpGRi2sOtbTOCwqybha+4Ur0RHCLrZIDWU6b1m7N2cUgjTbu5R1qSEnktOSHj9SkEs0sSAk63xgFRSc2I/V9LICTaiCEGERlwRpt5/xVpmWqhgbHsJc1K21ljXPhshVtdymBdWfB4UlaNEgJVkBqvJ0VwVeeg/dLWiKyHfNk5WZ hy_matters": "11월 12일부터 해외 처방 GLP-1의 휴대 반입을 허용한 뒤 개인 반입분이 2차 유통될 위험을 조기에 차단하려는 후속 집행 조치입니다. 다만 점검 기간과 목표 건수는 공개되지 않았고 개인 간 거래의 실효적 적발에는 한계가 있습니다.", "strategy": "GLP-1 제품 보유 제약사는 위조·불법 유통 모니터링과 정품 인증 커뮤니케이션을 강화하고 식약처 신고 채널과 협력할 필요가 있습니다. 플랫폼·커머스 사업자는 비만치료제 관련 게시물 필터링 기준을 선제적으로 점검해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.hitnews.co.kr/news/articleView.html?idxno=80915", "verified": "원문 직접 확인(식약처 발표를 인용한 11월 19일 기사에서 TF 구성, 점검 대상, 약사법 처벌 조항 확인)"}, {"url": "https://dailymedi.com/news/news_view.php?wr_id=941139", "verified": "검색 결과 스니펫만 확인(본문 미열람, 1~9월 949건 적발)"}], "verification_note": "식약처 보도자료 원문은 직접 열람하지 못했고 전문지 보도를 통해 확인했습니다. 점검 기간과 목표 규모는 기사에 없었습니다.", "image_concept": "A magnifying glass hovering over a single injection pen lying on a laptop keyboard.", "img": "data:image/webp;base64,UklGRnArAABXRUJQVlA4IGQrAADQqgGdASqwBCADPpFIoEylpC2ioPI4ubASCWlu//O8p5vBEKAB//5/wXwVDPnOss1g2Yb23e+nXqeAkPf+k/8ob6bzIfzL0tvST/0N9A3o/+8ZO5M08b1dDGWzK7O5pl0LyKp2H2gzC/ZeiK8HwuPpql1U+KDmwfTVzSA2D6apfc4AfTVLqp8UHNhFXffXuD6apdUxHRTAynwrAfhYUwcT73udtTS9VPig5sH010EqpKzFeNM1KFCCbsYPyfBxAavdU+KDmwfapvHIq1VLqp+abPrnEBsSTMnu6aptx7gH01S6qfFBzV7qpQVS4GS4hwVX6aqt4MRIeT0WYAHZ8AY0Dc2Dqp8UHNg+89A2JJsqcIVsVXnIGU66UWQcQHt4lTrEnsbMkPig5sH01S6qfIDXAVNL9Q5iPeyC+zOJIEPia4DXrj2AH1Atap8eUunbVLqp8UHkRyoYKtx72QVM5YPSlbbDjVLqlv1xD5i/AyjJBlml+RD0uqnyS8j1DQPwD6aGJSkmbAin2mhkj6EvanxZaS/pql06IYTWqu7AD6apdOhD45uv01S6dCHpdVPig8ihhQLpaW26nE0vyQwoOr8HNg+m5k9iH/YAwwoyQ5sBztqaX6ap3UGw5zqobiUZvvFw1Nr0DNfVPjK7Jy8A+SAnSQ+KHGTOXUsP8skMKFFpJ/MSv01USPLTUzhowOXjktVPig3EE2GIkt9AhJuKAUw81T4WoIwqnJCnxQLoVztoSESEt1RDyXkLTVLqqi46mr91Lfsgqr8TysPS0EO0m9Yb94boynxQc1e6p8LHP6apdVPigXrgHyIepKeKvw8GJfkQ+U7yBiV+yHJQql6pZT7TVLe1aBS5Z4nQ0PTMCrKOVh27ElzC7KFgVZRyxJXbU+uyhXm9ot418Z4X31w3eZK5aNZLVLfsgqlwg8yyu2xE+De6c8y/ZTTjUeku6v9Qr3bHdiyhYCeErUSVaFiSuxynmoYsoNQnhIQgcWG18GKIjnEAq+5JPVMztA+/z+99NAplzxUhsQ80v0z/2b1cmLAderkqAKeflSO4v6sGzlpXJuGmnb7wj4oNw1gUkObB9SKPM4wB+DEbFXXfyGXmoMLqp8W+DADcvAtLLuEtFYmTDtqe5Q+aRCGIr3ss7Mp8KR  약제급여평가위원회", "what_changed": "데일리팜 19일 보도에 따르면 급여적정성 재평가와 기등재 의약품 상한금액 재평가가 12월 3일 약제급여평가위원회에 함께 상정될 예정입니다. 급여적정성 재평가 대상은 은행엽엑스, 도베실산칼슘수화물, 실리마린 3개 성분으로 최근 3년 평균 연간 청구액이 약 1,400억원이며, 10월 말 전문가 임상 검토에 이어 11월 말 소위원회를 거칩니다. 임상적 유용성이 부족하면 급여 삭제, 사회적 요구도가 인정되면 본인부담 50~80%의 선별급여로 전환될 수 있으며, 빠르면 내년 3월, 이의신청이 길어지면 4월 적용이 예상됩니다. 1만1,953품목 대상 1차 상한금액 재평가는 제약사들이 10월 말까지 낸 소명자료를 바탕으로 심의하며, 심평원은 11월 25~26일 원주에서 업체별 사전 검토를 진행합니다. 이후 통보와 이의신청, 내년 2월 고시, 건보공단 협상을 거쳐 첫 인하는 내년 4월 시행될 전망입니다.", "why_matters": "두 재평가 결과가 내년 1분기에 동시에 확정되면 일반의약품성 전문약과 장기 등재 제네릭 매출이 함께 흔들릴 수 있습니다. 다만 일정과 수치는 전문지 보도 기준이며 정부 공식 공지로 확인된 것은 아닙니다.", "strategy": "해당 3개 성분 보유사는 선별급여 전환 시 본인부담 상승에 따른 처방 이탈 시나리오와 이의신청 근거를 준비해야 합니다. 상한금액 재평가 대상 기업은 11월 25~26일 사전 검토에서 안정공급 소명 논리를 정교화하는 것이 우선입니다.", "evidence_type": "프리뷰/계획", "sources": [{"url": "https://www.dailypharm.com/user/news/344756", "verified": "원문 직접 확인(11월 19일 기사에서 12월 3일 약평위 상정, 대상 성분, 청구액 약 1,400억원, 1만1,953품목, 11월 25~26일 사전검토, 내년 4월 인하 일정 확인)"}], "verification_note": "전문지 단일 보도로 확인했고 심평원·복지부 공식 공지는 확인하지 못했습니다. 직전 호의 사용량-약가 연동 정례화 기사와는 별개로 약평위 심의 일정이 새로 나온 것입니다.", "image_concept": "A balance scale with three small herbal leaves on one side and a stack of pill boxes on the other.", "img": "data:image/webp;base64,UklGRv4xAABXRUJQVlA4IPIxAABQhQGdASqwBCADPpFIokylpKcoIRS4eQASCWdu/9K9cf/qAIkZP+QZnC/CXcfn/9LMX+37Gv4P/Lfu17d9p/vf61f8X44v1Pmf1n+vnrPeZfsH/o/qv+F97X+49SP6N/7P9f+AL9Z+k9+5v5HfAP9g/3J97z/ofsz7o/8h9wHyA/yX/I///9/+4T9AD95PTI/cz4W/7D/v/2m/8/vsf////+4B//+Dc9XWo9mx2R8Ah3faHYgeC3830d98yeJ8CIpr4PqLdEfWRMcPr+2dxCPrImOH1/bOHyQcKLdEfWRMcPr+8BR05zPx+Zmbc4/JB1cflb7FRffdzD5IOFFy96fj6yJjuSdgTXTDliuj6yKsD60qGEVgwRBlDYiY5McrYW82fgcbjtKJKoSIS9Rboj6vr50SdGkODE3SVWo3R9aVDCeIXH4BCvncF0FeZOQ4H2fjbsSY4gaj9tKC5UbrV2iylwXuboj6yXIYwL2bR9KAukDPoQs3EBKLT5IO4D8SgQe9mva9sKKaMIGxs7Oi/kiDAcZ7VDcRxD4plnMJBwot0lUxxGg4vEvzv5ISCLCi3RISgvexcezUnD4mMUzyJo/gJs/mqJuZil+E6I00+cvI3KzRCXtuQG27ZWDGtrqiot9QUP1iLIMXj2/kgy4M32JezEr1lIaO6OPXcl2BoLeGUWupiKQe5wFiTHHkBfSaphMczQfF9Ak3RHraThV5NZFU/2qrJJN8 했습니다. 회사는 gMG 최초의 siRNA 치료제이며 3개월마다, 즉 연 4회 피하주사하는 유일한 치료제라고 설명했습니다. 3상 NIMBLE 24주 결과 MG-ADL은 4.5점 대 위약 2.2점 개선(위약 보정 2.3점, p=0.0005), QMG는 4.2점 대 1.5점 개선(p=0.0015)이었고 MG-ADL 3점 이상 반응률은 76.6% 대 44.1%였습니다. 수막구균 감염 박스 경고가 붙었고 처방은 REMS 프로그램을 통해서만 가능합니다. 리제네론은 앨나일람과의 글로벌 라이선스에 따라 개발·생산·상업화를 단독 책임집니다.", "why_matters": "같은 주 알렉시온 클라이게파(주 1회 피하) 승인에 이어 연 4회 투여 C5 억제제가 나오면서 gMG 보체 억제제 시장이 투여 편의성 경쟁으로 빠르게 재편되고 있습니다. 다만 성과 수치는 회사 발표 기준이며 FDA 라벨 원문과 약가는 아직 확인되지 않았습니다.", "strategy": "국내 gMG 치료 시장에 진입하려는 기업은 투여 빈도와 수막구균 관리 부담을 비교 축으로 삼아 급여 전략을 세워야 합니다. RNAi 플랫폼 기업은 항체 대비 장기 지속형 siRNA의 상업적 차별화 사례로 활용할 수 있습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://www.manilatimes.net/2026/11/19/tmt-newswire/globenewswire/livsayis-cemdisiran-approved-by-the-fda-as-first-and-only-sirna-therapy-in-generalized-myasthenia-gravis-and-only-treatment-with-four-times-a-year-subcutaneous-dosing/2473630", "verified": "원문 직접 확인(리제네론 11월 18일자 GlobeNewswire 보도자료 재게재본에서 적응증, NIMBLE 수치, 연 4회 투여, REMS·박스 경고, 앨나일람 라이선스 확인)"}, {"url": "https://managedhealthcareexecutive.com/view/fda-sets-target-date-in-november-2026-for-cemdisiran-for-gmg", "verified": "검색 결과 스니펫만 확인(본문 미열람, 11월 목표일·우선심사 바우처 사용)"}], "verification_note": "회사 보도자료 재게재본으로 승인 사실과 임상 수치를 확인했지만 FDA 자체 보도자료나 라벨 원문은 확인하지 못했습니다. 약가는 확인되지 않았습니다.", "image_concept": "A single syringe beside a calendar with only four softly glowing circles marking a whole year.", "img": "data:image/webp;base64,UklGRkAvAABXRUJQVlA4IDQvAACw3QGdASqwBCADPpFGnUwltqmoIjJZmtASCWlu1/r5NrzM+OKNAHVs8ttCLyzjTu96IAi8cXOO098+J+IHf7/1XsDeEnzh/ZfcXP1bnxtPKb5qco/ueb9RjbM9T36A9gDn9eYbzefSJvOm9W5FXPU6u5fvjn6XjveHr5vel904RL8Lza1I375td/vkEz5Sovj6Ii4UqMKPREXClRfH0RFwpUXx9ERcKTDkp20PUoAfylB2RcKVYTQiaUdTKKJiLC42DAMXlG6Dse2jHAQaOuv1RbGevLhfoiLunr6tXEXClRfHup5RHs8wP9pSyLhSotjazaUqMK10i/j8yzQ4b/4kNYYjSbNKDfe3/B8ERRQ6RGxFFDggPTRflKi+PoehzASClB2RTmENdaUqL4+iItyXFQcAMBIKUBs2nLHvVskr9NE9VkXClRe1y8HY2Ox7cCw0OHZF4zeihztpSo6z9ERcKVSKFO7fj3C/Q9fqhMc7aPNjsi4PfmrrIv/1sWjrgVAbePIn+xsHDny5oT0LIwYg 에 반영됐고 나머지 약 3,000억원은 예비비 등 가용 재원으로 올해 안에 집행하겠다고 했습니다. 원인으로는 수급자가 2년 새 150만명대에서 약 170만명으로 늘고 1종 1인당 연간 진료비가 약 100만원 오른 점을 들었으며, 3월 약 2,800억원 추경으로도 부족했다고 설명했습니다. 2027년 예산 산정 방식은 3년 평균·연말 기준으로 바꿔 수급자 약 174만명을 전망했고 국고 예산은 전년 대비 약 2조4,000억원 늘어 최근 10년 중 최대 증가폭입니다. 의료계가 요구한 지연 이자는 전례가 없다며 거부했고, 12월 공청회를 거쳐 2027년 1월 의료급여 개편안을 발표할 예정입니다.", "why_matters": "의료급여 지급 지연은 병의원·약국 현금흐름에 직접 부담을 주는 문제로, 정부가 연내 상당 부분 해소와 예산 산정 방식 변경을 공식화했다는 점이 의미 있습니다. 다만 일괄 지급일은 제시되지 않았고 연내 전액 집행도 확약하지 않았습니다.", "strategy": "의료급여 비중이 높은 요양병원·약국은 연말 지급 일정 공지를 모니터링하며 단기 유동성 계획을 세워야 합니다. 1월 개편안이 중복 이용 감축과 만성질환 관리 강화를 담을 예정이므로 관련 사업자는 공청회 의견 제출을 준비할 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.dailypharm.com/user/news/344758", "verified": "원문 직접 확인(18일 복지부 브리핑 내용, 9,000억원·3,000억원·5,800억원, 수급자 추이, 예산 산정 방식 변경, 이자 거부, 12월 공청회·1월 개편안 확인)"}, {"url": "https://www.doctorsnews.co.kr/news/articleView.html?idxno=200111", "verified": "기사 목록 요약만 확인(본문 미열람, 연내 확보 의지와 이자 미지급 입장 일치)"}], "verification_note": "복지부 과장의 기자단 브리핑을 전한 전문지 기사로 확인했으며 복지부 보도자료는 확인하지 못했습니다.", "image_concept": "A half-empty glass jar of coins being slowly refilled from a small funnel.", "img": "data:image/webp;base64,UklGRuYnAABXRUJQVlA4INonAABQgQGdASqwBCADPpFIoE0lpC2ooNE4abASCWlu+BLLusCoHJODw5G58teT/fX6/+9fjZ1+nYnRj9KOep3L/K89roL83+1L0nfpj9cfgD/Ur1Gf9/9jvgP5hP3C9b70hf6j1AP5h1JHP2e0V/h+kA///BuTPexLEP87lAQWO5O2bkBZ7v5bR1ZdR4js6QXq7bhdKiuXtS8VmXi9NLxWZeL00vFZl4vTS8VmXi9NLyWXVKiQ3lbFWwbhPD6npB3fUHqHF6aXoOgKQG55cqrl7JlzXVGaOgigms0zfisy8Xpp8zV/d2YJ7aOgYuEdzBteEwr5p4bUApX9peKzLxeml4rQfO1V1JYbiL5Vvqc9qXmDC54Mn9CqnABkh1c0Vw53zWelfiszrtUeeAxjNKMaXmDC55JYMzMFZl44BpeF/1S8L/ql4pltLzBhc8BSq6gjpQKzQlsXlSKUY0vFZlW0J7nw6eZeH2No+lfxgzSjGeiZnFzCLoCp1lPUBJ4fX3rhhm58E6JmCuWeH9wmP1qXisy8W9ZlhFl6AUoxpdTmS+quzCwALyhFKMa2lhtpX9pdQcQ8y8W9ZlW9Qq+N1IY9AU6h6x7CeHx60qRbr81jlEgnmXXYpl5V4rMutiDbSdJ/HOtujGodABAzfp5l4vTdK9NMEt+F/1j3cUihF6C7FYfHopRjU6qw+S8VmVb4rWNurNSwZpYBuCPexjTEw6AxjNKMaXU57UvF+FzweGrS8wYXPAVQIKXhf9UvFZl4fSzLxfRn8Q9PD5bSw+AbcrOX0MW8KbG (11월 18일 기사에서 정부 1,500명 조사 95.0%·94.3%, 패널 구성, 약사회 불참·편의점 업계 제외, 복지부 전달 계획 확인)"}, {"url": "https://dailypharm.com/user/news/344647", "verified": "원문 직접 확인(11월 17일 기사에서 약사회 19일 국회 기자회견 계획과 3대 요구, 복지부 12월 마무리 목표 보도 확인)"}], "verification_note": "정부 설문 결과는 언론 보도로만 확인했고 국조실 원자료(조사 시점·방법)는 확인하지 못했습니다. 19일 토론회와 약사회 기자회견의 실제 결과는 작성 시점에 확인되지 않았습니다.", "image_concept": "A small first-aid box placed on a convenience store shelf with a long shadow stretching toward a pharmacy cross shape.", "img": "data:image/webp;base64,UklGRkofAABXRUJQVlA4ID4fAACQQwGdASqwBCADPpFIoEylpD+oIVDIU/ASCWlu3Ko7umUGjd++b1i3iwvCO9qOPUnHgsR6XBxtcqPQ3N/7D1ET2PRb7zy6eZf+b6vfUZ+XPYJ6HnmA/ZX1xfyA92P68+tn54Xsh+hB00H9/ydz1X/gtdPowV6Z+Y9B/guEp1DwZfsHoAzR/3vSH6e+ENj+HzxWZmL2QTzMxeyCeZmL2QTzMxeyCeZmL2hhmL2Rx0TxWZmL2a5KmBQERUjSQpqFUkXWDIrSgrWB4fqawZpSHJrBwlQht75cIZqWqwYcZx5f7gFfOPO7Zo934NpO0/4uL2QZIHjzM3q9kE8zMXBycfqawZpRjcc+A56i1D7RMQKHx/C3PECpHazO6mQyC54H054XV8MuT6mCVmkGpsepzy0LboyC5DLQeM4psLc8QKDILniq++U2W6efrBWZmL2QTzMxeyCfBBuMGaUZBcgT5j09qe3oMgueHjPnzvLf26FD2uxIjudZbKkinp+msGaV/bTnnh+UoFBkFzwUPei4aucluc5558CmZ+LFj79uekGQJB7U1gzSjIEg9qawZxptqYSQXBZo0cB9rMzF7IJ5gRhJRjac9PlOEmY9we1NYNMHzE87jlYPZSeM4pmc5WaUZBc8QJiuHqbapiVmZh9rMzer3Ch6J/STn94AVmBGsGaQJCAnQnmZi4KBQZBc8QK5DzMxeyCj11MKSGNZfq231Oe1NRdV7mmG+3PNamsaECgyC54ggl7InqzMxeww5EI5Kh67sgnmBGsGaYrsgnmZi9kDw/U1gzSjS6BQZBc8QKDOl2wwetCBQY3KGT3MxeyCeZmL2FnPTzMw5QoJ3TSPsHN+JbodCF508zMXsgnmaEJrm2nyAoFBkJnngdfiszMXvKgUGQXPAWhcJdcmNyzAWtzIJ5gX2sg5pZ0FB4fqawZpRkFgP1NYM0oyC54gUGNZuLFKglJ5mY2JKiBQC8wI1ehb8VmBGCc9PMzF7IJsz8W9dPv6OoLyM23raNIDBAoMgueITTbU4K9Z+KzLzTEubaszMXsgnh+msGQUKBl5A1vKa47ExiQVUzjabhT+YwZsyGnst+bJIHdQZBc8QacRMW8zMXozTFdkDx99Pq8E8zMXstt/9K6+HZxttlPXonk62sGaVXjNtILeZdUlc5WaUZBe+hnT2pr7czF6JM8TdZuPsGHcoDKArDuoe2PxJs0gt4f1FKPxAoMguhTyILT2rmWDNJ/Q4cdA3Pq2Z8AcJ5GDN6EX9xc5+u3OC09qawZpRdDdpvYVZNWji9kE2Ba+xHUgCLD4PdI/kG48nSxeSnMREw8FzxBBL2GSbMy6DiHhubamsE1AgAj+vTLQqRcmJt1+j+aNBPmcF+N3tImvXszgJnw01gkf5TzHEAOnrrvvTiOQfp+aamvxEhOGulGQm+dAfkmzSjG5eZfb8ZHPU9sKsO7kUaA8g7 점에서 초희귀질환 근거 기준에 의미 있는 선례입니다. 다만 외부 대조 비교 특유의 편향 가능성과 영구 청력 손실 위험이 있어 위험-이익 판단이 중요합니다.", "strategy": "초희귀질환 개발사는 자연경과 레지스트리와 확대접근 데이터를 조기에 체계화해 외부 대조 기반 허가 전략을 준비할 필요가 있습니다. 국내 도입 시 척수강 내 반복 투여 인프라와 청력 모니터링 체계를 함께 설계해야 합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.fda.gov/news-events/press-announcements/fda-approves-first-drug-shown-help-patients-infantile-onset-niemann-pick-disease-type-c-live-longer", "verified": "원문 직접 확인(11월 17일 승인, 적응증, 36명 외부대조 비교 수치, 혁신치료제 지정, 청력 박스 경고 확인)"}], "verification_note": "FDA 보도자료 원문으로 확인했습니다. 수집 기준일 전날인 17일 발표로, 직전 호에 실리지 않아 허용 범위에서 포함했습니다. 회사 측 발표와 약가는 확인하지 못했습니다.", "image_concept": "A small hourglass whose upper chamber is being gently refilled by a thin stream of light.", "img": "data:image/webp;base64,UklGRtoaAABXRUJQVlA4IM4aAADQUQGdASqwBCADPpFIoE0lp7EroPLoQiASCWlu9++Pq8gKZtI1K2jUtr2wvf47LIh7Qzx7JPpc3CvPK+oveld2WydxzPWteQXQs9kCmRQFwx0hLxU96SD3ZigLhjpCXip70kHuzFAXDHSEvFT3prcGkdQTHL6qNn6kRh4cd8965L9fOwtQJ8BniY+8d894xHOSDCaRQ7ekhAJMQKt3Zj1VL6UBtdvFJCgLhgIQe5wwpJH3ifknXoWDVFAXGkJ2EpKInLOIDUYgh4EhJUFg4CUIPd+5YsfeJ70kem9EYXt5eW3rLdcjCEhh14qDXmQLhkfs9UBcMdL5i3XDHSEyywey0tbB+fSGj3pI9JWgYUsQoLUhLxU61e0Huy59+CZ51CD3ZzHo0kolILzOKRwR1e9nHxjD/uthra3diLN7ZigLhjv6gIddTefbSSBcobBYGEMeGt+JyqOUaeA0em9EaHXAfRGh/V6J70kG9+aK62HQQfn1Z2q9sxQp3/zFwEK8d7KkX/CNqgXkWKAuGOkJeBmvrGiRtu6dA8lt43TlEInIAj/nK4BmOn3lwfCLJglZwQg92YoU40eWQIKAMuFQVWIwqpGxAwqyb/QxauAwKonGg/OCjrB7tDVzSze2IQNVfU+DpLhc9OcIdwqg1rYhjK7dDB6St6ekVE6S5GOdQj02Cbrg45LeXcEuRYsLR5qR5Zn+3F6V4Q2YsHxAR3AxIUmzgT1XtmKAuGAhB7uRV4SddzqpX1tyVnj5ofgsuZFj7KYJhJ1ltHC+RoWnUIY0goEXVIKflcwuNIQPFp4rPCz4ayD4wnBPD6ejmNRf/FRpHpx0MJciufgqqoLUcbsEm64OxqUImZ3+ThlIE5xOKXkLSYIEY867+EVWG4Y6RnPxVVSEj/GSDlrYPdyDkJW11P0nkKe9IqRtVAXLQRh5nqXVK+enip70kLBq70p5F9yexRuSTo4e/NFTj37nhEg2Ny55hpqdFQibuAIo9+wIYPUPh7QLf8c8ltC7krQAwkdIegjZa03svMwUwvYJN1HponOEX+2NkQWVe2cdvVOL5Ed43Mat2RdF8UswXIU+pehoQ5w9KIkR+iy/oIu7+boFXuvRyn0RKwM5zRKD2SanI0FeBWm+m/rMNtiGw38GO930Q4lII7G9NHJbU7b6qCyr2zFi4LAoA5mmED4Rnk+WuSS8bnOmxz0R bio", "alt": "빛나는 RNA 리본이 가득 든 주사기 하나에서 작은 방패들이 혈류로 흘러드는 미니멀 일러스트", "title": "화이자, 중국 스타나테라퓨틱스와 자가면역질환 체내(in vivo) CAR-T 3개 프로그램 라이선스 계약 체결… 선급금 3억3,000만달러에 마일스톤 최대 23억달러를 더해 총액은 약 26억달러입니다", "short": "화이자, 스타나 CAR-T 도입", "date": "2026-11-18", "scope": "글로벌", "entity": "화이자, 스타나테라퓨틱스", "what_changed": "화이자는 11월 18일(현지) 중국 스타나테라퓨틱스로부터 자가면역질환 대상 전임상 단계 체내 CAR-T 프로그램 3개에 대한 중화권 외 독점 권리를 확보하는 라이선스 계약을 발표했습니다. 화이자는 선급금 3억3,000만달러를 지급하고, 개발·상업화 마일스톤으로 최대 23억달러와 판매 로열티를 별도로 지급합니다. 화이자는 스타나 기술을 염증·면역·항암 분야에 쓸 권리와 추가 프로젝트 라이선스 옵션, 중화권으로 지역을 넓히는 옵션도 함께 얻었습니다. 스타나는 체내 세포를 재프로그래밍하는 RNA 치료제를 개발하는 회사이며, 화이자는 미국에서 임상시험용 제품을 직접 생산합니다. 바이오파마다이브는 이 계약이 화이자의 첫 체내 세포치료 진출이고 2025년 이후 최소 다섯 번째 중국 기업 대형 제휴라고 보도했습니다.", "why_matters": "빅파마가 체외 CAR-T 대신 체내에서 CAR-T를 만드는 RNA·지질나노입자 방식에 대규모 선급금을 걸면서 자가면역 세포치료 경쟁이 본격화하는 신호입니다. 다만 3개 프로그램 모두 전임상 단계여서 총액의 대부분은 조건부 마일스톤이고, 확정 금액은 선급금 3억3,000만달러입니다.", "strategy": "체내 CAR-T·표적 LNP·RNA 플랫폼을 가진 국내 기업은 중화권 외 권리, 플랫폼 사용권, 지역 확장 옵션을 묶은 이번 구조를 사업개발 협상의 기준으로 삼을 만합니다. 중국 자산의 빅파마 유입이 계속되고 있어 국내 기업은 임상 진입 속도와 데이터 패키지에서 차별화 포인트를 분명히 해야 합니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.biopharmadive.com/news/pfizer-starna-in-vivo-cell-therapy-autoimmune-disease-deal/875018/", "verified": "원문 직접 확인(11월 18일 발표, 선급금 3억3,000만달러, 마일스톤 최대 23억달러, 전임상 3개 프로그램, 중화권 외 독점권과 옵션, 화이자의 첫 체내 세포치료 진출 확인)"}, {"url": "https://www.biospace.com/business/pfizer-launches-into-autoimmune-car-t-with-chinas-starna-in-up-to-2-6b-deal", "verified": "홈페이지 목록에서 헤드라인과 요약만 확인(본문 미열람)"}, {"url": "https://www.fiercebiotech.com/biotech/pfizer-enters-vivo-car-t-space-3-program-26b-deal-chinas-starna", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "계약 조건은 바이오파마다이브 본문으로 확인했습니다. 화이자와 스타나의 보도자료 원문은 직접 열람하지 못했고, 총액 약 26억달러는 선급금과 마일스톤을 더한 보도 수치입니다.", "image_concept": "A single glowing syringe filled with tiny luminous RNA ribbons that turn into miniature shields as they enter a stylized bloodstream.", "img": "data:image/webp;base64,UklGRnQfAABXRUJQVlA4IGgfAABQZgGdASqwBCADP : "돌 아치에서 금 간 쐐기돌 하나가 빠져 떨어지는 미니멀 일러스트", "title": "머크, 아큘 인수(27억달러)의 핵심 자산인 BTK 억제제 넴타브루티닙 개발 중단… 독립 데이터모니터링위원회가 위험이 이익을 넘을 수 있다고 권고해 3상 BELLWAVE 3건을 모두 종료합니다", "short": "머크, 넴타브루티닙 중단", "date": "2026-11-17", "scope": "글로벌", "entity": "머크(MSD)", "what_changed": "머크는 11월 17일(현지) 저녁, 비공유결합형 경구 BTK 억제제 넴타브루티닙(MK-1026, 옛 ARQ 531)의 혈액암 개발 프로그램 BELLWAVE 전체를 중단한다고 발표했습니다. 독립 데이터모니터링위원회가 미치료 만성림프구성백혈병(CLL/SLL) 대상 3상 BELLWAVE-011에서 잠재적 이익이 위험을 넘지 않을 수 있다고 권고했고, 머크는 전체 데이터를 검토한 뒤 이를 확인했습니다. BELLWAVE-011은 2023년에 시작해 1,200명 등록과 2032년 1차 결과 발표를 계획했던 시험입니다. 이 결정으로 BELLWAVE-008, BELLWAVE-010까지 3상 3건이 모두 종료됩니다. 이 약물은 머크가 2019년 말 27억달러에 인수한 아큘의 핵심 자산이었습니다.", "why_matters": "인수 대가의 중심 자산이 후기 임상 안전성 문제로 사라진 사례여서, 머크는 2028년 키트루다 특허 만료를 앞두고 혈액암 파이프라인 공백이 더 커졌습니다. 다만 구체적인 안전성 사건과 손상차손 규모는 공개되지 않아 재무 영향은 앞으로 공시를 확인해야 합니다.", "strategy": "비공유결합형 BTK 계열을 개발하거나 도입하려는 기업은 장기 투여 안전성 데이터를 계약 조건과 가치평가에 더 엄격히 반영해야 합니다. 머크가 혈액암 공백을 메우려고 외부 도입을 늘릴 가능성이 있어 관련 자산 보유 기업은 사업개발 접점을 점검할 만합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.biospace.com/drug-development/merck-scraps-centerpiece-of-2-7b-arqule-buy-after-late-stage-safety-concerns", "verified": "원문 직접 확인(11월 17일 저녁 발표, BELLWAVE-011·008·010 3건 종료, 데이터모니터링위원회 권고 내용, 1,200명·2032년 계획, 아큘 27억달러 인수 배경 확인)"}], "verification_note": "BioSpace 기사로 내용을 확인했고, 머크의 보도자료 원문은 직접 열람하지 못했습니다. 구체적인 이상반응 내용과 손상차손 규모는 확인하지 못했습니다.", "image_concept": "A single cracked keystone falling out of a stone arch against a pale clinical background.", "img": "data:image/webp;base64,UklGRoAgAABXRUJQVlA4IHQgAAAwZAGdASqwBCADPpFIo0ylpK8loPLYWeASCWlu+/RcPu01tH+Gu8a71aD9pXOWc+zXOPGAcIbzAfsl6rHoW3nD0Hv2x64HIwKFPJn9EcfYATv/49A685tMx842qwhGiFxvqagJjELjfU1ATGIXG+pqAmMQuPAR0EXRvqagJjELeIjlE+pTXRhI7xKuq7xXxibove43oGqVieBuELAAI8Y31VSTl4iNt9TUGYM9YDHeIXG+NiKd6N9TRlR2GiBveg6FqQGuxWhMYf86VCWy5AaHCJakwQpeFwvWxdLNoCzfur7BxusOVUIEbwm6wDoCMb6mpIDsoMXeshoRN7wBBRyl2wbO6mpJXjrTFbJtrPDRP0YNMVmKwBO7BV2K4uN9Ob0b6moAL5NkXYhfgXuu4/KJELjAtL2mFELjBpjQ2PFKusJK6VcblN61rDrMdyZzkflQzC/KRCpDPM+N ed": "검색 결과 스니펫만 확인(10월 발표 당시 지분가치 16억5,000만달러 보도, 본문 미열람)"}], "verification_note": "완료일이 수집 기준일 전날인 11월 17일이며 직전 호에 실리지 않아 포함했습니다. 완료 조건과 응모율은 SEC 제출 보도자료로 직접 확인했습니다. 지분가치 16억5,000만달러는 10월 발표 당시 보도 스니펫 기준입니다.", "image_concept": "A single puzzle piece shaped like a pain-relief capsule clicking into place in a larger corporate puzzle.", "img": "data:image/webp;base64,UklGRvgyAABXRUJQVlA4IOwyAAAQnQGdASqwBCADPpFIoEylp6ooIXMomUASCWlultXjr5m/a4y1WeZ/qqo65C9B2n6BfXu/C9Q97zFvQ7jxgFRFZb3Te3HHbZ42uWnoFoH9l9sfGz6iTC/0k5vPSr5gH6y9PjzI+dB/o/WN/YfSA6kz0D+mZ/wmTgTrPGuUjccOjMBeEHRx86z63zt8QD/K8SDM0807SU9c+wp00PSJCyHbNEv4p3UGw7TVLqhZaqhZAzJ8STKYpdVPkiTVzOqI61Mg3xVLHoGJi9mhMGV6AY7rWB2k553dGJb0At3jYQWc0ecgtwdadRt8ILmsMXs+apdUr/gO01SbumqX+cgdD04q75Vw4o8h2vg3p9DsfCt8TTM3sWp8Lbh2bDtNY6Fqp6btYXlQNkDwcnlBGN8ql1VAwQO8RaHxza2DozAuCCGg6UBHfI6qp8ULLyyYbCC2V1l7XzHhWqF7AKvFKQ4geIXWSQkdz3NPl7EEHXW3ICZzXN6f4Zbc32I3FXky56bhc3m896fE2z3plVKr6auaYU4uumhs5Ow8q/qnxNgXnKhy6jFaCuHpR45xkvpql1VAxTJkgAXswv81S6qk2f0rSLDhtmQF5ZLTtoZRZdEJpfsr8jG+Q6PVDy01S9i8JIKFm8ccVw2715PpkunQh5pjI3xkC6aa6EOM6NgpSbq59GkfFHqYeRnpdWJKDzwAB1Xkmpm4u+ASuy18Ifx7Avac1YgYCGoV6HmwPa6lOw7/MARXNfwBn4+P2oVWEI5VfFqFc9cqwLArstrtrtYvS7rNeemrJJl+Ukw9QkDEF5DJi5Soj9RXbYYzz3K8ME3jO+V4X9HPo37O0u+Hlg4EUDg3qBgnQfKddu2P8NOuuIGYeAs1uriyF3IE2KFp4Wo/pGxoUgEAUWmm1Kma8uRH5y9kjI/ZOlrwYkxCL/nG/pqqURS8umqiS1U+KFawng/AR45cWqXn1lkVsCGPG6pPKe6g4KS6+AwxlaAoxEJOllQgkMQKXVT8gq/ns+DeW8kfJwzzEkQa+FS7pZ58dbrPPvimj3aimjKg67lhNkGRA3eqTxEpRmihfsriKtRc0jnnZsmw5VPlJVRl4IpJN9OubzQyZQfCkPUNCqaFvPl6HtXUSwRDfZZT2Y68V/lCSgnpLEmqC9NiEnOz6DN/ia1qezDGgJh1mG1gAl94OwJjPAvLKgPdxCQevN9hA2V09DeaZQlpihYe3VdE7mIWEqGAbERpaamB/2L3VmET49vuZ5uBiy6gnI/L8fEap3Yr0GCXDncv6ZnSkAgist+8fEsbJfZ+BzsDtV0ASBBBwQonGMVCUUxTnkLTg3NsmcniN9k3oiI/tIIkRuWs3P5TVsWclUvU004kOmplNOYHFBzoG7Ljf5neOQolsArkwP2RYRCJe2J5n90L9c643HHf4Z+EXycHvT5FYhCyKUpEBxkxDTd75GUFw77frKVS5k9Mzt3xwNFHjgZL6bP0EXVZQdbpNp53vwiIER/2xAlAKXViUzJdA0Dm2lAM9w89JQ1B0r8uRsC8ZxozxOXiA0c1Jf1W0+PgIvohhQsuu0RUuu+qUGXfWMJPlZa8Zqml2WG8t/0pbYmAhM6aDp0 를 더하며 발행가는 아직 정해지지 않았습니다", "short": "셀라스, 1.5억달러 증자", "date": "2026-11-17", "scope": "글로벌", "entity": "셀라스라이프사이언스", "what_changed": "직전 호에 실린 3상 REGAL 결과(중앙 전체생존 24.0개월 대 14.7개월) 발표 이후 새로 나온 내용은 대규모 자금 조달입니다. 셀라스는 11월 17일(현지) 보통주 1억5,000만달러 규모의 인수인 방식 공모를 시작한다고 발표했고, 공모 주식은 모두 회사가 새로 발행합니다. JP모건과 TD코웬이 공동 대표주관을 맡고, 인수인에게 같은 조건으로 최대 2,250만달러를 추가로 사들일 수 있는 30일 옵션을 줄 계획입니다. 공모는 2026년 3월 제출해 효력이 생긴 S-3 일괄신고서를 근거로 합니다. 보도자료에는 발행가와 자금 용도가 나오지 않으며, 최종 규모와 조건은 시장 상황에 따라 달라질 수 있다고 밝혔습니다.", "why_matters": "주가 급등 직후 증자로 허가 신청과 상업화 준비 자금을 확보하려는 전형적인 행보이며, 기존 주주에게는 지분 희석 요인입니다. 조사 시점까지 발행가 확정 발표는 확인되지 않아 최종 조달 규모는 아직 불확실합니다.", "strategy": "3상 성공 직후 주가가 오른 시점에 증자하는 패턴은 국내 바이오텍의 자금 조달 시점 설계에도 참고가 됩니다. 투자자는 발행가 확정 공시와 허가 신청 일정, 전체 데이터 학회 발표를 함께 확인해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.manilatimes.net/2026/11/18/tmt-newswire/globenewswire/sellas-life-sciences-announces-proposed-1500-million-underwritten-public-offering/2472541", "verified": "원문 직접 확인(GlobeNewswire 보도자료 전재본으로 11월 17일자 1억5,000만달러 공모, 주관사, 2,250만달러 옵션, S-3 근거, 발행가 미기재 확인)"}], "verification_note": "공모 착수는 보도자료 전재본으로 확인했습니다. 발행가 확정 발표는 검색에서 찾지 못했고 자금 용도는 보도자료에 기재되지 않았습니다.", "image_concept": "A single tall glass beaker being refilled with golden liquid right after a small celebratory spark above it.", "img": "data:image/webp;base64,UklGRnYlAABXRUJQVlA4IGolAAAwYgGdASqwBCADPpFIn00lsyoooJKYWmASCWlu6aowUTwn/+eCExBRUFP22GVoQ+RX1nkxfJd9D/gevL+/c+R+1Xv4/un/Y/Gb4KfsP+6nvYekf/keoB/xeqt9ADzqP/h7Tf9r/6f7jZnHM5bhOgd1L6bKXQnd0hsnHETwvu5nzPHgf68VjQe7Lly5cuXLly5cuXLly5cuXLly5cuXLly5cuXLl8OK6ODeguJgB0WaxiMjx9EImSMLd/UGkt5/Yf1XisaFnLCD3+XLlwvQg92Xh6KrkY6Ql5m52nLlbPhnQFqAuV0XEmvD0VjKkY6QmAHRWgg93EAk6IuBJqR5pvzxWNB7svD1a3SEzqLUBRWIte8VjR6a8bmoyFQFxo8MkEYxg92XLly5XDxZFtQF6zsvERgt6pwYx+fVtckGKqCDBsdpY4RM7HRWOuMGkNw0gedwyPqaZ/vjSg0k3IxCcJgmkqZuGB4xjB7s2NA0oCjLFtL7lJxmlk3pCSgR1Lvuyn1FVBBg0VjP+TanXvFY0JuPFY0Huw4Ej/aXsC/wrU0RpQGCO1CD3Zsf/rA9f8VKm8+ick1hZEpg0VjQep5y+qRt0NL42GY6QmBsY5zhGOjgkijQNIGU+X7PoTTanWETAl14LVwAn const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
</body>
</html>
