:root{
  --page:#f1f1f1;--paper:#ffffff;--ink:#111111;--ink-2:#444444;--muted:#8a8a8a;--rule:#e6e6e6;--rule-2:#d4d4d4;
  --blue:#37A8FF;--blue-ink:#ffffff;--focus:#37A8FF;--chip:#f4f4f4;--mark:#fff0a8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}}
:root[data-theme="dark"]{
  --page:#0b0b0c;--paper:#151517;--ink:#f2f2f2;--ink-2:#c4c4c4;--muted:#8e8e93;--rule:#29292d;--rule-2:#3a3a3f;
  --blue:#37A8FF;--blue-ink:#0b0b0c;--focus:#37A8FF;--chip:#1f1f22;--mark:#5a4a00;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:"Pretendard",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
.hero>*,.grid>*,.syn>*{min-width:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:99}
.skip:focus{left:8px;top:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet{max-width:1200px;margin:0 auto;background:var(--paper);min-height:100vh}
@media(min-width:1240px){.sheet{margin:28px auto;box-shadow:0 10px 40px rgba(0,0,0,.08);min-height:auto}}
.in{padding:0 16px}
@media(min-width:768px){.in{padding:0 28px}}

/* header */

 감염관리·치과 같은 특수 영역으로 넓어집니다", "body": "강남성심병원은 질병청 ASP 시범사업 재원으로 AI 항생제 처방지원을 구축하고, 서부장애인치과병원은 폐쇄망 sLM으로 진료기록을 자동화했습니다.", "refs": ["dh-hallym-huber-asp", "dh-dencom-dental-ai-record"]}, {"head": "국산 뇌졸중 AI가 미국 환자군 외부검증 근거를 쌓았습니다", "body": "제이엘케이 알고리즘은 한·미 963명에서 의사 판독 AUC를 0.718에서 0.852로 끌어올렸고, CTA 모델은 외부검증 AUC 0.97을 기록했습니다.", "refs": ["ai-jlk-stroke-ai-validation"]}, {"head": "세포·유전자치료 공급망과 백신 플랫폼에서 내재화 M&A가 이어집니다", "body": "맥스사이트는 GMP 시약사 아크론을 품어 소모품 반복 매출을 늘리고, 아스트라제네카는 협력사 옴니오스를 인수해 접합백신 플랫폼을 확보했습니다. 펩젠은 DM1에서 46.5% 교정률로 침체된 분야에 새 기준점을 내놨습니다.", "refs": ["bio-maxcyte-akron", "bio-astrazeneca-omniose", "bio-pepgen-dm1"]}], "priorities": [{"head": "GLP-1 허가권자와 처방 기관은 NAION 대응 자료와 환자 안내를 준비합니다", "body": "식약처 자료 제출 요청에 맞춰 국내외 이상사례와 라벨 변경안을 정리하고, 처방 전 안과 병력 확인과 시력 저하 시 투여 중단 안내를 표준화해야 합니다.", "refs": ["reg-fda-glp1-naion", "reg-mfds-glp1-safety-letter"]}, {"head": "비대면진료 플랫폼은 11월 20일 의견 마감 전에 사업모델을 다시 계산합니다", "body": "비만약 처방 금지와 약 대면 인도 원칙이 확정되면 처방 중심 매출과 배송 모델이 흔들립니다. 의견 제출과 대체 진료 영역 발굴을 함께 진행해야 합니다.", "refs": ["reg-telemedicine-notice"]}, {"head": "의료 AI 기업은 빅테크 에이전트·판독 플랫폼 입점 전략을 세웁니다", "body": "구글 제미나이 포 헬스케어와 마이크로소프트 정밀영상 네트워크가 유통 관문이 되고 있습니다. 커넥터·스킬 형태의 제품화와 파트너 계약을 검토해야 합니다.", "refs": ["dh-google-gemini-healthcare", "ai-quibim-microsoft-network", "ai-lunit-saudi-mngha"]}, {"head": "개량신약 파이프라인 제약사는 허가 수수료 인상 전 신청 일정을 점검합니다", "body": "자료제출의약품 수수료가 약 6.1배로 오르고 제네릭 확대도 검토됩니다. 복수 함량 감면 의견을 내고 신청 시점을 앞당길지 판단해야 합니다.", "refs": ["reg-mfds-fee-increase"]}, {"head": "병원은 수사·조사 대응 체계를 정비합니다", "body": "특사경 법안, 압수수색 제한 논의, 비정상진료 상설 조사가 겹칩니다. 전자의무기록 임의제출 절차와 비급여 주사 투약 근거 기록을 미리 점검해야 합니다.", "refs": ["reg-hospital-search-seizure-forum", "reg-kma-special-police-protest", "reg-chelation-investigation"]}]}}, "archive": [{"label": "제22호", "date": "2026-11-11", "count": 21, "current": true}, {"label": "제21호", "date": "2026-11-10", "count": 18, "file": "https://bio.withsong.co.kr/archive/2026-11-10.html", "note": "웹에서 열립니다."}, {"label": "제20호", "date": "2026-11-09", "count": 15, "file": trategy": "뇌 MRI 정량분석은 국내 뉴로핏, 딥노이드, 휴런 등도 경쟁하는 영역입니다. 영상 가속·정량분석·병변 추적을 한 패키지로 내놓는 흐름에 맞춰 국내 기업도 장비·플랫폼 업체와의 묶음 판매를 검토할 만합니다. 두 회사는 RSNA 2026(11월 29일~12월 3일)에서 시연합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.prnewswire.com/news-releases/cortechsai-and-subtle-medical-partner-to-deliver-faster-mri-with-standardized-quantitative-neuroimaging-302933797.html", "verified": "원문 직접 확인"}], "verification_note": "회사 보도자료 기준입니다. 금전 조건은 공개되지 않았습니다. 촬영시간 최대 80% 단축은 특정 시퀀스에 대한 회사 주장입니다. 이번 통합 구성의 규제 상태는 보도자료에 명시되지 않았습니다.", "image_concept": "An hourglass whose falling sand forms the folds of a brain.", "img": "data:image/webp;base64,UklGRpQmAABXRUJQVlA4IIgmAACQkgGdASqwBCADPpFIoUylpDGoITR4cjASCWlu8WjU+jpNaWnESlJHqxjN059z9pHvo8d98v0XTxzEenctuxz6M/F46gfmb87f0//5b0bupx3p3IzppnWJXTXo8Lc6H2rjl5EQSRwy8N0+R/hCboj6yJjiPV2pcCMIcvI9XamnyP8ITdEfWRMcQQYwBlHmANGEbeJ/FeDQOkR69saK4TlxmckPRYP+dtd4mJVPWsWEhrxaB/hCboi+D2ekIFKNPiJuIDVGrpsRLfBFhKyBHERhBWi1NdTm7YkHMYRLD2NJGR4RFizXx9e2mE0RmdQkzQNBbkZmZtTT5bQQlJgrdDEeOEafl9LSa6tN9Cbud2pp8SKv3F9PZNGSR/mXn0Jy4z0pxCGZ3Gzb1dmcw/46KmK6hY+gTdEetpNq6PrMURXr6cwHLnwylojLHhCxIcK8eaRGkm7t/ZuiaapNUDVxKLeAmx8EM7FQpT82p+V0LWB1nMXibtf98bSjd2v+E7EPiPV2pp8kPlfbYkxhyzBlCnEefOIDQ/4nPPb6f0Vtlz/hCbmffPI8P5YvjWiHFb8aC9F1rB9ZBTiJjiPWCxAE3t0/KBjI75pnnhSyJdfTnnjQsysiXewr/813b4iwY4kriLEHJiSPRHUrlXJubGuCvu9LHsgXXCCH3fwesLQdzwl8C6Cxdc9zp51VlivQXxIE4abVlnBqjBBiH3b3ccUCE3SxGTYAJVmI6AWF2sMlPS/IujWCXEXXcPdsHv3TKkpZYAMDARdt92VR/9/nO6nx9FzrygEULJyeSTI9IHGQ2qKsi6EX6jy0Zxq88x7nsI5GyNJtZmgmmKWOr8+gy5n2HnkLzoH1j078MAKH6fT88MZ6OeA/PxBvPNXq50AG7NrFsk6iD72NIDrYZrEfXjLSve+1tvRVnXJOlM4+/oMzhR5MSQQvCggZnyAyCqh6pQsqK6ePVwgkNHYNYbUlNXGQtbRpTBVoR6udyRV0VA+PTPX934J12FEpKsT1h8yLKgH6etwrQhv7GORMtPvZR5PTnECTO6gyIW9NQsgSaC0GnV7ZdATb7xRScnfO42nHdf7kcTWXmGtespeWEgk9NnFFxZmLcLuqCIkp0GS81qjQsdx5AUpK1rWLwzQ7hLO13sD27lMhNnI292tHW0FsXJWhHq54UsiZOf05Xy4Lxgxk8pU6n9ihRKZPBgJVFCQ3c44oZVCmKvery3RH4BELrHzxnWqLU0qwN9RSL8Apk2vzejhfAYPW09MOa4KANU8swep2HTxNwrISL9zuSD/iY4j1dmcwXTSut31zPxRLeigshLb2QqJIk1 werScribe 판독문 연동", "short": "퀴빔 MS 네트워크 합류", "date": "2026-11-10", "scope": "글로벌", "entity": "Quibim / Microsoft", "what_changed": "스페인 의료영상 AI 기업 퀴빔이 FDA 510(k) 허가를 받은 전립선 MRI 분석 소프트웨어 ‘QP-Prostate’를 마이크로소프트 정밀영상 네트워크(Precision Imaging Network)를 통해 북미 의료기관에 공급한다고 AuntMinnie가 11월 10일 보도했습니다. 분석 결과가 마이크로소프트(옛 뉘앙스) 판독문 작성 소프트웨어 PowerScribe로 넘어가도록 연동합니다.", "why_matters": "영상 AI가 판독문 작성 도구 안으로 바로 들어가는 유통 경로는 개별 병원 계약보다 도입 장벽이 낮습니다. 마이크로소프트가 판독 워크플로를 쥐고 서드파티 진단 AI를 모으는 플랫폼 구도가 강해지고 있습니다.", "strategy": "국내 영상 AI 기업도 북미 진출 시 판독 소프트웨어·PACS 플랫폼 마켓플레이스 입점을 우선 경로로 검토할 필요가 있습니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.auntminnie.com/imaging-informatics/artificial-intelligence/news/16425030/quibim-quibims-prostate-mri-ai-joins-microsoft-imaging-ai-network", "verified": "검색 결과 스니펫만 확인(본문 미열람, 접속 차단)"}, {"url": "https://www.accessdata.fda.gov/cdrh_docs/pdf24/K242683.pdf", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "미확인 출처: AuntMinnie 본문이 열리지 않아 검색 스니펫으로만 확인했고, 퀴빔·마이크로소프트 공식 보도자료는 찾지 못했습니다. FDA 510(k)(K242683)의 허가 범위 중 병변 검출 기능은 원문 확인이 필요합니다.", "image_concept": "A single puzzle piece clicking into a larger glowing grid of interlocking pieces.", "img": "data:image/webp;base64,UklGRmw3AABXRUJQVlA4IGA3AABw9QGdASqwBCADPpFIn0wlq62oIvLIobASCWlu+AJuh5a54fJr66Yq/Kf+BzrYfuiwjDcpbjjyujv7/475w/T4mZ9TPPF82zN+nbOz6if0N7AHmX9NfmN/a31xPSD/gvUA/2HUqf1D1EfOs9Zj/F/+Hg/+mf8M8ynX3LpBNXOn2nxAv4fzCo8mxjVl+gmNv8B6Ef+u9YfwZE1TOfEcNZ7/JEvkWtWEr864tVw0zhERL4/9Dbk0aZvUvnjpuI9mcIiJfIkCou6UV1j1k6wzOCmeScFshcRSJCu/Ue4o/zZa00HqzgIV/b20OPuwx4VgLhpnkh1y/UvdmeYUe4pFdMQAOpYgrO2WpiXyCrTWV0wmKE7gPUwQrnw9YUWNT5IGxJ3fh6j3JsEIfQAS6iIPBTZBLzSM+PGqaparKGFL45ZinfLfuSBptzEdWOgx9bAPsPwgy2IKUmkykNeoCDgC5zkTXh6oTt52PbtqCgq8h/lkt/mVQIG6B7IKTGZ0RL5BU6XP14puTpfO4D2viHdjITA54zrW3/OEnX3qb/VsKLJLDj2iLrRFaV5UpyTCPDq7qaKHEBwIRES+OT4tZdYqADhUINiXyC5ROI8x9uIl8iQKSXDlmKc/+OyKy2Qb2KmgZJtdwVaPjEAEB5OEvUkE0Gprrt5cY+YLF6NqcJDTTfGmuItWb5BAb1F3AdSc7bxLJqFx+dAZqmoNj6dNduXEJW/WoDiz5g6aIDHjw60fGXInigismM7GUJwp DLuHgAAA="}, {"id": "dh-dencom-dental-ai-record", "cat": "dh", "alt": "부드러운 빛의 말풍선을 비추는 치과 거울을 그린 미니멀 일러스트", "title": "덴컴, 서울시 서부장애인치과병원에 치과 특화 sLM 기반 AI 진료기록 시스템 정식 가동… 11월 3일부터 폐쇄망 운영", "short": "덴컴 AI 치과기록 가동", "date": "2026-11-10", "scope": "국내", "entity": "덴컴 / 서울시 서부장애인치과병원", "what_changed": "치과 AI 기업 덴컴이 서울시 공공병원인 서부장애인치과병원에 AI 진료기록 시스템을 구축했다고 10일 밝혔습니다. 병원은 10월 28일 시연회를 거쳐 11월 3일부터 실제 진료에 쓰고 있습니다. 치과 특화 AI 엔진 ‘덴스퍼’가 문진·진료 대화를 실시간으로 분석해 전자의무기록 항목별로 정리하고, 음성 치주차트·마취기록·보호자 상담·다음 치료계획 작성과 청각장애 환자용 실시간 자막을 지원합니다. 원내 설치 소형언어모델(sLM)로 처리하고 폐쇄망에서 운영해 데이터를 외부로 보내지 않습니다.", "why_matters": "앰비언트 AI 기록이 치과와 장애인 진료라는 특수 환경으로 넓어지고 있습니다. 기기 소음 속 음성인식과 온프레미스 sLM으로 공공병원의 보안 요건을 맞춘 사례입니다.", "strategy": "공공의료기관을 겨냥하는 의료 AI 기업은 클라우드 대신 온프레미스 sLM으로 보안 요건을 충족하는 구성을 검토할 만합니다. 덴컴은 취약계층 진료기관으로 공급을 넓힐 계획이라고 밝혔습니다.", "evidence_type": "기업 주장", "sources": [{"url": "https://aitimes.com/news/articleView.html?idxno=217208", "verified": "원문 직접 확인"}], "verification_note": "회사 보도자료에 근거한 AI타임스 기사로 확인했습니다. 시간 절감, 인식 정확도 같은 정량 성과는 공개되지 않았습니다.", "image_concept": "A dental mirror reflecting a speech bubble made of soft light.", "img": "data:image/webp;base64,UklGRsouAABXRUJQVlA4IL4uAAAQfAGdASqwBCADPpFIn00lpC2roJfYYbASCWlu/9pnP/9ldknlZNS29hXdWpM96Pe3c3HPlIIOkWyg9DJG8M7cg88pp29PwzxWtuww7K8sr38pvlxqF+1f9r4su962r/feg17bfXf2P9hWbF9oaBeEpoE+KRoG+tfYa/n/Vh/dYFdfci2zGASNrfWAIrJ1qowC4Y6wBFZFtmMAuGOsARWRbZjALjS3lz43Wc/+A8VkZJPgTPsOaiDLHb9JhcO77TTPRUT5OoVcrq2CfcIY6UGKGbLF/SSPgZE5Jm/1tiF/+yA8WbP/DU+vSIyhxosxXDHSm1GyYFySt6AEBzd2NAp1CDAUttCpl9b18fhpZFSJNMIdDjVnHsC4Y6vzoBuh3xRQtygolpGAXFLQ2JYFw2rALg5Q8sjMBS2cGPphiShJIDgI3OsAVnD0g+RQzawZ47fspiapAqDBg2rp3O0epDoCKyMkl20KGH8Uthh5LWFx9McqoMgGg32m+xbBabm7dcr/vk3n+akcau/JvVIdDYQx30t6x1dYXMw9mKHARWRERj8ahqdxWRbODIaWdBvqg77CNQBGTbvbwAMdV5WID15W3om9SUp83K2blMVPqjALZ7fWwbT7PthS5aO0m5ed7og5Zyr6zQ8LliuD8TwPCltiOVPqih0nc/D8YocEMcpUAzD3lpqY/QJavoCTjpeY/eraVsdwQx1sssVkREL3SVmrH/HQGAj9Lc1iq8IjWxIB9WRkRCVRqS4lwodXGQM3z1dXVRtUac1er6ocBE79yFtK8WSroagH5qXARWkhOHmst6yBjAMEe5sVVXSOhI8v3 : [{"url": "https://www.mfds.go.kr/brd/m_99/view.do?seq=50485", "verified": "식약처 보도참고자료 게시 페이지를 직접 확인했습니다(본문은 첨부파일로만 제공돼 세부 내용은 미열람)."}, {"url": "https://view.asiae.co.kr/article/2026111108180477982", "verified": "원문 직접 확인"}, {"url": "https://www.m-economynews.com/news/article.html?no=72870", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "식약처 게시 사실은 공식 게시판에서 확인했고 대상 성분과 조치 내용은 언론 보도로 확인했습니다. 실제 허가사항 변경은 아직 확정되지 않았습니다.", "image_concept": "A sealed envelope with a small eye-shaped wax seal lying on a pharmacy counter.", "img": "data:image/webp;base64,UklGRoQfAABXRUJQVlA4IHgfAACwYgGdASqwBCADPpFIoE0lpDSxIDLokpASCWlu//I9z1N6C+TOIDLbk/qn/TmeNF+2beXsd/sp6NIA5jel+kfcR8+p57F9G5GrPSt+oEH1/ET/g6PPCbwsi6szMXpneKzMxeme8WYvTO8W9iIZmaDKAmXtPeLMXpneTApYMhijletneKzP+fssPLbB96FUh2ox5mHPGv26FD2xEU8pQnKBZ098M6QIVd6MvahznQFl5gHmZb8Bkyfm+E82cSTvwufqRwrM3lqt8WjhfhcdixndTn1cLobqnIANsVW/Qc9KAOFx+kbCh2uXtP0zfUMyFN4lAXt64Ze06c56eYEXizwgHf6ATMvBnUKKDKHYCjGd4rMzD6WYEXiszMobn2MJ1eL0pNQxIv0tmmRVyvTO8VmbzDMGZl7TwZEMTunmZi9KLCP5vqdEBI/RJdqwCjRakgc7y7f0kjjoORCYXWxihrBNHTFBlaszWNEnA6qTtdk7xhh6xJ+5M04hTSe/WYEXoOgS6U8IuXAewQJnYs88FVvYPWU/6BBMYO/GrVgWmbEPF3v3lfKRb8WVuG9vxXru30HZ0cuA/nWyVL8uv3FRe8zK7FMtloDFK5DAs+ucUoZMMfEGsIHFeio5uCYhv8twSK4IlnPTOTB3hWvsGDTSCreZowgqVCveddoF2g6DRJD8BhqWS6fRtvb6nPafp+a9J8zl9YoB9jeC66ADPTzLu0zfisz8g8u2coEwE4gSCeYEdHAEyyaMoJhdVoE1cPG2fYRMvafp1clzVjIAdnimU4bsNtl5bKwTL2SbZ0heQAYuC2EgnGIbOU+pS5SEE8EYYBRjO8WHyHyNr06o2b5Jhd9XHZ6dUbNt0wu+YjtCuRdm20iD58ai+vkd9U1ayjLFm/hst9/SoIOhTGF+vXmLeszebk0HdzLKCTzgLoUe5f9c8S2xaQ8sE1FhzNDm2etI4Ap6+ZisLmFcD6/PKU+DIaBs59XC5xnUeTqeCW+rg4KpTfOLsFDT7J5iITe7q+bzvuRPFikMh3/44sqf5B+BXBdcYanLk4bSkGVBLipCBCZLPSPxTLcwkS04Vzz277jQBteJ1pmflbpBwGBDoFN0xQsrXoy1HsMApHlHD7U7jBIbcfTsIGOdujOUi1hOeyJ9vxWH53is7ty6y6DUKFzpBARTFz07fowbINZs+YjEn54quy2yV+3FiyOdbSegGQh/gSAgsDwcngmzhIVv02vxIrVFnnXp5l3CZG8I12108zMPIGi8jol44iACXhOtivznf/mWk4JPVHjMm2vAcH2xM3JjtLq0kgFLR5f2ZNlyTGXP5hHKLXRFgFGNb+uh/QxOKqy1aHIW6XPOdVXCy8sO/OeWXWV0Gysxb8M856CLkMASMpwJ+I6TySiRhERpa6r 실적 기반 의료기관 추천과 본인부담 감면 유인을 할 수 없고, 중개실적 상위 10개 의료기관을 보고해야 합니다.", "why_matters": "12월 24일 본사업 시행을 앞두고 비만약 비대면 처방이라는 플랫폼의 핵심 수요처가 막히고, 약 배송도 사실상 대면 인도로 묶였습니다. 플랫폼 사업모델과 약국 경쟁 구도가 직접 바뀝니다.", "strategy": "비대면진료 플랫폼은 비만·탈모 등 처방 중심 매출 구조를 다시 점검하고, 11월 20일 의견 마감 전에 배송·인증 요건에 대한 의견을 내야 합니다. 약국 체인과 배송 사업자는 전용 용기와 대면 인도 운영비를 반영해 사업성을 다시 계산해야 합니다.", "evidence_type": "공식 발표", "sources": [{"url": "https://www.dailypharm.com/user/news/344409", "verified": "원문 직접 확인"}, {"url": "https://www.kpanews.co.kr/news/articleView.html?idxno=548611", "verified": "원문 직접 확인(금지 성분 목록과 배송 규정 확인)"}, {"url": "https://www.bosa.co.kr/news/articleView.html?idxno=3016100", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "복지부 행정예고 원문은 열람하지 못했고 전문지 2곳의 원문으로 교차 확인했습니다. 약사공론은 ‘비만약 7개 성분’이라고 썼지만 본문에 나열된 것은 6개여서 6개 성분으로 적었습니다. 의견 마감일 11월 20일은 보도 기준입니다.", "image_concept": "A small parcel box with a padlock, waiting on a doorstep that a hand must personally open.", "img": "data:image/webp;base64,UklGRp4hAABXRUJQVlA4IJIhAAAwdwGdASqwBCADPpFIoUylpCqloXPokVASCWlu2LnyT/qiOnCv/94RBe7nQLOgThN3ZWzBufsH7bTLc+PtnNLsgelv9Cb2n+0egrzlv+J64N6A9BHpo/8Jk7VFOV0PfulM637laIDxQQMUt4Ut4Ut4Ut4Ut4Ut4Ut4Ut4Ut4Ut4Ut4Ut4Ut4Ut4UukzQ0NytSrrvu5ebxixDblNC42D42D4uqxLM5ixDVZhSS7n+V+wqFyb3wG36V0+7Up+AHxeC8KW8KW6eJT2qpneAkC8KW8KW8KW8NyTYD/mScmJy8t4J0+wmfcgvCmHidyENy5Kdg+Ng+Ng+NX1hx7hXTcee7reCfvPOVEpfeecuNhJzjnjFeSBS3oiUJy4vBeFYd4wUY54lQuucVzI9jV7nMV4UuIauLeNHsJo/eGpneFJjgBIA/yUQSxW2+0Vpo65/GwdEpbwmauf2+jxsc2D41fWk+EuWwnxCWwmjfFwVBbbR6FxsHxq6Gf42D42FGcbILjYPdwALwpbwGSHNXQcb24Lp4lPZUawfHIB9kClvClvClun3ao+4kltiK234bHKdgdYEeScx9kF4cBxbYOCunbI/u4AcFeFLghgKI2PFaD85DmwgPQ59+53aVnlYDgrrXdh6amz/pxVShnu5E12GdY0QJ7see5VgWBXW5Nh1jSvTmHsZf2GzlaiM1T6MunBkqfxxsc2MuuOQL4lUksf0gUrar3IYNEj2LNLDM9yvBgu+8Gee5VgWAxE3uCdL/yF+enUcw6JBYxXm6leyCxdtdip/GwfF44K8KYeN+z1yHN/vOCyp34bZgYk96XAM89WD/iuqnDmqJdzjzlxsJP0SZq5yufxdU/jYPkp2A454xXlNMcp0VJsBxb+iuEbupUMngJyKMgdcmuxi8BbnVFmrRivNMpOE/aHYTLpS3T7tSn4Bl1+fvg+LmBycpWWXr0jvGJxVHuqsK7sm7i7+51jnn7d6qVPTgDEexsJP7uy , "sources": [{"url": "https://www.docdocdoc.co.kr/news/articleView.html?idxno=3044452", "verified": "원문 직접 확인"}, {"url": "https://www.medipana.com/news/articleView.html?idxno=421423", "verified": "기사 목록에서 제목과 날짜만 확인(본문 미열람)"}], "verification_note": "토론회 발언을 정리한 것이며 정부나 국회의 공식 결정은 아닙니다. 복지부 답변은 기사 인용 기준입니다.", "image_concept": "A hospital crash cart with a closed folder taped shut on top, standing in an empty corridor.", "img": "data:image/webp;base64,UklGRg4tAABXRUJQVlA4IAItAAAwzgGdASqwBCADPpFIoEwlr6aqonJIwfASCWdu/7S74f/p59VlCwXpv2vlG3e9Hdy6SzRrH9S3/j7UZ7fnCucPsnr3fvPUL5jyj+aPzt7cP99+o/9j+KXmBeZP0n+YD9tPWZ/3vqe/sXqL/1XqQfQW6aX+/ZNXO28b7i6def/Eh8W7i5NlVqaAfjA6bZ85DTBzycgqc2u4Dnk5BU5tdwHPJyCpza7gOeTkFTm13Ac8nIFmHYlLCjn7R0xn+nBMt0xZjXcBzyccbGu3lyyuLVuTkFT1rcLK2O3ympeyRgRI07JSK1J1xatycgqc2uyUpe7Q5s/pyZwrXl8gqetcd5yKqg28D5mERgty6uS1QVObXctaRruA54LcWq7MoaBzycdJqRh+QXZ25yTaHNruCmc3cnmup4hJVkB6/kFTmz/Dcgy+QXnnk5BU5tdwC2yn5kxsbnLQBzybtp55h97T042hM6ezYn+Hxa7gOeSRjW3ZlS356vqc2u3lRmyc+5VTnAoOMIFho5uGZwUxOufw+ZRsJuqbHpbwWm2ZTeE9PXDL5BU4e7e3id+XmNdwIyxbWblBD+w/yGFTDNXnYqc2u4Ee3cnFDBoxWYe/LXuKX6XwBYnO3XEH13Ac8kidvS805aoKnOEBVBA0aasdP4pDoZbPLA8aTUzcMezHeQ0whWfuDUxyUtdFVLXcBzye/klSc8WmDnk3U2nyBap+4Zq1lh9dkpS+QVObzKvST0KU19uRqQEFTmd5jph2IMr8I4tdy2cujJ/ix4U2pl6rhXPbPXm13N3FFnrTT+ebWpvSfqMJ8rhoFKZwUxTOGqOu3IszNE7QFNmhW9crPlLDMdVvmt2el88oJlTm15O7ogSrfrm1pgKrzEM86AI5vny+RkOUTg3UZpg5+29fNRThoKmyS9bbtVeuc1Wu8ThNXSXSG3bUg7hdQCgN5aLCjkAn5wHPjl5MnU0UegRu14AsJ18ZcJE5DUZRmiJQ61614PKlmOsh0QmcbHfv7eW5bluW5bluW5bluW5bluW5bluW5EtQ5cc8s51BTahrdJHy7PNgE/2h9F5QH8zVi5poFsp6JLFsi3yC888nHJ8WreOXk0hL2DOM6MvWAhHc/P+s7SkLpHvnwJgO1rolI0JUW6FSB4KP2bdr2dN6q6+ktoR2N1NRa2vXbJYoinkadIX8lz6Q25xH8vOayJr9/eSDeMWGlNVcxatfv+4RXs9uFUjCrANF9kYojlHVMcLUyu4Yybl5KlGNdwHP23r5DW34WKqvNKGuBRdftz4WPl1CMpgbpsovOAToqTUPR7L6R7RP1EHljX72BgA/CTxDpqJiLE9o8uQInT/NLIiynPw0+q3dUyc4Klq1MUTp9N57E0uJaYMIVNgcdr13vbH3iVZlzLRlCdbrK1USa4mx2doDnk5Aqt//hhw6aKR7ugfpd+Nu1YMkwi2iqwVLE6e06MGclZKuD8hssnrKpvvCO/1NOPrEc/YHOpyFnbBrUDhfLsO3FqVPD1x62S/FK (NAION)’ 경고 추가 명령… 발생률 10만 인년당 6.4건 대 3.8건", "short": "FDA GLP-1 시신경 경고", "date": "2026-11-09", "scope": "글로벌", "entity": "미국 FDA / 노보 노디스크·일라이 릴리 등 GLP-1 제조사", "what_changed": "FDA가 11월 9일(현지시간) 미국에서 허가된 GLP-1 수용체 작용제 12개 제품 전체에 대해 허가사항 ‘경고 및 주의사항’에 비동맥 전방 허혈성 시신경병증(NAION) 위험을 추가하도록 계열 전체 안전성 표시 변경을 명령했습니다. FDA는 임상시험 126건과 투여 환자 7만8,217명의 자료를 분석했고, NAION 발생률은 투여군 10만 인년당 6.4건, 비교군 3.8건이었다고 보도됐습니다. 오젬픽·위고비·마운자로·젭바운드가 포함됩니다.", "why_matters": "EU·영국·캐나다 등은 개별 제품 라벨에 반영했지만 미국은 평가 중이라는 입장이었습니다. 계열 전체 경고가 의무화되면서 시력 손상 관련 소송에 영향을 줄 수 있고, 식약처가 이틀 만에 후속 조치를 내는 등 각국 규제기관의 대응으로 이어지고 있습니다.", "strategy": "GLP-1 개발사와 국내 후발 주자는 안과 이상반응 모니터링과 위해성 관리계획을 미리 보강해야 합니다. FDA는 편익이 위험보다 크다는 입장을 유지했으므로 적응증 제한으로 받아들일 필요는 없지만, 처방 현장에는 급성 시력 저하 시 즉시 투여를 중단하도록 안내하는 절차가 필요합니다.", "evidence_type": "규제기관 결정", "sources": [{"url": "https://www.biospace.com/fda/fda-orders-class-wide-glp-1-label-update-to-include-potential-risk-for-rare-eye-disease", "verified": "검색 결과 스니펫과 BioSpace 목록 페이지만 확인(본문 미열람)"}, {"url": "https://www.cnn.com/2026/11/09/health/glp1-vision-loss-fda-warning", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}, {"url": "https://view.asiae.co.kr/article/2026111108180477982", "verified": "원문 직접 확인(126건·7만8,217명·6.4건 대 3.8건 수치 확인)"}], "verification_note": "FDA 원문(Drug Safety Communication)은 직접 열람하지 못했습니다. 12개 제품, 11월 9일 발표, 발생률 수치는 BioSpace·CNN 스니펫과 아시아경제 원문으로 교차 확인했습니다.", "image_concept": "A single pair of eyeglasses resting on a medicine injection pen, one lens subtly clouded.", "img": "data:image/webp;base64,UklGRkQ/AABXRUJQVlA4IDg/AACw4wGdASqwBCADPpFIoEylpCowodK4qhASCWdu3Pg8+f66MSEs7TnFqwMlQ/0Yi7wXvLkJ1fcpXpxgL99/3dhD/zNaz6z3mlOf6T++9/yGnyf+G/H34Orb/cf7J/gv1y+g/9R5Y/Gf7z9bvXB81/ff0d7Uv+J+rfuX/SX63/AH/FP8F6nP+x+zvu8/d/1B/uJ62n/V9Wf+H9SL/B+nt6nfoXeXr+6/xC/3L/18Hn01/MT0ztOO+f81uR+0H5m6hHivhZd98xrvR6A35HnV/L+hz0x8M2gP/MvSG/4PNR9jhXZ+XBmyRcf6zMWFx/rMxYXH+szFhcf6zMWFx/rMxYXH+szJRQGHMOtVCQkFZIweA+hy4JbuaolciOXCz2l93ctYtHlwZsp0s8c1Scs1auWcfSVJetuDHjvrVL35yRG4PChskRONWs949Zl1V3qAavrfVz35cLOUDNki55YERgP AA=="}, {"id": "bio-maxcyte-akron", "cat": "bio", "alt": "실험 기기와 시약병 상자가 퍼즐처럼 맞물리는 모습을 그린 미니멀 일러스트", "title": "맥스사이트, 세포치료 GMP 시약사 아크론바이오프로덕츠를 총 1억5,180만달러(종결 시 현금 1억500만달러)에 인수 계약… 연말 전 종결 목표", "short": "맥스사이트 아크론 인수", "date": "2026-11-10", "scope": "글로벌", "entity": "맥스사이트(MaxCyte, 나스닥 MXCT) / 아크론바이오프로덕츠 / 아크라인 인베스트먼트", "what_changed": "맥스사이트는 11월 9일 아크라인 계열이 보유한 아크론바이오프로덕츠 지분 전량을 인수하는 계약을 체결하고 10일 발표했습니다. 총 대가는 1억5,180만달러입니다. 종결 시 현금 1억500만달러(관례적 조정 대상)를 지급하고, 보통주 20,639,733주(11월 9일 종가 기준 약 2,680만달러, 6개월 보호예수)를 발행하며, 2028년 1월과 2029년 1월에 1,000만달러씩 확정 이연금을 지급합니다. 인수 자금은 미드캡파이낸셜의 최대 7,500만달러 신용한도로 조달합니다. 아크론은 2026년 매출 약 2,800만달러, EBITDA 700만~800만달러를 낼 것으로 예상됩니다.", "why_matters": "비바이러스 전기천공 장비 회사가 사이토카인, 성장인자, 혈장 유래 시약 같은 GMP 소모품을 품어 반복 매출과 상업화 단계 매출을 늘리고 바이러스 기반 체외 세포치료 시장으로 넓힙니다. 회사는 합산 제품이 승인 치료제 5개와 100개 이상의 임상 프로그램에 쓰인다고 밝혔습니다.", "strategy": "세포치료 공급망 소모품을 통합해 교차판매를 노리고 합산 연간 현금 소진을 2027년 1,000만달러 미만으로 줄여 수익성에 도달하겠다는 계획입니다. HSR 대기기간 종료와 나스닥 상장 승인을 거쳐 2026년 말 이전 종결을 목표로 합니다. 국내 CDMO·세포치료 소재 기업도 소모품 반복 매출 확보 전략의 참고 사례로 삼을 만합니다.", "evidence_type": "거래-계약", "sources": [{"url": "https://www.sec.gov/Archives/edgar/data/0001287098/000110465926124829/tm2629420d1_ex99-2.htm", "verified": "SEC 8-K 첨부 보도자료(Exhibit 99.2) 원문 직접 확인"}, {"url": "https://www.sec.gov/Archives/edgar/data/0001287098/000110465926124829/tm2629420d1_8k.htm", "verified": "SEC 8-K 본문의 대가 구조와 종결 조건 원문 직접 확인"}], "verification_note": "아직 종결되지 않은 계약입니다. 총액은 주식 가치를 11월 9일 종가로 계산한 금액이라 주가에 따라 달라질 수 있습니다. 아크론의 매출과 EBITDA는 회사 전망치입니다.", "image_concept": "A laboratory instrument snapping together with a box of small reagent vials like two interlocking puzzle pieces.", "img": "data:image/webp;base64,UklGRropAABXRUJQVlA4IK4pAAAQhwGdASqwBCADPpFIoUylpCqoIVGokVASCWlu/9Q79f1SGGDCcL72mdGnhzc/aujXX+mbWDXFPd/S/xXP+9s6dzDP1v+cPaF/uP+5/Wfdx+a/+R/ef3////2B+Yv/u+uL93PUH/TP9n62v+99V/+w9QD/b9Uf6G/nP+sJ/c9//6b4mf4P4BD+sv/7TbE/972UYxPOXHcdh8ZTFeFLeFLeFOxl7eMV4Ut4Ut4zGbC3hS3hS3hTINy5uZ/6E5UMZPKkwbkSyNgIqdHJNgwOdZbF7IDi/a6HoFxe51db 장이 당 사슬을 단백질 구슬에 붙이는 유리 플라스크를 그린 미니멀 일러스트", "title": "아스트라제네카, 3년간 독점 협력하던 세균 접합백신 플랫폼사 옴니오스 완전 인수… 금액 비공개, 감염질환 사업부 편입", "short": "AZ 옴니오스 인수", "date": "2026-11-10", "scope": "글로벌", "entity": "아스트라제네카 / 옴니오스(Omniose)", "what_changed": "옴니오스는 11월 10일(현지시간) 아스트라제네카에 인수됐다고 발표했습니다. 옴니오스는 아스트라제네카의 완전 자회사가 되어 감염질환 사업부에 편입됩니다. 두 회사는 2024년 1월부터 약 3년간 독점 연구 협력을 해 왔습니다. 인수 금액은 공개하지 않았습니다.", "why_matters": "옴니오스는 다당류 항원, 개량 운반 단백질, 결합 효소를 대장균 세포 하나에서 함께 생산하는 바이오컨쥬게이션 플랫폼을 갖고 있어 여러 단계 화학 공정이 필요한 기존 접합백신 제조를 대체할 수 있습니다. 코로나19 백신 사업을 축소했던 아스트라제네카가 세균 감염 예방 백신으로 다시 들어가는 신호입니다.", "strategy": "협력 파트너를 인수해 플랫폼과 인력을 내재화하는 단계적 M&A입니다. 폐렴구균 등 접합백신 시장의 제조 효율과 새 항원 조합 경쟁력을 노리는 것으로 보이며, 국내 백신 기업(SK바이오사이언스 등)의 폐렴구균 백신 경쟁 구도에도 장기적으로 영향을 줄 수 있습니다. 옴니오스 파이프라인은 전임상 단계입니다.", "evidence_type": "거래-완료", "sources": [{"url": "https://www.biopharminternational.com/view/astrazeneca-acquires-omniose-bioconjugate-vaccine-platform", "verified": "원문 직접 확인(발표일, 비공개 조건, 플랫폼 설명)"}, {"url": "https://www.medipana.com/news/articleView.html?idxno=421472", "verified": "원문 직접 확인"}, {"url": "https://www.businesswire.com/news/home/20261110984674/en/Omniose-Announces-Its-Acquisition-by-AstraZeneca", "verified": "보도자료 원문 접근 차단(403), 다른 기사 인용으로 게시 사실만 확인"}, {"url": "https://www.fiercebiotech.com/biotech/astrazeneca-buys-omniose-bacterial-vaccine-technology", "verified": "검색 결과 스니펫만 확인(본문 미열람)"}], "verification_note": "인수 금액과 조건은 공개되지 않았습니다. 발표 주체는 옴니오스이며 아스트라제네카 자체 보도자료는 확인하지 못했습니다. 인수 완료로 보도됐습니다.", "image_concept": "A single glass flask containing a tiny factory assembling sugar chains onto protein beads.", "img": "data:image/webp;base64,UklGRvIbAABXRUJQVlA4IOYbAACQXwGdASqwBCADPpFIoE0lo6oooJIoaUASCWlu/9W7i3dxKc8JICFG0AQnS7fRnx7zoaW5lqgh838eP2BOhz5hf2+9Vr0W/4/0YOpf9ADpfP8Pk20ac2+GRy4FvkSlxgLjrAExTFxgLjrAExTFxgLjrAExTFxgLjrAExTFxgLjXu2snKHO0IXL+s0yJs+csmMBzSlTGYxhNQgTpi4wCPQoWYqYNTFymZKFxmK6moCYq9JimLjAXHWAJimq66YuMBecsATFMAdATImttM7qagJimLjAXHVtrAXHV+jn11NG1gNQEAJimLjAXAYttM6YNTFxgLjrAExTFxgLtV7hwRbPONrMV1NQExHRNQExTFx const CATS = {
  ai:  {name:"의료 AI·진단·임상의사결정", short:"의료 AI", en:"Medical AI"},
  dh:  {name:"디지털 헬스·원격의료·병원 AX", short:"디지털 헬스", en:"Digital Health"},
  reg: {name:"규제·정책·인허가", short:"규제·정책", en:"Regulation"},
  bio: {name:"바이오·기업 전략·투자·M&A", short:"바이오·투자", en:"Bio & Deals"}
};
const EV_LIST = ["공식 발표","규제기관 결정","학술 성과(동료심사)","공시","기업 주장","프리뷰/계획","거래-계약","거래-옵션","거래-완료","전문가 대담/추정"];
const items = DATA.items.map((it,i)=>({...it, idx:i}));
const byId = Object.fromEntries(items.map(i=>[i.id,i]));
const ISS = DATA.issue;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = d => { const [y,m,dd]=d.split("-"); return `${y}년 ${+m}월 ${+dd}일`; };
const wk = d => "일월화수목금토"[new Date(d+"T00:00:00").getDay()];
const link = it => `#/article/${it.id}`;
const sortD = a => [...a].sort((x,y)=>y.date.localeCompare(x.date)||x.idx-y.idx);
const pic = (it, extra="") => `<span class="pic"${extra}><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}" decoding="async"></span>`;
const lbl = it => `<div class="lbl"><a href="#/section/${it.cat}">${esc(CATS[it.cat].short)}</a><span class="dot">·</span><a href="#/scope/${encodeURIComponent(it.scope)}">${esc(it.scope)}</a></div>`;
const evB = it => `<span class="ev ${/기업 주장|프리뷰|추정|대담/.test(it.evidence_type)?"claim":""}">${esc(it.evidence_type)}</span>`;
const dateEl = it => `<time class="date" datetime="${it.date}">${fmt(it.date)}</time>`;

/* chrome */
const NAV = [["","홈"],...Object.entries(CATS).map(([k,v])=>["section/"+k,v.short]),["scope/국내","국내"],["scope/글로벌","글로벌"],["insight","종합 인사이트"],["archive","아카이브"],["about","편집 원칙"]];
function setNav(a){ $("#nav").innerHTML = NAV.map(([h,t])=>`<li><a href="#/${h}" ${a===h?'aria-current="page"':""}>${t}</a></li>`).join(""); }
$("#sub").textContent = `제${ISS.no}호 · ${fmt(ISS.published)}`;
$("#fnav").innerHTML = NAV.map(([h,t])=>`<a href="#/${h}">${t}</a>`).join("");
$("#copy").textContent = `제${ISS.no}호 · 수집 기준일 ${fmt(ISS.target)}(${wk(ISS.target)}) · 발행 ${fmt(ISS.published)} · 엄선 ${items.length}건`;

/* views */
function card(it){
  return `<article class="card"><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3><div class="m">${dateEl(it)}${evB(it)}</div><p>${esc(it.what_changed)}</p></article>`;
}
function synth(){
  const s = ISS.synthesis, refs = ids => (ids||[]).map(id=>byId[id]).filter(Boolean).map(it=>`<a href="${link(it)}">${esc(it.short||it.title)}</a>`).join(" · ");
  const col = (t,arr)=>`<div><h3>${t}</h3><ol>${arr.map(x=>`<li><b>${esc(x.head)}</b>${esc(x.body)}${x.refs?.length?`<div class="refs">관련 · ${refs(x.refs)}</div>`:""}</li>`).join("")}</ol></div>`;
  return `<div class="syn">${col("핵심 트렌드",s.trends)}${col("주목할 신호",s.signals)}${col("우선 과제",s.priorities)}</div>`;
}
function viewHome(){
  setNav("");
  const lead = byId[ISS.lead], side = ISS.side.map(id=>byId[id]);
  const latest = sortD(items.filter(i=>i.id!==lead.id && !ISS.side.includes(i.id))).slice(0,5);
  let h = `<section class="hero" aria-label="주요 기사">
   <div class="side" aria-label="보조 기사">${side.map(it=>`<article><a href="${link(it)}" tabindex="-1" aria-hidden="true">${pic(it)}</a>${lbl(it)}<h3 class="t"><a href="${link(it)}">${esc(it.title)}</a></h3>${dateEl(it)}</article>`).join("")}</div>
   <div class="c lead"><a href="${link(lead)}" tabindex="-1" aria-hidden="true">${pic(lead)}</a><span class="lbl">${esc(CATS[lead.cat].short)} · ${esc(lead.scope)}</span><h2 class="t"><a href="${link(lead)}">${esc(lead.title)}</a></h2><p>${esc(lead.what_changed)}</p><div class="by">${dateEl(lead)} · <b>${esc(lead.entity)}</b> · ${esc(lead.evidence_type)}</div></div>
   <aside class="latest" aria-labelledby="h-latest"><h2 id="h-latest">LATEST</h2>${latest.map(it=>`<a class="row" href="${link(it)}"><span><b>${esc(it.title)}</b>${dateEl(it)}</span>${pic(it)}</a>`).join("")}</aside>
  </section>`;
  for(const [k,v] of Object.entries(CATS)){
    const list = sortD(items.filter(i=>i.cat===k)); if(!list.length) continue;
    h += `<section class="sec" aria-labelledby="h-${k}"><div class="sh"><h2 id="h-${k}">${esc(v.en)}<span>${esc(v.name)}</span></h2><a href="#/section/${k}">전체 보기 »</a></div><div class="grid">${list.slice(0,8).map(card).join("")}</div></section>`;
  }
  h += `<section class="sec" aria-labelledby="h-syn"><div class="sh"><h2 id="h-syn">Insight<span>이번 호 종합 — 트렌드 · 신호 · 우선 과제</span></h2><a href="#/insight">자세히 »</a></div>${synth()}</section>`;
  return h;
}
const chips = a => `<div class="chips" role="group" aria-label="분야 필터">${[["all","전체"],...Object.entries(CATS).map(([k,v])=>[k,v.short])].map(([k,t])=>`<button class="chip" type="button" data-f="${k}" aria-pressed="${a===k}">${t}</button>`).join("")}</div>`;
function gridOrEmpty(list,q){
  if(!list.length) return `<p class="empty">조건에 맞는 기사가 없습니다.</p>`;
  if(!q) return `<div class="grid">${list.map(card).join("")}</div>`;
  const t = q.split(/\s+/).filter(Boolean).map(x=>esc(x).replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));
  const re = new RegExp("("+t.join("|")+")","gi");
  return `<div class="grid">${list.map(it=>card(it).replace(/(<h3 class="t"><a [^>]+>)([^<]*)/,(m,a,b)=>a+b.replace(re,"<mark>$1</mark>"))).join("")}</div>`;
}
let state = {q:"", f:"all"};
function viewSection(k){ setNav("section/"+k); const l=sortD(items.filter(i=>i.cat===k)); return `<div class="page"><div class="ph"><span class="lbl">${esc(CATS[k].en)}</span><h1>${esc(CATS[k].name)}</h1><p>${l.length}건</p></div>${chips(k)}${gridOrEmpty(l)}</div>`; }
function viewScope(sc){ setNav("scope/"+sc); const l=sortD(items.filter(i=>i.scope===sc&&(state.f==="all"||i.cat===state.f))); return `<div class="page"><div class="ph"><span class="lbl">Scope</span><h1>${esc(sc)} 기사</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l)}</div>`; }
function viewSearch(q){
  setNav("search");
  const terms=q.toLowerCase().split(/\s+/).filter(Boolean);
  const l=sortD(items.filter(it=>{ if(state.f!=="all"&&it.cat!==state.f) return false; const hay=[it.title,it.entity,it.what_changed,it.why_matters,it.strategy,it.evidence_type,it.scope,CATS[it.cat].name].join(" ").toLowerCase(); return terms.every(t=>hay.includes(t)); }));
  return `<div class="page"><div class="ph"><span class="lbl">Search</span><h1>${q?`‘${esc(q)}’ 검색 결과`:"전체 기사"}</h1><p role="status">${l.length}건</p></div>${chips(state.f)}${gridOrEmpty(l,q)}</div>`;
}
function viewArticle(id){
  const it=byId[id]; if(!it) return `<div class="page"><p class="empty">기사를 찾을 수 없습니다. <a href="#/" style="color:var(--blue)">홈으로</a></p></div>`;
  setNav("section/"+it.cat);
  const prev=items[it.idx-1], next=items[it.idx+1];
  const rel=sortD(items.filter(i=>i.cat===it.cat&&i.id!==it.id)).slice(0,4);
  return `<div class="page"><article class="post">
   <div class="head">${lbl(it)}<h1>${esc(it.title)}</h1><div class="by">${dateEl(it)}<span>·</span><b>${esc(it.entity)}</b>${evB(it)}</div></div>
   <div class="pic cover"><img src="${it.img}" alt="${esc("삽화: "+(it.alt||it.title))}"></div>
   <div class="cap">Codex로 만든 미니멀·개념 삽화입니다. 실제 사진이 아닙니다.</div>
   <dl class="facts"><div><dt>발표·사건일</dt><dd>${fmt(it.date)} (${wk(it.date)})</dd></div><div><dt>기업·기관</dt><dd>${esc(it.entity)}</dd></div><div><dt>범위</dt><dd>${esc(it.scope)}</dd></div><div><dt>근거 유형</dt><dd>${esc(it.evidence_type)}</dd></div></dl>
   <h2>무엇이 바뀌었나</h2><p>${esc(it.what_changed)}</p>
   <h2>왜 중요한가</h2><p>${esc(it.why_matters)}</p>
   <h2>전략 시사점</h2><p class="pull">${esc(it.strategy)}</p>
   <h2>확인한 출처와 확인 범위</h2><ul class="sources">${(it.sources||[]).map(s=>`<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a><span class="scope">확인 범위: ${esc(s.verified)}</span></li>`).join("")}</ul>
   ${it.verification_note?`<h2>검증 메모</h2><p class="note">${esc(it.verification_note)}</p>`:""}
   <nav class="pn" aria-label="이전·다음 기사">${prev?`<a href="${link(prev)}"><small>← 이전 기사</small>${esc(prev.title)}</a>`:"<span></span>"}${next?`<a class="nx" href="${link(next)}"><small>다음 기사 →</small>${esc(next.title)}</a>`:"<span></span>"}</nav>
  </article>
  ${rel.length?`<section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>Related<span>같은 분야 다른 기사</span></h2><a href="#/section/${it.cat}">전체 보기 »</a></div><div class="grid">${rel.map(card).join("")}</div></section>`:""}</div>`;
}
function viewInsight(){ setNav("insight"); return `<div class="page"><div class="ph"><span class="lbl">Insight</span><h1>이번 호 종합</h1><p>이번 호 ${items.length}건을 근거로 정리한 핵심 트렌드 · 주목할 신호 · 우선 과제</p></div>${synth()}</div>`; }
function viewArchive(){
  setNav("archive");
  return `<div class="page"><div class="ph"><span class="lbl">Archive</span><h1>아카이브</h1><p>발행 호 목록</p></div>
  <ul class="archive">${DATA.archive.map(a=>`<li><div><b>${esc(a.label)}</b><div class="date">발행 ${fmt(a.date)} · ${a.count}건${a.current?" · 현재 호":""}</div>${a.note?`<div class="date">${esc(a.note)}</div>`:""}</div>${a.current?`<a class="go" href="#/search/">이번 호 전체 기사 »</a>`:a.file?`<a class="go" href="${esc(a.file)}">파일 열기 »</a>`:""}</li>`).join("")}</ul>
  <section class="sec" style="padding-left:0;padding-right:0"><div class="sh"><h2>All Stories<span>이번 호 전체 (날짜순)</span></h2></div><div class="grid">${sortD(items).map(card).join("")}</div></section></div>`;
}
function viewAbout(){
  setNav("about");
  return `<div class="page"><article class="post"><div class="head"><span class="lbl">About</span><h1>편집 원칙</h1></div>
  <p>공식 발표·공시·규제기관·학술자료를 우선 확인했고, 기업 주장·프리뷰·거래 단계(계약/옵션/완료)·전문가 추정을 ‘근거 유형’으로 구분했습니다. 본문을 직접 열람하지 못한 출처는 각 기사의 ‘확인 범위’에 그렇게 적었고, 미확인 출처는 검증 메모에 명시했습니다.</p>
  <p>${esc(ISS.scope_note||"")}</p>
  <h2>근거 유형</h2><p>${EV_LIST.map(t=>`<span class="ev" style="display:inline-block;margin:0 6px 6px 0">${t}</span>`).join("")}</p>
  <h2>삽화</h2><p>모든 삽화는 Codex(OpenAI 이미지 생성 도구)로 기사마다 만든 ‘Minimalist &amp; Conceptual’ 스타일의 개념 일러스트입니다. 실제 인물·현장·제품 사진이 아니며, 문자와 로고를 넣지 않도록 생성했습니다.</p></article></div>`;
}

/* router */
function render(){
  const h=location.hash.replace(/^#\/?/,""); const [route,...rest]=h.split("/"); const arg=decodeURIComponent(rest.join("/")||"");
  state.f="all";
  let html;
  if(route==="article") html=viewArticle(arg);
  else if(route==="section"&&CATS[arg]) html=viewSection(arg);
  else if(route==="scope"&&(arg==="국내"||arg==="글로벌")) html=viewScope(arg);
  else if(route==="search"){ state.q=arg; html=viewSearch(arg); }
  else if(route==="insight") html=viewInsight();
  else if(route==="archive") html=viewArchive();
  else if(route==="about") html=viewAbout();
  else html=viewHome();
  const m=$("#main"); m.innerHTML=html;
  document.title=(route==="article"&&byId[arg]?byId[arg].title+" — ":"")+"My Healthcare & Bio & Medical Brief";
  closeMenu();
  if(route){ window.scrollTo(0,0); m.focus({preventScroll:true}); }
}
document.addEventListener("click",e=>{
  const c=e.target.closest(".chip"); if(!c) return;
  const f=c.dataset.f, h=location.hash;
  if(/^#\/section\//.test(h)){ location.hash=f==="all"?"#/search/":"#/section/"+f; return; }
  state.f=f; const parts=h.replace(/^#\/?/,"").split("/"); const arg=decodeURIComponent(parts.slice(1).join("/"));
  $("#main").innerHTML = parts[0]==="scope" ? viewScope(arg) : viewSearch(state.q);
});
window.addEventListener("hashchange",render);
const nav=$("#mainnav"), menuBtn=$("#menuBtn");
function closeMenu(){ nav.classList.add("collapsed"); menuBtn.setAttribute("aria-expanded","false"); }
menuBtn.onclick=()=>{ const open=nav.classList.toggle("collapsed")===false; menuBtn.setAttribute("aria-expanded",String(open)); menuBtn.setAttribute("aria-label",open?"메뉴 닫기":"메뉴 열기"); };
const sb=$("#searchbar"), sBtn=$("#searchBtn");
sBtn.onclick=()=>{ sb.hidden=!sb.hidden; sBtn.setAttribute("aria-expanded",String(!sb.hidden)); if(!sb.hidden) $("#q").focus(); };
sb.onsubmit=e=>{ e.preventDefault(); location.hash="#/search/"+encodeURIComponent($("#q").value.trim()); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!sb.hidden){ sb.hidden=true; sBtn.setAttribute("aria-expanded","false"); sBtn.focus(); } });

/* theme */
const root=document.documentElement;
const cur=()=>root.dataset.theme||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
function paintTheme(){ const d=cur()==="dark"; $("#themeBtn").setAttribute("aria-pressed",String(d)); $("#themeBtn").setAttribute("aria-label",d?"라이트 모드로 전환":"다크 모드로 전환"); }
try{ const s=localStorage.getItem("mhbm-theme"); if(s) root.dataset.theme=s; }catch(e){}
$("#themeBtn").onclick=()=>{ const n=cur()==="dark"?"light":"dark"; root.dataset.theme=n; try{localStorage.setItem("mhbm-theme",n)}catch(e){} paintTheme(); };
paintTheme();
render();

/* download (only inside claude.ai with the downloads capability) */
(async()=>{
  if(!window.claude||typeof window.claude.use!=="function") return;
  let dl=null; try{ dl=await window.claude.use("downloads"); }catch(e){}
  if(!dl) return;
  const btn=$("#dlBtn"), st=$("#dlStatus"), label=btn.textContent; btn.hidden=false; $("#insBtn").hidden=true;
  btn.onclick=async()=>{
    btn.disabled=true; btn.textContent="준비 중…";
    try{
      const res=await fetch(DATA.download_path); if(!res.ok) throw {code:"unavailable"};
      await dl.save({filename:DATA.download_name, data:await res.blob()});
      st.textContent="다운로드를 시작했습니다."; btn.textContent="✓ 저장됨";
    }catch(e){
      const c=e&&e.code;
      if(c==="rate_limited") btn.textContent="잠시 후 다시";
      else if(c!=="declined"){ btn.hidden=true; $("#insBtn").hidden=false; st.textContent="이 화면에서는 다운로드를 사용할 수 없습니다."; return; }
    }finally{ btn.disabled=false; setTimeout(()=>{ if(!btn.hidden) btn.textContent=label; },2500); }
  };
})();
</script>
